name: Next.js site

# Pull requests: build and verify only.
# Push to main (every merge): build, verify, then deploy to GitHub Pages.
# workflow_dispatch on main: manual redeploy of the current main (same jobs).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time. A newer push to a PR cancels its older run; on main runs are never cancelled
# mid-way (a newer one waits, and deploys keep their order through the "pages" group below).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and verify next-app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run verify:banks
      - run: npm run verify:content
      - run: npm run build
      - run: npm run verify:games
      - run: npm run audit:out

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5
        with:
          path: next-app/out
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
