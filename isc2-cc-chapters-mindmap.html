let current = 0;
const spineList = document.getElementById('spineList');
const page = document.getElementById('page');
const main = document.getElementById('main');

function buildSpine(){
  chapters.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'spine-item';
    btn.dataset.index = i;
    btn.innerHTML = `
      <span class="num">${String(i+1).padStart(2,'0')}</span>
      <span class="label">
        ${c.en}
        <span class="th">${c.th}</span>
      </span>
      <span class="domain-tag">${c.domainCode}</span>
    `;
    btn.addEventListener('click', () => render(i));
    spineList.appendChild(btn);
  });
}

function pointsHtml(points){
  return points.map(p => `
    <div class="prow">
      <span class="term">${p.t}</span><span class="psep">:</span>
      <span class="desc">${p.d}</span>
    </div>
  `).join('');
}

function render(i){
  try {
    current = i;
    const c = chapters[i];
    if(!c) throw new Error("Chapter " + (i+1) + " not found.");

    document.querySelectorAll('.spine-item').forEach((el, idx) => {
      const isActive = idx === i;
      el.classList.toggle('active', isActive);
      if(isActive && window.innerWidth <= 768){
        el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
    });

    const topicsHtml = c.topics.map(t => `
      <div class="topic-card">
        <h3><span class="ic-glyph"></span>${t.h}</h3>
        <div class="plist">${pointsHtml(t.points)}</div>
      </div>
    `).join('');

    const efHtml = c.examFocus.map(e => `
      <div class="ef-item">
        <div class="ef-head"><span class="ef-badge">${e.badge}</span><span class="ef-title">${e.title}</span></div>
        <div class="ef-body">${e.body}</div>
      </div>
    `).join('');

    const cheatHtml = `<ul>${c.cheat.map(x => `<li>${x}</li>`).join('')}</ul>`;

    page.style.setProperty('--accent-c', c.color);
    page.innerHTML = `
      <div class="hero-meta-bar">
        <div class="domain-meta-tag">
          <span class="tag-badge">${c.domainCode}</span>
          <span>${c.domainName}</span>
          <span class="tag-weight">สัดส่วนข้อสอบ: ${c.domainWeight}</span>
        </div>
      </div>

      <div class="hero">
        <div class="hero-num-badge">${String(i+1).padStart(2,'0')}</div>
        <div class="hero-titles">
          <h2><span class="hero-icon">${chapterIcons[i]}</span> ${c.en}</h2>
          <div class="th-title">บทที่ ${i+1}: ${c.th}</div>
        </div>
      </div>
      <div class="hero-tagline">${c.tagline}</div>

      <div class="section-label">Mind Map — <span class="th-label">เนื้อหาแต่ละหัวข้อ</span></div>
      <div class="topic-grid">${topicsHtml}</div>

      <div class="section-label">Exam Focus — <span class="th-label">ประเด็นสำคัญสำหรับข้อสอบ</span></div>
      <div class="exam-focus">${efHtml}</div>

      <div class="section-label">Cheat Sheet — <span class="th-label">สรุปสาระสำคัญแบบเร็ว</span></div>
      <div class="cheat-box">${cheatHtml}</div>

      <div class="footnav">
        <button class="prev" ${i===0 ? 'disabled':''}>&larr; ก่อนหน้า</button>
        <button class="next" ${i===chapters.length-1 ? 'disabled':''}>ถัดไป &rarr;</button>
      </div>
    `;

    document.documentElement.style.setProperty('--accent-c', c.color);

    const prevBtn = page.querySelector('.footnav .prev');
    const nextBtn = page.querySelector('.footnav .next');
    if(prevBtn) prevBtn.addEventListener('click', () => { if(current>0) render(current-1); });
    if(nextBtn) nextBtn.addEventListener('click', () => { if(current<chapters.length-1) render(current+1); });

    main.scrollTo({top:0, behavior:'instant'});
  } catch(err) {
    console.error("Render error:", err);
    page.innerHTML = `
      <div class="error-boundary">
        <h3>เกิดข้อผิดพลาดในการโหลดเนื้อหาบทเรียน</h3>
        <p>ไม่สามารถประมวลผลบทที่ ${i+1} ได้ในขณะนี้ (${err.message})</p>
        <button onclick="render(0)">กลับไปหน้าแรก (บทที่ 1)</button>
      </div>
    `;
  }
}

buildSpine();
render(0);

document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight' && current < chapters.length-1) render(current+1);
  if(e.key === 'ArrowLeft' && current > 0) render(current-1);
});
</script>
</body>
</html>
