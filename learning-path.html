<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISC2 CC Learning Path — เส้นทางเรียนเตรียมสอบ Certified in Cybersecurity</title>
<meta name="description" content="เส้นทางเรียน ISC2 CC แบบ Step-by-step ตั้งแต่เริ่มต้นจนถึงพร้อมสอบ พร้อมติดตามความก้าวหน้า">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #EFE9D9;
  --cream-2: #E4DCC4;
  --green: #1F8A4C;
  --green2: #136636;
  --green-dim: rgba(31,138,76,.15);
  --pink: #F06CA8;
  --orange: #E85A1F;
  --yellow: #F5C518;
  --ink: #0F0F0F;
  --ink-2: #2A2A2A;
  --white: #FFFFFF;
  --bg: #EFE9D9;
  --bg2: #E4DCC4;
  --card: #FFFFFF;
  --card2: #F7F4EB;
  --line: #0F0F0F;
  --text: #0F0F0F;
  --muted: #4A4A4A;
  --red: #D12438;
  --shadow: 4px 4px 0 #0F0F0F;
  --radius: 0px;
  --font-display: 'Archivo Black', sans-serif;
  --font-body: 'Space Grotesk', system-ui, sans-serif;
  --font-thai: 'IBM Plex Sans Thai', 'Space Grotesk', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --d1: #1F8A4C; --d2: #E85A1F; --d3: #F06CA8; --d4: #3B82F6; --d5: #8B5CF6;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--cream); color: var(--ink); font-family: var(--font-thai); min-height: 100vh; -webkit-font-smoothing: antialiased; }

.creative-global-nav { position: sticky; top: 0; z-index: 10000; background: var(--cream); border-bottom: 3px solid var(--ink); font-family: var(--font-thai); }
.cg-nav-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 10px 18px; gap: 12px; flex-wrap: wrap; }
.cg-brand { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); font-family: var(--font-display); font-size: 15px; border: 2px solid var(--ink); background: var(--white); padding: 4px 10px; box-shadow: 3px 3px 0 var(--ink); text-transform: uppercase; }
.cg-brand .cg-badge { background: var(--yellow); color: var(--ink); padding: 1px 6px; font-size: 11px; font-family: var(--font-mono); font-weight: 800; border: 1px solid var(--ink); }
.cg-links { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cg-link { text-decoration: none; color: var(--ink); font-family: var(--font-mono); font-size: 11px; font-weight: 700; padding: 6px 12px; background: var(--white); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); transition: transform 0.1s, box-shadow 0.1s, background 0.1s; white-space: nowrap; }
.cg-link:hover { background: var(--yellow); transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--ink); }
.cg-link.active { background: var(--orange); color: var(--white); }
@media (max-width:768px) { .cg-nav-inner { padding: 8px 10px; } .cg-links { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; width: 100%; -webkit-overflow-scrolling: touch; } }

.wrap { max-width: 800px; margin: 0 auto; padding: 32px 20px 80px; }
h1 { font-family: var(--font-display); font-size: 28px; text-transform: uppercase; text-align: center; margin-bottom: 8px; }
.subtitle { text-align: center; font-size: 14px; color: var(--muted); margin-bottom: 24px; line-height: 1.6; }

.readiness { background: var(--white); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 20px 24px; margin-bottom: 32px; text-align: center; }
.readiness .label { font-family: var(--font-mono); font-size: 12px; font-weight: 800; text-transform: uppercase; margin-bottom: 8px; }
.readiness .pct { font-family: var(--font-display); font-size: 48px; color: var(--green); margin-bottom: 8px; }
.readiness .bar-track { height: 18px; background: var(--cream-2); border: 2px solid var(--ink); position: relative; overflow: hidden; }
.readiness .bar-fill { height: 100%; background: var(--green); transition: width 0.5s; }
.readiness .detail { font-family: var(--font-mono); font-size: 11px; margin-top: 8px; color: var(--muted); }

.phase { margin-bottom: 36px; }
.phase-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.phase-badge { font-family: var(--font-mono); font-size: 11px; font-weight: 800; padding: 4px 12px; border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); text-transform: uppercase; color: var(--white); }
.phase-title { font-family: var(--font-display); font-size: 20px; text-transform: uppercase; }
.phase-desc { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.phase-progress { font-family: var(--font-mono); font-size: 11px; font-weight: 700; margin-left: auto; }

.timeline { position: relative; padding-left: 40px; }
.timeline::before { content: ''; position: absolute; left: 15px; top: 0; bottom: 0; width: 3px; background: var(--ink); }

.step { position: relative; margin-bottom: 18px; }
.step-node { position: absolute; left: -40px; top: 6px; width: 28px; height: 28px; border: 3px solid var(--ink); background: var(--white); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 11px; font-weight: 800; z-index: 2; cursor: pointer; transition: background 0.2s, transform 0.1s; }
.step-node:hover { transform: scale(1.1); }
.step.done .step-node { background: var(--green); color: var(--white); }
.step.current .step-node { background: var(--yellow); animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(245,197,24,.5); } 50% { box-shadow: 0 0 0 8px rgba(245,197,24,0); } }
.step.future .step-node { background: var(--cream-2); color: var(--muted); }

.step-card { background: var(--white); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 14px 16px; display: flex; align-items: center; gap: 14px; transition: transform 0.1s, box-shadow 0.1s; cursor: pointer; }
.step-card:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--ink); }
.step.done .step-card { background: var(--green-dim); }

.step-check { width: 24px; height: 24px; border: 2px solid var(--ink); background: var(--white); flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; font-weight: 800; }
.step.done .step-check { background: var(--green); color: var(--white); }

.step-content { flex: 1; min-width: 0; }
.step-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 3px; }
.step-name { font-family: var(--font-thai); font-size: 14px; font-weight: 700; }
.step-domain-tag { font-family: var(--font-mono); font-size: 9px; font-weight: 800; padding: 1px 6px; border: 1px solid var(--ink); color: var(--white); text-transform: uppercase; }
.step-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
.step-time { font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--muted); margin-top: 3px; }
.step-link { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--green); text-decoration: none; border: 1px solid var(--green); padding: 3px 8px; white-space: nowrap; flex-shrink: 0; }
.step-link:hover { background: var(--green); color: var(--white); }

.reset-row { text-align: center; margin-top: 24px; }
.reset-btn { font-family: var(--font-mono); font-size: 12px; font-weight: 700; padding: 8px 16px; border: 2px solid var(--ink); background: var(--white); box-shadow: 2px 2px 0 var(--ink); cursor: pointer; }
.reset-btn:hover { background: var(--red); color: var(--white); }

@media (max-width: 600px) {
  h1 { font-size: 22px; }
  .readiness .pct { font-size: 36px; }
  .wrap { padding: 20px 14px 60px; }
  .timeline { padding-left: 34px; }
  .step-node { left: -34px; width: 24px; height: 24px; font-size: 10px; }
  .step-card { flex-wrap: wrap; }
  .step-link { margin-top: 6px; }
}
</style>
</head>
<body>
<nav class="creative-global-nav">
  <div class="cg-nav-inner">
    <a href="index.html" class="cg-brand"><span class="cg-badge">ISC2 CC</span><span>STUDY HUB</span></a>
    <div class="cg-links">
      <a href="index.html" class="cg-link">MIND MAP</a>

      <a href="isc2_cc_exam1NCSA_bi_no-track-50q.html" class="cg-link">50 ข้อ</a>
      <a href="flashcard.html" class="cg-link">FLASHCARD</a>
      <a href="learning-path.html" class="cg-link active">LEARNING PATH</a>

  </div>
</nav>

<div class="wrap">
  <h1>Learning Path ISC2 CC</h1>
  <p class="subtitle">เส้นทางเรียนแบบ Step-by-step ตั้งแต่เริ่มต้นจนพร้อมสอบ<br>คลิกช่องเพื่อเช็คว่าทำแล้ว ระบบบันทึกความก้าวหน้าให้อัตโนมัติ</p>

  <div class="readiness">
    <div class="label">ความพร้อมสอบ</div>
    <div class="pct" id="readinessPct">0%</div>
    <div class="bar-track"><div class="bar-fill" id="readinessFill" style="width:0%"></div></div>
    <div class="detail" id="readinessDetail">0 / 18 steps completed</div>
  </div>

  <div id="pathContainer"></div>

  <div class="reset-row">
    <button class="reset-btn" id="resetBtn">RESET PROGRESS</button>
  </div>
</div>

<script>
const PHASES = [
  {
    id: 'foundation',
    title: 'Phase 1: Foundation',
    th: 'ปูพื้นฐาน',
    color: 'var(--d1)',
    desc: 'เริ่มเรียนรู้ทีละ Domain ตั้งแต่ Domain 1-2 อ่าน ทำ Flashcard แล้วลองทำข้อสอบ',
    steps: [
      { id:'s1', name:'อ่านบทเรียน Domain 1: Security Principles', desc:'ศึกษาหลักการพื้นฐาน CIA Triad, Risk Management, Governance', time:'~45 นาที', domain:1, link:'lesson-domain-1.html', linkText:'อ่านบทเรียน' },
      { id:'s2', name:'ทำ Flashcard Domain 1', desc:'ท่องคำศัพท์สำคัญ 24 ใบ ในหมวด Security Principles', time:'~20 นาที', domain:1, link:'flashcard.html', linkText:'เปิด Flashcard' },
      { id:'s3', name:'ทำแบบทดสอบ Domain 1', desc:'ลองทำข้อสอบ Domain 1 จากชุด 1,832 ข้อ เพื่อวัดความเข้าใจ', time:'~30 นาที', domain:1, link:'1832quiz_NewExamDomainTH.html', linkText:'ทำข้อสอบ' },
      { id:'s4', name:'อ่านบทเรียน Domain 2: BC, DR & IR', desc:'ศึกษา BCP, DRP, Incident Response, Recovery strategies', time:'~40 นาที', domain:2, link:'lesson-domain-2.html', linkText:'อ่านบทเรียน' },
      { id:'s5', name:'ทำ Flashcard Domain 2', desc:'ท่องคำศัพท์ 19 ใบ BCP, RPO, RTO, Hot/Warm/Cold Site', time:'~15 นาที', domain:2, link:'flashcard.html', linkText:'เปิด Flashcard' },
      { id:'s6', name:'ทำแบบทดสอบ Domain 2', desc:'ลองทำข้อสอบ Domain 2 จากชุด 1,832 ข้อ', time:'~30 นาที', domain:2, link:'1832quiz_NewExamDomainTH.html', linkText:'ทำข้อสอบ' },
    ]
  },
  {
    id: 'deep-dive',
    title: 'Phase 2: Deep Dive',
    th: 'เจาะลึก',
    color: 'var(--d3)',
    desc: 'ต่อ Domain 3-5 แนวเดิม: อ่าน Flashcard ทำข้อสอบ',
    steps: [
      { id:'s7', name:'อ่านบทเรียน Domain 3: Access Controls', desc:'ศึกษา Authentication, Authorization, RBAC, MFA, SSO', time:'~40 นาที', domain:3, link:'lesson-domain-3.html', linkText:'อ่านบทเรียน' },
      { id:'s8', name:'ทำ Flashcard Domain 3', desc:'ท่องคำศัพท์ 19 ใบ Access Control, Identity Management', time:'~15 นาที', domain:3, link:'flashcard.html', linkText:'เปิด Flashcard' },
      { id:'s9', name:'ทำแบบทดสอบ Domain 3', desc:'ลองทำข้อสอบ Domain 3 จากชุด 1,832 ข้อ', time:'~30 นาที', domain:3, link:'1832quiz_NewExamDomainTH.html', linkText:'ทำข้อสอบ' },
      { id:'s10', name:'อ่านบทเรียน Domain 4: Network Security', desc:'ศึกษา Firewall, VPN, IDS/IPS, Zero Trust, OSI Model', time:'~45 นาที', domain:4, link:'lesson-domain-4.html', linkText:'อ่านบทเรียน' },
      { id:'s11', name:'ทำ Flashcard Domain 4', desc:'ท่องคำศัพท์ 19 ใบ Network, Protocol, Attack types', time:'~15 นาที', domain:4, link:'flashcard.html', linkText:'เปิด Flashcard' },
      { id:'s12', name:'ทำแบบทดสอบ Domain 4', desc:'ลองทำข้อสอบ Domain 4 จากชุด 1,832 ข้อ', time:'~30 นาที', domain:4, link:'1832quiz_NewExamDomainTH.html', linkText:'ทำข้อสอบ' },
      { id:'s13', name:'อ่านบทเรียน Domain 5: Security Operations', desc:'ศึกษา Encryption, SIEM, DLP, Patch/Change Management', time:'~45 นาที', domain:5, link:'lesson-domain-5.html', linkText:'อ่านบทเรียน' },
      { id:'s14', name:'ทำ Flashcard Domain 5', desc:'ท่องคำศัพท์ 19 ใบ Cryptography, Operations', time:'~15 นาที', domain:5, link:'flashcard.html', linkText:'เปิด Flashcard' },
      { id:'s15', name:'ทำแบบทดสอบ Domain 5', desc:'ลองทำข้อสอบ Domain 5 จากชุด 1,832 ข้อ', time:'~30 นาที', domain:5, link:'1832quiz_NewExamDomainTH.html', linkText:'ทำข้อสอบ' },
    ]
  },
  {
    id: 'practice',
    title: 'Phase 3: Practice',
    th: 'ฝึกซ้อม',
    color: 'var(--d4)',
    desc: 'ลุยข้อสอบรวมทุก Domain และเล่น Mini Games เสริมความจำ',
    steps: [
      { id:'s16', name:'ทำชุด 583 ข้อสองภาษา', desc:'ฝึกทำข้อสอบแบบ Thai/English เทียบเคียง คุ้นเคยคำศัพท์ในห้องสอบ', time:'~90 นาที', domain:0, link:'isc2_cc_BothThai-eng_583quiz.html', linkText:'เริ่มทำ' },
      { id:'s17', name:'ทำชุด 548 ข้อ (5 Domains)', desc:'ข้อสอบมาตรฐาน 5 โดเมนสองภาษา ทบทวนความพร้อม', time:'~90 นาที', domain:0, link:'isc2_cc_exam548_5Domain_dualTh-Eng.html', linkText:'เริ่มทำ' },
      { id:'s18', name:'เล่น Mini Games', desc:'เสริมความจำด้วยเกม: จับคู่ เรียงลำดับ ถูก/ผิด ปกป้องปราสาท', time:'~30 นาที', domain:0, link:'games.html', linkText:'เล่นเกม' },
    ]
  },
  {
    id: 'mock-exam',
    title: 'Phase 4: Mock Exam',
    th: 'จำลองสอบ',
    color: 'var(--orange)',
    desc: 'ซ้อมสอบจริง จับเวลา ทบทวน Mind Map และ Flashcard รอบสุดท้าย',
    steps: [
      { id:'s19', name:'ทำชุด 50 ข้อ สกมช. (จับเวลา)', desc:'จำลองสอบจริง 50 ข้อ สปีดเทสต์ วัดความพร้อมก่อนสอบ', time:'~30 นาที', domain:0, link:'isc2_cc_exam1NCSA_bi_no-track-50q.html', linkText:'เริ่มสอบ' },
      { id:'s20', name:'ทบทวน Mind Map 12 บท', desc:'ดู Mind Map สรุปเชื่อมโยงทุกบท ตรวจสอบจุดที่ยังไม่มั่นใจ', time:'~30 นาที', domain:0, link:'index.html', linkText:'ดู Mind Map' },
      { id:'s21', name:'ทบทวน Flashcard ที่ "ยังไม่รู้"', desc:'กลับไปดู Flashcard เฉพาะใบที่ยังไม่มั่นใจ ท่องรอบสุดท้าย', time:'~20 นาที', domain:0, link:'flashcard.html', linkText:'ทบทวน' },
    ]
  }
];

const DOMAIN_COLORS = { 0:'var(--ink)', 1:'var(--d1)', 2:'var(--d2)', 3:'var(--d3)', 4:'var(--d4)', 5:'var(--d5)' };
const DOMAIN_LABELS = { 0:'ALL', 1:'D1', 2:'D2', 3:'D3', 4:'D4', 5:'D5' };

let completed = {};
function loadProgress() { try { completed = JSON.parse(localStorage.getItem('lp_completed') || '{}'); } catch(e) { completed = {}; } }
function saveProgress() { try { localStorage.setItem('lp_completed', JSON.stringify(completed)); } catch(e) {} }

function getAllSteps() { return PHASES.flatMap(p => p.steps); }

function toggleStep(id) {
  if (completed[id]) delete completed[id]; else completed[id] = true;
  saveProgress();
  render();
}

function updateReadiness() {
  const all = getAllSteps();
  const done = all.filter(s => completed[s.id]).length;
  const pct = Math.round(done / all.length * 100);
  document.getElementById('readinessPct').textContent = pct + '%';
  document.getElementById('readinessFill').style.width = pct + '%';
  document.getElementById('readinessDetail').textContent = done + ' / ' + all.length + ' steps completed';
  const fill = document.getElementById('readinessFill');
  if (pct < 30) fill.style.background = 'var(--red)';
  else if (pct < 60) fill.style.background = 'var(--orange)';
  else if (pct < 90) fill.style.background = 'var(--yellow)';
  else fill.style.background = 'var(--green)';
}

function render() {
  const container = document.getElementById('pathContainer');
  container.innerHTML = '';
  let globalIdx = 0;
  let foundCurrent = false;

  PHASES.forEach(phase => {
    const phaseEl = document.createElement('div');
    phaseEl.className = 'phase';

    const phaseDone = phase.steps.filter(s => completed[s.id]).length;
    const phaseTotal = phase.steps.length;

    phaseEl.innerHTML = `
      <div class="phase-header">
        <span class="phase-badge" style="background:${phase.color}">${phase.th}</span>
        <span class="phase-title">${phase.title}</span>
        <span class="phase-progress">${phaseDone}/${phaseTotal}</span>
      </div>
      <p class="phase-desc">${phase.desc}</p>
    `;

    const timeline = document.createElement('div');
    timeline.className = 'timeline';

    phase.steps.forEach(step => {
      globalIdx++;
      const isDone = !!completed[step.id];
      let state = 'future';
      if (isDone) {
        state = 'done';
      } else if (!foundCurrent) {
        state = 'current';
        foundCurrent = true;
      }

      const stepEl = document.createElement('div');
      stepEl.className = 'step ' + state;

      const domainTag = step.domain > 0
        ? `<span class="step-domain-tag" style="background:${DOMAIN_COLORS[step.domain]}">${DOMAIN_LABELS[step.domain]}</span>`
        : '';

      stepEl.innerHTML = `
        <div class="step-node" onclick="toggleStep('${step.id}')">${isDone ? '&#10003;' : globalIdx}</div>
        <div class="step-card" onclick="toggleStep('${step.id}')">
          <div class="step-check">${isDone ? '&#10003;' : ''}</div>
          <div class="step-content">
            <div class="step-title-row">
              <span class="step-name">${step.name}</span>
              ${domainTag}
            </div>
            <div class="step-desc">${step.desc}</div>
            <div class="step-time">${step.time}</div>
          </div>
          <a href="${step.link}" class="step-link" onclick="event.stopPropagation()">${step.linkText}</a>
        </div>
      `;
      timeline.appendChild(stepEl);
    });

    phaseEl.appendChild(timeline);
    container.appendChild(phaseEl);
  });

  updateReadiness();
}

function init() {
  loadProgress();
  render();
  document.getElementById('resetBtn').addEventListener('click', () => {
    if (confirm('ต้องการรีเซ็ตความก้าวหน้าทั้งหมดจริงหรือ?')) {
      completed = {};
      saveProgress();
      render();
    }
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
