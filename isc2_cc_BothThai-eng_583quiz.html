d": 316, "dom": 4, "question": "Which of these social engineering attacks sends emails that target specific individuals?", "options": ["Pharming", "Whaling", "Vishing", "Spear phishing"], "correct_idx": 3, "explanation": "Spear phishing is a highly targeted phishing attack (and not just random spam) which aims to get specific individuals to reveal confidential information. The particularity of spear phishing is that these attacks are sent with prior knowledge about the target (person or company), so as to increase its chance of success. Whaling is a phishing attack targeted at a group (typically an organization's executives) (see ISC2 Study Guide, chapter 4, module 3). A pharming attack corrupts an infrastructure", "short_explanation_en": "Spear phishing is a highly targeted phishing attack (and not just random spam) which aims to get specific individuals to reveal confidential information.", "question_th": "การโจมตีทางวิศวกรรมสังคมใดที่ส่งอีเมลมุ่งเป้าไปที่บุคคลเฉพาะ?", "options_th": ["Pharming", "Whaling", "Vishing", "Spear phishing"], "explanation_th": "Spear phishing คือการโจมตีแบบ phishing ที่มุ่งเป้าไปสูงมาก (ไม่ใช่แค่สแปมแบบสุ่ม) ซึ่งมีเป้าหมายให้บุคคลเฉพาะเปิดเผยข้อมูลลับ ลักษณะเฉพาะของ spear phishing คือการโจมตีเหล่านี้ถูกส่งโดยมีความรู้ล่วงหน้าเกี่ยวกับเป้าหมาย"}, {"id": 317, "dom": 1, "question": "(★) Which of these properties is NOT guaranteed by a Message Authentication Code (MAC)?", "options": ["Authenticity", "Anonymity", "Integrity", "Non-repudiation"], "correct_idx": 1, "explanation": "A Message Authentication Code (MAC) does not guarantee anonymity. MAC is a cryptographic function that guarantees a message's integrity, authenticity, and non-repudiation. In particular: Integrity is the ability of the MAC to detect any changes that may have occurred to a message during either transmission or storage. A MAC provides this by generating a unique code for the message based on its contents, as well as a secret key that is shared between the sender and the receiver. If any changes ar", "short_explanation_en": "A Message Authentication Code (MAC) does not guarantee anonymity.", "question_th": "คุณสมบัติใดที่ Message Authentication Code (MAC) ไม่ได้รับประกัน?", "options_th": ["Authenticity", "Anonymity", "Integrity", "Non-repudiation"], "explanation_th": "Message Authentication Code (MAC) ไม่รับประกันความไม่เปิดเผยตัวตน (Anonymity) MAC เป็นฟังก์ชันการเข้ารหัสที่รับประกันความถูกต้องครบถ้วน ความแท้จริง และการปฏิเสธความรับผิดไม่ได้ (Non-repudiation)ของข้อความ Integrity คือความสามารถของ MAC ในการตรวจจับการเปลี่ยนแปลงใด ๆ ที่อาจเกิดขึ้นกับข้อความระหว่างการส่งหรือการจัดเก็บ"}, {"id": 318, "dom": 5, "question": "What is the PRIMARY objective of a degaussing? github.com/ayemunhossain", "options": ["Preventing magnetic side-channel attacks", "Reducing noisy data on a disk", "Erasing the data on a disk", "Retaining the data on a disk"], "correct_idx": 2, "explanation": "Degaussing is a technique used to erase data from a magnetic storage device, such as a hard disk drive (HDD) or magnetic tape. In degaussing, devices are exposed to strong magnetic fields that neutralize the magnetic records of the data stored on the device. This effectively erases the data, making it difficult or impossible to recover. Degaussing is often used to securely erase data from storage devices before disposing or repurposing them, thereby ensuring that unauthorized parties cannot acce", "short_explanation_en": "Degaussing is a technique used to erase data from a magnetic storage device, such as a hard disk drive (HDD) or magnetic tape.", "question_th": "วัตถุประสงค์หลักของการทำ degaussing คืออะไร?", "options_th": ["ป้องกันการโจมตีแบบ magnetic side-channel", "ลดข้อมูลรบกวนบนดิสก์", "ลบข้อมูลบนดิสก์", "รักษาข้อมูลบนดิสก์ไว้"], "explanation_th": "Degaussing เป็นเทคนิคที่ใช้ลบข้อมูลจากอุปกรณ์จัดเก็บข้อมูลแบบแม่เหล็ก เช่น ฮาร์ดดิสก์ไดรฟ์ (HDD) หรือเทปแม่เหล็ก ในการทำ degaussing อุปกรณ์จะถูกทำให้สัมผัสกับสนามแม่เหล็กความเข้มสูงที่ทำให้บันทึกแม่เหล็กของข้อมูลที่จัดเก็บในอุปกรณ์เป็นกลาง ทำให้ข้อมูลถูกลบอย่างมีประสิทธิภาพ ยากหรือเป็นไปไม่ได้ที่จะกู้คืน"}, {"id": 319, "dom": 1, "question": "Which of these is part of the canons (ISC)² code of ethics?", "options": ["Provide diligent and competent services to stakeholders", "Advance and protect the profession", "Prevent and detect unauthorized use of digital assets in a society", "Act always in the best interest of your client"], "correct_idx": 1, "explanation": "The four canons of ISC2 are (see ISC2 Study Guide, chapter 1, module 5): Advance and protect the profession; Act honorably, honestly, justly, responsibly and legally; Provide diligent and competent service to principals; Protect society, the common good, necessary public trust and confidence and the infrastructure.Although some options seem right, only 'Advance and protect the profession' is correct. github.com/ayemunhossain", "short_explanation_en": "The four canons of ISC2 are (see ISC2 Study Guide, chapter 1, module 5): Advance and protect the profession; Act honorably, honestly, justly, responsibly and legally; Provide diligent and competent service to principals; Protect...", "question_th": "ข้อใดเป็นส่วนหนึ่งของจรรยาบรรณ (ISC)² code of ethics?", "options_th": ["Provide diligent and competent services to stakeholders", "Advance and protect the profession", "Prevent and detect unauthorized use of digital assets in a society", "Act always in the best interest of your client"], "explanation_th": "จรรยาบรรณสี่ข้อของ ISC2 คือ: การปกป้องและส่งเสริมวิชาชีพ (Advance and protect the profession); การกระทำอย่างมีเกียรติ ซื่อสัตย์ ยุติธรรม รับผิดชอบ และถูกกฎหมาย; การให้บริการอย่างขยันขันแข็งและมีความสามารถต่อผู้ว่าจ้าง; การปกป้องสังคม ผลประโยชน์ส่วนรวม ความไว้วางใจสาธารณะ และโครงสร้างพื้นฐาน แม้ตัวเลือกบางข้อจะดูเหมือนถูกต้อง แต่มีเพียง 'Advance and protect the profession' เท่านั้นที่ถูกต้อง"}, {"id": 320, "dom": 1, "question": "Which of these is NOT one of the (ISC)² ethics canons?", "options": ["Act honorably, honestly, justly, responsibly, and legally", "Consider the social consequences of the systems you are designing", "Protect society, the common good, necessary public trust and confidence, and the infrastructure", "Provide diligent and competent service to principals"], "correct_idx": 1, "explanation": "Considering the social consequences of the systems you are designing is a valid concern, since the professional must abide by the canon of their protecting society, the common good, necessary public trust and confidence, and the infrastructure. However, this is not in itself a canon. The four canons of (ISC)² are: Protect society, the common good, necessary public trust and confidence, and the infrastructure; Act honorably, honestly, justly, responsibly, and legally; Provide diligent and compete", "short_explanation_en": "Considering the social consequences of the systems you are designing is a valid concern, since the professional must abide by the canon of their protecting society, the common good, necessary public trust and confidence, and the...", "question_th": "ข้อใดไม่ใช่หนึ่งในจรรยาบรรณของ (ISC)²?", "options_th": ["Act honorably, honestly, justly, responsibly, and legally", "Consider the social consequences of the systems you are designing", "Protect society, the common good, necessary public trust and confidence, and the infrastructure", "Provide diligent and competent service to principals"], "explanation_th": "การพิจารณาผลกระทบทางสังคมของระบบที่คุณกำลังออกแบบเป็นข้อกังวลที่ถูกต้อง เนื่องจากผู้เชี่ยวชาญต้องปฏิบัติตามจรรยาบรรณของการปกป้องสังคม ผลประโยชน์ส่วนรวม ความไว้วางใจสาธารณะ และโครงสร้างพื้นฐาน อย่างไรก็ตาม สิ่งนี้ไม่ใช่จรรยาบรรณในตัวมันเอง จรรยาบรรณทั้งสี่ของ (ISC)² คือ: การปกป้องสังคม, การกระทำอย่างมีเกียรติ, การให้บริการอย่างขยันขันแข็ง, และการปกป้องวิชาชีพ"}, {"id": 321, "dom": 1, "question": "(★) Which of these is the PRIMARY objective of the PCI-DSS standard?", "options": ["Personally Identifiable Information (PII)", "Change Management", "Secure Credit Cards Payments", "Protected Health Information (PHI)"], "correct_idx": 2, "explanation": "PCI-DSS (Payment Card Industry Data Security Standard) is a standard used in the payment card industry. Protected Health Information (PHI) is any individually identifiable health information that is created, used or disclosed while providing healthcare services. The Health Insurance Portability and Accountability Act (HIPAA) is a United States law aimed at protecting PHI. Personally Identifiable Information (PII) is any information that is capable of identifying an individual. PII is protected b", "short_explanation_en": "PCI-DSS (Payment Card Industry Data Security Standard) is a standard used in the payment card industry.", "question_th": "ข้อใดคือวัตถุประสงค์หลักของมาตรฐาน PCI-DSS?", "options_th": ["Personally Identifiable Information (PII)", "Change Management", "Secure Credit Cards Payments", "Protected Health Information (PHI)"], "explanation_th": "PCI-DSS (Payment Card Industry Data Security Standard) เป็นมาตรฐานที่ใช้ในอุตสาหกรรมบัตรชำระเงิน Protected Health Information (PHI) คือข้อมูลสุขภาพที่สามารถระบุตัวบุคคลได้ ซึ่งถูกสร้าง ใช้ หรือเปิดเผยขณะให้บริการด้านการดูแลสุขภาพ HIPAA เป็นกฎหมายของสหรัฐอเมริกาที่มุ่งปกป้อง PHI"}, {"id": 322, "dom": 4, "question": "Which of these is an attack that encrypts the organization's information, and then demands payment for the decryption code?", "options": ["Phishing", "DDoS", "Spoofing", "Ransomware"], "correct_idx": 3, "explanation": "Ransomware is an attack that encrypts an organization's information (thereby rendering it inaccessible or unusable) and then demands payment in exchange for the decryption code (see ISC2 Study Guide, chapter 4, module 2). A distributed denial-of-service (DDoS) attack is a type of attack in which a large amount of malicious traffic is directed at a specific target (such as a website or server), so as to overwhelm it, thus making it unavailable to users. Phishing is an attack in which attackers se", "short_explanation_en": "Ransomware is an attack that encrypts an organization's information (thereby rendering it inaccessible or unusable) and then demands payment in exchange for the decryption code (see ISC2 Study Guide, chapter 4, module 2).", "question_th": "ข้อใดคือการโจมตีที่เข้ารหัสข้อมูลขององค์กร แล้วเรียกร้องการชำระเงินเพื่อแลกกับรหัสถอดรหัส?", "options_th": ["Phishing", "DDoS", "Spoofing", "Ransomware"], "explanation_th": "Ransomware คือการโจมตีที่เข้ารหัสข้อมูลขององค์กร (ทำให้ไม่สามารถเข้าถึงหรือใช้งานได้) แล้วเรียกร้องการชำระเงินเพื่อแลกกับรหัสถอดรหัส การโจมตีแบบ distributed denial-of-service (DDoS) เป็นการโจมตีที่ส่งทราฟฟิกที่เป็นอันตรายจำนวนมากไปยังเป้าหมายเฉพาะ"}, {"id": 323, "dom": 2, "question": "The PRIMARY objective of a business continuity plan is:", "options": ["To regularly verify whether the organization complies with applicable regulations", "To sustain business operations while recovering from a disruption", "To assess the impact of disruption to the business", "To restore the business to the full last-known reliable state of operations"], "correct_idx": 1, "explanation": "A Business Continuity Plan (BCP) is a predetermined set of instructions describing how the mission and business processes of an organization will be sustained during and after a significant disruption (see Chapter 2 ISC2 Study Guide, module 4, under Terms and Definitions). Restoring a business to its last-known reliable state of operations is the goal of a Disaster Recovery Plan (see Chapter 2 ISC2 Study Guide, module 4, under The Goal of Disaster Recovery). Assessing the github.com/ayemunhossai", "short_explanation_en": "A Business Continuity Plan (BCP) is a predetermined set of instructions describing how the mission and business processes of an organization will be sustained during and after a significant disruption (see Chapter 2 ISC2 Study Guide,...", "question_th": "วัตถุประสงค์หลักของแผนความต่อเนื่องทางธุรกิจคืออะไร?", "options_th": ["ตรวจสอบเป็นประจำว่าองค์กรปฏิบัติตามกฎระเบียบที่บังคับใช้หรือไม่", "รักษาการดำเนินธุรกิจในระหว่างการกู้คืนจากการหยุดชะงัก", "ประเมินผลกระทบของการหยุดชะงักต่อธุรกิจ", "กู้คืนธุรกิจให้กลับสู่สถานะที่เชื่อถือได้ล่าสุดอย่างสมบูรณ์"], "explanation_th": "Business Continuity Plan (BCP) คือชุดคำสั่งที่กำหนดไว้ล่วงหน้าเพื่ออธิบายว่าภารกิจและกระบวนการทางธุรกิจขององค์กรจะดำเนินต่อไปอย่างไรในระหว่างและหลังเหตุการณ์หยุดชะงักสำคัญ"}, {"id": 324, "dom": 4, "question": "Which of these is an attack whose PRIMARY goal is to gain access to a target system through falsified identity?", "options": ["Ransomware", "Amplification", "Spoofing", "DDoS"], "correct_idx": 2, "explanation": "Spoofing is an attack whose primary goal is to gain access to a target system through a falsified identity. In a spoofing attack, the attacker creates or manipulates a digital identity or communication, so as to deceive the target into believing that the attacker is someone or something else. There are many different types of spoofing attacks, including email spoofing, IP spoofing, and URL spoofing. Such attacks are used to gain unauthorized access to systems or networks, steal sensitive informa", "short_explanation_en": "Spoofing is an attack whose primary goal is to gain access to a target system through a falsified identity.", "question_th": "ข้อใดคือการโจมตีที่มีเป้าหมายหลักในการเข้าถึงระบบเป้าหมายผ่านตัวตนที่ปลอมแปลง?", "options_th": ["Ransomware", "Amplification", "Spoofing", "DDoS"], "explanation_th": "Spoofing คือการโจมตีที่มีเป้าหมายหลักในการเข้าถึงระบบเป้าหมายผ่านตัวตนที่ปลอมแปลง ในการโจมตีแบบ spoofing ผู้โจมตีสร้างหรือจัดการตัวตนดิจิทัลหรือการสื่อสาร เพื่อหลอกให้เป้าหมายเชื่อว่าผู้โจมตีเป็นบุคคลหรือสิ่งอื่น"}, {"id": 325, "dom": 2, "question": "When an incident occurs, which of these is not a PRIMARY responsibility of an organization's response team?", "options": ["Determining the scope of the damage caused by the incident", "Implementing the recovery procedures necessary to restore security and recover from any incident-related damage", "Determining whether any confidential information has been compromised over the course of the entire incident", "Communicating with top management regarding the circumstances of the cybersecurity event"], "correct_idx": 3, "explanation": "While communicating with top management about the circumstances of the cybersecurity event is always important, it is not a primary responsibility of the response team. Indeed, the primary responsibility of the response team is to address github.com/ayemunhossain the immediate impact of the incident, and to restore security as quickly as possible. When an incident occurs, the primary duties of a response team include the following: Determining the scope of the damage caused by the incident, and", "short_explanation_en": "While communicating with top management about the circumstances of the cybersecurity event is always important, it is not a primary responsibility of the response team.", "question_th": "เมื่อเกิดเหตุการณ์ ข้อใดไม่ใช่ความรับผิดชอบหลักของทีมตอบสนองขององค์กร?", "options_th": ["กำหนดขอบเขตความเสียหายที่เกิดจากเหตุการณ์", "ดำเนินการตามขั้นตอนกู้คืนที่จำเป็นเพื่อฟื้นฟูความปลอดภัยและกู้คืนความเสียหายจากเหตุการณ์", "กำหนดว่าข้อมูลลับใดถูกละเมิดตลอดระยะเวลาของเหตุการณ์", "สื่อสารกับผู้บริหารระดับสูงเกี่ยวกับสถานการณ์ของเหตุการณ์ความปลอดภัยไซเบอร์"], "explanation_th": "แม้การสื่อสารกับผู้บริหารระดับสูงจะสำคัญเสมอ แต่ไม่ใช่ความรับผิดชอบหลักของทีมตอบสนอง ซึ่งเน้นที่การจัดการผลกระทบทันทีและฟื้นฟูความปลอดภัยโดยเร็วที่สุด"}, {"id": 326, "dom": 5, "question": "What is the PRIMARY objective of a rollback in the context of the change management process?", "options": ["Identify the required changes needed", "Validate the system change process", "Restore the system to its last state before the change was made", "Establish a minimum understood and acceptable level of security requirements"], "correct_idx": 2, "explanation": "In the context of the change management process, the primary objective of a rollback is to restore the system to its last state before the change was made. By rolling back the change, the system can be returned to its previous state, which may help to resolve issues and restore regular operation. Rollbacks can be either triggered automatically in response to a failure or error, or initiated manually during the change management process (see ISC2 Study Guide, chapter 5, module 2). Establishing a", "short_explanation_en": "In the context of the change management process, the primary objective of a rollback is to restore the system to its last state before the change was made.", "question_th": "วัตถุประสงค์หลักของ rollback ในบริบทของกระบวนการ change management คืออะไร?", "options_th": ["ระบุการเปลี่ยนแปลงที่จำเป็น", "ตรวจสอบความถูกต้องของกระบวนการเปลี่ยนแปลงระบบ", "คืนสถานะระบบให้กลับไปเป็นสถานะล่าสุดก่อนการเปลี่ยนแปลง", "สร้างระดับความเข้าใจและระดับข้อกำหนดด้านความปลอดภัยที่ยอมรับได้ขั้นต่ำ"], "explanation_th": "ในบริบทของกระบวนการ change management วัตถุประสงค์หลักของ rollback คือการคืนสถานะระบบให้กลับไปเป็นสถานะล่าสุดก่อนที่การเปลี่ยนแปลงจะเกิดขึ้น การ rollback การเปลี่ยนแปลงจะทำให้ระบบกลับไปสู่สถานะก่อนหน้า ซึ่งอาจช่วยแก้ปัญหาและคืนการทำงานปกติของระบบ"}, {"id": 327, "dom": 1, "question": "Which of these entities is responsible for signing an organization's policies?", "options": ["Human Resources", "Security engineer", "Financial Department", "Senior management github.com/ayemunhossain"], "correct_idx": 3, "explanation": "Senior management is typically responsible for setting the organization's overall direction and strategy, and for ensuring that policies and procedures are in place to support that strategy. Therefore, it is the senior management's responsibilityto sign the organization's policies. Although other departments and stakeholders may be called in to develop and draft policies, it is ultimately the responsibility of senior management to sign off on the policies, indicating their approval and support.", "short_explanation_en": "Senior management is typically responsible for setting the organization's overall direction and strategy, and for ensuring that policies and procedures are in place to support that strategy.", "question_th": "หน่วยงานใดต่อไปนี้รับผิดชอบในการลงนามนโยบายขององค์กร?", "options_th": ["Human Resources", "Security engineer", "Financial Department", "Senior management"], "explanation_th": "ผู้บริหารระดับสูงมักรับผิดชอบในการกำหนดทิศทางและกลยุทธ์โดยรวมขององค์กร และรับประกันว่ามีนโยบายและขั้นตอนเพื่อสนับสนุนกลยุทธ์นั้น ดังนั้น ผู้บริหารระดับสูงจึงมีความรับผิดชอบในการลงนามนโยบายขององค์กร"}, {"id": 328, "dom": 1, "question": "Which of these terms refers to threats with unusually high technical and operational sophistication, spanning months or even years?", "options": ["Rootkit", "APT", "Side-channel", "Ping of death"], "correct_idx": 1, "explanation": "An Advanced Persistent Threat is a threat with unusually high technical and operational sophistication. APTs can be difficult to detect and defend against, as the attackers often use sophisticated techniques to evade detection, and to remain stealthy for extended periods of time. APTs are typically carried out by highly skilled and well-funded attackers (such as nation-state actors or well-organized criminal groups), and often target specific organizations or individuals with the goal of stealin", "short_explanation_en": "An Advanced Persistent Threat is a threat with unusually high technical and operational sophistication.", "question_th": "คำใดหมายถึงภัยคุกคามที่มีความซับซ้อนทางเทคนิคและการปฏิบัติการที่สูงผิดปกติ กินระยะเวลาหลายเดือนหรือหลายปี?", "options_th": ["Rootkit", "APT", "Side-channel", "Ping of death"], "explanation_th": "Advanced Persistent Threat คือภัยคุกคามที่มีความซับซ้อนทางเทคนิคและการปฏิบัติการที่สูงผิดปกติ APT อาจตรวจจับและป้องกันได้ยาก เนื่องจากผู้โจมตีมักใช้เทคนิคที่ซับซ้อนเพื่อหลบเลี่ยงการตรวจจับและคงอยู่อย่างลับ ๆ เป็นเวลานาน"}, {"id": 329, "dom": 5, "question": "The PRIMARY objective of a security baseline is to establish ...", "options": [". a minimum understood and a good level of security requirements", "a minimum understood and acceptable level of security requirements github.com/ayemunhossain", "security and configuration requirements", "a maximum understood and an acceptable level of security requirements"], "correct_idx": 1, "explanation": "A security baseline is a set of security standards, guidelines and procedures used to ensure that a system or network meets a minimum level of security. Security baselines are typically based on industry best practices, regulatory requirements, and an organization's specific security needs. The primary objective of a security baseline is to establish a minimum understood and acceptable level of security requirements. While it is true that a security baseline specifies security and configuration", "short_explanation_en": "A security baseline is a set of security standards, guidelines and procedures used to ensure that a system or network meets a minimum level of security.", "question_th": "วัตถุประสงค์หลักของ security baseline คือการสร้าง...", "options_th": ["ระดับความเข้าใจขั้นต่ำและระดับข้อกำหนดด้านความปลอดภัยที่ดี", "ระดับความเข้าใจขั้นต่ำและระดับข้อกำหนดด้านความปลอดภัยที่ยอมรับได้", "ข้อกำหนดด้านความปลอดภัยและการตั้งค่าคอนฟิก", "ระดับความเข้าใจสูงสุดและระดับข้อกำหนดด้านความปลอดภัยที่ยอมรับได้"], "explanation_th": "Security baseline คือชุดมาตรฐานความปลอดภัย แนวทาง และขั้นตอนที่ใช้เพื่อรับประกันว่าระบบหรือเครือข่ายมีระดับความปลอดภัยขั้นต่ำ security baseline มักอิงตามแนวปฏิบัติที่ดีของอุตสาหกรรม ข้อกำหนดด้านกฎระเบียบ และความต้องการด้านความปลอดภัยเฉพาะขององค์กร วัตถุประสงค์หลักของ security baseline คือการสร้างระดับความเข้าใจขั้นต่ำและระดับข้อกำหนดด้านความปลอดภัยที่ยอมรับได้"}, {"id": 330, "dom": 4, "question": "Which of these attacks take advantage of inadequate input validation in websites?", "options": ["Phishing", "Trojans", "Cross-Site Scripting", "Rootkits"], "correct_idx": 2, "explanation": "Cross-Site Scripting (XSS) is an attack where malicious executable scripts are injected into an otherwise benign website (or web application) code. Websites are vulnerable to XSS when they display data originating from requests or forms without validating it (and further sanitizing it, so that it is not executable) (see ISC2 Study Guide, chapter 4, module 2). Trojans and phishing are attacks where software applications and messages try to appear legitimate, but have hidden malicious functions. T", "short_explanation_en": "Cross-Site Scripting (XSS) is an attack where malicious executable scripts are injected into an otherwise benign website (or web application) code.", "question_th": "การโจมตีใดต่อไปนี้ใช้ประโยชน์จากการตรวจสอบข้อมูลนำเข้าที่ไม่เพียงพอในเว็บไซต์?", "options_th": ["Phishing", "Trojans", "Cross-Site Scripting", "Rootkits"], "explanation_th": "Cross-Site Scripting (XSS) คือการโจมตีที่สคริปต์ที่สามารถรันได้ซึ่งเป็นอันตรายถูกแทรกเข้าไปในโค้ดของเว็บไซต์ที่ไม่มีอันตราย เว็บไซต์มีความเสี่ยงต่อ XSS เมื่อแสดงข้อมูลที่มาจากคำขอหรือแบบฟอร์มโดยไม่ได้ตรวจสอบความถูกต้อง"}, {"id": 331, "dom": 4, "question": "An organization needs a network security tool that detects and acts in the event of malicious activity. Which of these tools will BEST meet their needs?", "options": ["Router github.com/ayemunhossain", "IPS", "IDS", "Firewall"], "correct_idx": 1, "explanation": "An intrusion prevention system (IPS) is designed to monitor network traffic in real-time, identifying patterns or behaviors that may indicate an attempted intrusion or other malicious activity. Whenever an IPS detects suspicious activity, it can also act to protect the network (such as by blocking suspicious traffic, alerting the network administrator, or initiating a response to contain the threat) (see ISC2 Study Guide, chapter 4, module 2). Another type of network security tool is an intrusio", "short_explanation_en": "An intrusion prevention system (IPS) is designed to monitor network traffic in real-time, identifying patterns or behaviors that may indicate an attempted intrusion or other malicious activity.", "question_th": "องค์กรต้องการเครื่องมือความปลอดภัยเครือข่ายที่ตรวจจับและดำเนินการเมื่อเกิดกิจกรรมที่เป็นอันตราย ข้อใดต่อไปนี้จะตอบสนองความต้องการของพวกเขาได้ดีที่สุด?", "options_th": ["Router", "IPS", "IDS", "Firewall"], "explanation_th": "Intrusion prevention system (IPS) ถูกออกแบบมาเพื่อเฝ้าติดตามทราฟฟิกเครือข่ายแบบเรียลไทม์ ระบุรูปแบบหรือพฤติกรรมที่อาจบ่งชี้ถึงความพยายามบุกรุกหรือกิจกรรมที่เป็นอันตรายอื่น ๆ เมื่อ IPS ตรวจพบกิจกรรมที่น่าสงสัย มันสามารถดำเนินการเพื่อปกป้องเครือข่ายได้เช่นกัน"}, {"id": 332, "dom": 3, "question": "In a DAC policy scenario, which of these tasks can only be performed by a subject granted access to information?", "options": ["Changing security attributes", "Reading the information", "Executing the information", "Modifying the information"], "correct_idx": 0, "explanation": "As a principle, users can perform Read, Write and Execute actions with every Access Control policy. However, in discretionary access control policies, the permissions associated with each object (files or system resources) are set by the object's owner. In this model, the creator of an object implicitly becomes its owner, and therefore can decide who will have permission to the objects (see ISC2 Study Guide, chapter 3, module 3). A major weakness of DAC is that it gives users complete control to", "short_explanation_en": "As a principle, users can perform Read, Write and Execute actions with every Access Control policy.", "question_th": "ในสถานการณ์นโยบาย DAC งานใดต่อไปนี้ทำได้เฉพาะโดย subject ที่ได้รับสิทธิ์เข้าถึงข้อมูลเท่านั้น?", "options_th": ["การเปลี่ยนคุณลักษณะความปลอดภัย", "การอ่านข้อมูล", "การรันข้อมูล", "การแก้ไขข้อมูล"], "explanation_th": "โดยหลักการ ผู้ใช้สามารถดำเนินการ Read, Write และ Execute ได้กับทุกนโยบายควบคุมการเข้าถึง อย่างไรก็ตาม ในนโยบาย discretionary access control สิทธิ์ที่เกี่ยวข้องกับแต่ละวัตถุ (ไฟล์หรือทรัพยากรระบบ) ถูกกำหนดโดยเจ้าของวัตถุ ในโมเดลนี้ ผู้สร้างวัตถุกลายเป็นเจ้าของโดยปริยาย จึงสามารถตัดสินใจว่าใครจะมีสิทธิ์เข้าถึงวัตถุนั้น รวมถึงการเปลี่ยนคุณลักษณะความปลอดภัย"}, {"id": 333, "dom": 1, "question": "In the event of non-compliance, which of these can have considerable financial consequences for an organization?", "options": ["Policies", "Regulations", "Guidelines", "Standards"], "correct_idx": 1, "explanation": "Regulations are created by governments or national authorities, and often lead to financial fines for infringement. For example, the EU's GDPR prescribes penalties of up to 2% of annual revenue. Standards are created by governing or professional bodies (not by governments), and thus are not legally enforceable. Regulations are mandatory, while standards are voluntary. Policies and guidelines are internal to organizations, and are therefore not subject to financial penalties (see ISC2 Study Guide", "short_explanation_en": "Regulations are created by governments or national authorities, and often lead to financial fines for infringement.", "question_th": "ในกรณีที่ไม่ปฏิบัติตาม ข้อใดสามารถส่งผลกระทบทางการเงินอย่างมากต่อองค์กร?", "options_th": ["Policies", "Regulations", "Guidelines", "Standards"], "explanation_th": "กฎระเบียบ (Regulations) ถูกสร้างขึ้นโดยรัฐบาลหรือหน่วยงานระดับชาติ และมักนำไปสู่บทลงโทษทางการเงินสำหรับการฝ่าฝืน ตัวอย่างเช่น GDPR ของ EU กำหนดบทลงโทษสูงถึง 2% ของรายได้ต่อปี มาตรฐาน (Standards) ถูกสร้างขึ้นโดยหน่วยงานกำกับดูแลหรือวิชาชีพ (ไม่ใช่โดยรัฐบาล) จึงไม่มีผลบังคับใช้ทางกฎหมาย"}, {"id": 334, "dom": 4, "question": "What does the term LAN refer to?", "options": ["A tool to manage and control network traffic, as well as to protect a network.", "A network on a building or limited geographical area", "A device that connects multiple other devices in a network", "A long-distance connection between geographically-distant networks"], "correct_idx": 1, "explanation": "A local area network (LAN) typically covers a single floor or building. Long-distance connections between geographically- distant networks form something called a wide area network (WAN). Multiple devices in a network are connected through hubs or switches. The management and control of network traffic and protection is achieved by specialized equipment, such as firewalls and intrusion prevention systems (ISC2 Study Guide, Chapter 4, Module 1)", "short_explanation_en": "A local area network (LAN) typically covers a single floor or building.", "question_th": "คำว่า LAN หมายถึงอะไร?", "options_th": ["เครื่องมือในการจัดการและควบคุมทราฟฟิกเครือข่าย รวมถึงการปกป้องเครือข่าย", "เครือข่ายในอาคารหรือพื้นที่ทางภูมิศาสตร์ที่จำกัด", "อุปกรณ์ที่เชื่อมต่ออุปกรณ์อื่น ๆ หลายเครื่องในเครือข่าย", "การเชื่อมต่อระยะไกลระหว่างเครือข่ายที่ห่างไกลทางภูมิศาสตร์"], "explanation_th": "Local area network (LAN) โดยทั่วไปครอบคลุมชั้นเดียวหรืออาคารเดียว การเชื่อมต่อระยะไกลระหว่างเครือข่ายที่ห่างไกลทางภูมิศาสตร์เรียกว่า wide area network (WAN)"}, {"id": 335, "dom": 5, "question": "Which of these is a type of corrective security control? github.com/ayemunhossain", "options": ["Patches", "Intrusion detection systems", "Guidelines", "Encryption"], "correct_idx": 0, "explanation": "Patches are a type of corrective security control, since they repair damage and restore resources and capabilities to a secure and previously-updated state (see ISC2 Study Guide, chapter 5, module 2). Encryption is a preventive security control that ensures data confidentiality. Intrusion detection systems are detective controls, since they monitor a given system for unwanted activity. Intrusion detection systems (IDS) alert administrators to potential security breaches or attacks. Although they", "short_explanation_en": "Patches are a type of corrective security control, since they repair damage and restore resources and capabilities to a secure and previously-updated state (see ISC2 Study Guide, chapter 5, module 2).", "question_th": "ข้อใดเป็นประเภทของ corrective security control?", "options_th": ["Patches", "Intrusion detection systems", "Guidelines", "Encryption"], "explanation_th": "Patches เป็นประเภทหนึ่งของ corrective security control เนื่องจากซ่อมแซมความเสียหายและคืนทรัพยากรและความสามารถให้กลับสู่สถานะที่ปลอดภัยและอัปเดตแล้วก่อนหน้า Encryption เป็น preventive security control ที่รับประกันความลับของข้อมูล Intrusion detection systems เป็น detective controls เนื่องจากเฝ้าติดตามระบบสำหรับกิจกรรมที่ไม่พึงประสงค์"}, {"id": 336, "dom": 4, "question": "Which of these enables point-to-point online communication over an untrusted network?", "options": ["VLAN", "Firewall", "Router", "VPN"], "correct_idx": 3, "explanation": "A VPN is a type of network technology that creates a secure encrypted connection between a device and a network. This connection allows users to communicate with each other and access network resources as if they were on the same local network, even if they are in different locations (see ISC2 Study Guide, chapter 4, module 3). A VLAN (Virtual Local Area Network) is a network segmentation technology that allows devices on a network to be logically grouped, even if they are in different locations", "short_explanation_en": "A VPN is a type of network technology that creates a secure encrypted connection between a device and a network.", "question_th": "เทคโนโลยีใดที่ช่วยให้การสื่อสารออนไลน์แบบ point-to-point ผ่านเครือข่ายที่ไม่น่าเชื่อถือได้?", "options_th": ["VLAN", "Firewall", "Router", "VPN"], "explanation_th": "VPN คือเทคโนโลยีเครือข่ายประเภทหนึ่งที่สร้างการเชื่อมต่อที่เข้ารหัสและปลอดภัยระหว่างอุปกรณ์กับเครือข่าย การเชื่อมต่อนี้ทำให้ผู้ใช้สามารถสื่อสารกันและเข้าถึงทรัพยากรเครือข่ายได้ราวกับอยู่ในเครือข่ายท้องถิ่นเดียวกัน แม้จะอยู่คนละสถานที่"}, {"id": 337, "dom": 4, "question": "At which of the OSI layers do TCP and UDP work?", "options": ["Transport Layer", "Session Layer", "Application Layer", "Physical Layer"], "correct_idx": 0, "explanation": "TCP (Transmission Control Protocol) and UDP (User Datagram Protocol) are both transport layer protocols, which operate at the fourth layer of the OSI (Open Systems Interconnection) model (see ISC2 Study Guide, chapter 4, module 1). The transport layer (also known as \"Layer 4\") ensures that data is delivered reliably and efficiently between different devices on a network. TCP is a connection-oriented protocol which establishes a dedicated end-to-end connection. UDP is a connectionless protocol, a", "short_explanation_en": "TCP (Transmission Control Protocol) and UDP (User Datagram Protocol) are both transport layer protocols, which operate at the fourth layer of the OSI (Open Systems Interconnection) model (see ISC2 Study Guide, chapter 4, module 1).", "question_th": "TCP และ UDP ทำงานที่เลเยอร์ใดของ OSI?", "options_th": ["Transport Layer", "Session Layer", "Application Layer", "Physical Layer"], "explanation_th": "TCP (Transmission Control Protocol) และ UDP (User Datagram Protocol) ต่างเป็นโปรโตคอลชั้น transport ซึ่งทำงานที่เลเยอร์ที่สี่ของโมเดล OSI (Open Systems Interconnection) Transport layer (หรือเรียกว่า 'Layer 4') รับประกันว่าข้อมูลถูกส่งอย่างเชื่อถือได้และมีประสิทธิภาพระหว่างอุปกรณ์ต่าง ๆ บนเครือข่าย"}, {"id": 338, "dom": 1, "question": "(★) Which is the PRIMARY focus of the ISO 27002 standard?", "options": ["Health Insurance Portability and Accountability Act (HIPAA)", "Information Security Management System (ISMS)", "Risk Management", "Application Security"], "correct_idx": 1, "explanation": "ISO 27002 is a supplementary standard aimed at guiding implementation controls in order to maintain security controls for Information Security Management Systems (ISMS), as defined in ISO 27001. Among many other aspects, these security controls comprise application security. Risk management is an activity that is touched on in this standard, but is not its primary focus (it is the focus of the ISO 31000 standard). HIPAA is the United States law that governs the privacy github.com/ayemunhossain o", "short_explanation_en": "ISO 27002 is a supplementary standard aimed at guiding implementation controls in order to maintain security controls for Information Security Management Systems (ISMS), as defined in ISO 27001.", "question_th": "ข้อใดคือจุดเน้นหลักของมาตรฐาน ISO 27002?", "options_th": ["Health Insurance Portability and Accountability Act (HIPAA)", "Information Security Management System (ISMS)", "Risk Management", "Application Security"], "explanation_th": "ISO 27002 เป็นมาตรฐานเสริมที่มุ่งให้แนวทางการนำการควบคุมมาใช้เพื่อรักษาความปลอดภัยของ Information Security Management Systems (ISMS) ตามที่กำหนดใน ISO 27001 การบริหารความเสี่ยงเป็นกิจกรรมที่ถูกกล่าวถึงในมาตรฐานนี้ แต่ไม่ใช่จุดเน้นหลัก (ซึ่งเป็นจุดเน้นของมาตรฐาน ISO 31000)"}, {"id": 339, "dom": 4, "question": "(★) Which of these different sub-masks will allow 30 hosts?", "options": ["/26", "/30", "/27", "/29"], "correct_idx": 2, "explanation": "A subnet mask is a number that distinguishes between the network address and the host address. Subnetting divides a network into two or more subnets (see ISC2 Study Guide, chapter 4, module 1). To allow 30 hosts + 2 addresses for broadcast and network addresses. Thus, we are looking for the mask 255.255.255.224, or /27 using CIDR (Classless Inter- Domain Routing) notation. For 32 addresses, we need 5 bits and the mask /32 - log2(32) = /32 - 5 = /27. As for the remaining masks, /26 would result i", "short_explanation_en": "A subnet mask is a number that distinguishes between the network address and the host address.", "question_th": "sub-mask ใดต่อไปนี้ที่อนุญาตให้มี 30 hosts?", "options_th": ["/26", "/30", "/27", "/29"], "explanation_th": "Subnet mask คือตัวเลขที่แยกความแตกต่างระหว่างที่อยู่เครือข่ายและที่อยู่โฮสต์ Subnetting แบ่งเครือข่ายออกเป็นสองหรือมากกว่า subnets เพื่ออนุญาต 30 hosts + 2 addresses สำหรับ broadcast และ network addresses เราจึงต้องการ mask 255.255.255.224 หรือ /27"}, {"id": 340, "dom": 4, "question": "(★) Which of these statements about the security implications of IPv6 is NOT true?", "options": ["Rules based on static IPv6 addresses may not work", "IPv6's NAT implementation is insecure", "IPv6 traffic may bypass existing security controls", "IPv6 reputation services may not be mature and useful"], "correct_idx": 1, "explanation": "IPv6 does not include network address translation (NAT), since many IP addresses are available. As a result, there is no NAT implementation, and so IPv6 can't actually have an insecure version. Rules based on static IPv6 addresses may not work, since IPv6 addresses are often dynamically assigned. Thus, certain security controls that rely on static address rules (such as firewalls or access controls) may not work in all cases. Reputation services are still relatively rare, and also somewhat less", "short_explanation_en": "IPv6 does not include network address translation (NAT), since many IP addresses are available.", "question_th": "ข้อความใดต่อไปนี้เกี่ยวกับผลกระทบด้านความปลอดภัยของ IPv6 ไม่เป็นความจริง?", "options_th": ["กฎที่อิงตาม static IPv6 addresses อาจไม่ทำงาน", "การนำ NAT ของ IPv6 มาใช้ไม่ปลอดภัย", "ทราฟฟิก IPv6 อาจข้ามการควบคุมความปลอดภัยที่มีอยู่", "บริการ reputation ของ IPv6 อาจยังไม่สมบูรณ์และเป็นประโยชน์"], "explanation_th": "IPv6 ไม่มี network address translation (NAT) เนื่องจากมี IP address จำนวนมากให้ใช้งาน ดังนั้นจึงไม่มีการนำ NAT มาใช้ และ IPv6 จึงไม่สามารถมีเวอร์ชันที่ไม่ปลอดภัยได้จริง กฎที่อิงตาม static IPv6 addresses อาจไม่ทำงาน เนื่องจาก IPv6 addresses มักถูกกำหนดแบบไดนามิก"}, {"id": 341, "dom": 1, "question": "Which of these is a type of detective access control?", "options": ["Bollards", "Movement Sensors", "Turnstiles", "Firewalls"], "correct_idx": 1, "explanation": "Detective controls alert us to security problems by constantly monitoring activity and recording information, so as to take immediate action in the event of a security control failure (such as bollards or turnstiles). Therefore, a movement sensor is considered a detective control, and is complementary to physical controls. Firewalls are network devices used to filter network traffic, and are thus considered technical controls. Logging and monitoring tools, such as Security Information and Event", "short_explanation_en": "Detective controls alert us to security problems by constantly monitoring activity and recording information, so as to take immediate action in the event of a security control failure (such as bollards or turnstiles).", "question_th": "ข้อใดเป็นประเภทหนึ่งของการควบคุมแบบตรวจจับการเข้าถึง (Detective access control)?", "options_th": ["Bollards", "Movement Sensors", "Turnstiles", "Firewalls"], "explanation_th": "การควบคุมแบบตรวจจับ (Detective controls) แจ้งเตือนเราถึงปัญหาความปลอดภัยโดยการเฝ้าติดตามกิจกรรมอย่างต่อเนื่องและบันทึกข้อมูล เพื่อดำเนินการทันทีในกรณีที่การควบคุมความปลอดภัยล้มเหลว เซนเซอร์การเคลื่อนไหวจึงถือเป็นการควบคุมแบบตรวจจับ และเสริมการควบคุมทางกายภาพ"}, {"id": 342, "dom": 3, "question": "The name, age, location and job title of a person are all examples of:", "options": ["Biometric factors", "Attributes", "Account permissions", "Identity factors"], "correct_idx": 1, "explanation": "Attributes such as a person's name, age, location, job title, and even characteristics such as height or hair color, may all be associated with their identity. None of these describe biometric factors used for authentication. Identity factors are something you know, are or have. Account permissions determine what an authenticated person (a user) can do, and not attributes related to the user's identity. github.com/ayemunhossain", "short_explanation_en": "Attributes such as a person's name, age, location, job title, and even characteristics such as height or hair color, may all be associated with their identity.", "question_th": "ชื่อ อายุ สถานที่ และตำแหน่งงานของบุคคล ล้วนเป็นตัวอย่างของ:", "options_th": ["ปัจจัยชีวมิติ (Biometric factors)", "คุณลักษณะ (Attributes)", "สิทธิ์บัญชี (Account permissions)", "ปัจจัยตัวตน (Identity factors)"], "explanation_th": "คุณลักษณะ เช่น ชื่อ อายุ สถานที่ ตำแหน่งงานของบุคคล และแม้กระทั่งลักษณะอื่น ๆ เช่น ส่วนสูงหรือสีผม ล้วนสามารถเชื่อมโยงกับตัวตนของพวกเขาได้ ไม่มีข้อใดอธิบายปัจจัยชีวมิติที่ใช้ในการยืนยันตัวตน ปัจจัยตัวตนคือสิ่งที่คุณรู้ เป็น หรือมี"}, {"id": 343, "dom": 4, "question": "Which cloud service model provides the most suitable environment for customers who want to install their custom operating system?", "options": ["SaaS", "SLA", "IaaS", "PaaS"], "correct_idx": 2, "explanation": "Infrastructure as a Service (IaaS) is a cloud service model that allows the customer to manage the computing resources (including the operating systems). Software as a Service (SaaS) is a model that provides customers with access to software applications (typically on a subscription-based or pay-per-use model) but does not allow them to access the underlying infrastructure. Platform as a Service (PaaS) is a service model that provides a platform for building, deploying and managing applications;", "short_explanation_en": "Infrastructure as a Service (IaaS) is a cloud service model that allows the customer to manage the computing resources (including the operating systems).", "question_th": "โมเดลบริการคลาวด์ใดที่ให้สภาพแวดล้อมที่เหมาะสมที่สุดสำหรับลูกค้าที่ต้องการติดตั้งระบบปฏิบัติการที่กำหนดเอง?", "options_th": ["SaaS", "SLA", "IaaS", "PaaS"], "explanation_th": "Infrastructure as a Service (IaaS) คือโมเดลบริการคลาวด์ที่ให้ลูกค้าจัดการทรัพยากรคอมพิวเตอร์ได้ (รวมถึงระบบปฏิบัติการ) Software as a Service (SaaS) คือโมเดลที่ให้ลูกค้าเข้าถึงแอปพลิเคชันซอฟต์แวร์ แต่ไม่อนุญาตให้เข้าถึงโครงสร้างพื้นฐานพื้นฐาน"}, {"id": 344, "dom": 5, "question": "(★) Which of these statements is TRUE about cybersquatting?", "options": ["Its an unethical practice but everyone does it", "It is partially illegal practice", "It is an illegal practice", "It is s a legal practice"], "correct_idx": 2, "explanation": "Cybersquatting (also known as domain squatting) is the practice of speculatively registering and then selling (typically ata high price) a domain name, with the intent of profiting from someone else's trademark. An example would be someone registering the domain name \"mycompany.com\" and then offering to sell it to the owner of the trademark \"MyCompany\" for a high price. Cybersquatting can cause confusion and damage to the trademark owner's brand, which is generally considered unethical and decep", "short_explanation_en": "Cybersquatting (also known as domain squatting) is the practice of speculatively registering and then selling (typically ata high price) a domain name, with the intent of profiting from someone else's trademark.", "question_th": "ข้อความใดเป็นจริงเกี่ยวกับ cybersquatting?", "options_th": ["เป็นแนวปฏิบัติที่ผิดจริยธรรมแต่ทุกคนก็ทำกัน", "เป็นแนวปฏิบัติที่ผิดกฎหมายบางส่วน", "เป็นแนวปฏิบัติที่ผิดกฎหมาย", "เป็นแนวปฏิบัติที่ถูกกฎหมาย"], "explanation_th": "Cybersquatting (หรือเรียกว่า domain squatting) คือแนวปฏิบัติในการจดทะเบียนโดเมนเนมล่วงหน้าแล้วนำไปขาย (มักในราคาสูง) โดยมีเจตนาที่จะแสวงหากำไรจากเครื่องหมายการค้าของผู้อื่น ตัวอย่างเช่นการจดทะเบียนโดเมนเนม 'mycompany.com' แล้วเสนอขายให้กับเจ้าของเครื่องหมายการค้า 'MyCompany' ในราคาสูง Cybersquatting อาจก่อให้เกิดความสับสนและความเสียหายต่อแบรนด์ของเจ้าของเครื่องหมายการค้า ซึ่งโดยทั่วไปถือเป็นการกระทำที่ผิดจริยธรรมและหลอกลวง และในหลายประเทศถือเป็นการกระทำที่ผิดกฎหมาย"}, {"id": 345, "dom": 4, "question": "Which of these addresses is commonly reserved specifically for broadcasting?", "options": ["192.299.121.254", "192.299.121.0", "192.299.121.14", "192.299.121.255"], "correct_idx": 3, "explanation": "IPv4 addresses are 32-bits represented as a sequence of four 8-bit integers separated by a dot. Addresses ending with 0 are reserved to specifically signify the network itself (and not a specific device on that network). In contrast, addresses ending in 255 are generally reserved for broadcasting to all devices on that network (see ISC2 Study Guide, chapter 4, module 1).", "short_explanation_en": "IPv4 addresses are 32-bits represented as a sequence of four 8-bit integers separated by a dot.", "question_th": "ที่อยู่ใดต่อไปนี้มักถูกสงวนไว้เฉพาะสำหรับการ broadcast?", "options_th": ["192.299.121.254", "192.299.121.0", "192.299.121.14", "192.299.121.255"], "explanation_th": "IPv4 addresses มีขนาด 32 บิต แสดงเป็นลำดับของจำนวนเต็ม 8 บิตสี่ตัวคั่นด้วยจุด ที่อยู่ที่ลงท้ายด้วย 0 ถูกสงวนไว้เพื่อระบุเครือข่ายเอง (ไม่ใช่อุปกรณ์เฉพาะบนเครือข่ายนั้น) ในทางตรงกันข้าม ที่อยู่ที่ลงท้ายด้วย 255 โดยทั่วไปถูกสงวนไว้สำหรับการ broadcast ไปยังอุปกรณ์ทั้งหมดบนเครือข่ายนั้น"}, {"id": 346, "dom": 2, "question": "Which department in a company is NOT typically involved in a Disaster Recovery Plan (DRP)?", "options": ["Executive", "Financial", "Public Relations", "IT"], "correct_idx": 1, "explanation": "Executives and Public Relations staff need to be aware of the company's Disaster Recovery Plan (DRP) to properly handle the expectations of the public, as well as of company stakeholders. IT personnel should be focused on helping businesses return to normal operations. A company's financial department is rarely involved in a disaster recovery plan, except when the issue at hand is directly connected to company finances (see Chapter 2 ISC2 Study Guide, module 3, under Components of a Disaster Rec", "short_explanation_en": "Executives and Public Relations staff need to be aware of the company's Disaster Recovery Plan (DRP) to properly handle the expectations of the public, as well as of company stakeholders.", "question_th": "แผนกใดในบริษัทที่มักไม่เกี่ยวข้องใน Disaster Recovery Plan (DRP)?", "options_th": ["ผู้บริหาร", "การเงิน", "ฝ่ายประชาสัมพันธ์", "IT"], "explanation_th": "ผู้บริหารและฝ่ายประชาสัมพันธ์ต้องรับทราบ DRP เพื่อจัดการความคาดหวังของสาธารณะและผู้มีส่วนได้ส่วนเสีย ส่วนฝ่ายการเงินมักไม่ค่อยเกี่ยวข้องกับ DRP เว้นแต่ประเด็นนั้นเกี่ยวข้องกับการเงินโดยตรง"}, {"id": 347, "dom": 3, "question": "Which of these pairs does NOT constitute Multi-Factor Authentication (MFA)?", "options": ["Fingerprint and password.", "Username and retina scan.", "Password and username.", "PIN and credit card."], "correct_idx": 2, "explanation": "Multi-Factor Authentication uses authentication from more than one factor. Passwords and usernames are not multifactor, since they are both 'something you know' (see ISC2 Study Guide, chapter 3, module 1).", "short_explanation_en": "Multi-Factor Authentication uses authentication from more than one factor.", "question_th": "คู่ใดต่อไปนี้ไม่ถือเป็น Multi-Factor Authentication (MFA)?", "options_th": ["ลายนิ้วมือและรหัสผ่าน", "ชื่อผู้ใช้และการสแกนม่านตา", "รหัสผ่านและชื่อผู้ใช้", "PIN และบัตรเครดิต"], "explanation_th": "Multi-Factor Authentication ใช้การยืนยันตัวตนจากมากกว่าหนึ่งปัจจัย รหัสผ่านและชื่อผู้ใช้ไม่ใช่ multi-factor เนื่องจากทั้งสองเป็น 'สิ่งที่คุณรู้'"}, {"id": 348, "dom": 4, "question": "Which method is COMMONLY used to map live hosts in the network?", "options": ["Geolocation", "Traceroute", "Ping sweep", "Wireshark"], "correct_idx": 2, "explanation": "A ping sweep is a commonly used method to map live hosts in a network. A ping sweep involves sending a series of ping messages (ICMP Echo Request packets) to a range of IP addresses on a network so as to determine which hosts are currently online. Hosts that are online will respond with a reply message when a ping is sent to them. Collecting the replies makes it possible to map which hosts are currently online on the network (see ISC2 Study Guide, chapter 4, module 3). The remaining options are", "short_explanation_en": "A ping sweep is a commonly used method to map live hosts in a network.", "question_th": "วิธีการใดที่ใช้กันทั่วไปในการทำแผนที่ live hosts ในเครือข่าย?", "options_th": ["Geolocation", "Traceroute", "Ping sweep", "Wireshark"], "explanation_th": "Ping sweep คือวิธีการที่ใช้กันทั่วไปในการทำแผนที่ live hosts ในเครือข่าย โดยเกี่ยวข้องกับการส่งชุดข้อความ ping (ICMP Echo Request packets) ไปยังช่วงของ IP addresses บนเครือข่าย เพื่อกำหนดว่า hosts ใดออนไลน์อยู่ในปัจจุบัน"}, {"id": 349, "dom": 5, "question": "A poster reminding the best password management practices is an example of which type of learning activity?", "options": ["Awareness", "Schooling", "Education", "Training"], "correct_idx": 0, "explanation": "An awareness poster or campaign can be effective in engaging a user's attention and encouraging them to consider their password practices. Specific strategies include highlighting the risks associated with weak or easily guessable passwords (such as the risk of account compromise or data theft) and encouraging users to remember to use a password manager to store and manage their passwords securely. The primary goal of education is to help learners improve both their understanding of concepts and", "short_explanation_en": "An awareness poster or campaign can be effective in engaging a user's attention and encouraging them to consider their password practices.", "question_th": "โปสเตอร์เตือนเกี่ยวกับแนวปฏิบัติการจัดการรหัสผ่านที่ดีที่สุด เป็นตัวอย่างของกิจกรรมการเรียนรู้ประเภทใด?", "options_th": ["Awareness", "Schooling", "Education", "Training"], "explanation_th": "โปสเตอร์หรือแคมเปญสร้างความตระหนักสามารถมีประสิทธิภาพในการดึงดูดความสนใจของผู้ใช้และกระตุ้นให้พวกเขาพิจารณาแนวปฏิบัติด้านรหัสผ่านของตน กลยุทธ์เฉพาะรวมถึงการเน้นความเสี่ยงที่เกี่ยวข้องกับรหัสผ่านที่อ่อนแอหรือคาดเดาง่าย และกระตุ้นให้ผู้ใช้จำการใช้ตัวจัดการรหัสผ่านเพื่อจัดเก็บและจัดการรหัสผ่านอย่างปลอดภัย"}, {"id": 350, "dom": 1, "question": "Which part of the CIA Triad will be PRIMARILY jeopardized in a Distributed Denial Of Service (DDOS) attack?", "options": ["Accountability", "Availability", "Integrity", "Confidentiality"], "correct_idx": 1, "explanation": "Distributed Denial-of-Service (DDoS) attacks are malicious attempts to block businesses from their traffic by flooding a target server, service or network with malicious coordinated traffic generated by a wide number of systems on the internet. The goal of DDoS attacks is to compromise availability (see ISC2 Study Guide, chapter 1, module 1 and also chapter 4, module 3) . A DDoS attack does not target confidentiality, but it may accidentally compromise integrity. Accountability is the property t", "short_explanation_en": "Distributed Denial-of-Service (DDoS) attacks are malicious attempts to block businesses from their traffic by flooding a target server, service or network with malicious coordinated traffic generated by a wide number of systems on the...", "question_th": "ส่วนใดของ CIA Triad จะถูกคุกคามหลักในการโจมตีแบบ Distributed Denial Of Service (DDOS)?", "options_th": ["Accountability", "Availability", "Integrity", "Confidentiality"], "explanation_th": "การโจมตีแบบ Distributed Denial-of-Service (DDoS) คือความพยายามที่เป็นอันตรายในการปิดกั้นธุรกิจจากทราฟฟิกของตน โดยการท่วมเซิร์ฟเวอร์ บริการ หรือเครือข่ายเป้าหมายด้วยทราฟฟิกที่เป็นอันตรายที่ประสานงานกันจากระบบจำนวนมากบนอินเทอร์เน็ต เป้าหมายของการโจมตี DDoS คือการคุกคาม availability"}, {"id": 351, "dom": 5, "question": "(★) What technology is MOST LIKELY to conserve the storage space required for video recordings?", "options": ["Motion detection", "PTZ", "Facial recognition", "Infrared cameras"], "correct_idx": 0, "explanation": "Motion-detecting cameras record only when motion is detected, and thus help in reducing video storage requirements. A recording will occur more rarely in low-occupancy places (like data centers), thus conserving storage. In more heavily used areas, the impact on total storage space used will be negligible. Infrared cameras, facial recognition, and the abilityto pan, tilt, and zoom (PTZ) a camera are important features, but more is needed to conserve storage space.", "short_explanation_en": "Motion-detecting cameras record only when motion is detected, and thus help in reducing video storage requirements.", "question_th": "เทคโนโลยีใดมีแนวโน้มมากที่สุดที่จะช่วยประหยัดพื้นที่จัดเก็บที่จำเป็นสำหรับการบันทึกวิดีโอ?", "options_th": ["Motion detection", "PTZ", "Facial recognition", "Infrared cameras"], "explanation_th": "กล้องที่ตรวจจับการเคลื่อนไหวจะบันทึกเฉพาะเมื่อตรวจพบการเคลื่อนไหว จึงช่วยลดความต้องการพื้นที่จัดเก็บวิดีโอ การบันทึกจะเกิดขึ้นน้อยกว่าในสถานที่ที่มีคนน้อย (เช่น ศูนย์ข้อมูล) จึงช่วยประหยัดพื้นที่จัดเก็บ"}, {"id": 352, "dom": 4, "question": "An organization that uses a layered approach when designing its security architecture is using which of these security approaches?", "options": ["Zero trust", "Defense in depth", "Network Layers", "Network Control Access"], "correct_idx": 1, "explanation": "An organization that uses a layered approach when designing its security architecture is using a defense in-depth approach. In a defense in-depth approach, different layers of security controls may be implemented at different levels of the organization, such as at the network, application and user levels (see ISC2 Study Guide, chapter 4, module 3). Network control access refers to the process of controlling access to a network. Network layers refer to the different levels of a computer network,", "short_explanation_en": "An organization that uses a layered approach when designing its security architecture is using a defense in-depth approach.", "question_th": "องค์กรที่ใช้แนวทางแบบเป็นชั้นในการออกแบบสถาปัตยกรรมความปลอดภัยกำลังใช้แนวทางความปลอดภัยใดต่อไปนี้?", "options_th": ["Zero trust", "Defense in depth", "Network Layers", "Network Control Access"], "explanation_th": "องค์กรที่ใช้แนวทางแบบเป็นชั้นในการออกแบบสถาปัตยกรรมความปลอดภัยกำลังใช้แนวทาง defense in-depth ในแนวทาง defense in-depth ชั้นการควบคุมความปลอดภัยที่แตกต่างกันอาจถูกนำมาใช้ในระดับที่แตกต่างกันขององค์กร เช่น ระดับเครือข่าย แอปพลิเคชัน และผู้ใช้"}, {"id": 353, "dom": 5, "question": "Which of these techniques will ensure the property of 'non-repudiation'?", "options": ["Using a VPN", "Passwords", "Encryption", "Digital signatures"], "correct_idx": 3, "explanation": "Non-repudiation means ensuring that the sender cannot later deny having sent the message. Digital signatures provide an undeniable match between sender and digital signature. We can think of a digital signature as a Message Digest encrypted with an asymmetric key: first, the message hash is encrypted using the sender's private key; then, the message (possibly encrypted) previously encrypted message hash; finally, the recipient decrypts the signature with the sender's public key, and transfers th", "short_explanation_en": "Non-repudiation means ensuring that the sender cannot later deny having sent the message.", "question_th": "เทคนิคใดที่จะรับประกันคุณสมบัติ 'non-repudiation'?", "options_th": ["การใช้ VPN", "รหัสผ่าน", "การเข้ารหัส", "ลายเซ็นดิจิทัล"], "explanation_th": "Non-repudiation หมายถึงการรับประกันว่าผู้ส่งไม่สามารถปฏิเสธในภายหลังว่าตนไม่ได้ส่งข้อความ ลายเซ็นดิจิทัลให้การจับคู่ที่ปฏิเสธไม่ได้ระหว่างผู้ส่งและลายเซ็นดิจิทัล"}, {"id": 354, "dom": 5, "question": "(★) A USB pen with data passed around the office is an example of:", "options": ["Data in motion", "Data at rest", "Data in transit", "Data in use"], "correct_idx": 1, "explanation": "Data at rest is stored data that resides on hard drives, on tapes, in the cloud, or on other storage media like (in this case)a USB pen. Data in processing (also called data in use) is actively used by a computer system. Data sent over a network is called data in motion. Data in transit is a term that does not usually apply to such a situation.", "short_explanation_en": "Data at rest is stored data that resides on hard drives, on tapes, in the cloud, or on other storage media like (in this case)a USB pen.", "question_th": "USB pen ที่มีข้อมูลถูกส่งต่อกันในสำนักงาน เป็นตัวอย่างของ:", "options_th": ["Data in motion", "Data at rest", "Data in transit", "Data in use"], "explanation_th": "Data at rest คือข้อมูลที่จัดเก็บอยู่บนฮาร์ดไดรฟ์ เทป คลาวด์ หรือสื่อจัดเก็บข้อมูลอื่น ๆ เช่น (ในกรณีนี้) USB pen ข้อมูลที่กำลังประมวลผล (เรียกอีกอย่างว่า data in use) คือข้อมูลที่กำลังถูกใช้งานอย่างต่อเนื่องโดยระบบคอมพิวเตอร์ ข้อมูลที่ส่งผ่านเครือข่ายเรียกว่า data in motion"}, {"id": 355, "dom": 4, "question": "Suppose that an organization wants to implement measures to strengthen its detective access controls. Which one of these tools should they implement?", "options": ["Patches", "Encryption", "IDS", "Backups"], "correct_idx": 2, "explanation": "Detective controls are a crucial component of a cybersecurity program, since they provide visibility into malicious activity, breaches and attacks on an organization's IT environment. An intrusion detection system (IDS) is a device or software application which monitors a network or systems for malicious activity or policy violations (meaning that it's a detective control) (see ISC2 Study Guide, chapter 4, module 1). Patches are corrective controls. Backups are compensating controls, since they", "short_explanation_en": "Detective controls are a crucial component of a cybersecurity program, since they provide visibility into malicious activity, breaches and attacks on an organization's IT environment.", "question_th": "สมมติว่าองค์กรต้องการนำมาตรการมาใช้เพื่อเสริมความแข็งแกร่งให้กับการควบคุมการเข้าถึงแบบตรวจจับ (Detective access controls) เครื่องมือใดต่อไปนี้ที่พวกเขาควรนำมาใช้?", "options_th": ["Patches", "Encryption", "IDS", "Backups"], "explanation_th": "การควบคุมแบบตรวจจับเป็นองค์ประกอบสำคัญของโปรแกรมความปลอดภัยไซเบอร์ เนื่องจากให้ทัศนวิสัยต่อกิจกรรมที่เป็นอันตราย การละเมิด และการโจมตีต่อสภาพแวดล้อม IT ขององค์กร Intrusion detection system (IDS) คืออุปกรณ์หรือแอปพลิเคชันซอฟต์แวร์ที่เฝ้าติดตามเครือข่ายหรือระบบเพื่อหากิจกรรมที่เป็นอันตราย"}, {"id": 356, "dom": 4, "question": "(★) Which of these is an example of a MAC address?", "options": ["00-51-02-1F-58-F6", "0051021f58", "10.23.19.49", "2001 : db8: 3333 : 4444 : 5555 : 6666 : 7777 : 8888"], "correct_idx": 0, "explanation": "All network devices have a 48-bit Media Access Control (MAC) address, represented as six groups of 8 bits values in github.com/ayemunhossain hexadecimal (see ISC2 Study Guide, chapter 4, module 1 - Understand Computer Networking). An example of a MAC address would be 00-51-02-1F-58-F6. An IPv4 address is a 32-bit address represented as a sequence of four 8-bit integers, an example of which would be 10.23.19.49. An IPv6 address is a 128-bit address represented as a sequence of eight groups of 16-", "short_explanation_en": "All network devices have a 48-bit Media Access Control (MAC) address, represented as six groups of 8 bits values in github.com/ayemunhossain hexadecimal (see ISC2 Study Guide, chapter 4, module 1 - Understand Computer Networking).", "question_th": "ข้อใดต่อไปนี้เป็นตัวอย่างของ MAC address?", "options_th": ["00-51-02-1F-58-F6", "0051021f58", "10.23.19.49", "2001 : db8: 3333 : 4444 : 5555 : 6666 : 7777 : 8888"], "explanation_th": "อุปกรณ์เครือข่ายทั้งหมดมี Media Access Control (MAC) address ขนาด 48 บิต แสดงเป็นหกกลุ่มของค่า 8 บิตในเลขฐานสิบหก ตัวอย่างของ MAC address คือ 00-51-02-1F-58-F6 IPv4 address คือที่อยู่ขนาด 32 บิต แสดงเป็นลำดับของจำนวนเต็ม 8 บิตสี่ตัว เช่น 10.23.19.49"}, {"id": 357, "dom": 3, "question": "Which of these types of credentials is NOT used in multi-factor authentication?", "options": ["Something you have", "Something you know", "Something you are", "Something you trust"], "correct_idx": 3, "explanation": "Authentication generally requires that users provide identity factors (that others can't not easily provide). Because no single factor is ever foolproof, multi-factor authentication typically uses one or several of the following (see ISC2 Study Guide, chapter 3, module 1): 'Something you know', such as a password or personal identification number (PIN); 'Something you have', such as a smart card or certificate; 'Something you are', which would be based on your physical characteristics, in which", "short_explanation_en": "Authentication generally requires that users provide identity factors (that others can't not easily provide).", "question_th": "ข้อมูลรับรองประเภทใดต่อไปนี้ที่ไม่ได้ใช้ใน multi-factor authentication?", "options_th": ["สิ่งที่คุณมี", "สิ่งที่คุณรู้", "สิ่งที่คุณเป็น", "สิ่งที่คุณเชื่อถือ"], "explanation_th": "การยืนยันตัวตนโดยทั่วไปกำหนดให้ผู้ใช้ต้องให้ปัจจัยตัวตน (ที่ผู้อื่นไม่สามารถให้ได้ง่าย) เนื่องจากไม่มีปัจจัยเดียวที่สมบูรณ์แบบ multi-factor authentication มักใช้หนึ่งหรือหลายอย่างต่อไปนี้: 'สิ่งที่คุณรู้' เช่น รหัสผ่านหรือ PIN; 'สิ่งที่คุณมี' เช่น สมาร์ทการ์ดหรือใบรับรอง; 'สิ่งที่คุณเป็น' ซึ่งอิงตามลักษณะทางกายภาพของคุณ"}, {"id": 358, "dom": 2, "question": "On an Incident Response team, which role acts as the team's main link to Senior Management?", "options": ["Information security", "Communications and public relations", "Management", "Technical expert"], "correct_idx": 2, "explanation": "On most incident response teams, members of management or organizational leadership act as a primary conduit to senior management (see ISC2 Study Guide, chapter 2, module 1). The management team member also ensures that difficult or urgent decisions can be made without escalating authority. Communications and public relations staff focus on internal and external communications that typically differ from the direct conduit to senior management. Technical and information security experts are prima", "short_explanation_en": "On most incident response teams, members of management or organizational leadership act as a primary conduit to senior management (see ISC2 Study Guide, chapter 2, module 1).", "question_th": "ในทีมตอบสนองต่อเหตุการณ์ บทบาทใดทำหน้าที่เป็นตัวเชื่อมหลักของทีมกับผู้บริหารระดับสูง?", "options_th": ["ฝ่ายความปลอดภัยสารสนเทศ", "ฝ่ายสื่อสารและประชาสัมพันธ์", "ฝ่ายบริหาร", "ผู้เชี่ยวชาญด้านเทคนิค"], "explanation_th": "ในทีมตอบสนองต่อเหตุการณ์ส่วนใหญ่ สมาชิกจากฝ่ายบริหารหรือผู้นำองค์กรทำหน้าที่เป็นช่องทางหลักในการสื่อสารกับผู้บริหารระดับสูง"}, {"id": 359, "dom": 4, "question": "Which of these is NOT an effective way to protect an organization from cybercriminals?", "options": ["Removing or disabling unneeded services and protocols", "Using firewalls", "Using out-dated anti-malware software", "Using intrusion detection and prevention systems"], "correct_idx": 2, "explanation": "Using out-dated anti-malware software is NOT an effective way to protect an organization from cybercriminals. Anti- malware software (such as antivirus programs) are designed to detect and remove malware from computer systems and networks. To be effective, it is vital, instead, to ensure that running software is kept up-to-date with the latest security updates and definitions. Other effective ways to protect an organization from cybercriminals are: Removing or disabling unneeded services and pro", "short_explanation_en": "Using out-dated anti-malware software is NOT an effective way to protect an organization from cybercriminals.", "question_th": "ข้อใดต่อไปนี้ไม่ใช่วิธีที่มีประสิทธิภาพในการปกป้ององค์กรจากอาชญากรไซเบอร์?", "options_th": ["การลบหรือปิดใช้งานบริการและโปรโตคอลที่ไม่จำเป็น", "การใช้ไฟร์วอลล์", "การใช้ซอฟต์แวร์แอนตี้มัลแวร์ที่ล้าสมัย", "การใช้ระบบตรวจจับและป้องกันการบุกรุก"], "explanation_th": "การใช้ซอฟต์แวร์แอนตี้มัลแวร์ที่ล้าสมัยไม่ใช่วิธีที่มีประสิทธิภาพในการปกป้ององค์กรจากอาชญากรไซเบอร์ ซอฟต์แวร์แอนตี้มัลแวร์ (เช่น โปรแกรมแอนตี้ไวรัส) ถูกออกแบบมาเพื่อตรวจจับและลบมัลแวร์ออกจากระบบคอมพิวเตอร์และเครือข่าย เพื่อให้มีประสิทธิภาพ จำเป็นอย่างยิ่งที่จะต้องรักษาซอฟต์แวร์ที่กำลังทำงานให้ทันสมัยด้วยการอัปเดตและคำจำกัดความความปลอดภัยล่าสุด"}, {"id": 360, "dom": 3, "question": "Which of these CANNOT be a corrective security control?", "options": ["Disaster Recovery Plan", "Backups", "Patches", "Bollards"], "correct_idx": 3, "explanation": "Corrective security controls are measures used to address security vulnerabilities or weaknesses already identified. Backups, patches, and Disaster Recovery Plans are all corrective security controls (see ISC2 Study Guide, chapter 3, module 2). Backups can help ensure that important information is not lost in the event of an incident. Patches can help fix vulnerabilities and improve security. Disaster Recovery Plans are administrative security controls that establish the corrective measures to b", "short_explanation_en": "Corrective security controls are measures used to address security vulnerabilities or weaknesses already identified.", "question_th": "ข้อใดต่อไปนี้ไม่สามารถเป็น corrective security control ได้?", "options_th": ["Disaster Recovery Plan", "Backups", "Patches", "Bollards"], "explanation_th": "การควบคุมความปลอดภัยเชิงแก้ไข (Corrective) คือมาตรการที่ใช้จัดการช่องโหว่หรือจุดอ่อนความปลอดภัยที่ระบุไว้แล้ว Backups, patches และ Disaster Recovery Plans ล้วนเป็นการควบคุมความปลอดภัยเชิงแก้ไข Backups ช่วยรับประกันว่าข้อมูลสำคัญจะไม่สูญหายในกรณีเกิดเหตุการณ์ Patches ช่วยแก้ไขช่องโหว่และปรับปรุงความปลอดภัย"}, {"id": 361, "dom": 2, "question": "Which of these is included in an SLA document?", "options": ["Instructions on data ownership and destruction", "Instructions to detect, respond to, and limit the consequences of a cyber-attack", "A plan to keep business operations going while recovering from a significant disruption", "A plan to prepare the organization for the continuation of critical business functions"], "correct_idx": 0, "explanation": "A Service Level Agreement (SLA) is a contract between a service provider and a customer which defines the level of service that the provider will deliver. It must include instructions on data ownership and destruction in order to ensure that sensitive data is properly protected. A set of instructions or procedures to detect, respond, and limit the consequences of a cyber-attack is called an Incident Response Plan (see ISC2 Study Guide chapter 2, module 1, under The Goal of Incident Response). A", "short_explanation_en": "A Service Level Agreement (SLA) is a contract between a service provider and a customer which defines the level of service that the provider will deliver.", "question_th": "ข้อใดรวมอยู่ในเอกสาร SLA?", "options_th": ["ขั้นตอนเกี่ยวกับความเป็นเจ้าของข้อมูลและการทำลายข้อมูล", "ขั้นตอนตรวจจับ ตอบสนอง และจำกัดผลกระทบจากการโจมตีทางไซเบอร์", "แผนรักษาการดำเนินธุรกิจระหว่างการกู้คืนจากการหยุดชะงักครั้งใหญ่", "แผนเตรียมองค์กรสำหรับความต่อเนื่องของฟังก์ชันทางธุรกิจสำคัญ"], "explanation_th": "SLA (Service Level Agreement) คือสัญญาระหว่างผู้ให้บริการกับลูกค้าที่กำหนดระดับการบริการ ซึ่งควรรวมถึงขั้นตอนเกี่ยวกับความเป็นเจ้าของข้อมูลและการทำลายข้อมูล"}, {"id": 362, "dom": 4, "question": "Which port number corresponds to the Simple Mail Transfer Protocol (SMTP)?", "options": ["161", "69", "25", "22"], "correct_idx": 2, "explanation": "The Simple Mail Transfer Protocol (SMTP) is well-known for accepting connections on port 25, so as to receive unencrypted email messages. The more secure alternative is to use port 587 for SMTP by using Transport Layer Security (TLS), which encrypts the data between the mail client and the server (see ISC2 Study Guide, chapter 4, module 1)", "short_explanation_en": "The Simple Mail Transfer Protocol (SMTP) is well-known for accepting connections on port 25, so as to receive unencrypted email messages.", "question_th": "หมายเลขพอร์ตใดที่สอดคล้องกับ Simple Mail Transfer Protocol (SMTP)?", "options_th": ["161", "69", "25", "22"], "explanation_th": "Simple Mail Transfer Protocol (SMTP) เป็นที่รู้จักกันดีในการยอมรับการเชื่อมต่อบนพอร์ต 25 เพื่อรับข้อความอีเมลที่ไม่ได้เข้ารหัส ทางเลือกที่ปลอดภัยกว่าคือการใช้พอร์ต 587 สำหรับ SMTP โดยใช้ Transport Layer Security (TLS) ซึ่งเข้ารหัสข้อมูลระหว่างไคลเอนต์อีเมลกับเซิร์ฟเวอร์"}, {"id": 363, "dom": 4, "question": "Which type of attack attempts to mislead the user into exposing personal information by sending fraudulent emails?", "options": ["Cross-Site Scripting", "Denial of Service", "Trojans", "Phishing"], "correct_idx": 3, "explanation": "A phishing attack emails a fraudulent message with the goal of tricking the recipient into disclosing sensitive informationto the attacker (see ISC2 Study Guide, chapter 4, module 2). A Cross-Site Scripting attack tries to execute code on another website. Trojans are software that seem legitimate, but has hidden malicious functions. Trojans may be sent in a message, but are not themselves the message. A denial of service attack (DoS) compromises the availability of a system or service through a", "short_explanation_en": "A phishing attack emails a fraudulent message with the goal of tricking the recipient into disclosing sensitive informationto the attacker (see ISC2 Study Guide, chapter 4, module 2).", "question_th": "การโจมตีประเภทใดที่พยายามหลอกลวงผู้ใช้ให้เปิดเผยข้อมูลส่วนบุคคลโดยการส่งอีเมลหลอกลวง?", "options_th": ["Cross-Site Scripting", "Denial of Service", "Trojans", "Phishing"], "explanation_th": "การโจมตีแบบ phishing ส่งข้อความหลอกลวงทางอีเมลโดยมีเป้าหมายเพื่อหลอกให้ผู้รับเปิดเผยข้อมูลที่ละเอียดอ่อนต่อผู้โจมตี Cross-Site Scripting พยายามรันโค้ดบนเว็บไซต์อื่น Trojans เป็นซอฟต์แวร์ที่ดูเหมือนถูกต้องตามกฎหมาย แต่มีฟังก์ชันที่เป็นอันตรายซ่อนอยู่"}, {"id": 364, "dom": 4, "question": "Which of these is NOT a characteristic of the cloud?", "options": ["Zero Customer Responsibility", "Broad Network Access", "Measured Service", "Rapid Elasticity"], "correct_idx": 0, "explanation": "The characteristics of the cloud, also known as the \"five essential characteristics\" of cloud computing, are (see ISC2 github.com/ayemunhossain Study Guide, chapter 4, module 3): Broad network access: Cloud resources, such as the internet, can be accessed over a network; Rapid elasticity: Cloud resources can be scaled up or down quickly and automatically to meet changing demand; Measured service: Cloud providers track and measure the use of resources, and users are typically charged based on the", "short_explanation_en": "The characteristics of the cloud, also known as the \"five essential characteristics\" of cloud computing, are (see ISC2 github.com/ayemunhossain Study Guide, chapter 4, module 3): Broad network access: Cloud resources, such as the...", "question_th": "ข้อใดต่อไปนี้ไม่ใช่ลักษณะของคลาวด์?", "options_th": ["Zero Customer Responsibility", "Broad Network Access", "Measured Service", "Rapid Elasticity"], "explanation_th": "ลักษณะของคลาวด์ หรือที่รู้จักกันในชื่อ 'ห้าคุณลักษณะสำคัญ' ของคลาวด์คอมพิวติ้ง คือ: Broad network access (ทรัพยากรคลาวด์สามารถเข้าถึงได้ผ่านเครือข่าย); Rapid elasticity (ทรัพยากรคลาวด์สามารถปรับขนาดขึ้นหรือลงได้อย่างรวดเร็วและอัตโนมัติ); Measured service (ผู้ให้บริการคลาวด์ติดตามและวัดการใช้ทรัพยากร)"}, {"id": 365, "dom": 5, "question": "Which of these is a COMMON mistake made when implementing record retention policies?", "options": ["Not categorizing the type of information to be retained", "Not labeling the type of information to be retained", "Applying the longest retention periods to the information", "Applying shorter retention periods to the information"], "correct_idx": 2, "explanation": "A common mistake in record retention is applying the longest retention period without taking into account the sensitivity or importance of the corresponding information. Retaining unnecessary data has considerable costs in terms of storage and management. Less important or sensitive information can have shorter retention periods, thereby allowing longer retention periods for more important or sensitive information (see ISC2 Study Guide, chapter 5, module 1).", "short_explanation_en": "A common mistake in record retention is applying the longest retention period without taking into account the sensitivity or importance of the corresponding information.", "question_th": "ข้อใดเป็นความผิดพลาดทั่วไปที่เกิดขึ้นเมื่อนำนโยบายการเก็บรักษาข้อมูล (Record retention policies) มาใช้?", "options_th": ["ไม่จัดประเภทของข้อมูลที่จะเก็บรักษา", "ไม่ติดป้ายประเภทของข้อมูลที่จะเก็บรักษา", "การใช้ระยะเวลาการเก็บรักษาที่ยาวนานที่สุดกับข้อมูล", "การใช้ระยะเวลาการเก็บรักษาที่สั้นกว่ากับข้อมูล"], "explanation_th": "ความผิดพลาดทั่วไปในการเก็บรักษาข้อมูลคือการใช้ระยะเวลาการเก็บรักษาที่ยาวนานที่สุดโดยไม่คำนึงถึงความอ่อนไหวหรือความสำคัญของข้อมูลนั้น ๆ การเก็บรักษาข้อมูลที่ไม่จำเป็นมีค่าใช้จ่ายมากในแง่ของการจัดเก็บและการบริหารจัดการ ข้อมูลที่มีความสำคัญหรือความอ่อนไหวน้อยกว่าสามารถมีระยะเวลาการเก็บรักษาที่สั้นกว่า"}, {"id": 366, "dom": 3, "question": "Which type of security control does NOT include CCTV cameras?", "options": ["Corrective", "Deterrent", "Preventive", "Detective"], "correct_idx": 0, "explanation": "CCTV cameras are considered a deterrent to criminal activity. In addition, combined with other sensors, they can detect movement, and thus are considered a detective control. Image recordings provide evidence after the fact. According to the NIST, preventive controls are measures to detect, deter and/or reduce an impact of a system. CCTV cameras are not corrective controls, as they are not deployed to repair detected errors or irregularities (see ISC2 Study Guide, chapter 3, module 2).", "short_explanation_en": "CCTV cameras are considered a deterrent to criminal activity.", "question_th": "การควบคุมความปลอดภัยประเภทใดที่ไม่รวมกล้อง CCTV?", "options_th": ["Corrective", "Deterrent", "Preventive", "Detective"], "explanation_th": "กล้อง CCTV ถือเป็นการยับยั้งกิจกรรมทางอาญา นอกจากนี้ เมื่อรวมกับเซนเซอร์อื่น ๆ กล้องสามารถตรวจจับการเคลื่อนไหวได้ จึงถือเป็นการควบคุมแบบตรวจจับ การบันทึกภาพเป็นหลักฐานหลังเกิดเหตุ กล้อง CCTV ไม่ใช่การควบคุมเชิงแก้ไข เนื่องจากไม่ได้ถูกนำไปใช้เพื่อซ่อมแซมข้อผิดพลาดหรือความผิดปกติที่ตรวจพบ"}, {"id": 367, "dom": 1, "question": "A security consultant hired to design the security policies for the PHI within an organization will be primarily handling:", "options": ["Personal Health information", "Public Health information", "Procedural Health information", "Protected Health information"], "correct_idx": 3, "explanation": "PHI is an acronym that stands for Protected Health Information (see ISC2 Study Guide, chapter 1, module 1). The remaining options are incorrect.", "short_explanation_en": "PHI is an acronym that stands for Protected Health Information (see ISC2 Study Guide, chapter 1, module 1).", "question_th": "ที่ปรึกษาด้านความปลอดภัยที่ถูกจ้างให้ออกแบบนโยบายความปลอดภัยสำหรับ PHI ภายในองค์กร จะจัดการกับ:", "options_th": ["Personal Health information", "Public Health information", "Procedural Health information", "Protected Health information"], "explanation_th": "PHI เป็นตัวย่อของ Protected Health Information (ISC2 Study Guide บทที่ 1 โมดูล 1) ตัวเลือกที่เหลือไม่ถูกต้อง"}, {"id": 368, "dom": 4, "question": "Which of these cloud deployment models is a combination of public and private cloud storage?", "options": ["Community", "Private", "Hybrid", "Public"], "correct_idx": 2, "explanation": "A hybrid cloud deployment model combines public and private cloud storage. For example: an organization might use private cloud storage for sensitive or proprietary data that needs to be kept confidential, while at the same time using github.com/ayemunhossain public cloud storage for less sensitive data or workloads, which are more suited to a shared infrastructure. This allows the organization to tailor its cloud storage strategy to meet the specific needs of its workloads, while at the same ti", "short_explanation_en": "A hybrid cloud deployment model combines public and private cloud storage.", "question_th": "โมเดลการปรับใช้คลาวด์ใดต่อไปนี้เป็นการรวมกันของการจัดเก็บแบบ public และ private cloud?", "options_th": ["Community", "Private", "Hybrid", "Public"], "explanation_th": "โมเดลการปรับใช้ hybrid cloud รวมการจัดเก็บแบบ public และ private cloud เข้าด้วยกัน ตัวอย่างเช่น องค์กรอาจใช้การจัดเก็บแบบ private cloud สำหรับข้อมูลที่อ่อนไหวหรือเป็นกรรมสิทธิ์ที่ต้องเก็บเป็นความลับ ในขณะเดียวกันก็ใช้การจัดเก็บแบบ public cloud สำหรับข้อมูลที่มีความอ่อนไหวน้อยกว่า"}, {"id": 369, "dom": 5, "question": "What is the primary goal of a Change Management Policy?", "options": ["To standardize the creation of the organization's network and computer systems", "To guarantee that systems are up to date with the latest security patch", "To standardize the usage of the organization's network and computer systems", "To guarantee that system changes are performed without negatively affecting business operations"], "correct_idx": 3, "explanation": "The primary goal of a Change Management Policy is to realize the benefits of the system's changes while minimizing disruptions to business operations, namely by ensuring the integrity of the organization's systems and processes (see ISC2 Study Guide, chapter 5, module 3). Guaranteeing that systems have the latest security patches is the goal of a Patch Management Policy. A Networking Policy governs the usage of networks, and an Acceptable Use Policy governs the usage of computer systems. The cre", "short_explanation_en": "The primary goal of a Change Management Policy is to realize the benefits of the system's changes while minimizing disruptions to business operations, namely by ensuring the integrity of the organization's systems and processes (see...", "question_th": "เป้าหมายหลักของ Change Management Policy คืออะไร?", "options_th": ["เพื่อสร้างมาตรฐานการสร้างเครือข่ายและระบบคอมพิวเตอร์ขององค์กร", "เพื่อรับประกันว่าระบบมีการอัปเดตด้วยแพตช์ความปลอดภัยล่าสุด", "เพื่อสร้างมาตรฐานการใช้งานเครือข่ายและระบบคอมพิวเตอร์ขององค์กร", "เพื่อรับประกันว่าการเปลี่ยนแปลงระบบดำเนินการโดยไม่ส่งผลกระทบเชิงลบต่อการดำเนินธุรกิจ"], "explanation_th": "เป้าหมายหลักของ Change Management Policy คือการทำให้เกิดประโยชน์จากการเปลี่ยนแปลงระบบในขณะที่ลดผลกระทบต่อการดำเนินธุรกิจให้เหลือน้อยที่สุด กล่าวคือ โดยการรับประกันความถูกต้องครบถ้วนของระบบและกระบวนการขององค์กร การรับประกันว่าระบบมีแพตช์ความปลอดภัยล่าสุดเป็นเป้าหมายของ Patch Management Policy"}, {"id": 370, "dom": 5, "question": "Which of these is NOT a feature of a SIEM (Security Information and Event Management)?", "options": ["Log auditing", "Log encryption", "Log consolidation", "Log retention github.com/ayemunhossain"], "correct_idx": 0, "explanation": "Log auditing is not a feature of a SIEM (Security Information and Event Management). A SIEM typically provides the following features: Log consolidation, which consists in collecting logs from various sources (like servers, firewalls or IDS/IPS) and then storing them in one central location. Log retention, which consists in storing logs for a specific period (like 90 days), so as to allow security analysts to keep track of and investigate past events. Log encryption, which is an optional feature", "short_explanation_en": "Log auditing is not a feature of a SIEM (Security Information and Event Management).", "question_th": "ข้อใดไม่ใช่คุณสมบัติของ SIEM (Security Information and Event Management)?", "options_th": ["การตรวจสอบ Log (Log auditing)", "การเข้ารหัส Log (Log encryption)", "การรวมศูนย์ Log (Log consolidation)", "การเก็บรักษา Log (Log retention)"], "explanation_th": "Log auditing ไม่ใช่คุณสมบัติของ SIEM โดยทั่วไป SIEM มีคุณสมบัติดังนี้: Log consolidation คือการรวบรวม log จากแหล่งต่าง ๆ (เช่น เซิร์ฟเวอร์ ไฟร์วอลล์ หรือ IDS/IPS) แล้วจัดเก็บไว้ในที่เดียว Log retention คือการจัดเก็บ log ไว้เป็นระยะเวลาหนึ่ง (เช่น 90 วัน) เพื่อให้นักวิเคราะห์ความปลอดภัยติดตามและสืบสวนเหตุการณ์ในอดีตได้ Log encryption เป็นคุณสมบัติเสริม"}, {"id": 371, "dom": 3, "question": "Which of these technologies is the LEAST effective means of preventing shared accounts?", "options": ["Requiring a one-time password via an application", "Requiring one-time passwords via a token", "Password complexity requirements", "Requiring biometric authentication"], "correct_idx": 2, "explanation": "Password complexity requirements do not prevent the sharing of complex passwords, making it the least effective option from the above list. One-time passwords are hard to share, making it far less convenient to share accounts. Biometric authentication requires the registered user to actually be present when signing in. However, in some cases, such as fingerprint systems, multiple users could each register a valid fingerprint for a single account (see ISC2 Study Guide, chapter 3, module 1).", "short_explanation_en": "Password complexity requirements do not prevent the sharing of complex passwords, making it the least effective option from the above list.", "question_th": "เทคโนโลยีใดต่อไปนี้มีประสิทธิภาพน้อยที่สุดในการป้องกันการใช้บัญชีร่วมกัน?", "options_th": ["
