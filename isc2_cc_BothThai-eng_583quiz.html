กำหนดให้ใช้รหัสผ่านแบบใช้ครั้งเดียวผ่านแอปพลิเคชัน", "กำหนดให้ใช้รหัสผ่านแบบใช้ครั้งเดียวผ่านโทเค็น", "ข้อกำหนดความซับซ้อนของรหัสผ่าน", "กำหนดให้ใช้การยืนยันตัวตนด้วยไบโอเมตริกซ์"], "explanation_th": "ข้อกำหนดความซับซ้อนของรหัสผ่านไม่ได้ป้องกันการแชร์รหัสผ่านที่ซับซ้อน ทำให้เป็นตัวเลือกที่มีประสิทธิภาพน้อยที่สุดในรายการข้างต้น รหัสผ่านแบบใช้ครั้งเดียวแชร์กันได้ยาก ทำให้การแชร์บัญชีสะดวกน้อยลงมาก การยืนยันตัวตนด้วยไบโอเมตริกซ์กำหนดให้ผู้ใช้ที่ลงทะเบียนต้องอยู่จริงขณะลงชื่อเข้าใช้"}, {"id": 372, "dom": 1, "question": "Which of these is NOT a best practice in access management?", "options": ["Trust but verify", "Periodically assessing whether user permissions still apply", "Giving only the right amount of permission github.com/ayemunhossain", "Requesting a justification when upgrading permission"], "correct_idx": 0, "explanation": "The \"Trust but verify\" model is a method of threat protection that involves granting privileged accounts access to the network and other resources, while at the same time verifying their actions and activities. However, over time, this model was found to have limitations that expose organizations to a wide array of security threats. Therefore, \"Trust but verify\" is being progressively abandoned in favor of the Zero Trust model. The remaining options are all best practices of access management.", "short_explanation_en": "The \"Trust but verify\" model is a method of threat protection that involves granting privileged accounts access to the network and other resources, while at the same time verifying their actions and activities.", "question_th": "ข้อใดไม่ใช่แนวปฏิบัติที่ดีในการจัดการการเข้าถึง (Access management)?", "options_th": ["Trust but verify", "ประเมินเป็นระยะว่าสิทธิ์ของผู้ใช้ยังคงเหมาะสมหรือไม่", "ให้สิทธิ์เท่าที่จำเป็นเท่านั้น", "ขอเหตุผลเมื่อมีการอัปเกรดสิทธิ์"], "explanation_th": "โมเดล 'Trust but verify' เป็นวิธีการป้องกันภัยคุกคามที่เกี่ยวข้องกับการให้บัญชีสิทธิพิเศษเข้าถึงเครือข่ายและทรัพยากรอื่น ๆ ในขณะเดียวกันก็ตรวจสอบการกระทำและกิจกรรมของพวกเขา อย่างไรก็ตาม โมเดลนี้พบว่ามีข้อจำกัดที่เปิดโอกาสให้องค์กรเผชิญภัยคุกคามด้านความปลอดภัยหลากหลาย จึงกำลังถูกยกเลิกเพื่อหันไปใช้โมเดล Zero Trust แทน"}, {"id": 373, "dom": 1, "question": "(★) When analyzing risks, which of these activities is required?", "options": ["Accepting all evaluated risks", "Identifying risks associated with loss of confidentiality", "Determining the likelihood of occurrence of a set of risks", "Selecting the appropriate controls"], "correct_idx": 2, "explanation": "Determining the likelihood of occurrence of a set of risks involves estimating the likelihood that the identified risks will occur, along with the potential impact it could have on the organization. Once the likelihood of occurrence has been determined, the next step is to select the appropriate controls to mitigate those risks, such as encryption, access controls, or administrative controls (like policies and procedures). Identifying the risks associated with loss of confidentiality (such as un", "short_explanation_en": "Determining the likelihood of occurrence of a set of risks involves estimating the likelihood that the identified risks will occur, along with the potential impact it could have on the organization.", "question_th": "เมื่อวิเคราะห์ความเสี่ยง กิจกรรมใดต่อไปนี้จำเป็นต้องทำ?", "options_th": ["ยอมรับความเสี่ยงที่ประเมินแล้วทั้งหมด", "ระบุความเสี่ยงที่เกี่ยวข้องกับการสูญเสีย confidentiality", "กำหนดความน่าจะเป็นในการเกิดขึ้นของชุดความเสี่ยง", "เลือกการควบคุมที่เหมาะสม"], "explanation_th": "การกำหนดความน่าจะเป็นในการเกิดขึ้นของชุดความเสี่ยงเกี่ยวข้องกับการประมาณความน่าจะเป็นที่ความเสี่ยงที่ระบุจะเกิดขึ้น พร้อมกับผลกระทบที่อาจเกิดขึ้นต่อองค์กร เมื่อกำหนดความน่าจะเป็นแล้ว ขั้นตอนถัดไปคือการเลือกการควบคุมที่เหมาะสมเพื่อลดความเสี่ยงเหล่านั้น"}, {"id": 374, "dom": 2, "question": "Which of these exercises goes through a sample of an incident step-by-step, validating what each person will do?", "options": ["A simulation exercise", "A walk-through exercise", "A tabletop exercise github.com/ayemunhossain", "A checklist exercise"], "correct_idx": 1, "explanation": "A walk-through exercise reviews each step of the incident, in order to ensure that every team member knows exactly what they should do, and how they should do it. In tabletop exercises, team members are given a scenario and asked how they would respond, as well as what tasks they believe would be relevant. A simulation exercise attempts to recreate an actual incident so as to thoroughly test responses. Checklists are essential in incident response, but aren't actually a specific type of exercise", "short_explanation_en": "A walk-through exercise reviews each step of the incident, in order to ensure that every team member knows exactly what they should do, and how they should do it.", "question_th": "แบบฝึกหัดใดที่เดินผ่านตัวอย่างเหตุการณ์ทีละขั้นตอน เพื่อตรวจสอบว่าแต่ละคนจะทำอะไร?", "options_th": ["การฝึกจำลองสถานการณ์", "การฝึกเดินผ่านขั้นตอน", "การฝึกประชุมบนโต๊ะ", "การฝึกตรวจสอบรายการ"], "explanation_th": "การฝึกเดินผ่านขั้นตอนจะทบทวนแต่ละขั้นตอนของเหตุการณ์ เพื่อให้แน่ใจว่าสมาชิกทีมทุกคนรู้ว่าต้องทำอะไรและทำอย่างไร"}, {"id": 375, "dom": 1, "question": "(★) Which of these types of documents is usually THE LEAST formal?", "options": ["Standards", "Guidelines", "Policies", "Regulations"], "correct_idx": 1, "explanation": "Of the document types listed above, guidelines are generally the least formal. Guidelines provide recommendations or suggestions for achieving a particular goal or objective. They are often less formal than standards and policies, and are used to specify best practices or recommended approaches. Standards are generally more formal than guidelines, and describe the requirements, specifications or characteristics that a product, service or system should possess. Policies are usually more formal th", "short_explanation_en": "Of the document types listed above, guidelines are generally the least formal.", "question_th": "เอกสารประเภทใดต่อไปนี้มักเป็นทางการน้อยที่สุด?", "options_th": ["Standards", "Guidelines", "Policies", "Regulations"], "explanation_th": "ในบรรดาประเภทเอกสารที่ระบุข้างต้น แนวทาง (Guidelines) โดยทั่วไปเป็นทางการน้อยที่สุด แนวทางให้คำแนะนำหรือข้อเสนอแนะเพื่อบรรลุเป้าหมายหรือวัตถุประสงค์เฉพาะ มักเป็นทางการน้อยกว่ามาตรฐานและนโยบาย และใช้เพื่อระบุแนวปฏิบัติที่ดีที่สุดหรือแนวทางที่แนะนำ"}, {"id": 376, "dom": 5, "question": "A backup that captures the changes made since the latest full backup is an example of:", "options": ["A differential backup", "An incremental backup", "A backup snapshot github.com/ayemunhossain", "A full backup"], "correct_idx": 0, "explanation": "A differential backup is a backup that captures the changes made since the latest full backup. Incremental backups capture changes since the latest backup (which can be full or incremental), and snapshots are live copies of a system. Neither incremental backups nor snapshots necessarily capture changes since a full backup (see ISC2 Study Guide, chapter 5, module 1).", "short_explanation_en": "A differential backup is a backup that captures the changes made since the latest full backup.", "question_th": "การสำรองข้อมูลที่บันทึกการเปลี่ยนแปลงที่เกิดขึ้นนับตั้งแต่การสำรองข้อมูลแบบเต็ม (full backup) ครั้งล่าสุด เป็นตัวอย่างของ:", "options_th": ["Differential backup", "Incremental backup", "Backup snapshot", "Full backup"], "explanation_th": "Differential backup คือการสำรองข้อมูลที่บันทึกการเปลี่ยนแปลงที่เกิดขึ้นนับตั้งแต่ full backup ครั้งล่าสุด Incremental backups บันทึกการเปลี่ยนแปลงนับตั้งแต่การสำรองข้อมูลครั้งล่าสุด (ไม่ว่าจะเป็น full หรือ incremental) และ snapshots คือสำเนาสดของระบบ ทั้ง incremental backups และ snapshots ไม่จำเป็นต้องบันทึกการเปลี่ยนแปลงนับตั้งแต่ full backup"}, {"id": 377, "dom": 4, "question": "A high-level executive of an organization receives a malicious email that tries to trick him. Which attack is the perpetrator using?", "options": ["DDOS", "Whaling", "Phishing", "Spear phishing"], "correct_idx": 1, "explanation": "When executives receive malicious emails that try to trick them, the attackers are likely attempting a whaling attack (see ISC2 Study Guide, chapter 4, module 2). Whaling is a type of spear phishing, and, in turn, spear phishing is a type of phishing. Whaling is a spear phishing attack targeted at a group of high-level executives, or at other influential individuals inside the organization. Spear phishing is a targeted attack in which the attacker uses email or other digital communication to tri", "short_explanation_en": "When executives receive malicious emails that try to trick them, the attackers are likely attempting a whaling attack (see ISC2 Study Guide, chapter 4, module 2).", "question_th": "ผู้บริหารระดับสูงขององค์กรได้รับอีเมลที่เป็นอันตรายซึ่งพยายามหลอกลวงเขา ผู้กระทำผิดกำลังใช้การโจมตีใด?", "options_th": ["DDOS", "Whaling", "Phishing", "Spear phishing"], "explanation_th": "เมื่อผู้บริหารได้รับอีเมลที่เป็นอันตรายซึ่งพยายามหลอกลวงพวกเขา ผู้โจมตีมักกำลังพยายามทำการโจมตีแบบ whaling Whaling เป็นประเภทหนึ่งของ spear phishing และในทางกลับกัน spear phishing ก็เป็นประเภทหนึ่งของ phishing"}, {"id": 378, "dom": 4, "question": "What does redundancy mean in the context of cybersecurity?", "options": ["Designing systems with robust components, so that the organization has more attack resilience", "Conceiving systems with only the most necessary components, so that the organization has just the necessary risks. github.com/ayemunhossain", "Conceiving systems with less attack surface, so that the attacker has less chance of success", "Conceiving systems with duplicate components so that, if a failure occurs, there will be a backup"], "correct_idx": 3, "explanation": "In cybersecurity, redundancy refers to conceiving systems for resilience with duplicate components so that, if a failure occurs, the redundant component will take over and maintain operations, thereby helping to prevent outages or other disruptions (see ISC2 Study Guide, chapter 4, module 3). Examples of this are redundant servers, redundant network links, and redundant power supplies. Redundancy is also effective against attacks, since the attacked nodes can be quarantined and then replaced by", "short_explanation_en": "In cybersecurity, redundancy refers to conceiving systems for resilience with duplicate components so that, if a failure occurs, the redundant component will take over and maintain operations, thereby helping to prevent outages or other...", "question_th": "คำว่า redundancy หมายถึงอะไรในบริบทของความปลอดภัยไซเบอร์?", "options_th": ["การออกแบบระบบด้วยองค์ประกอบที่แข็งแกร่ง เพื่อให้องค์กรมีความยืดหยุ่นต่อการโจมตีมากขึ้น", "การสร้างระบบด้วยองค์ประกอบที่จำเป็นที่สุดเท่านั้น เพื่อให้องค์กรมีความเสี่ยงเท่าที่จำเป็นเท่านั้น", "การสร้างระบบด้วยพื้นผิวการโจมตีที่น้อยลง เพื่อให้ผู้โจมตีมีโอกาสประสบความสำเร็จน้อยลง", "การสร้างระบบด้วยองค์ประกอบที่ซ้ำกัน เพื่อให้หากเกิดความล้มเหลว จะมีระบบสำรอง"], "explanation_th": "ในความปลอดภัยไซเบอร์ redundancy หมายถึงการสร้างระบบเพื่อความยืดหยุ่นด้วยองค์ประกอบที่ซ้ำกัน เพื่อให้หากเกิดความล้มเหลว องค์ประกอบสำรองจะเข้ามาแทนที่และรักษาการดำเนินงานต่อไป ช่วยป้องกันการหยุดทำงานหรือการหยุดชะงักอื่น ๆ"}, {"id": 379, "dom": 5, "question": "When a company collects PII, which policy is required?", "options": ["Remote Access Policy", "GDPR", "Privacy Policy", "Acceptable Use Policy"], "correct_idx": 2, "explanation": "A Privacy Policy outlines the data security mechanisms which ensure that customer data is protected; namely, how Personal Identifiable Information (PII) is collected, stored and processed (see ISC2 Study Guide, chapter 5, module 3). The General Data Protection Regulation (GDPR) is a data protection and privacy regulation for the European Union and the European Economic Area (not a policy). An Acceptable Use Policy (AUP) defines the guidelines and limitations that users must agree on while access", "short_explanation_en": "A Privacy Policy outlines the data security mechanisms which ensure that customer data is protected; namely, how Personal Identifiable Information (PII) is collected, stored and processed (see ISC2 Study Guide, chapter 5, module 3).", "question_th": "เมื่อบริษัทเก็บรวบรวม PII ต้องมีนโยบายใด?", "options_th": ["Remote Access Policy", "GDPR", "Privacy Policy", "Acceptable Use Policy"], "explanation_th": "Privacy Policy ระบุกลไกความปลอดภัยของข้อมูลที่รับประกันว่าข้อมูลลูกค้าได้รับการปกป้อง กล่าวคือ วิธีที่ Personal Identifiable Information (PII) ถูกเก็บรวบรวม จัดเก็บ และประมวลผล GDPR เป็นกฎระเบียบด้านการปกป้องข้อมูลและความเป็นส่วนตัวสำหรับสหภาพยุโรป (ไม่ใช่นโยบาย)"}, {"id": 380, "dom": 4, "question": "Which type of attack PRIMARILY aims to consume all the available resources, thereby making an organization's service inaccessible to its intended users?", "options": ["Trojans", "Cross-Site Scripting github.com/ayemunhossain", "Denial of Service", "Phishing"], "correct_idx": 2, "explanation": "A denial of service attack (DoS) compromises the availability of a system or service through a malicious overload of requests, thereby activating safety mechanisms that delay or limit the availability of that system or service. As a result, systems or services become temporarily inaccessible to their intended users (see ISC2 Study Guide, chapter 4, module 2). Trojans, phishing and cross-site scripting attacks try to gain access to the system or data covertly, and therefore do not primarily aim a", "short_explanation_en": "A denial of service attack (DoS) compromises the availability of a system or service through a malicious overload of requests, thereby activating safety mechanisms that delay or limit the availability of that system or service.", "question_th": "การโจมตีประเภทใดที่มีเป้าหมายหลักในการใช้ทรัพยากรที่มีอยู่ทั้งหมด ทำให้บริการขององค์กรไม่สามารถเข้าถึงได้สำหรับผู้ใช้ที่ตั้งใจไว้?", "options_th": ["Trojans", "Cross-Site Scripting", "Denial of Service", "Phishing"], "explanation_th": "การโจมตีแบบ denial of service (DoS) เกี่ยวข้องกับการทำให้ availability ของระบบหรือบริการถูกบุกรุกผ่านการท่วมคำขอที่เป็นอันตราย ก่อให้เกิดการเปิดใช้กลไกความปลอดภัยที่ทำให้ availability ของระบบหรือบริการล่าช้าหรือจำกัด"}, {"id": 381, "dom": 4, "question": "Which one of these tools is MOST likely to detect an XSS vulnerability?", "options": ["Network vulnerability scanner", "Static application test", "Intrusion detection system", "Web application vulnerability scanner"], "correct_idx": 3, "explanation": "Intrusion detection systems are designed to detect attacks, not vulnerabilities. The remaining three tools could all possibly discover cross-site scripting (XSS) vulnerabilities. However, a web application vulnerability scanner is the one that's most likely to detect it, since it is specifically designed to test web applications (see ISC2 Study Guide, chapter 4, module 3).", "short_explanation_en": "Intrusion detection systems are designed to detect attacks, not vulnerabilities.", "question_th": "เครื่องมือใดต่อไปนี้มีแนวโน้มมากที่สุดที่จะตรวจจับช่องโหว่ XSS?", "options_th": ["Network vulnerability scanner", "Static application test", "Intrusion detection system", "Web application vulnerability scanner"], "explanation_th": "Intrusion detection systems ถูกออกแบบมาเพื่อตรวจจับการโจมตี ไม่ใช่ช่องโหว่ เครื่องมืออีกสามชนิดที่เหลือทั้งหมดสามารถค้นพบช่องโหว่ cross-site scripting (XSS) ได้ อย่างไรก็ตาม web application vulnerability scanner เป็นเครื่องมือที่มีแนวโน้มมากที่สุดที่จะตรวจจับได้ เนื่องจากถูกออกแบบมาโดยเฉพาะเพื่อทดสอบเว็บแอปพลิเคชัน"}, {"id": 382, "dom": 3, "question": "Which kind of physical access control is LESS effective at preventing unauthorized individual access to a data center?", "options": ["Turnstiles", "Barriers", "Fences", "Bollards github.com/ayemunhossain"], "correct_idx": 3, "explanation": "Bollards are short, vertical posts that block vehicles from accessing a data center. They are, however, ineffective at preventing access to individuals. Fences can be placed around the perimeter of the data center, so as to block unauthorized access and deter potential intruders. Barriers such as gates, walls or barricades can be used to block access to the data center. Finally, turnstiles can be used to control access to a data center, namely by allowing entry only to authorized individuals.", "short_explanation_en": "Bollards are short, vertical posts that block vehicles from accessing a data center.", "question_th": "การควบคุมการเข้าถึงทางกายภาพประเภทใดมีประสิทธิภาพน้อยกว่าในการป้องกันการเข้าถึงศูนย์ข้อมูลของบุคคลที่ไม่ได้รับอนุญาต?", "options_th": ["Turnstiles", "สิ่งกีดขวาง", "รั้ว", "Bollards"], "explanation_th": "Bollards คือเสาแนวตั้งขนาดสั้นที่ปิดกั้นไม่ให้ยานพาหนะเข้าถึงศูนย์ข้อมูล อย่างไรก็ตาม ไม่มีประสิทธิภาพในการป้องกันการเข้าถึงของบุคคล รั้วสามารถวางไว้รอบขอบเขตของศูนย์ข้อมูลเพื่อปิดกั้นการเข้าถึงโดยไม่ได้รับอนุญาตและยับยั้งผู้บุกรุกที่อาจเกิดขึ้น"}, {"id": 383, "dom": 4, "question": "Which of these is NOT a type of malware?", "options": ["Trojan", "Worm", "Spoofing", "Rootkit"], "correct_idx": 2, "explanation": "Spoofing is not a type of malware. Spoofing is an attack whose primary goal is to gain access to a target system through a falsified identity (see ISC2 Study Guide, chapter 4, module 2). Trojans, rootkits and worms are all different types of malware. A Trojan is a type of malware that disguises itself as a legitimate program or file. A Rootkit is a type of malware that hides itself to go unnoticed in the compromised system, or in the victim's computer. A Worm is a type of malware designed to rep", "short_explanation_en": "Spoofing is not a type of malware. Spoofing is an attack whose primary goal is to gain access to a target system through a falsified identity (see ISC2 Study Guide, chapter 4, module 2).", "question_th": "ข้อใดต่อไปนี้ไม่ใช่ประเภทของมัลแวร์?", "options_th": ["Trojan", "Worm", "Spoofing", "Rootkit"], "explanation_th": "Spoofing ไม่ใช่ประเภทของมัลแวร์ Spoofing คือการโจมตีที่มีเป้าหมายหลักในการเข้าถึงระบบเป้าหมายผ่านตัวตนที่ปลอมแปลง Trojans, rootkits และ worms ล้วนเป็นมัลแวร์ประเภทต่าง ๆ"}, {"id": 384, "dom": 1, "question": "Which of the following is NOT part of the CIA Triad?", "options": ["Confidentiality", "Availability", "Authentication", "Integrity"], "correct_idx": 2, "explanation": "The CIA Triad consists only of Confidentiality, Integrity, and Availability. Authentication is a supporting mechanism for CIA but is not one of the three core pillars.", "short_explanation_en": "The CIA Triad consists only of Confidentiality, Integrity, and Availability. Authentication is a supporting mechanism for CIA but is not one of the three core pillars.", "question_th": "องค์ประกอบใดไม่ใช่ส่วนหนึ่งของ CIA Triad?", "options_th": ["Confidentiality", "Availability", "Authentication", "Integrity"], "explanation_th": "CIA Triad ประกอบด้วย Confidentiality (การรักษาความลับ), Integrity (ความถูกต้องครบถ้วน) และ Availability (ความพร้อมใช้งาน) เท่านั้น ส่วน Authentication เป็นกลไกที่สนับสนุน CIA แต่ไม่ใช่หนึ่งในสามเสาหลัก"}, {"id": 385, "dom": 1, "question": "Data being altered without authorization during transmission is a violation of which principle?", "options": ["Availability", "Non-repudiation", "Confidentiality", "Integrity"], "correct_idx": 3, "explanation": "Integrity refers to the accuracy and completeness of data. Unauthorized modification of data is a direct violation of Integrity.", "short_explanation_en": "Integrity refers to the accuracy and completeness of data. Unauthorized modification of data is a direct violation of Integrity.", "question_th": "การที่ข้อมูลถูกแก้ไขโดยไม่ได้รับอนุญาตระหว่างการส่ง ถือเป็นการละเมิดหลักการใด?", "options_th": ["Availability", "Non-repudiation", "Confidentiality", "Integrity"], "explanation_th": "Integrity หมายถึงความถูกต้องครบถ้วนของข้อมูล การแก้ไขข้อมูลโดยไม่ได้รับอนุญาตคือการละเมิด Integrity โดยตรง"}, {"id": 386, "dom": 1, "question": "A server is hit by a DDoS attack, preventing users from accessing the service. Which principle is being violated?", "options": ["Availability", "Confidentiality", "Integrity", "Accountability"], "correct_idx": 0, "explanation": "DDoS prevents the system from providing normal service, which is a violation of the Availability principle.", "short_explanation_en": "DDoS prevents the system from providing normal service, which is a violation of the Availability principle.", "question_th": "เซิร์ฟเวอร์ถูกโจมตีแบบ DDoS จนผู้ใช้ไม่สามารถเข้าถึงบริการได้ นี่คือการละเมิดหลักการใด?", "options_th": ["Availability", "Confidentiality", "Integrity", "Accountability"], "explanation_th": "DDoS ทำให้ระบบไม่สามารถให้บริการได้ตามปกติ จึงเป็นการละเมิดหลักการ Availability (ความพร้อมใช้งาน)"}, {"id": 387, "dom": 1, "question": "What does IAAA stand for in the context of information security?", "options": ["Identification, Authentication, Authorization, Accountability", "Integrity, Access, Audit, Availability", "Identification, Access, Audit, Authentication", "Integration, Authentication, Authorization, Availability"], "correct_idx": 0, "explanation": "IAAA is a foundational access control concept consisting of: Identification, Authentication, Authorization, and Accountability.", "short_explanation_en": "IAAA is a foundational access control concept consisting of: Identification, Authentication, Authorization, and Accountability.", "question_th": "IAAA ในบริบทความปลอดภัยสารสนเทศย่อมาจากอะไร?", "options_th": ["Identification, Authentication, Authorization, Accountability", "Integrity, Access, Audit, Availability", "Identification, Access, Audit, Authentication", "Integration, Authentication, Authorization, Availability"], "explanation_th": "IAAA คือแนวคิดพื้นฐานของการควบคุมการเข้าถึง ได้แก่ Identification (ระบุตัวตน), Authentication (ยืนยันตัวตน), Authorization (กำหนดสิทธิ์) และ Accountability (ความรับผิดชอบตรวจสอบย้อนกลับได้)"}, {"id": 388, "dom": 1, "question": "Which is the correct description of 'Non-repudiation'?", "options": ["Encrypting data during transmission", "Preventing a sender from denying they sent a message", "Restricting access rights based on role", "Backing up data for availability"], "correct_idx": 1, "explanation": "Non-repudiation is a property that prevents a sender or actor from denying their actions - for example, through the use of digital signatures.", "short_explanation_en": "Non-repudiation is a property that prevents a sender or actor from denying their actions - for example, through the use of digital signatures.", "question_th": "ข้อใดคือคำอธิบายที่ถูกต้องของ 'Non-repudiation'?", "options_th": ["การเข้ารหัสข้อมูลระหว่างการส่ง", "การป้องกันไม่ให้ผู้ส่งปฏิเสธว่าไม่ได้ส่งข้อความ", "การจำกัดสิทธิ์การเข้าถึงตามบทบาท", "การสำรองข้อมูลเพื่อความพร้อมใช้งาน"], "explanation_th": "Non-repudiation คือคุณสมบัติที่ทำให้ผู้ส่งหรือผู้กระทำการไม่สามารถปฏิเสธการกระทำของตนได้ เช่น การใช้ลายเซ็นดิจิทัล"}, {"id": 389, "dom": 1, "question": "What is the purpose of a 'Preventive' security control category?", "options": ["Detecting events after they occur", "Stopping undesirable events before they happen", "Restoring systems after an incident", "Deterring attackers psychologically"], "correct_idx": 1, "explanation": "Preventive controls aim to stop undesirable events from occurring in the first place, such as firewalls and encryption.", "short_explanation_en": "Preventive controls aim to stop undesirable events from occurring in the first place, such as firewalls and encryption.", "question_th": "การจัดประเภทควบคุมความปลอดภัยแบบ 'Preventive' มีวัตถุประสงค์เพื่ออะไร?", "options_th": ["ตรวจจับเหตุการณ์หลังเกิดขึ้น", "หยุดยั้งเหตุการณ์ไม่พึงประสงค์ก่อนเกิดขึ้น", "ฟื้นฟูระบบหลังเกิดเหตุ", "ยับยั้งผู้โจมตีทางจิตวิทยา"], "explanation_th": "Preventive control มีเป้าหมายเพื่อป้องกันไม่ให้เหตุการณ์ไม่พึงประสงค์เกิดขึ้นตั้งแต่แรก เช่น ไฟร์วอลล์ การเข้ารหัส"}, {"id": 390, "dom": 1, "question": "CCTV cameras installed to record abnormal events are primarily classified as which type of control?", "options": ["Corrective", "Detective", "Preventive", "Compensating"], "correct_idx": 1, "explanation": "CCTV is used to detect and record events as they happen, making it a Detective control, though it may also have a secondary deterrent effect.", "short_explanation_en": "CCTV is used to detect and record events as they happen, making it a Detective control, though it may also have a secondary deterrent effect.", "question_th": "กล้องวงจรปิด (CCTV) ที่ติดตั้งเพื่อบันทึกเหตุการณ์ผิดปกติ จัดเป็นการควบคุมประเภทใดเป็นหลัก?", "options_th": ["Corrective", "Detective", "Preventive", "Compensating"], "explanation_th": "CCTV ใช้สำหรับตรวจจับและบันทึกเหตุการณ์ที่เกิดขึ้น จึงจัดเป็น Detective control แม้บางครั้งอาจมีผลยับยั้งทางจิตวิทยาด้วย"}, {"id": 391, "dom": 1, "question": "A warning sign reading 'This area is under CCTV surveillance', intended to discourage wrongdoers from entering, is classified as which type of control?", "options": ["Deterrent", "Detective", "Corrective", "Recovery"], "correct_idx": 0, "explanation": "A Deterrent control aims to discourage or make a wrongdoer hesitant to act, rather than providing direct technical prevention.", "short_explanation_en": "A Deterrent control aims to discourage or make a wrongdoer hesitant to act, rather than providing direct technical prevention.", "question_th": "ป้ายเตือน 'พื้นที่มีกล้องวงจรปิด' ที่ติดไว้เพื่อไม่ให้ผู้ไม่หวังดีเข้ามา จัดเป็นการควบคุมประเภทใด?", "options_th": ["Deterrent", "Detective", "Corrective", "Recovery"], "explanation_th": "Deterrent control มีเป้าหมายเพื่อยับยั้งหรือทำให้ผู้ไม่หวังดีลังเลที่จะกระทำการ ไม่ใช่การป้องกันทางเทคนิคโดยตรง"}, {"id": 392, "dom": 1, "question": "Restoring a system from backup after a ransomware attack is classified as which type of control?", "options": ["Preventive", "Detective", "Corrective", "Deterrent"], "correct_idx": 2, "explanation": "A Corrective control's role is to fix and restore a system to its normal state after an undesirable event has occurred.", "short_explanation_en": "A Corrective control's role is to fix and restore a system to its normal state after an undesirable event has occurred.", "question_th": "การกู้คืนระบบจากแบ็กอัพหลังถูกแรนซัมแวร์โจมตี จัดเป็นการควบคุมประเภทใด?", "options_th": ["Preventive", "Detective", "Corrective", "Deterrent"], "explanation_th": "Corrective control มีหน้าที่แก้ไขและฟื้นฟูระบบให้กลับสู่สภาวะปกติหลังเกิดเหตุการณ์ไม่พึงประสงค์"}, {"id": 393, "dom": 1, "question": "How does a security Policy differ from a Procedure?", "options": ["Policy is specific technical instructions, while Procedure is a broad concept", "Policy sets high-level direction and mandatory requirements, while Procedure specifies detailed operational steps", "Both are the same document and are interchangeable", "Policy applies only to IT, while Procedure applies organization-wide"], "correct_idx": 1, "explanation": "A Policy is a high-level document defining an organization's intent and mandatory requirements, while a Procedure provides detailed step-by-step instructions to achieve that Policy.", "short_explanation_en": "A Policy is a high-level document defining an organization's intent and mandatory requirements, while a Procedure provides detailed step-by-step instructions to achieve that Policy.", "question_th": "นโยบายรักษาความปลอดภัย (Policy) แตกต่างจากขั้นตอนปฏิบัติ (Procedure) อย่างไร?", "options_th": ["Policy เป็นคำสั่งทางเทคนิคเฉพาะ ส่วน Procedure เป็นแนวคิดกว้าง", "Policy กำหนดทิศทางระดับสูงและข้อบังคับ ส่วน Procedure ระบุขั้นตอนปฏิบัติโดยละเอียด", "ทั้งสองอย่างเป็นเอกสารเดียวกัน ใช้แทนกันได้", "Policy ใช้เฉพาะฝ่าย IT ส่วน Procedure ใช้ทั้งองค์กร"], "explanation_th": "Policy คือเอกสารระดับสูงที่กำหนดเจตนารมณ์และข้อบังคับขององค์กร ส่วน Procedure คือคำแนะนำแบบเป็นขั้นตอนที่ละเอียดเพื่อให้บรรลุ Policy นั้น"}, {"id": 394, "dom": 1, "question": "What type of document provides 'should-do' recommendations but is not mandatory like a Policy?", "options": ["Standard", "Guideline", "Procedure", "Baseline"], "correct_idx": 1, "explanation": "A Guideline is flexible, non-mandatory advice unlike a Standard or Policy, but provides good practice direction.", "short_explanation_en": "A Guideline is flexible, non-mandatory advice unlike a Standard or Policy, but provides good practice direction.", "question_th": "เอกสารประเภทใดที่ให้คำแนะนำแบบ 'ควรทำ' แต่ไม่ได้บังคับเหมือน Policy?", "options_th": ["Standard", "Guideline", "Procedure", "Baseline"], "explanation_th": "Guideline คือคำแนะนำที่ยืดหยุ่น ไม่บังคับเคร่งครัดเหมือน Standard หรือ Policy แต่ให้แนวทางปฏิบัติที่ดี"}, {"id": 395, "dom": 1, "question": "What characterizes a 'Standard' in the security document hierarchy?", "options": ["A mandatory requirement specifying particular details to support a Policy", "A broad executive-level concept", "Optional advice one may or may not follow", "A post-incident record"], "correct_idx": 0, "explanation": "A Standard is a mandatory requirement that specifies particular details - such as requiring a minimum password length of 12 characters - to support compliance with a Policy.", "short_explanation_en": "A Standard is a mandatory requirement that specifies particular details - such as requiring a minimum password length of 12 characters - to support compliance with a Policy.", "question_th": "'Standard' ในลำดับชั้นเอกสารด้านความปลอดภัยมีลักษณะอย่างไร?", "options_th": ["เป็นข้อกำหนดบังคับที่ระบุรายละเอียดเฉพาะเจาะจงเพื่อสนับสนุน Policy", "เป็นแนวคิดกว้างระดับผู้บริหาร", "เป็นคำแนะนำที่เลือกทำหรือไม่ทำก็ได้", "เป็นบันทึกเหตุการณ์หลังเกิดปัญหา"], "explanation_th": "Standard คือข้อกำหนดที่บังคับใช้และระบุรายละเอียดเฉพาะ เช่น ต้องใช้รหัสผ่านความยาวขั้นต่ำ 12 ตัวอักษร เพื่อให้สอดคล้องกับ Policy"}, {"id": 396, "dom": 1, "question": "What does the 'Least Privilege' principle mean?", "options": ["Giving all users equal permissions", "Giving only the permissions necessary to perform a job function", "Giving maximum privileges to all administrators", "Restricting permissions only during daytime hours"], "correct_idx": 1, "explanation": "Least Privilege means granting access only to the extent necessary for a person's job duties, reducing risk if an account is compromised or misused.", "short_explanation_en": "Least Privilege means granting access only to the extent necessary for a person's job duties, reducing risk if an account is compromised or misused.", "question_th": "หลักการ 'Least Privilege' หมายถึงอะไร?", "options_th": ["ให้สิทธิ์ผู้ใช้ทุกคนเท่ากันหมด", "ให้สิทธิ์เท่าที่จำเป็นต่อการปฏิบัติหน้าที่เท่านั้น", "ให้สิทธิ์สูงสุดแก่ผู้ดูแลระบบทุกคน", "จำกัดสิทธิ์เฉพาะช่วงเวลากลางวัน"], "explanation_th": "Least Privilege คือการให้สิทธิ์การเข้าถึงเท่าที่จำเป็นต่อการทำงานเท่านั้น เพื่อลดความเสี่ยงหากบัญชีถูกโจมตีหรือใช้งานผิดวัตถุประสงค์"}, {"id": 397, "dom": 1, "question": "What is the primary goal of the 'Separation of Duties' principle?", "options": ["Reduce operational costs", "Prevent fraud by dividing critical tasks among multiple people", "Speed up work approvals", "Allow employees to perform multiple duties simultaneously"], "correct_idx": 1, "explanation": "Separation of Duties splits high-risk or critical tasks among different people so no single individual has full control over a process, reducing the chance of fraud or error.", "short_explanation_en": "Separation of Duties splits high-risk or critical tasks among different people so no single individual has full control over a process, reducing the chance of fraud or error.", "question_th": "หลักการ 'Separation of Duties' มีเป้าหมายหลักเพื่ออะไร?", "options_th": ["ลดต้นทุนการดำเนินงาน", "ป้องกันการทุจริตโดยแบ่งงานสำคัญให้หลายคนรับผิดชอบ", "เพิ่มความเร็วในการอนุมัติงาน", "ให้พนักงานทำงานได้หลายหน้าที่พร้อมกัน"], "explanation_th": "Separation of Duties แบ่งงานที่มีความเสี่ยงสูงหรือสำคัญออกเป็นหลายส่วนให้คนละคนรับผิดชอบ เพื่อไม่ให้บุคคลเดียวมีอำนาจควบคุมกระบวนการทั้งหมด ลดโอกาสทุจริตหรือความผิดพลาด"}, {"id": 398, "dom": 1, "question": "What concept does 'Defense in Depth' represent?", "options": ["Using a single strongest layer of security", "Using multiple layered security measures for holistic protection", "Encrypting all types of data", "Outsourcing security to a third party"], "correct_idx": 1, "explanation": "Defense in Depth involves layering multiple protective measures (physical, technical, and administrative) so the system doesn't fail entirely if one layer is breached.", "short_explanation_en": "Defense in Depth involves layering multiple protective measures (physical, technical, and administrative) so the system doesn't fail entirely if one layer is breached.", "question_th": "'Defense in Depth' คือแนวคิดใด?", "options_th": ["การใช้มาตรการรักษาความปลอดภัยเพียงชั้นเดียวที่แข็งแกร่งที่สุด", "การใช้มาตรการรักษาความปลอดภัยหลายชั้นซ้อนกันเพื่อสร้างความปลอดภัยแบบองค์รวม", "การเข้ารหัสข้อมูลทุกประเภท", "การจ้างบุคคลภายนอกดูแลความปลอดภัย"], "explanation_th": "Defense in Depth คือการวางมาตรการป้องกันหลายชั้น (เช่น กายภาพ เทคนิค และการบริหารจัดการ) เพื่อไม่ให้ระบบล้มเหลวทั้งหมดหากชั้นใดชั้นหนึ่งถูกทะลุผ่าน"}, {"id": 399, "dom": 1, "question": "What is the best definition of 'Risk' in an information security context?", "options": ["An unresolved system weakness", "A source of danger that may cause harm", "The likelihood that a threat will exploit a vulnerability and cause harm", "A measure used to reduce the impact of a threat"], "correct_idx": 2, "explanation": "Risk is the combination of likelihood - that a Threat will exploit a Vulnerability - and the resulting Impact that could occur.", "short_explanation_en": "Risk is the combination of likelihood - that a Threat will exploit a Vulnerability - and the resulting Impact that could occur.", "question_th": "'Risk' ในบริบทความปลอดภัยสารสนเทศ นิยามได้ดีที่สุดว่าอย่างไร?", "options_th": ["จุดอ่อนของระบบที่ยังไม่ได้แก้ไข", "แหล่งที่มาของอันตรายที่อาจก่อความเสียหาย", "ความน่าจะเป็นที่ภัยคุกคามจะใช้ประโยชน์จากช่องโหว่และก่อให้เกิดความเสียหาย", "มาตรการที่ใช้ลดผลกระทบจากภัยคุกคาม"], "explanation_th": "Risk คือการรวมกันของความน่าจะเป็น (Likelihood) ที่ Threat จะใช้ประโยชน์จาก Vulnerability และผลกระทบ (Impact) ที่อาจเกิดขึ้น"}, {"id": 400, "dom": 1, "question": "What does 'Vulnerability' mean?", "options": ["A malicious attacker", "A weakness or flaw in a system that could be exploited", "Financial damage that has already occurred", "A control used to prevent threats"], "correct_idx": 1, "explanation": "A Vulnerability is a weakness or gap in a system, process, or control that a Threat could exploit to cause harm.", "short_explanation_en": "A Vulnerability is a weakness or gap in a system, process, or control that a Threat could exploit to cause harm.", "question_th": "'Vulnerability' หมายถึงอะไร?", "options_th": ["ผู้โจมตีที่มีเจตนาร้าย", "จุดอ่อนหรือช่องโหว่ในระบบที่อาจถูกใช้ประโยชน์", "ความเสียหายทางการเงินที่เกิดขึ้นแล้ว", "มาตรการควบคุมที่ใช้ป้องกันภัยคุกคาม"], "explanation_th": "Vulnerability คือจุดอ่อนหรือช่องโหว่ในระบบ กระบวนการ หรือการควบคุม ที่อาจถูก Threat ใช้ประโยชน์เพื่อก่อความเสียหาย"}, {"id": 401, "dom": 1, "question": "Which of these is NOT one of the four main risk treatment approaches?", "options": ["Risk Avoidance", "Risk Transfer", "Risk Acceptance", "Risk Elimination"], "correct_idx": 3, "explanation": "The four main risk treatment approaches are Avoid, Transfer (e.g., via insurance), Mitigate (reduce risk), and Accept. 'Risk Elimination' isn't a standard term, since no risk can ever be reduced to 100% zero.", "short_explanation_en": "The four main risk treatment approaches are Avoid, Transfer (e.g., via insurance), Mitigate (reduce risk), and Accept. 'Risk Elimination' isn't a standard term, since no risk can ever be reduced to 100% zero.", "question_th": "แนวทางการจัดการความเสี่ยง (Risk Treatment) ข้อใด 'ไม่ใช่' หนึ่งในสี่แนวทางหลัก?", "options_th": ["Risk Avoidance", "Risk Transfer", "Risk Acceptance", "Risk Elimination"], "explanation_th": "แนวทางหลักในการจัดการความเสี่ยงมี 4 อย่างคือ Avoid (หลีกเลี่ยง), Transfer (โอนย้าย เช่น ทำประกัน), Mitigate (ลดความเสี่ยง) และ Accept (ยอมรับ) ส่วน 'Risk Elimination' ไม่ใช่คำศัพท์มาตรฐานเพราะไม่มีความเสี่ยงใดถูกกำจัดได้ 100%"}, {"id": 402, "dom": 1, "question": "How do 'Due Diligence' and 'Due Care' differ?", "options": ["The two terms mean exactly the same thing", "Due Diligence is researching and assessing risk before a decision, while Due Care is continuously acting on reasonable standards afterward", "Due Diligence applies only to finance, Due Care only to IT", "Due Care always happens before Due Diligence"], "correct_idx": 1, "explanation": "Due Diligence is the process of researching, analyzing, and assessing risk before making a decision, while Due Care is continuously following reasonable measures afterward to prevent harm.", "short_explanation_en": "Due Diligence is the process of researching, analyzing, and assessing risk before making a decision, while Due Care is continuously following reasonable measures afterward to prevent harm.", "question_th": "'Due Diligence' และ 'Due Care' แตกต่างกันอย่างไร?", "options_th": ["ทั้งสองคำมีความหมายเหมือนกันทุกประการ", "Due Diligence คือการค้นคว้าและประเมินความเสี่ยงก่อนตัดสินใจ ส่วน Due Care คือการลงมือปฏิบัติตามมาตรฐานที่เหมาะสมอย่างต่อเนื่อง", "Due Diligence ใช้เฉพาะด้านการเงิน ส่วน Due Care ใช้เฉพาะด้าน IT", "Due Care เกิดขึ้นก่อน Due Diligence เสมอ"], "explanation_th": "Due Diligence คือขั้นตอนการค้นคว้า วิเคราะห์ และประเมินความเสี่ยงก่อนตัดสินใจ ส่วน Due Care คือการปฏิบัติตามมาตรการที่สมเหตุสมผลอย่างต่อเนื่องเพื่อป้องกันความเสียหาย"}, {"id": 403, "dom": 1, "question": "According to the (ISC)² Code of Ethics, what is the very first canon that members must uphold?", "options": ["Protect the employer's interests above all else", "Protect society, the common good, necessary public trust and confidence, and the infrastructure", "Continuously advance one's own technical knowledge", "Strictly maintain organizational confidentiality"], "correct_idx": 1, "explanation": "The first canon of the (ISC)² Code of Ethics is 'Protect society, the common good, necessary public trust and confidence, and the infrastructure' - considered the highest priority.", "short_explanation_en": "The first canon of the (ISC)² Code of Ethics is 'Protect society, the common good, necessary public trust and confidence, and the infrastructure' - considered the highest priority.", "question_th": "ตามหลัก (ISC)² Code of Ethics ข้อบังคับข้อแรกสุดที่สมาชิกต้องยึดถือคืออะไร?", "options_th": ["ปกป้องผลประโยชน์ของนายจ้างเป็นอันดับแรก", "ปกป้องสังคม สาธารณประโยชน์ ความไว้วางใจของสาธารณะ และโครงสร้างพื้นฐาน", "เพิ่มพูนความรู้ทางเทคนิคของตนเองอย่างต่อเนื่อง", "รักษาความลับขององค์กรอย่างเคร่งครัด"], "explanation_th": "Canon แรกของ (ISC)² Code of Ethics คือ 'Protect society, the common good, necessary public trust and confidence, and the infrastructure' ซึ่งถือเป็นลำดับความสำคัญสูงสุด"}, {"id": 404, "dom": 1, "question": "What is the fundamental concept behind the 'Zero Trust' principle?", "options": ["Automatically trust users within the organization's network", "Trust nothing implicitly - verify everything every time, inside or outside the network", "Allow full access after the initial login", "Applies only to devices connected via VPN"], "correct_idx": 1, "explanation": "Zero Trust follows the principle of 'Never trust, always verify' - no user or device is automatically trusted, and identity/authorization must be continuously verified for every resource request.", "short_explanation_en": "Zero Trust follows the principle of 'Never trust, always verify' - no user or device is automatically trusted, and identity/authorization must be continuously verified for every resource request.", "question_th": "หลักการ 'Zero Trust' มีแนวคิดพื้นฐานอย่างไร?", "options_th": ["เชื่อถือผู้ใช้ภายในเครือข่ายองค์กรโดยอัตโนมัติ", "ไม่เชื่อถือสิ่งใดโดยปริยาย ต้องตรวจสอบยืนยันทุกครั้งไม่ว่าจะอยู่ในหรือนอกเครือข่าย", "อนุญาตการเข้าถึงทั้งหมดหลังผ่านการล็อกอินครั้งแรก", "ใช้เฉพาะกับอุปกรณ์ที่เชื่อมต่อ VPN เท่านั้น"], "explanation_th": "Zero Trust ยึดหลัก 'Never trust, always verify' คือไม่ไว้วางใจผู้ใช้หรืออุปกรณ์ใดโดยอัตโนมัติ ต้องมีการยืนยันตัวตนและตรวจสอบสิทธิ์อย่างต่อเนื่องทุกครั้งที่มีการร้องขอเข้าถึงทรัพยากร"}, {"id": 405, "dom": 1, "question": "What is the primary purpose of Data Classification?", "options": ["Increase data processing speed", "Set an appropriate protection level based on data's importance and sensitivity", "Reduce file size", "Make data accessible from anywhere"], "correct_idx": 1, "explanation": "Data classification helps an organization set appropriate controls - such as encryption or access restriction - based on data sensitivity levels like Public, Internal, Confidential, or Restricted.", "short_explanation_en": "Data classification helps an organization set appropriate controls - such as encryption or access restriction - based on data sensitivity levels like Public, Internal, Confidential, or Restricted.", "question_th": "การจัดประเภทข้อมูล (Data Classification) มีวัตถุประสงค์หลักเพื่ออะไร?", "options_th": ["เพิ่มความเร็วในการประมวลผลข้อมูล", "กำหนดระดับการป้องกันที่เหมาะสมตามความสำคัญและความอ่อนไหวของข้อมูล", "ลดขนาดไฟล์ข้อมูล", "ทำให้ข้อมูลสามารถเข้าถึงได้จากทุกที่"], "explanation_th": "การจัดประเภทข้อมูลช่วยให้องค์กรกำหนดมาตรการควบคุมที่เหมาะสม เช่น การเข้ารหัสหรือการจำกัดสิทธิ์ ตามระดับความอ่อนไหวของข้อมูล เช่น Public, Internal, Confidential, Restricted"}, {"id": 406, "dom": 1, "question": "Which is the best description of 'Insider Threat'?", "options": ["An external attacker using malware", "A person within the organization, such as an employee, who may cause harm intentionally or unintentionally", "Software installed without authorization", "An unpatched vulnerability"], "correct_idx": 1, "explanation": "An Insider Threat comes from someone within the organization who already has legitimate access, whether from negligence, dissatisfaction, or malicious intent.", "short_explanation_en": "An Insider Threat comes from someone within the organization who already has legitimate access, whether from negligence, dissatisfaction, or malicious intent.", "question_th": "ข้อใดอธิบาย 'Insider Threat' ได้ถูกต้องที่สุด?", "options_th": ["ผู้โจมตีจากภายนอกที่ใช้มัลแวร์", "บุคคลภายในองค์กร เช่น พนักงาน ที่อาจก่อความเสียหายโดยตั้งใจหรือไม่ตั้งใจ", "ซอฟต์แวร์ที่ติดตั้งโดยไม่ได้รับอนุญาต", "ช่องโหว่ที่ยังไม่มีแพตช์แก้ไข"], "explanation_th": "Insider Threat คือภัยคุกคามที่มาจากบุคคลภายในองค์กรซึ่งมีสิทธิ์การเข้าถึงอยู่แล้ว อาจเกิดจากความประมาท ความไม่พอใจ หรือเจตนาร้าย"}, {"id": 407, "dom": 1, "question": "What does 'Governance' mean in the context of information security?", "options": ["Encrypting all data across the organization", "An oversight framework that sets direction, policy, and accountability to achieve the organization's security goals", "Installing antivirus software", "A daily data backup process"], "correct_idx": 1, "explanation": "Governance is the high-level oversight structure that defines policy, direction, and responsibility to ensure the organization operates in line with security goals and requirements.", "short_explanation_en": "Governance is the high-level oversight structure that defines policy, direction, and responsibility to ensure the organization operates in line with security goals and requirements.", "question_th": "'Governance' ในบริบทความปลอดภัยสารสนเทศหมายถึงอะไร?", "options_th": ["การเข้ารหัสข้อมูลทั้งหมดในองค์กร", "กรอบการกำกับดูแล กำหนดทิศทาง นโยบาย และความรับผิดชอบเพื่อให้บรรลุเป้าหมายด้านความปลอดภัยขององค์กร", "การติดตั้งซอฟต์แวร์ป้องกันไวรัส", "กระบวนการสำรองข้อมูลรายวัน"], "explanation_th": "Governance คือโครงสร้างการกำกับดูแลระดับสูงที่กำหนดนโยบาย ทิศทาง และความรับผิดชอบ เพื่อให้มั่นใจว่าองค์กรดำเนินงานสอดคล้องกับเป้าหมายและข้อกำหนดด้านความปลอดภัย"}, {"id": 408, "dom": 1, "question": "Which of the following is an example of an 'Administrative Control'?", "options": ["Firewalls", "CCTV cameras", "Security policies and procedures", "Perimeter fencing"], "correct_idx": 2, "explanation": "Administrative (or Managerial) controls relate to policies, procedures, guidelines, and training - distinct from Technical controls (e.g., firewalls) and Physical controls (e.g., fences, cameras).", "short_explanation_en": "Administrative (or Managerial) controls relate to policies, procedures, guidelines, and training - distinct from Technical controls (e.g., firewalls) and Physical controls (e.g., fences, cameras).", "question_th": "ข้อใดคือตัวอย่างของ 'Administrative Control'?", "options_th": ["ไฟร์วอลล์", "กล้องวงจรปิด", "นโยบายและขั้นตอนปฏิบัติงานด้านความปลอดภัย", "รั้วรอบอาคาร"], "explanation_th": "Administrative control (หรือ Managerial control) คือมาตรการที่เกี่ยวข้องกับนโยบาย ขั้นตอน แนวทางปฏิบัติ และการฝึกอบรม ต่างจาก Technical control (เช่นไฟร์วอลล์) และ Physical control (เช่นรั้ว กล้อง)"}, {"id": 409, "dom": 1, "question": "In what situation is a 'Compensating Control' used?", "options": ["When the appropriate primary control cannot be implemented, so an alternative measure is used to reduce risk to an acceptable level", "When an organization wants to cut all security costs", "When there is no risk at all in a system", "When wanting to eliminate all existing controls"], "correct_idx": 0, "explanation": "A Compensating Control is an alternative measure used in place of a standard control when that standard control cannot practically be implemented, in order to still achieve an acceptable level of security.", "short_explanation_en": "A Compensating Control is an alternative measure used in place of a standard control when that standard control cannot practically be implemented, in order to still achieve an acceptable level of security.", "question_th": "'Compensating Control' ถูกนำมาใช้ในสถานการณ์ใด?", "options_th": ["เมื่อไม่สามารถใช้มาตรการควบคุมหลักที่เหมาะสมได้ จึงใช้มาตรการทดแทนเพื่อลดความเสี่ยงในระดับที่ยอมรับได้", "เมื่อองค์กรต้องการลดต้นทุนความปลอดภัยทั้งหมด", "เมื่อไม่มีความเสี่ยงใดๆ ในระบบ", "เมื่อต้องการยกเลิกมาตรการควบคุมเดิมทั้งหมด"], "explanation_th": "Compensating control คือมาตรการทางเลือกที่ใช้แทนมาตรการควบคุมมาตรฐานเมื่อไม่สามารถนำมาตรการนั้นมาใช้ได้จริง เพื่อให้ยังคงบรรลุวัตถุประสงค์ด้านความปลอดภัยในระดับที่ยอมรับได้"}, {"id": 410, "dom": 2, "question": "What does RTO (Recovery Time Objective) mean?", "options": ["The maximum amount of data acceptable to lose", "The maximum acceptable time after an incident to restore the system to operation", "The total time used for backing up all data", "The number of employees needed to recover the system"], "correct_idx": 1, "explanation": "RTO is the maximum time an organization can tolerate before a system or process must be back in service after an outage.", "short_explanation_en": "RTO คือระยะเวลาสูงสุดที่องค์กรยอมรับได้ในการนำระบบหรือกระบวนการกลับมาให้บริการได้อีกครั้งหลังจากเกิดเหตุการณ์ขัดข้อง", "question_th": "'RTO (Recovery Time Objective)' หมายถึงอะไร?", "options_th": ["ปริมาณข้อมูลสูงสุดที่ยอมรับได้ว่าจะสูญหาย", "ระยะเวลาสูงสุดที่ยอมรับได้ในการกู้คืนระบบให้กลับมาใช้งานได้หลังเกิดเหตุขัดข้อง", "ระยะเวลาที่ใช้ในการสำรองข้อมูลทั้งหมด", "จำนวนพนักงานที่ต้องใช้ในการกู้คืนระบบ"], "explanation_th": "RTO คือระยะเวลาสูงสุดที่องค์กรยอมรับได้ในการนำระบบหรือกระบวนการกลับมาให้บริการได้อีกครั้งหลังจากเกิดเหตุการณ์ขัดข้อง"}, {"id": 411, "dom": 2, "question": "What does RPO (Recovery Point Objective) mean?", "options": ["The maximum time to recover the system", "The furthest point back in time to which data loss is acceptable, which determines backup frequency", "The number of backup servers required", "The budget for the recovery plan"], "correct_idx": 1, "explanation": "RPO is the maximum acceptable amount of data loss measured in time - e.g., an RPO of 4 hours means backups must run at least every 4 hours.", "short_explanation_en": "RPO คือระยะเวลาย้อนหลังสูงสุดของข้อมูลที่องค์กรยอมรับได้ว่าจะสูญหาย เช่น หาก RPO คือ 4 ชั่วโมง หมายความว่าต้องสำรองข้อมูลอย่างน้อยทุก 4 ชั่วโมง", "question_th": "'RPO (Recovery Point Objective)' หมายถึงอะไร?", "options_th": ["ระยะเวลาสูงสุดในการกู้คืนระบบ", "จุดเวลาย้อนหลังสูงสุดที่ยอมรับได้สำหรับข้อมูลที่อาจสูญหาย ซึ่งกำหนดความถี่ในการสำรองข้อมูล", "จำนวนเซิร์ฟเวอร์สำรองที่ต้องมี", "งบประมาณสำหรับแผนกู้คืนระบบ"], "explanation_th": "RPO คือระยะเวลาย้อนหลังสูงสุดของข้อมูลที่องค์กรยอมรับได้ว่าจะสูญหาย เช่น หาก RPO คือ 4 ชั่วโมง หมายความว่าต้องสำรองข้อมูลอย่างน้อยทุก 4 ชั่วโมง"}, {"id": 412, "dom": 2, "question": "How does a Business Continuity Plan (BCP) differ from a Disaster Recovery Plan (DRP)?", "options": ["BCP focuses only on restoring IT systems while DRP focuses on overall business processes", "BCP focuses on keeping overall business processes running while DRP focuses specifically on restoring IT systems and technical infrastructure", "Both plans are fully interchangeable in every case", "DRP applies only to natural disasters"], "correct_idx": 1, "explanation": "BCP is the overarching plan covering business continuity as a whole, while DRP is a subset of BCP focused specifically on restoring IT systems and infrastructure.", "short_explanation_en": "BCP เป็นแผนภาพรวมที่ครอบคลุมการดำเนินธุรกิจต่อเนื่องทุกด้าน ในขณะที่ DRP เป็นส่วนย่อยของ BCP ที่มุ่งเน้นเฉพาะการกู้คืนระบบเทคโนโลยีสารสนเทศและโครงสร้างพื้นฐาน", "question_th": "แผน Business Continuity Plan (BCP) แตกต่างจาก Disaster Recovery Plan (DRP) อย่างไร?", "options_th": ["BCP มุ่งเน้นการฟื้นฟูระบบ IT เท่านั้น ส่วน DRP มุ่งเน้นกระบวนการทางธุรกิจโดยรวม", "BCP มุ่งเน้นให้กระบวนการทางธุรกิจดำเนินต่อไปได้ในภาพรวม ส่วน DRP มุ่งเน้นการกู้คืนระบบ IT และโครงสร้างพื้นฐานเทคนิคโดยเฉพาะ", "ทั้งสองแผนใช้แทนกันได้ทุกกรณี", "DRP ใช้เฉพาะภัยธรรมชาติเท่านั้น"], "explanation_th": "BCP เป็นแผนภาพรวมที่ครอบคลุมการดำเนินธุรกิจต่อเนื่องทุกด้าน ในขณะที่ DRP เป็นส่วนย่อยของ BCP ที่มุ่งเน้นเฉพาะการกู้คืนระบบเทคโนโลยีสารสนเทศและโครงสร้างพื้นฐาน"}, {"id": 413, "dom": 2, "question": "Which backup type captures only data changed since the last Full Backup (ignoring any prior Incremental backups)?", "options": ["Full Backup", "Incremental Backup", "Differential Backup", "Mirror Backup"], "correct_idx": 2, "explanation": "A Differential Backup captures all changes made since the last Full Backup, unlike Incremental, which only captures changes since the most recent backup of any type.", "short_explanation_en": "Differential Backup สำรองข้อมูลทั้งหมดที่เปลี่ยนแปลงนับจาก Full Backup ครั้งล่าสุด ต่างจาก Incremental ที่สำรองเฉพาะการเปลี่ยนแปลงตั้งแต่การสำรองครั้งก่อนหน้า (ไม่ว่าจะเป็น Full หรือ Incremental)", "question_th": "Backup แบบใดที่สำรองเฉพาะข้อมูลที่เปลี่ยนแปลงนับตั้งแต่การทำ Full Backup ครั้งล่าสุด (ไม่สนใจ Incremental ก่อนหน้า)?", "options_th": ["Full Backup", "Incremental Backup", "Differential Backup", "Mirror Backup"], "explanation_th": "Differential Backup สำรองข้อมูลทั้งหมดที่เปลี่ยนแปลงนับจาก Full Backup ครั้งล่าสุด ต่างจาก Incremental ที่สำรองเฉพาะการเปลี่ยนแปลงตั้งแต่การสำรองครั้งก่อนหน้า (ไม่ว่าจะเป็น Full หรือ Incremental)"}, {"id": 414, "dom": 2, "question": "What is the first step in the standard Incident Response Lifecycle?", "options": ["Eradication", "Containment", "Preparation", "Recovery"], "correct_idx": 2, "explanation": "The standard Incident Response lifecycle (e.g., NIST) consists of Preparation, Detection & Analysis, Containment, Eradication, Recovery, and Lessons Learned - Preparation is the first step.", "short_explanation_en": "วงจร Incident Response มาตรฐาน (เช่นของ NIST) ประกอบด้วย Preparation, Detection & Analysis, Containment, Eradication, Recovery และ Lessons Learned โดย Preparation คือขั้นตอนแรกที่ต้องเตรียมความพร้อมก่อนเกิดเหตุ", "question_th": "ขั้นตอนแรกในวงจรการตอบสนองต่อเหตุการณ์ (Incident Response Lifecycle) ตามมาตรฐานทั่วไปคืออะไร?", "options_th": ["Eradication", "Containment", "Preparation", "Recovery"], "explanation_th": "วงจร Incident Response มาตรฐาน (เช่นของ NIST) ประกอบด้วย Preparation, Detection & Analysis, Containment, Eradication, Recovery และ Lessons Learned โดย Preparation คือขั้นตอนแรกที่ต้องเตรียมความพร้อมก่อนเกิดเหตุ"}, {"id": 415, "dom": 2, "question": "What is the purpose of the 'Containment' step in incident response?", "options": ["Permanently remove the cause of the incident from the system", "Limit the scope of damage from spreading further", "Analyze the true root cause of the incident", "Document lessons learned after the incident"], "correct_idx": 1, "explanation": "Containment limits the scope of an incident to prevent it from spreading or causing further damage, such as disconnecting an infected machine from the network.", "short_explanation_en": "Containment คือการจำกัดขอบเขตของเหตุการณ์ไม่ให้ลุกลามหรือสร้างความเสียหายเพิ่มเติม เช่น การตัดการเชื่อมต่อเครื่องที่ติดมัลแวร์ออกจากเครือข่าย", "question_th": "ขั้นตอน 'Containment' ในการตอบสนองเหตุการณ์มีวัตถุประสงค์เพื่ออะไร?", "options_th": ["กำจัดสาเหตุของเหตุการณ์ออกจากระบบอย่างถาวร", "จำกัดขอบเขตความเสียหายไม่ให้ลุกลามต่อไป", "วิเคราะห์สาเหตุที่แท้จริงของเหตุการณ์", "บันทึกบทเรียนหลังเหตุการณ์"], "explanation_th": "Containment คือการจำกัดขอบเขตของเหตุการณ์ไม่ให้ลุกลามหรือสร้างความเสียหายเพิ่มเติม เช่น การตัดการเชื่อมต่อเครื่องที่ติดมัลแวร์ออกจากเครือข่าย"}, {"id": 416, "dom": 2, "question": "Which type of backup site has equipment and systems ready almost instantly, requiring only a data sync to become operational quickly?", "options": ["Cold Site", "Warm Site", "Hot Site", "Mobile Site"], "correct_idx": 2, "explanation": "A Hot Site has hardware, software, and data ready in near real-time, allowing the fastest recovery compared to Warm and Cold sites.", "short_explanation_en": "Hot Site คือไซต์สำรองที่มีฮาร์ดแวร์ ซอฟต์แวร์ และข้อมูลพร้อมใช้งานเกือบเรียลไทม์ ทำให้สามารถกู้คืนระบบได้รวดเร็วที่สุดเมื่อเทียบกับ Warm Site และ Cold Site แต่มีค่าใช้จ่ายสูงที่สุด", "question_th": "ไซต์สำรองประเภทใดที่มีอุปกรณ์และระบบพร้อมใช้งานเกือบทันที เพียงแค่ซิงค์ข้อมูลล่าสุดก็สามารถเปิดใช้งานได้ภายในเวลาอันสั้น?", "options_th": ["Cold Site", "Warm Site", "Hot Site", "Mobile Site"], "explanation_th": "Hot Site คือไซต์สำรองที่มีฮาร์ดแวร์ ซอฟต์แวร์ และข้อมูลพร้อมใช้งานเกือบเรียลไทม์ ทำให้สามารถกู้คืนระบบได้รวดเร็วที่สุดเมื่อเทียบกับ Warm Site และ Cold Site แต่มีค่าใช้จ่ายสูงที่สุด"}, {"id": 417, "dom": 2, "question": "What is a 'Tabletop Exercise' in BC/DR plan testing?", "options": ["A full real-world simulation that halts actual operations", "A discussion-based meeting simulating a scenario without disrupting live systems, to review plan steps", "Testing full data restoration from actual backups", "Sending staff to train at the actual backup site"], "correct_idx": 1, "explanation": "A Tabletop Exercise is a discussion-based test among team members that simulates a scenario without impacting live systems, used to review understanding of roles and plan steps.", "short_explanation_en": "Tabletop Exercise เป็นการทดสอบแผนแบบพูดคุยหารือระหว่างทีมงาน จำลองสถานการณ์สมมติโดยไม่กระทบระบบจริง ใช้เพื่อทบทวนความเข้าใจในบทบาทหน้าที่และขั้นตอนของแผน", "question_th": "'Tabletop Exercise' ในการทดสอบแผน BC/DR คืออะไร?", "options_th": ["การจำลองสถานการณ์จริงโดยหยุดระบบการทำงานจริง", "การประชุมพูดคุยจำลองสถานการณ์บนโต๊ะโดยไม่ต้องหยุดระบบจริง เพื่อทบทวนขั้นตอนตามแผน", "การทดสอบกู้คืนข้อมูลจากแบ็กอัพจริงทั้งหมด", "การส่งพนักงานไปฝึกที่ไซต์สำรองจริง"], "explanation_th": "Tabletop Exercise เป็นการทดสอบแผนแบบพูดคุยหารือระหว่างทีมงาน จำลองสถานการณ์สมมติโดยไม่กระทบระบบจริง ใช้เพื่อทบทวนความเข้าใจในบทบาทหน้าที่และขั้นตอนของแผน"}, {"id": 418, "dom": 2, "question": "After a security incident has ended, which step should be taken to prevent it from recurring in the future?", "options": ["Identification", "Lessons Learned / Post-Incident Review", "Detection", "Containment"], "correct_idx": 1, "explanation": "Lessons Learned (or Post-Incident Review) is the final step where the team reviews the incident, analyzes gaps, and improves processes to prevent recurrence.", "short_explanation_en": "Lessons Learned (หรือ Post-Incident Review) เป็นขั้นตอนสุดท้ายที่ทีมงานทบทวนเหตุการณ์ที่เกิดขึ้น วิเคราะห์จุดบกพร่อง และปรับปรุงกระบวนการเพื่อป้องกันไม่ให้เกิดซ้ำ", "question_th": "หลังจากเหตุการณ์ด้านความปลอดภัยสิ้นสุดลง ขั้นตอนใดที่ควรทำเพื่อป้องกันไม่ให้เกิดเหตุการณ์ซ้ำในอนาคต?", "options_th": ["Identification", "Lessons Learned / Post-Incident Review", "Detection", "Containment"], "explanation_th": "Lessons Learned (หรือ Post-Incident Review) เป็นขั้นตอนสุดท้ายที่ทีมงานทบทวนเหตุการณ์ที่เกิดขึ้น วิเคราะห์จุดบกพร่อง และปรับปรุงกระบวนการเพื่อป้องกันไม่ให้เกิดซ้ำ"}, {"id": 419, "dom": 2, "question": "What is the primary purpose of a 'Business Impact Analysis (BIA)'?", "options": ["Identify and assess potential business impact if critical processes are disrupted, to prioritize recovery", "Write malware protection code", "Install new firewalls", "Train all new employees"], "correct_idx": 0, "explanation": "BIA is the analytical process of identifying critical business processes, assessing the impact of disruption, and using results to set RTO/RPO and BC/DR plan priorities.", "short_explanation_en": "BIA คือกระบวนการวิเคราะห์เพื่อระบุกระบวนการทางธุรกิจที่สำคัญ ประเมินผลกระทบหากหยุดชะงัก และใช้ผลลัพธ์นี้ในการกำหนด RTO/RPO และลำดับความสำคัญของแผน BC/DR", "question_th": "'Business Impact Analysis (BIA)' มีวัตถุประสงค์หลักเพื่ออะไร?", "options_th": ["ระบุและประเมินผลกระทบทางธุรกิจที่อาจเกิดขึ้นหากกระบวนการสำคัญหยุดชะงัก เพื่อกำหนดลำดับความสำคัญในการกู้คืน", "เขียนโค้ดป้องกันมัลแวร์", "ติดตั้งไฟร์วอลล์ใหม่", "ฝึกอบรมพนักงานใหม่ทุกคน"], "explanation_th": "BIA คือกระบวนการวิเคราะห์เพื่อระบุกระบวนการทางธุรกิจที่สำคัญ ประเมินผลกระทบหากหยุดชะงัก และใช้ผลลัพธ์นี้ในการกำหนด RTO/RPO และลำดับความสำคัญของแผน BC/DR"}, {"id": 420, "dom": 3, "question": "Which of the following is an example of the 'Something you know' authentication factor?", "options": ["Fingerprint", "Password", "Employee ID card", "Geographic location"], "correct_idx": 1, "explanation": "'Something you know' is a knowledge factor, such as a password, PIN, or security question, distinct from 'Something you have' (card, token) and 'Something you are' (biometrics).", "short_explanation_en": "'Something you know' is a knowledge factor, such as a password, PIN, or security question, distinct from 'Something you have' (card, token) and 'Something you are' (biometrics).", "question_th": "ปัจจัยการยืนยันตัวตน (Authentication Factor) แบบ 'สิ่งที่คุณรู้' (Something you know) คือตัวอย่างใด?", "options_th": ["ลายนิ้วมือ", "รหัสผ่าน (Password)", "บัตรประจำตัวพนักงาน", "ตำแหน่งที่ตั้งทางภูมิศาสตร์"], "explanation_th": "'Something you know' คือปัจจัยความรู้ เช่น รหัสผ่าน PIN หรือคำถามเพื่อความปลอดภัย ต่างจาก 'Something you have' (บัตร โทเค็น) และ 'Something you are' (ไบโอเมตริกซ์)"}, {"id": 421, "dom": 3, "question": "Using a password together with an OTP sent to a mobile phone is an example of which concept?", "options": ["Single Factor Authentication", "Multi-Factor Authentication (MFA)", "Single Sign-On (SSO)", "Role-Based Access Control"], "correct_idx": 1, "explanation": "MFA is authentication using more than one factor type together - in this case 'something you know' (password) and 'something you have' (phone receiving the OTP).", "short_explanation_en": "MFA is authentication using more than one factor type together - in this case 'something you know' (password) and 'something you have' (phone receiving the OTP).", "question_th": "การใช้รหัสผ่านร่วมกับรหัส OTP ที่ส่งไปยังโทรศัพท์มือถือ เป็นตัวอย่างของแนวคิดใด?", "options_th": ["Single Factor Authentication", "Multi-Factor Authentication (MFA)", "Single Sign-On (SSO)", "Role-Based Access Control"], "explanation_th": "MFA คือการยืนยันตัวตนโดยใช้ปัจจัยมากกว่าหนึ่งประเภทร่วมกัน ในกรณีนี้คือ 'สิ่งที่คุณรู้' (รหัสผ่าน) และ 'สิ่งที่คุณมี' (โทรศัพท์ที่รับ OTP)"}, {"id": 422, "dom": 3, "question": "What characterizes the Mandatory Access Control (MAC) model?", "options": ["The resource owner sets their own access permissions", "Access is determined centrally based on classification/clearance levels and cannot be changed by regular users", "Access is determined by the user's job role", "Access is determined by multiple dynamic attributes"], "correct_idx": 1, "explanation": "MAC is a model where access is controlled by a central policy (e.g., government classification levels). Users cannot change permissions themselves - commonly used in high-security agencies like the military.", "short_explanation_en": "MAC is a model where access is controlled by a central policy (e.g., government classification levels). Users cannot change permissions themselves - commonly used in high-security agencies like the military.", "question_th": "โมเดลควบคุมการเข้าถึงแบบ Mandatory Access Control (MAC) มีลักษณะอย่างไร?", "options_th": ["เจ้าของทรัพยากรเป็นผู้กำหนดสิทธิ์การเข้าถึงเอง", "การเข้าถึงถูกกำหนดโดยระบบส่วนกลางตามระดับชั้นความลับ (Classification/Clearance) ไม่สามารถเปลี่ยนแปลงได้โดยผู้ใช้ทั่วไป", "การเข้าถึงถูกกำหนดตามบทบาทหน้าที่ของผู้ใช้", "การเข้าถึงถูกกำหนดตามคุณลักษณะหลายอย่างแบบไดนามิก"], "explanation_th": "MAC เป็นโมเดลที่การเข้าถึงถูกควบคุมโดยนโยบายส่วนกลาง (เช่น ระดับชั้นความลับของรัฐบาล) ผู้ใช้ไม่สามารถเปลี่ยนแปลงสิทธิ์ได้เอง มักใช้ในหน่วยงานที่ต้องการความปลอดภัยสูง เช่น หน่วยงานทหาร"}, {"id": 423, "dom": 3, "question": "What is the defining feature of the Discretionary Access Control (DAC) model?", "options": ["A central administrator sets all permissions", "The data owner can define and grant access to others at their own discretion", "Permissions are set only by job role", "Confidentiality labels are used to control access"], "correct_idx": 1, "explanation": "DAC gives resource owners the authority to decide who can access their resources - for example, sharing files in a typical operating system.", "short_explanation_en": "DAC gives resource owners the authority to decide who can access their resources - for example, sharing files in a typical operating system.", "question_th": "โมเดล Discretionary Access Control (DAC) มีลักษณะเด่นอย่างไร?", "options_th": ["ผู้ดูแลระบบกลางเป็นผู้กำหนดสิทธิ์ทั้งหมด", "เจ้าของข้อมูล (Data Owner) สามารถกำหนดและมอบสิทธิ์การเข้าถึงให้ผู้อื่นได้ตามดุลยพินิจของตนเอง", "สิทธิ์ถูกกำหนดตามบทบาทงานเท่านั้น", "ใช้ Label ความลับเพื่อควบคุมการเข้าถึง"], "explanation_th": "DAC ให้อำนาจเจ้าของทรัพยากรในการตัดสินใจว่าใครสามารถเข้าถึงทรัพยากรของตนได้บ้าง เช่น การแชร์ไฟล์ในระบบปฏิบัติการทั่วไป"}, {"id": 424, "dom": 3, "question": "What does the Role-Based Access Control (RBAC) model primarily base access permissions on?", "options": ["User attributes such as department, position, time", "The user's role (Role) within the organization", "The data owner's discretion", "Government classification levels"], "correct_idx": 1, "explanation": "RBAC assigns access based on the role a user is given - for example, an 'HR Manager' role has different system access than a 'Finance Officer' role, making it easier to manage permissions in large organizations.", "short_explanation_en": "RBAC assigns access based on the role a user is given - for example, an 'HR Manager' role has different system access than a 'Finance Officer' role, making it easier to manage permissions in large organizations.", "question_th": "โมเดล Role-Based Access Control (RBAC) กำหนดสิทธิ์การเข้าถึงตามอะไรเป็นหลัก?", "options_th": ["คุณลักษณะของผู้ใช้ เช่น แผนก ตำแหน่ง เวลา", "บทบาทหน้าที่ (Role) ของผู้ใช้ในองค์กร", "ดุลยพินิจของเจ้าของข้อมูล", "ระดับชั้นความลับของรัฐบาล"], "explanation_th": "RBAC กำหนดสิทธิ์การเข้าถึงตามบทบาทที่ผู้ใช้ได้รับมอบหมาย เช่น บทบาท 'HR Manager' จะมีสิทธิ์เข้าถึงระบบที่แตกต่างจากบทบาท 'Finance Officer' ช่วยให้บริหารจัดการสิทธิ์ได้ง่ายในองค์กรขนาดใหญ่"}, {"id": 425, "dom": 3, "question": "Why does the Attribute-Based Access Control (ABAC) model offer high flexibility?", "options": ["It uses only passwords for decisions", "It dynamically considers multiple combined attributes such as user, device, time, location, and context", "It gives everyone equal access always", "It uses only classification levels"], "correct_idx": 1, "explanation": "ABAC makes access decisions by dynamically evaluating multiple attribute dimensions together - such as user role, device type, time, and location - making it more flexible and granular than other models.", "short_explanation_en": "ABAC makes access decisions by dynamically evaluating multiple attribute dimensions together - such as user role, device type, time, and location - making it more flexible and granular than other models.", "question_th": "โมเดล Attribute-Based Access Control (ABAC) มีความยืดหยุ่นสูงเพราะเหตุใด?", "options_th": ["ใช้เฉพาะรหัสผ่านในการตัดสินใจ", "พิจารณาจากคุณลักษณะหลายด้านร่วมกัน เช่น ผู้ใช้ อุปกรณ์ เวลา สถานที่ และบริบทแบบไดนามิก", "ให้สิทธิ์ทุกคนเท่ากันเสมอ", "ใช้เฉพาะระดับชั้นความลับเท่านั้น"], "explanation_th": "ABAC ตัดสินใจให้สิทธิ์การเข้าถึงโดยประเมินจากคุณลักษณะ (Attributes) หลายมิติร่วมกันแบบไดนามิก เช่น บทบาทผู้ใช้ ประเภทอุปกรณ์ เวลา และตำแหน่งที่ตั้ง ทำให้มีความยืดหยุ่นและละเอียดกว่าโมเดลอื่น"}, {"id": 426, "dom": 3, "question": "What is the primary benefit that Single Sign-On (SSO) provides to users?", "options": ["Requiring separate logins on every system for maximum security", "Logging in once to access multiple linked systems or applications without re-logging in", "Encrypting all data in the system", "Only preventing brute force attacks"], "correct_idx": 1, "explanation": "SSO lets users authenticate once and immediately access other linked systems or applications, improving convenience and reducing the number of passwords they need to remember.", "short_explanation_en": "SSO lets users authenticate once and immediately access other linked systems or applications, improving convenience and reducing the number of passwords they need to remember.", "question_th": "'Single Sign-On (SSO)' ให้ประโยชน์อะไรแก่ผู้ใช้เป็นหลัก?", "options_th": ["ต้องล็อกอินแยกกันในทุกระบบเพื่อความปลอดภัยสูงสุด", "ล็อกอินเพียงครั้งเดียวแล้วสามารถเข้าถึงหลายระบบหรือแอปพลิเคชันที่เชื่อมโยงกันได้โดยไม่ต้องล็อกอินซ้ำ", "เข้ารหัสข้อมูลทั้งหมดในระบบ", "ป้องกันการโจมตีแบบ Brute Force เท่านั้น"], "explanation_th": "SSO ช่วยให้ผู้ใช้ยืนยันตัวตนเพียงครั้งเดียวแล้วสามารถเข้าถึงระบบหรือแอปพลิเคชันอื่นๆ ที่เชื่อมโยงกันได้ทันที ช่วยเพิ่มความสะดวกและลดจำนวนรหัสผ่านที่ต้องจำ"}, {"id": 427, "dom": 3, "question": "What is a potential drawback of using SSO?", "options": ["Users must remember multiple sets of passwords", "If the SSO account is successfully attacked, the attacker may gain access to all linked systems (Single Point of Failure)", "It slows down login on every system", "It cannot be used together with MFA"], "correct_idx": 1, "explanation": "SSO's main risk is that if the central account is compromised, an attacker gains immediate access to all linked systems - which is why it's often recommended to pair SSO with MFA for added security.", "short_explanation_en": "SSO's main risk is that if the central account is compromised, an attacker gains immediate access to all linked systems - which is why it's often recommended to pair SSO with MFA for added security.", "question_th": "ข้อเสียที่อาจเกิดขึ้นจากการใช้ SSO คืออะไร?", "options_th": ["ผู้ใช้ต้องจำรหัสผ่านหลายชุด", "หากบัญชี SSO ถูกโจมตีสำเร็จ ผู้โจมตีอาจเข้าถึงระบบที่เชื่อมโยงทั้งหมดได้ (Single Point of Failure)", "ทำให้การล็อกอินช้าลงในทุกระบบ", "ไม่สามารถใช้งานร่วมกับ MFA ได้"], "explanation_th": "ความเสี่ยงหลักของ SSO คือหากบัญชีกลางถูกบุกรุก ผู้โจมตีจะสามารถเข้าถึงระบบที่เชื่อมโยงทั้งหมดได้ทันที จึงมักแนะนำให้ใช้ร่วมกับ MFA เพื่อเพิ่มความปลอดภัย"}, {"id": 428, "dom": 3, "question": "What does Federated Identity Management enable?", "options": ["Users can use the same identity to access systems across trusted organizations", "Every organization must maintain completely separate user databases", "Eliminates the use of passwords entirely", "Restricts access only within a single organization"], "correct_idx": 0, "explanation": "Federated Identity Management lets users use one set of credentials to access resources across organizations or domains that share a trust relationship - such as logging in with a Google account to access an external service.", "short_explanation_en": "Federated Identity Management lets users use one set of credentials to access resources across organizations or domains that share a trust relationship - such as logging in with a Google account to access an external service.", "question_th": "'Federated Identity Management' ช่วยให้เกิดอะไร?", "options_th": ["ผู้ใช้สามารถใช้ข้อมูลประจำตัว (Identity) เดียวกันเพื่อเข้าถึงระบบข้ามองค์กรที่เชื่อถือกัน", "ทุกองค์กรต้องมีฐานข้อมูลผู้ใช้แยกกันโดยเด็ดขาด", "ยกเลิกการใช้รหัสผ่านทั้งหมด", "จำกัดการเข้าถึงเฉพาะภายในองค์กรเดียว"], "explanation_th": "Federated Identity Management ช่วยให้ผู้ใช้สามารถใช้ข้อมูลประจำตัวชุดเดียวเพื่อเข้าถึงทรัพยากรข้ามองค์กรหรือโดเมนที่มีความสัมพันธ์ไว้วางใจกัน (Trust Relationship) เช่น การล็อกอินด้วยบัญชี Google เพื่อเข้าใช้บริการภายนอก"}, {"id": 429, "dom": 3, "question": "What do the 'Provisioning' and 'Deprovisioning' processes for user accounts involve?", "options": ["Creating and revoking user accounts according to the employment lifecycle, e.g. when hiring or when an employee leaves", "Encrypting the user database", "Daily backups of user account data", "Detecting network intrusions"], "correct_idx": 0, "explanation": "Provisioning is creating an account and granting access for a new user, while Deprovisioning is revoking or disabling an account when access is no longer needed - such as when an employee leaves - which is critical for preventing orphaned accounts.", "short_explanation_en": "Provisioning is creating an account and granting access for a new user, while Deprovisioning is revoking or disabling an account when access is no longer needed - such as when an employee leaves - which is critical for preventing orphaned accounts.", "question_th": "กระบวนการ 'Provisioning' และ 'Deprovisioning' บัญชีผู้ใช้เกี่ยวข้องกับอะไร?", "options_th": ["การสร้างและยกเลิกบัญชีผู้ใช้ตามวงจรชีวิตการจ้างงาน เช่น เมื่อรับพนักงานใหม่หรือพนักงานลาออก", "การเข้ารหัสฐานข้อมูลผู้ใช้", "การสำรองข้อมูลบัญชีผู้ใช้รายวัน", "การตรวจจับการบุกรุกเครือข่าย"], "explanation_th": "Provisioning คือการสร้างบัญชีและกำหนดสิทธิ์การเข้าถึงให้ผู้ใช้ใหม่ ส่วน Deprovisioning คือการยกเลิกหรือปิดบัญชีเมื่อผู้ใช้ไม่ต้องการสิทธิ์นั้นอีกต่อไป เช่น เมื่อพนักงานลาออก ซึ่งสำคัญมากเพื่อป้องกันบัญชีค้าง (Orphaned Account)"}, {"id": 430, "dom": 3, "question": "What does 'Accountability' mean in the context of access control?", "options": ["Granting user permissions based on role", "The ability to track and trace who did what and when, through logging and audit trails", "Encrypting passwords", "Biometric authentication"], "correct_idx": 1, "explanation": "Accountability is the ability to trace individual users' actions through logging and audit trails, which relies on accurate Identification and Authentication as its foundation.", "short_explanation_en": "Accountability is the ability to trace individual users' actions through logging and audit trails, which relies on accurate Identification and Authentication as its foundation.", "question_th": "'Accountability' ในบริบทการควบคุมการเข้าถึงหมายถึงอะไร?", "options_th": ["การให้สิทธิ์ผู้ใช้ตามบทบาท", "ความสามารถในการติดตามและตรวจสอบย้อนกลับได้ว่าใครทำอะไร เมื่อใด ผ่านการบันทึก Log และ Audit Trail", "การเข้ารหัสรหัสผ่าน", "การยืนยันตัวตนด้วยไบโอเมตริกซ์"], "explanation_th": "Accountability คือความสามารถในการตรวจสอบย้อนกลับถึงการกระทำของผู้ใช้แต่ละคนผ่านการบันทึกเหตุการณ์ (Logging) และ Audit Trail ซึ่งต้องอาศัย Identification และ Authentication ที่ถูกต้องเป็นพื้นฐาน"}, {"id": 431, "dom": 3, "question": "Which of the following is an example of the 'Something you are' authentication factor?", "options": ["A PIN code", "Iris or fingerprint scan", "An office key", "An employee badge"], "correct_idx": 1, "explanation": "'Something you are' is a biometric factor - such as a fingerprint, iris, or face - that represents a person's unique physical characteristic.", "short_explanation_en": "'Something you are' is a biometric factor - such as a fingerprint, iris, or face - that represents a person's unique physical characteristic.", "question_th": "'Something you are' ในปัจจัยการยืนยันตัวตนหมายถึงตัวอย่างใด?", "options_th": ["รหัส PIN", "สแกนม่านตาหรือลายนิ้วมือ", "กุญแจสำนักงาน", "บัตรพนักงาน"], "explanation_th": "'Something you are' คือปัจจัยทางชีวมิติ (Biometric) เช่น ลายนิ้วมือ ม่านตา หรือใบหน้า ซึ่งเป็นลักษณะเฉพาะตัวของบุคคล"}, {"id": 432, "dom": 3, "question": "Which of the following is a correct example of Physical Access Control?", "options": ["An Access Control List (ACL) on a firewall", "A mantrap system and electronic door badge readers", "Data encryption", "A password policy"], "correct_idx": 1, "explanation": "A mantrap (double-door containment room) and electronic badge systems are examples of Physical Access Control that regulate access to actual physical spaces - distinct from Logical Access Control, which governs access to digital systems.", "short_explanation_en": "A mantrap (double-door containment room) and electronic badge systems are examples of Physical Access Control that regulate access to actual physical spaces - distinct from Logical Access Control, which governs access to digital systems.", "question_th": "การควบคุมการเข้าถึงทางกายภาพ (Physical Access Control) ข้อใดเป็นตัวอย่างที่ถูกต้อง?", "options_th": ["Access Control List (ACL) บนไฟร์วอลล์", "ระบบ Mantrap และบัตรผ่านประตูอิเล็กทรอนิกส์", "การเข้ารหัสข้อมูล (Encryption)", "นโยบายรหัสผ่าน"], "explanation_th": "Mantrap (ห้องกักตัวสองประตู) และระบบบัตรผ่านประตูเป็นตัวอย่างของ Physical Access Control ที่ควบคุมการเข้าออกพื้นที่จริง แตกต่างจาก Logical Access Control ที่ควบคุมการเข้าถึงระบบดิจิทัล"}, {"id": 433, "dom": 3, "question": "What does 'Logical Access Control' mean?", "options": ["Controlling building entry with a security guard", "Controlling access to systems, data, or digital resources through software mechanisms such as passwords and ACLs", "Installing CCTV cameras", "Locking a door with a key"], "correct_idx": 1, "explanation": "Logical Access Control (or Technical Access Control) governs access to digital resources through software mechanisms - such as passwords, file permissions, and ACLs - distinct from Physical Access Control, which governs physical spaces.", "short_explanation_en": "Logical Access Control (or Technical Access Control) governs access to digital resources through software mechanisms - such as passwords, file permissions, and ACLs - distinct from Physical Access Control, which governs physical spaces.", "question_th": "'Logical Access Control' หมายถึงอะไร?", "options_th": ["การควบคุมการเข้าออกอาคารด้วยยาม", "การควบคุมการเข้าถึงระบบ ข้อมูล หรือทรัพยากรดิจิทัลผ่านกลไกทางซอฟต์แวร์ เช่น รหัสผ่านและ ACL", "การติดตั้งกล้องวงจรปิด", "การล็อกประตูด้วยกุญแจ"], "explanation_th": "Logical Access Control (หรือ Technical Access Control) ควบคุมการเข้าถึงทรัพยากรดิจิทัลผ่านกลไกซอฟต์แวร์ เช่น รหัสผ่าน สิทธิ์ไฟล์ และ Access Control List ต่างจาก Physical Access Control ที่ควบคุมพื้นที่จริง"}, {"id": 434, "dom": 3, "question": "Why is setting a 'Password Complexity Policy' important?", "options": ["It makes passwords easier for users to remember", "It reduces the chance of a password being successfully guessed or cracked via Brute Force / Dictionary attacks", "It makes the system run faster", "It has no effect on system security"], "correct_idx": 1, "explanation": "Password complexity policies (such as minimum length and mixed characters) reduce the likelihood that an attacker can successfully guess or crack a password via Brute Force or Dictionary attacks.", "short_explanation_en": "Password complexity policies (such as minimum length and mixed characters) reduce the likelihood that an attacker can successfully guess or crack a password via Brute Force or Dictionary attacks.", "question_th": "เหตุใดการกำหนด 'Password Complexity Policy' จึงมีความสำคัญ?", "options_th": ["ทำให้ผู้ใช้จำรหัสผ่านได้ง่ายขึ้น", "ลดโอกาสที่รหัสผ่านจะถูกคาดเดาหรือถูกโจมตีแบบ Brute Force / Dictionary Attack สำเร็จ", "ทำให้ระบบทำงานเร็วขึ้น", "ไม่มีผลต่อความปลอดภัยของระบบ"], "explanation_th": "นโยบายความซับซ้อนของรหัสผ่าน (เช่น ความยาวขั้นต่ำ ตัวอักษรผสม) ช่วยลดโอกาสที่ผู้โจมตีจะคาดเดาหรือเดารหัสผ่านได้สำเร็จผ่านการโจมตีแบบ Brute Force หรือ Dictionary Attack"}, {"id": 435, "dom": 3, "question": "What is the primary purpose of Privileged Access Management (PAM)?", "options": ["Strictly manage and control high-privilege accounts, such as Administrator accounts, in an auditable way", "Grant Administrator privileges to all users", "Delete all user accounts in the system", "Only manage regular users' passwords"], "correct_idx": 0, "explanation": "PAM is a set of practices and tools for controlling, monitoring, and restricting the use of privileged accounts, to reduce the risk of misuse or compromise of high-privilege access.", "short_explanation_en": "PAM is a set of practices and tools for controlling, monitoring, and restricting the use of privileged accounts, to reduce the risk of misuse or compromise of high-privilege access.", "question_th": "'Privileged Access Management (PAM)' มีวัตถุประสงค์หลักเพื่ออะไร?", "options_th": ["จัดการและควบคุมบัญชีที่มีสิทธิ์สูง เช่น บัญชี Administrator อย่างเข้มงวดและตรวจสอบได้", "ให้สิทธิ์ Administrator แก่ผู้ใช้ทุกคน", "ลบบัญชีผู้ใช้ทั้งหมดในระบบ", "จัดการเฉพาะรหัสผ่านของผู้ใช้ทั่วไป"], "explanation_th": "PAM คือแนวทางและเครื่องมือในการควบคุม ตรวจสอบ และจำกัดการใช้งานบัญชีที่มีสิทธิ์สูง (Privileged Account) เพื่อลดความเสี่ยงจากการใช้สิทธิ์ในทางที่ผิดหรือถูกโจมตี"}, {"id": 436, "dom": 3, "question": "What is the goal of periodic Access Review/Recertification?", "options": ["Automatically increase everyone's access rights", "Review and confirm that users' access rights remain appropriate and necessary for their current duties, reducing Privilege Creep", "Delete unnecessary old log data", "Reset all users' passwords"], "correct_idx": 1, "explanation": "Periodic access review helps detect and correct 'Privilege Creep' - where a user accumulates unnecessary access rights over time as their role or duties change, without prior access being revoked.", "short_explanation_en": "Periodic access review helps detect and correct 'Privilege Creep' - where a user accumulates unnecessary access rights over time as their role or duties change, without prior access being revoked.", "question_th": "ในการตรวจสอบสิทธิ์การเข้าถึงเป็นระยะ (Access Review/Recertification) มีเป้าหมายเพื่ออะไร?", "options_th": ["เพิ่มสิทธิ์ให้ผู้ใช้ทุกคนโดยอัตโนมัติ", "ทบทวนและยืนยันว่าสิทธิ์การเข้าถึงของผู้ใช้ยังคงเหมาะสมและจำเป็นต่อหน้าที่ปัจจุบัน ลด Privilege Creep", "ลบข้อมูล Log เก่าที่ไม่จำเป็น", "เปลี่ยนรหัสผ่านผู้ใช้ทั้งหมด"], "explanation_th": "การทบทวนสิทธิ์เป็นระยะช่วยตรวจจับและแก้ไข 'Privilege Creep' ซึ่งเกิดจากผู้ใช้สะสมสิทธิ์เกินความจำเป็นเมื่อเปลี่ยนตำแหน่งหรือหน้าที่งาน โดยไม่มีการเพิกถอนสิทธิ์เดิม"}, {"id": 437, "dom": 3, "question": "What is the primary purpose of the 'Kerberos' protocol?", "options": ["File encryption", "Centralized authentication using tickets via a Key Distribution Center", "Network routing", "Vulnerability scanning"], "correct_idx": 1, "explanation": "Kerberos is an authentication protocol that uses a ticket-based system via a Key Distribution Center (KDC), allowing users to securely access network services without repeatedly transmitting their password.", "short_explanation_en": "Kerberos is an authentication protocol that uses a ticket-based system via a Key Distribution Center (KDC), allowing users to securely access network services without repeatedly transmitting their password.", "question_th": "'Kerberos' เป็นโปรโตคอลที่ใช้เพื่อวัตถุประสงค์ใดเป็นหลัก?", "options_th": ["การเข้ารหัสไฟล์", "การยืนยันตัวตนแบบรวมศูนย์โดยใช้ตั๋ว (Ticket) ผ่าน Key Distribution Center", "การกำหนดเส้นทางเครือข่าย", "การสแกนหาช่องโหว่"], "explanation_th": "Kerberos เป็นโปรโตคอลยืนยันตัวตนที่ใช้ระบบ Ticket ผ่าน Key Distribution Center (KDC) เพื่อให้ผู้ใช้สามารถเข้าถึงบริการต่างๆ ในเครือข่ายได้อย่างปลอดภัยโดยไม่ต้องส่งรหัสผ่านซ้ำๆ"}, {"id": 438, "dom": 3, "question": "Why should a user account be disabled immediately when an employee leaves, rather than waiting to delete it later?", "options": ["To save storage space", "To prevent an orphaned account from being misused
