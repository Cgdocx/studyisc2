rming systems, detecting compromises, and providing a record of how systems are used"], "correct_idx": 2, "explanation": "According to the ISC2 Study Guide (chapter 5, module 1, under Data Handling Practices), logging and monitoring systems are characterized as being \"Essential to identifying inefficient performing systems, detecting compromises, and providinga record of how systems are used\". The remaining options are incorrect variations of this definition.", "short_explanation_en": "According to the ISC2 Study Guide (chapter 5, module 1, under Data Handling Practices), logging and monitoring systems are characterized as being \"Essential to identifying inefficient performing systems, detecting compromises, and...", "question_th": "ระบบบันทึกและเฝ้าติดตาม (Logging and monitoring) มีความสำคัญต่อ:", "options_th": ["การระบุระบบที่ทำงานได้ไม่มีประสิทธิภาพ ป้องกันการถูกบุกรุก และให้บันทึกวิธีที่ระบบถูกใช้งาน", "การระบุระบบที่ทำงานได้อย่างมีประสิทธิภาพ ติดป้ายการถูกบุกรุก และให้บันทึกวิธีที่ระบบถูกใช้งาน", "การระบุระบบที่ทำงานได้ไม่มีประสิทธิภาพ ตรวจจับการถูกบุกรุก และให้บันทึกวิธีที่ระบบถูกใช้งาน", "การระบุระบบที่ทำงานได้อย่างมีประสิทธิภาพ ตรวจจับการถูกบุกรุก และให้บันทึกวิธีที่ระบบถูกใช้งาน"], "explanation_th": "ตาม ISC2 Study Guide ระบบบันทึกและเฝ้าติดตามมีลักษณะสำคัญคือ 'จำเป็นต่อการระบุระบบที่ทำงานได้ไม่มีประสิทธิภาพ ตรวจจับการถูกบุกรุก และให้บันทึกวิธีที่ระบบถูกใช้งาน' ตัวเลือกอื่น ๆ เป็นรูปแบบที่ไม่ถูกต้องของนิยามนี้"}, {"id": 197, "dom": 2, "question": "In the event of a disaster, which of these should be the PRIMARY objective? (★)", "options": ["Guarantee the safety of people", "Guarantee the continuity of critical systems", "Protection of the production database github.com/ayemunhossain", "Application of disaster communication"], "correct_idx": 0, "explanation": "In the event of a disaster, the clear priority is to guarantee the safety of human life above all. The remaining options, though important from the point of view of disaster recovery and business continuity, are secondary when compared to safety.", "short_explanation_en": "In the event of a disaster, the clear priority is to guarantee the safety of human life above all.", "question_th": "ในกรณีเกิดภัยพิบัติ วัตถุประสงค์หลักควรเป็นสิ่งใด?", "options_th": ["รับประกันความปลอดภัยของบุคลากร", "รับประกันความต่อเนื่องของระบบสำคัญ", "ปกป้องฐานข้อมูลการผลิต", "การสื่อสารในสถานการณ์ภัยพิบัติ"], "explanation_th": "ในกรณีเกิดภัยพิบัติ ความสำคัญอันดับแรกคือการรับประกันความปลอดภัยของชีวิตมนุษย์เหนือสิ่งอื่นใด"}, {"id": 198, "dom": 5, "question": "The process that ensures that system changes do not adversely impact business operations is known as:", "options": ["Change Management", "Vulnerability Management", "Configuration Management", "Inventory Management"], "correct_idx": 0, "explanation": "Change Management is the process of implementing necessary changes so that they do not adversely affect business operations (see ISC2 Study Guide, chapter 5, module 3). Vulnerability Management refers to the capacity to identify, track, prioritize and eliminate vulnerabilities in systems and devices. Configuration Management refers to a collection of activities with the purpose of establishing and maintaining the integrity of information systems through their development lifecycle (see NIST SP 1", "short_explanation_en": "Change Management is the process of implementing necessary changes so that they do not adversely affect business operations (see ISC2 Study Guide, chapter 5, module 3).", "question_th": "กระบวนการที่รับประกันว่าการเปลี่ยนแปลงระบบจะไม่ส่งผลกระทบเชิงลบต่อการดำเนินธุรกิจ เรียกว่า:", "options_th": ["Change Management", "Vulnerability Management", "Configuration Management", "Inventory Management"], "explanation_th": "Change Management คือกระบวนการนำการเปลี่ยนแปลงที่จำเป็นมาใช้โดยไม่ส่งผลกระทบเชิงลบต่อการดำเนินธุรกิจ ในขณะที่ Vulnerability Management หมายถึงความสามารถในการระบุ ติดตาม จัดลำดับความสำคัญ และกำจัดช่องโหว่ในระบบและอุปกรณ์"}, {"id": 199, "dom": 5, "question": "The last phase in the data security cycle is:", "options": ["Encryption", "Backup", "Archival github.com/ayemunhossain", "Destruction"], "correct_idx": 3, "explanation": "According to the data security lifecycle model, the last phase is Data Destruction, which aims at guaranteeing that data contained in a given support is erased and destroyed in a way that renders it completely irrecoverable by any means (see ISC2 Study Guide, chapter 5, module 1, under Data Handling). Archival refers to the process whereby an organization creates a long-term data archive for compliance, storage reduction or business intelligence. A Backup is a copy of files and programs created", "short_explanation_en": "According to the data security lifecycle model, the last phase is Data Destruction, which aims at guaranteeing that data contained in a given support is erased and destroyed in a way that renders it completely irrecoverable by any means...", "question_th": "ขั้นตอนสุดท้ายในวงจรความปลอดภัยของข้อมูล (Data Security Cycle) คือ:", "options_th": ["การเข้ารหัส (Encryption)", "การสำรองข้อมูล (Backup)", "การจัดเก็บถาวร (Archival)", "การทำลาย (Destruction)"], "explanation_th": "ตามโมเดลวงจรชีวิตความปลอดภัยของข้อมูล ขั้นตอนสุดท้ายคือ Data Destruction ซึ่งมีเป้าหมายเพื่อรับประกันว่าข้อมูลที่จัดเก็บในสื่อบันทึกจะถูกลบและทำลายในลักษณะที่ไม่สามารถกู้คืนได้ด้วยวิธีใด ๆ"}, {"id": 200, "dom": 3, "question": "Which access control model specifies access to an object based on the subject's role in the organization?", "options": ["RBAC", "MAC", "DAC", "ABAC"], "correct_idx": 0, "explanation": "The role-based access control (RBAC) model is well known for governing access to objects based on the roles of individual users within the organization. Mandatory access control is based on security classifications. Attribute-based access control is based on complex attribute rules. In discretionary access control, subjects can grant privileges to other subjects and change some of the security attributes of the objects they have access to.", "short_explanation_en": "The role-based access control (RBAC) model is well known for governing access to objects based on the roles of individual users within the organization.", "question_th": "โมเดลควบคุมการเข้าถึงใดที่ระบุการเข้าถึงวัตถุตามบทบาทของ subject ในองค์กร?", "options_th": ["RBAC", "MAC", "DAC", "ABAC"], "explanation_th": "โมเดล role-based access control (RBAC) เป็นที่รู้จักดีในการกำกับดูแลการเข้าถึงวัตถุตามบทบาทของผู้ใช้แต่ละคนภายในองค์กร Mandatory access control อิงตามการจัดประเภทความปลอดภัย Attribute-based access control อิงตามกฎคุณลักษณะที่ซับซ้อน"}, {"id": 201, "dom": 1, "question": "Which of the following is NOT an example of a physical security control?", "options": ["Firewalls", "Biometric access controls", "Remote control electronic locks", "Security cameras github.com/ayemunhossain"], "correct_idx": 0, "explanation": "Firewalls are a type of electronic equipment which connects to a network that filters inbound traffic arriving from the Internet, and, thus are a type of technical security controls. Security cameras, biometric access control and electronic locks, though connected to a network, control access to physical facilities, and thus are types of physical security controls. (ISC2 Study Guide, Chapter 1, Module 3)", "short_explanation_en": "Firewalls are a type of electronic equipment which connects to a network that filters inbound traffic arriving from the Internet, and, thus are a type of technical security controls.", "question_th": "ข้อใดไม่ใช่ตัวอย่างของการควบคุมความปลอดภัยทางกายภาพ?", "options_th": ["Firewalls", "Biometric access controls", "Remote control electronic locks", "Security cameras"], "explanation_th": "ไฟร์วอลล์เป็นอุปกรณ์อิเล็กทรอนิกส์ที่เชื่อมต่อกับเครือข่ายเพื่อกรองทราฟฟิกขาเข้าจากอินเทอร์เน็ต จึงเป็นการควบคุมความปลอดภัยทางเทคนิค กล้องวงจรปิด การควบคุมการเข้าถึงด้วยไบโอเมตริกซ์ และล็อกอิเล็กทรอนิกส์ แม้จะเชื่อมต่อกับเครือข่าย แต่ควบคุมการเข้าถึงสถานที่ทางกายภาพ จึงเป็นการควบคุมความปลอดภัยทางกายภาพ"}, {"id": 202, "dom": 4, "question": "Which type of attack will most effectively maintain remote access and control over the victim's computer?", "options": ["Trojans", "Phishing", "Cross-Site Scripting", "Rootkits"], "correct_idx": 3, "explanation": "A rootkit tries to maintain root-level access while concealing malicious activity. It typically creates a backdoor and attempts to remain undetected by anti-malware software. A rootkit is active while the system is running. Trojans can also create backdoors but are only active while a specific application is running, and thus are not as effective as a rootkit. Phishing is used to initiate attacks by redirecting the user to fake websites. Cross-Site Scripting is used to attack websites.", "short_explanation_en": "A rootkit tries to maintain root-level access while concealing malicious activity.", "question_th": "การโจมตีประเภทใดที่มีประสิทธิภาพมากที่สุดในการรักษาการเข้าถึงและควบคุมคอมพิวเตอร์ของเหยื่อจากระยะไกล?", "options_th": ["Trojans", "Phishing", "Cross-Site Scripting", "Rootkits"], "explanation_th": "Rootkit พยายามรักษาการเข้าถึงระดับ root ในขณะที่ปกปิดกิจกรรมที่เป็นอันตราย มักสร้าง backdoor และพยายามหลบเลี่ยงการตรวจจับจากซอฟต์แวร์แอนตี้มัลแวร์ Rootkit ทำงานอยู่ตลอดเวลาที่ระบบทำงาน"}, {"id": 203, "dom": 2, "question": "In incident terminology, the meaning of Zero Day is:", "options": ["Days to solve a previously unknown system vulnerability", "A previously unknown system vulnerability", "Days without a cybersecurity incident", "Days with a cybersecurity incident"], "correct_idx": 1, "explanation": "A 'Zero Day' is an unknown system vulnerability that can be exploited since it does not yet exist in any vulnerability database. Moreover, these vulnerabilities do not generally fit recognized patterns, signatures or methods (see ISC2 Study Guide Chapter 2, Module 1, under Incident Terminology), making them very hard to detect and prevent.", "short_explanation_en": "A 'Zero Day' is an unknown system vulnerability that can be exploited since it does not yet exist in any vulnerability database.", "question_th": "ในศัพท์เฉพาะด้านเหตุการณ์ความหมายของ Zero Day คืออะไร?", "options_th": ["วันที่ใช้แก้ไขช่องโหว่ที่ไม่เคยรู้จักมาก่อน", "ช่องโหว่ของระบบที่ไม่เคยถูกค้นพบมาก่อน", "วันที่ไม่มีเหตุการณ์ด้านความปลอดภัยไซเบอร์", "วันที่เกิดเหตุการณ์ด้านความปลอดภัยไซเบอร์"], "explanation_th": "'Zero Day' คือช่องโหว่ของระบบที่ยังไม่เคยถูกค้นพบมาก่อน จึงยังไม่มีอยู่ในฐานข้อมูลช่องโหว่ใด ๆ ทำให้ตรวจจับและป้องกันได้ยาก"}, {"id": 204, "dom": 2, "question": "Which of the following is NOT a possible model for an Incident Response Team (IRT)?", "options": ["Leveraged", "Pre-existing", "Dedicated", "Hybrid"], "correct_idx": 1, "explanation": "The three possible models for incident response are Leveraged, Dedicated, and Hybrid (see the ISC2 Study Guide, Chapter 2, Module 1, under Chapter Takeaways). The term 'Pre-existing' is not a valid model for an IRT.", "short_explanation_en": "The three possible models for incident response are Leveraged, Dedicated, and Hybrid (see the ISC2 Study Guide, Chapter 2, Module 1, under Chapter Takeaways).", "question_th": "ข้อใดไม่ใช่รูปแบบที่เป็นไปได้สำหรับทีมตอบสนองต่อเหตุการณ์ (IRT)?", "options_th": ["Leveraged", "Pre-existing", "Dedicated", "Hybrid"], "explanation_th": "สามรูปแบบที่เป็นไปได้ของทีมตอบสนองต่อเหตุการณ์คือ Leveraged, Dedicated และ Hybrid คำว่า 'Pre-existing' ไม่ใช่รูปแบบที่ถูกต้องของ IRT"}, {"id": 205, "dom": 5, "question": "A device found not to comply with the security baseline should be:", "options": ["Disabled or separated into a quarantine area until a virus scan can be run", "Disabled or isolated into a quarantine area until it can be checked and updated.", "Placed in a demilitarized zone (DMZ) until it can be reviewed and updated", "Marked as potentially vulnerable and placed in a quarantine area"], "correct_idx": 1, "explanation": "Security baselines are used to guarantee that network devices, software, hardware and endpoints are configured consistently. Baselines ensure that all such devices comply with the security baseline set by the organization. Whenever a device is found not compliant with the security baseline, it may be disabled or isolated into a quarantine area until it can be checked and updated (see ISC2 Study Guide, chapter 5, module 2, under Configuration Management Overview). A github.com/ayemunhossain DMZ i", "short_explanation_en": "Security baselines are used to guarantee that network devices, software, hardware and endpoints are configured consistently.", "question_th": "อุปกรณ์ที่พบว่าไม่สอดคล้องกับ security baseline ควรถูก:", "options_th": ["ปิดใช้งานหรือแยกไว้ในพื้นที่กักกันจนกว่าจะสามารถสแกนไวรัสได้", "ปิดใช้งานหรือแยกไว้ในพื้นที่กักกันจนกว่าจะสามารถตรวจสอบและอัปเดตได้", "วางไว้ใน DMZ จนกว่าจะสามารถทบทวนและอัปเดตได้", "ทำเครื่องหมายว่ามีความเสี่ยงและวางไว้ในพื้นที่กักกัน"], "explanation_th": "Security baseline ใช้เพื่อรับประกันว่าอุปกรณ์เครือข่าย ซอฟต์แวร์ ฮาร์ดแวร์ และ endpoint ได้รับการตั้งค่าอย่างสอดคล้องกัน เมื่อพบอุปกรณ์ที่ไม่สอดคล้องกับ baseline อาจต้องปิดใช้งานหรือแยกไว้ในพื้นที่กักกันจนกว่าจะสามารถตรวจสอบและอัปเดตได้"}, {"id": 206, "dom": 1, "question": "A biometric reader that grants access to a computer system in a data center is a:", "options": ["Administrative Control", "Physical Control", "Authorization Control", "Technical Control"], "correct_idx": 3, "explanation": "Physical controls have to do with the architectural features of buildings and facilities. Administrative controls are connected to the actions of people within the organization. Technical controls are implemented inside of computer systems. Authorization controls relate to the assets to which a user is granted access inside a particular computer system (see ISC2 Study Guide Chapter 1, Module 3).", "short_explanation_en": "Physical controls have to do with the architectural features of buildings and facilities.", "question_th": "เครื่องอ่านไบโอเมตริกซ์ที่ให้สิทธิ์เข้าถึงระบบคอมพิวเตอร์ในศูนย์ข้อมูลคือ:", "options_th": ["Administrative Control", "Physical Control", "Authorization Control", "Technical Control"], "explanation_th": "การควบคุมทางกายภาพเกี่ยวข้องกับคุณลักษณะทางสถาปัตยกรรมของอาคารและสถานที่ การควบคุมเชิงบริหารเกี่ยวข้องกับการกระทำของบุคคลภายในองค์กร การควบคุมทางเทคนิคถูกนำไปใช้ภายในระบบคอมพิวเตอร์ การควบคุมด้านการอนุญาตเกี่ยวข้องกับทรัพย์สินที่ผู้ใช้ได้รับอนุญาตให้เข้าถึงภายในระบบคอมพิวเตอร์เฉพาะ"}, {"id": 207, "dom": 4, "question": "Which type of attack PRIMARILY aims to make a resource inaccessible to its intended users?", "options": ["Denials of Service", "Phishing", "Trojans", "Cross-Site Scripting"], "correct_idx": 0, "explanation": "A denial of service attack (DoS) consists in compromising the availability of a system or service through a malicious overload of requests, which causes the activation of safety mechanisms that delay or limit the availability of that system or service. Due to this, systems or services are rendered inaccessible to their intended users. Trojans, phishing, and cross-site scripting attacks try to covertly gain access to the system or data, and therefore do not primarily aim at github.com/ayemunhossa", "short_explanation_en": "A denial of service attack (DoS) consists in compromising the availability of a system or service through a malicious overload of requests, which causes the activation of safety mechanisms that delay or limit the availability of that...", "question_th": "การโจมตีประเภทใดที่มีวัตถุประสงค์หลักในการทำให้ทรัพยากรไม่สามารถเข้าถึงได้สำหรับผู้ใช้ที่ตั้งใจไว้?", "options_th": ["Denials of Service", "Phishing", "Trojans", "Cross-Site Scripting"], "explanation_th": "การโจมตีแบบ denial of service (DoS) เกี่ยวข้องกับการทำให้ availability ของระบบหรือบริการถูกบุกรุกผ่านการท่วมคำขอที่เป็นอันตราย ซึ่งก่อให้เกิดการเปิดใช้กลไกความปลอดภัยที่ทำให้ availability ของระบบหรือบริการล่าช้าหรือจำกัด"}, {"id": 208, "dom": 4, "question": "Which type of attack embeds malicious payload inside a reputable or trusted software?", "options": ["Trojans", "Phishing", "Rootkits", "Cross-Site Scripting"], "correct_idx": 0, "explanation": "Trojans are a type of software that appears legitimate but has hidden malicious functions that evade security mechanisms, typically by exploiting legitimate authorizations of the user that invokes the program. Rootkits try to maintain privilege-level access while concealing malicious activity. They often replace system files, so they are activated when the system is restarted. Trojans often install Rootkits, but Rootkits are not the Trojans themselves). Phishing typically tries to redirect the u", "short_explanation_en": "Trojans are a type of software that appears legitimate but has hidden malicious functions that evade security mechanisms, typically by exploiting legitimate authorizations of the user that invokes the program.", "question_th": "การโจมตีประเภทใดที่ฝัง payload ที่เป็นอันตรายไว้ในซอฟต์แวร์ที่มีชื่อเสียงหรือเชื่อถือได้?", "options_th": ["Trojans", "Phishing", "Rootkits", "Cross-Site Scripting"], "explanation_th": "Trojans คือซอฟต์แวร์ประเภทหนึ่งที่ดูเหมือนถูกต้องตามกฎหมายแต่มีฟังก์ชันที่เป็นอันตรายซ่อนอยู่ซึ่งหลบเลี่ยงกลไกความปลอดภัย โดยปกติจะใช้ประโยชน์จากการอนุญาตที่ถูกต้องของผู้ใช้ที่เรียกใช้โปรแกรม"}, {"id": 209, "dom": 4, "question": "Which tool is commonly used to sniff network traffic? (★)", "options": ["Burp Suite", "John the Ripper", "Wireshark", "Nslookup"], "correct_idx": 2, "explanation": "Wireshark is the world's most widely-used and complete network protocol analyzer that, informally speaking, is the \"microscope\" of network traffic. John the Ripper is a famous Open Source password security auditing and password recovery tool. Nslookup is a network administration command-line tool for querying the Domain Name System that obtains the mapping between the domain name, IP address, or other DNS records. Finally, Burp Suite is a set of well- github.com/ayemunhossain known vulnerability", "short_explanation_en": "Wireshark is the world's most widely-used and complete network protocol analyzer that, informally speaking, is the \"microscope\" of network traffic.", "question_th": "เครื่องมือใดที่มักใช้ในการดักฟังทราฟฟิกเครือข่าย?", "options_th": ["Burp Suite", "John the Ripper", "Wireshark", "Nslookup"], "explanation_th": "Wireshark คือเครื่องมือวิเคราะห์โปรโตคอลเครือข่ายที่ใช้กันอย่างแพร่หลายและครบถ้วนที่สุดในโลก ซึ่งเปรียบเสมือน 'กล้องจุลทรรศน์' ของทราฟฟิกเครือข่าย"}, {"id": 210, "dom": 4, "question": "Which of these is not an attack against an IP network?", "options": ["Side-channel Attack", "Man-in-the-middle Attack", "Fragmented Packet Attack", "Oversized Packet Attack"], "correct_idx": 0, "explanation": "Man-in-the-middle Attacks, Oversized Packet Attacks, and Fragmented Packet Attacks are typical IP network attacks (see ISC2 Study Guide, Chapter 4, Module 1, under Security of the Network). Side Channel Attacks are non-invasive attacks that extract information from devices (typically devices running cryptographic algorithms), and therefore do not aim at IP networks.", "short_explanation_en": "Man-in-the-middle Attacks, Oversized Packet Attacks, and Fragmented Packet Attacks are typical IP network attacks (see ISC2 Study Guide, Chapter 4, Module 1, under Security of the Network).", "question_th": "ข้อใดต่อไปนี้ไม่ใช่การโจมตีต่อเครือข่าย IP?", "options_th": ["Side-channel Attack", "Man-in-the-middle Attack", "Fragmented Packet Attack", "Oversized Packet Attack"], "explanation_th": "Man-in-the-middle Attacks, Oversized Packet Attacks และ Fragmented Packet Attacks เป็นการโจมตีเครือข่าย IP ทั่วไป Side Channel Attacks เป็นการโจมตีแบบไม่รุกล้ำที่ดึงข้อมูลจากอุปกรณ์ (โดยทั่วไปคืออุปกรณ์ที่รันอัลกอริทึมการเข้ารหัส) จึงไม่ได้มุ่งเป้าไปที่เครือข่าย IP"}, {"id": 211, "dom": 1, "question": "The detailed steps to complete tasks supporting departmental or organizational policies are typically documented in:", "options": ["Regulations", "Standards", "Policies", "Procedures"], "correct_idx": 3, "explanation": "Policies are high-level documents that frame all ongoing activities of an organization to ensure that it complies with industry standards and regulations. Regulations are usually devised by governments. Standards are created by governing or professional bodies to support regulations. Both regulations and standards are created outside of the organization (see ISC2 Study Guide Chapter 1, Module 4). github.com/ayemunhossain", "short_explanation_en": "Policies are high-level documents that frame all ongoing activities of an organization to ensure that it complies with industry standards and regulations.", "question_th": "ขั้นตอนโดยละเอียดในการทำงานให้เสร็จสมบูรณ์เพื่อสนับสนุนนโยบายของหน่วยงานหรือองค์กร มักถูกบันทึกไว้ใน:", "options_th": ["Regulations", "Standards", "Policies", "Procedures"], "explanation_th": "นโยบาย (Policies) เป็นเอกสารระดับสูงที่กำหนดกรอบกิจกรรมต่อเนื่องทั้งหมดขององค์กรเพื่อให้มั่นใจว่าสอดคล้องกับมาตรฐานอุตสาหกรรมและกฎระเบียบ กฎระเบียบมักถูกกำหนดโดยรัฐบาล มาตรฐานถูกสร้างขึ้นโดยหน่วยงานกำกับดูแลหรือวิชาชีพเพื่อสนับสนุนกฎระเบียบ"}, {"id": 212, "dom": 4, "question": "Which device is used to connect a LAN to the Internet?", "options": ["SIEM", "HIDS", "Router", "Firewall"], "correct_idx": 2, "explanation": "A router is a device that acts as a gateway between two or more networks by relaying and directing data packets between them. A firewall is a device that filters traffic coming from the Internet but does not seek to distribute traffic. Neither Security Information and Event Management (SIEM) systems nor Host Intrusion Detection Systems (HIDS) are monitoring devices nor applications that aim at inter-network connectivity.", "short_explanation_en": "A router is a device that acts as a gateway between two or more networks by relaying and directing data packets between them.", "question_th": "อุปกรณ์ใดใช้เพื่อเชื่อมต่อ LAN กับอินเทอร์เน็ต?", "options_th": ["SIEM", "HIDS", "Router", "Firewall"], "explanation_th": "Router คืออุปกรณ์ที่ทำหน้าที่เป็นเกตเวย์ระหว่างสองเครือข่ายขึ้นไป โดยส่งต่อและกำหนดเส้นทางแพ็กเก็ตข้อมูลระหว่างกัน Firewall เป็นอุปกรณ์ที่กรองทราฟฟิกจากอินเทอร์เน็ตแต่ไม่ได้มุ่งกระจายทราฟฟิก"}, {"id": 213, "dom": 5, "question": "What does SIEM mean?", "options": ["Security Information and Enterprise Manager", "Security Information and Event Manager", "System Information and Enterprise Manager", "System Information and Event Manager"], "correct_idx": 1, "explanation": "Security Information and Event Management (SIEM) is software for aggregating logs and events from applications, servers, network equipment, and specialized security equipment such as firewalls or Intrusion Prevention systems (IPS). SIEM offers a unified view of security-related data, and is capable of identifying deviations to the regular operation of systems that are often symptoms of attacks. The remaining options do not refer to any common term in Cybersecurity.", "short_explanation_en": "Security Information and Event Management (SIEM) is software for aggregating logs and events from applications, servers, network equipment, and specialized security equipment such as firewalls or Intrusion Prevention systems (IPS).", "question_th": "SIEM ย่อมาจากอะไร?", "options_th": ["Security Information and Enterprise Manager", "Security Information and Event Manager", "System Information and Enterprise Manager", "System Information and Event Manager"], "explanation_th": "Security Information and Event Management (SIEM) คือซอฟต์แวร์สำหรับรวบรวม log และเหตุการณ์จากแอปพลิเคชัน เซิร์ฟเวอร์ อุปกรณ์เครือข่าย และอุปกรณ์ความปลอดภัยเฉพาะทาง เช่น ไฟร์วอลล์หรือระบบ Intrusion Prevention (IPS) SIEM ให้มุมมองรวมของข้อมูลที่เกี่ยวข้องกับความปลอดภัย และสามารถระบุความเบี่ยงเบนจากการทำงานปกติของระบบซึ่งมักเป็นสัญญาณของการโจมตี"}, {"id": 214, "dom": 1, "question": "A Security safeguard is the same as a: github.com/ayemunhossain", "options": ["Safety control", "Privacy control", "Security control", "Security principle"], "correct_idx": 2, "explanation": "Security safeguards are approved security measures taken to protect computational resources by eliminating or reducing the risk to a system. These can be measures like hardware and software mechanisms, policies, procedures, and physical controls (see NIST SP 800-28 Version 2, under safeguard). This definition matches the definition of security control as the means of managing risk, including policies, procedures, guidelines, practices, or organizational structures, which can be of an administrat", "short_explanation_en": "Security safeguards are approved security measures taken to protect computational resources by eliminating or reducing the risk to a system.", "question_th": "Security safeguard เหมือนกับ:", "options_th": ["Safety control", "Privacy control", "Security control", "Security principle"], "explanation_th": "Security safeguards คือมาตรการความปลอดภัยที่ได้รับการอนุมัติเพื่อปกป้องทรัพยากรคอมพิวเตอร์โดยการขจัดหรือลดความเสี่ยงต่อระบบ ซึ่งอาจเป็นมาตรการต่าง ๆ เช่น กลไกฮาร์ดแวร์และซอฟต์แวร์ นโยบาย ขั้นตอน และการควบคุมทางกายภาพ นิยามนี้ตรงกับนิยามของ security control ในฐานะวิธีการจัดการความเสี่ยง"}, {"id": 215, "dom": 3, "question": "Which access control model can grant access to a given object based on complex rules?", "options": ["DAC", "ABAC", "RBAC", "MAC"], "correct_idx": 1, "explanation": "ABAC is an access control model that controls access to objects using rules that are evaluated according to the attributes of the subject, relevant objects, and attributes of the environment and action. The RBAC and MAC models are based on more straightforward and relatively less flexible rule systems, which are evaluated according to subject roles and security classifications. The rules that can be specified in a DAC model are even simpler than those of the previous two models", "short_explanation_en": "ABAC is an access control model that controls access to objects using rules that are evaluated according to the attributes of the subject, relevant objects, and attributes of the environment and action.", "question_th": "โมเดลควบคุมการเข้าถึงใดที่สามารถให้สิทธิ์การเข้าถึงวัตถุที่กำหนดตามกฎที่ซับซ้อน?", "options_th": ["DAC", "ABAC", "RBAC", "MAC"], "explanation_th": "ABAC เป็นโมเดลควบคุมการเข้าถึงที่ควบคุมการเข้าถึงวัตถุโดยใช้กฎที่ประเมินตามคุณลักษณะของ subject วัตถุที่เกี่ยวข้อง และคุณลักษณะของสภาพแวดล้อมและการกระทำ โมเดล RBAC และ MAC อิงตามระบบกฎที่ตรงไปตรงมาและยืดหยุ่นน้อยกว่า"}, {"id": 216, "dom": 4, "question": "Which port is used to secure communication over the web (HTTPS)?", "options": ["69", "80 github.com/ayemunhossain", "25", "443"], "correct_idx": 3, "explanation": "All options show examples of logical communication ports. Port 80 is reserved for plain HTTP connections, port 69 for TFTP protocol; and port 25 for SMTP protocol. Port 443 is the one reserved for HTTPS connections.", "short_explanation_en": "All options show examples of logical communication ports. Port 80 is reserved for plain HTTP connections, port 69 for TFTP protocol; and port 25 for SMTP protocol.", "question_th": "พอร์ตใดที่ใช้เพื่อการสื่อสารที่ปลอดภัยบนเว็บ (HTTPS)?", "options_th": ["69", "80", "25", "443"], "explanation_th": "ตัวเลือกทั้งหมดแสดงตัวอย่างของพอร์ตการสื่อสารเชิงตรรกะ พอร์ต 80 สงวนไว้สำหรับการเชื่อมต่อ HTTP แบบธรรมดา พอร์ต 69 สำหรับโปรโตคอล TFTP และพอร์ต 25 สำหรับโปรโตคอล SMTP พอร์ต 443 คือพอร์ตที่สงวนไว้สำหรับการเชื่อมต่อ HTTPS"}, {"id": 217, "dom": 2, "question": "Which of these has the PRIMARY objective of identifying and prioritizing critical business processes?", "options": ["Business Impact Plan", "Business Impact Analysis", "Disaster Recovery Plan", "Business Continuity Plan"], "correct_idx": 1, "explanation": "The term 'Business Impact Plan' does not exist. A Business Impact Analysis (BIA) is a technique for analyzing how disruptions can affect an organization, and determines the criticality of all business activities and associated resources. A Business Continuity Plan (BCP) is a pre-determined set of instructions describing how the mission/business processes of an organization will be sustained during and after a significant disruption. A Disaster Recovery Plan is a written plan for recovering infor", "short_explanation_en": "The term 'Business Impact Plan' does not exist. A Business Impact Analysis (BIA) is a technique for analyzing how disruptions can affect an organization, and determines the criticality of all business activities and associated resources.", "question_th": "ข้อใดมีวัตถุประสงค์หลักในการระบุและจัดลำดับความสำคัญของกระบวนการทางธุรกิจที่สำคัญ?", "options_th": ["Business Impact Plan", "Business Impact Analysis", "Disaster Recovery Plan", "Business Continuity Plan"], "explanation_th": "คำว่า 'Business Impact Plan' ไม่มีอยู่จริง ในขณะที่ Business Impact Analysis (BIA) คือเทคนิคการวิเคราะห์ว่าการหยุดชะงักส่งผลกระทบต่อองค์กรอย่างไร"}, {"id": 218, "dom": 1, "question": "Which of the following are NOT types of security controls?", "options": ["Common controls", "Hybrid controls", "System-specific controls", "Storage controls github.com/ayemunhossain"], "correct_idx": 3, "explanation": "Storage controls are not a type of security control. Security controls are safeguards or countermeasures that an organization can employ to avoid, counteract or minimize security risks. System-specific controls are security controls that provide security capability for only one specific information system. Common controls are security controls that provide security capability for multiple information systems. Hybrid controls have characteristics of both system-specific and common controls.", "short_explanation_en": "Storage controls are not a type of security control. Security controls are safeguards or countermeasures that an organization can employ to avoid, counteract or minimize security risks.", "question_th": "ข้อใดไม่ใช่ประเภทของการควบคุมความปลอดภัย?", "options_th": ["Common controls", "Hybrid controls", "System-specific controls", "Storage controls"], "explanation_th": "Storage controls ไม่ใช่ประเภทของการควบคุมความปลอดภัย การควบคุมความปลอดภัยคือมาตรการป้องกันหรือมาตรการตอบโต้ที่องค์กรสามารถใช้เพื่อหลีกเลี่ยง ตอบโต้ หรือลดความเสี่ยงด้านความปลอดภัย System-specific controls เป็นการควบคุมที่ให้ความสามารถด้านความปลอดภัยสำหรับระบบสารสนเทศเฉพาะระบบเดียว Common controls ให้ความสามารถด้านความปลอดภัยสำหรับหลายระบบ"}, {"id": 219, "dom": 5, "question": "Which of the following is NOT a type of learning activity used in Security Awareness?", "options": ["Awareness", "Training", "Education", "Tutorial"], "correct_idx": 3, "explanation": "The three learning activities that organizations use in training for security awareness are Education, Training and Awareness (see ISC2 Study Guide, chapter 5, module 4). A tutorial is a form of training, but is not on the list of types of learning activities.", "short_explanation_en": "The three learning activities that organizations use in training for security awareness are Education, Training and Awareness (see ISC2 Study Guide, chapter 5, module 4).", "question_th": "ข้อใดไม่ใช่ประเภทกิจกรรมการเรียนรู้ที่ใช้ใน Security Awareness?", "options_th": ["Awareness", "Training", "Education", "Tutorial"], "explanation_th": "กิจกรรมการเรียนรู้สามประเภทที่องค์กรใช้ในการฝึกอบรมสร้างความตระหนักด้านความปลอดภัยคือ Education, Training และ Awareness ส่วน Tutorial เป็นรูปแบบหนึ่งของการฝึกอบรม แต่ไม่ได้อยู่ในรายการประเภทกิจกรรมการเรียนรู้"}, {"id": 220, "dom": 1, "question": "The magnitude of the harm expected as a result of the consequences of an unauthorized disclosure, modification, destruction, or loss of information, is known as the:", "options": ["Vulnerability", "Threat", "Impact", "Likelihood"], "correct_idx": 2, "explanation": "The sentence matches the definition of the concept of impact (see NIST SP 800-60 Vol. 1 Rev. 1 under Impact). Furthermore, the ISC2 Study Guide, chapter 1, defines likelihood as the probability that a potential vulnerability may be exploited. A threat is defined as a circumstance or event that can adversely impact organizational operations. A vulnerability is a weakness that a threat can exploit.", "short_explanation_en": "The sentence matches the definition of the concept of impact (see NIST SP 800-60 Vol.", "question_th": "ขนาดของความเสียหายที่คาดว่าจะเกิดขึ้นจากผลของการเปิดเผย การดัดแปลง การทำลาย หรือการสูญเสียข้อมูลโดยไม่ได้รับอนุญาต เรียกว่า:", "options_th": ["Vulnerability", "Threat", "Impact", "Likelihood"], "explanation_th": "ประโยคนี้ตรงกับนิยามของแนวคิด impact นอกจากนี้ ISC2 Study Guide บทที่ 1 นิยาม likelihood ว่าเป็นความน่าจะเป็นที่ช่องโหว่ที่มีศักยภาพอาจถูกใช้ประโยชน์ Threat ถูกนิยามว่าเป็นสถานการณ์หรือเหตุการณ์ที่สามารถส่งผลกระทบเชิงลบต่อการดำเนินงานขององค์กร Vulnerability คือจุดอ่อนที่ Threat สามารถใช้ประโยชน์ได้"}, {"id": 221, "dom": 1, "question": "The implementation of Security Controls is a form of:", "options": ["Risk reduction", "Risk acceptance", "Risk avoidance", "Risk transference"], "correct_idx": 0, "explanation": "The implementation of Security Controls involves taking actions to mitigate risk, and thus is a form of risk reduction. Risk acceptance will take no action, risk avoidance will modify operations in order to avoid risk entirely, and risk transference will transfer the risk to another party.", "short_explanation_en": "The implementation of Security Controls involves taking actions to mitigate risk, and thus is a form of risk reduction.", "question_th": "การนำการควบคุมความปลอดภัย (Security Controls) มาใช้เป็นรูปแบบหนึ่งของ:", "options_th": ["Risk reduction", "Risk acceptance", "Risk avoidance", "Risk transference"], "explanation_th": "การนำการควบคุมความปลอดภัยมาใช้เกี่ยวข้องกับการดำเนินการเพื่อลดความเสี่ยง จึงเป็นรูปแบบหนึ่งของ risk reduction Risk acceptance คือการไม่ดำเนินการใด ๆ risk avoidance คือการปรับเปลี่ยนการดำเนินงานเพื่อหลีกเลี่ยงความเสี่ยงทั้งหมด และ risk transference คือการโอนความเสี่ยงไปยังฝ่ายอื่น"}, {"id": 222, "dom": 4, "question": "Which of the following attacks take advantage of poor input validation in websites?", "options": ["Trojans", "Cross-Site Scripting", "Phishing", "Rootkits"], "correct_idx": 1, "explanation": "Cross-Site Scripting (XSS) is a type of attack where malicious executable scripts are injected into the code of an otherwise benign website (or web application). Websites are vulnerable to XSS when they display data originating from requests or forms without validating it (and further sanitizing it, so that it is not executable). Trojans and phishing are github.com/ayemunhossain attacks where software applications and messages try to appear legitimate but have hidden malicious functions, not nec", "short_explanation_en": "Cross-Site Scripting (XSS) is a type of attack where malicious executable scripts are injected into the code of an otherwise benign website (or web application).", "question_th": "การโจมตีใดต่อไปนี้ใช้ประโยชน์จากการตรวจสอบข้อมูลนำเข้าที่ไม่ดีในเว็บไซต์?", "options_th": ["Trojans", "Cross-Site Scripting", "Phishing", "Rootkits"], "explanation_th": "Cross-Site Scripting (XSS) คือการโจมตีที่สคริปต์ที่สามารถรันได้ซึ่งเป็นอันตรายถูกแทรกเข้าไปในโค้ดของเว็บไซต์ที่ไม่มีอันตราย เว็บไซต์มีความเสี่ยงต่อ XSS เมื่อแสดงข้อมูลที่มาจากคำขอหรือแบบฟอร์มโดยไม่ได้ตรวจสอบความถูกต้อง"}, {"id": 223, "dom": 1, "question": "Which of the following is an example of an administrative security control?", "options": ["Access Control Lists", "Acceptable Use Policies", "Badge Readers", "No entry signs"], "correct_idx": 1, "explanation": "Policies are a type of administrative security controls. An access control list is a type of technical security control. A badge reader and a 'No entry' sign are types of physical security controls (see ISC2 Study Guide, Chapter 1, Module 3).", "short_explanation_en": "Policies are a type of administrative security controls. An access control list is a type of technical security control.", "question_th": "ข้อใดเป็นตัวอย่างของการควบคุมความปลอดภัยเชิงบริหาร (Administrative security control)?", "options_th": ["Access Control Lists", "Acceptable Use Policies", "Badge Readers", "No entry signs"], "explanation_th": "นโยบายเป็นประเภทหนึ่งของการควบคุมความปลอดภัยเชิงบริหาร รายการควบคุมการเข้าถึง (Access control list) เป็นการควบคุมความปลอดภัยทางเทคนิค เครื่องอ่านบัตรและป้าย 'ห้ามเข้า' เป็นการควบคุมความปลอดภัยทางกายภาพ"}, {"id": 224, "dom": 5, "question": "In Change Management, which component addresses the procedures needed to undo changes?", "options": ["Request for Approval", "Request for Change", "Rollback", "Disaster and Recover"], "correct_idx": 2, "explanation": "In Change Management, the Request For Change (RFC) is the first stage of the request: it formalizes the change from the stakeholders' point of view. The next phase is the Approval phase, where each stakeholder reviews the change, identifies and allocates the corresponding resources, and eventually either approves or rejects the change (appropriately documenting the approval or rejection). Finally, the Rollback phase addresses the actions to take when the monitoring change suggests a failure or i", "short_explanation_en": "In Change Management, the Request For Change (RFC) is the first stage of the request: it formalizes the change from the stakeholders' point of view.", "question_th": "ใน Change Management องค์ประกอบใดที่จัดการขั้นตอนที่จำเป็นในการยกเลิกการเปลี่ยนแปลง?", "options_th": ["Request for Approval", "Request for Change", "Rollback", "Disaster and Recover"], "explanation_th": "ใน Change Management, Request For Change (RFC) เป็นขั้นตอนแรกของคำขอ: ทำให้การเปลี่ยนแปลงเป็นทางการจากมุมมองของผู้มีส่วนได้ส่วนเสีย ขั้นตอนถัดไปคือขั้นตอนการอนุมัติ และสุดท้ายคือขั้นตอน Rollback ที่จัดการการดำเนินการเมื่อการเปลี่ยนแปลงที่ถูกเฝ้าติดตามบ่งชี้ถึงความล้มเหลว"}, {"id": 225, "dom": 5, "question": "Which of the following properties is NOT guaranteed by Digital Signatures?", "options": ["Authentication", "Confidentiality", "Non-Repudiation", "Integrity"], "correct_idx": 1, "explanation": "The correct answer is B. A digital signature is the result of a cryptographic transformation of data which is useful for providing: data origin authentication, data integrity, and non-repudiation of the signer (see NIST SP 800-12 Rev. 1 under Digital Signature). However, digital signatures cannot guarantee confidentiality (i.e. the property of data or information not being made available or disclosed).", "short_explanation_en": "The correct answer is B. A digital signature is the result of a cryptographic transformation of data which is useful for providing: data origin authentication, data integrity, and non-repudiation of the signer (see NIST SP 800-12 Rev.", "question_th": "คุณสมบัติใดที่ Digital Signatures ไม่ได้รับประกัน?", "options_th": ["Authentication", "Confidentiality", "Non-Repudiation", "Integrity"], "explanation_th": "คำตอบคือ B ลายเซ็นดิจิทัลเป็นผลลัพธ์ของการแปลงข้อมูลทางการเข้ารหัสซึ่งมีประโยชน์ในการให้: การยืนยันแหล่งที่มาของข้อมูล ความถูกต้องครบถ้วนของข้อมูล และ non-repudiation ของผู้ลงนาม อย่างไรก็ตาม ลายเซ็นดิจิทัลไม่สามารถรับประกันความลับ (confidentiality) ได้"}, {"id": 226, "dom": 5, "question": "Which devices have the PRIMARY objective of collecting and analyzing security events?", "options": ["Hubs", "Firewalls", "Routers", "SIEM"], "correct_idx": 3, "explanation": "A Security Information and Event Management (SIEM) system is an application that gathers security data from information system components and presents actionable information through a unified interface. Routers and Hubs aim to receive and forward traffic. Firewalls filter incoming traffic. Neither of these last three options aims at collecting and analyzing security events.", "short_explanation_en": "A Security Information and Event Management (SIEM) system is an application that gathers security data from information system components and presents actionable information through a unified interface.", "question_th": "อุปกรณ์ใดมีวัตถุประสงค์หลักในการรวบรวมและวิเคราะห์เหตุการณ์ด้านความปลอดภัย?", "options_th": ["Hubs", "Firewalls", "Routers", "SIEM"], "explanation_th": "ระบบ Security Information and Event Management (SIEM) คือแอปพลิเคชันที่รวบรวมข้อมูลความปลอดภัยจากส่วนประกอบของระบบสารสนเทศและนำเสนอข้อมูลที่สามารถนำไปปฏิบัติได้ผ่านอินเทอร์เฟซแบบรวม Routers และ Hubs มีเป้าหมายเพื่อรับและส่งต่อทราฟฟิก ส่วน Firewalls กรองทราฟฟิกขาเข้า"}, {"id": 227, "dom": 5, "question": "What is an effective way of hardening a system? github.com/ayemunhossain", "options": ["Patch the system", "Have an IDS in place", "Run a vulnerability scan", "Create a DMZ for web application services"], "correct_idx": 0, "explanation": "According to NIST SP 800-152, hardening is defined as the process of eliminating the means of an attack by simultaneously patching vulnerabilities and turning off nonessential services. The ISC2 Study Guide, chapter 5, module 2, under Configuration Management Overview, reads \"One of the best ways to achieve a hardened system is to have updates, patches, and service packs installed automatically\". Vulnerability scans and IDS do not eliminate the means of an attack. The DMZ does not eliminate vuln", "short_explanation_en": "According to NIST SP 800-152, hardening is defined as the process of eliminating the means of an attack by simultaneously patching vulnerabilities and turning off nonessential services.", "question_th": "วิธีที่มีประสิทธิภาพในการทำ hardening ระบบคืออะไร?", "options_th": ["แพตช์ระบบ", "มี IDS ติดตั้งอยู่", "รันการสแกนช่องโหว่", "สร้าง DMZ สำหรับบริการเว็บแอปพลิเคชัน"], "explanation_th": "ตาม NIST SP 800-152 การ hardening ถูกนิยามว่าเป็นกระบวนการขจัดช่องทางการโจมตีด้วยการแพตช์ช่องโหว่พร้อมกับปิดบริการที่ไม่จำเป็น การสแกนช่องโหว่และ IDS ไม่ได้ขจัดช่องทางการโจมตี และ DMZ ก็ไม่ได้ขจัดช่องโหว่เช่นกัน"}, {"id": 228, "dom": 5, "question": "Which type of key can be used to both encrypt and decrypt the same message?", "options": ["A public key", "A private key", "An asymmetric key", "A symmetric key"], "correct_idx": 3, "explanation": "Symmetric-key algorithms are a class of cryptographic algorithms that use a single key for both encrypting and decrypting of data. Asymmetric cryptography uses pairs of related keys: the public and the corresponding private keys. A message encrypted with the public key can only be decrypted by its corresponding private key, and vice versa. The term 'asymmetric key' is not applicable here.", "short_explanation_en": "Symmetric-key algorithms are a class of cryptographic algorithms that use a single key for both encrypting and decrypting of data.", "question_th": "กุญแจประเภทใดที่สามารถใช้ทั้งเข้ารหัสและถอดรหัสข้อความเดียวกันได้?", "options_th": ["Public key", "Private key", "Asymmetric key", "Symmetric key"], "explanation_th": "อัลกอริทึมแบบ Symmetric-key คือกลุ่มอัลกอริทึมการเข้ารหัสที่ใช้กุญแจเดียวสำหรับทั้งการเข้ารหัสและถอดรหัสข้อมูล ในขณะที่การเข้ารหัสแบบ Asymmetric ใช้คู่กุญแจที่สัมพันธ์กัน: public key และ private key ที่สอดคล้องกัน"}, {"id": 229, "dom": 5, "question": "Which regulations address data protection and privacy in Europe?", "options": ["SOX", "HIPAA github.com/ayemunhossain", "FISMA", "GDPR"], "correct_idx": 3, "explanation": "The General Data Protection Regulation (GDPR) is the official EU regulation for data protection and privacy. The remaining three options only apply to the United States. The Federal Information Security Management Act (FISMA) contains guidelines and security standards that protect government information and operations in the United States. The Sarbanes-Oxley (SOx) Act of 2002 is a United States federal law that mandates and regulates financial record-keeping and reporting practices for corporati", "short_explanation_en": "The General Data Protection Regulation (GDPR) is the official EU regulation for data protection and privacy.", "question_th": "กฎระเบียบใดที่เกี่ยวข้องกับการปกป้องข้อมูลและความเป็นส่วนตัวในยุโรป?", "options_th": ["SOX", "HIPAA", "FISMA", "GDPR"], "explanation_th": "General Data Protection Regulation (GDPR) คือกฎระเบียบอย่างเป็นทางการของ EU สำหรับการปกป้องข้อมูลและความเป็นส่วนตัว ตัวเลือกอีกสามข้อใช้เฉพาะในสหรัฐอเมริกาเท่านั้น"}, {"id": 230, "dom": 4, "question": "Which of the following types of devices inspect packet header information to either allow or deny network traffic?", "options": ["Hubs", "Firewalls", "Routers", "Switches"], "correct_idx": 1, "explanation": "Standard firewalls examine IP packet headers and flags in order to block or allow traffic from predefined rules. More recently, firewalls with Intrusion Detection Capability (IDS) also analyze each individual packet, looking for specific patterns known to be malicious, and then blocking traffic whenever such patterns are found. Routers, Switches, and Hubs have limited packet filtering capabilities, or none at all. A Router is a device that acts as a gateway between two or more networks by relayi", "short_explanation_en": "Standard firewalls examine IP packet headers and flags in order to block or allow traffic from predefined rules.", "question_th": "อุปกรณ์ประเภทใดต่อไปนี้ที่ตรวจสอบข้อมูล header ของแพ็กเก็ตเพื่ออนุญาตหรือปฏิเสธทราฟฟิกเครือข่าย?", "options_th": ["Hubs", "Firewalls", "Routers", "Switches"], "explanation_th": "ไฟร์วอลล์มาตรฐานตรวจสอบ header และ flag ของแพ็กเก็ต IP เพื่อบล็อกหรืออนุญาตทราฟฟิกตามกฎที่กำหนดไว้ล่วงหน้า Routers, Switches และ Hubs มีความสามารถในการกรองแพ็กเก็ตที่จำกัดหรือไม่มีเลย"}, {"id": 231, "dom": 4, "question": "A web server that accepts requests from external clients should be placed in which network?", "options": ["Intranet github.com/ayemunhossain", "DMZ", "Internal Network", "VPN"], "correct_idx": 1, "explanation": "In Cybersecurity, a DMZ (demilitarized zone) is a physical or logical subnetwork that contains and exposes external-facing services (such as web services). An Internal Network is an organization-controlled network that is isolated from external access. An Intranet is itself an internal network that supports similar protocols and services to the Internet, but only for the organization's internal use. A Virtual Private Network (VPN) creates a secure tunnel between endpoints (whether between networ", "short_explanation_en": "In Cybersecurity, a DMZ (demilitarized zone) is a physical or logical subnetwork that contains and exposes external-facing services (such as web services).", "question_th": "เว็บเซิร์ฟเวอร์ที่รับคำขอจากไคลเอนต์ภายนอกควรถูกวางไว้ในเครือข่ายใด?", "options_th": ["Intranet", "DMZ", "Internal Network", "VPN"], "explanation_th": "ในความปลอดภัยไซเบอร์ DMZ (demilitarized zone) คือเครือข่ายย่อยทางกายภาพหรือทางตรรกะที่มีและเปิดเผยบริการที่หันหน้าออกสู่ภายนอก (เช่น บริการเว็บ) Internal Network คือเครือข่ายที่องค์กรควบคุมซึ่งแยกออกจากการเข้าถึงจากภายนอก"}, {"id": 232, "dom": 1, "question": "Sensitivity is a measure of the …:", "options": ["… protection and timeliness assigned to information by its owner, or the purpose of representing its need for urgency.", "… urgency and protection assigned to information by its owner.", "… importance assigned to information by its owner, or the purpose of representing its need for protection.", "… pertinence assigned to information by its owner, or the purpose of representing its need for urgency."], "correct_idx": 2, "explanation": "Sensitivity is also defined as the measure of the importance assigned to information by its owner, or the purpose of representing its need for protection (see the ISC2 study guide, module 1, under CIA Deep Dive).", "short_explanation_en": "Sensitivity is also defined as the measure of the importance assigned to information by its owner, or the purpose of representing its need for protection (see the ISC2 study guide, module 1, under CIA Deep Dive).", "question_th": "ความอ่อนไหว (Sensitivity) เป็นการวัด …:", "options_th": ["… การป้องกันและความทันเวลาที่กำหนดให้กับข้อมูลโดยเจ้าของ หรือวัตถุประสงค์ในการแสดงถึงความจำเป็นด้านความเร่งด่วน", "… ความเร่งด่วนและการป้องกันที่กำหนดให้กับข้อมูลโดยเจ้าของ", "… ความสำคัญที่กำหนดให้กับข้อมูลโดยเจ้าของ หรือวัตถุประสงค์ในการแสดงถึงความจำเป็นด้านการป้องกัน", "… ความเกี่ยวข้องที่กำหนดให้กับข้อมูลโดยเจ้าของ หรือวัตถุประสงค์ในการแสดงถึงความจำเป็นด้านความเร่งด่วน"], "explanation_th": "Sensitivity ยังถูกนิยามว่าเป็นการวัดความสำคัญที่กำหนดให้กับข้อมูลโดยเจ้าของ หรือวัตถุประสงค์ในการแสดงถึงความจำเป็นในการป้องกัน"}, {"id": 233, "dom": 5, "question": "How many data labels are considered good practice?", "options": ["2 - 3", "1", "1-2 github.com/ayemunhossain", ">4"], "correct_idx": 0, "explanation": "According to the ISC2 Study Guide, chapter 5, module 1, under Data Handling Practices in Labeling, we read that two or three classifications are manageable, but more than four tend to be challenging to manage.", "short_explanation_en": "According to the ISC2 Study Guide, chapter 5, module 1, under Data Handling Practices in Labeling, we read that two or three classifications are manageable, but more than four tend to be challenging to manage.", "question_th": "ป้ายกำกับข้อมูล (Data labels) กี่ประเภทที่ถือเป็นแนวปฏิบัติที่ดี?", "options_th": ["2-3", "1", "1-2", "มากกว่า 4"], "explanation_th": "ตาม ISC2 Study Guide บทที่ 5 โมดูล 1 ในหัวข้อ Data Handling Practices in Labeling ระบุว่าการจัดประเภท 2 หรือ 3 ประเภทนั้นสามารถจัดการได้ดี แต่มากกว่า 4 ประเภทมักจะจัดการได้ยาก"}, {"id": 234, "dom": 5, "question": "Security posters are an element PRIMARILY employed in: (★)", "options": ["Security Awareness", "Incident Response Plans", "Business Continuity Plans", "Physical Security Controls"], "correct_idx": 0, "explanation": "Security posters are used to raise the awareness of employees regarding security threats, and thus are primarily employed in Security Awareness (see ISC2 Study Guide, chapter 5, module 4).", "short_explanation_en": "Security posters are used to raise the awareness of employees regarding security threats, and thus are primarily employed in Security Awareness (see ISC2 Study Guide, chapter 5, module 4).", "question_th": "โปสเตอร์ด้านความปลอดภัยเป็นองค์ประกอบที่ใช้เป็นหลักใน:", "options_th": ["Security Awareness", "Incident Response Plans", "Business Continuity Plans", "Physical Security Controls"], "explanation_th": "โปสเตอร์ด้านความปลอดภัยใช้เพื่อสร้างความตระหนักของพนักงานเกี่ยวกับภัยคุกคามด้านความปลอดภัย จึงถูกใช้เป็นหลักใน Security Awareness"}, {"id": 235, "dom": 1, "question": "Which of these types of user is LESS likely to have a privileged account?", "options": ["System Administrator", "Security Analyst", "Help Desk", "External Worker"], "correct_idx": 3, "explanation": "Typically, external workers should not have access to privileged accounts, due to the possibility of misuse. The Help Desk (or IT Support Staff) may have to view or manipulate endpoints, servers and applications platforms using privileged or restricted operations. Security analysts may require fast access to the IT infrastructure, systems, endpoints and data environment. By definition, systems administrators require privileged accounts, since they are responsible for operating systems, deploying", "short_explanation_en": "Typically, external workers should not have access to privileged accounts, due to the possibility of misuse.", "question_th": "ผู้ใช้ประเภทใดต่อไปนี้มีโอกาสน้อยที่สุดที่จะมีบัญชีสิทธิพิเศษ (Privileged account)?", "options_th": ["System Administrator", "Security Analyst", "Help Desk", "External Worker"], "explanation_th": "โดยทั่วไป พนักงานภายนอกไม่ควรมีสิทธิ์เข้าถึงบัญชีสิทธิพิเศษ เนื่องจากความเป็นไปได้ในการใช้ในทางที่ผิด ฝ่าย Help Desk อาจต้องดูหรือจัดการ endpoint เซิร์ฟเวอร์ และแพลตฟอร์มแอปพลิเคชันโดยใช้การดำเนินการที่มีสิทธิพิเศษหรือถูกจำกัด นักวิเคราะห์ความปลอดภัยอาจต้องการการเข้าถึงโครงสร้างพื้นฐาน IT อย่างรวดเร็ว โดยนิยาม ผู้ดูแลระบบต้องการบัญชีสิทธิพิเศษเนื่องจากรับผิดชอบระบบปฏิบัติการ"}, {"id": 236, "dom": 5, "question": "Which of the following is NOT an element of System Security Configuration Management?", "options": ["Inventory", "Baselines", "Updates", "Audit logs"], "correct_idx": 3, "explanation": "System Security Configuration Management elements are inventories, baselines, updates and patches. Audit logs can be generated after 'Verification and Audit'. However, 'Verification and Audit' is a configuration management procedure, and not a configuration management element (see ISC2 Study Guide, chapter 5, module 2, under Chapter Resource).", "short_explanation_en": "System Security Configuration Management elements are inventories, baselines, updates and patches.", "question_th": "ข้อใดไม่ใช่องค์ประกอบของ System Security Configuration Management?", "options_th": ["Inventory", "Baselines", "Updates", "Audit logs"], "explanation_th": "องค์ประกอบของ System Security Configuration Management คือ inventories, baselines, updates และ patches ส่วน Audit logs สามารถถูกสร้างขึ้นหลังจาก 'Verification and Audit' แต่ 'Verification and Audit' เป็นขั้นตอนการจัดการค่าคอนฟิก ไม่ใช่องค์ประกอบ"}, {"id": 237, "dom": 2, "question": "Which are the components of an incident response plan?", "options": ["Preparation -> Detection and Analysis -> Recovery -> Containment -> Eradication -> Post-Incident Activity", "Preparation -> Detection and Analysis -> Containment -> Eradication -> Post-Incident Activity -> Recovery", "Preparation -> Detection and Analysis -> Eradication -> Recovery -> Containment -> Post-Incident Activity", "Preparation -> Detection and Analysis -> Containment, Eradication and Recovery -> Post-Incident Activity"], "correct_idx": 3, "explanation": "The components commonly found in an incident response plan are (in this order): Preparation; Detection and Analysis; Containment, Eradication and Recovery; Post-Incident Activity (see the ISC2 Chapter 2, Module 1, under Components of github.com/ayemunhossain an Incident Response Plan).", "short_explanation_en": "The components commonly found in an incident response plan are (in this order): Preparation; Detection and Analysis; Containment, Eradication and Recovery; Post-Incident Activity (see the ISC2 Chapter 2, Module 1, under Components of...", "question_th": "องค์ประกอบของแผนตอบสนองต่อเหตุการณ์คืออะไร?", "options_th": ["Preparation -> Detection and Analysis -> Recovery -> Containment -> Eradication -> Post-Incident Activity", "Preparation -> Detection and Analysis -> Containment -> Eradication -> Post-Incident Activity -> Recovery", "Preparation -> Detection and Analysis -> Eradication -> Recovery -> Containment -> Post-Incident Activity", "Preparation -> Detection and Analysis -> Containment, Eradication and Recovery -> Post-Incident Activity"], "explanation_th": "องค์ประกอบมาตรฐานของแผนตอบสนองต่อเหตุการณ์ตามลำดับคือ: Preparation, Detection and Analysis, Containment/Eradication/Recovery และ Post-Incident Activity"}, {"id": 238, "dom": 3, "question": "Which of the following is an example of 2FA?", "options": ["Badges", "Passwords", "Keys", "One-Time passwords (OTA)"], "correct_idx": 3, "explanation": "One-time passwords are typically generated by a device (i.e. \"something you have\") and are required in addition to the actual main password (i.e. \"something you know\"). Badges, keys and passwords with no other overlapping authentication controls are considered single-factor (and thus are not 2FA).", "short_explanation_en": "One-time passwords are typically generated by a device (i.e.", "question_th": "ข้อใดเป็นตัวอย่างของ 2FA?", "options_th": ["บัตรผ่าน", "รหัสผ่าน", "กุญแจ", "รหัสผ่านแบบใช้ครั้งเดียว (OTP)"], "explanation_th": "รหัสผ่านแบบใช้ครั้งเดียวมักถูกสร้างโดยอุปกรณ์ (คือ 'สิ่งที่คุณมี') และจำเป็นต้องใช้ร่วมกับรหัสผ่านหลักจริง (คือ 'สิ่งที่คุณรู้') บัตรผ่าน กุญแจ และรหัสผ่านที่ไม่มีการควบคุมยืนยันตัวตนซ้อนทับกันอื่น ๆ ถือเป็นปัจจัยเดียว (จึงไม่ใช่ 2FA)"}, {"id": 239, "dom": 2, "question": "The predetermined set of instructions or procedures to sustain business operations after a disaster is commonly known as:", "options": ["Business Impact Analysis", "Disaster Recovery Plan", "Business Impact Plan", "Business Continuity Plan"], "correct_idx": 3, "explanation": "A Business Continuity Plan (BCP) is a pre-determined set of instructions describing how an organization's mission/business processes will be sustained during and after a significant disruption (see Chapter 2 ISC2 Study Guide, module 4, under Terms and Definitions). A Business Impact Analysis (BIA) is a technique for analyzing how disruptions can affect an organization. A Disaster Recovery Plan is a written plan for recovering information systems in response to a major failure or disaster. The te", "short_explanation_en": "A Business Continuity Plan (BCP) is a pre-determined set of instructions describing how an organization's mission/business processes will be sustained during and after a significant disruption (see Chapter 2 ISC2 Study Guide, module 4,...", "question_th": "ชุดคำสั่งหรือขั้นตอนที่กำหนดไว้ล่วงหน้าเพื่อรักษาการดำเนินธุรกิจหลังเกิดภัยพิบัติ เรียกว่าอะไร?", "options_th": ["Business Impact Analysis", "Disaster Recovery Plan", "Business Impact Plan", "Business Continuity Plan"], "explanation_th": "Business Continuity Plan (BCP) คือชุดคำสั่งที่กำหนดไว้ล่วงหน้าเพื่ออธิบายว่ากระบวนการทางธุรกิจขององค์กรจะดำเนินต่อไปอย่างไรในระหว่างและหลังเหตุการณ์หยุดชะงักสำคัญ"}, {"id": 240, "dom": 5, "question": "Which of the following is NOT a feature of a cryptographic hash function?", "options": ["Reversible", "Unique", "Deterministic", "Useful"], "correct_idx": 1, "explanation": "A cryptographic hash function should be unique, deterministic, useful, tamper-evident (also referred to as 'the avalanche effect' or 'integrity assurance') and non-reversible (also referred to as 'one-way'). Nonreversible means it is impossible to reverse the hash function to derive the original text of a message from its hash output value (see ISC2 Study Guide, chapter 5, module 1, under Encryption Overview). Thus, the 'reversible' feature is not a feature of a hash function.", "short_explanation_en": "A cryptographic hash function should be unique, deterministic, useful, tamper-evident (also referred to as 'the avalanche effect' or 'integrity assurance') and non-reversible (also referred to as 'one-way').", "question_th": "ข้อใดไม่ใช่คุณสมบัติของฟังก์ชันแฮชเข้ารหัส (Cryptographic hash function)?", "options_th": ["Reversible (ย้อนกลับได้)", "Unique (มีเอกลักษณ์)", "Deterministic (แน่นอน)", "Useful (มีประโยชน์)"], "explanation_th": "ฟังก์ชันแฮชเข้ารหัสควรมีเอกลักษณ์ แน่นอน มีประโยชน์ ตรวจจับการดัดแปลงได้ (หรือเรียกว่า 'avalanche effect') และไม่สามารถย้อนกลับได้ (non-reversible หรือ 'one-way') การไม่สามารถย้อนกลับหมายความว่าเป็นไปไม่ได้ที่จะย้อนฟังก์ชันแฮชเพื่อหาข้อความต้นฉบับจากผลลัพธ์แฮชของมัน ดังนั้นคุณสมบัติ 'reversible' จึงไม่ใช่คุณสมบัติของฟังก์ชันแฮช"}, {"id": 241, "dom": 4, "question": "Which are the three packets used on the TCP connection handshake? (★)", "options": ["Offer → Request → ACK", "SYN → SYN/ACK → ACK", "SYN → ACK → FIN", "Discover → Offer → Request"], "correct_idx": 1, "explanation": "TCP uses a three-way handshake to establish a reliable connection by exchanging three packets with the SYN, SYN/ACK and ACK flags. Although SYN, ACK and FIN are valid TCP packet flags, the sequence SYN → ACK → FIN is not the TCP handshake. Both the sequences Discover → Offer → Request and Offer → Request → ACK are used in DHCP (but are still incomplete, since DHCP is a four-way handshake).", "short_explanation_en": "TCP uses a three-way handshake to establish a reliable connection by exchanging three packets with the SYN, SYN/ACK and ACK flags.", "question_th": "แพ็กเก็ตสามตัวที่ใช้ในการ handshake การเชื่อมต่อ TCP คือ?", "options_th": ["Offer → Request → ACK", "SYN → SYN/ACK → ACK", "SYN → ACK → FIN", "Discover → Offer → Request"], "explanation_th": "TCP ใช้ three-way handshake เพื่อสร้างการเชื่อมต่อที่เชื่อถือได้โดยการแลกเปลี่ยนแพ็กเก็ตสามตัวด้วย flag SYN, SYN/ACK และ ACK แม้ SYN, ACK และ FIN จะเป็น TCP packet flag ที่ถูกต้อง แต่ลำดับ SYN → ACK → FIN ไม่ใช่ TCP handshake"}, {"id": 242, "dom": 2, "question": "After an earthquake disrupting business operations, which document contains the procedures required to return business github.com/ayemunhossain to normal operation?", "options": ["The Business Impact Plan", "The Business Impact Analysis", "The Business Continuity Plan", "The Disaster Recovery Plan"], "correct_idx": 3, "explanation": "A Disaster Recovery Plan (DRP) is a plan for processing and restoring operations in the event of a significant hardware or software failure, or of the destruction of the organization's facilities. The primary goal of a DRP is to restore the business to the last-known reliable state of operations (see Chapter 2 ISC2 Study Guide, module 4, under The Goal of Disaster Recovery). The term 'Business Impact Plan' does not exist. A Business Continuity Plan (BCP) is a pre-determined set of instructions d", "short_explanation_en": "A Disaster Recovery Plan (DRP) is a plan for processing and restoring operations in the event of a significant hardware or software failure, or of the destruction of the organization's facilities.", "question_th": "หลังเกิดแผ่นดินไหวที่ทำให้การดำเนินธุรกิจหยุดชะงัก เอกสารใดมีขั้นตอนที่จำเป็นในการนำธุรกิจกลับสู่การดำเนินงานปกติ?", "options_th": ["The Business Impact Plan", "The Business Impact Analysis", "The Business Continuity Plan", "The Disaster Recovery Plan"], "explanation_th": "Disaster Recovery Plan (DRP) คือแผนสำหรับประมวลผลและกู้คืนการดำเนินงานเมื่อเกิดความล้มเหลวของฮาร์ดแวร์/ซอฟต์แวร์ครั้งใหญ่ หรือการทำลายสถานที่ขององค์กร"}, {"id": 243, "dom": 4, "question": "What is the consequence of a Denial Of Service attack?", "options": ["Exhaustion of device resources", "Malware Infection", "Increase in the availability of resources", "Remote control of a device"], "correct_idx": 0, "explanation": "A denial of service attack (DoS) consists in a malicious overload of requests which will eventually lead to the exhaustion of resources, rendering the service unavailable, as well as causing the activation of safety mechanisms that delay or limit the availability of that system or service. This type of attack seeks to compromise service availability, but not to control a device nor to install malware.", "short_explanation_en": "A denial of service attack (DoS) consists in a malicious overload of requests which will eventually lead to the exhaustion of resources, rendering the service unavailable, as well as causing the activation of safety mechanisms that...", "question_th": "ผลที่ตามมาของการโจมตีแบบ Denial Of Service คืออะไร?", "options_th": ["การทำให้ทรัพยากรของอุปกรณ์หมดสิ้น", "การติดเชื้อมัลแวร์", "การเพิ่มความพร้อมใช้งานของทรัพยากร", "การควบคุมอุปกรณ์จากระยะไกล"], "explanation_th": "การโจมตีแบบ denial of service (DoS) เกี่ยวข้องกับการท่วมคำขอที่เป็นอันตรายซึ่งในที่สุดจะนำไปสู่การหมดสิ้นของทรัพยากร ทำให้บริการไม่พร้อมใช้งาน รวมถึงก่อให้เกิดการเปิดใช้กลไกความปลอดภัยที่ทำให้ availability ของระบบหรือบริการล่าช้าหรือจำกัด"}, {"id": 244, "dom": 5, "question": "According to ISC2, which are the six phases of data handling? github.com/ayemunhossain", "options": ["Create -> Use -> Store -> Share -> Archive -> Destroy", "Create -> Store -> Use -> Share -> Archive -> Destroy", "Create -> Share -> Use ->Store -> Archive -> Destroy", "Create -> Share -> Store -> Use -> Archive -> Destroy"], "correct_idx": 1, "explanation": "According to the data security lifecycle model, the six phases of data security lifecycle model are Create -> Store -> Use -> Share -> Archive -> Destroy (see ISC2 Study Guide, chapter 5, module 1 under data handling).", "short_explanation_en": "According to the data security lifecycle model, the six phases of data security lifecycle model are Create -> Store -> Use -> Share -> Archive -> Destroy (see ISC2 Study Guide, chapter 5, module 1 under data handling).", "question_th": "ตาม ISC2 หกขั้นตอนของการจัดการข้อมูลคืออะไร?", "options_th": ["Create -> Use -> Store -> Share -> Archive -> Destroy", "Create -> Store -> Use -> Share -> Archive -> Destroy", "Create -> Share -> Use ->Store -> Archive -> Destroy", "Create -> Share -> Store -> Use -> Archive -> Destroy"], "explanation_th": "ตามโมเดลวงจรชีวิตความปลอดภัยของข้อมูล หกขั้นตอนของวงจรชีวิตความปลอดภัยของข้อมูลคือ Create -> Store -> Use -> Share -> Archive -> Destroy"}, {"id": 245, "dom": 2, "question": "Which of the following is less likely to be part of an incident response team?", "options": ["Legal representatives", "Human Resources", "Representatives of senior management", "Information security professionals"], "correct_idx": 1, "explanation": "The incident response team carries out the post-incident analysis phase of an incident response plan. They are a cross- functional group of individuals representing the management, technical and functional areas of responsibility most directly impacted by a security incident. In the incident response team, we typically find (i) representatives of senior management, (ii) information security professionals, (iii) legal representatives, (iv) public affairs/communications representatives, (v) engine", "short_explanation_en": "The incident response team carries out the post-incident analysis phase of an incident response plan.", "question_th": "ข้อใดมีโอกาสน้อยที่สุดที่จะเป็นส่วนหนึ่งของทีมตอบสนองต่อเหตุการณ์?", "options_th": ["ตัวแทนฝ่ายกฎหมาย", "ฝ่ายทรัพยากรบุคคล", "ตัวแทนผู้บริหารระดับสูง", "ผู้เชี่ยวชาญด้านความปลอดภัยสารสนเทศ"], "explanation_th": "ทีมตอบสนองต่อเหตุการณ์ทำหน้าที่วิเคราะห์หลังเกิดเหตุการณ์ โดยทั่วไปประกอบด้วยตัวแทนผู้บริหาร ผู้เชี่ยวชาญความปลอดภัย ตัวแทนฝ่ายกฎหมาย และฝ่ายสื่อสาร ส่วนฝ่ายทรัพยากรบุคคลมักไม่ได้เป็นสมาชิกหลัก"}, {"id": 246, "dom": 4, "question": "Which of these tools is commonly used to crack passwords? (★)", "options": ["Burp Suite", "Nslookup github.com/ayemunhossain", "John the Ripper", "Wireshark"], "correct_idx": 2, "explanation": "John the Ripper is a famous Open Source password security auditing and password recovery tool. Burp Suite is a well- known set of tools for vulnerability scanning, penetration testing, and web app security (not for cracking passwords). The remaining options are both network analysis tools. Wireshark is the most used network protocol analyzer in the world. Nslookup is a network administration command-line tool for querying the Domain Name System to obtain the mapping between the domain name, IP a", "short_explanation_en": "John the Ripper is a famous Open Source password security auditing and password recovery tool.", "question_th": "เครื่องมือใดต่อไปนี้มักใช้ในการเจาะรหัสผ่าน?", "options_th": ["Burp Suite", "Nslookup", "John the Ripper", "Wireshark"], "explanation_th": "John the Ripper คือเครื่องมือตรวจสอบความปลอดภัยรหัสผ่านและกู้คืนรหัสผ่านแบบ Open Source ที่มีชื่อเสียง Burp Suite เป็นชุดเครื่องมือที่รู้จักกันดีสำหรับการสแกนช่องโหว่ การทดสอบเจาะระบบ และความปลอดภัยของเว็บแอป (ไม่ใช่สำหรับเจาะรหัสผ่าน)"}, {"id": 247, "dom": 5, "question": "In order to find out whether personal tablet devices are allowed in the office, which of the following policies would be helpful to read?", "options": ["BYOD", "Privacy Policy", "Change Management Policy", "AUP"], "correct_idx": 0, "explanation": "The Bring Your Own Device (BYOD) policy establishes rules for using personal devices for work-related activities. The Acceptable Use Policy (AUP) defines the permissions and limitations that users must agree to while accessing the network and using computer systems or any other organizational resources. The Privacy Policy (PP) outlines the data security mechanisms that protect customer data. In the context of Cybersecurity, a Change Management Policy (CMP) establishes the use of standardized met", "short_explanation_en": "The Bring Your Own Device (BYOD) policy establishes rules for using personal devices for work-related activities.", "question_th": "เพื่อค้นหาว่าอนุญาตให้ใช้อุปกรณ์แท็บเล็ตส่วนตัวในสำนักงานหรือไม่ ควรอ่านนโยบายใด?", "options_th": ["BYOD", "Privacy Policy", "Change Management Policy", "AUP"], "explanation_th": "นโยบาย Bring Your Own Device (BYOD) กำหนดกฎเกณฑ์การใช้อุปกรณ์ส่วนตัวสำหรับกิจกรรมที่เกี่ยวข้องกับงาน ในขณะที่ Acceptable Use Policy (AUP) กำหนดสิทธิ์และข้อจำกัดที่ผู้ใช้ต้องยอมรับเมื่อเข้าถึงเครือข่ายและใช้ระบบคอมพิวเตอร์"}, {"id": 248, "dom": 4, "question": "In which cloud deployment model do companies share resources and infrastructure on the cloud?", "options": ["Hybrid cloud", "Multi-tenant github.com/ayemunhossain", "Private cloud", "Community cloud"], "correct_idx": 3, "explanation": "A private cloud is a cloud computing model where the cloud infrastructure is dedicated to a single organization (and never shared with others). Multitenancy means that multiple cloud vendor customers (i.e. tenants) share the same computing resources. A community cloud is an infrastructure where multiple organizations share resources and infrastructure based on common needs (that can be technological or regulatory). Finally, a hybrid cloud refers to a model that combines (i.e. orchestrates) on-pr", "short_explanation_en": "A private cloud is a cloud computing model where the cloud infrastructure is dedicated to a single organization (and never shared with others).", "question_th": "ในโมเดลการปรับใช้คลาวด์ใดที่บริษัทแชร์ทรัพยากรและโครงสร้างพื้นฐานบนคลาวด์?", "options_th": ["Hybrid cloud", "Multi-tenant", "Private cloud", "Community cloud"], "explanation_th": "Private cloud คือโมเดลคลาวด์คอมพิวติ้งที่โครงสร้างพื้นฐานคลาวด์อุทิศให้กับองค์กรเดียว (และไม่เคยแชร์กับผู้อื่น) Multitenancy หมายความว่าลูกค้าของผู้จำหน่ายคลาวด์หลายรายแชร์ทรัพยากรคอมพิวเตอร์เดียวกัน Community cloud คือโครงสร้างพื้นฐานที่หลายองค์กรแชร์ทรัพยากรและโครงสร้างพื้นฐานตามความต้องการร่วมกัน"}, {"id": 249, "dom": 2, "question": "Which of these is the PRIMARY objective of a Disaster Recovery Plan?", "options": ["Restore company operation to the last-known reliable operation state", "Outline a safe escape procedure for the organization's personnel", "Maintain crucial company operations in the event of a disaster", "Communicate to the responsible entities the damage caused to operations in the event of a disaster"], "correct_idx": 0, "explanation": "A Disaster Recovery Plan (DRP) is a plan for processing and restoring operations in the event of a significant hardware or software failure, or of the destruction of the organization's facilities. The primary goal of a DRP is to restore the business to the last-known reliable state of operations (see Chapter 2 ISC2 Study Guide, module 4, under The Goal of Disaster Recovery). Maintaining crucial operations is the goal of the Business Continuity Plan (BCP). The remaining options may be included in", "short_explanation_en": "A Disaster Recovery Plan (DRP) is a plan for processing and restoring operations in the event of a significant hardware or software failure, or of the destruction of the organization's facilities.", "question_th": "ข้อใดคือวัตถุประสงค์หลักของ Disaster Recovery Plan?", "options_th": ["กู้คืนการดำเนินงานของบริษัทให้กลับสู่สถานะที่เชื่อถือได้ล่าสุด", "ระบุขั้นตอนการอพยพบุคลากรอย่างปลอดภัย", "รักษาการดำเนินงานสำคัญของบริษัทในกรณีเกิดภัยพิบัติ", "สื่อสารความเสียหายต่อการดำเนินงานไปยังหน่วยงานที่รับผิดชอบเมื่อเกิดภัยพิบัติ"], "explanation_th": "Disaster Recovery Plan (DRP) คือแผนสำหรับประมวลผลและกู้คืนการดำเนินงาน โดยมีเป้าหมายหลักคือการนำธุรกิจกลับสู่สถานะการดำเนินงานที่เชื่อถือได้ล่าสุด"}, {"id": 250, "dom": 1, "question": "An entity that acts to exploit a target organization’s system vulnerabilities is a:", "options": ["Threat Vector", "Threat Actor", "Threat github.com/ayemunhossain", "Attacker"], "correct_idx": 1, "explanation": "A Threat Actor is defined as an individual or a group posing a threat (according to NIST SP 800-150 under Threat Actor). A Threat Vector is a means by which a Threat Actor gains access to systems (for example: phishing, trojans, baiting, etc.). An Attacker is always an individual, but a Threat Actor can be either a group or an entity. A Threat is a circumstance or event that can adversely impact organizational operations that a Threat Actor can potentially explore through a Threat Vector.", "short_explanation_en": "A Threat Actor is defined as an individual or a group posing a threat (according to NIST SP 800-150 under Threat Actor).", "question_th": "หน่วยงานที่กระทำการเพื่อใช้ประโยชน์จากช่องโหว่ของระบบขององค์กรเป้าหมายคือ:", "options_th": ["Threat Vector", "Threat Actor", "Threat", "Attacker"], "explanation_th": "Threat Actor ถูกนิยามว่าเป็นบุคคลหรือกลุ่มที่ก่อให้เกิดภัยคุกคาม (ตาม NIST SP 800-150) Threat Vector คือวิธีการที่ Threat Actor ใช้เข้าถึงระบบ (เช่น ฟิชชิ่ง โทรจัน การล่อลวง) ผู้โจมตี (Attacker) มักเป็นบุคคลเสมอ แต่ Threat Actor สามารถเป็นได้ทั้งกลุ่มหรือหน่วยงาน"}, {"id": 251, "dom": 5, "question": "A best practice of patch management is to:", "options": ["Apply all patches as quickly as possible", "Test patches before applying them", "Apply patches every Wednesday", "Apply patches according to the vendor's reputation"], "correct_idx": 1, "explanation": "Patches sometimes disrupt a system's configurations and stability. One of the main challenges for security professionalsis to ensure that patches are deployed as quickly as possible, while simultaneously ensuring the stability of running systems. To prevent flawed patches from negatively affecting running systems, it is good practice to test patches in a designated qualification environment before applying them to production systems (see ISC2 Study Guide, chapter 5, module 2 under Configuration", "short_explanation_en": "Patches sometimes disrupt a system's configurations and stability.", "question_th": "แนวปฏิบัติที่ดีในการทำ patch management คือ:", "options_th": ["ติดตั้งแพตช์ทั้งหมดให้เร็วที่สุด", "ทดสอบแพตช์ก่อนติดตั้ง", "ติดตั้งแพตช์ทุกวันพุธ", "ติดตั้งแพตช์ตามชื่อเสียงของผู้จำหน่าย"], "explanation_th": "บางครั้งแพตช์อาจส่งผลกระทบต่อการตั้งค่าและความเสถียรของระบบ หนึ่งในความท้าทายหลักของผู้เชี่ยวชาญด้านความปลอดภัยคือการรับประกันว่าแพตช์ถูกนำไปใช้อย่างรวดเร็วในขณะที่ยังรับประกันความเสถียรของระบบที่กำลังทำงานอยู่ เพื่อป้องกันไม่ให้แพตช์ที่มีข้อบกพร่องส่งผลกระทบเชิงลบ จึงเป็นแนวปฏิบัติที่ดีที่จะทดสอบแพตช์ในสภาพแวดล้อมทดสอบก่อนนำไปใช้กับระบบจริง"}, {"id": 252, "dom": 4, "question": "Which of these would be the best option if a network administrator needs to control access to a network?", "options": ["HIDS", "IDS", "SIEM github.com/ayemunhossain", "NAC"], "correct_idx": 3, "explanation": "Network Access Control (NAC) refers to a class of mechanisms that prevent access to a network until a user (or the user's device) either presents the relevant credentials, or passes the results of health checks performed on the client device. Security Information and Event Management (SIEM), Host Intrusion Detection Systems (HIDS), and Intrusion Detection Systems (IDS) are all monitoring systems.", "short_explanation_en": "Network Access Control (NAC) refers to a class of mechanisms that prevent access to a network until a user (or the user's device) either presents the relevant credentials, or passes the results of health checks performed on the client...", "question_th": "ตัวเลือกใดต่อไปนี้ดีที่สุดหากผู้ดูแลระบบเครือข่ายต้องการควบคุมการเข้าถึงเครือข่าย?", "options_th": ["HIDS", "IDS", "SIEM", "NAC"], "explanation_th": "Network Access Control (NAC) หมายถึงกลไกประเภทหนึ่งที่ป้องกันการเข้าถึงเครือข่ายจนกว่าผู้ใช้ (หรืออุปกรณ์ของผู้ใช้) จะนำเสนอข้อมูลรับรองที่เกี่ยวข้อง หรือผ่านผลการตรวจสอบสุขภาพที่ดำเนินการบนอุปกรณ์ไคลเอนต์"}, {"id": 253, "dom": 5, "question": "Which of these is NOT a change management component?", "options": ["Approval", "RFC", "Rollback", "Governance"], "correct_idx": 3, "explanation": "All significant change management practices address typical core activities: Request For Change (RFC), Approval, and Rollback (see ISC2 Study Guide, chapter 5, module 3). Governance is not one of these practices.", "short_explanation_en": "All significant change management practices address typical core activities: Request For Change (RFC), Approval, and Rollback (see ISC2 Study Guide, chapter 5, module 3).", "question_th": "ข้อใดไม่ใช่องค์ประกอบของ change management?", "options_th": ["Approval", "RFC", "Rollback", "Governance"], "explanation_th": "แนวปฏิบัติ change management ที่สำคัญทั้งหมดครอบคลุมกิจกรรมหลักทั่วไป: Request For Change (RFC), Approval และ Rollback ส่วน Governance ไม่ใช่หนึ่งในแนวปฏิบัติเหล่านี้"}, {"id": 254, "dom": 5, "question": "Which of the following is NOT a social engineering technique?", "options": ["Pretexting", "Quid pro quo", "Double-dealing", "Baiting"], "correct_idx": 2, "explanation": "Baiting is a social engineering attack wherein a scammer uses a false promise to lure a victim. Pretexting is a social engineering technique that manipulates victims into disclosing information. Quid pro quo is a social engineering attack (technically, one that combines 'baiting' with 'pretexting') that promises users a profit in exchange for information that can later be used to gain control of a user's account or sensitive information). Regarding cybersecurity, 'Double-ealing' is not a valid s", "short_explanation_en": "Baiting is a social engineering attack wherein a scammer uses a false promise to lure a victim.", "question_th": "ข้อใดไม่ใช่เทคนิควิศวกรรมสังคม (Social Engineering)?", "options_th": ["Pretexting", "Quid pro quo", "Double-dealing", "Baiting"], "explanation_th": "Baiting คือการโจมตีทางวิศวกรรมสังคมที่ผู้หลอกลวงใช้คำสัญญาเท็จเพื่อล่อลวงเหยื่อ Pretexting คือเทคนิคที่จัดการเหยื่อให้เปิดเผยข้อมูล Quid pro quo คือการโจมตีที่รวม 'baiting' กับ 'pretexting' เข้าด้วยกัน ส่วน 'Double-dealing' ไม่ใช่เทคนิควิศวกรรมสังคมที่ถูกต้องในบริบทความปลอดภัยไซเบอร์"}, {"id": 255, "dom": 4, "question": "If there is no time constraint, which protocol should be employed to establish a reliable connection between two devices?", "options": ["TCP", "DHCP", "SNMP", "UDP"], "correct_idx": 0, "explanation": "TCP is used for connection-oriented communication, verifies data delivery, and is known to favor reliability. In a congested network, TCP delays data transmission, and thus cannot guarantee delivery under time constraints. UDP favors speed and efficiency over reliability, and thus cannot ensure a reliable connection. DHCP and SNMP are (respectively) a device configuration and a device management protocol, which means that neither aims to establish connections between devices.", "short_explanation_en": "TCP is used for connection-oriented communication, verifies data delivery, and is known to favor reliability.", "question_th": "หากไม่มีข้อจำกัดด้านเวลา โปรโตคอลใดควรถูกใช้เพื่อสร้างการเชื่อมต่อที่เชื่อถือได้ระหว่างสองอุปกรณ์?", "options_th": ["TCP", "DHCP", "SNMP", "UDP"], "explanation_th": "TCP ใช้สำหรับการสื่อสารแบบ connection-oriented ตรวจสอบการส่งข้อมูล และเป็นที่รู้จักกันดีว่าให้ความสำคัญกับความน่าเชื่อถือ ในเครือข่ายที่มีความคับคั่ง TCP จะทำให้การส่งข้อมูลล่าช้า จึงไม่สามารถรับประกันการส่งภายใต้ข้อจำกัดด้านเวลาได้"}, {"id": 256, "dom": 1, "question": "An exploitable weakness or flaw in a system or component is a:", "options": ["Threat", "Bug", "Vulnerability", "Risk"], "correct_idx": 2, "explanation": "A Vulnerability is a weakness in an information system, system security procedures, internal controls or implementationthat could be exploited by a Threat source (NIST SP 800-30 Rev 1). The Threat is the circumstance or event that can adversely impact operations. A Risk is a possible event that can negatively impact the organization. A Bug is a flaw causing an application to produce an unintended or unexpected result that may be exploitable.", "short_explanation_en": "A Vulnerability is a weakness in an information system, system security procedures, internal controls or implementationthat could be exploited by a Threat source (NIST SP 800-30 Rev 1).", "question_th": "จุดอ่อนหรือข้อบกพร่องที่สามารถใช้ประโยชน์ได้ในระบบหรือส่วนประกอบคือ:", "options_th": ["Threat", "Bug", "Vulnerability", "Risk"], "explanation_th": "Vulnerability คือจุดอ่อนในระบบสารสนเทศ ขั้นตอนความปลอดภัยของระบบ การควบคุมภายใน หรือการดำเนินการ ที่อาจถูกใช้ประโยชน์โดยแหล่งที่มาของ Threat (NIST SP 800-30 Rev 1) Threat คือสถานการณ์หรือเหตุการณ์ที่สามารถส่งผลกระทบเชิงลบต่อการดำเนินงาน Risk คือเหตุการณ์ที่เป็นไปได้ซึ่งอาจส่งผลกระทบเชิงลบต่อองค์กร Bug คือข้อบกพร่องที่ทำให้
