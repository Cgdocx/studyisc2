to perform a vulnerability scanning is an example of a procedure.", "question_th": "วิศวกรความปลอดภัยอาวุโสกำลังสร้างเอกสารที่ให้คำแนะนำทีละขั้นตอนเกี่ยวกับวิธีเปิดใช้การสแกนช่องโหว่โดยใช้เครื่องมือสแกนช่องโหว่ขององค์กร ซึ่งวิศวกรความปลอดภัยทุกคนจะต้องปฏิบัติตาม ข้อใดคือองค์ประกอบด้านการกำกับดูแล (Governance) ที่นี่เป็นตัวอย่าง?", "options_th": ["Policy", "Procedure", "Guideline", "Law"], "explanation_th": "เอกสารที่มีคำแนะนำทีละขั้นตอนเกี่ยวกับวิธีการสแกนช่องโหว่เป็นตัวอย่างของ procedure นโยบาย (Policy) เป็นข้อความระดับบริหารระดับสูงที่ให้แนวทางแก่องค์กร แต่ไม่ได้กำหนดขั้นตอนที่แน่นอน แนวทาง (Guideline) ทำหน้าที่เป็นข้อมูลอ้างอิงแนวปฏิบัติที่ดี แต่ไม่จำเป็นต้องปฏิบัติตาม"}, {"id": 131, "dom": 1, "question": "An information security policy is an example of which of the following types of controls?", "options": ["Administrative", "Technical", "Logical", "Physical"], "correct_idx": 0, "explanation": "A policy is an example of an administrative control. Administrative controls are management-oriented controls that provide directives and instruction aimed at people within the organization, such as documentation, training, and other personnel management practices. Technical controls, also known as logical controls, are hardware or software components that protect virtual resources. Physical contr", "short_explanation_en": "A policy is an example of an administrative control. Administrative controls are management-oriented controls that provide directives and instruction aimed at people within the organization, such as documentation, training, and other...", "question_th": "นโยบายความปลอดภัยสารสนเทศเป็นตัวอย่างของการควบคุมประเภทใด?", "options_th": ["Administrative", "Technical", "Logical", "Physical"], "explanation_th": "นโยบายเป็นตัวอย่างของการควบคุมเชิงบริหาร การควบคุมเชิงบริหารเป็นการควบคุมที่เน้นการจัดการซึ่งให้คำแนะนำและข้อบังคับต่อบุคคลภายในองค์กร เช่น เอกสาร การฝึกอบรม และแนวปฏิบัติการจัดการบุคลากรอื่น ๆ การควบคุมทางเทคนิค หรือที่เรียกว่าการควบคุมทางตรรกะ เป็นส่วนประกอบฮาร์ดแวร์หรือซอฟต์แวร์ที่ปกป้องทรัพยากรเสมือน"}, {"id": 132, "dom": 1, "question": "Sarah is a security engineer for a Software as a Service (SaaS) organization. Her friend Kyle is a systems administrator for the organization and helped her get the job by serving as a reference. While reviewing some system logs, Sarah discovered that Kyle is running a crypto-mining program on a company server for his own financial gain. How should Sarah respond to this situation?", "options": ["Ask Kyle to stop", "Ask Kyle to share the profits with her", "Mind her own business", "Escalate to senior management"], "correct_idx": 3, "explanation": "Sarah should immediately escalate this to senior leadership in accordance with the organization’s policies and procedures. This would be the ethical response to this situation. CHAPTER 2 Access Controls Concepts This chapter discusses the following topics: • Access control fundamentals • Logical access controls • Physical access controls In Chapter 1 we introduced the concept of security controls,", "short_explanation_en": "Sarah should immediately escalate this to senior leadership in accordance with the organization’s policies and procedures.", "question_th": "ซาร่าห์เป็นวิศวกรความปลอดภัยขององค์กร Software as a Service (SaaS) เพื่อนของเธอ ไคล์ เป็นผู้ดูแลระบบขององค์กรและช่วยให้เธอได้งานโดยเป็นผู้อ้างอิง ขณะที่ทบทวนบันทึกระบบ ซาร่าห์พบว่าไคล์กำลังรันโปรแกรมขุดคริปโตบนเซิร์ฟเวอร์ของบริษัทเพื่อประโยชน์ทางการเงินของตนเอง ซาร่าห์ควรตอบสนองต่อสถานการณ์นี้อย่างไร?", "options_th": ["ขอให้ไคล์หยุด", "ขอให้ไคล์แบ่งกำไรให้เธอ", "ไม่ยุ่งเกี่ยวกับเรื่องนี้", "แจ้งไปยังผู้บริหารระดับสูง"], "explanation_th": "ซาร่าห์ควรแจ้งเรื่องนี้ไปยังผู้บริหารระดับสูงทันทีตามนโยบายและขั้นตอนขององค์กร นี่จะเป็นการตอบสนองที่ถูกต้องตามหลักจริยธรรมต่อสถานการณ์นี้"}, {"id": 133, "dom": 3, "question": "Jane is a security administrator setting up access for a new employee who works in the manufacturing department. Jane makes sure to enable the employee’s access for the manufacturing area but not for the parts storage area. What best describes the principle Jane is applying?", "options": ["Principle of authentication", "Two-person rule", "Need to know", "Least privilege"], "correct_idx": 3, "explanation": "Least privilege is the most correct answer. By giving the employee access to the area the employee requires access to but no more, Jane is applying the principle of least privilege.", "short_explanation_en": "Least privilege is the most correct answer. By giving the employee access to the area the employee requires access to but no more, Jane is applying the principle of least privilege.", "question_th": "เจนเป็นผู้ดูแลระบบความปลอดภัยที่กำลังตั้งค่าการเข้าถึงให้กับพนักงานใหม่ที่ทำงานในฝ่ายผลิต เจนตรวจสอบให้แน่ใจว่าเปิดใช้งานการเข้าถึงพื้นที่ผลิตให้พนักงาน แต่ไม่เปิดให้เข้าถึงพื้นที่จัดเก็บชิ้นส่วน ข้อใดอธิบายหลักการที่เจนกำลังใช้ได้ดีที่สุด?", "options_th": ["หลักการ Authentication", "กฎ Two-person", "Need to know", "Least privilege"], "explanation_th": "Least privilege เป็นคำตอบที่ถูกต้องที่สุด โดยให้พนักงานเข้าถึงเฉพาะพื้นที่ที่จำเป็นแต่ไม่มากไปกว่านั้น เจนกำลังใช้หลักการ least privilege"}, {"id": 134, "dom": 3, "question": "Which statement best describes the relationship between subjects, objects, and rules?", "options": ["A subject grants access to an object based on rules.", "An object is granted access to a subject based on rules.", "A subject is granted access to an object based on rules.", "An object is granted access to a subject based on credentials."], "correct_idx": 2, "explanation": "After first requesting access, a subject gets access to an object based on rules.", "short_explanation_en": "After first requesting access, a subject gets access to an object based on rules.", "question_th": "ข้อความใดอธิบายความสัมพันธ์ระหว่าง subjects, objects และ rules ได้ดีที่สุด?", "options_th": ["Subject ให้สิทธิ์การเข้าถึงแก่ object ตามกฎ", "Object ได้รับสิทธิ์การเข้าถึงจาก subject ตามกฎ", "Subject ได้รับสิทธิ์การเข้าถึง object ตามกฎ", "Object ได้รับสิทธิ์การเข้าถึงจาก subject ตามข้อมูลรับรอง"], "explanation_th": "หลังจากร้องขอการเข้าถึงก่อน subject จะได้รับสิทธิ์เข้าถึง object ตามกฎ"}, {"id": 135, "dom": 3, "question": "Joe has to log in to many systems on a daily basis and has too many passwords to remember. What is the best way for Joe to manage his passwords?", "options": ["Write the passwords down on a piece of paper.", "Store the passwords in a text file and store it in a safe place.", "Use the same password for every system so he only has to remember one password.", "Use a password manager or password vault software."], "correct_idx": 3, "explanation": "The best answer is to use a password manager or password vault software to manage passwords. These products require credentials to log in and protect the passwords with encryption and good access control. None of the other answers provide a secure solution.", "short_explanation_en": "The best answer is to use a password manager or password vault software to manage passwords.", "question_th": "โจต้องล็อกอินเข้าระบบหลายระบบทุกวันและมีรหัสผ่านมากเกินไปที่จะจดจำ วิธีที่ดีที่สุดสำหรับโจในการจัดการรหัสผ่านคืออะไร?", "options_th": ["จดรหัสผ่านลงในกระดาษ", "จัดเก็บรหัสผ่านในไฟล์ข้อความและเก็บไว้ในที่ปลอดภัย", "ใช้รหัสผ่านเดียวกันสำหรับทุกระบบเพื่อให้ต้องจำเพียงรหัสเดียว", "ใช้ตัวจัดการรหัสผ่านหรือซอฟต์แวร์ password vault"], "explanation_th": "คำตอบที่ดีที่สุดคือการใช้ตัวจัดการรหัสผ่านหรือซอฟต์แวร์ password vault ผลิตภัณฑ์เหล่านี้ต้องการข้อมูลรับรองในการล็อกอินและปกป้องรหัสผ่านด้วยการเข้ารหัสและการควบคุมการเข้าถึงที่ดี"}, {"id": 136, "dom": 3, "question": "Debby has been an employee of Acme Corp. for over 20 years. During that time, she has been able to access more and more systems. Now she has access to systems she doesn’t even need access to in order to do her job. This is an example of what type of situation?", "options": ["Privilege modification", "Access management", "Privileged access management", "Privilege creep"], "correct_idx": 3, "explanation": "The situation described is an example of privilege creep, where over time a person’s access increases beyond that which they require to do their job.", "short_explanation_en": "The situation described is an example of privilege creep, where over time a person’s access increases beyond that which they require to do their job.", "question_th": "เด็บบี้เป็นพนักงานของ Acme Corp. มากว่า 20 ปี ในช่วงเวลานั้น เธอสามารถเข้าถึงระบบได้มากขึ้นเรื่อย ๆ ตอนนี้เธอมีสิทธิ์เข้าถึงระบบที่เธอไม่จำเป็นต้องใช้เพื่อทำงานด้วยซ้ำ นี่เป็นตัวอย่างของสถานการณ์ประเภทใด?", "options_th": ["การปรับเปลี่ยนสิทธิ์", "การจัดการการเข้าถึง", "Privileged access management", "Privilege creep"], "explanation_th": "สถานการณ์ที่อธิบายเป็นตัวอย่างของ privilege creep ซึ่งเมื่อเวลาผ่านไป การเข้าถึงของบุคคลเพิ่มขึ้นเกินกว่าที่จำเป็นต่อการทำงาน"}, {"id": 137, "dom": 3, "question": "The identity and access management lifecycle consists of which steps?", "options": ["Provisioning, review, revocation", "Setup, review, auditing", "Creation, monitoring, termination", "Identification, authentication, authorization"], "correct_idx": 0, "explanation": "The identity and access management lifecycle consists of provisioning, review, and revocation steps.", "short_explanation_en": "The identity and access management lifecycle consists of provisioning, review, and revocation steps.", "question_th": "วงจรชีวิตของการบริหารจัดการตัวตนและการเข้าถึง (Identity and access management lifecycle) ประกอบด้วยขั้นตอนใด?", "options_th": ["Provisioning, review, revocation", "Setup, review, auditing", "Creation, monitoring, termination", "Identification, authentication, authorization"], "explanation_th": "วงจรชีวิตของการบริหารจัดการตัวตนและการเข้าถึงประกอบด้วยขั้นตอน provisioning, review และ revocation"}, {"id": 138, "dom": 3, "question": "Which of the following access control models leverages roles to provision access, where users with similar access needs are assigned to the same role?", "options": ["DAC", "MAC", "RBAC", "None of the above"], "correct_idx": 2, "explanation": "Role-based access control (RBAC) enforces access based on roles that define permissions and the level of access provided to any user assigned to that role. Roles are typically developed for similar users with the same access needs (e.g., HR, Sales, IT, Security).", "short_explanation_en": "Role-based access control (RBAC) enforces access based on roles that define permissions and the level of access provided to any user assigned to that role.", "question_th": "โมเดลควบคุมการเข้าถึงใดที่ใช้บทบาทเพื่อจัดสรรการเข้าถึง โดยผู้ใช้ที่มีความต้องการการเข้าถึงคล้ายกันจะถูกกำหนดให้อยู่ในบทบาทเดียวกัน?", "options_th": ["DAC", "MAC", "RBAC", "ไม่มีข้อใดถูกต้อง"], "explanation_th": "Role-based access control (RBAC) บังคับใช้การเข้าถึงตามบทบาทที่กำหนดสิทธิ์และระดับการเข้าถึงให้กับผู้ใช้ที่ได้รับมอบหมายบทบาทนั้น บทบาทมักถูกพัฒนาขึ้นสำหรับผู้ใช้ที่คล้ายกันที่มีความต้องการการเข้าถึงเดียวกัน (เช่น HR, Sales, IT, Security)"}, {"id": 139, "dom": 3, "question": "An organization is concerned about the risk of a car driving from the parking lot through the entrance of the building. Which of the following security measures would best help address this concern?", "options": ["Biometrics", "RBAC", "Badge system", "Bollards"], "correct_idx": 3, "explanation": "Bollards are pillars or spheres made out of hard material used to prevent vehicles from driving through entrances. Biometrics and badge systems are measures to implement physical access control but would not prevent a car from driving through the entrance. RBAC is an access control model.", "short_explanation_en": "Bollards are pillars or spheres made out of hard material used to prevent vehicles from driving through entrances.", "question_th": "องค์กรกังวลเกี่ยวกับความเสี่ยงที่รถยนต์จะขับจากลานจอดรถผ่านทางเข้าอาคาร มาตรการความปลอดภัยใดต่อไปนี้จะช่วยแก้ไขข้อกังวลนี้ได้ดีที่สุด?", "options_th": ["ไบโอเมตริกซ์", "RBAC", "ระบบบัตรผ่าน", "Bollards"], "explanation_th": "Bollards คือเสาหรือทรงกลมที่ทำจากวัสดุแข็งใช้เพื่อป้องกันไม่ให้ยานพาหนะขับผ่านทางเข้า ไบโอเมตริกซ์และระบบบัตรผ่านเป็นมาตรการควบคุมการเข้าถึงทางกายภาพแต่จะไม่ป้องกันรถยนต์ไม่ให้ขับผ่านทางเข้าได้ RBAC เป็นโมเดลควบคุมการเข้าถึง"}, {"id": 140, "dom": 3, "question": "The security team is reviewing the configuration of the door that serves as the only entrance or exit to the datacenter. Organization personnel commonly access the datacenter to perform their work. In the event of a fire that impacts power to the door-locking mechanism, which of the following configurations is best?", "options": ["The door should always remain locked.", "The door should fail-secure.", "The door should fail-open.", "The door should automatically lock when there is no power."], "correct_idx": 2, "explanation": "The door should fail-open (also known as fail-safe). While this is a less secure option, it ensures the preservation of human life, which is the number-one priority.", "short_explanation_en": "The door should fail-open (also known as fail-safe). While this is a less secure option, it ensures the preservation of human life, which is the number-one priority.", "question_th": "ทีมความปลอดภัยกำลังทบทวนการตั้งค่าของประตูที่เป็นทางเข้า-ออกเดียวของศูนย์ข้อมูล บุคลากรขององค์กรมักเข้าถึงศูนย์ข้อมูลเพื่อปฏิบัติงาน ในกรณีเกิดไฟไหม้ที่ส่งผลกระทบต่อไฟฟ้าของกลไกล็อกประตู การตั้งค่าใดต่อไปนี้ดีที่สุด?", "options_th": ["ประตูควรล็อกอยู่ตลอดเวลา", "ประตูควรเป็นแบบ fail-secure", "ประตูควรเป็นแบบ fail-open", "ประตูควรล็อกอัตโนมัติเมื่อไม่มีไฟฟ้า"], "explanation_th": "ประตูควรเป็นแบบ fail-open (หรือเรียกว่า fail-safe) แม้ตัวเลือกนี้จะปลอดภัยน้อยกว่า แต่รับประกันการรักษาชีวิตมนุษย์ซึ่งเป็นสิ่งสำคัญอันดับหนึ่ง"}, {"id": 141, "dom": 3, "question": "The security team of an organization is concerned about the physical security of datacenter access. They want the datacenter entrance built in such a way that there are two doors with locks and the first door must close before the next door can be unlocked. Which of the following is this an example of?", "options": ["Bollard", "Mantrap", "Fence", "Biometric lock"], "correct_idx": 1, "explanation": "A mantrap is an area that has two doors built in such a way that the first door must be closed before the second door can be opened.", "short_explanation_en": "A mantrap is an area that has two doors built in such a way that the first door must be closed before the second door can be opened.", "question_th": "ทีมความปลอดภัยขององค์กรกังวลเกี่ยวกับความปลอดภัยทางกายภาพของการเข้าถึงศูนย์ข้อมูล พวกเขาต้องการให้ทางเข้าศูนย์ข้อมูลถูกสร้างในลักษณะที่มีประตูล็อกสองบาน โดยประตูแรกต้องปิดก่อนที่ประตูถัดไปจะสามารถปลดล็อกได้ ข้อใดเป็นตัวอย่างของสิ่งนี้?", "options_th": ["Bollard", "Mantrap", "Fence", "Biometric lock"], "explanation_th": "Mantrap คือพื้นที่ที่มีประตูสองบานสร้างในลักษณะที่ประตูแรกต้องปิดก่อนที่ประตูที่สองจะสามารถเปิดได้"}, {"id": 142, "dom": 3, "question": "Which of the following access control models allows the creator of a resource the ability to assign permissions to other users?", "options": ["DAC", "MAC", "RBAC", "None of the above"], "correct_idx": 0, "explanation": "Discretionary access control (DAC) provides the owner of the resource, typically the creator, full control to configure which users can access the resource.", "short_explanation_en": "Discretionary access control (DAC) provides the owner of the resource, typically the creator, full control to configure which users can access the resource.", "question_th": "โมเดลควบคุมการเข้าถึงใดที่ให้ผู้สร้างทรัพยากรมีความสามารถในการมอบสิทธิ์ให้ผู้ใช้อื่นได้?", "options_th": ["DAC", "MAC", "RBAC", "ไม่มีข้อใดถูกต้อง"], "explanation_th": "Discretionary access control (DAC) ให้เจ้าของทรัพยากร ซึ่งโดยปกติคือผู้สร้าง มีอำนาจควบคุมเต็มที่ในการกำหนดว่าผู้ใช้ใดสามารถเข้าถึงทรัพยากรได้บ้าง"}, {"id": 143, "dom": 3, "question": "__________________ is a method of attack where a hacker enters SQL commands into fields on a vulnerable web page. The commands are executed without proper authorization.", "options": ["Buffer overflow", "SQL injection", "HTTP response splitting", "Backdoor"], "correct_idx": 1, "explanation": "If a web server does not properly validate user input, an attacker can insert SQL commands into a field, which get executed by the database without proper authorization - this is called a SQL injection attack.", "short_explanation_en": "If a web server does not properly validate user input, an attacker can insert SQL commands into a field, which get executed by the database without proper authorization - this is called a SQL injection attack.", "question_th": "__________________ คือวิธีการโจมตีที่แฮกเกอร์ป้อนคำสั่ง SQL ลงในช่องข้อมูลบนหน้าเว็บที่มีช่องโหว่ คำสั่งเหล่านี้จะถูกดำเนินการโดยไม่มีการอนุญาตที่เหมาะสม", "options_th": ["Buffer overflow", "SQL injection", "HTTP response splitting", "Backdoor"], "explanation_th": "หากเว็บเซิร์ฟเวอร์ไม่ตรวจสอบข้อมูลที่ผู้ใช้ป้อนอย่างเหมาะสม ผู้โจมตีสามารถแทรกคำสั่ง SQL ลงในช่องข้อมูล ซึ่งจะถูกดำเนินการโดยฐานข้อมูลโดยไม่มีการอนุญาตที่เหมาะสม เรียกว่าการโจมตีแบบ SQL injection"}, {"id": 144, "dom": 3, "question": "Mary is a network engineer who wants to install a firewall in front of a database server to hide its IP address. What type of firewall should Mary choose?", "options": ["Proxy", "Packet filter", "Stateful/dynamic packet filter", "Database filter"], "correct_idx": 0, "explanation": "A proxy firewall acts as an intermediary between clients and the database server, masking the server's real IP address from external requesters - unlike packet filtering firewalls, which simply inspect and forward traffic without hiding the origin.", "short_explanation_en": "A proxy firewall acts as an intermediary between clients and the database server, masking the server's real IP address from external requesters - unlike packet filtering firewalls, which simply inspect and forward traffic without hiding the origin.", "question_th": "แมรี่เป็นวิศวกรเครือข่ายที่ต้องการติดตั้งไฟร์วอลล์หน้าเซิร์ฟเวอร์ฐานข้อมูลเพื่อซ่อน IP address ของมัน แมรี่ควรเลือกไฟร์วอลล์ประเภทใด?", "options_th": ["Proxy", "Packet filter", "Stateful/dynamic packet filter", "Database filter"], "explanation_th": "ไฟร์วอลล์แบบ proxy ทำหน้าที่เป็นตัวกลางระหว่างไคลเอนต์กับเซิร์ฟเวอร์ฐานข้อมูล ซ่อน IP address จริงของเซิร์ฟเวอร์จากผู้ร้องขอภายนอก ต่างจากไฟร์วอลล์แบบ packet filtering ซึ่งเพียงตรวจสอบและส่งต่อทราฟฟิกโดยไม่ซ่อนแหล่งที่มา"}, {"id": 145, "dom": 3, "question": "An organization is using a cloud service provider to host their infrastructure. The cloud service provider manages the underlying infrastructure, and the organization manages the platforms and software (such as the OS, development tools, and applications). Which of the following cloud service models is being utilized?", "options": ["IaaS", "PaaS", "SaaS", "On-premises"], "correct_idx": 0, "explanation": "In IaaS (Infrastructure as a Service), the cloud provider manages the underlying physical infrastructure, while the customer manages platforms and software such as the OS, development tools, and applications running on it.", "short_explanation_en": "In IaaS (Infrastructure as a Service), the cloud provider manages the underlying physical infrastructure, while the customer manages platforms and software such as the OS, development tools, and applications running on it.", "question_th": "องค์กรใช้ผู้ให้บริการคลาวด์เพื่อโฮสต์โครงสร้างพื้นฐานของตน ผู้ให้บริการคลาวด์จัดการโครงสร้างพื้นฐานพื้นฐาน ในขณะที่องค์กรจัดการแพลตฟอร์มและซอฟต์แวร์ (เช่น OS เครื่องมือพัฒนา และแอปพลิเคชัน) โมเดลบริการคลาวด์ใดที่กำลังถูกใช้งาน?", "options_th": ["IaaS", "PaaS", "SaaS", "On-premises"], "explanation_th": "ใน IaaS (Infrastructure as a Service) ผู้ให้บริการคลาวด์จัดการโครงสร้างพื้นฐานทางกายภาพ ในขณะที่ลูกค้าจัดการแพลตฟอร์มและซอฟต์แวร์ เช่น OS เครื่องมือพัฒนา และแอปพลิเคชันที่รันอยู่บนนั้น"}, {"id": 146, "dom": 4, "question": "Which of the following is referred to as a physical address in computer networking?", "options": ["IPv4 address", "IPv6 address", "MAC address", "Loopback address"], "correct_idx": 2, "explanation": "Media access control (MAC) addresses are often referred to as a physical address or hardware address since they are assigned to the device’s physical hardware. Internet Protocol (IP) addresses are known as logical addresses. A loopback address is a special type of IP address.", "short_explanation_en": "Media access control (MAC) addresses are often referred to as a physical address or hardware address since they are assigned to the device’s physical hardware.", "question_th": "ข้อใดต่อไปนี้ถูกเรียกว่า physical address ในระบบเครือข่ายคอมพิวเตอร์?", "options_th": ["IPv4 address", "IPv6 address", "MAC address", "Loopback address"], "explanation_th": "Media access control (MAC) address มักถูกเรียกว่า physical address หรือ hardware address เนื่องจากถูกกำหนดให้กับฮาร์ดแวร์ทางกายภาพของอุปกรณ์ ในขณะที่ IP address รู้จักกันในชื่อ logical address"}, {"id": 147, "dom": 4, "question": "How many layers are there in the OSI model?", "options": ["8", "7", "6", "5"], "correct_idx": 1, "explanation": "There are seven layers in the OSI model. These Include Application, Presentation, Session, Transport, Network, Data, and Physical.", "short_explanation_en": "There are seven layers in the OSI model. These Include Application, Presentation, Session, Transport, Network, Data, and Physical.", "question_th": "โมเดล OSI มีกี่เลเยอร์?", "options_th": ["8", "7", "6", "5"], "explanation_th": "โมเดล OSI มี 7 เลเยอร์ ได้แก่ Application, Presentation, Session, Transport, Network, Data และ Physical"}, {"id": 148, "dom": 4, "question": "Which of the following terms best describes a computer that provides content to other computers such as a website or an application?", "options": ["Client", "Server", "Endpoint", "Router"], "correct_idx": 1, "explanation": "Server is a term that describes a computer that serves content or provides a service to another computer on a network. A client is a computer that accesses or uses the content or service provided by the server. An endpoint is a computing device on a network, which could include a server but is not the best answer. A router is a network device that routes traffic on a network.", "short_explanation_en": "Server is a term that describes a computer that serves content or provides a service to another computer on a network.", "question_th": "คำใดต่อไปนี้อธิบายคอมพิวเตอร์ที่ให้เนื้อหาแก่คอมพิวเตอร์อื่น เช่น เว็บไซต์หรือแอปพลิเคชันได้ดีที่สุด?", "options_th": ["Client", "Server", "Endpoint", "Router"], "explanation_th": "Server คือคำที่อธิบายคอมพิวเตอร์ที่ให้เนื้อหาหรือบริการแก่คอมพิวเตอร์อื่นบนเครือข่าย Client คือคอมพิวเตอร์ที่เข้าถึงหรือใช้เนื้อหาหรือบริการที่ server จัดหาให้"}, {"id": 149, "dom": 4, "question": "What is the name of the seventh layer of the OSI model?", "options": ["Application", "Session", "Presentation", "Network"], "correct_idx": 0, "explanation": "The Application Layer is Layer 7 (the uppermost layer) of the OSI model. The order of the layers from top (Layer 7) to bottom (Layer 1) are Application, Presentation, Session, Transport, Network, Data Link, and Physical.", "short_explanation_en": "The Application Layer is Layer 7 (the uppermost layer) of the OSI model.", "question_th": "ชื่อของเลเยอร์ที่เจ็ดของโมเดล OSI คืออะไร?", "options_th": ["Application", "Session", "Presentation", "Network"], "explanation_th": "Application Layer คือ Layer 7 (เลเยอร์บนสุด) ของโมเดล OSI ลำดับเลเยอร์จากบน (Layer 7) ถึงล่าง (Layer 1) คือ Application, Presentation, Session, Transport, Network, Data Link และ Physical"}, {"id": 150, "dom": 4, "question": "Which of the following attacks are most likely to be carried out by a botnet?", "options": ["Advanced persistent threat attack", "DDoS attack", "Trojan horse attack", "Backdoor attack"], "correct_idx": 1, "explanation": "A botnet is a group of computers under the control of an attacker, most often for a coordinated attacker such as a DDoS attack. Advanced persistent threat and backdoors are not specific types of attacks, but rather features of attacks. A trojan horse is a type of attack but unlikely to be carried out by a botnet.", "short_explanation_en": "A botnet is a group of computers under the control of an attacker, most often for a coordinated attacker such as a DDoS attack.", "question_th": "การโจมตีใดต่อไปนี้มีแนวโน้มที่จะถูกดำเนินการโดย botnet มากที่สุด?", "options_th": ["การโจมตีแบบ Advanced persistent threat", "การโจมตีแบบ DDoS", "การโจมตีแบบ Trojan horse", "การโจมตีแบบ Backdoor"], "explanation_th": "Botnet คือกลุ่มคอมพิวเตอร์ที่อยู่ภายใต้การควบคุมของผู้โจมตี มักใช้เพื่อการโจมตีที่ประสานงานกัน เช่น DDoS Advanced persistent threat และ backdoor ไม่ใช่ประเภทการโจมตีเฉพาะ แต่เป็นคุณลักษณะของการโจมตี"}, {"id": 151, "dom": 4, "question": "What is the best description of the difference between a phishing email and a spear phishing e-mail?", "options": ["A phishing e-mail is sent to a specific person; a spear phishing email is sent to an entire company.", "A phishing e-mail is sent to random recipients; a spear phishing email is sent to specific recipients.", "A phishing e-mail is sent to an entire company; a spear phishing email is sent to a specific person.", "A spear phishing e-mail is sent to random recipients; a phishing email is sent to specific recipients."], "correct_idx": 1, "explanation": "A phishing e-mail is sent to random recipients; a spear phishing email is sent to specific recipients. A phishing e-mail is literally like going fishing - you cast a wide net randomly and you see what you get. Conversely spear phishing is literally like spearfishing - you have a specific target in mind, and you shoot the spear directly at it. A spear phishing e-mail is sent to a specific person or spe", "short_explanation_en": "A phishing e-mail is sent to random recipients; a spear phishing email is sent to specific recipients.", "question_th": "คำอธิบายที่ดีที่สุดถึงความแตกต่างระหว่างอีเมล phishing และอีเมล spear phishing คืออะไร?", "options_th": ["อีเมล phishing ถูกส่งไปยังบุคคลเฉพาะ; อีเมล spear phishing ถูกส่งไปยังทั้งบริษัท", "อีเมล phishing ถูกส่งไปยังผู้รับแบบสุ่ม; อีเมล spear phishing ถูกส่งไปยังผู้รับเฉพาะ", "อีเมล phishing ถูกส่งไปยังทั้งบริษัท; อีเมล spear phishing ถูกส่งไปยังบุคคลเฉพาะ", "อีเมล spear phishing ถูกส่งไปยังผู้รับแบบสุ่ม; อีเมล phishing ถูกส่งไปยังผู้รับเฉพาะ"], "explanation_th": "อีเมล phishing ถูกส่งไปยังผู้รับแบบสุ่ม เปรียบเสมือนการตกปลาแบบกว้าง ๆ ในขณะที่ spear phishing เป็นการมุ่งเป้าหมายเฉพาะเจาะจงเหมือนการแทงหอกไปยังเป้าหมายที่กำหนดไว้แล้ว"}, {"id": 152, "dom": 4, "question": "Which of the following is not a true statement about a worm?", "options": ["It can replicate itself.", "It is a type of malware.", "It is a type of botnet.", "It does not require a host program to infect and deliver it to the victim system."], "correct_idx": 2, "explanation": "A worm is not a type of botnet. A worm can replicate itself and is a type of malware, but since it isn’t a virus, it does not require a host program to infect and serve as the delivery mechanism.", "short_explanation_en": "A worm is not a type of botnet. A worm can replicate itself and is a type of malware, but since it isn’t a virus, it does not require a host program to infect and serve as the delivery mechanism.", "question_th": "ข้อความใดต่อไปนี้ไม่เป็นความจริงเกี่ยวกับ worm?", "options_th": ["สามารถแพร่กระจายตัวเองได้", "เป็นมัลแวร์ประเภทหนึ่ง", "เป็นประเภทหนึ่งของ botnet", "ไม่ต้องการโปรแกรมโฮสต์เพื่อติดเชื้อและส่งไปยังระบบเหยื่อ"], "explanation_th": "Worm ไม่ใช่ประเภทหนึ่งของ botnet Worm สามารถแพร่กระจายตัวเองได้และเป็นมัลแวร์ประเภทหนึ่ง แต่เนื่องจากไม่ใช่ไวรัส จึงไม่ต้องการโปรแกรมโฮสต์เพื่อติดเชื้อและเป็นกลไกในการส่ง"}, {"id": 153, "dom": 4, "question": "What is the primary difference between an IDS and an IPS?", "options": ["They both do the same thing.", "An IDS detects malicious activity, whereas an IPS prevents the activity from happening in the first place.", "An IDS detects malicious activity, whereas an IPS monitors system performance.", "An IDS detects malicious activity, whereas an IPS detects malicious activity and takes action on it."], "correct_idx": 3, "explanation": "An IDS, which stands for intrusion detection system, detects malicious activity, whereas an IPS, which stands for intrusion prevention system, detects malicious activity and takes action on it.", "short_explanation_en": "An IDS, which stands for intrusion detection system, detects malicious activity, whereas an IPS, which stands for intrusion prevention system, detects malicious activity and takes action on it.", "question_th": "ความแตกต่างหลักระหว่าง IDS และ IPS คืออะไร?", "options_th": ["ทั้งสองทำสิ่งเดียวกัน", "IDS ตรวจจับกิจกรรมที่เป็นอันตราย ในขณะที่ IPS ป้องกันไม่ให้กิจกรรมนั้นเกิดขึ้นตั้งแต่แรก", "IDS ตรวจจับกิจกรรมที่เป็นอันตราย ในขณะที่ IPS เฝ้าติดตามประสิทธิภาพของระบบ", "IDS ตรวจจับกิจกรรมที่เป็นอันตราย ในขณะที่ IPS ตรวจจับกิจกรรมที่เป็นอันตรายและดำเนินการกับมัน"], "explanation_th": "IDS ซึ่งย่อมาจาก intrusion detection system ตรวจจับกิจกรรมที่เป็นอันตราย ในขณะที่ IPS ซึ่งย่อมาจาก intrusion prevention system ตรวจจับกิจกรรมที่เป็นอันตรายและดำเนินการกับมัน"}, {"id": 154, "dom": 4, "question": "Joe is a cyber criminal who has targeted a web server for a potential cyberattack. Joe wants to know if the server has any unpatched vulnerabilities he might be able to exploit. Which of the following actions is Joe most likely to take?", "options": ["Launch a smurf attack against the target server.", "Run a vulnerability scan against the target server.", "Send a phishing e-mail to the target server.", "Send a spear phishing e-mail to the target server."], "correct_idx": 1, "explanation": "The answer is to run a vulnerability scan, as that is the only one of the choices that will reveal vulnerabilities on the server.", "short_explanation_en": "The answer is to run a vulnerability scan, as that is the only one of the choices that will reveal vulnerabilities on the server.", "question_th": "โจเป็นอาชญากรไซเบอร์ที่กำหนดเป้าหมายเว็บเซิร์ฟเวอร์สำหรับการโจมตีทางไซเบอร์ที่อาจเกิดขึ้น โจต้องการทราบว่าเซิร์ฟเวอร์มีช่องโหว่ที่ยังไม่ได้แพตช์ซึ่งเขาอาจใช้ประโยชน์ได้หรือไม่ ข้อใดต่อไปนี้เป็นการกระทำที่โจน่าจะทำมากที่สุด?", "options_th": ["เปิดการโจมตีแบบ smurf กับเซิร์ฟเวอร์เป้าหมาย", "รันการสแกนช่องโหว่กับเซิร์ฟเวอร์เป้าหมาย", "ส่งอีเมล phishing ไปยังเซิร์ฟเวอร์เป้าหมาย", "ส่งอีเมล spear phishing ไปยังเซิร์ฟเวอร์เป้าหมาย"], "explanation_th": "คำตอบคือการรันการสแกนช่องโหว่ เนื่องจากเป็นตัวเลือกเดียวที่จะเปิดเผยช่องโหว่บนเซิร์ฟเวอร์"}, {"id": 155, "dom": 4, "question": "Most cyber criminals would agree that _________________ are the weakest link in cybersecurity.", "options": ["Passwords", "Backdoors", "Laws", "People"], "correct_idx": 3, "explanation": "It is widely acknowledged that people are the weakest link in cybersecurity. Despite extensive progress in technical tools and controls, deliberate or accidental acts by people lead to the largest number of and most damaging security breaches.", "short_explanation_en": "It is widely acknowledged that people are the weakest link in cybersecurity.", "question_th": "อาชญากรไซเบอร์ส่วนใหญ่จะเห็นด้วยว่า _________________ คือจุดอ่อนที่สุดในความปลอดภัยไซเบอร์", "options_th": ["รหัสผ่าน", "Backdoors", "กฎหมาย", "ผู้คน"], "explanation_th": "เป็นที่ยอมรับกันอย่างกว้างขวางว่าผู้คนคือจุดอ่อนที่สุดในความปลอดภัยไซเบอร์ แม้จะมีความก้าวหน้าอย่างมากในเครื่องมือและการควบคุมทางเทคนิค แต่การกระทำโดยเจตนาหรือโดยบังเอิญของผู้คนนำไปสู่การละเมิดความปลอดภัยที่มากที่สุดและสร้างความเสียหายมากที่สุด"}, {"id": 156, "dom": 4, "question": "A hacker uses a phishing attack to obtain a user’s credentials, access their company’s database, and steal proprietary information. This is an example of _______________.", "options": ["Denial of service", "Advanced persistent threat", "Extortion", "Data exfiltration"], "correct_idx": 3, "explanation": "The correct answer is data exfiltration, which is the unauthorized transfer of data from a computer or network.", "short_explanation_en": "The correct answer is data exfiltration, which is the unauthorized transfer of data from a computer or network.", "question_th": "แฮกเกอร์ใช้การโจมตีแบบ phishing เพื่อได้ข้อมูลรับรองของผู้ใช้ เข้าถึงฐานข้อมูลของบริษัท และขโมยข้อมูลที่เป็นกรรมสิทธิ์ นี่เป็นตัวอย่างของ _______________.", "options_th": ["Denial of service", "Advanced persistent threat", "Extortion", "Data exfiltration"], "explanation_th": "คำตอบที่ถูกต้องคือ data exfiltration ซึ่งคือการถ่ายโอนข้อมูลโดยไม่ได้รับอนุญาตออกจากคอมพิวเตอร์หรือเครือข่าย"}, {"id": 157, "dom": 4, "question": "A sophisticated cyber criminal gains access to a financial institution’s e-mail server, installs malware, and then over a period of weeks, moves to other servers and systems on the company’s network, installing other malware and tools, finding other credentials, stealing data, and scrubbing logs to cover her tracks. Which term best describes this type of activity?", "options": ["Denial of service attack", "Advanced persistent threat attack", "Extortion attack", "Website defacement attack"], "correct_idx": 1, "explanation": "During an advanced persistent threat attack, there is a sophisticated cyber criminal seeking to expand the attack over time, probing the network, finding more systems with vulnerabilities, exploiting them, and gaining unauthorized access to more and more systems and data, all the while doing things to cover their tracks.", "short_explanation_en": "During an advanced persistent threat attack, there is a sophisticated cyber criminal seeking to expand the attack over time, probing the network, finding more systems with vulnerabilities, exploiting them, and gaining unauthorized...", "question_th": "อาชญากรไซเบอร์ที่มีความซับซ้อนเข้าถึงเซิร์ฟเวอร์อีเมลของสถาบันการเงิน ติดตั้งมัลแวร์ และตลอดระยะเวลาหลายสัปดาห์ ย้ายไปยังเซิร์ฟเวอร์และระบบอื่น ๆ ในเครือข่ายของบริษัท ติดตั้งมัลแวร์และเครื่องมืออื่น ๆ ค้นหาข้อมูลรับรองอื่น ๆ ขโมยข้อมูล และลบ log เพื่อปกปิดร่องรอย คำใดอธิบายกิจกรรมประเภทนี้ได้ดีที่สุด?", "options_th": ["การโจมตีแบบ Denial of service", "การโจมตีแบบ Advanced persistent threat", "การโจมตีแบบ Extortion", "การโจมตีแบบ Website defacement"], "explanation_th": "ระหว่างการโจมตีแบบ advanced persistent threat มีอาชญากรไซเบอร์ที่มีความซับซ้อนซึ่งพยายามขยายการโจมตีเมื่อเวลาผ่านไป สำรวจเครือข่าย ค้นหาระบบที่มีช่องโหว่เพิ่มเติม ใช้ประโยชน์จากช่องโหว่ และเข้าถึงระบบและข้อมูลมากขึ้นเรื่อย ๆ โดยปกปิดร่องรอยไปพร้อมกัน"}, {"id": 158, "dom": 4, "question": "Antivirus software vendors use ______________ to keep up with the latest information about viruses and threats.", "options": ["Google", "National Vulnerability Database", "Threat intelligence", "National Security Agency"], "correct_idx": 2, "explanation": "Organizations and product vendors use threat intelligence from a variety of sources. By collecting and studying data about threats, vendors can prepare for and defend against them.", "short_explanation_en": "Organizations and product vendors use threat intelligence from a variety of sources.", "question_th": "ผู้จำหน่ายซอฟต์แวร์แอนตี้ไวรัสใช้ ______________ เพื่อติดตามข้อมูลล่าสุดเกี่ยวกับไวรัสและภัยคุกคาม", "options_th": ["Google", "National Vulnerability Database", "Threat intelligence", "National Security Agency"], "explanation_th": "องค์กรและผู้จำหน่ายผลิตภัณฑ์ใช้ threat intelligence จากแหล่งต่าง ๆ โดยการรวบรวมและศึกษาข้อมูลเกี่ยวกับภัยคุกคาม ผู้จำหน่ายสามารถเตรียมพร้อมและป้องกันภัยคุกคามเหล่านั้นได้"}, {"id": 159, "dom": 4, "question": "When leveraging a third-party cloud service provider, which of the following is always the responsibility of the provider?", "options": ["Data security", "Physical security of the datacenter", "Identity and access management controls", "Endpoint protection"], "correct_idx": 1, "explanation": "Physical security of the datacenter is always the responsibility of the cloud service provider.", "short_explanation_en": "Physical security of the datacenter is always the responsibility of the cloud service provider.", "question_th": "เมื่อใช้ผู้ให้บริการคลาวด์บุคคลที่สาม ข้อใดต่อไปนี้เป็นความรับผิดชอบของผู้ให้บริการเสมอ?", "options_th": ["ความปลอดภัยของข้อมูล", "ความปลอดภัยทางกายภาพของศูนย์ข้อมูล", "การควบคุมเชิงบริหารจัดการ (Administrative Control)จัดการตัวตนและการเข้าถึง", "การป้องกัน Endpoint"], "explanation_th": "ความปลอดภัยทางกายภาพของศูนย์ข้อมูลเป็นความรับผิดชอบของผู้ให้บริการคลาวด์เสมอ"}, {"id": 160, "dom": 4, "question": "An organization has built out a cloud environment in their own datacenter for exclusive use by their employees to allow other teams to provision and manage virtual resources. Which of the following cloud deployment models is this an example of?", "options": ["Public", "Private", "Community", "Hybrid"], "correct_idx": 1, "explanation": "A private cloud deployment model consists of computing infrastructure and resources that are dedicated for use by a single organization.", "short_explanation_en": "A private cloud deployment model consists of computing infrastructure and resources that are dedicated for use by a single organization.", "question_th": "องค์กรได้สร้างสภาพแวดล้อมคลาวด์ในศูนย์ข้อมูลของตนเองเพื่อการใช้งานเฉพาะโดยพนักงานของตน เพื่อให้ทีมอื่น ๆ สามารถจัดสรรและจัดการทรัพยากรเสมือนได้ ข้อใดต่อไปนี้เป็นตัวอย่างของโมเดลการปรับใช้คลาวด์นี้?", "options_th": ["Public", "Private", "Community", "Hybrid"], "explanation_th": "โมเดลการปรับใช้ private cloud ประกอบด้วยโครงสร้างพื้นฐานและทรัพยากรคอมพิวเตอร์ที่อุทิศให้กับการใช้งานโดยองค์กรเดียว"}, {"id": 161, "dom": 4, "question": "An organization is hosting applications in a private cloud environment and also making use of Amazon Web Services (AWS) to load-balance the traffic for applications if there is a spike in demand. Which of the following cloud deployment models is this an example of?", "options": ["Public", "Private", "Community", "Hybrid"], "correct_idx": 3, "explanation": "A hybrid cloud deployment model is a mix of the other models (such as a public and private model).", "short_explanation_en": "A hybrid cloud deployment model is a mix of the other models (such as a public and private model).", "question_th": "องค์กรกำลังโฮสต์แอปพลิเคชันในสภาพแวดล้อม private cloud และยังใช้ Amazon Web Services (AWS) เพื่อทำ load-balance ทราฟฟิกสำหรับแอปพลิเคชันหากมีความต้องการเพิ่มขึ้นกะทันหัน ข้อใดต่อไปนี้เป็นตัวอย่างของโมเดลการปรับใช้คลาวด์นี้?", "options_th": ["Public", "Private", "Community", "Hybrid"], "explanation_th": "โมเดลการปรับใช้ hybrid cloud คือส่วนผสมของโมเดลอื่น ๆ (เช่น โมเดล public และ private)"}, {"id": 162, "dom": 4, "question": "An organization is utilizing Google Mail (Gmail) as their e-mail service provider. Which of the following types of cloud service models is being utilized?", "options": ["SaaS", "PaaS", "IaaS", "On-premises"], "correct_idx": 0, "explanation": "Software as a service (SaaS) provides customers with access to an application hosted by the cloud service provider (such as an e-mail service). CHAPTER 4 Security Operations This chapter discusses the following topics: • Data security • System hardening • Best practice security policies • Security awareness training This chapter covers the Certified in Cybersecurity Domain 5. Like Chapter 3, this", "short_explanation_en": "Software as a service (SaaS) provides customers with access to an application hosted by the cloud service provider (such as an e-mail service).", "question_th": "องค์กรใช้ Google Mail (Gmail) เป็นผู้ให้บริการอีเมล ข้อใดต่อไปนี้เป็นประเภทของโมเดลบริการคลาวด์ที่กำลังถูกใช้งาน?", "options_th": ["SaaS", "PaaS", "IaaS", "On-premises"], "explanation_th": "Software as a service (SaaS) ให้ลูกค้าเข้าถึงแอปพลิเคชันที่โฮสต์โดยผู้ให้บริการคลาวด์ (เช่น บริการอีเมล)"}, {"id": 163, "dom": 5, "question": "Alice sends Bob a message encrypted with a private key. Bob decrypts the message with the same private key. Which of the following types of encryption is this an example of?", "options": ["Asymmetric", "Symmetric", "Hashing", "None of the above"], "correct_idx": 1, "explanation": "Symmetric encryption uses the same key for encryption and decryption. This means that the sender and receiver of a message need to have a copy of the same key in order to encrypt/decrypt the message.", "short_explanation_en": "Symmetric encryption uses the same key for encryption and decryption.", "question_th": "อลิซส่งข้อความให้บ็อบโดยเข้ารหัสด้วย private key บ็อบถอดรหัสข้อความด้วย private key เดียวกันนั้น นี่เป็นตัวอย่างของการเข้ารหัสประเภทใด?", "options_th": ["Asymmetric", "Symmetric", "Hashing", "ไม่มีข้อใดถูกต้อง"], "explanation_th": "Symmetric encryption ใช้กุญแจเดียวกันทั้งการเข้ารหัสและถอดรหัส หมายความว่าทั้งผู้ส่งและผู้รับต้องมีสำเนากุญแจเดียวกันเพื่อเข้ารหัส/ถอดรหัสข้อความ"}, {"id": 164, "dom": 5, "question": "Which of the following is not a secure method of data deletion?", "options": ["Emptying the recycle bin on your computer desktop", "Physical destruction of a hard drive", "Zeroization", "Overwriting"], "correct_idx": 0, "explanation": "Pressing the delete key on a computer and emptying the recycle bin on your desktop are not secure methods of data destruction, as the data is not actually securely deleted from the hard drive. These actions simply tell the operating system that the location on the hard drive is free for use.", "short_explanation_en": "Pressing the delete key on a computer and emptying the recycle bin on your desktop are not secure methods of data destruction, as the data is not actually securely deleted from the hard drive.", "question_th": "ข้อใดไม่ใช่วิธีการลบข้อมูลที่ปลอดภัย?", "options_th": ["การล้างถังขยะ (recycle bin) บนเดสก์ท็อปคอมพิวเตอร์", "การทำลายฮาร์ดดิสก์ทางกายภาพ", "การล้างข้อมูลด้วยศูนย์ (Zeroization)", "การเขียนทับ (Overwriting)"], "explanation_th": "การกดปุ่มลบและล้างถังขยะบนเดสก์ท็อปไม่ใช่วิธีการลบข้อมูลที่ปลอดภัย เนื่องจากข้อมูลยังไม่ได้ถูกลบออกจากฮาร์ดดิสก์จริง เพียงแค่บอกระบบปฏิบัติการว่าพื้นที่นั้นว่างสำหรับใช้งานต่อไป"}, {"id": 165, "dom": 5, "question": "Which of the following can be used to create message digests?", "options": ["Symmetric encryption algorithms", "Asymmetric encryption algorithms", "Hash functions", "All of the above"], "correct_idx": 2, "explanation": "Hash functions transform information into fixed-length output known as a hash value, message digest, or fingerprint.", "short_explanation_en": "Hash functions transform information into fixed-length output known as a hash value, message digest, or fingerprint.", "question_th": "ข้อใดสามารถใช้สร้าง message digest ได้?", "options_th": ["อัลกอริทึมการเข้ารหัสแบบ symmetric", "อัลกอริทึมการเข้ารหัสแบบ asymmetric", "ฟังก์ชันแฮช (Hash functions)", "ถูกทุกข้อ"], "explanation_th": "ฟังก์ชันแฮชแปลงข้อมูลให้เป็นผลลัพธ์ความยาวคงที่ที่เรียกว่า hash value, message digest หรือ fingerprint"}, {"id": 166, "dom": 5, "question": "A security administrator is looking for ways to automate the monitoring of logs throughout the environment. Which of the following solutions would help provide automated monitoring capability?", "options": ["Regularly review the logs", "Store the logs on a centralized log server", "Implement a SIEM", "Implement a firewall"], "correct_idx": 2, "explanation": "Implementing a security information and event management (SIEM) system is one example of how an organization can implement automated monitoring. A SIEM system is a tool that ingests logs from various sources, serves as a central secure log repository, and contains rules that alert on suspicious events identified in logs.", "short_explanation_en": "Implementing a security information and event management (SIEM) system is one example of how an organization can implement automated monitoring.", "question_th": "ผู้ดูแลระบบความปลอดภัยกำลังมองหาวิธีที่จะทำให้การเฝ้าติดตาม log ทั่วทั้งสภาพแวดล้อมเป็นแบบอัตโนมัติ ข้อใดจะช่วยให้เกิดความสามารถในการเฝ้าติดตามแบบอัตโนมัติ?", "options_th": ["ทบทวน log เป็นประจำ", "จัดเก็บ log บนเซิร์ฟเวอร์ log แบบรวมศูนย์", "นำ SIEM มาใช้", "นำไฟร์วอลล์มาใช้"], "explanation_th": "การนำระบบ SIEM (Security Information and Event Management) มาใช้เป็นตัวอย่างหนึ่งขององค์กรที่สามารถทำให้การเฝ้าติดตามเป็นแบบอัตโนมัติ ระบบ SIEM จะรับ log จากหลายแหล่ง ทำหน้าที่เป็นคลังจัดเก็บ log กลางที่ปลอดภัย และมีกฎที่แจ้งเตือนเหตุการณ์ที่น่าสงสัยซึ่งพบใน log"}, {"id": 167, "dom": 5, "question": "Which of the following types of encryption uses two keys: one for encryption and a separate key for decryption?", "options": ["Asymmetric", "Symmetric", "Hashing", "None of the above"], "correct_idx": 0, "explanation": "Asymmetric encryption uses two keys: a public key (for encryption) and a private key (for decryption).", "short_explanation_en": "Asymmetric encryption uses two keys: a public key (for encryption) and a private key (for decryption).", "question_th": "การเข้ารหัสประเภทใดที่ใช้กุญแจสองดอก: หนึ่งสำหรับเข้ารหัสและอีกดอกแยกต่างหากสำหรับถอดรหัส?", "options_th": ["Asymmetric", "Symmetric", "Hashing", "ไม่มีข้อใดถูกต้อง"], "explanation_th": "Asymmetric encryption ใช้กุญแจสองดอก: public key (สำหรับเข้ารหัส) และ private key (สำหรับถอดรหัส)"}, {"id": 168, "dom": 5, "question": "As the new CISO of his organization, Joe decided to initiate a comprehensive set of scans. The scans reported that nearly all of his endpoints have known operating system vulnerabilities. What is the most likely root cause of this situation?", "options": ["The organization is the victim of an advanced persistent threat.", "The endpoints do not have up-to-date antimalware software installed.", "The endpoints have not been kept up-to-date with the latest security patches.", "Brute force attack."], "correct_idx": 2, "explanation": "The most likely reason endpoints have known operating system vulnerabilities is they do not have the latest patches installed from the vendors. Poorly configured antimalware software or a brute force attack would not cause this, and an APT might be the result of this situation but not the cause of it.", "short_explanation_en": "The most likely reason endpoints have known operating system vulnerabilities is they do not have the latest patches installed from the vendors.", "question_th": "ในฐานะ CISO คนใหม่ขององค์กร โจตัดสินใจเริ่มการสแกนอย่างครอบคลุม ผลการสแกนรายงานว่าเกือบทุก endpoint มีช่องโหว่ของระบบปฏิบัติการที่ทราบแล้ว สาเหตุที่เป็นไปได้มากที่สุดของสถานการณ์นี้คืออะไร?", "options_th": ["องค์กรตกเป็นเหยื่อของการโจมตีแบบ Advanced Persistent Threat", "Endpoint ไม่มีการติดตั้งซอฟต์แวร์ป้องกันมัลแวร์ที่ทันสมัย", "Endpoint ไม่ได้รับการอัปเดตด้วยแพตช์ความปลอดภัยล่าสุด", "การโจมตีแบบ Brute force"], "explanation_th": "สาเหตุที่เป็นไปได้มากที่สุดที่ endpoint มีช่องโหว่ของระบบปฏิบัติการที่ทราบแล้ว คือไม่ได้ติดตั้งแพตช์ล่าสุดจากผู้จำหน่าย การตั้งค่าซอฟต์แวร์ป้องกันมัลแวร์ที่ไม่ดีหรือการโจมตีแบบ brute force จะไม่ก่อให้เกิดปัญหานี้ และ APT อาจเป็นผลลัพธ์ของสถานการณ์นี้ แต่ไม่ใช่สาเหตุ"}, {"id": 169, "dom": 5, "question": "A network administrator found that one of the firewalls was no longer configured in accordance with recommended settings from DISA as it once was. What is the most likely reason for this?", "options": ["The settings from DISA were incorrect.", "Configuration management procedures for the device were not followed.", "Privilege creep.", "Data integrity."], "correct_idx": 1, "explanation": "The best answer is that it is most likely that someone changed a setting without the proper approval and documentation; therefore, CM procedures were not followed.", "short_explanation_en": "The best answer is that it is most likely that someone changed a setting without the proper approval and documentation; therefore, CM procedures were not followed.", "question_th": "ผู้ดูแลระบบเครือข่ายพบว่าไฟร์วอลล์ตัวหนึ่งไม่ได้ถูกตั้งค่าตามคำแนะนำจาก DISA เหมือนเดิมอีกต่อไป สาเหตุที่เป็นไปได้มากที่สุดคืออะไร?", "options_th": ["การตั้งค่าจาก DISA ไม่ถูกต้อง", "ไม่ได้ปฏิบัติตามขั้นตอนการจัดการค่าคอนฟิกสำหรับอุปกรณ์นี้", "Privilege creep", "ความถูกต้องครบถ้วนของข้อมูล (Data integrity)"], "explanation_th": "คำตอบที่ดีที่สุดคือมีแนวโน้มสูงที่มีบางคนเปลี่ยนการตั้งค่าโดยไม่ได้รับการอนุมัติและบันทึกเอกสารอย่างถูกต้อง ดังนั้นจึงไม่ได้ปฏิบัติตามขั้นตอนการจัดการค่าคอนฟิก (CM procedures)"}, {"id": 170, "dom": 5, "question": "Mary isn’t sure if she is allowed to use her company-owned laptop to send messages to her friend on Facebook. To find out if she can, which policy should she refer to?", "options": ["AUP", "BYOD policy", "Data handling policy", "None of the above"], "correct_idx": 0, "explanation": "Of the choices provided, the AUP is the one most likely to provide guidance concerning whether or not Mary can use the company-owned laptop for nonbusiness use.", "short_explanation_en": "Of the choices provided, the AUP is the one most likely to provide guidance concerning whether or not Mary can use the company-owned laptop for nonbusiness use.", "question_th": "แมรี่ไม่แน่ใจว่าเธอได้รับอนุญาตให้ใช้แล็ปท็อปของบริษัทส่งข้อความหาเพื่อนบน Facebook หรือไม่ เธอควรอ้างอิงนโยบายใดเพื่อหาคำตอบ?", "options_th": ["AUP", "นโยบาย BYOD", "นโยบายการจัดการข้อมูล", "ไม่มีข้อใดถูกต้อง"], "explanation_th": "จากตัวเลือกที่ให้มา AUP (Acceptable Use Policy) เป็นตัวเลือกที่มีแนวโน้มมากที่สุดที่จะให้แนวทางว่าแมรี่สามารถใช้แล็ปท็อปของบริษัทเพื่อวัตถุประสงค์ที่ไม่เกี่ยวกับธุรกิจได้หรือไม่"}, {"id": 171, "dom": 5, "question": "Of the policies listed, which one is most likely to provide guidance on connecting a home computer to the work network via VPN?", "options": ["AUP", "BYOD", "Data handling policy", "None of the above"], "correct_idx": 1, "explanation": "Of the choices provided, the BYOD policy is the best choice. The BYOD policy is used by organizations that want to allow their employees to use their personally owned devices to connect to the corporate network.", "short_explanation_en": "Of the choices provided, the BYOD policy is the best choice.", "question_th": "จากนโยบายที่ระบุไว้ ข้อใดมีแนวโน้มมากที่สุดที่จะให้แนวทางเกี่ยวกับการเชื่อมต่อคอมพิวเตอร์ที่บ้านเข้ากับเครือข่ายที่ทำงานผ่าน VPN?", "options_th": ["AUP", "BYOD", "นโยบายการจัดการข้อมูล", "ไม่มีข้อใดถูกต้อง"], "explanation_th": "จากตัวเลือกที่ให้มา นโยบาย BYOD เป็นตัวเลือกที่ดีที่สุด นโยบาย BYOD ถูกใช้โดยองค์กรที่ต้องการอนุญาตให้พนักงานใช้อุปกรณ์ส่วนตัวเชื่อมต่อกับเครือข่ายขององค์กร"}, {"id": 172, "dom": 5, "question": "What is the best reason to provide social engineering training to employees?", "options": ["To show people how to perform a social engineering attack", "So employees can report security violations to management", "To teach people what to look out for", "None of the above"], "correct_idx": 2, "explanation": "The correct answer is to show people what kinds of things they should look out for as a way to defend against social engineering attacks. 5 Business Continuity (BC), Disaster Recovery (DR) & Incident Response Concepts CHAPTER This chapter discusses the following topics: • Incident response • Business continuity • Disaster recovery This chapter explores how organizations respond to and recover from", "short_explanation_en": "The correct answer is to show people what kinds of things they should look out for as a way to defend against social engineering attacks.", "question_th": "เหตุผลที่ดีที่สุดในการจัดฝึกอบรมด้านวิศวกรรมสังคม (Social Engineering) ให้กับพนักงานคืออะไร?", "options_th": ["เพื่อแสดงให้ผู้คนเห็นวิธีทำการโจมตีทางวิศวกรรมสังคม", "เพื่อให้พนักงานสามารถรายงานการละเมิดความปลอดภัยต่อผู้บริหาร", "เพื่อสอนผู้คนให้รู้จักสิ่งที่ควรระวัง", "ไม่มีข้อใดถูกต้อง"], "explanation_th": "คำตอบที่ถูกต้องคือเพื่อแสดงให้ผู้คนเห็นสิ่งที่ควรระวัง ในฐานะวิธีการป้องกันตนเองจากการโจมตีทางวิศวกรรมสังคม"}, {"id": 173, "dom": 5, "question": "Of the following which is the most likely reason(s) a business continuity program might fail?", "options": ["Failure to test the plan and procedures", "Failure to document activation procedures", "Failure to address the threats the organization is most likely to face", "All of the above"], "correct_idx": 3, "explanation": "Failure to test the plan and procedures, failure to document activation procedures, and failure to address the threats the organization is most likely to face are all common reasons a business continuity program can fail - any of these gaps can render the plan ineffective when a real disruption occurs.", "short_explanation_en": "Failure to test the plan and procedures, failure to document activation procedures, and failure to address the threats the organization is most likely to face are all common reasons a business continuity program can fail - any of these gaps can render the plan ineffective when a real disruption occurs.", "question_th": "ข้อใดคือสาเหตุที่เป็นไปได้มากที่สุดที่โปรแกรมความต่อเนื่องทางธุรกิจ (Business Continuity Program) อาจล้มเหลว?", "options_th": ["ไม่ทดสอบแผนและขั้นตอน", "ไม่บันทึกเอกสารขั้นตอนการเปิดใช้งาน", "ไม่จัดการกับภัยคุกคามที่องค์กรมีแนวโน้มเผชิญมากที่สุด", "ถูกทุกข้อ"], "explanation_th": "การไม่ทดสอบแผนและขั้นตอน การไม่บันทึกเอกสารขั้นตอนการเปิดใช้งาน และการไม่จัดการกับภัยคุกคามที่น่าจะเกิดขึ้น ล้วนเป็นสาเหตุทั่วไปที่โปรแกรมความต่อเนื่องทางธุรกิจอาจล้มเหลว - ช่องว่างเหล่านี้แต่ละอย่างสามารถทำให้แผนไร้ประสิทธิภาพเมื่อเกิดการหยุดชะงักจริง"}, {"id": 174, "dom": 2, "question": "During which phase of the incident response process is the incident response plan developed and documented?", "options": ["Preparation", "Containment, eradication, and recovery", "Detection and analysis", "Post-incident activity"], "correct_idx": 0, "explanation": "The incident response plan is developed and documented during the preparation phase of the incident response process.", "short_explanation_en": "The incident response plan is developed and documented during the preparation phase of the incident response process.", "question_th": "แผนตอบสนองต่อเหตุการณ์ถูกพัฒนาและจัดทำเอกสารในขั้นตอนใดของกระบวนการ Incident Response?", "options_th": ["Preparation", "Containment, eradication, and recovery", "Detection and analysis", "Post-incident activity"], "explanation_th": "แผนตอบสนองต่อเหตุการณ์ถูกพัฒนาและจัดทำเอกสารในขั้นตอน Preparation ของกระบวนการ Incident Response"}, {"id": 175, "dom": 2, "question": "During which phase of the incident response process does the lessonslearned assessment take place?", "options": ["Detection and analysis", "Containment, eradication, and recovery", "Preparation", "Post-incident activity"], "correct_idx": 3, "explanation": "The lessons-learned assessment occurs during the post-incident activity phase of the incident response process.", "short_explanation_en": "The lessons-learned assessment occurs during the post-incident activity phase of the incident response process.", "question_th": "การประเมินบทเรียนที่ได้ (Lessons-learned assessment) เกิดขึ้นในขั้นตอนใด?", "options_th": ["Detection and analysis", "Containment, eradication, and recovery", "Preparation", "Post-incident activity"], "explanation_th": "การประเมินบทเรียนที่ได้เกิดขึ้นในขั้นตอน Post-incident activity ของกระบวนการ Incident Response"}, {"id": 176, "dom": 2, "question": "In which phase of the incident response process would a security analyst recover a system from a backup?", "options": ["Preparation", "Detection and analysis", "Post-incident activity", "Containment, eradication, and recovery"], "correct_idx": 3, "explanation": "Recovering a system from backup would take place during the containment, eradication, and recovery phase of the incident response process.", "short_explanation_en": "Recovering a system from backup would take place during the containment, eradication, and recovery phase of the incident response process.", "question_th": "ในขั้นตอนใดของกระบวนการ Incident Response ที่นักวิเคราะห์ความปลอดภัยจะกู้คืนระบบจากข้อมูลสำรอง?", "options_th": ["Preparation", "Detection and analysis", "Post-incident activity", "Containment, eradication, and recovery"], "explanation_th": "การกู้คืนระบบจากข้อมูลสำรองเกิดขึ้นในขั้นตอน Containment, eradication, and recovery"}, {"id": 177, "dom": 2, "question": "What phase comes after the detection and analysis phase in the incident response process?", "options": ["Containment, eradication, and recovery.", "Preparation.", "Post-incident activity.", "Detection and analysis is the last phase of the process."], "correct_idx": 0, "explanation": "The containment, eradication, and recovery phase comes after the detection and analysis phase of the incident response process. The process steps are Preparation -> Detection and Analysis -> Containment, Eradication, and Recovery -> Post-Incident Activity.", "short_explanation_en": "The containment, eradication, and recovery phase comes after the detection and analysis phase of the incident response process.", "question_th": "ขั้นตอนใดเกิดขึ้นหลังจากขั้นตอน detection and analysis ในกระบวนการ Incident Response?", "options_th": ["Containment, eradication, and recovery", "Preparation", "Post-incident activity", "Detection and analysis เป็นขั้นตอนสุดท้ายของกระบวนการ"], "explanation_th": "ขั้นตอน Containment, eradication, and recovery เกิดขึ้นหลังขั้นตอน detection and analysis โดยลำดับเต็มคือ Preparation -> Detection and Analysis -> Containment, Eradication, and Recovery -> Post-Incident Activity"}, {"id": 178, "dom": 2, "question": "Carol is tasked with creating a business continuity plan for her organization. What should she do to determine which of her organization’s business functions should be restored in the event of an incident?", "options": ["Conduct a risk assessment.", "Interview key stakeholders throughout the organization.", "Calculate the MTD for each business function.", "Conduct a business impact analysis."], "correct_idx": 3, "explanation": "The purpose of a business impact analysis is to determine which business functions should be restored after an incident.", "short_explanation_en": "The purpose of a business impact analysis is to determine which business functions should be restored after an incident.", "question_th": "แครอลได้รับมอบหมายให้จัดทำแผนความต่อเนื่องทางธุรกิจสำหรับองค์กรของเธอ เธอควรทำอย่างไรเพื่อกำหนดว่าฟังก์ชันทางธุรกิจใดขององค์กรควรถูกกู้คืนก่อนหากเกิดเหตุการณ์?", "options_th": ["ทำการประเมินความเสี่ยง", "สัมภาษณ์ผู้มีส่วนได้ส่วนเสียหลักทั่วทั้งองค์กร", "คำนวณ MTD สำหรับแต่ละฟังก์ชันทางธุรกิจ", "ทำ Business Impact Analysis"], "explanation_th": "วัตถุประสงค์ของ Business Impact Analysis คือการกำหนดว่าฟังก์ชันทางธุรกิจใดควรถูกกู้คืนก่อนหลังเกิดเหตุการณ์"}, {"id": 179, "dom": 2, "question": "Alice is responsible for designing her organization’s datacenter to provide resiliency in the event of a disaster. If a disaster occurs, she wants to have the new datacenter up and running within a few days, but she does not want to incur the cost of building a full datacenter with all equipment fully installed and configured. Which of the following options is the best choice for her situation?", "options": ["Hot site", "Warm site", "Cold site", "Tertiary site"], "correct_idx": 1, "explanation": "A warm site is a facility that is configured with equipment suitable for supporting IT operations but without the computing equipment itself. The warm site has power, HVAC, physical infrastructure, and possibly telecommunications and peripheral equipment. APPENDIX About the Online Content This book comes complete with TotalTester Online customizable practice exam software with 200 practice exam qu", "short_explanation_en": "A warm site is a facility that is configured with equipment suitable for supporting IT operations but without the computing equipment itself.", "question_th": "อลิซรับผิดชอบออกแบบศูนย์ข้อมูลขององค์กรเพื่อให้มีความยืดหยุ่นในกรณีเกิดภัยพิบัติ หากเกิดภัยพิบัติ เธอต้องการให้ศูนย์ข้อมูลใหม่พร้อมใช้งานภายในไม่กี่วัน แต่ไม่ต้องการเสียค่าใช้จ่ายในการสร้างศูนย์ข้อมูลเต็มรูปแบบพร้อมอุปกรณ์ครบชุด ตัวเลือกใดเหมาะสมที่สุดสำหรับสถานการณ์ของเธอ?", "options_th": ["Hot site", "Warm site", "Cold site", "Tertiary site"], "explanation_th": "Warm site คือศูนย์สำรองที่มีอุปกรณ์เหมาะสมสำหรับรองรับการดำเนินงานด้าน IT แต่ไม่มีอุปกรณ์คอมพิวเตอร์ครบชุด ซึ่งเหมาะกับสถานการณ์นี้"}, {"id": 180, "dom": 4, "question": "The address 8be2:4382:8d84:7ce2:ec0f:3908:d29a:903a is an:", "options": ["Web address", "IPv4 address", "IPv6 address", "Mac address"], "correct_idx": 2, "explanation": "An IPv6 address is a 128-bit address represented as a sequence of eight groups of 16-bit hexadecimal values. An IPv4 address is a 32-bit address represented as a sequence of four 8-bit integers. A Mac address is a 48-bit address represented as six groups of 8 bits values in hexadecimal. A web address consists of a protocol name, a server address, and a resource path (see ISC2 Study Guide, chapter 4, module 1 - Understand Computer Networking).", "short_explanation_en": "An IPv6 address is a 128-bit address represented as a sequence of eight groups of 16-bit hexadecimal values.", "question_th": "ที่อยู่ 8be2:4382:8d84:7ce2:ec0f:3908:d29a:903a คือ:", "options_th": ["ที่อยู่เว็บ", "IPv4 address", "IPv6 address", "Mac address"], "explanation_th": "IPv6 address คือที่อยู่ขนาด 128 บิต แสดงเป็นลำดับแปดกลุ่มของค่าเลขฐานสิบหก 16 บิต IPv4 address คือที่อยู่ขนาด 32 บิต แสดงเป็นลำดับสี่จำนวนเต็ม 8 บิต"}, {"id": 181, "dom": 1, "question": "Which of the following canons is found in the ISC2 code of ethics?", "options": ["Advance and promote the profession", "Protect society, the common good, and the infrastructure", "Provide diligent and competent service to principals", "Act honorably, honestly, safely and legally"], "correct_idx": 2, "explanation": "Only \"Provide diligent and competent service to principals\" contains the accurate text of the ISC2 code of ethics. Although a security professional should discourage unsafe practices, no direct reference to acting safely exists in the canons. Aside from society, the common good and infrastructure, security professionals are expected to protect public trust and confidence. Finally, they are expected to protect the profession, and not just advance and promote it.", "short_explanation_en": "Only \"Provide diligent and competent service to principals\" contains the accurate text of the ISC2 code of ethics.", "question_th": "ข้อใดคือหนึ่งในจรรยาบรรณที่พบใน ISC2 code of ethics?", "options_th": ["Advance and promote the profession", "Protect society, the common good, and the infrastructure", "Provide diligent and competent service to principals", "Act honorably, honestly, safely and legally"], "explanation_th": "มีเพียง 'Provide diligent and competent service to principals' เท่านั้นที่มีข้อความที่ถูกต้องตรงตาม ISC2 code of ethics แม้ผู้เชี่ยวชาญด้านความปลอดภัยควรห้ามปรามการปฏิบัติที่ไม่ปลอดภัย แต่ไม่มีการอ้างอิงถึงการกระทำอย่างปลอดภัยโดยตรงในจรรยาบรรณ นอกเหนือจากสังคม ผลประโยชน์ส่วนรวม และโครงสร้างพื้นฐาน ผู้เชี่ยวชาญความปลอดภัยยังต้องปกป้องความไว้วางใจและความเชื่อมั่นของสาธารณะด้วย"}, {"id": 182, "dom": 1, "question": "Which of the following is NOT an ethical canon of the ISC2?", "options": ["Advance and protect the profession", "Protect society, the common good, necessary public trust and confidence, and the infrastructure", "Act honorably, honestly, justly, responsibly and legally", "Provide active and qualified service to principal"], "correct_idx": 3, "explanation": "In the code of ethics, we read \"Provide diligent and competent service to principals\", and not \"Provide active and qualified service to principals.\"; all the other options are valid canons of the code of ethics (see ISC2 Study Guide Chapter 1, Module 5).", "short_explanation_en": "In the code of ethics, we read \"Provide diligent and competent service to principals\", and not \"Provide active and qualified service to principals.\"; all the other options are valid canons of the code of ethics (see ISC2 Study Guide...", "question_th": "ข้อใดไม่ใช่จรรยาบรรณของ ISC2?", "options_th": ["Advance and protect the profession", "Protect society, the common good, necessary public trust and confidence, and the infrastructure", "Act honorably, honestly, justly, responsibly and legally", "Provide active and qualified service to principal"], "explanation_th": "ในจรรยาบรรณ เราอ่านว่า 'Provide diligent and competent service to principals' ไม่ใช่ 'Provide active and qualified service to principals' ตัวเลือกอื่น ๆ ทั้งหมดเป็นจรรยาบรรณที่ถูกต้อง"}, {"id": 183, "dom": 4, "question": "The cloud deployment model where a company has resources on-premise and in the cloud is known as:", "options": ["Hybrid cloud", "Multi-tenant", "Private cloud", "Community cloud"], "correct_idx": 0, "explanation": "A hybrid cloud is a model that combines (i.e. orchestrates) on-premise infrastructure, private cloud services, and a public cloud to handle storage and service. A community cloud is an infrastructure where multiple organizations share resources and services based on common technological and regulatory necessities. Multi-tenancy refers to a context where several of a cloud vendor's customers share the same computing resources. A private cloud is a cloud computing model where the cloud infrastruct", "short_explanation_en": "A hybrid cloud is a model that combines (i.e. orchestrates) on-premise infrastructure, private cloud services, and a public cloud to handle storage and service.", "question_th": "โมเดลการปรับใช้คลาวด์ที่บริษัทมีทรัพยากรทั้งแบบ on-premise และในคลาวด์ เรียกว่า:", "options_th": ["Hybrid cloud", "Multi-tenant", "Private cloud", "Community cloud"], "explanation_th": "Hybrid cloud คือโมเดลที่ผสมผสาน (ประสาน) โครงสร้างพื้นฐาน on-premise บริการ private cloud และ public cloud เพื่อจัดการการจัดเก็บและบริการ"}, {"id": 184, "dom": 4, "question": "Which of the following is a public IP?", "options": ["13.16.123.1", "192.168.123.1", "172.16.123.1", "10.221.123.1"], "correct_idx": 0, "explanation": "The ranges of IP addresses 10.0.0.0 to 10.255.255.254, 172.16.0.0 to 172.31.255.254, and 192.168.0.0 to 192.168.255.254 are reserved for private use (see ISC2 Study Guide, chapter 4, module 1, under Internet Protocol - IPv4 and IPv6). Therefore, the IP address 13.16.123.1 is the only address in a public range.", "short_explanation_en": "The ranges of IP addresses 10.0.0.0 to 10.255.255.254, 172.16.0.0 to 172.31.255.254, and 192.168.0.0 to 192.168.255.254 are reserved for private use (see ISC2 Study Guide, chapter 4, module 1, under Internet Protocol - IPv4 and IPv6).", "question_th": "ข้อใดต่อไปนี้เป็น public IP?", "options_th": ["13.16.123.1", "192.168.123.1", "172.16.123.1", "10.221.123.1"], "explanation_th": "ช่วง IP address 10.0.0.0 ถึง 10.255.255.254, 172.16.0.0 ถึง 172.31.255.254 และ 192.168.0.0 ถึง 192.168.255.254 ถูกสงวนไว้สำหรับการใช้งานส่วนตัว ดังนั้น 13.16.123.1 จึงเป็น IP address เดียวในช่วงสาธารณะ"}, {"id": 185, "dom": 5, "question": "Which of the following is a data handling policy procedure?", "options": ["Transform", "Collect", "Encode", "Destroy"], "correct_idx": 3, "explanation": "The data handling procedures are 'Classify', 'Categorize', 'Label', 'Store', 'Encrypt', 'Backup', and 'Destroy' (see ISC2 Study Guide, chapter 5, module 3).", "short_explanation_en": "The data handling procedures are 'Classify', 'Categorize', 'Label', 'Store', 'Encrypt', 'Backup', and 'Destroy' (see ISC2 Study Guide, chapter 5, module 3).", "question_th": "ข้อใดเป็นขั้นตอนของนโยบายการจัดการข้อมูล (Data Handling Policy)?", "options_th": ["แปลง (Transform)", "รวบรวม (Collect)", "เข้ารหัส (Encode)", "ทำลาย (Destroy)"], "explanation_th": "ขั้นตอนการจัดการข้อมูลคือ 'Classify' (จัดประเภท), 'Categorize' (แบ่งหมวดหมู่), 'Label' (ติดป้าย), 'Store' (จัดเก็บ), 'Encrypt' (เข้ารหัส), 'Backup' (สำรอง) และ 'Destroy' (ทำลาย)"}, {"id": 186, "dom": 4, "question": "Which devices would be more effective in detecting an intrusion into a network?", "options": ["Routers", "HIDS", "Firewalls", "NIDS"], "correct_idx": 3, "explanation": "Network intrusion detection systems (NIDS) are network devices that detect malicious traffic on a network. Host intrusion detection systems (HIDS) are applications that monitor computer systems for intrusion. Typically, HIDS are not concerned with network devices. A firewall is a device that filters incoming Internet traffic. Routers receive and forward traffic, but (typically) do not analyze it.", "short_explanation_en": "Network intrusion detection systems (NIDS) are network devices that detect malicious traffic on a network.", "question_th": "อุปกรณ์ใดจะมีประสิทธิภาพมากกว่าในการตรวจจับการบุกรุกเข้าสู่เครือข่าย?", "options_th": ["Routers", "HIDS", "Firewalls", "NIDS"], "explanation_th": "Network intrusion detection systems (NIDS) คืออุปกรณ์เครือข่ายที่ตรวจจับทราฟฟิกที่เป็นอันตรายบนเครือข่าย Host intrusion detection systems (HIDS) คือแอปพลิเคชันที่เฝ้าติดตามระบบคอมพิวเตอร์เพื่อการบุกรุก"}, {"id": 187, "dom": 1, "question": "Which concept describes an information security strategy that integrates people, technology and operations in order to establish security controls across multiple layers of the organization?", "options": ["Least Privilege", "Defense in Depth", "Separation of Duties", "Privileged Accounts"], "correct_idx": 1, "explanation": "Defense in depth describes a cybersecurity approach that uses multiple layers of security for holistic protection (see ISC2 Study Guide Chapter 1, Module 3). According to the principle of Separation of Duties, no user should ever be given enough privileges to misuse the system on their own. The principle of Least Privilege dictates that users should be given only those privileges required to complete their specific tasks. Privileged Accounts are a class of accounts that have permissions exceedin", "short_explanation_en": "Defense in depth describes a cybersecurity approach that uses multiple layers of security for holistic protection (see ISC2 Study Guide Chapter 1, Module 3).", "question_th": "แนวคิดใดอธิบายกลยุทธ์ความปลอดภัยสารสนเทศที่ผสานผู้คน เทคโนโลยี และการดำเนินงาน เพื่อสร้างการควบคุมความปลอดภัยในหลายชั้นขององค์กร?", "options_th": ["Least Privilege", "Defense in Depth", "Separation of Duties", "Privileged Accounts"], "explanation_th": "Defense in depth อธิบายแนวทางความปลอดภัยไซเบอร์ที่ใช้ความปลอดภัยหลายชั้นเพื่อการป้องกันแบบองค์รวม ตามหลัก Separation of Duties ไม่ควรให้ผู้ใช้คนใดมีสิทธิ์เพียงพอที่จะใช้ระบบในทางที่ผิดได้ด้วยตัวเอง หลักการ Least Privilege กำหนดว่าผู้ใช้ควรได้รับสิทธิ์เท่าที่จำเป็นต่อการทำงานเท่านั้น"}, {"id": 188, "dom": 3, "question": "Which access control is more effective at protecting a door against unauthorized access?", "options": ["Fences", "Turnstiles", "Barriers", "Locks"], "correct_idx": 3, "explanation": "A lock is a device that prevents a physical structure (typically a door) from being opened, indicating that only the authorized person (i.e. the person with the key) can open it. A fence or a barrier will prevent ALL access. Turnstiles are physical barriers that can be easily overcome (after all, it is common knowledge that intruders can easily jump over a turnstile when no one is watching).", "short_explanation_en": "A lock is a device that prevents a physical structure (typically a door) from being opened, indicating that only the authorized person (i.e.", "question_th": "การควบคุมการเข้าถึงใดมีประสิทธิภาพมากกว่าในการป้องกันประตูจากการเข้าถึงโดยไม่ได้รับอนุญาต?", "options_th": ["รั้ว", "Turnstiles", "สิ่งกีดขวาง", "กุญแจล็อก"], "explanation_th": "กุญแจล็อกเป็นอุปกรณ์ที่ป้องกันไม่ให้โครงสร้างทางกายภาพ (โดยทั่วไปคือประตู) ถูกเปิด บ่งชี้ว่ามีเพียงบุคคลที่ได้รับอนุญาต (ผู้ที่มีกุญแจ) เท่านั้นที่สามารถเปิดได้ รั้วหรือสิ่งกีดขวางจะป้องกันการเข้าถึงทั้งหมด Turnstiles เป็นสิ่งกีดขวางทางกายภาพที่สามารถเอาชนะได้ง่าย"}, {"id": 189, "dom": 1, "question": "Which of the following is a detection control?", "options": ["Turnstiles", "Smoke sensors", "Bollards", "Firewalls"], "correct_idx": 1, "explanation": "By definition, smoke detectors are fire protection devices employed for the early detection of fire. Firewalls are devicesthat filter incoming traffic, and are a type of logical preventive control. Bollards and turnstiles are types of physical preventive controls.", "short_explanation_en": "By definition, smoke detectors are fire protection devices employed for the early detection of fire.", "question_th": "ข้อใดคือการควบคุมแบบตรวจจับ (Detection control)?", "options_th": ["Turnstiles", "Smoke sensors", "Bollards", "Firewalls"], "explanation_th": "โดยนิยาม เครื่องตรวจจับควันเป็นอุปกรณ์ป้องกันอัคคีภัยที่ใช้เพื่อตรวจจับไฟไหม้ในระยะเริ่มต้น ไฟร์วอลล์เป็นอุปกรณ์ที่กรองทราฟฟิกขาเข้า และเป็นการควบคุมแบบป้องกันเชิงตรรกะ Bollards และ turnstiles เป็นการควบคุมแบบป้องกันทางกายภาพ"}, {"id": 190, "dom": 4, "question": "Which type of attack has the PRIMARY objective controlling the system from outside?", "options": ["Backdoors", "Rootkits", "Cross-Site Scripting", "Trojans"], "correct_idx": 0, "explanation": "Trojans and Rootkits are often used to install backdoors. A backdoor is a malicious feature that listens for commands on a specific logical port (TCP or UDP) and executes them on the attacked system or device, thereby giving direct control of the system or device to a malicious outside entity (or program). Cross-Site Scripting can execute code with the same github.com/ayemunhossain permissions as the scripts generated by the target website, compromising the confidentiality and integrity of data", "short_explanation_en": "Trojans and Rootkits are often used to install backdoors. A backdoor is a malicious feature that listens for commands on a specific logical port (TCP or UDP) and executes them on the attacked system or device, thereby giving direct...", "question_th": "การโจมตีประเภทใดที่มีวัตถุประสงค์หลักในการควบคุมระบบจากภายนอก?", "options_th": ["Backdoors", "Rootkits", "Cross-Site Scripting", "Trojans"], "explanation_th": "Trojans และ Rootkits มักถูกใช้เพื่อติดตั้ง backdoors Backdoor คือคุณสมบัติที่เป็นอันตรายซึ่งรอฟังคำสั่งบนพอร์ตตรรกะเฉพาะ (TCP หรือ UDP) และดำเนินการบนระบบหรืออุปกรณ์ที่ถูกโจมตี ทำให้หน่วยงานภายนอกที่เป็นอันตรายสามารถควบคุมระบบหรืออุปกรณ์ได้โดยตรง"}, {"id": 191, "dom": 4, "question": "Which of the following is not a protocol of the OSI Level 3?", "options": ["SNMP", "ICMP", "IGMP", "IP"], "correct_idx": 0, "explanation": "Internet Protocol (IP) is known to be a level 3 protocol. Internet Control Message Protocol (ICMP) and Internet Group Management Protocol (IGMP) are also level 3 protocols. Simple Network Management Protocol (SNMP) is a protocol used to configure and monitor devices attached to networks. It is an application-level protocol (level 7), and therefore the only option that is not from level 3.", "short_explanation_en": "Internet Protocol (IP) is known to be a level 3 protocol. Internet Control Message Protocol (ICMP) and Internet Group Management Protocol (IGMP) are also level 3 protocols.", "question_th": "ข้อใดต่อไปนี้ไม่ใช่โปรโตคอลของ OSI Level 3?", "options_th": ["SNMP", "ICMP", "IGMP", "IP"], "explanation_th": "Internet Protocol (IP) เป็นโปรโตคอลระดับ 3 ที่รู้จักกันดี Internet Control Message Protocol (ICMP) และ Internet Group Management Protocol (IGMP) ก็เป็นโปรโตคอลระดับ 3 เช่นกัน Simple Network Management Protocol (SNMP) เป็นโปรโตคอลระดับแอปพลิเคชัน (level 7)"}, {"id": 192, "dom": 1, "question": "When a company hires an insurance company to mitigate risk, which risk management technique is being applied?", "options": ["Risk avoidance", "Risk transfer", "Risk mitigation", "Risk tolerance"], "correct_idx": 1, "explanation": "Risk transfer is a risk management strategy that contractually shifts a pure risk from one party to another (in this case, to an insurance company). Risk avoidance consists in stopping activities and exposures that can negatively affect an organization and its assets. Risk mitigation consists of mechanisms to reduce the risk. Finally, risk tolerance is the degree of risk that an investor is willing to endure. github.com/ayemunhossain", "short_explanation_en": "Risk transfer is a risk management strategy that contractually shifts a pure risk from one party to another (in this case, to an insurance company).", "question_th": "เมื่อบริษัทจ้างบริษัทประกันเพื่อลดความเสี่ยง เทคนิคการบริหารความเสี่ยงใดที่ถูกนำมาใช้?", "options_th": ["Risk avoidance", "Risk transfer", "Risk mitigation", "Risk tolerance"], "explanation_th": "Risk transfer เป็นกลยุทธ์การบริหารความเสี่ยงที่โอนความเสี่ยงบริสุทธิ์จากฝ่ายหนึ่งไปยังอีกฝ่ายหนึ่งตามสัญญา (ในกรณีนี้คือบริษัทประกัน) Risk avoidance คือการหยุดกิจกรรมและการเปิดเผยที่อาจส่งผลกระทบเชิงลบต่อองค์กร Risk mitigation คือกลไกในการลดความเสี่ยง"}, {"id": 193, "dom": 4, "question": "The SMTP protocol operates at OSI Level:", "options": ["7", "25", "3", "23"], "correct_idx": 0, "explanation": "Simple Mail Transport Protocol (SNMP) is an application layer protocol that operates at level 7. Level 3 corresponds to the network layer. There are no OSI layers above level 7. The number 25 presumably refers to the TCP/IP port of the SMTP protocol. The number 23, in turn, refers to the TCP/IP port of the Telnet protocol.", "short_explanation_en": "Simple Mail Transport Protocol (SNMP) is an application layer protocol that operates at level 7.", "question_th": "โปรโตคอล SMTP ทำงานที่ OSI Level:", "options_th": ["7", "25", "3", "23"], "explanation_th": "Simple Mail Transport Protocol (SMTP) เป็นโปรโตคอลชั้นแอปพลิเคชันที่ทำงานที่ level 7 Level 3 สอดคล้องกับ network layer หมายเลข 25 หมายถึงพอร์ต TCP/IP ของโปรโตคอล SMTP"}, {"id": 194, "dom": 1, "question": "The process of verifying or proving the user's identification is known as:", "options": ["Confidentiality", "Integrity", "Authentication", "Authorization"], "correct_idx": 2, "explanation": "Authentication is the verification of the identity of a user, process or device, as a prerequisite to allowing access to the resources in a given system. In contrast, authorization refers to the permission granted to users, processes or devices to access specific assets. Confidentiality and integrity are properties of information and systems, not processes.", "short_explanation_en": "Authentication is the verification of the identity of a user, process or device, as a prerequisite to allowing access to the resources in a given system.", "question_th": "กระบวนการยืนยันหรือพิสูจน์ตัวตนของผู้ใช้เรียกว่า:", "options_th": ["Confidentiality", "Integrity", "Authentication", "Authorization"], "explanation_th": "Authentication คือการยืนยันตัวตนของผู้ใช้ กระบวนการ หรืออุปกรณ์ ในฐานะเงื่อนไขเบื้องต้นก่อนที่จะอนุญาตให้เข้าถึงทรัพยากรในระบบที่กำหนด ในทางตรงกันข้าม authorization หมายถึงสิทธิ์ที่มอบให้กับผู้ใช้ กระบวนการ หรืออุปกรณ์เพื่อเข้าถึงทรัพย์สินที่เฉพาะเจาะจง"}, {"id": 195, "dom": 3, "question": "If an organization wants to protect itself against tailgating, which of the following types of access control would be most effective? github.com/ayemunhossain", "options": ["Locks", "Fences", "Barriers", "Turnstiles"], "correct_idx": 3, "explanation": "A lock is a device that prevents a physical structure (typically a door) from being opened, indicating that only the authorized person (i.e. the person with the key) can open it. A fence or a barrier will prevent ALL access. Turnstiles are physical barriers that can be easily overcome (after all, it is common knowledge that intruders can easily jump over a turnstile when no one is watching).", "short_explanation_en": "A lock is a device that prevents a physical structure (typically a door) from being opened, indicating that only the authorized person (i.e.", "question_th": "หากองค์กรต้องการป้องกันตนเองจาก tailgating การควบคุมการเข้าถึงประเภทใดต่อไปนี้จะมีประสิทธิภาพมากที่สุด?", "options_th": ["กุญแจล็อก", "รั้ว", "สิ่งกีดขวาง", "Turnstiles"], "explanation_th": "กุญแจล็อกเป็นอุปกรณ์ที่ป้องกันไม่ให้โครงสร้างทางกายภาพถูกเปิด รั้วหรือสิ่งกีดขวางจะป้องกันการเข้าถึงทั้งหมด Turnstiles เป็นสิ่งกีดขวางทางกายภาพที่ควบคุมให้เข้าได้ทีละคน จึงมีประสิทธิภาพมากที่สุดในการป้องกัน tailgating"}, {"id": 196, "dom": 5, "question": "Logging and monitoring systems are essential to:", "options": ["Identifying inefficient performing systems, preventing compromises, and providing a record of how systems are used", "Identifying efficient performing systems, labeling compromises, and providing a record of how systems are used", "Identifying inefficient performing systems, detecting compromises, and providing a record of how systems are used", "Identifying efficient perfo
