or compromised", "Because the law requires immediate deletion", "To make the system run faster"], "correct_idx": 1, "explanation": "An account left active after an employee departs (an orphaned account) is a significant security risk, since it could be misused by the former employee or an attacker to gain unauthorized access.", "short_explanation_en": "An account left active after an employee departs (an orphaned account) is a significant security risk, since it could be misused by the former employee or an attacker to gain unauthorized access.", "question_th": "เหตุใดจึงควรปิดใช้งาน (Disable) บัญชีผู้ใช้ทันทีเมื่อพนักงานลาออก แทนที่จะรอลบภายหลัง?", "options_th": ["เพื่อประหยัดพื้นที่จัดเก็บข้อมูล", "เพื่อป้องกันไม่ให้บัญชีที่ไม่มีเจ้าของ (Orphaned Account) ถูกนำไปใช้ในทางที่ผิดหรือถูกโจมตี", "เพราะกฎหมายบังคับให้ลบทันที", "เพื่อให้ระบบทำงานเร็วขึ้น"], "explanation_th": "บัญชีที่ยังเปิดใช้งานอยู่หลังพนักงานลาออก (Orphaned Account) เป็นความเสี่ยงด้านความปลอดภัยสูง เพราะอาจถูกอดีตพนักงานหรือผู้โจมตีนำไปใช้เข้าถึงระบบโดยไม่ได้รับอนุญาต"}, {"id": 439, "dom": 3, "question": "What is the difference between 'Authentication' and 'Authorization'?", "options": ["Both terms mean the same thing", "Authentication verifies who a user is, while Authorization determines what that user is allowed to do", "Authorization always occurs before Authentication", "Authentication applies only to cloud systems"], "correct_idx": 1, "explanation": "Authentication is the process of verifying a user's claimed identity, while Authorization is the subsequent step that determines what actions or resources the authenticated user is permitted to access.", "short_explanation_en": "Authentication is the process of verifying a user's claimed identity, while Authorization is the subsequent step that determines what actions or resources the authenticated user is permitted to access.", "question_th": "ข้อใดคือความแตกต่างระหว่าง 'Authentication' และ 'Authorization'?", "options_th": ["ทั้งสองคำมีความหมายเหมือนกัน", "Authentication คือการยืนยันว่าผู้ใช้เป็นใคร ส่วน Authorization คือการกำหนดว่าผู้ใช้มีสิทธิ์ทำอะไรได้บ้าง", "Authorization เกิดขึ้นก่อน Authentication เสมอ", "Authentication ใช้เฉพาะกับระบบ Cloud เท่านั้น"], "explanation_th": "Authentication คือกระบวนการยืนยันตัวตนของผู้ใช้ว่าเป็นบุคคลที่อ้างสิทธิ์จริงหรือไม่ ส่วน Authorization คือขั้นตอนถัดมาที่กำหนดว่าผู้ใช้ที่ยืนยันตัวตนแล้วมีสิทธิ์เข้าถึงหรือกระทำการใดได้บ้าง"}, {"id": 440, "dom": 3, "question": "Why does 'Biometric Authentication' carry a unique risk compared to passwords?", "options": ["Biometrics can be easily changed like passwords when leaked", "If biometric data is leaked, the user cannot 'change' their fingerprint or iris the way they can change a password", "Biometrics cannot be used together with MFA", "Biometrics always cost less than passwords"], "correct_idx": 1, "explanation": "Biometric data is a permanent, unique physical characteristic. If it leaks, it cannot be 'reset' or changed like a password, so biometric data requires special protective measures.", "short_explanation_en": "Biometric data is a permanent, unique physical characteristic. If it leaks, it cannot be 'reset' or changed like a password, so biometric data requires special protective measures.", "question_th": "เหตุใด 'Biometric Authentication' จึงมีความเสี่ยงเฉพาะตัวที่แตกต่างจากรหัสผ่าน?", "options_th": ["ไบโอเมตริกซ์เปลี่ยนแปลงได้ง่ายเหมือนรหัสผ่านเมื่อรั่วไหล", "หากข้อมูลไบโอเมตริกซ์รั่วไหล ผู้ใช้ไม่สามารถ 'เปลี่ยน' ลายนิ้วมือหรือม่านตาของตนได้เหมือนการเปลี่ยนรหัสผ่าน", "ไบโอเมตริกซ์ไม่สามารถใช้ร่วมกับ MFA ได้", "ไบโอเมตริกซ์มีต้นทุนต่ำกว่ารหัสผ่านเสมอ"], "explanation_th": "ข้อมูลไบโอเมตริกซ์เป็นลักษณะเฉพาะตัวถาวรของบุคคล หากรั่วไหลจะไม่สามารถ 'รีเซ็ต' หรือเปลี่ยนใหม่ได้เหมือนรหัสผ่าน จึงต้องมีมาตรการปกป้องข้อมูลไบโอเมตริกซ์เป็นพิเศษ"}, {"id": 441, "dom": 3, "question": "What is an 'Access Control List (ACL)'?", "options": ["A list specifying which users or groups have permission to access which resources and at what level", "A list of all employees in the organization", "A record of all security events", "The organization's network diagram"], "correct_idx": 0, "explanation": "An ACL is a list that defines access permissions to resources - such as files, folders, or network devices - specifying which users or groups can read, write, or perform other operations.", "short_explanation_en": "An ACL is a list that defines access permissions to resources - such as files, folders, or network devices - specifying which users or groups can read, write, or perform other operations.", "question_th": "'Access Control List (ACL)' คืออะไร?", "options_th": ["รายการที่ระบุว่าผู้ใช้หรือกลุ่มใดมีสิทธิ์เข้าถึงทรัพยากรใดได้บ้างและในระดับใด", "รายชื่อพนักงานทั้งหมดในองค์กร", "บันทึกเหตุการณ์ความปลอดภัยทั้งหมด", "แผนผังเครือข่ายขององค์กร"], "explanation_th": "ACL คือรายการที่กำหนดสิทธิ์การเข้าถึงทรัพยากร เช่น ไฟล์ โฟลเดอร์ หรืออุปกรณ์เครือข่าย โดยระบุว่าผู้ใช้หรือกลุ่มใดสามารถอ่าน เขียน หรือดำเนินการใดได้บ้าง"}, {"id": 442, "dom": 4, "question": "How many layers does the OSI model have in total?", "options": ["5", "6", "7", "8"], "correct_idx": 2, "explanation": "The OSI (Open Systems Interconnection) model has 7 layers: Physical, Data Link, Network, Transport, Session, Presentation, and Application.", "short_explanation_en": "The OSI (Open Systems Interconnection) model has 7 layers: Physical, Data Link, Network, Transport, Session, Presentation, and Application.", "question_th": "โมเดล OSI มีทั้งหมดกี่เลเยอร์?", "options_th": ["5", "6", "7", "8"], "explanation_th": "โมเดล OSI (Open Systems Interconnection) มี 7 เลเยอร์ ได้แก่ Physical, Data Link, Network, Transport, Session, Presentation และ Application"}, {"id": 443, "dom": 4, "question": "At which layer of the OSI Model does a Packet Filtering firewall primarily operate?", "options": ["Application Layer", "Network Layer", "Session Layer", "Physical Layer"], "correct_idx": 1, "explanation": "A Packet Filtering Firewall operates at the Network Layer (Layer 3), inspecting header data such as IP address and port to decide whether to allow or deny traffic.", "short_explanation_en": "A Packet Filtering Firewall operates at the Network Layer (Layer 3), inspecting header data such as IP address and port to decide whether to allow or deny traffic.", "question_th": "เลเยอร์ใดใน OSI Model ที่ไฟร์วอลล์แบบ Packet Filtering ทำงานอยู่เป็นหลัก?", "options_th": ["Application Layer", "Network Layer", "Session Layer", "Physical Layer"], "explanation_th": "Packet Filtering Firewall ทำงานที่ Network Layer (Layer 3) โดยตรวจสอบข้อมูลใน Header เช่น IP Address และ Port เพื่อตัดสินใจอนุญาตหรือปฏิเสธการรับส่งข้อมูล"}, {"id": 444, "dom": 4, "question": "At which layer of the OSI Model does a 'Switch' primarily operate?", "options": ["Physical Layer (Layer 1)", "Data Link Layer (Layer 2)", "Network Layer (Layer 3)", "Transport Layer (Layer 4)"], "correct_idx": 1, "explanation": "A Switch operates at the Data Link Layer (Layer 2), using MAC addresses to forward data to the correct port (some Layer 3 switches can also operate at the Network Layer, but a basic switch works at Layer 2).", "short_explanation_en": "A Switch operates at the Data Link Layer (Layer 2), using MAC addresses to forward data to the correct port (some Layer 3 switches can also operate at the Network Layer, but a basic switch works at Layer 2).", "question_th": "อุปกรณ์ 'Switch' ทำงานหลักอยู่ที่เลเยอร์ใดของ OSI Model?", "options_th": ["Physical Layer (Layer 1)", "Data Link Layer (Layer 2)", "Network Layer (Layer 3)", "Transport Layer (Layer 4)"], "explanation_th": "Switch ทำงานที่ Data Link Layer (Layer 2) โดยใช้ MAC Address ในการส่งข้อมูลไปยังพอร์ตที่ถูกต้อง (บาง Layer 3 Switch สามารถทำงานที่ Network Layer ได้เช่นกัน แต่ Switch พื้นฐานทำงานที่ Layer 2)"}, {"id": 445, "dom": 4, "question": "What is the primary function of a 'Router'?", "options": ["Encrypting data during transmission", "Routing data between different networks using IP addresses", "Creating new MAC addresses", "Scanning for network vulnerabilities"], "correct_idx": 1, "explanation": "A Router operates at the Network Layer (Layer 3) and is responsible for routing data between different networks using IP addresses.", "short_explanation_en": "A Router operates at the Network Layer (Layer 3) and is responsible for routing data between different networks using IP addresses.", "question_th": "'Router' มีหน้าที่หลักคืออะไร?", "options_th": ["เข้ารหัสข้อมูลระหว่างการส่ง", "กำหนดเส้นทาง (Route) การส่งข้อมูลระหว่างเครือข่ายที่แตกต่างกันโดยใช้ IP Address", "สร้างที่อยู่ MAC Address ใหม่", "สแกนหาช่องโหว่ในเครือข่าย"], "explanation_th": "Router ทำงานที่ Network Layer (Layer 3) มีหน้าที่กำหนดเส้นทางการส่งข้อมูลระหว่างเครือข่ายต่างๆ โดยใช้ IP Address"}, {"id": 446, "dom": 4, "question": "How does a 'Stateful Inspection' firewall differ from 'Packet Filtering'?", "options": ["Stateful only inspects the source IP", "Stateful tracks connection state to decide whether to allow traffic belonging to a valid session, not just inspecting isolated packets", "Stateful only operates at the Physical Layer", "Both work exactly the same way"], "correct_idx": 1, "explanation": "A Stateful Inspection Firewall tracks connection state (e.g., a TCP handshake) and decides whether to allow traffic by considering the full session context - unlike Packet Filtering, which inspects each packet in isolation without context.", "short_explanation_en": "A Stateful Inspection Firewall tracks connection state (e.g., a TCP handshake) and decides whether to allow traffic by considering the full session context - unlike Packet Filtering, which inspects each packet in isolation without context.", "question_th": "ไฟร์วอลล์ประเภท 'Stateful Inspection' แตกต่างจาก 'Packet Filtering' อย่างไร?", "options_th": ["Stateful ตรวจสอบเฉพาะ Source IP เท่านั้น", "Stateful ติดตามสถานะของการเชื่อมต่อ (Connection State) เพื่อตัดสินใจอนุญาตทราฟฟิกที่เกี่ยวข้องกับ Session ที่ถูกต้อง ไม่ใช่แค่ตรวจสอบแพ็กเก็ตแบบแยกส่วน", "Stateful ทำงานที่ Physical Layer เท่านั้น", "ทั้งสองแบบทำงานเหมือนกันทุกประการ"], "explanation_th": "Stateful Inspection Firewall จะติดตามสถานะของการเชื่อมต่อ (เช่น TCP handshake) และตัดสินใจอนุญาตทราฟฟิกโดยพิจารณาบริบทของ Session ทั้งหมด ต่างจาก Packet Filtering ที่ตรวจสอบแต่ละแพ็กเก็ตแยกกันโดยไม่มีบริบท"}, {"id": 447, "dom": 4, "question": "How do 'IDS (Intrusion Detection System)' and 'IPS (Intrusion Prevention System)' differ?", "options": ["IDS only detects and alerts on abnormal events, while IPS can detect and block attacks in real time", "IDS and IPS are exactly the same system", "IDS is used only on wireless networks", "IPS only operates at the Physical Layer"], "correct_idx": 0, "explanation": "IDS is a detective system that alerts when it finds abnormal behavior but doesn't block it, while IPS is a preventive system that can immediately block or stop malicious traffic.", "short_explanation_en": "IDS is a detective system that alerts when it finds abnormal behavior but doesn't block it, while IPS is a preventive system that can immediately block or stop malicious traffic.", "question_th": "'IDS (Intrusion Detection System)' และ 'IPS (Intrusion Prevention System)' แตกต่างกันอย่างไร?", "options_th": ["IDS ตรวจจับและแจ้งเตือนเหตุการณ์ผิดปกติเท่านั้น ส่วน IPS สามารถตรวจจับและบล็อกการโจมตีได้แบบเรียลไทม์", "IDS และ IPS เป็นระบบเดียวกันทุกประการ", "IDS ใช้เฉพาะในเครือข่ายไร้สาย", "IPS ทำงานที่ Physical Layer เท่านั้น"], "explanation_th": "IDS เป็นระบบตรวจจับ (Detective) ที่แจ้งเตือนเมื่อพบพฤติกรรมผิดปกติแต่ไม่บล็อก ส่วน IPS เป็นระบบป้องกัน (Preventive) ที่สามารถบล็อกหรือหยุดยั้งทราฟฟิกที่เป็นอันตรายได้ทันที"}, {"id": 448, "dom": 4, "question": "What is the primary purpose of a VPN (Virtual Private Network)?", "options": ["Increase internet speed", "Create an encrypted, secure communication channel over a public network", "Distribute IP addresses to network devices", "Translate domain names into IP addresses"], "correct_idx": 1, "explanation": "A VPN creates an encrypted tunnel so communication between two points over a public network, such as the internet, is secure and private as if on a private network.", "short_explanation_en": "A VPN creates an encrypted tunnel so communication between two points over a public network, such as the internet, is secure and private as if on a private network.", "question_th": "VPN (Virtual Private Network) มีวัตถุประสงค์หลักเพื่ออะไร?", "options_th": ["เพิ่มความเร็วอินเทอร์เน็ต", "สร้างช่องทางสื่อสารที่เข้ารหัสและปลอดภัยผ่านเครือข่ายสาธารณะ", "แจกจ่าย IP Address ให้อุปกรณ์ในเครือข่าย", "แปลงชื่อโดเมนเป็น IP Address"], "explanation_th": "VPN สร้างอุโมงค์ (Tunnel) ที่เข้ารหัสข้อมูลเพื่อให้การสื่อสารระหว่างจุดสองจุดผ่านเครือข่ายสาธารณะ เช่น อินเทอร์เน็ต มีความปลอดภัยและเป็นส่วนตัวเสมือนอยู่ในเครือข่ายส่วนตัว"}, {"id": 449, "dom": 4, "question": "How does 'Network Segmentation' help improve security?", "options": ["It puts all devices on the same network for convenience", "It divides the network into smaller sections to limit the scope of damage if one section is attacked, preventing it from spreading to the whole network", "It only increases data transmission speed", "It reduces the number of network devices needed"], "correct_idx": 1, "explanation": "Network Segmentation divides a network into smaller zones (e.g., VLANs) to limit an attacker's lateral movement. If one segment is compromised, the damage doesn't spread to the entire network.", "short_explanation_en": "Network Segmentation divides a network into smaller zones (e.g., VLANs) to limit an attacker's lateral movement. If one segment is compromised, the damage doesn't spread to the entire network.", "question_th": "'Network Segmentation' ช่วยเพิ่มความปลอดภัยได้อย่างไร?", "options_th": ["ทำให้ทุกอุปกรณ์อยู่ในเครือข่ายเดียวกันเพื่อความสะดวก", "แบ่งเครือข่ายออกเป็นส่วนย่อยเพื่อจำกัดขอบเขตความเสียหายหากส่วนใดถูกโจมตี ไม่ให้ลุกลามไปทั้งเครือข่าย", "เพิ่มความเร็วในการส่งข้อมูลเท่านั้น", "ลดจำนวนอุปกรณ์เครือข่ายที่ต้องใช้"], "explanation_th": "Network Segmentation แบ่งเครือข่ายออกเป็นโซนย่อยๆ (เช่น VLAN) เพื่อจำกัดการเคลื่อนที่ของผู้โจมตี (Lateral Movement) หากส่วนใดส่วนหนึ่งถูกบุกรุก ความเสียหายจะไม่ลุกลามไปยังทั้งเครือข่าย"}, {"id": 450, "dom": 4, "question": "What is the purpose of a 'DMZ (Demilitarized Zone)' in network architecture?", "options": ["The most important area for storing backup data", "A buffer network that hosts servers requiring access from the external internet, separated from the more critical internal network", "A wireless network for guests", "The primary data encryption system"], "correct_idx": 1, "explanation": "A DMZ is a buffer network that hosts systems needing external access, such as a web server or mail server, to reduce risk if attacked - preventing attackers from directly reaching the more critical internal network.", "short_explanation_en": "A DMZ is a buffer network that hosts systems needing external access, such as a web server or mail server, to reduce risk if attacked - preventing attackers from directly reaching the more critical internal network.", "question_th": "'DMZ (Demilitarized Zone)' ในสถาปัตยกรรมเครือข่ายมีวัตถุประสงค์อะไร?", "options_th": ["เป็นพื้นที่เก็บข้อมูลสำรองสำคัญที่สุด", "เป็นเครือข่ายกันชนที่วางเซิร์ฟเวอร์ที่ต้องเข้าถึงได้จากอินเทอร์เน็ตภายนอก แยกออกจากเครือข่ายภายในที่สำคัญกว่า", "เป็นเครือข่ายไร้สายสำหรับแขก", "เป็นระบบเข้ารหัสข้อมูลหลัก"], "explanation_th": "DMZ คือเครือข่ายกันชนที่วางระบบซึ่งจำเป็นต้องเปิดให้เข้าถึงจากภายนอก เช่น Web Server หรือ Mail Server เพื่อลดความเสี่ยงหากถูกโจมตี ไม่ให้ผู้โจมตีสามารถเข้าถึงเครือข่ายภายในที่สำคัญกว่าได้โดยตรง"}, {"id": 451, "dom": 4, "question": "Which protocol encrypts website communication instead of using unencrypted HTTP?", "options": ["FTP", "HTTPS", "Telnet", "SNMP v1"], "correct_idx": 1, "explanation": "HTTPS (HTTP Secure) uses TLS/SSL to encrypt data between a web browser and server, unlike HTTP, which sends data unencrypted.", "short_explanation_en": "HTTPS (HTTP Secure) uses TLS/SSL to encrypt data between a web browser and server, unlike HTTP, which sends data unencrypted.", "question_th": "โปรโตคอลใดที่ใช้เข้ารหัสการสื่อสารเว็บไซต์แทน HTTP แบบไม่เข้ารหัส?", "options_th": ["FTP", "HTTPS", "Telnet", "SNMP v1"], "explanation_th": "HTTPS (HTTP Secure) ใช้ TLS/SSL ในการเข้ารหัสข้อมูลระหว่างเว็บเบราว์เซอร์กับเซิร์ฟเวอร์ ต่างจาก HTTP ที่ส่งข้อมูลแบบไม่เข้ารหัส"}, {"id": 452, "dom": 4, "question": "Which of the following protocols is considered 'insecure' because it transmits data, including passwords, in plaintext?", "options": ["SSH", "Telnet", "HTTPS", "SFTP"], "correct_idx": 1, "explanation": "Telnet transmits all data, including usernames and passwords, in plaintext, making it vulnerable to sniffing - SSH should be used instead for secure remote access.", "short_explanation_en": "Telnet transmits all data, including usernames and passwords, in plaintext, making it vulnerable to sniffing - SSH should be used instead for secure remote access.", "question_th": "โปรโตคอลใดต่อไปนี้ถือว่า 'ไม่ปลอดภัย' เนื่องจากส่งข้อมูล รวมถึงรหัสผ่าน แบบไม่เข้ารหัส (Plaintext)?", "options_th": ["SSH", "Telnet", "HTTPS", "SFTP"], "explanation_th": "Telnet ส่งข้อมูลทั้งหมดรวมถึงชื่อผู้ใช้และรหัสผ่านแบบ Plaintext ทำให้เสี่ยงต่อการดักฟัง (Sniffing) จึงควรใช้ SSH แทนสำหรับการเข้าถึงระยะไกลที่ปลอดภัย"}, {"id": 453, "dom": 4, "question": "What characterizes a 'Man-in-the-Middle (MITM)' attack?", "options": ["The attacker sends mass fraudulent emails", "The attacker inserts themselves between two communicating parties to eavesdrop or alter data without either party knowing", "The attacker sends massive traffic to crash a system", "The attacker repeatedly guesses passwords"], "correct_idx": 1, "explanation": "MITM is an attack where the attacker positions themselves between two communicating parties, able to eavesdrop, alter, or steal data without the victim knowing they're being attacked.", "short_explanation_en": "MITM is an attack where the attacker positions themselves between two communicating parties, able to eavesdrop, alter, or steal data without the victim knowing they're being attacked.", "question_th": "การโจมตีแบบ 'Man-in-the-Middle (MITM)' มีลักษณะอย่างไร?", "options_th": ["ผู้โจมตีส่งอีเมลหลอกลวงจำนวนมาก", "ผู้โจมตีแทรกตัวอยู่ระหว่างการสื่อสารของสองฝ่ายเพื่อดักฟังหรือแก้ไขข้อมูลโดยที่ทั้งสองฝ่ายไม่รู้ตัว", "ผู้โจมตีส่งทราฟฟิกจำนวนมากเพื่อทำให้ระบบล่ม", "ผู้โจมตีเดารหัสผ่านซ้ำๆ"], "explanation_th": "MITM คือการโจมตีที่ผู้โจมตีแทรกตัวอยู่ระหว่างการสื่อสารของสองฝ่าย สามารถดักฟัง แก้ไข หรือขโมยข้อมูลได้โดยที่เหยื่อไม่รู้ตัวว่ากำลังถูกโจมตี"}, {"id": 454, "dom": 4, "question": "What is the primary goal of a DoS (Denial of Service) attack?", "options": ["Steal confidential data", "Make a system or service unable to function normally by exhausting or overwhelming system resources", "Modify data in a database", "Escalate user privileges"], "correct_idx": 1, "explanation": "DoS aims to compromise Availability by sending more requests than the system can handle, preventing legitimate users from accessing the service.", "short_explanation_en": "DoS aims to compromise Availability by sending more requests than the system can handle, preventing legitimate users from accessing the service.", "question_th": "การโจมตีแบบ DoS (Denial of Service) มีเป้าหมายหลักเพื่ออะไร?", "options_th": ["ขโมยข้อมูลความลับ", "ทำให้ระบบหรือบริการไม่สามารถให้บริการได้ตามปกติโดยการทำให้ทรัพยากรระบบหมดหรือล้น", "แก้ไขข้อมูลในฐานข้อมูล", "ยกระดับสิทธิ์ผู้ใช้"], "explanation_th": "DoS มีเป้าหมายเพื่อทำให้ระบบ Availability ล้มเหลว โดยการส่งคำขอจำนวนมากเกินกว่าที่ระบบจะรองรับได้ ทำให้ผู้ใช้ที่ถูกต้องไม่สามารถเข้าใช้บริการได้"}, {"id": 455, "dom": 4, "question": "How does 'DDoS' differ from 'DoS'?", "options": ["DDoS uses a single attacking machine, while DoS uses multiple", "DDoS comes from multiple sources simultaneously (Distributed), often via a botnet, while DoS comes from a single source", "Both are exactly the same", "DDoS applies only to websites"], "correct_idx": 1, "explanation": "DDoS (Distributed Denial of Service) is an attack that comes from multiple sources simultaneously, often through a botnet network, making it much harder to defend against than a standard single-source DoS attack.", "short_explanation_en": "DDoS (Distributed Denial of Service) is an attack that comes from multiple sources simultaneously, often through a botnet network, making it much harder to defend against than a standard single-source DoS attack.", "question_th": "'DDoS' แตกต่างจาก 'DoS' อย่างไร?", "options_th": ["DDoS ใช้เครื่องโจมตีเพียงเครื่องเดียว ส่วน DoS ใช้หลายเครื่อง", "DDoS มาจากหลายแหล่งพร้อมกัน (Distributed) มักผ่านเครือข่าย Botnet ส่วน DoS มาจากแหล่งเดียว", "ทั้งสองแบบเหมือนกันทุกประการ", "DDoS ใช้เฉพาะกับเว็บไซต์เท่านั้น"], "explanation_th": "DDoS (Distributed Denial of Service) คือการโจมตีที่มาจากหลายแหล่งพร้อมกัน มักผ่านเครือข่าย Botnet ทำให้ยากต่อการป้องกันมากกว่า DoS ทั่วไปที่มาจากแหล่งเดียว"}, {"id": 456, "dom": 4, "question": "Which Wi-Fi encryption protocol is currently the most secure and should be used for wireless networks?", "options": ["WEP", "WPA", "WPA2", "WPA3"], "correct_idx": 3, "explanation": "WPA3 is the latest and most secure Wi-Fi encryption standard currently available. WEP is obsolete and highly insecure, while WPA and WPA2 have known vulnerabilities discovered later.", "short_explanation_en": "WPA3 is the latest and most secure Wi-Fi encryption standard currently available. WEP is obsolete and highly insecure, while WPA and WPA2 have known vulnerabilities discovered later.", "question_th": "เครือข่ายไร้สาย (Wi-Fi) ควรใช้โปรโตคอลการเข้ารหัสใดที่ปลอดภัยที่สุดในปัจจุบัน?", "options_th": ["WEP", "WPA", "WPA2", "WPA3"], "explanation_th": "WPA3 เป็นมาตรฐานการเข้ารหัส Wi-Fi ล่าสุดที่ปลอดภัยที่สุดในปัจจุบัน ส่วน WEP ล้าสมัยและไม่ปลอดภัยอย่างมาก ในขณะที่ WPA และ WPA2 มีช่องโหว่ที่ถูกค้นพบในภายหลัง"}, {"id": 457, "dom": 4, "question": "Why is 'WEP (Wired Equivalent Privacy)' considered insecure and unsuitable for use today?", "options": ["WEP is too slow", "WEP has weaknesses in its encryption algorithm that make it easy to crack with common tools", "WEP only works on wired networks", "WEP doesn't support mobile devices"], "correct_idx": 1, "explanation": "WEP has design weaknesses in its encryption algorithm (RC4 with too-short IVs), allowing attackers to crack the key quickly with widely available tools, which is why it was replaced by WPA and WPA2/3.", "short_explanation_en": "WEP has design weaknesses in its encryption algorithm (RC4 with too-short IVs), allowing attackers to crack the key quickly with widely available tools, which is why it was replaced by WPA and WPA2/3.", "question_th": "เหตุใด 'WEP (Wired Equivalent Privacy)' จึงถือว่าไม่ปลอดภัยและไม่ควรใช้งานในปัจจุบัน?", "options_th": ["WEP มีความเร็วช้าเกินไป", "WEP มีช่องโหว่ในอัลกอริทึมการเข้ารหัสที่ทำให้สามารถถูกถอดรหัสได้ง่ายด้วยเครื่องมือทั่วไป", "WEP ใช้ได้เฉพาะเครือข่ายแบบมีสายเท่านั้น", "WEP ไม่รองรับอุปกรณ์มือถือ"], "explanation_th": "WEP มีจุดอ่อนในการออกแบบอัลกอริทึมเข้ารหัส (RC4 กับ IV ที่สั้นเกินไป) ทำให้ผู้โจมตีสามารถถอดรหัสคีย์ได้ภายในเวลาอันสั้นด้วยเครื่องมือที่หาได้ทั่วไป จึงถูกแทนที่ด้วย WPA และ WPA2/3"}, {"id": 458, "dom": 4, "question": "What is the primary security benefit of 'Network Address Translation (NAT)'?", "options": ["Encrypts all data sent across the network", "Hides internal IP addresses from external networks, making it harder to attack directly from the internet", "Increases internet speed", "Prevents email viruses"], "correct_idx": 1, "explanation": "NAT translates internal organizational IP addresses into a public IP address when communicating with the internet, hiding the internal network structure from outside and making direct attacks more difficult.", "short_explanation_en": "NAT translates internal organizational IP addresses into a public IP address when communicating with the internet, hiding the internal network structure from outside and making direct attacks more difficult.", "question_th": "'Network Address Translation (NAT)' มีประโยชน์หลักอย่างไรต่อความปลอดภัย?", "options_th": ["เข้ารหัสข้อมูลทั้งหมดที่ส่งผ่านเครือข่าย", "ซ่อน IP Address ภายในจากเครือข่ายภายนอก ทำให้ยากต่อการโจมตีโดยตรงจากอินเทอร์เน็ต", "เพิ่มความเร็วอินเทอร์เน็ต", "ป้องกันไวรัสในอีเมล"], "explanation_th": "NAT แปลง IP Address ภายในองค์กรให้เป็น IP Address สาธารณะเมื่อสื่อสารกับอินเทอร์เน็ต ทำให้โครงสร้างเครือข่ายภายในถูกซ่อนจากภายนอก เพิ่มความยากในการโจมตีโดยตรง"}, {"id": 459, "dom": 4, "question": "How does 'VLAN (Virtual LAN)' help improve network security?", "options": ["It logically separates device groups even if connected to the same switch, limiting communication and broadcast traffic between unrelated groups", "It only increases network speed", "It encrypts all data on the network", "It automatically removes malware"], "correct_idx": 0, "explanation": "A VLAN logically divides a network into subgroups even though devices are connected to the same physical switch, limiting the scope of communication and reducing the broadcast domain, improving both security and manageability.", "short_explanation_en": "A VLAN logically divides a network into subgroups even though devices are connected to the same physical switch, limiting the scope of communication and reducing the broadcast domain, improving both security and manageability.", "question_th": "'VLAN (Virtual LAN)' ช่วยเพิ่มความปลอดภัยของเครือข่ายอย่างไร?", "options_th": ["แยกกลุ่มอุปกรณ์ทางตรรกะออกจากกันแม้จะเชื่อมต่อกับสวิตช์เดียวกัน ทำให้จำกัดการสื่อสารและ Broadcast Traffic ระหว่างกลุ่มที่ไม่เกี่ยวข้อง", "เพิ่มความเร็วเครือข่ายเท่านั้น", "เข้ารหัสข้อมูลทั้งหมดในเครือข่าย", "ลบมัลแวร์อัตโนมัติ"], "explanation_th": "VLAN แบ่งเครือข่ายทางตรรกะ (Logical) ออกเป็นกลุ่มย่อย แม้อุปกรณ์จะเชื่อมต่อกับสวิตช์ทางกายภาพเดียวกัน ช่วยจำกัดขอบเขตการสื่อสารและลด Broadcast Domain ทำให้เพิ่มความปลอดภัยและง่ายต่อการบริหารจัดการ"}, {"id": 460, "dom": 4, "question": "In which Cloud Computing model does the provider manage only the underlying Infrastructure, while the user must manage the operating system and applications themselves?", "options": ["SaaS (Software as a Service)", "PaaS (Platform as a Service)", "IaaS (Infrastructure as a Service)", "DaaS (Desktop as a Service)"], "correct_idx": 2, "explanation": "IaaS provides only infrastructure, such as servers, storage, and networking, while the customer must install and manage the operating system, middleware, and applications themselves - unlike PaaS, which provides a ready-to-use platform, or SaaS, which provides fully ready-to-use software.", "short_explanation_en": "IaaS provides only infrastructure, such as servers, storage, and networking, while the customer must install and manage the operating system, middleware, and applications themselves - unlike PaaS, which provides a ready-to-use platform, or SaaS, which provides fully ready-to-use software.", "question_th": "'Cloud Computing' รูปแบบใดที่ผู้ให้บริการดูแลเฉพาะโครงสร้างพื้นฐาน (Infrastructure) ส่วนผู้ใช้ต้องจัดการระบบปฏิบัติการและแอปพลิเคชันเอง?", "options_th": ["SaaS (Software as a Service)", "PaaS (Platform as a Service)", "IaaS (Infrastructure as a Service)", "DaaS (Desktop as a Service)"], "explanation_th": "IaaS ให้บริการเฉพาะโครงสร้างพื้นฐาน เช่น เซิร์ฟเวอร์ สตอเรจ และเครือข่าย ส่วนผู้ใช้ต้องติดตั้งและจัดการระบบปฏิบัติการ มิดเดิลแวร์ และแอปพลิเคชันเอง ต่างจาก PaaS ที่มีแพลตฟอร์มพร้อมใช้ และ SaaS ที่มีซอฟต์แวร์พร้อมใช้งานครบถ้วน"}, {"id": 461, "dom": 4, "question": "What does 'Virtualization' mean in the context of network security?", "options": ["Creating virtual computer systems (Virtual Machines) that run separately on the same hardware, helping isolate environments and limit impact if one machine is attacked", "Encrypting data in the cloud", "Automatic data backup", "Real-time malware detection"], "correct_idx": 0, "explanation": "Virtualization allows multiple Virtual Machines to run separately on a single physical hardware, which helps isolate environments and limit the impact if one VM is attacked, preventing it from spreading to others.", "short_explanation_en": "Virtualization allows multiple Virtual Machines to run separately on a single physical hardware, which helps isolate environments and limit the impact if one VM is attacked, preventing it from spreading to others.", "question_th": "'Virtualization' ในบริบทความปลอดภัยเครือข่ายหมายถึงอะไร?", "options_th": ["การสร้างระบบคอมพิวเตอร์เสมือน (Virtual Machine) ที่ทำงานแยกจากกันบนฮาร์ดแวร์เดียวกัน ช่วยแยกสภาพแวดล้อมและจำกัดผลกระทบหากเครื่องใดถูกโจมตี", "การเข้ารหัสข้อมูลบนคลาวด์", "การสำรองข้อมูลอัตโนมัติ", "การตรวจจับมัลแวร์แบบเรียลไทม์"], "explanation_th": "Virtualization ช่วยให้สามารถรัน Virtual Machine หลายเครื่องแยกกันบนฮาร์ดแวร์กายภาพเดียว ซึ่งช่วยแยกสภาพแวดล้อม (Isolation) และจำกัดผลกระทบหาก VM ใดเครื่องหนึ่งถูกโจมตีไม่ให้ลามไปยังเครื่องอื่น"}, {"id": 462, "dom": 4, "question": "What is the purpose of 'Port Security' on a switch?", "options": ["Increase network port speed", "Restrict or control which devices can connect to a given port, based on MAC address, to prevent unauthorized devices", "Encrypt data transmitted through the port", "Automatically close all ports"], "correct_idx": 1, "explanation": "Port Security limits the number or identifies the specific MAC addresses of devices allowed to connect to each switch port, preventing rogue devices from connecting to the network without authorization.", "short_explanation_en": "Port Security limits the number or identifies the specific MAC addresses of devices allowed to connect to each switch port, preventing rogue devices from connecting to the network without authorization.", "question_th": "'Port Security' บนสวิตช์มีจุดประสงค์อะไร?", "options_th": ["เพิ่มความเร็วของพอร์ตเครือข่าย", "จำกัดหรือควบคุมอุปกรณ์ที่สามารถเชื่อมต่อกับพอร์ตนั้นๆ โดยอิงจาก MAC Address เพื่อป้องกันอุปกรณ์ที่ไม่ได้รับอนุญาต", "เข้ารหัสข้อมูลที่ส่งผ่านพอร์ต", "ปิดพอร์ตทั้งหมดโดยอัตโนมัติ"], "explanation_th": "Port Security ช่วยจำกัดจำนวนหรือระบุ MAC Address ของอุปกรณ์ที่ได้รับอนุญาตให้เชื่อมต่อกับพอร์ตสวิตช์แต่ละพอร์ต เพื่อป้องกันอุปกรณ์แปลกปลอมเชื่อมต่อเข้าเครือข่ายโดยไม่ได้รับอนุญาต"}, {"id": 463, "dom": 4, "question": "What role does a 'Proxy Server' play in a network?", "options": ["Only encrypts data between two parties", "Acts as an intermediary relaying requests between clients and destination servers, and can filter content, hide IP addresses, and cache data", "Distributes IP addresses to devices", "Automatically creates VLANs"], "correct_idx": 1, "explanation": "A Proxy Server acts as an intermediary between users and destination servers, and can be used to filter content, log activity, hide the real user's IP address, and improve speed through caching.", "short_explanation_en": "A Proxy Server acts as an intermediary between users and destination servers, and can be used to filter content, log activity, hide the real user's IP address, and improve speed through caching.", "question_th": "'Proxy Server' ทำหน้าที่อะไรในเครือข่าย?", "options_th": ["เข้ารหัสข้อมูลระหว่างสองฝ่ายเท่านั้น", "ทำหน้าที่เป็นตัวกลางรับส่งคำขอระหว่างไคลเอนต์กับเซิร์ฟเวอร์ปลายทาง สามารถกรองเนื้อหา ซ่อน IP และแคชข้อมูลได้", "แจกจ่าย IP Address ให้อุปกรณ์", "สร้าง VLAN อัตโนมัติ"], "explanation_th": "Proxy Server ทำหน้าที่เป็นตัวกลาง (Intermediary) ระหว่างผู้ใช้และเซิร์ฟเวอร์ปลายทาง สามารถใช้กรองเนื้อหา บันทึก Log ซ่อน IP Address ของผู้ใช้จริง และช่วยเพิ่มความเร็วผ่านการแคช"}, {"id": 464, "dom": 4, "question": "What impact does an 'ARP Spoofing' attack have on a network?", "options": ["Crashes a website with massive traffic", "The attacker forges MAC addresses to intercept or redirect traffic on a local network, often leading to a MITM attack", "Encrypts all files on a machine", "Steals passwords via fraudulent emails"], "correct_idx": 1, "explanation": "ARP Spoofing forges ARP messages to associate the attacker's MAC address with the target's IP address, causing traffic to route through the attacker's machine - commonly used as a step in a Man-in-the-Middle attack on a local network.", "short_explanation_en": "ARP Spoofing forges ARP messages to associate the attacker's MAC address with the target's IP address, causing traffic to route through the attacker's machine - commonly used as a step in a Man-in-the-Middle attack on a local network.", "question_th": "การโจมตีแบบ 'ARP Spoofing' มีผลกระทบอย่างไรต่อเครือข่าย?", "options_th": ["ทำให้เว็บไซต์ล่มจากทราฟฟิกมหาศาล", "ผู้โจมตีปลอมแปลง MAC Address เพื่อดักจับหรือเปลี่ยนเส้นทางทราฟฟิกในเครือข่ายท้องถิ่น ซึ่งมักนำไปสู่การโจมตีแบบ MITM", "เข้ารหัสไฟล์ทั้งหมดในเครื่อง", "ขโมยรหัสผ่านผ่านอีเมลหลอกลวง"], "explanation_th": "ARP Spoofing คือการปลอมแปลงข้อความ ARP เพื่อเชื่อมโยง MAC Address ของผู้โจมตีเข้ากับ IP Address ของเป้าหมาย ทำให้ทราฟฟิกถูกส่งผ่านเครื่องผู้โจมตี ซึ่งมักถูกใช้เป็นขั้นตอนหนึ่งในการโจมตีแบบ Man-in-the-Middle บนเครือข่ายท้องถิ่น"}, {"id": 465, "dom": 4, "question": "Why is 'Segmentation' between IT (Information Technology) and OT (Operational Technology) networks important in industrial systems?", "options": ["It's unnecessary since both systems are the same", "It prevents attacks spreading from the IT network from reaching production control systems or critical infrastructure that could cause physical damage", "It increases the factory's internet speed", "It reduces electricity costs"], "correct_idx": 1, "explanation": "Separating IT and OT networks prevents threats that spread within the IT network (such as malware) from reaching industrial control systems (ICS/SCADA), which could cause far more severe physical damage.", "short_explanation_en": "Separating IT and OT networks prevents threats that spread within the IT network (such as malware) from reaching industrial control systems (ICS/SCADA), which could cause far more severe physical damage.", "question_th": "'Segmentation' ระหว่างเครือข่าย IT (Information Technology) และ OT (Operational Technology) ในระบบอุตสาหกรรมมีความสำคัญอย่างไร?", "options_th": ["ไม่มีความจำเป็นเพราะทั้งสองระบบเหมือนกัน", "ป้องกันไม่ให้การโจมตีจากเครือข่าย IT ลุกลามไปยังระบบควบคุมการผลิตหรือโครงสร้างพื้นฐานสำคัญที่อาจก่อความเสียหายทางกายภาพ", "เพิ่มความเร็วอินเทอร์เน็ตของโรงงาน", "ลดต้นทุนไฟฟ้า"], "explanation_th": "การแยกเครือข่าย IT และ OT ช่วยป้องกันไม่ให้ภัยคุกคามที่แพร่กระจายในเครือข่าย IT (เช่น มัลแวร์) ลุกลามไปยังระบบควบคุมอุตสาหกรรม (ICS/SCADA) ซึ่งอาจก่อให้เกิดความเสียหายทางกายภาพที่ร้ายแรงกว่า"}, {"id": 466, "dom": 5, "question": "What is the primary function of a SIEM (Security Information and Event Management)?", "options": ["Encrypt data in a database", "Collect, analyze, and correlate logs from multiple sources across the organization to centrally detect anomalous events", "Automatically back up data", "Manage user accounts"], "correct_idx": 1, "explanation": "A SIEM centralizes the collection and analysis of log data from devices and systems across an organization, helping security teams detect, correlate, and respond to anomalous events more effectively than checking each source individually.", "short_explanation_en": "A SIEM centralizes the collection and analysis of log data from devices and systems across an organization, helping security teams detect, correlate, and respond to anomalous events more effectively than checking each source individually.", "question_th": "'SIEM (Security Information and Event Management)' มีหน้าที่หลักคืออะไร?", "options_th": ["เข้ารหัสข้อมูลในฐานข้อมูล", "รวบรวม วิเคราะห์ และเชื่อมโยง Log จากหลายแหล่งในองค์กรเพื่อตรวจจับเหตุการณ์ผิดปกติแบบรวมศูนย์", "สำรองข้อมูลอัตโนมัติ", "จัดการบัญชีผู้ใช้"], "explanation_th": "SIEM รวบรวมและวิเคราะห์ข้อมูล Log จากอุปกรณ์และระบบต่างๆ ทั่วองค์กรแบบรวมศูนย์ ช่วยให้ทีมความปลอดภัยตรวจจับ เชื่อมโยง และตอบสนองต่อเหตุการณ์ผิดปกติได้อย่างมีประสิทธิภาพ"}, {"id": 467, "dom": 5, "question": "Why is keeping logs important for security operations?", "options": ["It makes systems run faster", "It supports traceability, event analysis, and serves as evidence for investigating anomalous events", "It reduces storage usage", "It's unnecessary if a firewall is already in place"], "correct_idx": 1, "explanation": "Logs provide accountability (tracing who did what and when), support post-incident analysis, and serve as digital forensic evidence when investigating a security event - none of which a firewall alone can provide.", "short_explanation_en": "Logs provide accountability (tracing who did what and when), support post-incident analysis, and serve as digital forensic evidence when investigating a security event - none of which a firewall alone can provide.", "question_th": "เหตุใดการเก็บบันทึก Log (Logging) จึงมีความสำคัญต่อการดำเนินงานด้านความปลอดภัย?", "options_th": ["ทำให้ระบบทำงานเร็วขึ้น", "ช่วยในการตรวจสอบย้อนกลับ วิเคราะห์เหตุการณ์ และเป็นหลักฐานสำหรับการสืบสวนเมื่อเกิดเหตุการณ์ผิดปกติ", "ลดการใช้พื้นที่จัดเก็บข้อมูล", "ไม่มีความจำเป็นหากมีไฟร์วอลล์แล้ว"], "explanation_th": "การบันทึก Log ช่วยให้สามารถตรวจสอบย้อนกลับ (Accountability) วิเคราะห์เหตุการณ์ที่เกิดขึ้น และใช้เป็นหลักฐานทางนิติวิทยาศาสตร์ดิจิทัล (Digital Forensics) เมื่อเกิดเหตุการณ์ด้านความปลอดภัย"}, {"id": 468, "dom": 5, "question": "What is Patch Management?", "options": ["Routine data backups", "The systematic process of managing and installing software updates to fix vulnerabilities and security issues", "Creating new user accounts", "Encrypting hard disks"], "correct_idx": 1, "explanation": "Patch Management is the systematic process of tracking, testing, and installing patches or software updates to close known security vulnerabilities and maintain system stability.", "short_explanation_en": "Patch Management is the systematic process of tracking, testing, and installing patches or software updates to close known security vulnerabilities and maintain system stability.", "question_th": "'Patch Management' คือกระบวนการใด?", "options_th": ["การสำรองข้อมูลเป็นประจำ", "กระบวนการจัดการติดตั้งการอัปเดตซอฟต์แวร์เพื่อแก้ไขช่องโหว่และปัญหาด้านความปลอดภัยอย่างเป็นระบบ", "การสร้างบัญชีผู้ใช้ใหม่", "การเข้ารหัสฮาร์ดดิสก์"], "explanation_th": "Patch Management คือกระบวนการติดตาม ทดสอบ และติดตั้งแพตช์หรืออัปเดตซอฟต์แวร์อย่างเป็นระบบ เพื่อปิดช่องโหว่ด้านความปลอดภัยและรักษาเสถียรภาพของระบบ"}, {"id": 469, "dom": 5, "question": "How does Vulnerability Management differ from Patch Management?", "options": ["The two terms mean exactly the same thing", "Vulnerability Management is the broader process covering discovery, assessment, and prioritization of all vulnerabilities, while Patch Management is one remediation measure used to address them", "Patch Management applies only to hardware", "Vulnerability Management has nothing to do with software"], "correct_idx": 1, "explanation": "Vulnerability Management is the full lifecycle - scanning, assessing risk, and prioritizing vulnerabilities - while Patch Management is specifically one remediation method (applying vendor fixes) used within that broader process.", "short_explanation_en": "Vulnerability Management is the full lifecycle - scanning, assessing risk, and prioritizing vulnerabilities - while Patch Management is specifically one remediation method (applying vendor fixes) used within that broader process.", "question_th": "'Vulnerability Management' แตกต่างจาก 'Patch Management' อย่างไร?", "options_th": ["ทั้งสองคำมีความหมายเหมือนกันทุกประการ", "Vulnerability Management เป็นกระบวนการที่กว้างกว่า ครอบคลุมการค้นหา ประเมิน และจัดลำดับความสำคัญของช่องโหว่ทั้งหมด ส่วน Patch Management เป็นหนึ่งในมาตรการแก้ไขที่ใช้จัดการช่องโหว่นั้น", "Patch Management ใช้เฉพาะฮาร์ดแวร์เท่านั้น", "Vulnerability Management ไม่เกี่ยวข้องกับซอฟต์แวร์"], "explanation_th": "Vulnerability Management เป็นวงจรกว้างที่รวมการสแกนหา ประเมินความเสี่ยง จัดลำดับความสำคัญ และแก้ไขช่องโหว่ ในขณะที่ Patch Management เป็นหนึ่งในวิธีการแก้ไข (Remediation) ที่ใช้ปิดช่องโหว่ที่พบ"}, {"id": 470, "dom": 5, "question": "What is the primary purpose of Change Management?", "options": ["To prevent any changes to a system entirely", "To systematically control and track changes to IT systems through an approval process, reducing risk from unplanned changes", "To delete old log data", "To perform daily data backups"], "correct_idx": 1, "explanation": "Change Management is a structured process for planning, testing, approving, and documenting changes to IT systems, reducing the risk of unauthorized or unplanned changes causing problems.", "short_explanation_en": "Change Management is a structured process for planning, testing, approving, and documenting changes to IT systems, reducing the risk of unauthorized or unplanned changes causing problems.", "question_th": "'Change Management' มีวัตถุประสงค์หลักเพื่ออะไร?", "options_th": ["ป้องกันการเปลี่ยนแปลงใดๆ ในระบบโดยเด็ดขาด", "ควบคุมและติดตามการเปลี่ยนแปลงในระบบ IT อย่างเป็นระบบผ่านกระบวนการอนุมัติ เพื่อลดความเสี่ยงจากการเปลี่ยนแปลงที่ไม่ได้วางแผน", "ลบข้อมูล Log เก่า", "สำรองข้อมูลรายวัน"], "explanation_th": "Change Management คือกระบวนการที่มีโครงสร้างในการวางแผน ทดสอบ อนุมัติ และบันทึกการเปลี่ยนแปลงในระบบ IT เพื่อลดความเสี่ยงจากการเปลี่ยนแปลงที่ไม่ได้รับอนุญาตหรือไม่ได้วางแผนซึ่งอาจก่อให้เกิดปัญหา"}, {"id": 471, "dom": 5, "question": "How do Configuration Management and 'Baselines' help security?", "options": ["They establish a secure standard configuration as a reference point, helping detect unauthorized or abnormal changes", "They only increase system speed", "They automatically remove malware", "They have no effect on security"], "correct_idx": 0, "explanation": "A baseline defines the approved secure configuration of a system as a reference point - when the system deviates from that baseline, it signals a potentially unauthorized or abnormal change that needs investigation.", "short_explanation_en": "A baseline defines the approved secure configuration of a system as a reference point - when the system deviates from that baseline, it signals a potentially unauthorized or abnormal change that needs investigation.", "question_th": "'Configuration Management' และการใช้ 'Baseline' ช่วยด้านความปลอดภัยอย่างไร?", "options_th": ["กำหนดค่ามาตรฐานที่ปลอดภัยของระบบไว้เป็นข้อมูลอ้างอิง ช่วยตรวจจับการเปลี่ยนแปลงที่ผิดปกติหรือไม่ได้รับอนุญาต", "เพิ่มความเร็วของระบบเท่านั้น", "ลบมัลแวร์อัตโนมัติ", "ไม่มีผลต่อความปลอดภัย"], "explanation_th": "Baseline คือค่ากำหนดมาตรฐานที่ปลอดภัยของระบบ (Secure Configuration) ที่ใช้เป็นข้อมูลอ้างอิง เมื่อระบบเบี่ยงเบนจาก Baseline จะสามารถตรวจจับการเปลี่ยนแปลงที่ผิดปกติหรือไม่ได้รับอนุญาตได้ทันที"}, {"id": 472, "dom": 5, "question": "Which of the following best describes 'Encryption at Rest'?", "options": ["Encrypting data while it travels across a network", "Encrypting data stored on storage media, such as a hard disk or database", "Encrypting only passwords", "Encrypting outgoing email"], "correct_idx": 1, "explanation": "Encryption at Rest protects data that is stored (not moving) - such as on a hard disk or in a database - from unauthorized access if the storage device is stolen or improperly accessed.", "short_explanation_en": "Encryption at Rest protects data that is stored (not moving) - such as on a hard disk or in a database - from unauthorized access if the storage device is stolen or improperly accessed.", "question_th": "ข้อใดคือคำอธิบายที่ถูกต้องของ 'Encryption at Rest'?", "options_th": ["การเข้ารหัสข้อมูลขณะส่งผ่านเครือข่าย", "การเข้ารหัสข้อมูลที่จัดเก็บอยู่บนอุปกรณ์จัดเก็บข้อมูล เช่น ฮาร์ดดิสก์หรือฐานข้อมูล", "การเข้ารหัสรหัสผ่านเท่านั้น", "การเข้ารหัสอีเมลขาออก"], "explanation_th": "Encryption at Rest คือการเข้ารหัสข้อมูลที่ถูกจัดเก็บไว้ (ไม่ได้เคลื่อนที่) เช่น บนฮาร์ดดิสก์หรือในฐานข้อมูล เพื่อป้องกันการเข้าถึงข้อมูลหากอุปกรณ์จัดเก็บถูกขโมยหรือเข้าถึงโดยไม่ได้รับอนุญาต"}, {"id": 473, "dom": 5, "question": "What does 'Encryption in Transit' mean?", "options": ["Encrypting data stored on a disk", "Encrypting data while it is being transmitted across a network from one point to another, e.g. via TLS/SSL", "Encrypting backup data", "Encrypting passwords in a database"], "correct_idx": 1, "explanation": "Encryption in Transit protects data while it travels across a network - for example using HTTPS/TLS - to prevent eavesdropping or tampering during transmission.", "short_explanation_en": "Encryption in Transit protects data while it travels across a network - for example using HTTPS/TLS - to prevent eavesdropping or tampering during transmission.", "question_th": "'Encryption in Transit' หมายถึงอะไร?", "options_th": ["การเข้ารหัสข้อมูลที่จัดเก็บบนดิสก์", "การเข้ารหัสข้อมูลขณะกำลังถูกส่งผ่านเครือข่ายจากจุดหนึ่งไปยังอีกจุดหนึ่ง เช่น ผ่าน TLS/SSL", "การเข้ารหัสข้อมูลสำรอง", "การเข้ารหัสรหัสผ่านในฐานข้อมูล"], "explanation_th": "Encryption in Transit คือการเข้ารหัสข้อมูลขณะกำลังเดินทางผ่านเครือข่าย เช่น การใช้ HTTPS/TLS เพื่อป้องกันการดักฟังหรือแก้ไขข้อมูลระหว่างการส่ง"}, {"id": 474, "dom": 5, "question": "What is the difference between 'Symmetric Encryption' and 'Asymmetric Encryption'?", "options": ["Symmetric uses the same key for both encryption and decryption, while Asymmetric uses a key pair (public/private)", "Symmetric uses a key pair while Asymmetric uses a single key", "There is no difference between the two", "Asymmetric is always faster than Symmetric"], "correct_idx": 0, "explanation": "Symmetric Encryption uses one shared secret key for both encrypting and decrypting (e.g. AES) - faster but requires securely sharing the key. Asymmetric Encryption uses a public/private key pair (e.g. RSA) - slower but avoids the need to share a secret key.", "short_explanation_en": "Symmetric Encryption uses one shared secret key for both encrypting and decrypting (e.g. AES) - faster but requires securely sharing the key. Asymmetric Encryption uses a public/private key pair (e.g. RSA) - slower but avoids the need to share a secret key.", "question_th": "ความแตกต่างระหว่าง 'Symmetric Encryption' และ 'Asymmetric Encryption' คืออะไร?", "options_th": ["Symmetric ใช้กุญแจเดียวกันทั้งเข้ารหัสและถอดรหัส ส่วน Asymmetric ใช้กุญแจคู่ (Public/Private Key)", "Symmetric ใช้กุญแจคู่ ส่วน Asymmetric ใช้กุญแจเดียว", "ทั้งสองแบบไม่มีความแตกต่างกัน", "Asymmetric เร็วกว่า Symmetric เสมอ"], "explanation_th": "Symmetric Encryption ใช้กุญแจลับเดียวกันทั้งการเข้ารหัสและถอดรหัส (เช่น AES) ซึ่งเร็วกว่าแต่ต้องแชร์กุญแจอย่างปลอดภัย ส่วน Asymmetric Encryption ใช้กุญแจคู่ Public Key และ Private Key (เช่น RSA) ซึ่งช้ากว่าแต่ไม่ต้องแชร์กุญแจลับ"}, {"id": 475, "dom": 5, "question": "How does 'Hashing' differ from 'Encryption'?", "options": ["Hashing is a one-way process that cannot be reversed to the original data and is used to verify integrity, while Encryption can be decrypted back to the original with the correct key", "The two are identical and always interchangeable", "Hashing only works on images", "Encryption can never be reversed at all"], "correct_idx": 0, "explanation": "Hashing is a one-way function that converts data into a fixed-length value used to verify data integrity - it cannot be reversed to recover the original data, unlike Encryption which is designed to be decrypted back with the correct key.", "short_explanation_en": "Hashing is a one-way function that converts data into a fixed-length value used to verify data integrity - it cannot be reversed to recover the original data, unlike Encryption which is designed to be decrypted back with the correct key.", "question_th": "'Hashing' แตกต่างจาก 'Encryption' อย่างไร?", "options_th": ["Hashing เป็นกระบวนการทางเดียว (One-way) ที่ไม่สามารถถอดกลับเป็นข้อมูลเดิมได้ ใช้เพื่อตรวจสอบความถูกต้อง ส่วน Encryption สามารถถอดรหัสกลับเป็นข้อมูลเดิมได้หากมีกุญแจที่ถูกต้อง", "ทั้งสองแบบเหมือนกันทุกประการและใช้แทนกันได้เสมอ", "Hashing ใช้เฉพาะกับรูปภาพเท่านั้น", "Encryption ไม่สามารถถอดรหัสกลับได้เลย"], "explanation_th": "Hashing เป็นฟังก์ชันทางเดียวที่แปลงข้อมูลเป็นค่าความยาวคงที่ (Hash Value) เพื่อตรวจสอบความถูกต้องครบถ้วนของข้อมูล ไม่สามารถย้อนกลับเป็นข้อมูลต้นฉบับได้ ต่างจาก Encryption ที่ออกแบบมาให้ถอดรหัสกลับได้เมื่อมีกุญแจที่ถูกต้อง"}, {"id": 476, "dom": 5, "question": "What key topic should 'Security Awareness Training' cover to reduce the risk of Social Engineering?", "options": ["Advanced programming", "Recognizing and being cautious of phishing and various social engineering tactics", "Computer hardware repair", "Project management"], "correct_idx": 1, "explanation": "Since phishing and social engineering are among the most common attack vectors, training should focus on helping employees recognize the warning signs of deceptive emails or messages to reduce the risk of being tricked into revealing sensitive information.", "short_explanation_en": "Since phishing and social engineering are among the most common attack vectors, training should focus on helping employees recognize the warning signs of deceptive emails or messages to reduce the risk of being tricked into revealing sensitive information.", "question_th": "'Security Awareness Training' ควรครอบคลุมหัวข้อใดเป็นสำคัญเพื่อลดความเสี่ยงจาก Social Engineering?", "options_th": ["การเขียนโปรแกรมขั้นสูง", "การรู้จักและระวังภัยฟิชชิ่ง (Phishing) และกลลวงทางวิศวกรรมสังคมรูปแบบต่างๆ", "การซ่อมแซมฮาร์ดแวร์คอมพิวเตอร์", "การบริหารจัดการโครงการ"], "explanation_th": "เนื่องจากฟิชชิ่งและ Social Engineering เป็นช่องทางโจมตีที่พบบ่อยที่สุด การฝึกอบรมจึงควรเน้นให้พนักงานรู้จักสังเกตสัญญาณของอีเมลหรือข้อความหลอกลวง เพื่อลดความเสี่ยงจากการถูกหลอกให้เปิดเผยข้อมูลสำคัญ"}, {"id": 477, "dom": 5, "question": "Why is a 'Data Retention Policy' important to security operations?", "options": ["It defines how long different types of data must be kept and how to destroy it when no longer needed, ensuring legal compliance and reducing risk", "It provides unlimited storage space", "It makes data access faster", "It has no impact on legal compliance"], "correct_idx": 0, "explanation": "A Data Retention Policy defines how long each category of data must be kept and how to securely destroy it once no longer needed, ensuring compliance with legal requirements and reducing the risk of holding unnecessary data.", "short_explanation_en": "A Data Retention Policy defines how long each category of data must be kept and how to securely destroy it once no longer needed, ensuring compliance with legal requirements and reducing the risk of holding unnecessary data.", "question_th": "'Data Retention Policy' มีความสำคัญอย่างไรต่อการดำเนินงานด้านความปลอดภัย?", "options_th": ["กำหนดระยะเวลาที่ต้องเก็บรักษาข้อมูลประเภทต่างๆ และวิธีการทำลายข้อมูลเมื่อหมดความจำเป็น เพื่อให้สอดคล้องกับกฎหมายและลดความเสี่ยง", "เพิ่มพื้นที่จัดเก็บข้อมูลไม่จำกัด", "ทำให้ข้อมูลเข้าถึงได้เร็วขึ้น", "ไม่มีผลต่อการปฏิบัติตามกฎหมาย"], "explanation_th": "Data Retention Policy กำหนดระยะเวลาที่องค์กรต้องเก็บรักษาข้อมูลแต่ละประเภท และวิธีการทำลายข้อมูลอย่างปลอดภัยเมื่อหมดความจำเป็น เพื่อให้สอดคล้องกับข้อกำหนดทางกฎหมายและลดความเสี่ยงจากการเก็บข้อมูลเกินความจำเป็น"}, {"id": 478, "dom": 5, "question": "What is the purpose of 'Media Sanitization' (secure destruction of storage media)?", "options": ["To increase hard disk capacity", "To ensure data stored on media cannot be recovered before the media is disposed of or reused", "To increase data read speed", "To back up data before destruction"], "correct_idx": 1, "explanation": "Media Sanitization is the process of erasing or destroying data on storage media (e.g., via degaussing or physical destruction) to ensure sensitive data cannot be recovered when the media is disposed of or repurposed.", "short_explanation_en": "Media Sanitization is the process of erasing or destroying data on storage media (e.g., via degaussing or physical destruction) to ensure sensitive data cannot be recovered when the media is disposed of or repurposed.", "question_th": "'Media Sanitization' หรือการทำลายสื่อบันทึกข้อมูลอย่างปลอดภัย มีวัตถุประสงค์เพื่ออะไร?", "options_th": ["เพิ่มความจุของฮาร์ดดิสก์", "ทำให้ข้อมูลที่จัดเก็บไว้ในสื่อไม่สามารถกู้คืนได้ ก่อนนำสื่อไปกำจัดทิ้งหรือนำกลับมาใช้ใหม่", "เพิ่มความเร็วในการอ่านข้อมูล", "สำรองข้อมูลก่อนทำลาย"], "explanation_th": "Media Sanitization คือกระบวนการลบหรือทำลายข้อมูลบนสื่อบันทึกข้อมูล (เช่น การ Degauss หรือ Physical Destruction) เพื่อป้องกันไม่ให้ข้อมูลที่อ่อนไหวถูกกู้คืนได้เมื่อสื่อนั้นถูกนำไปทิ้งหรือนำกลับมาใช้ใหม่"}, {"id": 479, "dom": 5, "question": "What is the benefit of 'Monitoring' and Continuous Log Monitoring?", "options": ["It helps detect abnormal behavior or attack signals quickly, reducing the time between an incident occurring and being detected", "It increases network speed", "It reduces the total number of employees needed", "It has no direct effect on security"], "correct_idx": 0, "explanation": "Continuous monitoring helps security teams quickly detect abnormal behavior or attack indicators, reducing 'dwell time' - the period an attacker remains undetected in a system.", "short_explanation_en": "Continuous monitoring helps security teams quickly detect abnormal behavior or attack indicators, reducing 'dwell time' - the period an attacker remains undetected in a system.", "question_th": "'Monitoring' และการตรวจสอบ Log อย่างต่อเนื่อง (Continuous Monitoring) มีประโยชน์อย่างไร?", "options_th": ["ช่วยตรวจจับพฤติกรรมผิดปกติหรือสัญญาณการโจมตีได้อย่างรวดเร็ว ลดระยะเวลาระหว่างการเกิดเหตุการณ์กับการตรวจพบ", "เพิ่มความเร็วของเครือข่าย", "ลดจำนวนพนักงานที่ต้องใช้ทั้งหมด", "ไม่มีผลต่อความปลอดภัยโดยตรง"], "explanation_th": "การตรวจสอบอย่างต่อเนื่องช่วยให้ทีมความปลอดภัยตรวจพบพฤติกรรมผิดปกติหรือสัญญาณบ่งชี้การโจมตีได้อย่างรวดเร็ว ลดเวลาที่เรียกว่า 'Dwell Time' หรือช่วงเวลาที่ผู้โจมตีอยู่ในระบบโดยไม่ถูกตรวจพบ"}, {"id": 480, "dom": 5, "question": "How does 'Job Rotation' help as a security measure?", "options": ["It increases employee salaries", "It reduces the risk of hidden fraud or wrongdoing, since rotating duties gives others the opportunity to notice irregularities", "It reduces the number of employees needed", "It speeds up data processing"], "correct_idx": 1, "explanation": "Job Rotation periodically moves employees between duties, reducing the risk that any one person retains sole control over a critical process for too long, and increasing the chance that fraud or errors get noticed by someone else.", "short_explanation_en": "Job Rotation periodically moves employees between duties, reducing the risk that any one person retains sole control over a critical process for too long, and increasing the chance that fraud or errors get noticed by someone else.", "question_th": "'Job Rotation' เป็นมาตรการด้านความปลอดภัยที่ช่วยอะไร?", "options_th": ["เพิ่มเงินเดือนพนักงาน", "ลดความเสี่ยงจากการทุจริตหรือการกระทำผิดที่ซ่อนเร้น โดยการหมุนเวียนหน้าที่ทำให้ผู้อื่นมีโอกาสตรวจพบความผิดปกติ", "ลดจำนวนพนักงานที่ต้องจ้าง", "เพิ่มความเร็วในการประมวลผลข้อมูล"], "explanation_th": "Job Rotation คือการหมุนเวียนพนักงานให้ทำหน้าที่ต่างๆ เป็นระยะ ซึ่งช่วยลดความเสี่ยงที่บุคคลใดบุคคลหนึ่งจะควบคุมกระบวนการสำคัญไว้คนเดียวเป็นเวลานาน และเพิ่มโอกาสตรวจพบการทุจริตหรือข้อผิดพลาดที่ซ่อนเร้น"}, {"id": 481, "dom": 5, "question": "What type of control is 'Mandatory Vacation' and what benefit does it provide?", "options": ["Purely a benefits perk, unrelated to security", "A control that requires employees to take continuous leave, giving others the opportunity to detect fraud or irregularities the employee may have concealed", "Used only to reduce labor costs", "A substitute for background checks"], "correct_idx": 1, "explanation": "Mandatory Vacation forces employees to take continuous time off, during which someone else covers their duties - creating an opportunity to detect fraud or irregularities the original employee may have been concealing.", "short_explanation_en": "Mandatory Vacation forces employees to take continuous time off, during which someone else covers their duties - creating an opportunity to detect fraud or irregularities the original employee may have been concealing.", "question_th": "'Mandatory Vacation' เป็นมาตรการควบคุมประเภทใดและมีประโยชน์อย่างไร?", "options_th": ["เป็นมาตรการด้านสวัสดิการเท่านั้น ไม่เกี่ยวข้องกับความปลอดภัย", "เป็นมาตรการควบคุมที่บังคับให้พนักงานลาพักร้อนต่อเนื่อง เพื่อเปิดโอกาสให้ผู้อื่นตรวจพบการทุจริตหรือความผิดปกติที่พนักงานอาจปกปิดไว้", "ใช้เพื่อลดต้นทุนแรงงานเท่านั้น", "ใช้แทนการทำ Background Check"], "explanation_th": "Mandatory Vacation บังคับให้พนักงานลาพักร้อนต่อเนื่องเป็นระยะเวลาหนึ่ง ในช่วงนั้นบุคคลอื่นจะเข้ามาทำหน้าที่แทน ซึ่งเปิดโอกาสให้ตรวจพบการทุจริตหรือความผิดปกติที่พนักงานคนเดิมอาจปกปิดไว้ระหว่างปฏิบัติงาน"}, {"id": 482, "dom": 5, "question": "How does 'Vulnerability Scanning' differ from 'Penetration Testing'?", "options": ["Vulnerability Scanning automatically scans for known vulnerabilities, while Penetration Testing simulates a real attack to prove whether a vulnerability can actually be exploited", "The two are identical in every way", "Vulnerability Scanning can only be performed by senior experts", "Penetration Testing uses only automated tools"], "correct_idx": 0, "explanation": "Vulnerability Scanning uses automated tools to find known weaknesses in a system, while Penetration Testing is a deeper, expert-led test that actively attempts to exploit those weaknesses to prove real-world impact.", "short_explanation_en": "Vulnerability Scanning uses automated tools to find known weaknesses in a system, while Penetration Testing is a deeper, expert-led test that actively attempts to exploit those weaknesses to prove real-world impact.", "question_th": "'Vulnerability Scanning' แตกต่างจาก 'Penetration Testing' อย่างไร?", "options_th": ["Vulnerability Scanning เป็นการสแกนหาช่องโหว่ที่ทราบอยู่แล้วโดยอัตโนมัติ ส่วน Penetration Testing เป็นการจำลองการโจมตีจริงเพื่อพิสูจน์ว่าช่องโหว่นั้นสามารถถูกใช้ประโยชน์ได้จริงหรือไม่", "ทั้งสองแบบเหมือนกันทุกประการ", "Vulnerability Scanning ทำได้เฉพาะผู้เชี่ยวชาญระดับสูงเท่านั้น", "Penetration Testing ใช้เครื่องมืออัตโนมัติเพียงอย่างเดียว"], "explanation_th": "Vulnerability Scanning ใช้เครื่องมืออัตโนมัติสแกนหาช่องโหว่ที่ทราบอยู่แล้วในระบบ ในขณะที่ Penetration Testing เป็นการทดสอบเชิงลึกที่จำลองการโจมตีจริงโดยผู้เชี่ยวชาญ เพื่อพิสูจน์ว่าช่องโหว่ที่พบสามารถถูกใช้ประโยชน์ (Exploit) ได้จริงหรือไม่ และประเมินผลกระทบที่แท้จริง"}, {"id": 483, "dom": 5, "question": "Why is periodically testing a backup plan important?", "options": ["To ensure backup files can actually be restored and the data is not corrupted - not just that backup files exist", "To reduce backup file size", "To increase backup speed", "It's unnecessary if backups run regularly"], "correct_idx": 0, "explanation": "Simply having backup files doesn't guarantee successful data recovery. Periodic restore testing confirms the backup process actually works and the data is intact, before you're forced to rely on it during a real incident.", "short_explanation_en": "Simply having backup files doesn't guarantee successful data recovery. Periodic restore testing confirms the backup process actually works and the data is intact, before you're forced to rely on it during a real incident.", "question_th": "เหตุใดการทดสอบ (Testing) แผนสำรองข้อมูล (Backup) เป็นระยะจึงมีความสำคัญ?", "options_th": ["เพื่อให้แน่ใจว่าไฟล์แบ็กอัพสามารถกู้คืนได้จริงและข้อมูลไม่เสียหาย ไม่ใช่แค่มีไฟล์แบ็กอัพอยู่เท่านั้น", "เพื่อลดขนาดไฟล์แบ็กอัพ", "เพื่อเพิ่มความเร็วในการสำรองข้อมูล", "ไม่มีความจำเป็นหากมีการสำรองข้อมูลเป็นประจำ"], "explanation_th": "การมีไฟล์แบ็กอัพไม่ได้รับประกันว่าจะสามารถกู้คืนข้อมูลได้สำเร็จ การทดสอบกู้คืน (Restore Testing) เป็นระยะช่วยยืนยันว่ากระบวนการสำรองข้อมูลทำงานถูกต้องและข้อมูลไม่เสียหาย ก่อนที่จะเกิดเหตุการณ์จริงที่ต้องพึ่งพาแบ็กอัพนั้น"}, {"id": 484, "dom": 1, "question": "A company encrypts customer records so that only authorized staff can read them. Which principle of the CIA Triad does this MOST directly protect?", "options": ["Availability", "Integrity", "Non-repudiation", "Confidentiality"], "correct_idx": 3, "explanation": "Encrypting data so unauthorized parties cannot read it directly protects Confidentiality, one of the three pillars of the CIA Triad. Integrity relates to data accuracy, and Availability relates to timely access.", "short_explanation_en": "Encrypting data so unauthorized parties cannot read it directly protects Confidentiality, one of the three pillars of the CIA Triad. Integrity relates to data accuracy, and Availability relates to timely access.", "question_th": "บริษัทเข้ารหัสข้อมูลลูกค้าเพื่อให้เฉพาะพนักงานที่ได้รับอนุญาตเท่านั้นที่สามารถอ่านได้ การกระทำนี้ปกป้องหลักการใดของ CIA Triad โดยตรงที่สุด?", "options_th": ["Availability", "Integrity", "Non-repudiation", "Confidentiality"], "explanation_th": "การเข้ารหัสข้อมูลเพื่อไม่ให้ผู้ที่ไม่ได้รับอนุญาตอ่านได้ เป็นการปกป้อง Confidentiality (การรักษาความลับ) ซึ่งเป็นหนึ่งในสามเสาหลักของ CIA Triad โดยตรง ส่วน Integrity เกี่ยวกับความถูกต้องครบถ้วนของข้อมูล และ Availability เกี่ยวกับความพร้อมใช้งาน"}, {"id": 485, "dom": 1, "question": "A hospital's patient record system must remain accessible to doctors during an emergency, even during a power outage. Which CIA Triad principle is the hospital primarily addressing by installing backup generators?", "options": ["Accountability", "Integrity", "Availability", "Confidentiality"], "correct_idx": 2, "explanation": "The system's ability to continue providing service despite a disruption, such as a power outage, addresses Availability. Backup generators are a measure specifically designed to maintain system availability.", "short_explanation_en": "The system's ability to continue providing service despite a disruption, such as a power outage, addresses Availability. Backup generators are a measure specifically designed to maintain system availability.", "question_th": "ระบบเวชระเบียนของโรงพยาบาลต้องพร้อมให้แพทย์เข้าถึงได้ในกรณีฉุกเฉิน แม้ในระหว่างไฟฟ้าดับ การติดตั้งเครื่องปั่นไฟสำรองของโรงพยาบาลเป็นการมุ่งเน้นหลักการใดของ CIA Triad เป็นหลัก?", "options_th": ["Accountability", "Integrity", "Availability", "Confidentiality"], "explanation_th": "ความสามารถของระบบในการให้บริการได้อย่างต่อเนื่องแม้เกิดเหตุขัดข้อง เช่น ไฟฟ้าดับ คือหลัก Availability (ความพร้อมใช้งาน) เครื่องปั่นไฟสำรองเป็นมาตรการที่ออกแบบมาเพื่อรักษาความพร้อมใช้งานของระบบโดยเฉพาะ"}, {"id": 486, "dom": 1, "question": "A file's hash value is checked before and after transmission to ensure it was not altered in transit. This process supports which security principle?", "options": ["Confidentiality", "Authorization", "Availability", "Integrity"], "correct_idx": 3, "explanation": "Checking a hash value before and after transmission to confirm data wasn't altered protects Integrity. A changed hash value indicates the data was tampered with.", "short_explanation_en": "Checking a hash value before and after transmission to confirm data wasn't altered protects Integrity. A changed hash value indicates the data was tampered with.", "question_th": "ค่าแฮชของไฟล์ถูกตรวจสอบก่อนและหลังการส่งข้อมูล เพื่อรับประกันว่าไม่ถูกแก้ไขระหว่างทาง กระบวนการนี้สนับสนุนหลักการความปลอดภัยใด?", "options_th": ["Confidentiality", "Authorization", "Availability", "Integrity"], "explanation_th": "การตรวจสอบค่าแฮชก่อนและหลังการส่งข้อมูลเพื่อยืนยันว่าข้อมูลไม่ถูกแก้ไขระหว่างทาง เป็นการปกป้อง Integrity (ความถูกต้องครบถ้วนของข้อมูล) ค่าแฮชที่เปลี่ยนไปจะบ่งชี้ว่าข้อมูลถูกดัดแปลง"}, {"id": 487, "dom": 1, "question": "Which term BEST describes a weakness in a system that could be exploited by a threat actor?", "options": ["Risk", "Threat", "Vulnerability", "Exposure"], "correct_idx": 2, "explanation": "A Vulnerability is a weakness in a system that could be exploited by a bad actor. A Threat is the potential source of harm (e.g., a hacker), and Risk is the likelihood a Threat will exploit a Vulnerability and cause damage.", "short_explanation_en": "A Vulnerability is a weakness in a system that could be exploited by a bad actor. A Threat is the potential source of harm (e.g., a hacker), and Risk is the likelihood a Threat will exploit a Vulnerability and cause damage.", "question_th": "คำใดอธิบายจุดอ่อนในระบบที่อาจถูกผู้ไม่หวังดีใช้ประโยชน์ได้ดีที่สุด?", "options_th": ["Risk", "Threat", "Vulnerability", "Exposure"], "explanation_th": "Vulnerability (ช่องโหว่) คือจุดอ่อนในระบบที่อาจถูกผู้ไม่หวังดีใช้ประโยชน์ ส่วน Threat คือสิ่งที่อาจก่อให้เกิดอันตราย (เช่น แฮกเกอร์) และ Risk คือความเป็นไปได้ที่ Threat จะใช้ประโยชน์จาก Vulnerability จนเกิดความเสียหาย"}, {"id": 488, "dom": 1, "question": "An organization decides that the cost of protecting a low-value asset exceeds the potential loss, and therefore takes no further action against a minor risk. Which risk treatment strategy is this?", "options": ["Risk avoidance", "Risk transference", "Risk mitigation", "Risk acceptance"], "correct_idx": 3, "explanation": "Taking no further action because the cost of protection exceeds the potential loss is Risk Acceptance, distinct from Mitigation (reducing risk) or Transference (shifting risk to a third party, e.g. via insurance).", "short_explanation_en": "Taking no further action because the cost of protection exceeds the potential loss is Risk Acceptance, distinct from Mitigation (reducing risk) or Transference (shifting risk to a third party, e.g. via insurance).", "question_th": "องค์กรตัดสินใจว่าค่าใช้จ่ายในการปกป้องทรัพย์สินที่มีมูลค่าต่ำสูงกว่าความเสียหายที่อาจเกิดขึ้น จึงไม่ดำเนินการเพิ่มเติมกับความเสี่ยงเล็กน้อยนี้ นี่คือกลยุทธ์การจัดการความเสี่ยงแบบใด?", "options_th": ["Risk avoidance", "Risk transference", "Risk mitigation", "Risk acceptance"], "explanation_th": "การยอมรับความเสี่ยงโดยไม่ดำเนินการเพิ่มเติม เพราะต้นทุนในการป้องกันสูงกว่ามูลค่าความเสียหายที่อาจเกิดขึ้น คือ Risk Acceptance (การยอมรับความเสี่ยง) ต่างจาก Mitigation ที่ลดความเสี่ยง หรือ Transference ที่โอนความเสี่ยงไปยังบุคคลที่สาม เช่น การซื้อประกันภัย"}, {"id": 489, "dom": 1, "question": "A company purchases cybersecurity insurance to help cover the cost of a potential data breach. Which risk treatment strategy does this represent?", "options": ["Risk avoidance", "Risk mitigation", "Risk acceptance", "Risk transference"], "correct_idx": 3, "explanation": "Purchasing insurance transfers the financial burden of a risk to a third party (the insurer), making this Risk Transference. The organization still bears the risk, but some of the financial impact is shifted away.", "short_explanation_en": "Purchasing insurance transfers the financial burden of a risk to a third party (the insurer), making this Risk Transference. The organization still bears the risk, but some of the financial impact is shifted away.", "question_th": "บริษัทซื้อประกันภัยไซเบอร์เพื่อช่วยครอบคลุมค่าใช้จ่ายจากการรั่วไหลของข้อมูลที่อาจเกิดขึ้น นี่คือกลยุทธ์การจัดการความเสี่ยงแบบใด?", "options_th": ["Risk avoidance", "Risk mitigation", "Risk acceptance", "Risk transference"], "explanation_th": "การซื้อประกันภัยเป็นการโอนภาระทางการเงินของความเสี่ยงไปให้บุคคลที่สาม (บริษัทประกัน) จึงเป็น Risk Transference (การโอนความเสี่ยง) องค์กรยังคงมีความเสี่ยงอยู่ แต่ผลกระทบทางการเงินบางส่วนถูกโอนออกไป"}, {"id": 490, "dom": 1, "question": "Which type of security control is a security awareness training program considered?", "options": ["Physical control", "Technical control", "Administrative control", "Corrective control"], "correct_idx": 2, "explanation": "Security awareness training is a policy/process an organization establishes to guide employee behavior, making it an Administrative Control - distinct from Technical Controls (e.g., firewalls) or Physical Controls (e.g., cameras).", "short_explanation_en": "Security awareness training is a policy/process an organization establishes to guide employee behavior, making it an Administrative Control - distinct from Technical Controls (e.g., firewalls) or Physical Controls (e.g., cameras).", "question_th": "โปรแกรมฝึกอบรมสร้างความตระหนักด้านความปลอดภัยถือเป็นการควบคุมความปลอดภัยประเภทใด?", "options_th": ["Physical control", "Technical control", "Administrative control", "Corrective control"], "explanation_th": "การฝึกอบรมสร้างความตระหนักด้านความปลอดภัยเป็นนโยบายและกระบวนการที่องค์กรกำหนดขึ้นเพื่อกำกับพฤติกรรมของพนักงาน จึงจัดเป็น Administrative Control (การควบคุมเชิงบริหาร) ต่างจาก Technical Control ซึ่งเป็นเทคโนโลยี เช่น ไฟร์วอลล์ หรือ Physical Control เช่น กล้องวงจรปิด"}, {"id": 491, "dom": 1, "question": "A security guard checking ID badges at a building entrance is an example of which type of control?", "options": ["Technical control", "Detective control", "Physical control", "Administrative control"], "correct_idx": 2, "explanation": "A security guard physically checking ID badges at a building entrance is a tangible physical measure, making it a Physical Control used to prevent unauthorized entry.", "short_explanation_en": "A security guard physically checking ID badges at a building entrance is a tangible physical measure, making it a Physical Control used to prevent unauthorized entry.", "question_th": "เจ้าหน้าที่รักษาความปลอดภัยที่ตรวจบัตรพนักงานที่ทางเข้าอาคารเป็นตัวอย่างของการควบคุมประเภทใด?", "options_th": ["Technical control", "Detective control", "Physical control", "Administrative control"], "explanation_th": "การ์ดรักษาความปลอดภัยที่ตรวจบัตรพนักงานที่ทางเข้าอาคารเป็นมาตรการที่จับต้องได้ทางกายภาพ จึงจัดเป็น Physical Control (การควบคุมทางกายภาพ) ซึ่งใช้ป้องกันการเข้าถึงสถานที่โดยไม่ได้รับอนุญาต"}, {"id": 492, "dom": 1, "question": "Which document provides high-level, mandatory statements of management intent regarding security, without specifying technical detail?", "options": ["Policy", "Procedure", "Standard", "Guideline"], "correct_idx": 0, "explanation": "A Policy is a high-level document expressing management's intent and is mandatory, but does not specify technical detail. A Standard sets specific practical rules, a Procedure gives step-by-step instructions, and a Guideline is non-mandatory advice.", "short_explanation_en": "A Policy is a high-level document expressing management's intent and is mandatory, but does not specify technical detail. A Standard sets specific practical rules, a Procedure gives step-by-step instructions, and a Guideline is non-mandatory advice.", "question_th": "เอกสารประเภทใดที่ให้คำแถลงระดับสูงและมีข้อบังคับเกี่ยวกับเจตนารมณ์ของฝ่ายบริหารด้านความปลอดภัย โดยไม่ระบุรายละเอียดทางเทคนิค?", "options_th": ["Policy", "Procedure", "Standard", "Guideline"], "explanation_th": "Policy (นโยบาย) คือเอกสารระดับสูงที่ระบุเจตนารมณ์ของฝ่ายบริหารและเป็นข้อบังคับ แต่ไม่ได้ลงรายละเอียดทางเทคนิค ส่วน Standard กำหนดกฎเกณฑ์เชิงปฏิบัติที่ชัดเจน และ Procedure ให้ขั้นตอนทำทีละขั้น ในขณะที่ Guideline เป็นเพียงคำแนะนำที่ไม่บังคับ"}, {"id": 493, "dom": 1, "question": "An organization takes reasonable steps to investigate and understand risks before making a business decision. This concept is known as:", "options": ["Risk acceptance", "Negligence", "Due diligence", "Due care"], "correct_idx": 2, "explanation": "Due Diligence is the careful investigation and study of risks before making a decision, such as assessing risk before an investment or contract. Due Care is the continuous action taken to maintain appropriate security standards after risks are known.", "short_explanation_en": "Due Diligence is the careful investigation and study of risks before making a decision, such as assessing risk before an investment or contract. Due Care is the continuous action taken to maintain appropriate security standards after risks are known.", "question_th": "องค์กรดำเนินการตามขั้นตอนที่สมเหตุสมผลเพื่อตรวจสอบและทำความเข้าใจความเสี่ยงก่อนตัดสินใจทางธุรกิจ แนวคิดนี้เรียกว่าอะไร?", "options_th": ["Risk acceptance", "Negligence", "Due diligence", "Due care"], "explanation_th": "Due Diligence คือการตรวจสอบและศึกษาความเสี่ยงอย่างรอบคอบก่อนตัดสินใจ เช่น การประเมินความเสี่ยงก่อนลงทุนหรือทำสัญญา ส่วน Due Care คือการดำเนินการอย่างต่อเนื่องเพื่อรักษามาตรฐานความปลอดภัยที่เหมาะสมหลังจากรู้ถึงความเสี่ยงแล้ว"}, {"id": 494, "dom": 1, "question": "According to the (ISC)² Code of Ethics, which canon takes the HIGHEST priority when in conflict with other canons?", "options": ["Provide diligent and competent service to principals", "Act honorably, honestly, justly, responsibly, and legally", "Advance and protect the profession", "Protect society, the common good, necessary public trust and confidence, and the infrastructure"], "correct_idx": 3, "explanation": "The (ISC)² Code of Ethics has four canons ranked in priority order. The first - 'Protect society, the common good, necessary public trust and confidence, and the infrastructure' - always takes highest priority when in conflict with the others, since societal impact outweighs any individual or organizational interest.", "short_explanation_en": "The (ISC)² Code of Ethics has four canons ranked in priority order. The first - 'Protect society, the common good, necessary public trust and confidence, and the infrastructure' - always takes highest priority when in conflict with the others, since societal impact outweighs any individual or organizational interest.", "question_th": "ตามหลัก (ISC)² Code of Ethics ข้อบังคับใดมีความสำคัญสูงสุดเมื่อเกิดความขัดแย้งกับข้อบังคับอื่น?", "options_th": ["Provide diligent and competent service to principals", "Act honorably, honestly, justly, responsibly, and legally", "Advance and protect the profession", "Protect society, the common good, necessary public trust and confidence, and the infrastructure"], "explanation_th": "จรรยาบรรณของ (ISC)² มี 4 ข้อ (Canon) โดยเรียงลำดับความสำคัญจากบนลงล่าง ข้อแรก 'ปกป้องสังคม ผลประโยชน์ส่วนรวม ความไว้วางใจสาธารณะ และโครงสร้างพื้นฐาน' มีความสำคัญสูงสุดเสมอเมื่อเกิดความขัดแย้งกับข้ออื่น เนื่องจากผลกระทบต่อสังคมโดยรวมสำคัญกว่าผลประโยชน์ของบุคคลหรือองค์กรใดองค์กรหนึ่ง"}, {"id": 495, "dom": 1, "question": "Which of the following is an example of a deterrent control?", "options": ["A backup restoring lost data after an incident", "A firewall that blocks unauthorized traffic", "An intrusion detection system that logs an attack", "A visible warning sign stating the area is under video surveillance"], "correct_idx": 3, "explanation": "A Deterrent Control aims to discourage a bad actor from acting in the first place. A visible CCTV warning sign is a clear example - it doesn't directly prevent access technically but makes a would-be wrongdoer hesitant, unlike a firewall which is a Preventive Control.", "short_explanation_en": "A Deterrent Control aims to discourage a bad actor from acting in the first place. A visible CCTV warning sign is a clear example - it doesn't directly prevent access technically but makes a would-be wrongdoer hesitant, unlike a firewall which is a Preventive Control.", "question_th": "ข้อใดเป็นตัวอย่างของ deterrent control?", "options_th": ["การกู้คืนข้อมูลที่สูญหายจากแบ็กอัพหลังเกิดเหตุการณ์", "ไฟร์วอลล์ที่บล็อกทราฟฟิกที่ไม่ได้รับอนุญาต", "ระบบตรวจจับการบุกรุกที่บันทึกการโจมตี", "ป้ายเตือนที่มองเห็นได้ชัดเจนระบุว่าพื้นที่นี้อยู่ภายใต้การเฝ้าระวังด้วยกล้องวงจรปิด"], "explanation_th": "Deterrent Control (การควบคุมเชิงยับยั้ง) มีจุดประสงค์เพื่อทำให้ผู้ไม่หวังดีเปลี่ยนใจไม่ก่อเหตุตั้งแต่แรก ป้ายเตือนว่ามีกล้องวงจรปิดเป็นตัวอย่างที่ชัดเจน เพราะไม่ได้ป้องกันทางเทคนิคโดยตรงแต่ทำให้ผู้ประสงค์ร้ายลังเลที่จะกระทำผิด ต่างจากไฟร์วอลล์ซึ่งเป็น Preventive Control"}, {"id": 496, "dom": 2, "question": "Which document identifies an organization's critical business functions and the impact of their disruption over time?", "options": ["Incident Response Plan (IRP)", "Business Continuity Plan (BCP)", "Business Impact Analysis (BIA)", "Disaster Recovery Plan (DRP)"], "correct_idx": 2, "explanation": "A Business Impact Analysis (BIA) identifies an organization's critical business functions and assesses the impact of their disruption over time.", "short_explanation_en": "Business Impact Analysis (BIA) คือกระบวนการวิเคราะห์เพื่อระบุฟังก์ชันทางธุรกิจที่สำคัญ และประเมินผลกระทบที่จะเกิดขึ้นหากฟังก์ชันเหล่านั้นหยุดชะงักไปตามระยะเวลา ผลลัพธ์จาก BIA ใช้เป็นพื้นฐานในการจัดทำ BCP และ DRP ต่อไป", "question_th": "เอกสารใดระบุฟังก์ชันทางธุรกิจที่สำคัญขององค์กรและผลกระทบจากการหยุดชะงักตามช่วงเวลา?", "options_th": ["Incident Response Plan (IRP)", "Business Continuity Plan (BCP)", "Business Impact Analysis (BIA)", "Disaster Recovery Plan (DRP)"], "explanation_th": "Business Impact Analysis (BIA) คือกระบวนการวิเคราะห์เพื่อระบุฟังก์ชันทางธุรกิจที่สำคัญ และประเมินผลกระทบที่จะเกิดขึ้นหากฟังก์ชันเหล่านั้นหยุดชะงักไปตามช่วงเวลา"}, {"id": 497, "dom": 2, "question": "What does Recovery Time Objective (RTO) measure?", "options": ["The total cost of a disaster recovery solution", "The time needed to train staff on the recovery plan", "The maximum acceptable amount of data loss measured in time", "The maximum acceptable time a system or process can be down before causing unacceptable harm"], "correct_idx": 3, "explanation": "RTO measures the maximum acceptable time a system or process can be down before causing unacceptable harm to the organization.", "short_explanation_en": "RTO (Recovery Time Objective) คือระยะเวลาสูงสุดที่ระบบหรือกระบวนการสามารถหยุดทำงานได้ก่อนที่จะสร้างความเสียหายที่ยอมรับไม่ได้ต่อองค์กร ส่วน RPO (Recovery Point Objective) วัดปริมาณข้อมูลสูงสุดที่ยอมรับได้ว่าจะสูญหายไป โดยวัดเป็นระยะเวลา", "question_th": "Recovery Time Objective (RTO) วัดอะไร?", "options_th": ["ต้นทุนรวมของโซลูชัน disaster recovery", "ระยะเวลาที่ใช้ฝึกอบรมพนักงานเกี่ยวกับแผนกู้คืน", "ปริมาณข้อมูลสูญเสียสูงสุดที่ยอมรับได้ วัดเป็นเวลา", "ระยะเวลาสูงสุดที่ยอมรับได้ที่ระบบหรือกระบวนการหยุดทำงานก่อนก่อให้เกิดความเสียหายที่ยอมรับไม่ได้"], "explanation_th": "RTO (Recovery Time Objective) คือระยะเวลาสูงสุดที่ระบบหรือกระบวนการสามารถหยุดทำงานได้ก่อนที่จะสร้างความเสียหายที่ยอมรับไม่ได้ต่อองค์กร"}, {"id": 498, "dom": 2, "question": "A company's RPO is 1 hour. What does this mean for the organization's backup strategy?", "options": ["Backups must run at least every hour so that no more than 1 hour of data is lost", "The system must be restored within 1 hour of an outage", "Staff must be trained on recovery procedures within 1 hour", "The company can tolerate up to 1 hour of downtime per year"], "correct_idx": 0, "explanation": "An RPO of 1 hour means backups must run at least every hour, so that no more than 1 hour of data would be lost in the event of an outage.", "short_explanation_en": "RPO 1 ชั่วโมง หมายความว่าองค์กรยอมรับการสูญเสียข้อมูลได้ไม่เกิน 1 ชั่วโมง ดังนั้นต้องมีการสำรองข้อมูล (backup) อย่างน้อยทุก 1 ชั่วโมง เพื่อให้แน่ใจว่าหากเกิดเหตุขัดข้อง ข้อมูลที่สูญหายจะไม่เกินกรอบเวลาที่กำหนดไว้", "question_th": "RPO ของบริษัทคือ 1 ชั่วโมง สิ่งนี้หมายความว่าอย่างไรต่อกลยุทธ์การสำรองข้อมูลขององค์กร?", "options_th": ["ต้องสำรองข้อมูลอย่างน้อยทุกชั่วโมง เพื่อไม่ให้สูญเสียข้อมูลเกิน 1 ชั่วโมง", "ต้องกู้คืนระบบภายใน 1 ชั่วโมงหลังเกิดเหตุขัดข้อง", "ต้องฝึกอบรมพนักงานเกี่ยวกับขั้นตอนการกู้คืนภายใน 1 ชั่วโมง", "บริษัทสามารถทนต่อการหยุดทำงานได้สูงสุด 1 ชั่วโมงต่อปี"], "explanation_th": "RPO 1 ชั่วโมง หมายความว่าองค์กรยอมรับการสูญเสียข้อมูลได้ไม่เกิน 1 ชั่วโมง ดังนั้นต้องมีการสำรองข้อมูล (backup) อย่างน้อยทุก 1 ชั่วโมง"}, {"id": 499, "dom": 2, "question": "Which disaster recovery site option has hardware and network connectivity pre-installed but requires data to be restored and systems configured before becoming operational?", "options": ["Mobile site", "Warm site", "Cold site", "Hot site"], "correct_idx": 1, "explanation": "A Warm site has hardware and network connectivity pre-installed, but data must still be restored and systems configured before it becomes fully operational.", "short_explanation_en": "Warm Site คือศูนย์สำรองที่มีการติดตั้งฮาร์ดแวร์และการเชื่อมต่อเครือข่ายไว้ล่วงหน้าแล้ว แต่ยังต้องกู้คืนข้อมูลและตั้งค่าระบบก่อนจึงจะใช้งานได้จริง ต่างจาก Hot Site ที่พร้อมใช้งานทันที และ Cold Site...", "question_th": "ตัวเลือกไซต์ Disaster Recovery ใดที่มีฮาร์ดแวร์และการเชื่อมต่อเครือข่ายติดตั้งไว้ล่วงหน้า แต่ยังต้องกู้คืนข้อมูลและตั้งค่าระบบก่อนจึงจะใช้งานได้?", "options_th": ["Mobile site", "Warm site", "Cold site", "Hot site"], "explanation_th": "Warm Site คือศูนย์สำรองที่มีการติดตั้งฮาร์ดแวร์และการเชื่อมต่อเครือข่ายไว้ล่วงหน้าแล้ว แต่ยังต้องกู้คืนข้อมูลและตั้งค่าระบบก่อนจึงจะใช้งานได้จริง"}, {"id": 500, "dom": 2, "question": "During an active security incident, which phase of the incident response process focuses on limiting the scope and impact of the incident?", "options": ["Preparati
