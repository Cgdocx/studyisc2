meters - connecting devices close to one individual (e.g., Bluetooth devices).", "question_th": "เครือข่ายประเภทใดที่โดยทั่วไปมีระยะจำกัดตั้งแต่ไม่กี่เซนติเมตรถึงไม่กี่เมตร และเชื่อมต่ออุปกรณ์ภายในพื้นที่ทำงานของบุคคลคนเดียว?", "options_th": ["Local-area network", "Wide-area network", "Personal-area network", "Metropolitan-area network"], "explanation_th": "Personal-Area Network (PAN) มีระยะที่สั้นมาก - โดยทั่วไปตั้งแต่เซนติเมตรถึงไม่กี่เมตร - เชื่อมต่ออุปกรณ์ที่อยู่ใกล้บุคคลคนเดียว (เช่น อุปกรณ์บลูทูธ)"}, {"id": 57, "dom": 4, "question": "Which networking device transmits data packets between connected devices on the LAN?", "options": ["Modem", "Network interface card", "Wireless access point", "Switch"], "correct_idx": 3, "explanation": "A switch forwards data packets between devices connected within the same local-area network based on their MAC addresses.", "short_explanation_en": "A switch forwards data packets between devices connected within the same local-area network based on their MAC addresses.", "question_th": "อุปกรณ์เครือข่ายใดที่ส่งแพ็กเก็ตข้อมูลระหว่างอุปกรณ์ที่เชื่อมต่อกันบน LAN?", "options_th": ["Modem", "Network interface card", "Wireless access point", "Switch"], "explanation_th": "Switch ส่งต่อแพ็กเก็ตข้อมูลระหว่างอุปกรณ์ที่เชื่อมต่อกันภายในเครือข่ายท้องถิ่นเดียวกัน โดยอ้างอิงจาก MAC address"}, {"id": 58, "dom": 4, "question": "Which type of network provides local wireless connectivity and is commonly found in settings like cafes, airports, and public spaces?", "options": ["Wide-area network", "Wireless local-area network", "Metropolitan-area network", "Personal-area network"], "correct_idx": 1, "explanation": "A Wireless Local-Area Network (WLAN) provides local wireless connectivity, commonly used in cafes, airports, and other public spaces.", "short_explanation_en": "A Wireless Local-Area Network (WLAN) provides local wireless connectivity, commonly used in cafes, airports, and other public spaces.", "question_th": "เครือข่ายประเภทใดที่ให้การเชื่อมต่อไร้สายในพื้นที่ท้องถิ่น และมักพบในสถานที่ เช่น ร้านกาแฟ สนามบิน และพื้นที่สาธารณะ?", "options_th": ["Wide-area network", "Wireless local-area network", "Metropolitan-area network", "Personal-area network"], "explanation_th": "Wireless Local-Area Network (WLAN) ให้การเชื่อมต่อไร้สายในพื้นที่ท้องถิ่น มักใช้ในร้านกาแฟ สนามบิน และพื้นที่สาธารณะอื่น ๆ"}, {"id": 59, "dom": 4, "question": "What is the purpose of a metropolitan-area network?", "options": ["Connect multiple LANs across a city or large area", "Provide local wireless connectivity", "Connect devices within an individual’s workspace", "Connect multiple WANs via radio waves or telephone lines"], "correct_idx": 0, "explanation": "A Metropolitan-Area Network (MAN) connects multiple LANs across a city or a similarly large geographic area.", "short_explanation_en": "A Metropolitan-Area Network (MAN) connects multiple LANs across a city or a similarly large geographic area.", "question_th": "วัตถุประสงค์ของ metropolitan-area network คืออะไร?", "options_th": ["เชื่อมต่อหลาย LAN ทั่วเมืองหรือพื้นที่ขนาดใหญ่", "ให้การเชื่อมต่อไร้สายในพื้นที่ท้องถิ่น", "เชื่อมต่ออุปกรณ์ภายในพื้นที่ทำงานของบุคคลคนเดียว", "เชื่อมต่อหลาย WAN ผ่านคลื่นวิทยุหรือสายโทรศัพท์"], "explanation_th": "Metropolitan-Area Network (MAN) เชื่อมต่อหลาย LAN ทั่วเมืองหรือพื้นที่ทางภูมิศาสตร์ขนาดใหญ่ที่คล้ายกัน"}, {"id": 60, "dom": 4, "question": "Which ports range from 0 to 1023 and are used for common services in network communications?", "options": ["Dynamic ports", "Registered ports", "Well-known ports", "Virtual ports"], "correct_idx": 2, "explanation": "Well-known ports (0-1023) are reserved for standard, widely used network services like HTTP (80) and HTTPS (443).", "short_explanation_en": "Well-known ports (0-1023) are reserved for standard, widely used network services like HTTP (80) and HTTPS (443).", "question_th": "พอร์ตใดที่มีช่วงตั้งแต่ 0 ถึง 1023 และใช้สำหรับบริการทั่วไปในการสื่อสารเครือข่าย?", "options_th": ["Dynamic ports", "Registered ports", "Well-known ports", "Virtual ports"], "explanation_th": "Well-known ports (0-1023) ถูกสงวนไว้สำหรับบริการเครือข่ายมาตรฐานที่ใช้กันอย่างแพร่หลาย เช่น HTTP (80) และ HTTPS (443)"}, {"id": 61, "dom": 4, "question": "What is the main advantage of using fiber-optic cables in a wide-area network?", "options": ["Ability to connect devices within an individual’s workspace", "Wireless connectivity for local network access", "High-speed data transmission over long distances", "Cost-effectiveness for small to medium-sized networks"], "correct_idx": 2, "explanation": "Fiber-optic cable's main advantage in WANs is enabling very high-speed data transmission reliably over long distances.", "short_explanation_en": "Fiber-optic cable's main advantage in WANs is enabling very high-speed data transmission reliably over long distances.", "question_th": "ข้อได้เปรียบหลักของการใช้สายไฟเบอร์ออปติกใน wide-area network คืออะไร?", "options_th": ["ความสามารถในการเชื่อมต่ออุปกรณ์ภายในพื้นที่ทำงานของบุคคลคนเดียว", "การเชื่อมต่อไร้สายสำหรับการเข้าถึงเครือข่ายท้องถิ่น", "การส่งข้อมูลความเร็วสูงในระยะทางไกล", "ความคุ้มค่าสำหรับเครือข่ายขนาดเล็กถึงขนาดกลาง"], "explanation_th": "ข้อได้เปรียบหลักของสายไฟเบอร์ออปติกใน WAN คือการทำให้เกิดการส่งข้อมูลความเร็วสูงอย่างเชื่อถือได้ในระยะทางไกล"}, {"id": 62, "dom": 4, "question": "Which transport layer protocol ensures reliable, ordered, and error-checked data transfer?", "options": ["TCP", "UDP", "SMTP", "HTTP"], "correct_idx": 0, "explanation": "TCP (Transmission Control Protocol) guarantees reliable, ordered, and error-checked delivery of data between devices.", "short_explanation_en": "TCP (Transmission Control Protocol) guarantees reliable, ordered, and error-checked delivery of data between devices.", "question_th": "โปรโตคอลชั้น Transport ใดที่รับประกันการส่งข้อมูลที่เชื่อถือได้ เรียงลำดับ และตรวจสอบข้อผิดพลาด?", "options_th": ["TCP", "UDP", "SMTP", "HTTP"], "explanation_th": "TCP (Transmission Control Protocol) รับประกันการส่งข้อมูลที่เชื่อถือได้ เรียงลำดับ และตรวจสอบข้อผิดพลาดระหว่างอุปกรณ์"}, {"id": 63, "dom": 4, "question": "Which transport layer protocol is commonly used in multimedia applications that require real-time transmission and are prone to occasional packet loss?", "options": ["TCP", "UDP", "FTP", "SNMP"], "correct_idx": 1, "explanation": "UDP (User Datagram Protocol) favors speed over reliability, making it well-suited for real-time multimedia where occasional packet loss is tolerable.", "short_explanation_en": "UDP (User Datagram Protocol) favors speed over reliability, making it well-suited for real-time multimedia where occasional packet loss is tolerable.", "question_th": "โปรโตคอลชั้น Transport ใดที่มักใช้ในแอปพลิเคชันมัลติมีเดียที่ต้องการการส่งข้อมูลแบบเรียลไทม์และยอมรับการสูญเสียแพ็กเก็ตเป็นครั้งคราวได้?", "options_th": ["TCP", "UDP", "FTP", "SNMP"], "explanation_th": "UDP (User Datagram Protocol) ให้ความสำคัญกับความเร็วมากกว่าความน่าเชื่อถือ ทำให้เหมาะสมกับมัลติมีเดียแบบเรียลไทม์ที่สามารถทนต่อการสูญเสียแพ็กเก็ตเป็นครั้งคราวได้"}, {"id": 64, "dom": 4, "question": "Which layer in the OSI model is responsible for data delivery between networks?", "options": ["Physical layer", "Transport layer", "Network layer", "Application layer"], "correct_idx": 1, "explanation": "The Transport layer (Layer 4 of the OSI model) is responsible for reliable end-to-end data delivery between networked systems.", "short_explanation_en": "The Transport layer (Layer 4 of the OSI model) is responsible for reliable end-to-end data delivery between networked systems.", "question_th": "เลเยอร์ใดในโมเดล OSI ที่รับผิดชอบการส่งข้อมูลระหว่างเครือข่าย?", "options_th": ["Physical layer", "Transport layer", "Network layer", "Application layer"], "explanation_th": "Transport layer (Layer 4 ของโมเดล OSI) รับผิดชอบการส่งข้อมูลแบบ end-to-end ที่เชื่อถือได้ระหว่างระบบที่เชื่อมต่อเครือข่าย"}, {"id": 65, "dom": 4, "question": "Which technique is used to conserve IPv4 address space by assigning a single public IP address to a device within a network?", "options": ["NAT", "DHCP", "IPsec", "SNMP"], "correct_idx": 0, "explanation": "NAT (Network Address Translation) conserves scarce public IPv4 addresses by letting many internal devices share one public IP address.", "short_explanation_en": "NAT (Network Address Translation) conserves scarce public IPv4 addresses by letting many internal devices share one public IP address.", "question_th": "เทคนิคใดที่ใช้เพื่อประหยัดพื้นที่ IPv4 address โดยกำหนด public IP address เดียวให้กับอุปกรณ์ในเครือข่าย?", "options_th": ["NAT", "DHCP", "IPsec", "SNMP"], "explanation_th": "NAT (Network Address Translation) ประหยัด public IPv4 address ที่มีจำกัด โดยให้อุปกรณ์ภายในหลายเครื่องแชร์ public IP address เดียวกัน"}, {"id": 66, "dom": 4, "question": "Which sublayer of the data link layer is responsible for flow control and handles communication between the MAC and network layers?", "options": ["Logical Link Control (LLC)", "Media Access Control (MAC)", "Physical layer (PHY)", "Transport layer (TCP/UDP)"], "correct_idx": 0, "explanation": "The Logical Link Control (LLC) sublayer of the Data Link layer manages flow control and mediates communication between the MAC sublayer and the Network layer.", "short_explanation_en": "The Logical Link Control (LLC) sublayer of the Data Link layer manages flow control and mediates communication between the MAC sublayer and the Network layer.", "question_th": "sublayer ใดของ data link layer ที่รับผิดชอบการควบคุมการไหลของข้อมูลและจัดการการสื่อสารระหว่าง MAC layer กับ network layer?", "options_th": ["Logical Link Control (LLC)", "Media Access Control (MAC)", "Physical layer (PHY)", "Transport layer (TCP/UDP)"], "explanation_th": "Logical Link Control (LLC) sublayer ของ Data Link layer จัดการการควบคุมการไหลของข้อมูลและเป็นตัวกลางการสื่อสารระหว่าง MAC sublayer กับ Network layer"}, {"id": 67, "dom": 4, "question": "Which wireless encryption standard is considered obsolete?", "options": ["WPA", "WPA2", "WPA3", "WEP"], "correct_idx": 3, "explanation": "WEP (Wired Equivalent Privacy) has well-documented cryptographic weaknesses and is considered obsolete, having been replaced by WPA, WPA2, and WPA3.", "short_explanation_en": "WEP (Wired Equivalent Privacy) has well-documented cryptographic weaknesses and is considered obsolete, having been replaced by WPA, WPA2, and WPA3.", "question_th": "มาตรฐานการเข้ารหัสไร้สายใดที่ถือว่าล้าสมัยแล้ว?", "options_th": ["WPA", "WPA2", "WPA3", "WEP"], "explanation_th": "WEP (Wired Equivalent Privacy) มีจุดอ่อนด้านการเข้ารหัสที่เป็นที่รู้จักดี และถือว่าล้าสมัย โดยถูกแทนที่ด้วย WPA, WPA2 และ WPA3"}, {"id": 68, "dom": 4, "question": "Which layer in the TCP/IP model combines the physical and data link layers of the OSI model?", "options": ["Application layer", "Transport layer", "Internet layer", "Network access layer"], "correct_idx": 3, "explanation": "The TCP/IP model's Network Access layer combines the functions of the OSI model's Physical and Data Link layers.", "short_explanation_en": "The TCP/IP model's Network Access layer combines the functions of the OSI model's Physical and Data Link layers.", "question_th": "เลเยอร์ใดในโมเดล TCP/IP ที่รวมทั้ง physical layer และ data link layer ของโมเดล OSI เข้าด้วยกัน?", "options_th": ["Application layer", "Transport layer", "Internet layer", "Network access layer"], "explanation_th": "Network Access layer ของโมเดล TCP/IP รวมฟังก์ชันของ Physical layer และ Data Link layer ของโมเดล OSI เข้าด้วยกัน"}, {"id": 69, "dom": 4, "question": "Which type of fire suppression system is commonly used in data centers, industrial settings, or other locations where water or foam-based systems would damage sensitive equipment or materials?", "options": ["Sprinkler systems", "Gas-based systems", "Foam systems", "Wet and dry chemical systems"], "correct_idx": 1, "explanation": "Gas-based fire suppression systems are used in data centers and similar environments because they extinguish fires without damaging sensitive electronic equipment, unlike water or foam.", "short_explanation_en": "Gas-based fire suppression systems are used in data centers and similar environments because they extinguish fires without damaging sensitive electronic equipment, unlike water or foam.", "question_th": "ระบบดับเพลิงประเภทใดที่มักใช้ในศูนย์ข้อมูล สถานที่อุตสาหกรรม หรือสถานที่อื่นที่ระบบใช้น้ำหรือโฟมอาจสร้างความเสียหายต่ออุปกรณ์หรือวัสดุที่อ่อนไหว?", "options_th": ["ระบบสปริงเกอร์", "ระบบแบบใช้แก๊ส", "ระบบโฟม", "ระบบสารเคมีแบบเปียกและแห้ง"], "explanation_th": "ระบบดับเพลิงแบบใช้แก๊สถูกใช้ในศูนย์ข้อมูลและสภาพแวดล้อมที่คล้ายกัน เนื่องจากสามารถดับไฟได้โดยไม่สร้างความเสียหายต่ออุปกรณ์อิเล็กทรอนิกส์ที่อ่อนไหว ต่างจากระบบน้ำหรือโฟม"}, {"id": 70, "dom": 4, "question": "Which of the following is not a characteristic of a memorandum of understanding (MOU)?", "options": ["To establish a legally binding contract between parties", "To outline the intended actions and responsibilities of the parties involved", "To resolve disputes that may arise during a partnership or collaboration", "To specify the timeline and deliverables for completing tasks or achieving goals"], "correct_idx": 0, "explanation": "An MOU outlines intended actions, responsibilities, timelines, and dispute resolution between parties, but unlike a formal contract, it is generally not legally binding.", "short_explanation_en": "An MOU outlines intended actions, responsibilities, timelines, and dispute resolution between parties, but unlike a formal contract, it is generally not legally binding.", "question_th": "ข้อใดต่อไปนี้ไม่ใช่คุณลักษณะของ memorandum of understanding (MOU)?", "options_th": ["เพื่อสร้างสัญญาที่มีผลผูกพันทางกฎหมายระหว่างคู่สัญญา", "เพื่อระบุการกระทำและความรับผิดชอบที่ตั้งใจของคู่สัญญาที่เกี่ยวข้อง", "เพื่อแก้ไขข้อพิพาทที่อาจเกิดขึ้นระหว่างความร่วมมือหรือการทำงานร่วมกัน", "เพื่อระบุกรอบเวลาและผลงานส่งมอบสำหรับการทำงานให้เสร็จหรือบรรลุเป้าหมาย"], "explanation_th": "MOU ระบุการกระทำ ความรับผิดชอบ กรอบเวลา และการแก้ไขข้อพิพาทระหว่างคู่สัญญา แต่ต่างจากสัญญาที่เป็นทางการ โดยทั่วไปแล้ว MOU ไม่มีผลผูกพันทางกฎหมาย"}, {"id": 71, "dom": 4, "question": "Which security strategy involves implementing multiple layers of security measures, such as firewalls, intrusion detection/prevention systems, and endpoint protection, to provide comprehensive data protection and impede threat actors?", "options": ["Network segmentation", "Defense-in-depth", "Microsegmentation", "Virtual Private Networks"], "correct_idx": 1, "explanation": "Defense-in-depth layers multiple security measures (firewalls, IDS/IPS, endpoint protection, etc.) so that if one layer fails, others still provide protection.", "short_explanation_en": "Defense-in-depth layers multiple security measures (firewalls, IDS/IPS, endpoint protection, etc.) so that if one layer fails, others still provide protection.", "question_th": "กลยุทธ์ความปลอดภัยใดที่เกี่ยวข้องกับการนำมาตรการความปลอดภัยหลายชั้นมาใช้ เช่น ไฟร์วอลล์ ระบบตรวจจับ/ป้องกันการบุกรุก และการป้องกัน endpoint เพื่อให้การปกป้องข้อมูลอย่างครอบคลุมและขัดขวางผู้โจมตี?", "options_th": ["Network segmentation", "Defense-in-depth", "Microsegmentation", "Virtual Private Networks"], "explanation_th": "Defense-in-depth วางมาตรการความปลอดภัยหลายชั้น (ไฟร์วอลล์ IDS/IPS การป้องกัน endpoint ฯลฯ) เพื่อให้หากชั้นหนึ่งล้มเหลว ชั้นอื่นยังคงให้การป้องกันอยู่"}, {"id": 72, "dom": 4, "question": "Which network security technique provides enhanced protection by implementing security controls between workloads within a network", "options": ["Network segmentation", "Defense-in-depth", "Microsegmentation", "Virtual private networks"], "correct_idx": 2, "explanation": "Microsegmentation applies granular security controls between individual workloads within a network, offering more precise protection than broader network segmentation.", "short_explanation_en": "Microsegmentation applies granular security controls between individual workloads within a network, offering more precise protection than broader network segmentation.", "question_th": "เทคนิคความปลอดภัยเครือข่ายใดที่ให้การป้องกันที่เพิ่มขึ้นโดยนำการควบคุมความปลอดภัยมาใช้ระหว่าง workload ภายในเครือข่าย?", "options_th": ["Network segmentation", "Defense-in-depth", "Microsegmentation", "Virtual private networks"], "explanation_th": "Microsegmentation นำการควบคุมความปลอดภัยแบบละเอียดมาใช้ระหว่าง workload แต่ละอย่างภายในเครือข่าย ให้การป้องกันที่แม่นยำกว่าการแบ่งเครือข่ายแบบกว้าง (network segmentation)"}, {"id": 73, "dom": 4, "question": "What is the purpose of a demilitarized zone (DMZ)?", "options": ["To provide a logical division within a physical network", "To establish secure connections between multiple networks", "To act as a buffer zone between an organization’s internal network and the external network", "To ensure privacy and data protection for mobile users"], "correct_idx": 2, "explanation": "A DMZ acts as a buffer network zone that separates and protects an organization's internal network from direct exposure to the external/public network.", "short_explanation_en": "A DMZ acts as a buffer network zone that separates and protects an organization's internal network from direct exposure to the external/public network.", "question_th": "วัตถุประสงค์ของ demilitarized zone (DMZ) คืออะไร?", "options_th": ["เพื่อให้การแบ่งแยกทางตรรกะภายในเครือข่ายทางกายภาพ", "เพื่อสร้างการเชื่อมต่อที่ปลอดภัยระหว่างหลายเครือข่าย", "เพื่อทำหน้าที่เป็นเขตกันชนระหว่างเครือข่ายภายในขององค์กรกับเครือข่ายภายนอก", "เพื่อรับประกันความเป็นส่วนตัวและการปกป้องข้อมูลสำหรับผู้ใช้มือถือ"], "explanation_th": "DMZ ทำหน้าที่เป็นเขตเครือข่ายกันชนที่แยกและปกป้องเครือข่ายภายในขององค์กรจากการเปิดเผยโดยตรงต่อเครือข่ายภายนอก/สาธารณะ"}, {"id": 74, "dom": 4, "question": "What is the function of switches in implementing virtual local area networks?", "options": ["VLANs segment, manage, and control virtual networks.", "VLANs provide encryption for secure network connections.", "VLANs enforce security policies and controls for mobile devices.", "VLANs act as a buffer zone between an organization’s internal network and the external network."], "correct_idx": 0, "explanation": "VLANs (Virtual LANs), implemented via switches, logically segment, manage, and control traffic within virtual network groupings.", "short_explanation_en": "VLANs (Virtual LANs), implemented via switches, logically segment, manage, and control traffic within virtual network groupings.", "question_th": "หน้าที่ของสวิตช์ในการนำ virtual local area network มาใช้คืออะไร?", "options_th": ["VLAN แบ่งส่วน จัดการ และควบคุมเครือข่ายเสมือน", "VLAN ให้การเข้ารหัสสำหรับการเชื่อมต่อเครือข่ายที่ปลอดภัย", "VLAN บังคับใช้นโยบายความปลอดภัยและการควบคุมสำหรับอุปกรณ์มือถือ", "VLAN ทำหน้าที่เป็นเขตกันชนระหว่างเครือข่ายภายในขององค์กรกับเครือข่ายภายนอก"], "explanation_th": "VLAN (Virtual LAN) ที่นำมาใช้ผ่านสวิตช์ แบ่งส่วนทางตรรกะ จัดการ และควบคุมทราฟฟิกภายในกลุ่มเครือข่ายเสมือน"}, {"id": 75, "dom": 4, "question": "What is the difference between the public cloud and a private cloud?", "options": ["The public cloud is more secure than a private cloud.", "Unlike the public cloud, a private cloud is only accessible through the Internet.", "A private cloud is deployed for a specific organization and allows for tailored hardware and software.", "A public cloud allows for greater control and flexibility over assets."], "correct_idx": 2, "explanation": "A private cloud is dedicated to a single organization, allowing it to tailor the underlying hardware and software to its specific needs, unlike the shared public cloud.", "short_explanation_en": "A private cloud is dedicated to a single organization, allowing it to tailor the underlying hardware and software to its specific needs, unlike the shared public cloud.", "question_th": "ความแตกต่างระหว่าง public cloud กับ private cloud คืออะไร?", "options_th": ["Public cloud ปลอดภัยกว่า private cloud", "Private cloud เข้าถึงได้เฉพาะผ่านอินเทอร์เน็ตเท่านั้น ต่างจาก public cloud", "Private cloud ถูกปรับใช้สำหรับองค์กรเฉพาะ และสามารถปรับแต่งฮาร์ดแวร์และซอฟต์แวร์ได้", "Public cloud ให้การควบคุมและความยืดหยุ่นต่อทรัพย์สินมากกว่า"], "explanation_th": "Private cloud ถูกอุทิศให้กับองค์กรเดียว ทำให้สามารถปรับแต่งฮาร์ดแวร์และซอฟต์แวร์พื้นฐานให้เหมาะกับความต้องการเฉพาะได้ ต่างจาก public cloud ที่ใช้ร่วมกัน"}, {"id": 76, "dom": 4, "question": "Which cloud deployment model offers a collaborative, secure, costeffective solution for organizations with shared needs?", "options": ["Public cloud", "Private cloud", "Hybrid cloud", "Community cloud"], "correct_idx": 3, "explanation": "A community cloud is shared by organizations with common needs (e.g., compliance requirements), offering a collaborative yet more secure and cost-effective option than a fully public cloud.", "short_explanation_en": "A community cloud is shared by organizations with common needs (e.g., compliance requirements), offering a collaborative yet more secure and cost-effective option than a fully public cloud.", "question_th": "โมเดลการปรับใช้คลาวด์ใดที่นำเสนอโซลูชันแบบร่วมมือ ปลอดภัย และคุ้มค่าสำหรับองค์กรที่มีความต้องการร่วมกัน?", "options_th": ["Public cloud", "Private cloud", "Hybrid cloud", "Community cloud"], "explanation_th": "Community cloud ถูกใช้ร่วมกันโดยองค์กรที่มีความต้องการร่วมกัน (เช่น ข้อกำหนดด้านการปฏิบัติตามกฎระเบียบ) นำเสนอตัวเลือกที่ร่วมมือกันได้ ปลอดภัย และคุ้มค่ากว่า public cloud เต็มรูปแบบ"}, {"id": 77, "dom": 4, "question": "In which cloud service model is the CSP responsible for providing virtualized resources and services that can be accessed over the Internet, allowing organizations to free themselves from purchasing expensive hardware?", "options": ["IaaS", "PaaS", "SaaS", "None of these answers are correct."], "correct_idx": 0, "explanation": "In IaaS (Infrastructure as a Service), the cloud provider supplies virtualized computing resources over the internet, letting organizations avoid purchasing physical hardware.", "short_explanation_en": "In IaaS (Infrastructure as a Service), the cloud provider supplies virtualized computing resources over the internet, letting organizations avoid purchasing physical hardware.", "question_th": "ในโมเดลบริการคลาวด์ใดที่ CSP รับผิดชอบในการจัดหาทรัพยากรและบริการเสมือนที่สามารถเข้าถึงได้ผ่านอินเทอร์เน็ต ทำให้องค์กรไม่ต้องซื้อฮาร์ดแวร์ราคาแพง?", "options_th": ["IaaS", "PaaS", "SaaS", "ไม่มีข้อใดถูกต้อง"], "explanation_th": "ใน IaaS (Infrastructure as a Service) ผู้ให้บริการคลาวด์จัดหาทรัพยากรคอมพิวเตอร์เสมือนผ่านอินเทอร์เน็ต ทำให้องค์กรไม่ต้องซื้อฮาร์ดแวร์ทางกายภาพ"}, {"id": 78, "dom": 4, "question": "In which cloud service model is the CSP responsible for maintaining and updating all the components necessary to run the application, while the organization is only responsible for how the application will be used and who needs access?", "options": ["IaaS", "PaaS", "SaaS", "None of these answers are correct"], "correct_idx": 2, "explanation": "In SaaS (Software as a Service), the provider manages and maintains the entire application, while the customer organization only controls how it's used and who has access.", "short_explanation_en": "In SaaS (Software as a Service), the provider manages and maintains the entire application, while the customer organization only controls how it's used and who has access.", "question_th": "ในโมเดลบริการคลาวด์ใดที่ CSP รับผิดชอบในการดูแลรักษาและอัปเดตองค์ประกอบทั้งหมดที่จำเป็นในการรันแอปพลิเคชัน ในขณะที่องค์กรรับผิดชอบเพียงวิธีการใช้แอปพลิเคชันและใครต้องการการเข้าถึง?", "options_th": ["IaaS", "PaaS", "SaaS", "ไม่มีข้อใดถูกต้อง"], "explanation_th": "ใน SaaS (Software as a Service) ผู้ให้บริการจัดการและดูแลรักษาแอปพลิเคชันทั้งหมด ในขณะที่องค์กรลูกค้าควบคุมเพียงวิธีการใช้งานและใครมีสิทธิ์เข้าถึง"}, {"id": 79, "dom": 4, "question": "Which type of SLA allows customers to select different levels of service based on their requirements and budget?", "options": ["Customer SLA", "Internal SLA", "Multilevel SLA", "Managed service provider SLA"], "correct_idx": 2, "explanation": "A multilevel SLA lets customers choose among different tiers of service based on their specific needs and budget.", "short_explanation_en": "A multilevel SLA lets customers choose among different tiers of service based on their specific needs and budget.", "question_th": "SLA ประเภทใดที่ให้ลูกค้าเลือกระดับบริการที่แตกต่างกันตามความต้องการและงบประมาณของตน?", "options_th": ["Customer SLA", "Internal SLA", "Multilevel SLA", "Managed service provider SLA"], "explanation_th": "Multilevel SLA ให้ลูกค้าเลือกระหว่างระดับบริการที่แตกต่างกันตามความต้องการและงบประมาณเฉพาะของตน"}, {"id": 80, "dom": 4, "question": "What is the purpose of a managed service provider?", "options": ["To provide security services to organizations", "To monitor customers’ environment for issues and concerns", "To provide business continuity solutions", "All of these answers are correct."], "correct_idx": 3, "explanation": "A Managed Service Provider can offer security services, ongoing environment monitoring, and business continuity support - all of these are typical MSP functions.", "short_explanation_en": "A Managed Service Provider can offer security services, ongoing environment monitoring, and business continuity support - all of these are typical MSP functions.", "question_th": "วัตถุประสงค์ของ managed service provider คืออะไร?", "options_th": ["เพื่อให้บริการความปลอดภัยแก่องค์กร", "เพื่อเฝ้าติดตามสภาพแวดล้อมของลูกค้าเพื่อหาปัญหาและข้อกังวล", "เพื่อให้โซลูชันความต่อเนื่องทางธุรกิจ", "ถูกทุกข้อ"], "explanation_th": "Managed Service Provider สามารถให้บริการความปลอดภัย เฝ้าติดตามสภาพแวดล้อมอย่างต่อเนื่อง และสนับสนุนความต่อเนื่องทางธุรกิจ - ล้วนเป็นหน้าที่ทั่วไปของ MSP"}, {"id": 81, "dom": 5, "question": "What is data security?", "options": ["Protecting data from being not being altered or disclosed", "The strategic use of encryption, authentication, and data handling", "A synonym for information security", "None of these answers are correct."], "correct_idx": 1, "explanation": "Data security is the strategic application of encryption, authentication, and proper data handling practices to protect information.", "short_explanation_en": "Data security is the strategic application of encryption, authentication, and proper data handling practices to protect information.", "question_th": "ความปลอดภัยของข้อมูล (Data Security) คืออะไร?", "options_th": ["การปกป้องข้อมูลจากการไม่ถูกแก้ไขหรือเปิดเผย", "การใช้กลยุทธ์ผสมผสานระหว่างการเข้ารหัส การยืนยันตัวตน และการจัดการข้อมูล", "คำพ้องความหมายกับ Information Security", "ไม่มีข้อใดถูกต้อง"], "explanation_th": "Data Security คือการประยุกต์ใช้กลยุทธ์การเข้ารหัส การยืนยันตัวตน (authentication) และแนวปฏิบัติการจัดการข้อมูลที่เหมาะสม เพื่อปกป้องข้อมูล ซึ่งมีความหมายเฉพาะเจาะจงกว่า Information Security ที่ครอบคลุมกว้างกว่านี้"}, {"id": 82, "dom": 5, "question": "What are the parts of a cryptographic algorithm?", "options": ["Fancy words, magic, numbers", "Key, ciphertext, key generator", "Coded text, random numbers, random number maker", "Key, ciphertext, plaintext"], "correct_idx": 1, "explanation": "A cryptographic algorithm's core components are the key, the resulting ciphertext, and the key generator that produces the key.", "short_explanation_en": "A cryptographic algorithm's core components are the key, the resulting ciphertext, and the key generator that produces the key.", "question_th": "องค์ประกอบของอัลกอริทึมการเข้ารหัส (Cryptographic Algorithm) คืออะไร?", "options_th": ["คำสวยหรู เวทมนตร์ ตัวเลข", "กุญแจ (key), ข้อความเข้ารหัส (ciphertext), ตัวสร้างกุญแจ (key generator)", "ข้อความรหัส ตัวเลขสุ่ม เครื่องสร้างตัวเลขสุ่ม", "กุญแจ ข้อความเข้ารหัส ข้อความต้นฉบับ (plaintext)"], "explanation_th": "องค์ประกอบหลักของอัลกอริทึมการเข้ารหัสคือ กุญแจ (key) ข้อความเข้ารหัสที่ได้ (ciphertext) และตัวสร้างกุญแจ (key generator) ที่ผลิตกุญแจนั้นขึ้นมา"}, {"id": 83, "dom": 5, "question": "What is the difference between symmetric and asymmetric encryption?", "options": ["Symmetric encryption has different keys for encryption and decryption.", "Asymmetric encryption has the same key for encryption and decryption.", "The difference is the symmetry of the numbers used in the algorithms.", "None of these answers are correct."], "correct_idx": 3, "explanation": "Symmetric encryption uses the same key for both encryption and decryption, while asymmetric encryption uses a different key for each (public/private key pair) - the listed options describing them backwards are both wrong.", "short_explanation_en": "Symmetric encryption uses the same key for both encryption and decryption, while asymmetric encryption uses a different key for each (public/private key pair) - the listed options describing them backwards are both wrong.", "question_th": "ความแตกต่างระหว่าง Symmetric encryption และ Asymmetric encryption คืออะไร?", "options_th": ["Symmetric encryption มีกุญแจต่างกันสำหรับเข้ารหัสและถอดรหัส", "Asymmetric encryption มีกุญแจเดียวกันสำหรับเข้ารหัสและถอดรหัส", "ความแตกต่างคือความสมมาตรของตัวเลขที่ใช้ในอัลกอริทึม", "ไม่มีข้อใดถูกต้อง"], "explanation_th": "Symmetric encryption ใช้กุญแจเดียวกันทั้งเข้ารหัสและถอดรหัส ส่วน Asymmetric encryption ใช้กุญแจต่างกันสำหรับแต่ละฟังก์ชัน (คู่กุญแจ public/private) ซึ่งตรงข้ามกับตัวเลือก A และ B ที่อธิบายผิด ดังนั้นไม่มีข้อใดถูกต้อง"}, {"id": 84, "dom": 5, "question": "What are some types of cryptographic protocols, and what are they used for?", "options": ["AES-256; storage and transit", "RSA and the Diffie-Helman Key Exchange; transit", "TLS; transit", "All of these answers are correct."], "correct_idx": 3, "explanation": "AES-256 is used for encrypting data at rest and in transit; RSA and Diffie-Hellman handle key exchange; TLS secures data in transit - all are valid cryptographic protocols/algorithms used for different purposes.", "short_explanation_en": "AES-256 is used for encrypting data at rest and in transit; RSA and Diffie-Hellman handle key exchange; TLS secures data in transit - all are valid cryptographic protocols/algorithms used for different purposes.", "question_th": "โปรโตคอลการเข้ารหัสมีประเภทใดบ้าง และใช้เพื่ออะไร?", "options_th": ["AES-256; การจัดเก็บและการส่งข้อมูล", "RSA และ Diffie-Helman Key Exchange; การส่งข้อมูล", "TLS; การส่งข้อมูล", "ถูกทุกข้อ"], "explanation_th": "AES-256 ใช้เข้ารหัสข้อมูลทั้งขณะจัดเก็บและขณะส่งผ่าน RSA และ Diffie-Hellman ใช้สำหรับการแลกเปลี่ยนกุญแจ (key exchange) และ TLS ใช้ปกป้องข้อมูลขณะส่งผ่าน ทั้งหมดล้วนเป็นโปรโตคอล/อัลกอริทึมการเข้ารหัสที่ใช้ในวัตถุประสงค์ต่างกัน"}, {"id": 85, "dom": 5, "question": "What are the two primary qualities of hashes?", "options": ["Can encrypt text in a pinch and cannot be hacked", "Excellent for breakfast and for snacks", "Irreversible but can be reverse-engineered", "Can encrypt text in a pinch but don’t use random numbers"], "correct_idx": 2, "explanation": "Hash functions are designed to be irreversible (one-way), though certain weak hashes can sometimes be cracked via techniques like rainbow tables - hence 'irreversible but can be reverse-engineered' in practice.", "short_explanation_en": "Hash functions are designed to be irreversible (one-way), though certain weak hashes can sometimes be cracked via techniques like rainbow tables - hence 'irreversible but can be reverse-engineered' in practice.", "question_th": "คุณสมบัติหลักสองประการของ hash คืออะไร?", "options_th": ["สามารถเข้ารหัสข้อความได้ในกรณีฉุกเฉินและไม่สามารถถูกแฮกได้", "เหมาะสำหรับมื้อเช้าและของว่าง", "ไม่สามารถย้อนกลับได้ แต่สามารถถูกวิศวกรรมย้อนกลับได้", "สามารถเข้ารหัสข้อความได้ในกรณีฉุกเฉินแต่ไม่ใช้ตัวเลขสุ่ม"], "explanation_th": "ฟังก์ชันแฮชถูกออกแบบให้ไม่สามารถย้อนกลับได้ (one-way) แม้ว่าแฮชบางประเภทที่อ่อนแออาจถูกถอดรหัสได้ด้วยเทคนิคอย่าง rainbow table จึงอธิบายได้ว่า 'ไม่สามารถย้อนกลับได้ แต่สามารถถูกวิศวกรรมย้อนกลับได้' ในทางปฏิบัติ"}, {"id": 86, "dom": 5, "question": "What is non-repudiation?", "options": ["A way to ensure that a person can’t deny having taken an action, such as a digital signature", "A form of encryption", "A pillar of the CIA triad that we just forgot about", "A grammatical curiosity"], "correct_idx": 0, "explanation": "Non-repudiation ensures a person cannot later deny having performed an action, such as sending a message - digital signatures are a common mechanism for this.", "short_explanation_en": "Non-repudiation ensures a person cannot later deny having performed an action, such as sending a message - digital signatures are a common mechanism for this.", "question_th": "Non-repudiation คืออะไร?", "options_th": ["วิธีการรับประกันว่าบุคคลไม่สามารถปฏิเสธการกระทำของตนได้ เช่น ลายเซ็นดิจิทัล", "รูปแบบหนึ่งของการเข้ารหัส", "เสาหลักหนึ่งของ CIA triad ที่เราลืมไป", "ความประหลาดทางไวยากรณ์"], "explanation_th": "Non-repudiation คือการรับประกันว่าบุคคลไม่สามารถปฏิเสธในภายหลังว่าตนไม่ได้กระทำการบางอย่าง เช่น การส่งข้อความ โดยลายเซ็นดิจิทัลเป็นกลไกที่ใช้บ่อยเพื่อรับประกันคุณสมบัตินี้"}, {"id": 87, "dom": 5, "question": "What is authentication?", "options": ["The practice of determining the accuracy of data before use", "The process of checking identity before granting access", "A method to ensure data integrity during transmission", "There are various models, so all of the answers are correct"], "correct_idx": 1, "explanation": "Authentication is the process of verifying a user's claimed identity before granting them access to a system or resource.", "short_explanation_en": "Authentication is the process of verifying a user's claimed identity before granting them access to a system or resource.", "question_th": "Authentication คืออะไร?", "options_th": ["แนวปฏิบัติในการตรวจสอบความถูกต้องของข้อมูลก่อนใช้งาน", "กระบวนการตรวจสอบตัวตนก่อนอนุญาตให้เข้าถึง", "วิธีการรับประกันความถูกต้องของข้อมูลระหว่างการส่ง", "มีหลายโมเดล ดังนั้นถูกทุกข้อ"], "explanation_th": "Authentication คือกระบวนการตรวจสอบตัวตนที่ผู้ใช้อ้างสิทธิ์ ก่อนที่จะอนุญาตให้เข้าถึงระบบหรือทรัพยากร"}, {"id": 88, "dom": 5, "question": "How many factors of authentication are there, and how many should be used at a minimum in a secure system configuration?", "options": ["Two; two", "Five; any one will do, as these are stronger than passwords", "Five; two", "Four; three"], "correct_idx": 2, "explanation": "There are five recognized authentication factor categories (knowledge, possession, inherence, location, behavior), and best practice requires at least two of them for strong authentication (MFA).", "short_explanation_en": "There are five recognized authentication factor categories (knowledge, possession, inherence, location, behavior), and best practice requires at least two of them for strong authentication (MFA).", "question_th": "มีปัจจัยการยืนยันตัวตน (Authentication) กี่ประเภท และควรใช้ขั้นต่ำกี่ประเภทในระบบที่ปลอดภัย?", "options_th": ["สอง; สอง", "ห้า; ใช้เพียงหนึ่งก็เพียงพอ เพราะแข็งแกร่งกว่ารหัสผ่านอยู่แล้ว", "ห้า; สอง", "สี่; สาม"], "explanation_th": "มีปัจจัยการยืนยันตัวตนที่ได้รับการยอมรับ 5 ประเภท (ความรู้ การครอบครอง ลักษณะเฉพาะตัว ตำแหน่งที่ตั้ง พฤติกรรม) และแนวปฏิบัติที่ดีกำหนดให้ใช้อย่างน้อย 2 ประเภทร่วมกันเพื่อการยืนยันตัวตนที่แข็งแกร่ง (MFA)"}, {"id": 89, "dom": 5, "question": "Why is authentication so critical?", "options": ["It ensures that only authorized users gain access.", "It is a system’s first line of defense.", "Without properly verifying identity, anyone could gain access to a system.", "All of these answers are correct."], "correct_idx": 3, "explanation": "Authentication is critical because it's a system's first line of defense - without verifying identity, anyone could access resources meant to be restricted to authorized users.", "short_explanation_en": "Authentication is critical because it's a system's first line of defense - without verifying identity, anyone could access resources meant to be restricted to authorized users.", "question_th": "เหตุใด Authentication จึงมีความสำคัญอย่างยิ่ง?", "options_th": ["รับประกันว่ามีเพียงผู้ใช้ที่ได้รับอนุญาตเท่านั้นที่เข้าถึงได้", "เป็นแนวป้องกันด่านแรกของระบบ", "หากไม่มีการยืนยันตัวตนที่เหมาะสม ใครก็สามารถเข้าถึงระบบได้", "ถูกทุกข้อ"], "explanation_th": "Authentication สำคัญเพราะเป็นแนวป้องกันด่านแรกของระบบ หากไม่มีการยืนยันตัวตนที่ถูกต้อง ใครก็สามารถเข้าถึงทรัพยากรที่ควรจำกัดเฉพาะผู้ใช้ที่ได้รับอนุญาตเท่านั้น"}, {"id": 90, "dom": 5, "question": "What is not part of implementing a strong password policy?", "options": ["Monitoring for compromised passwords", "Changing one number or character when it’s time to change passwords", "Requiring longer passwords", "Making users change their passwords every 15 days"], "correct_idx": 1, "explanation": "A strong password policy avoids minor predictable tweaks (like changing just one character); it instead should emphasize length, monitoring for compromise, and reasonable rotation - not overly frequent forced changes.", "short_explanation_en": "A strong password policy avoids minor predictable tweaks (like changing just one character); it instead should emphasize length, monitoring for compromise, and reasonable rotation - not overly frequent forced changes.", "question_th": "ข้อใดไม่ใช่ส่วนหนึ่งของการนำนโยบายรหัสผ่านที่แข็งแกร่งมาใช้?", "options_th": ["การตรวจสอบรหัสผ่านที่ถูกบุกรุก", "การเปลี่ยนตัวเลขหรืออักขระเพียงตัวเดียวเมื่อถึงเวลาเปลี่ยนรหัสผ่าน", "การกำหนดให้ใช้รหัสผ่านที่ยาวขึ้น", "การบังคับให้ผู้ใช้เปลี่ยนรหัสผ่านทุก 15 วัน"], "explanation_th": "นโยบายรหัสผ่านที่แข็งแกร่งควรหลีกเลี่ยงการเปลี่ยนแปลงเล็กน้อยที่คาดเดาได้ง่าย (เช่น เปลี่ยนแค่ตัวอักษรเดียว) และควรเน้นที่ความยาวของรหัสผ่าน การตรวจสอบการรั่วไหล และการเปลี่ยนรหัสผ่านตามความเหมาะสม ไม่ใช่บังคับเปลี่ยนบ่อยเกินไป"}, {"id": 91, "dom": 5, "question": "What are the four components of data handling?", "options": ["Classification, labeling, retention, destruction", "Classification, tagging, retention, destruction", "Classification, labeling, destruction, disposal", "Classification, retention, encryption, networking"], "correct_idx": 0, "explanation": "Data handling consists of four key components: classification (categorizing sensitivity), labeling, retention, and destruction.", "short_explanation_en": "Data handling consists of four key components: classification (categorizing sensitivity), labeling, retention, and destruction.", "question_th": "องค์ประกอบสี่ประการของการจัดการข้อมูล (Data Handling) คืออะไร?", "options_th": ["การจัดประเภท การติดป้าย การเก็บรักษา การทำลาย", "การจัดประเภท การแท็ก การเก็บรักษา การทำลาย", "การจัดประเภท การติดป้าย การทำลาย การกำจัด", "การจัดประเภท การเก็บรักษา การเข้ารหัส เครือข่าย"], "explanation_th": "การจัดการข้อมูลประกอบด้วยองค์ประกอบหลัก 4 ประการ: การจัดประเภท (classification) ตามความอ่อนไหวของข้อมูล การติดป้าย (labeling) การเก็บรักษา (retention) และการทำลาย (destruction)"}, {"id": 92, "dom": 5, "question": "What is the correct way to implement data classification?", "options": ["Implement classifications based on each organization’s needs and data inventory.", "There are four categories one should always implement: Public, Confidential, Secret, and Top Secret.", "The analyst should copy the categories of the company they most admire.", "There are three categories one should always implement: Public, Confidential, and Secret."], "correct_idx": 0, "explanation": "Effective data classification should be tailored to each organization's specific needs and data inventory rather than following a rigid, universal category scheme.", "short_explanation_en": "Effective data classification should be tailored to each organization's specific needs and data inventory rather than following a rigid, universal category scheme.", "question_th": "วิธีที่ถูกต้องในการนำการจัดประเภทข้อมูล (Data Classification) มาใช้คืออะไร?", "options_th": ["นำการจัดประเภทมาใช้ตามความต้องการและคลังข้อมูลของแต่ละองค์กร", "ควรใช้ 4 ประเภทเสมอ: Public, Confidential, Secret, Top Secret", "นักวิเคราะห์ควรคัดลอกประเภทจากบริษัทที่ตนชื่นชอบ", "ควรใช้ 3 ประเภทเสมอ: Public, Confidential, Secret"], "explanation_th": "การจัดประเภทข้อมูลที่มีประสิทธิภาพควรออกแบบให้เหมาะกับความต้องการและคลังข้อมูลเฉพาะของแต่ละองค์กร มากกว่าการยึดตามแบบแผนประเภทข้อมูลที่ตายตัว"}, {"id": 93, "dom": 5, "question": "What is the objective of data handling?", "options": ["To conserve resources for the data that actually needs protection", "To prevent unauthorized disclosures and leaks", "To ensure that passwords are secure", "To protect all the data"], "correct_idx": 0, "explanation": "Data handling exists to focus protective resources on the data that actually needs them, rather than treating all data equally regardless of sensitivity.", "short_explanation_en": "Data handling exists to focus protective resources on the data that actually needs them, rather than treating all data equally regardless of sensitivity.", "question_th": "วัตถุประสงค์ของการจัดการข้อมูล (Data Handling) คืออะไร?", "options_th": ["เพื่อประหยัดทรัพยากรสำหรับข้อมูลที่ต้องการการป้องกันจริง ๆ", "เพื่อป้องกันการเปิดเผยและรั่วไหลโดยไม่ได้รับอนุญาต", "เพื่อรับประกันว่ารหัสผ่านมีความปลอดภัย", "เพื่อปกป้องข้อมูลทั้งหมด"], "explanation_th": "การจัดการข้อมูลมีขึ้นเพื่อมุ่งทรัพยากรการป้องกันไปยังข้อมูลที่ต้องการจริง ๆ แทนที่จะปฏิบัติต่อข้อมูลทั้งหมดเท่าเทียมกันโดยไม่คำนึงถึงความอ่อนไหว"}, {"id": 94, "dom": 5, "question": "What is system hardening?", "options": ["A process intended to eliminate a means of attack by patching vulnerabilities and turning off nonessential services", "Getting a baseline in place", "Blocking some ports and installing a few patches", "The implementation of controls to prevent the unauthorized access to and disclosure of data"], "correct_idx": 0, "explanation": "System hardening reduces attack surface by patching known vulnerabilities and disabling unnecessary services, eliminating potential means of attack.", "short_explanation_en": "System hardening reduces attack surface by patching known vulnerabilities and disabling unnecessary services, eliminating potential means of attack.", "question_th": "System hardening คืออะไร?", "options_th": ["กระบวนการที่มุ่งขจัดช่องทางการโจมตีด้วยการแพตช์ช่องโหว่และปิดบริการที่ไม่จำเป็น", "การจัดทำ baseline ให้พร้อมใช้งาน", "การบล็อกพอร์ตบางส่วนและติดตั้งแพตช์บางตัว", "การนำมาตรการควบคุมมาใช้เพื่อป้องกันการเข้าถึงและเปิดเผยข้อมูลโดยไม่ได้รับอนุญาต"], "explanation_th": "System hardening ลดพื้นผิวการโจมตีด้วยการแพตช์ช่องโหว่ที่ทราบและปิดบริการที่ไม่จำเป็น เพื่อขจัดช่องทางที่อาจถูกใช้โจมตี"}, {"id": 95, "dom": 5, "question": "What is a baseline?", "options": ["A framework such as NIST SP 800", "Technical and security specifications for implementing the system", "A way to build a server", "The idealized state at which security professionals strive to keep the system"], "correct_idx": 1, "explanation": "A baseline defines the technical and security configuration specifications a system should be set up and maintained against.", "short_explanation_en": "A baseline defines the technical and security configuration specifications a system should be set up and maintained against.", "question_th": "Baseline คืออะไร?", "options_th": ["กรอบการทำงาน เช่น NIST SP 800", "ข้อกำหนดทางเทคนิคและความปลอดภัยสำหรับการติดตั้งระบบ", "วิธีการสร้างเซิร์ฟเวอร์", "สถานะในอุดมคติที่ผู้เชี่ยวชาญความปลอดภัยมุ่งรักษาระบบให้อยู่"], "explanation_th": "Baseline กำหนดข้อกำหนดทางเทคนิคและความปลอดภัยของการตั้งค่าที่ระบบควรถูกติดตั้งและรักษาไว้ตาม"}, {"id": 96, "dom": 5, "question": "What is patch management?", "options": ["A bandage for software", "A form of risk management", "The implementation of new systems when older ones reach the end of their lives", "The implementation of vendor fixes to remediate vulnerabilities and software issues"], "correct_idx": 3, "explanation": "Patch management is the process of applying vendor-released fixes to remediate known vulnerabilities and software issues.", "short_explanation_en": "Patch management is the process of applying vendor-released fixes to remediate known vulnerabilities and software issues.", "question_th": "Patch management คืออะไร?", "options_th": ["พลาสเตอร์ปิดแผลสำหรับซอฟต์แวร์", "รูปแบบหนึ่งของการบริหารความเสี่ยง", "การนำระบบใหม่มาใช้เมื่อระบบเก่าหมดอายุการใช้งาน", "การนำการแก้ไขจากผู้จำหน่ายมาใช้เพื่อแก้ไขช่องโหว่และปัญหาซอฟต์แวร์"], "explanation_th": "Patch management คือกระบวนการนำการแก้ไข (fixes) ที่ผู้จำหน่ายปล่อยออกมาใช้ เพื่อแก้ไขช่องโหว่และปัญหาซอฟต์แวร์ที่ทราบแล้ว"}, {"id": 97, "dom": 5, "question": "What are system updates and upgrades?", "options": ["Optimizing systems to run better and replacing them when the next version is available", "A grander version of patches", "Updates to specific vulnerabilities in a system", "None of these answers are correct."], "correct_idx": 0, "explanation": "System updates and upgrades optimize performance and replace outdated systems with newer versions when available, going beyond just patching individual vulnerabilities.", "short_explanation_en": "System updates and upgrades optimize performance and replace outdated systems with newer versions when available, going beyond just patching individual vulnerabilities.", "question_th": "การอัปเดตและอัปเกรดระบบ (System updates and upgrades) คืออะไร?", "options_th": ["การปรับปรุงประสิทธิภาพระบบและเปลี่ยนเป็นเวอร์ชันใหม่เมื่อมีให้ใช้งาน", "เวอร์ชันที่ใหญ่กว่าของแพตช์", "การอัปเดตช่องโหว่เฉพาะในระบบ", "ไม่มีข้อใดถูกต้อง"], "explanation_th": "การอัปเดตและอัปเกรดระบบช่วยปรับปรุงประสิทธิภาพและแทนที่ระบบเก่าด้วยเวอร์ชันใหม่เมื่อมีให้ใช้งาน ซึ่งกว้างกว่าการแพตช์ช่องโหว่เพียงจุดเดียว"}, {"id": 98, "dom": 5, "question": "What are logs?", "options": ["Implementation information for a system", "A system to forward records", "Records about the status of key components of an IT infrastructure", "Application code"], "correct_idx": 2, "explanation": "Logs are records that capture the status, activity, and events of key IT infrastructure components over time.", "short_explanation_en": "Logs are records that capture the status, activity, and events of key IT infrastructure components over time.", "question_th": "Logs คืออะไร?", "options_th": ["ข้อมูลการติดตั้งของระบบ", "ระบบสำหรับส่งต่อบันทึก", "บันทึกเกี่ยวกับสถานะขององค์ประกอบสำคัญของโครงสร้างพื้นฐาน IT", "โค้ดของแอปพลิเคชัน"], "explanation_th": "Logs คือบันทึกที่เก็บสถานะ กิจกรรม และเหตุการณ์ขององค์ประกอบสำคัญของโครงสร้างพื้นฐาน IT ตลอดช่วงเวลา"}, {"id": 99, "dom": 5, "question": "Which of the following does an Acceptable Use Policy usually not cover?", "options": ["What sort of smartphone to buy for personal use", "How to store documents", "Whether USBs can be used and how", "All the ways users might interact with technology"], "correct_idx": 0, "explanation": "An Acceptable Use Policy governs how technology and company resources should be used (documents, USBs, general conduct) - it wouldn't typically dictate personal purchasing decisions like which smartphone to buy.", "short_explanation_en": "An Acceptable Use Policy governs how technology and company resources should be used (documents, USBs, general conduct) - it wouldn't typically dictate personal purchasing decisions like which smartphone to buy.", "question_th": "ข้อใดที่นโยบาย Acceptable Use Policy มักไม่ครอบคลุม?", "options_th": ["ควรซื้อสมาร์ทโฟนรุ่นใดสำหรับใช้งานส่วนตัว", "วิธีจัดเก็บเอกสาร", "การใช้ USB ได้หรือไม่และอย่างไร", "วิธีที่ผู้ใช้อาจมีปฏิสัมพันธ์กับเทคโนโลยีทั้งหมด"], "explanation_th": "Acceptable Use Policy กำกับดูแลวิธีการใช้เทคโนโลยีและทรัพยากรของบริษัท (เอกสาร USB และพฤติกรรมทั่วไป) แต่โดยทั่วไปจะไม่กำหนดการตัดสินใจซื้อส่วนตัว เช่น สมาร์ทโฟนรุ่นใด"}, {"id": 100, "dom": 5, "question": "Which of the following does a bring your own device policy usually cover?", "options": ["How to use company-owned devices", "Step-by-step instructions for setting up corporate email", "What employees must to do to secure their personal devices", "Which pictures employees shouldn’t delete"], "correct_idx": 2, "explanation": "A BYOD (Bring Your Own Device) policy defines what employees must do to secure their personal devices when using them for work purposes.", "short_explanation_en": "A BYOD (Bring Your Own Device) policy defines what employees must do to secure their personal devices when using them for work purposes.", "question_th": "นโยบาย Bring Your Own Device มักครอบคลุมข้อใด?", "options_th": ["วิธีใช้อุปกรณ์ที่บริษัทเป็นเจ้าของ", "ขั้นตอนตั้งค่าอีเมลของบริษัททีละขั้นตอน", "สิ่งที่พนักงานต้องทำเพื่อรักษาความปลอดภัยอุปกรณ์ส่วนตัวของตน", "รูปภาพใดที่พนักงานไม่ควรลบ"], "explanation_th": "นโยบาย BYOD (Bring Your Own Device) กำหนดสิ่งที่พนักงานต้องทำเพื่อรักษาความปลอดภัยอุปกรณ์ส่วนตัว เมื่อนำมาใช้เพื่อวัตถุประสงค์ในการทำงาน"}, {"id": 101, "dom": 5, "question": "Who is a privacy policy intended to be written for?", "options": ["The government", "Customers", "Employees", "Lawyers"], "correct_idx": 1, "explanation": "A privacy policy is primarily written for customers, explaining how their personal data will be collected, used, and protected.", "short_explanation_en": "A privacy policy is primarily written for customers, explaining how their personal data will be collected, used, and protected.", "question_th": "นโยบายความเป็นส่วนตัว (Privacy Policy) เขียนขึ้นเพื่อใคร?", "options_th": ["รัฐบาล", "ลูกค้า", "พนักงาน", "ทนายความ"], "explanation_th": "นโยบายความเป็นส่วนตัวเขียนขึ้นเป็นหลักสำหรับลูกค้า เพื่ออธิบายว่าข้อมูลส่วนบุคคลของพวกเขาจะถูกเก็บรวบรวม ใช้งาน และปกป้องอย่างไร"}, {"id": 102, "dom": 5, "question": "Which of the following is a privacy policy intended to cover?", "options": ["The company’s responsibilities to their customers.", "Every aspect of how an organization will use its users’ data", "Only the basics of privacy regulation compliance", "Only how to request deletion of personal data"], "correct_idx": 1, "explanation": "A privacy policy should comprehensively cover every aspect of how an organization collects, uses, and manages its users' data - not just isolated pieces of it.", "short_explanation_en": "A privacy policy should comprehensively cover every aspect of how an organization collects, uses, and manages its users' data - not just isolated pieces of it.", "question_th": "นโยบายความเป็นส่วนตัวมีขึ้นเพื่อครอบคลุมข้อใด?", "options_th": ["ความรับผิดชอบของบริษัทต่อลูกค้า", "ทุกแง่มุมของวิธีที่องค์กรจะใช้ข้อมูลของผู้ใช้", "เพียงหลักการพื้นฐานของการปฏิบัติตามกฎระเบียบความเป็นส่วนตัว", "เพียงวิธีการขอลบข้อมูลส่วนบุคคล"], "explanation_th": "นโยบายความเป็นส่วนตัวควรครอบคลุมทุกแง่มุมของวิธีที่องค์กรเก็บรวบรวม ใช้ และจัดการข้อมูลของผู้ใช้อย่างครบถ้วน ไม่ใช่เพียงบางส่วน"}, {"id": 103, "dom": 5, "question": "Which of the following is the purpose of security awareness training?", "options": ["Security compliance", "Cybersecurity risk mitigation", "User education", "Phishing tests"], "correct_idx": 2, "explanation": "Security awareness training's core purpose is user education - teaching employees to recognize and avoid security risks like phishing.", "short_explanation_en": "Security awareness training's core purpose is user education - teaching employees to recognize and avoid security risks like phishing.", "question_th": "ข้อใดคือวัตถุประสงค์ของการฝึกอบรมสร้างความตระหนักด้านความปลอดภัย (Security Awareness Training)?", "options_th": ["การปฏิบัติตามข้อกำหนดด้านความปลอดภัย", "การลดความเสี่ยงด้านความปลอดภัยไซเบอร์", "การให้ความรู้แก่ผู้ใช้", "การทดสอบฟิชชิง"], "explanation_th": "วัตถุประสงค์หลักของการฝึกอบรมสร้างความตระหนักด้านความปลอดภัยคือการให้ความรู้แก่ผู้ใช้ - สอนพนักงานให้รู้จักและหลีกเลี่ยงความเสี่ยงด้านความปลอดภัย เช่น ฟิชชิง"}, {"id": 104, "dom": 2, "question": "What is incident response?", "options": ["Helpdesk and customer service", "Putting out corporate fires", "Addressing anomalies and events in a timely fashion to minimize risk to the organization", "Remediating technical issues that pose a threat to the organization"], "correct_idx": 2, "explanation": "Incident response means addressing security anomalies and events promptly to minimize the risk and impact to the organization.", "short_explanation_en": "Incident response means addressing security anomalies and events promptly to minimize the risk and impact to the organization.", "question_th": "Incident Response (การตอบสนองต่อเหตุการณ์) คืออะไร?", "options_th": ["ฝ่ายช่วยเหลือและบริการลูกค้า", "การดับไฟในองค์กร", "การจัดการกับความผิดปกติและเหตุการณ์อย่างทันท่วงทีเพื่อลดความเสี่ยงต่อองค์กร", "การแก้ไขปัญหาทางเทคนิคที่เป็นภัยคุกคามต่อองค์กร"], "explanation_th": "Incident Response คือการจัดการความผิดปกติและเหตุการณ์ด้านความปลอดภัยอย่างทันท่วงที เพื่อลดความเสี่ยงและผลกระทบต่อองค์กร"}, {"id": 105, "dom": 2, "question": "What is an incident response plan?", "options": ["A document outlining how to respond to incidents", "Technical specifications for incident containment", "Another plan to seldom follow", "Training for incident response team members"], "correct_idx": 0, "explanation": "An incident response plan is the formal document outlining the specific steps and procedures for responding to security incidents.", "short_explanation_en": "An incident response plan is the formal document outlining the specific steps and procedures for responding to security incidents.", "question_th": "แผนตอบสนองต่อเหตุการณ์ (Incident Response Plan) คืออะไร?", "options_th": ["เอกสารที่ระบุขั้นตอนการตอบสนองต่อเหตุการณ์", "ข้อกำหนดทางเทคนิคสำหรับการควบคุมเหตุการณ์", "แผนอีกฉบับที่ไม่ค่อยมีใครทำตาม", "การฝึกอบรมสำหรับสมาชิกทีมตอบสนองเหตุการณ์"], "explanation_th": "แผนตอบสนองต่อเหตุการณ์คือเอกสารทางการที่ระบุขั้นตอนและกระบวนการเฉพาะสำหรับการตอบสนองต่อเหตุการณ์ด้านความปลอดภัย"}, {"id": 106, "dom": 2, "question": "What are the six steps of incident response?", "options": ["Detection, prioritization, isolation, response, recovery, reflection", "Monitoring, classification, containment, response, testing, reflection", "Analysis, classification, containment, response, recovery, lessons", "Detection, classification, containment, response, recovery, reflection"], "correct_idx": 3, "explanation": "The six standard phases of incident response are: detection, classification, containment, response, recovery, and reflection (lessons learned).", "short_explanation_en": "The six standard phases of incident response are: detection, classification, containment, response, recovery, and reflection (lessons learned).", "question_th": "หกขั้นตอนของ Incident Response คืออะไร?", "options_th": ["Detection, prioritization, isolation, response, recovery, reflection", "Monitoring, classification, containment, response, testing, reflection", "Analysis, classification, containment, response, recovery, lessons", "Detection, classification, containment, response, recovery, reflection"], "explanation_th": "หกขั้นตอนมาตรฐานของ Incident Response คือ: การตรวจจับ (detection), การจัดประเภท (classification), การควบคุม (containment), การตอบสนอง (response), การกู้คืน (recovery) และการทบทวน (reflection/lessons learned)"}, {"id": 107, "dom": 2, "question": "How are incident response plans tested?", "options": ["Actually responding to an incident", "Tabletop walkthroughs", "Simulations", "All of these answers are correct."], "correct_idx": 3, "explanation": "Incident response plans can be validated through live incident response, tabletop walkthroughs, and simulations - all are legitimate testing methods.", "short_explanation_en": "Incident response plans can be validated through live incident response, tabletop walkthroughs, and simulations - all are legitimate testing methods.", "question_th": "แผนตอบสนองต่อเหตุการณ์ถูกทดสอบอย่างไร?", "options_th": ["การตอบสนองต่อเหตุการณ์จริง", "การประชุมจำลองสถานการณ์บนโต๊ะ (Tabletop walkthroughs)", "การจำลองสถานการณ์ (Simulations)", "ถูกทุกข้อ"], "explanation_th": "แผนตอบสนองต่อเหตุการณ์สามารถทดสอบได้หลายวิธี ทั้งการตอบสนองต่อเหตุการณ์จริง การประชุมจำลองบนโต๊ะ และการจำลองสถานการณ์ ล้วนเป็นวิธีทดสอบที่ถูกต้อง"}, {"id": 108, "dom": 2, "question": "What is business continuity?", "options": ["Another name for incident response", "Plans and procedures for preparing systems for emergencies", "A list of people to call in an emergency", "Processes and procedures for the whole organization during emergencies"], "correct_idx": 3, "explanation": "Business continuity encompasses the processes and procedures the whole organization follows to keep operating during and after an emergency.", "short_explanation_en": "Business continuity encompasses the processes and procedures the whole organization follows to keep operating during and after an emergency.", "question_th": "Business Continuity (ความต่อเนื่องทางธุรกิจ) คืออะไร?", "options_th": ["ชื่ออื่นของ Incident Response", "แผนและขั้นตอนการเตรียมระบบสำหรับเหตุฉุกเฉิน", "รายชื่อบุคคลที่ต้องติดต่อในกรณีฉุกเฉิน", "กระบวนการและขั้นตอนสำหรับทั้งองค์กรในช่วงเหตุฉุกเฉิน"], "explanation_th": "Business Continuity ครอบคลุมกระบวนการและขั้นตอนที่ทั้งองค์กรต้องปฏิบัติตามเพื่อให้สามารถดำเนินงานต่อไปได้ในระหว่างและหลังเหตุฉุกเฉิน"}, {"id": 109, "dom": 2, "question": "What is the purpose of a business impact analysis?", "options": ["Determining which systems and data are critical", "Conducting a secondary risk assessment", "Judging the impact of the business continuity plan on the organization", "Judging the risks to confidentiality, integrity, and availability if an emergency were to happen"], "correct_idx": 0, "explanation": "A Business Impact Analysis (BIA) determines which systems and business functions are most critical, helping prioritize recovery efforts.", "short_explanation_en": "A Business Impact Analysis (BIA) determines which systems and business functions are most critical, helping prioritize recovery efforts.", "question_th": "วัตถุประสงค์ของ Business Impact Analysis คืออะไร?", "options_th": ["ระบุว่าระบบและข้อมูลใดมีความสำคัญ", "ทำการประเมินความเสี่ยงรอบที่สอง", "ประเมินผลกระทบของแผนความต่อเนื่องทางธุรกิจต่อองค์กร", "ประเมินความเสี่ยงต่อ confidentiality, integrity และ availability หากเกิดเหตุฉุกเฉิน"], "explanation_th": "Business Impact Analysis (BIA) ใช้ระบุว่าระบบและฟังก์ชันทางธุรกิจใดสำคัญที่สุด เพื่อช่วยจัดลำดับความสำคัญในการกู้คืน"}, {"id": 110, "dom": 2, "question": "An RTO refers to which of the following?", "options": ["The amount of money required to recover from an incident", "The latest time after an incident at which the system should be recovered and operational", "The amount of time required to recover from an incident", "The latest time after an incident at which the incident response plan should be completed"], "correct_idx": 1, "explanation": "RTO (Recovery Time Objective) is the maximum acceptable time after an incident by which a system must be restored and operational again.", "short_explanation_en": "RTO (Recovery Time Objective) is the maximum acceptable time after an incident by which a system must be restored and operational again.", "question_th": "RTO หมายถึงอะไร?", "options_th": ["จำนวนเงินที่ต้องใช้ในการกู้คืนจากเหตุการณ์", "เวลาล่าสุดหลังเหตุการณ์ที่ระบบควรถูกกู้คืนและกลับมาใช้งานได้", "ระยะเวลาที่ใช้ในการกู้คืนจากเหตุการณ์", "เวลาล่าสุดหลังเหตุการณ์ที่แผนตอบสนองต่อเหตุการณ์ควรเสร็จสิ้น"], "explanation_th": "RTO (Recovery Time Objective) คือระยะเวลาสูงสุดที่ยอมรับได้หลังเกิดเหตุการณ์ ซึ่งระบบต้องถูกกู้คืนและกลับมาทำงานได้"}, {"id": 111, "dom": 2, "question": "An RPO refers to which of the following?", "options": ["The most recent point before an incident to which the system can be recovered", "The amount of data lost during recovery from an incident", "The amount of time spent during recovery from an incident", "The last point at which the database was online"], "correct_idx": 0, "explanation": "RPO (Recovery Point Objective) is the most recent point in time to which data must be recoverable, defining how much data loss is tolerable.", "short_explanation_en": "RPO (Recovery Point Objective) is the most recent point in time to which data must be recoverable, defining how much data loss is tolerable.", "question_th": "RPO หมายถึงอะไร?", "options_th": ["จุดเวลาล่าสุดก่อนเหตุการณ์ที่ระบบสามารถกู้คืนได้", "ปริมาณข้อมูลที่สูญเสียระหว่างการกู้คืนจากเหตุการณ์", "ระยะเวลาที่ใช้ในการกู้คืน", "จุดเวลาล่าสุดที่ฐานข้อมูลยังออนไลน์อยู่"], "explanation_th": "RPO (Recovery Point Objective) คือจุดเวลาล่าสุดที่ข้อมูลสามารถกู้คืนได้ ซึ่งกำหนดปริมาณข้อมูลสูญหายที่ยอมรับได้"}, {"id": 112, "dom": 2, "question": "What are the four types of backups?", "options": ["Full, differential, incremental, real-time", "Full, real-time, cloud, differential", "Full, mirror, replicative, incremental", "Full, mirror, differential, incremental"], "correct_idx": 3, "explanation": "The four standard backup types are full, mirror, differential, and incremental - each balancing storage space and recovery speed differently.", "short_explanation_en": "The four standard backup types are full, mirror, differential, and incremental - each balancing storage space and recovery speed differently.", "question_th": "การสำรองข้อมูล (Backup) มีกี่ประเภทหลัก?", "options_th": ["Full, differential, incremental, real-time", "Full, real-time, cloud, differential", "Full, mirror, replicative, incremental", "Full, mirror, differential, incremental"], "explanation_th": "การสำรองข้อมูลมี 4 ประเภทหลัก: full (สำรองทั้งหมด), mirror (สำเนาเหมือนต้นฉบับ), differential (สำรองส่วนที่เปลี่ยนจาก full ล่าสุด) และ incremental (สำรองส่วนที่เปลี่ยนจากครั้งก่อนหน้า)"}, {"id": 113, "dom": 2, "question": "What is disaster recovery?", "options": ["Processes for storing backups and resuming business operations", "Another name for incident response", "Processes for handling and recovering from disasters", "Practical plans for safeguarding systems and technology"], "correct_idx": 2, "explanation": "Disaster recovery specifically covers the processes for responding to and recovering from major disruptive events (disasters).", "short_explanation_en": "Disaster recovery specifically covers the processes for responding to and recovering from major disruptive events (disasters).", "question_th": "Disaster Recovery คืออะไร?", "options_th": ["กระบวนการสำรองข้อมูลและกลับมาดำเนินธุรกิจ", "ชื่ออื่นของ Incident Response", "กระบวนการจัดการและกู้คืนจากภัยพิบัติ", "แผนปฏิบัติสำหรับปกป้องระบบและเทคโนโลยี"], "explanation_th": "Disaster Recovery ครอบคลุมกระบวนการเฉพาะสำหรับการตอบสนองและกู้คืนจากเหตุการณ์ภัยพิบัติร้ายแรง"}, {"id": 114, "dom": 2, "question": "What are the three types of backup sites?", "options": ["Hot, tepid, chilly", "Hot, warm, cold", "Hot, lukewarm, cold", "Boiling, hot, warm"], "correct_idx": 1, "explanation": "The three standard types of backup/recovery sites are hot (fully ready), warm (partially ready), and cold (minimal readiness).", "short_explanation_en": "The three standard types of backup/recovery sites are hot (fully ready), warm (partially ready), and cold (minimal readiness).", "question_th": "ไซต์สำรอง (Backup site) มีกี่ประเภทหลัก?", "options_th": ["Hot, tepid, chilly", "Hot, warm, cold", "Hot, lukewarm, cold", "Boiling, hot, warm"], "explanation_th": "ไซต์สำรองมี 3 ประเภทหลัก: hot site (พร้อมใช้งานทันที), warm site (พร้อมใช้งานบางส่วน) และ cold site (พร้อมใช้งานน้อยที่สุด)"}, {"id": 115, "dom": 2, "question": "What is failover testing?", "options": ["Testing backup restoration", "Switching over to alternate sites or redundant cloud setups", "A disaster recovery plan test", "All of these answers are correct."], "correct_idx": 3, "explanation": "Failover testing can include testing backup restoration, switching to alternate/redundant sites, and validating the disaster recovery plan itself - all are part of failover testing.", "short_explanation_en": "Failover testing can include testing backup restoration, switching to alternate/redundant sites, and validating the disaster recovery plan itself - all are part of failover testing.", "question_th": "Failover testing คืออะไร?", "options_th": ["การทดสอบการกู้คืนข้อมูลสำรอง", "การสลับไปยังไซต์สำรองหรือระบบคลาวด์สำรอง", "การทดสอบแผน Disaster Recovery", "ถูกทุกข้อ"], "explanation_th": "Failover testing ครอบคลุมการทดสอบการกู้คืนข้อมูลสำรอง การสลับไปยังไซต์สำรอง และการตรวจสอบแผน Disaster Recovery ทั้งหมดนี้ล้วนเป็นส่วนหนึ่งของการทดสอบ failover"}, {"id": 116, "dom": 2, "question": "For what purpose can governance documents be used?", "options": ["To fulfill the requirements of audits and vendor questionnaires", "To meet the requirements of regulations and laws", "To provide reference points during emergencies, staff changes, and training", "All of these answers are correct."], "correct_idx": 3, "explanation": "Governance documents serve multiple purposes: satisfying audits and vendor questionnaires, meeting regulatory/legal requirements, and providing guidance during emergencies, staff turnover, and training.", "short_explanation_en": "Governance documents serve multiple purposes: satisfying audits and vendor questionnaires, meeting regulatory/legal requirements, and providing guidance during emergencies, staff turnover, and training.", "question_th": "เอกสารด้านการกำกับดูแล (Governance documents) ใช้เพื่อวัตถุประสงค์ใด?", "options_th": ["เพื่อตอบสนองข้อกำหนดของการตรวจสอบและแบบสอบถามผู้ขาย", "เพื่อให้เป็นไปตามข้อกำหนดของกฎระเบียบและกฎหมาย", "เพื่อเป็นจุดอ้างอิงในสถานการณ์ฉุกเฉิน การเปลี่ยนพนักงาน และการฝึกอบรม", "ถูกทุกข้อ"], "explanation_th": "เอกสารด้านการกำกับดูแลมีหลายวัตถุประสงค์ ทั้งการตอบสนองการตรวจสอบ การปฏิบัติตามกฎระเบียบ และเป็นจุดอ้างอิงในสถานการณ์ต่าง ๆ"}, {"id": 117, "dom": 2, "question": "What is the hierarchy of governance documents?", "options": ["General statements, manuals, plans, guidelines", "Policies, standards, procedures, plans", "Policies, standards, procedures, guidelines", "Policies, manuals, plans, regulations"], "correct_idx": 2, "explanation": "The standard governance document hierarchy, from most to least formal, is: policies, standards, procedures, and guidelines.", "short_explanation_en": "The standard governance document hierarchy, from most to least formal, is: policies, standards, procedures, and guidelines.", "question_th": "ลำดับชั้นของเอกสารด้านการกำกับดูแลเป็นอย่างไร?", "options_th": ["General statements, manuals, plans, guidelines", "Policies, standards, procedures, plans", "Policies, standards, procedures, guidelines", "Policies, manuals, plans, regulations"], "explanation_th": "ลำดับชั้นมาตรฐานของเอกสารด้านการกำกับดูแล เรียงจากเป็นทางการมากที่สุดไปน้อยที่สุด คือ: policies, standards, procedures และ guidelines"}, {"id": 118, "dom": 2, "question": "What are the two primary sources of regulations in the cybersecurity industry?", "options": ["Government agencies and industry groups", "Legislatures and government agencies", "International organizations and cybersecurity associations", "Government agencies and international organizations"], "correct_idx": 0, "explanation": "Cybersecurity regulations primarily originate from government agencies (laws) and industry groups (standards/frameworks).", "short_explanation_en": "Cybersecurity regulations primarily originate from government agencies (laws) and industry groups (standards/frameworks).", "question_th": "แหล่งที่มาหลักสองแหล่งของกฎระเบียบในอุตสาหกรรมความปลอดภัยไซเบอร์คืออะไร?", "options_th": ["หน่วยงานภาครัฐและกลุ่มอุตสาหกรรม", "ฝ่ายนิติบัญญัติและหน่วยงานภาครัฐ", "องค์กรระหว่างประเทศและสมาคมความปลอดภัยไซเบอร์", "หน่วยงานภาครัฐและองค์กรระหว่างประเทศ"], "explanation_th": "กฎระเบียบด้านความปลอดภัยไซเบอร์ส่วนใหญ่มาจากหน่วยงานภาครัฐ (กฎหมาย) และกลุ่มอุตสาหกรรม (มาตรฐาน/กรอบการทำงาน)"}, {"id": 119, "dom": 2, "question": "Which of the following lists four laws and regulations that could apply to an organization?", "options": ["HIPAA, SOX, PCI DSS, GDPR", "HIPAA, SOC, CFAA, GDPR", "PCI DSS, HiTRUST, FedRAMP, FCPA", "PCI DSS, ISO 27001, SOX, HIPAA"], "correct_idx": 0, "explanation": "HIPAA (healthcare), SOX (financial reporting), PCI DSS (payment cards), and GDPR (EU data privacy) are all well-known regulations that could apply depending on an organization's industry and location.", "short_explanation_en": "HIPAA (healthcare), SOX (financial reporting), PCI DSS (payment cards), and GDPR (EU data privacy) are all well-known regulations that could apply depending on an organization's industry and location.", "question_th": "ข้อใดต่อไปนี้ระบุกฎหมายและกฎระเบียบ 4 ฉบับที่อาจใช้กับองค์กรได้?", "options_th": ["HIPAA, SOX, PCI DSS, GDPR", "HIPAA, SOC, CFAA, GDPR", "PCI DSS, HiTRUST, FedRAMP, FCPA", "PCI DSS, ISO 27001, SOX, HIPAA"], "explanation_th": "HIPAA (สุขภาพ), SOX (การรายงานทางการเงิน), PCI DSS (บัตรชำระเงิน) และ GDPR (ความเป็นส่วนตัวข้อมูลสหภาพยุโรป) เป็นกฎระเบียบที่รู้จักกันดีซึ่งอาจใช้บังคับตามอุตสาหกรรมและที่ตั้งขององค์กร"}, {"id": 120, "dom": 1, "question": "A cyberattacker changes the website of a pharmacy so it displays incorrect information about COVID testing. This is an example of what kind of compromise?", "options": ["Confidentiality", "Integrity", "Availability", "Nonrepudiation"], "correct_idx": 1, "explanation": "Changing data without proper authorization is a compromise of integrity.", "short_explanation_en": "Changing data without proper authorization is a compromise of integrity.", "question_th": "ผู้โจมตีทางไซเบอร์แก้ไขเว็บไซต์ของร้านขายยาให้แสดงข้อมูลที่ไม่ถูกต้องเกี่ยวกับการตรวจ COVID นี่เป็นตัวอย่างของการถูกบุกรุกประเภทใด?", "options_th": ["Confidentiality", "Integrity", "Availability", "Nonrepudiation"], "explanation_th": "การเปลี่ยนแปลงข้อมูลโดยไม่ได้รับอนุญาตอย่างเหมาะสมเป็นการถูกบุกรุกด้าน Integrity"}, {"id": 121, "dom": 1, "question": "The function of a computer system that verifies the identity of a user is called _________.", "options": ["Authentication", "Authorization", "Authenticity", "Availability"], "correct_idx": 0, "explanation": "Authentication is the function of verifying a user’s identity.", "short_explanation_en": "Authentication is the function of verifying a user’s identity.", "question_th": "ฟังก์ชันของระบบคอมพิวเตอร์ที่ตรวจสอบยืนยันตัวตนของผู้ใช้เรียกว่า _________.", "options_th": ["Authentication", "Authorization", "Authenticity", "Availability"], "explanation_th": "Authentication คือฟังก์ชันของการตรวจสอบยืนยันตัวตนของผู้ใช้"}, {"id": 122, "dom": 1, "question": "Jane received an electronic message from Fred that was digitally signed proving it came from him. However, Fred said he never sent it. This is an example of what message integrity characteristic?", "options": ["Nonreputation", "Nonrefutability", "Nonrepudiation", "Authenticity"], "correct_idx": 2, "explanation": "Nonrepudiation technologies are used to guarantee that a sender of a message cannot later deny that they sent the message.", "short_explanation_en": "Nonrepudiation technologies are used to guarantee that a sender of a message cannot later deny that they sent the message.", "question_th": "เจนได้รับข้อความอิเล็กทรอนิกส์จากเฟร็ดที่ลงลายเซ็นดิจิทัลซึ่งพิสูจน์ว่ามาจากเขา อย่างไรก็ตาม เฟร็ดบอกว่าเขาไม่เคยส่งข้อความนั้น นี่เป็นตัวอย่างของคุณสมบัติความถูกต้องครบถ้วนของข้อความ (Message integrity) ประเภทใด?", "options_th": ["Nonreputation", "Nonrefutability", "Nonrepudiation", "Authenticity"], "explanation_th": "เทคโนโลยี Nonrepudiation ถูกใช้เพื่อรับประกันว่าผู้ส่งข้อความไม่สามารถปฏิเสธในภายหลังว่าตนได้ส่งข้อความนั้น"}, {"id": 123, "dom": 1, "question": "Which of the following elements do not apply to privacy?", "options": ["Confidentiality", "Integrity", "Availability", "None of the above"], "correct_idx": 3, "explanation": "All of the items listed apply to privacy.", "short_explanation_en": "All of the items listed apply to privacy.", "question_th": "องค์ประกอบใดต่อไปนี้ไม่เกี่ยวข้องกับความเป็นส่วนตัว (Privacy)?", "options_th": ["Confidentiality", "Integrity", "Availability", "ไม่มีข้อใดถูกต้อง"], "explanation_th": "รายการทั้งหมดที่ระบุล้วนเกี่ยวข้องกับความเป็นส่วนตัว"}, {"id": 124, "dom": 1, "question": "Information assurance refers to the ____________ of information security.", "options": ["Quality", "Confidentiality", "Ethics", "Measurement"], "correct_idx": 3, "explanation": "Information assurance is the measurement of the security controls an organization has put into place.", "short_explanation_en": "Information assurance is the measurement of the security controls an organization has put into place.", "question_th": "Information assurance หมายถึง ____________ ของความปลอดภัยสารสนเทศ", "options_th": ["คุณภาพ", "ความลับ", "จริยธรรม", "การวัดผล"], "explanation_th": "Information assurance คือการวัดผลของการควบคุมความปลอดภัยที่องค์กรได้นำมาใช้"}, {"id": 125, "dom": 1, "question": "What is the first thing a cyberattacker would want to do to launch an attack against an organization?", "options": ["Learn about the organization’s vulnerabilities.", "Learn about the organization’s business, including domain names, corporate information, facilities, names of employees, etc.", "Deploy malware.", "Steal data."], "correct_idx": 1, "explanation": "While learning about vulnerabilities might seem like a good answer, the best answer is learning about the organization’s business details because that will provide the basic information the cyberattacker can use to launch the attack.", "short_explanation_en": "While learning about vulnerabilities might seem like a good answer, the best answer is learning about the organization’s business details because that will provide the basic information the cyberattacker can use to launch the attack.", "question_th": "สิ่งแรกที่ผู้โจมตีทางไซเบอร์ต้องการทำเพื่อเริ่มการโจมตีต่อองค์กรคืออะไร?", "options_th": ["เรียนรู้เกี่ยวกับช่องโหว่ขององค์กร", "เรียนรู้เกี่ยวกับธุรกิจขององค์กร รวมถึงชื่อโดเมน ข้อมูลบริษัท สถานที่ ชื่อพนักงาน ฯลฯ", "ติดตั้งมัลแวร์", "ขโมยข้อมูล"], "explanation_th": "แม้การเรียนรู้เกี่ยวกับช่องโหว่จะดูเหมือนคำตอบที่ดี แต่คำตอบที่ดีที่สุดคือการเรียนรู้รายละเอียดธุรกิจขององค์กร เพราะจะให้ข้อมูลพื้นฐานที่ผู้โจมตีสามารถใช้เพื่อเริ่มการโจมตีได้"}, {"id": 126, "dom": 1, "question": "Which of the following statements is most correct?", "options": ["Security should be done the same way regardless of the situation.", "Security should be tailored based on the situation.", "It’s always best to mitigate risks rather than transfer them.", "Risk avoidance trumps security controls every time."], "correct_idx": 1, "explanation": "Answers A, C, and D all contain absolute statements about applying security. But security is never absolute; it is tailored based on the situation and the organization’s tolerance for risk, so the best answer is B.", "short_explanation_en": "Answers A, C, and D all contain absolute statements about applying security.", "question_th": "ข้อความใดถูกต้องที่สุด?", "options_th": ["ความปลอดภัยควรทำในลักษณะเดียวกันโดยไม่คำนึงถึงสถานการณ์", "ความปลอดภัยควรปรับให้เหมาะสมตามสถานการณ์", "การลดความเสี่ยงดีกว่าการโอนความเสี่ยงเสมอ", "การหลีกเลี่ยงความเสี่ยงสำคัญกว่าการควบคุมความปลอดภัยเสมอ"], "explanation_th": "คำตอบ A, C และ D ล้วนมีข้อความสัมบูรณ์เกี่ยวกับการประยุกต์ใช้ความปลอดภัย แต่ความปลอดภัยไม่เคยเป็นสัมบูรณ์ มันถูกปรับให้เหมาะสมตามสถานการณ์และระดับความเสี่ยงที่องค์กรยอมรับได้ ดังนั้นคำตอบที่ดีที่สุดคือ B"}, {"id": 127, "dom": 1, "question": "You are asked to perform a risk assessment of an information system for the purpose of recommending the most appropriate security controls. You have a short amount of time to do this. You have information about how each asset in the system is used and its importance to the business, but you have no financial information about the assets or the information systems. Which is the most appropriate method to use for this assessment?", "options": ["Qualitative", "Threat modeling", "Quantitative", "Delphi"], "correct_idx": 0, "explanation": "Since you have no financial data, a quantitative assessment is not possible, but since you have information about how each asset in the system is used and its importance to the business, you have what you need to do a qualitative analysis.", "short_explanation_en": "Since you have no financial data, a quantitative assessment is not possible, but since you have information about how each asset in the system is used and its importance to the business, you have what you need to do a qualitative analysis.", "question_th": "คุณถูกขอให้ทำการประเมินความเสี่ยงของระบบสารสนเทศเพื่อวัตถุประสงค์ในการแนะนำการควบคุมความปลอดภัยที่เหมาะสมที่สุด คุณมีเวลาสั้น ๆ ในการทำสิ่งนี้ คุณมีข้อมูลเกี่ยวกับวิธีที่แต่ละทรัพย์สินในระบบถูกใช้งานและความสำคัญต่อธุรกิจ แต่คุณไม่มีข้อมูลทางการเงินเกี่ยวกับทรัพย์สินหรือระบบสารสนเทศ วิธีใดเหมาะสมที่สุดสำหรับการประเมินนี้?", "options_th": ["Qualitative", "Threat modeling", "Quantitative", "Delphi"], "explanation_th": "เนื่องจากคุณไม่มีข้อมูลทางการเงิน การประเมินแบบ quantitative จึงเป็นไปไม่ได้ แต่เนื่องจากคุณมีข้อมูลเกี่ยวกับวิธีที่แต่ละทรัพย์สินถูกใช้งานและความสำคัญต่อธุรกิจ คุณจึงมีสิ่งที่จำเป็นสำหรับการวิเคราะห์แบบ qualitative"}, {"id": 128, "dom": 1, "question": "You are asked to implement a risk treatment in which your IT department is removing a server from the environment that it deems is too risky due to having too many vulnerabilities in it. You have just practiced which type of risk treatment?", "options": ["Risk transfer", "Risk avoidance", "Risk acceptance", "Risk mitigation"], "correct_idx": 2, "explanation": "Risk avoidance is the best answer because by removing the risky server altogether, you are avoiding the risk. Answer D may have been considered because vulnerability mitigation is a type of risk treatment, but that usually involves addressing specific vulnerabilities, not removing entire systems or services.", "short_explanation_en": "Risk avoidance is the best answer because by removing the risky server altogether, you are avoiding the risk.", "question_th": "คุณถูกขอให้นำการจัดการความเสี่ยง (Risk treatment) มาใช้ โดยฝ่าย IT ของคุณกำลังนำเซิร์ฟเวอร์ออกจากสภาพแวดล้อมเพราะเห็นว่ามีความเสี่ยงสูงเกินไปเนื่องจากมีช่องโหว่จำนวนมาก คุณเพิ่งปฏิบัติตามการจัดการความเสี่ยงประเภทใด?", "options_th": ["Risk transfer", "Risk avoidance", "Risk acceptance", "Risk mitigation"], "explanation_th": "Risk avoidance คือคำตอบที่ดีที่สุด เพราะการนำเซิร์ฟเวอร์ที่มีความเสี่ยงออกทั้งหมด คือการหลีกเลี่ยงความเสี่ยง คำตอบ D อาจถูกพิจารณาเพราะการลดช่องโหว่เป็นประเภทหนึ่งของการจัดการความเสี่ยง แต่โดยปกติเกี่ยวข้องกับการแก้ไขช่องโหว่เฉพาะ ไม่ใช่การนำระบบหรือบริการทั้งหมดออก"}, {"id": 129, "dom": 1, "question": "A security engineer is performing a review of an organization’s datacenter security controls. They document that the datacenter lacks security cameras for monitoring the facilities. What type of control does this represent?", "options": ["Administrative", "Technical", "Physical", "Logical"], "correct_idx": 2, "explanation": "Security cameras used for monitoring facilities are an example of physical security controls. Administrative controls are managementoriented controls such as documentation, policies, procedures, and training. Technical or logical controls are hardware or software components implemented by computer systems or network devices.", "short_explanation_en": "Security cameras used for monitoring facilities are an example of physical security controls.", "question_th": "วิศวกรความปลอดภัยกำลังทบทวนการควบคุมความปลอดภัยของศูนย์ข้อมูลขององค์กร พวกเขาบันทึกว่าศูนย์ข้อมูลขาดกล้องวงจรปิดสำหรับเฝ้าติดตามสถานที่ นี่แสดงถึงการควบคุมประเภทใด?", "options_th": ["Administrative", "Technical", "Physical", "Logical"], "explanation_th": "กล้องวงจรปิดที่ใช้เฝ้าติดตามสถานที่เป็นตัวอย่างของการควบคุมความปลอดภัยทางกายภาพ การควบคุมเชิงบริหารเป็นการควบคุมที่เน้นการจัดการ เช่น เอกสาร นโยบาย ขั้นตอน และการฝึกอบรม การควบคุมทางเทคนิคหรือทางตรรกะเป็นส่วนประกอบฮาร์ดแวร์หรือซอฟต์แวร์ที่นำไปใช้โดยระบบคอมพิวเตอร์หรืออุปกรณ์เครือข่าย"}, {"id": 130, "dom": 1, "question": "The senior security engineer is creating a document that provides stepby-step instructions on how to launch a vulnerability scan utilizing the organization’s vulnerability scanning tool that all security engineers will be required to follow. Which of the following governance elements is this an example of?", "options": ["Policy", "Procedure", "Guideline", "Law"], "correct_idx": 1, "explanation": "A document containing step-by-step instructions on how to perform a vulnerability scanning is an example of a procedure. Policies are high-level management statements providing directives to the organization but do not prescribe exact steps. Guidelines serve as best practice references but are not required to be followed. While following the procedure may be a requirement of the business, the proc", "short_explanation_en": "A document containing step-by-step instructions on how
