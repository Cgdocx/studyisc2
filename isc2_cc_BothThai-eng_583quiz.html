on", "Lessons Learned", "Identification", "Containment (Mitigation)"], "correct_idx": 3, "explanation": "The Containment (Mitigation) phase focuses on limiting the scope and impact of an active incident, such as disconnecting an infected machine from the network.", "short_explanation_en": "ขั้นตอน Containment หรือ Mitigation คือการจำกัดขอบเขตและผลกระทบของเหตุการณ์ไม่ให้ลุกลามต่อไป เช่น การตัดการเชื่อมต่อเครื่องที่ติดมัลแวร์ออกจากเครือข่าย ซึ่งเกิดขึ้นหลังจากตรวจพบเหตุการณ์ (Identification) แต่ก่อนขั้นตอนการกำจัดสาเหตุ...", "question_th": "ในระหว่างเหตุการณ์ความปลอดภัยที่กำลังเกิดขึ้น ขั้นตอนใดของกระบวนการตอบสนองต่อเหตุการณ์ที่เน้นการจำกัดขอบเขตและผลกระทบของเหตุการณ์?", "options_th": ["Preparation", "Lessons Learned", "Identification", "Containment (Mitigation)"], "explanation_th": "ขั้นตอน Containment หรือ Mitigation คือการจำกัดขอบเขตและผลกระทบของเหตุการณ์ไม่ให้ลุกลามต่อไป เช่น การตัดการเชื่อมต่อเครื่องที่ติดมัลแวร์ออกจากเครือข่าย"}, {"id": 501, "dom": 2, "question": "After an incident has been fully resolved and systems restored, which activity helps the organization improve its future response capability?", "options": ["Immediately deleting all incident-related logs", "Disabling the incident response team", "Conducting a lessons-learned (post-incident) review", "Notifying only senior executives"], "correct_idx": 2, "explanation": "Conducting a lessons-learned (post-incident) review is the final step of incident response, where the team analyzes what happened and how to improve future response.", "short_explanation_en": "การทบทวนบทเรียนหลังเหตุการณ์ (Lessons Learned / Post-Incident Review) เป็นขั้นตอนสุดท้ายของกระบวนการตอบสนองเหตุการณ์ โดยทีมงานจะวิเคราะห์ว่าเกิดอะไรขึ้น รับมืออย่างไร และจะปรับปรุงกระบวนการอย่างไรในอนาคต...", "question_th": "หลังจากเหตุการณ์ได้รับการแก้ไขอย่างสมบูรณ์และระบบถูกกู้คืนแล้ว กิจกรรมใดช่วยให้องค์กรพัฒนาความสามารถในการตอบสนองในอนาคต?", "options_th": ["ลบบันทึกที่เกี่ยวข้องกับเหตุการณ์ทั้งหมดทันที", "ยุบทีมตอบสนองต่อเหตุการณ์", "ทำการทบทวนบทเรียนที่ได้ (post-incident review)", "แจ้งเฉพาะผู้บริหารระดับสูงเท่านั้น"], "explanation_th": "การทบทวนบทเรียนหลังเหตุการณ์ (Lessons Learned / Post-Incident Review) เป็นขั้นตอนสุดท้ายของกระบวนการตอบสนองเหตุการณ์ โดยทีมงานจะวิเคราะห์ว่าเกิดอะไรขึ้นและจะปรับปรุงการตอบสนองในอนาคตอย่างไร"}, {"id": 502, "dom": 3, "question": "Which of the following BEST describes 'Identification' in the context of the IAAA model?", "options": ["A system records what a user did after logging in", "A system determines what resources a user can access", "A user proves their identity using a password", "A user claims an identity, such as by entering a username"], "correct_idx": 3, "explanation": "Identification is the step where a user 'claims' an identity - such as typing in a username - which is not yet proof of identity. Actual proof (such as entering a password) is the Authentication step that follows.", "short_explanation_en": "Identification is the step where a user 'claims' an identity - such as typing in a username - which is not yet proof of identity. Actual proof (such as entering a password) is the Authentication step that follows.", "question_th": "ข้อใดอธิบาย 'Identification' ในบริบทของโมเดล IAAA ได้ดีที่สุด?", "options_th": ["ระบบบันทึกสิ่งที่ผู้ใช้ทำหลังจากล็อกอิน", "ระบบกำหนดว่าผู้ใช้สามารถเข้าถึงทรัพยากรใดได้บ้าง", "ผู้ใช้พิสูจน์ตัวตนของตนโดยใช้รหัสผ่าน", "ผู้ใช้อ้างสิทธิ์ตัวตน เช่น การพิมพ์ชื่อผู้ใช้"], "explanation_th": "Identification คือขั้นตอนที่ผู้ใช้ 'อ้าง' ตัวตนของตนเอง เช่น การพิมพ์ชื่อผู้ใช้ (username) ยังไม่ใช่การพิสูจน์ตัวตน ส่วนการพิสูจน์ตัวตนจริง (เช่น การใส่รหัสผ่าน) คือขั้นตอน Authentication ซึ่งเกิดขึ้นถัดไป"}, {"id": 503, "dom": 3, "question": "Which authentication factor category does a fingerprint scan belong to?", "options": ["Something you are", "Something you know", "Something you have", "Somewhere you are"], "correct_idx": 0, "explanation": "A fingerprint is a unique biological characteristic of an individual, placing it in the 'Something you are' category (biometric factor) - distinct from a password ('something you know') or a token/card ('something you have').", "short_explanation_en": "A fingerprint is a unique biological characteristic of an individual, placing it in the 'Something you are' category (biometric factor) - distinct from a password ('something you know') or a token/card ('something you have').", "question_th": "การสแกนลายนิ้วมือจัดอยู่ในหมวดปัจจัยการยืนยันตัวตนใด?", "options_th": ["Something you are", "Something you know", "Something you have", "Somewhere you are"], "explanation_th": "ลายนิ้วมือเป็นลักษณะทางชีวภาพเฉพาะตัวของแต่ละบุคคล จึงจัดอยู่ในหมวด 'สิ่งที่คุณเป็น' (Something you are) หรือปัจจัยชีวมิติ (Biometric factor) ต่างจากรหัสผ่านซึ่งเป็น 'สิ่งที่คุณรู้' และโทเค็นหรือบัตรซึ่งเป็น 'สิ่งที่คุณมี'"}, {"id": 504, "dom": 3, "question": "A login process requires a password AND a one-time code generated by a mobile app. This is an example of:", "options": ["Multi-factor authentication (MFA)", "Role-based access control", "Federated identity management", "Single sign-on (SSO)"], "correct_idx": 0, "explanation": "Using a password ('something you know') together with a one-time code from a mobile app ('something you have') uses more than one authentication factor type, making this Multi-Factor Authentication (MFA), which is more secure than a single factor.", "short_explanation_en": "Using a password ('something you know') together with a one-time code from a mobile app ('something you have') uses more than one authentication factor type, making this Multi-Factor Authentication (MFA), which is more secure than a single factor.", "question_th": "กระบวนการล็อกอินต้องใช้รหัสผ่านและรหัสแบบใช้ครั้งเดียวที่สร้างจากแอปในมือถือ นี่เป็นตัวอย่างของ:", "options_th": ["Multi-factor authentication (MFA)", "Role-based access control", "Federated identity management", "Single sign-on (SSO)"], "explanation_th": "การใช้รหัสผ่าน (สิ่งที่คุณรู้) ร่วมกับรหัสแบบใช้ครั้งเดียวจากแอปในมือถือ (สิ่งที่คุณมี) เป็นการใช้ปัจจัยยืนยันตัวตนมากกว่าหนึ่งประเภท จึงเป็น Multi-Factor Authentication (MFA) ซึ่งเพิ่มความปลอดภัยมากกว่าการใช้ปัจจัยเดียว"}, {"id": 505, "dom": 3, "question": "Which access control model grants permissions based on labels such as 'Confidential' or 'Top Secret' that are enforced system-wide and cannot be overridden by users?", "options": ["Mandatory Access Control (MAC)", "Attribute-Based Access Control (ABAC)", "Role-Based Access Control (RBAC)", "Discretionary Access Control (DAC)"], "correct_idx": 0, "explanation": "Mandatory Access Control (MAC) enforces a centralized security policy by comparing a user's clearance level (e.g., Confidential, Top Secret) against the data's classification, and users cannot alter these permissions themselves - commonly used in government or military settings requiring high security.", "short_explanation_en": "Mandatory Access Control (MAC) enforces a centralized security policy by comparing a user's clearance level (e.g., Confidential, Top Secret) against the data's classification, and users cannot alter these permissions themselves - commonly used in government or military settings requiring high security.", "question_th": "โมเดลควบคุมการเข้าถึงใดที่ให้สิทธิ์ตามป้ายกำกับ เช่น 'Confidential' หรือ 'Top Secret' ซึ่งบังคับใช้ทั่วทั้งระบบและไม่สามารถถูกแทนที่โดยผู้ใช้ได้?", "options_th": ["Mandatory Access Control (MAC)", "Attribute-Based Access Control (ABAC)", "Role-Based Access Control (RBAC)", "Discretionary Access Control (DAC)"], "explanation_th": "Mandatory Access Control (MAC) บังคับใช้นโยบายความปลอดภัยแบบรวมศูนย์โดยเปรียบเทียบระดับชั้นความลับ (เช่น Confidential, Top Secret) ของผู้ใช้กับของข้อมูล และผู้ใช้ไม่สามารถเปลี่ยนแปลงสิทธิ์เหล่านี้ได้เอง มักใช้ในหน่วยงานราชการหรือทหารที่ต้องการความปลอดภัยสูง"}, {"id": 506, "dom": 3, "question": "In which access control model does the owner of a resource decide who else may access it?", "options": ["Mandatory Access Control (MAC)", "Rule-Based Access Control", "Role-Based Access Control (RBAC)", "Discretionary Access Control (DAC)"], "correct_idx": 3, "explanation": "Discretionary Access Control (DAC) gives the resource owner (Data Owner) the authority to decide who can access their own resources - such as sharing files in a typical operating system - unlike MAC, where the system enforces a fixed policy.", "short_explanation_en": "Discretionary Access Control (DAC) gives the resource owner (Data Owner) the authority to decide who can access their own resources - such as sharing files in a typical operating system - unlike MAC, where the system enforces a fixed policy.", "question_th": "ในโมเดลควบคุมการเข้าถึงใดที่เจ้าของทรัพยากรเป็นผู้ตัดสินใจว่าใครสามารถเข้าถึงได้บ้าง?", "options_th": ["Mandatory Access Control (MAC)", "Rule-Based Access Control", "Role-Based Access Control (RBAC)", "Discretionary Access Control (DAC)"], "explanation_th": "Discretionary Access Control (DAC) ให้อำนาจแก่เจ้าของทรัพยากร (Data Owner) เป็นผู้ตัดสินใจเองว่าใครสามารถเข้าถึงทรัพยากรของตนได้บ้าง เช่น การแชร์ไฟล์ในระบบปฏิบัติการทั่วไป ต่างจาก MAC ที่ระบบเป็นผู้บังคับใช้นโยบายแบบตายตัว"}, {"id": 507, "dom": 3, "question": "An organization assigns access permissions to users based on their job function, such as 'HR Manager' or 'Accountant'. Which access control model is being used?", "options": ["Mandatory Access Control (MAC)", "Content-dependent Access Control", "Role-Based Access Control (RBAC)", "Discretionary Access Control (DAC)"], "correct_idx": 2, "explanation": "Role-Based Access Control (RBAC) assigns access based on job function (Role) rather than assigning permissions to each individual directly, making it easier to manage access when there are many employees - since assigning a role automatically grants the associated permissions.", "short_explanation_en": "Role-Based Access Control (RBAC) assigns access based on job function (Role) rather than assigning permissions to each individual directly, making it easier to manage access when there are many employees - since assigning a role automatically grants the associated permissions.", "question_th": "องค์กรกำหนดสิทธิ์การเข้าถึงให้ผู้ใช้ตามหน้าที่งาน เช่น 'HR Manager' หรือ 'Accountant' นี่เป็นการใช้โมเดลควบคุมการเข้าถึงใด?", "options_th": ["Mandatory Access Control (MAC)", "Content-dependent Access Control", "Role-Based Access Control (RBAC)", "Discretionary Access Control (DAC)"], "explanation_th": "Role-Based Access Control (RBAC) กำหนดสิทธิ์การเข้าถึงตามบทบาทหน้าที่งาน (Role) แทนที่จะกำหนดให้แต่ละบุคคลโดยตรง ทำให้บริหารจัดการสิทธิ์ได้ง่ายขึ้นเมื่อมีพนักงานจำนวนมาก เพราะเพียงกำหนดบทบาทให้ผู้ใช้ สิทธิ์ที่เกี่ยวข้องก็จะถูกกำหนดตามไปด้วย"}, {"id": 508, "dom": 3, "question": "Which principle states that users should be granted only the minimum access rights necessary to perform their job functions?", "options": ["Separation of duties", "Least privilege", "Need to know", "Defense in depth"], "correct_idx": 1, "explanation": "The Least Privilege principle states that users should be granted only the access necessary for their job, reducing potential damage if that account is compromised or misused.", "short_explanation_en": "The Least Privilege principle states that users should be granted only the access necessary for their job, reducing potential damage if that account is compromised or misused.", "question_th": "หลักการใดระบุว่าผู้ใช้ควรได้รับสิทธิ์การเข้าถึงเพียงขั้นต่ำที่จำเป็นสำหรับการปฏิบัติหน้าที่ของตนเท่านั้น?", "options_th": ["Separation of duties", "Least privilege", "Need to know", "Defense in depth"], "explanation_th": "หลักการ Least Privilege (การให้สิทธิ์น้อยที่สุด) กำหนดว่าผู้ใช้ควรได้รับสิทธิ์การเข้าถึงเพียงเท่าที่จำเป็นสำหรับการทำงานเท่านั้น เพื่อลดความเสียหายที่อาจเกิดขึ้นหากบัญชีนั้นถูกบุกรุกหรือถูกใช้ในทางที่ผิด"}, {"id": 509, "dom": 3, "question": "'Need to know' differs from 'least privilege' in that it primarily focuses on:", "options": ["Limiting the technical capabilities (e.g., read vs. write) granted to an account", "Requiring two people to approve a sensitive transaction", "Limiting access to specific information required for a task, regardless of general job permissions", "Rotating job duties among employees periodically"], "correct_idx": 2, "explanation": "Need to Know focuses on restricting access to specific 'information' needed for a current task, even if the user has broader general system permissions - distinct from Least Privilege, which focuses on limiting an account's 'technical capabilities', such as read-only versus write/edit access.", "short_explanation_en": "Need to Know focuses on restricting access to specific 'information' needed for a current task, even if the user has broader general system permissions - distinct from Least Privilege, which focuses on limiting an account's 'technical capabilities', such as read-only versus write/edit access.", "question_th": "'Need to know' แตกต่างจาก 'least privilege' อย่างไร ตรงที่มุ่งเน้นเรื่องใดเป็นหลัก?", "options_th": ["การจำกัดความสามารถทางเทคนิค (เช่น อ่าน vs เขียน) ที่มอบให้กับบัญชี", "การกำหนดให้ต้องมีคนสองคนอนุมัติธุรกรรมที่อ่อนไหว", "การจำกัดการเข้าถึงข้อมูลเฉพาะที่จำเป็นสำหรับงาน โดยไม่คำนึงถึงสิทธิ์ทั่วไปของตำแหน่งงาน", "การหมุนเวียนหน้าที่งานในหมู่พนักงานเป็นระยะ"], "explanation_th": "Need to Know เน้นการจำกัดการเข้าถึง 'ข้อมูล' เฉพาะที่จำเป็นต่อการทำงานในขณะนั้น แม้ผู้ใช้จะมีสิทธิ์ในระบบโดยทั่วไปก็ตาม ต่างจาก Least Privilege ซึ่งเน้นจำกัด 'ความสามารถทางเทคนิค' ของบัญชี เช่น สิทธิ์อ่านอย่างเดียวเทียบกับสิทธิ์เขียนหรือแก้ไข"}, {"id": 510, "dom": 3, "question": "A company requires that the employee who creates a purchase order cannot be the same employee who approves it. This control is an example of:", "options": ["Job rotation", "Mandatory vacation", "Least privilege", "Separation of duties"], "correct_idx": 3, "explanation": "Separation of Duties requires that critical steps of a process be split among two or more people, preventing any single individual from being able to commit fraud alone - such as separating the person who creates a purchase order from the person who approves it.", "short_explanation_en": "Separation of Duties requires that critical steps of a process be split among two or more people, preventing any single individual from being able to commit fraud alone - such as separating the person who creates a purchase order from the person who approves it.", "question_th": "บริษัทกำหนดว่าพนักงานที่สร้างใบสั่งซื้อจะต้องไม่ใช่คนเดียวกับที่อนุมัติใบสั่งซื้อนั้น การควบคุมนี้เป็นตัวอย่างของ:", "options_th": ["Job rotation", "Mandatory vacation", "Least privilege", "Separation of duties"], "explanation_th": "Separation of Duties (การแบ่งแยกหน้าที่ความรับผิดชอบ (Separation of Duties)) กำหนดให้ขั้นตอนสำคัญของงานหนึ่งงานต้องถูกแบ่งความรับผิดชอบระหว่างบุคคลตั้งแต่สองคนขึ้นไป เพื่อป้องกันไม่ให้บุคคลใดบุคคลหนึ่งสามารถกระทำการทุจริตได้โดยลำพัง เช่น แยกผู้สร้างใบสั่งซื้อออกจากผู้อนุมัติ"}, {"id": 511, "dom": 3, "question": "Employees are required to take at least one consecutive week of vacation per year, during which their duties are covered by others. What risk does this control MOST directly help detect?", "options": ["Weak password policies", "Poor physical security at the office", "Ongoing fraud or unauthorized activity that the employee may be concealing", "Insufficient network bandwidth"], "correct_idx": 2, "explanation": "A Mandatory Vacation policy requires someone else to temporarily cover the employee's duties, which creates an opportunity for the organization to detect fraud or unauthorized activity that the employee may have been concealing during their normal work.", "short_explanation_en": "A Mandatory Vacation policy requires someone else to temporarily cover the employee's duties, which creates an opportunity for the organization to detect fraud or unauthorized activity that the employee may have been concealing during their normal work.", "question_th": "พนักงานถูกกำหนดให้ต้องลาพักร้อนติดต่อกันอย่างน้อยหนึ่งสัปดาห์ต่อปี ในช่วงนั้นหน้าที่ของพวกเขาจะถูกดูแลโดยผู้อื่น การควบคุมนี้ช่วยตรวจจับความเสี่ยงใดมากที่สุดโดยตรง?", "options_th": ["นโยบายรหัสผ่านที่อ่อนแอ", "ความปลอดภัยทางกายภาพของสำนักงานที่ไม่ดี", "การทุจริตหรือกิจกรรมที่ไม่ได้รับอนุญาตที่พนักงานอาจกำลังปกปิดอยู่", "แบนด์วิดท์เครือข่ายที่ไม่เพียงพอ"], "explanation_th": "นโยบายบังคับลาพักร้อน (Mandatory Vacation) ทำให้ผู้อื่นต้องเข้ามาทำหน้าที่แทนชั่วคราว ซึ่งเปิดโอกาสให้องค์กรตรวจพบความผิดปกติ การทุจริต หรือกิจกรรมที่ไม่ได้รับอนุญาตที่พนักงานคนนั้นอาจปกปิดไว้ระหว่างการปฏิบัติงานตามปกติ"}, {"id": 512, "dom": 3, "question": "Over time, an employee who has changed roles several times still retains access rights from all previous positions. This situation is known as:", "options": ["Access provisioning", "Least privilege", "Privilege creep", "Role explosion"], "correct_idx": 2, "explanation": "Privilege Creep is the situation where a user accumulates unnecessary access rights over time, often caused by multiple role changes without revoking previous permissions. Periodic access reviews help detect and correct this.", "short_explanation_en": "Privilege Creep is the situation where a user accumulates unnecessary access rights over time, often caused by multiple role changes without revoking previous permissions. Periodic access reviews help detect and correct this.", "question_th": "เมื่อเวลาผ่านไป พนักงานที่เปลี่ยนตำแหน่งหลายครั้งยังคงมีสิทธิ์การเข้าถึงจากตำแหน่งก่อนหน้าทั้งหมด สถานการณ์นี้เรียกว่า:", "options_th": ["Access provisioning", "Least privilege", "Privilege creep", "Role explosion"], "explanation_th": "Privilege Creep คือสถานการณ์ที่ผู้ใช้สะสมสิทธิ์การเข้าถึงเกินความจำเป็นเมื่อเวลาผ่านไป มักเกิดจากการเปลี่ยนตำแหน่งงานหลายครั้งโดยไม่มีการเพิกถอนสิทธิ์เดิม การทบทวนสิทธิ์การเข้าถึงเป็นระยะช่วยตรวจจับและแก้ไขปัญหานี้"}, {"id": 513, "dom": 3, "question": "Which process should occur promptly when an employee leaves the organization, to reduce security risk?", "options": ["De-provisioning (revoking) the employee's accounts and access rights", "Archiving the employee's email for one year only", "Issuing the employee a new access badge", "Assigning the employee's role to a temporary contractor immediately"], "correct_idx": 0, "explanation": "When an employee leaves the organization, De-provisioning - immediately revoking all user accounts and access rights - must be done promptly to prevent an unused account from becoming a vulnerability that could be exploited.", "short_explanation_en": "When an employee leaves the organization, De-provisioning - immediately revoking all user accounts and access rights - must be done promptly to prevent an unused account from becoming a vulnerability that could be exploited.", "question_th": "กระบวนการใดควรเกิดขึ้นทันทีเมื่อพนักงานลาออกจากองค์กร เพื่อลดความเสี่ยงด้านความปลอดภัย?", "options_th": ["De-provisioning (เพิกถอน) บัญชีและสิทธิ์การเข้าถึงของพนักงาน", "จัดเก็บอีเมลของพนักงานไว้เพียงหนึ่งปีเท่านั้น", "ออกบัตรผ่านใหม่ให้พนักงาน", "มอบหมายบทบาทของพนักงานให้ผู้รับจ้างชั่วคราวทันที"], "explanation_th": "เมื่อพนักงานพ้นสภาพจากองค์กร ต้องรีบดำเนินการ De-provisioning คือการเพิกถอนบัญชีผู้ใช้และสิทธิ์การเข้าถึงทั้งหมดโดยทันที เพื่อป้องกันไม่ให้บัญชีที่ไม่มีการใช้งานแล้วกลายเป็นช่องโหว่ที่อาจถูกนำไปใช้ในทางที่ผิด"}, {"id": 514, "dom": 3, "question": "Which technology allows a user to log in once and gain access to multiple independent systems without re-entering credentials?", "options": ["Federated Identity Management", "Single Sign-On (SSO)", "Role-Based Access Control (RBAC)", "Multi-Factor Authentication (MFA)"], "correct_idx": 1, "explanation": "Single Sign-On (SSO) allows a user to log in once and access other related systems without re-entering credentials, improving convenience and reducing the number of passwords a user must remember - though it also makes that single account a high-value target if compromised.", "short_explanation_en": "Single Sign-On (SSO) allows a user to log in once and access other related systems without re-entering credentials, improving convenience and reducing the number of passwords a user must remember - though it also makes that single account a high-value target if compromised.", "question_th": "เทคโนโลยีใดที่ให้ผู้ใช้ล็อกอินเพียงครั้งเดียวและเข้าถึงระบบอิสระหลายระบบได้โดยไม่ต้องกรอกข้อมูลรับรองซ้ำ?", "options_th": ["Federated Identity Management", "Single Sign-On (SSO)", "Role-Based Access Control (RBAC)", "Multi-Factor Authentication (MFA)"], "explanation_th": "Single Sign-On (SSO) ช่วยให้ผู้ใช้ล็อกอินเพียงครั้งเดียวแล้วสามารถเข้าถึงระบบอื่น ๆ ที่เกี่ยวข้องได้โดยไม่ต้องกรอกข้อมูลรับรองซ้ำ ช่วยเพิ่มความสะดวกในการใช้งานและลดจำนวนรหัสผ่านที่ผู้ใช้ต้องจดจำ แต่ก็ทำให้บัญชีเดียวมีความสำคัญสูงมากหากถูกบุกรุก"}, {"id": 515, "dom": 3, "question": "Which concept allows users from one organization to access resources of a different, trusted organization using their existing credentials?", "options": ["Federated identity management", "Privilege escalation", "Discretionary access control", "Single sign-on"], "correct_idx": 0, "explanation": "Federated Identity Management allows users from one organization to access resources of another trusted organization using their existing credentials, without needing to create a new account in each system - such as logging into another website using a Google account.", "short_explanation_en": "Federated Identity Management allows users from one organization to access resources of another trusted organization using their existing credentials, without needing to create a new account in each system - such as logging into another website using a Google account.", "question_th": "แนวคิดใดที่ให้ผู้ใช้จากองค์กรหนึ่งสามารถเข้าถึงทรัพยากรของอีกองค์กรที่เชื่อถือกันได้ โดยใช้ข้อมูลรับรองที่มีอยู่แล้ว?", "options_th": ["Federated identity management", "Privilege escalation", "Discretionary access control", "Single sign-on"], "explanation_th": "Federated Identity Management ช่วยให้ผู้ใช้จากองค์กรหนึ่งสามารถเข้าถึงทรัพยากรของอีกองค์กรที่มีความสัมพันธ์ไว้วางใจกัน (trust relationship) โดยใช้ข้อมูลรับรองเดิมของตนเอง โดยไม่ต้องสร้างบัญชีใหม่ในแต่ละระบบ เช่น การล็อกอินด้วยบัญชี Google เข้าเว็บไซต์อื่น"}, {"id": 516, "dom": 3, "question": "A biometric system incorrectly denies access to an authorized user whose fingerprint was not clearly scanned. This error is known as a:", "options": ["False rejection (Type I error)", "False acceptance (Type II error)", "Crossover error rate", "False positive alert"], "correct_idx": 0, "explanation": "False Rejection (Type I Error) occurs when a biometric system incorrectly denies an authorized user due to an unclear scan or other error - distinct from False Acceptance (Type II Error), where the system incorrectly allows an unauthorized person through.", "short_explanation_en": "False Rejection (Type I Error) occurs when a biometric system incorrectly denies an authorized user due to an unclear scan or other error - distinct from False Acceptance (Type II Error), where the system incorrectly allows an unauthorized person through.", "question_th": "ระบบไบโอเมตริกซ์ปฏิเสธการเข้าถึงของผู้ใช้ที่ได้รับอนุญาตอย่างผิดพลาด เนื่องจากลายนิ้วมือถูกสแกนไม่ชัดเจน ข้อผิดพลาดนี้เรียกว่า:", "options_th": ["False rejection (Type I error)", "False acceptance (Type II error)", "Crossover error rate", "False positive alert"], "explanation_th": "False Rejection หรือ Type I Error คือกรณีที่ระบบไบโอเมตริกซ์ปฏิเสธผู้ใช้ที่ได้รับอนุญาตอย่างถูกต้อง เนื่องจากการสแกนไม่ชัดเจนหรือข้อผิดพลาดอื่น ต่างจาก False Acceptance (Type II Error) ซึ่งเป็นกรณีที่ระบบยอมให้ผู้ที่ไม่ได้รับอนุญาตผ่านเข้ามาได้"}, {"id": 517, "dom": 3, "question": "Which term describes the point at which the false rejection rate and false acceptance rate of a biometric system are equal, used to measure overall system accuracy?", "options": ["False Acceptance Rate (FAR)", "Throughput rate", "Crossover Error Rate (CER)", "False Rejection Rate (FRR)"], "correct_idx": 2, "explanation": "The Crossover Error Rate (CER) is the point where the False Rejection Rate (FRR) and False Acceptance Rate (FAR) are equal. A lower CER indicates a more accurate biometric system, making it a common metric for comparing different biometric systems.", "short_explanation_en": "The Crossover Error Rate (CER) is the point where the False Rejection Rate (FRR) and False Acceptance Rate (FAR) are equal. A lower CER indicates a more accurate biometric system, making it a common metric for comparing different biometric systems.", "question_th": "คำใดอธิบายจุดที่อัตราการปฏิเสธผิดพลาดและอัตราการยอมรับผิดพลาดของระบบไบโอเมตริกซ์มีค่าเท่ากัน ซึ่งใช้วัดความแม่นยำโดยรวมของระบบ?", "options_th": ["False Acceptance Rate (FAR)", "Throughput rate", "Crossover Error Rate (CER)", "False Rejection Rate (FRR)"], "explanation_th": "Crossover Error Rate (CER) คือจุดที่อัตราการปฏิเสธผิดพลาด (FRR) และอัตราการยอมรับผิดพลาด (FAR) มีค่าเท่ากัน ยิ่งค่า CER ต่ำเท่าไร ระบบไบโอเมตริกซ์นั้นก็ยิ่งมีความแม่นยำสูงเท่านั้น จึงมักใช้เป็นตัวชี้วัดเปรียบเทียบประสิทธิภาพของระบบไบโอเมตริกซ์ต่าง ๆ"}, {"id": 518, "dom": 3, "question": "Which access control concept requires two individuals to be present simultaneously to access a highly sensitive area, such as a data center vault?", "options": ["Separation of duties", "Mandatory vacation", "Two-person integrity", "Job rotation"], "correct_idx": 2, "explanation": "Two-Person Integrity requires two individuals to be present simultaneously any time a highly sensitive area or asset - such as a data center vault - is accessed, preventing any one person from acting alone without a witness.", "short_explanation_en": "Two-Person Integrity requires two individuals to be present simultaneously any time a highly sensitive area or asset - such as a data center vault - is accessed, preventing any one person from acting alone without a witness.", "question_th": "แนวคิดการควบคุมการเข้าถึงใดที่กำหนดให้ต้องมีบุคคลสองคนอยู่พร้อมกันเพื่อเข้าถึงพื้นที่ที่มีความอ่อนไหวสูง เช่น ห้องนิรภัยศูนย์ข้อมูล?", "options_th": ["Separation of duties", "Mandatory vacation", "Two-person integrity", "Job rotation"], "explanation_th": "Two-Person Integrity กำหนดให้ต้องมีบุคคลสองคนอยู่พร้อมกัน ณ จุดนั้นทุกครั้งที่มีการเข้าถึงพื้นที่หรือทรัพย์สินที่มีความอ่อนไหวสูงมาก เช่น ห้องนิรภัยศูนย์ข้อมูล เพื่อป้องกันไม่ให้บุคคลใดบุคคลหนึ่งกระทำการโดยลำพังโดยไม่มีพยาน"}, {"id": 519, "dom": 3, "question": "Which of the following is the STRONGEST example of a good passphrase from a security standpoint?", "options": ["The word 'Password123'", "The user's own name followed by their birth year", "A 4-digit PIN such as '1234'", "A long, random sequence of unrelated words such as 'CorrectHorseBattery42!'"], "correct_idx": 3, "explanation": "A strong passphrase should be long and made up of random, unrelated words, making it far harder to guess or brute-force - whereas familiar or personally identifiable passwords, like a name or birth year, are all easily guessed.", "short_explanation_en": "A strong passphrase should be long and made up of random, unrelated words, making it far harder to guess or brute-force - whereas familiar or personally identifiable passwords, like a name or birth year, are all easily guessed.", "question_th": "ข้อใดเป็นตัวอย่างที่แข็งแรงที่สุดของ passphrase ที่ดีจากมุมมองความปลอดภัย?", "options_th": ["คำว่า 'Password123'", "ชื่อของผู้ใช้เองตามด้วยปีเกิด", "PIN 4 หลัก เช่น '1234'", "ลำดับคำที่ไม่เกี่ยวข้องกันแบบสุ่มและยาว เช่น 'CorrectHorseBattery42!'"], "explanation_th": "รหัสผ่านที่แข็งแรง (strong passphrase) ควรมีความยาวมาก ประกอบด้วยคำที่ไม่เกี่ยวข้องกันแบบสุ่ม ทำให้คาดเดาหรือโจมตีแบบ brute-force ได้ยากขึ้นมาก ในขณะที่รหัสผ่านที่คุ้นเคยหรือเกี่ยวข้องกับข้อมูลส่วนตัว เช่น ชื่อหรือปีเกิด ล้วนถูกคาดเดาได้ง่าย"}, {"id": 520, "dom": 3, "question": "Which network access control mechanism restricts a device from connecting to the network until it meets specific security requirements, such as up-to-date antivirus signatures?", "options": ["Virtual Private Network (VPN)", "Network Access Control (NAC)", "Access Control List (ACL)", "Intrusion Prevention System (IPS)"], "correct_idx": 1, "explanation": "Network Access Control (NAC) checks a device's security posture before allowing it to connect to the network - such as verifying up-to-date antivirus signatures. Devices that don't meet the criteria are quarantined in a separate network until remediated.", "short_explanation_en": "Network Access Control (NAC) checks a device's security posture before allowing it to connect to the network - such as verifying up-to-date antivirus signatures. Devices that don't meet the criteria are quarantined in a separate network until remediated.", "question_th": "กลไกควบคุมการเข้าถึงเครือข่ายใดที่จำกัดไม่ให้อุปกรณ์เชื่อมต่อกับเครือข่ายจนกว่าจะผ่านข้อกำหนดด้านความปลอดภัยเฉพาะ เช่น ลายเซ็นแอนตี้ไวรัสที่อัปเดตล่าสุด?", "options_th": ["Virtual Private Network (VPN)", "Network Access Control (NAC)", "Access Control List (ACL)", "Intrusion Prevention System (IPS)"], "explanation_th": "Network Access Control (NAC) ตรวจสอบสถานะความปลอดภัยของอุปกรณ์ก่อนอนุญาตให้เชื่อมต่อกับเครือข่าย เช่น ตรวจสอบว่ามีโปรแกรมป้องกันไวรัสที่อัปเดตล่าสุดหรือไม่ หากไม่ผ่านเกณฑ์ อุปกรณ์นั้นจะถูกกักไว้ในเครือข่ายแยกต่างหาก (quarantine) จนกว่าจะได้รับการแก้ไข"}, {"id": 521, "dom": 3, "question": "A network device filters traffic based on a list of rules specifying source, destination, and port. This is an example of:", "options": ["An Access Control List (ACL)", "Federated identity management", "Role-Based Access Control", "Single sign-on"], "correct_idx": 0, "explanation": "An Access Control List (ACL) is a list of rules that determines which traffic is allowed or denied based on conditions such as source, destination, and port - commonly used on routers or firewalls to control network access at the packet level.", "short_explanation_en": "An Access Control List (ACL) is a list of rules that determines which traffic is allowed or denied based on conditions such as source, destination, and port - commonly used on routers or firewalls to control network access at the packet level.", "question_th": "อุปกรณ์เครือข่ายกรองทราฟฟิกตามรายการกฎที่ระบุต้นทาง ปลายทาง และพอร์ต นี่เป็นตัวอย่างของ:", "options_th": ["Access Control List (ACL)", "Federated identity management", "Role-Based Access Control", "Single sign-on"], "explanation_th": "Access Control List (ACL) คือรายการกฎที่กำหนดว่าทราฟฟิกใดได้รับอนุญาตหรือถูกปฏิเสธ โดยอ้างอิงจากเงื่อนไข เช่น ต้นทาง ปลายทาง และพอร์ต มักใช้กับเราเตอร์หรือไฟร์วอลล์เพื่อควบคุมการเข้าถึงเครือข่ายในระดับแพ็กเก็ต"}, {"id": 522, "dom": 3, "question": "An organization implements a policy requiring that no single employee can both initiate a wire transfer and approve it. What primary risk does this control address?", "options": ["Network latency during transfers", "Fraud committed by a single insider acting alone", "Weak encryption of financial data", "Data loss during a natural disaster"], "correct_idx": 1, "explanation": "A policy preventing a single employee from both initiating and approving a wire transfer aligns with the Separation of Duties principle, whose primary goal is to prevent fraud committed by a single insider acting alone, since another person must always review or approve as well.", "short_explanation_en": "A policy preventing a single employee from both initiating and approving a wire transfer aligns with the Separation of Duties principle, whose primary goal is to prevent fraud committed by a single insider acting alone, since another person must always review or approve as well.", "question_th": "องค์กรนำนโยบายมาใช้ที่กำหนดให้พนักงานคนเดียวไม่สามารถทั้งริเริ่มและอนุมัติการโอนเงินได้ การควบคุมนี้จัดการกับความเสี่ยงหลักใด?", "options_th": ["ความหน่วงของเครือข่ายระหว่างการโอนเงิน", "การทุจริตที่กระทำโดยบุคคลภายในเพียงคนเดียว", "การเข้ารหัสข้อมูลทางการเงินที่อ่อนแอ", "การสูญเสียข้อมูลระหว่างภัยพิบัติทางธรรมชาติ"], "explanation_th": "นโยบายที่ห้ามพนักงานคนเดียวทำทั้งการริเริ่มและอนุมัติการโอนเงินสอดคล้องกับหลัก Separation of Duties ซึ่งมีเป้าหมายหลักเพื่อป้องกันการทุจริตที่กระทำโดยพนักงานภายในเพียงคนเดียวโดยลำพัง เนื่องจากต้องมีบุคคลอื่นเข้ามาตรวจสอบหรืออนุมัติร่วมด้วยเสมอ"}, {"id": 523, "dom": 3, "question": "Which of the following BEST describes 'Accounting' (or auditing) in the IAAA model?", "options": ["Issuing a username to a new employee", "Verifying a user's claimed identity", "Determining what resources a user is allowed to access", "Tracking and logging user activities for later review"], "correct_idx": 3, "explanation": "Accounting (or Auditing) in the IAAA model refers to recording and tracking user activities in a system, so it can later be reviewed to determine who did what and when - supporting accountability and security incident investigation.", "short_explanation_en": "Accounting (or Auditing) in the IAAA model refers to recording and tracking user activities in a system, so it can later be reviewed to determine who did what and when - supporting accountability and security incident investigation.", "question_th": "ข้อใดอธิบาย 'Accounting' (หรือการตรวจสอบ) ในโมเดล IAAA ได้ดีที่สุด?", "options_th": ["การออกชื่อผู้ใช้ให้พนักงานใหม่", "การยืนยันตัวตนที่ผู้ใช้อ้างสิทธิ์", "การกำหนดว่าผู้ใช้ได้รับอนุญาตให้เข้าถึงทรัพยากรใดได้บ้าง", "การติดตามและบันทึกกิจกรรมของผู้ใช้เพื่อทบทวนในภายหลัง"], "explanation_th": "Accounting (หรือ Auditing) ในโมเดล IAAA หมายถึงการบันทึกและติดตามกิจกรรมของผู้ใช้ในระบบ เพื่อให้สามารถตรวจสอบย้อนหลังได้ว่าใครทำอะไร เมื่อใด ซึ่งช่วยสนับสนุนการตรวจสอบความรับผิดชอบ (accountability) และการสืบสวนเหตุการณ์ด้านความปลอดภัย"}, {"id": 524, "dom": 4, "question": "Which OSI layer is responsible for routing packets between different networks based on IP addresses?", "options": ["Layer 7 - Application", "Layer 2 - Data Link", "Layer 3 - Network", "Layer 4 - Transport"], "correct_idx": 2, "explanation": "Layer 3 (Network Layer) is responsible for routing data between different networks using IP addresses - distinct from Layer 2, which operates via MAC address within the same network, and Layer 4, which handles end-to-end delivery like TCP/UDP.", "short_explanation_en": "Layer 3 (Network Layer) is responsible for routing data between different networks using IP addresses - distinct from Layer 2, which operates via MAC address within the same network, and Layer 4, which handles end-to-end delivery like TCP/UDP.", "question_th": "OSI Layer ใดที่รับผิดชอบการจัดเส้นทาง (routing) แพ็กเก็ตระหว่างเครือข่ายต่าง ๆ โดยใช้ IP address?", "options_th": ["Layer 7 - Application", "Layer 2 - Data Link", "Layer 3 - Network", "Layer 4 - Transport"], "explanation_th": "Layer 3 (Network Layer) มีหน้าที่กำหนดเส้นทางการส่งข้อมูล (routing) ระหว่างเครือข่ายต่าง ๆ โดยใช้ IP address เป็นตัวระบุ ต่างจาก Layer 2 ซึ่งทำงานด้วย MAC address ภายในเครือข่ายเดียวกัน และ Layer 4 ซึ่งจัดการการส่งข้อมูลแบบ end-to-end เช่น TCP/UDP"}, {"id": 525, "dom": 4, "question": "A network device that filters traffic based on IP address, port number, and protocol, sitting at the network perimeter, is called a:", "options": ["Hub", "Switch", "Firewall", "Repeater"], "correct_idx": 2, "explanation": "A Firewall is a device or software that filters network traffic based on defined rules - such as IP address, port, and protocol - typically installed at the network perimeter to control what traffic can enter or leave the network.", "short_explanation_en": "A Firewall is a device or software that filters network traffic based on defined rules - such as IP address, port, and protocol - typically installed at the network perimeter to control what traffic can enter or leave the network.", "question_th": "อุปกรณ์เครือข่ายที่กรองทราฟฟิกตาม IP address หมายเลขพอร์ต และโปรโตคอล ซึ่งวางอยู่ที่ขอบเขตเครือข่าย เรียกว่าอะไร?", "options_th": ["Hub", "Switch", "Firewall", "Repeater"], "explanation_th": "ไฟร์วอลล์ (Firewall) เป็นอุปกรณ์หรือซอฟต์แวร์ที่กรองทราฟฟิกเครือข่ายตามกฎที่กำหนด เช่น IP address พอร์ต และโปรโตคอล มักติดตั้งที่ขอบเขตเครือข่าย (perimeter) เพื่อควบคุมว่าทราฟฟิกใดสามารถเข้าหรือออกจากเครือข่ายได้"}, {"id": 526, "dom": 4, "question": "Which network security device monitors traffic for suspicious activity and can automatically block or drop malicious packets in real time?", "options": ["Proxy cache server", "Intrusion Detection System (IDS)", "Network hub", "Intrusion Prevention System (IPS)"], "correct_idx": 3, "explanation": "An Intrusion Prevention System (IPS) not only detects suspicious activity but can also automatically block or drop malicious packets in real time - unlike an Intrusion Detection System (IDS), which can only detect and alert, not stop an attack on its own.", "short_explanation_en": "An Intrusion Prevention System (IPS) not only detects suspicious activity but can also automatically block or drop malicious packets in real time - unlike an Intrusion Detection System (IDS), which can only detect and alert, not stop an attack on its own.", "question_th": "อุปกรณ์ความปลอดภัยเครือข่ายใดที่เฝ้าติดตามทราฟฟิกเพื่อหากิจกรรมที่น่าสงสัย และสามารถบล็อกหรือทิ้งแพ็กเก็ตที่เป็นอันตรายได้แบบเรียลไทม์โดยอัตโนมัติ?", "options_th": ["Proxy cache server", "Intrusion Detection System (IDS)", "Network hub", "Intrusion Prevention System (IPS)"], "explanation_th": "Intrusion Prevention System (IPS) ไม่เพียงตรวจจับกิจกรรมที่น่าสงสัย แต่ยังสามารถบล็อกหรือทิ้งแพ็กเก็ตที่เป็นอันตรายได้แบบ real-time โดยอัตโนมัติ ต่างจาก Intrusion Detection System (IDS) ซึ่งทำได้เพียงตรวจจับและแจ้งเตือนเท่านั้น ไม่สามารถสกัดกั้นการโจมตีได้เอง"}, {"id": 527, "dom": 4, "question": "A network segment positioned between the internal network and the internet, used to host public-facing servers like a web server, is called a:", "options": ["Extranet", "Demilitarized Zone (DMZ)", "Intranet", "Virtual Private Network (VPN)"], "correct_idx": 1, "explanation": "A Demilitarized Zone (DMZ) is a subnetwork positioned between an organization's internal network and the internet, used to host servers that must be accessible to outsiders, such as a web server, without directly exposing the more critical internal network.", "short_explanation_en": "A Demilitarized Zone (DMZ) is a subnetwork positioned between an organization's internal network and the internet, used to host servers that must be accessible to outsiders, such as a web server, without directly exposing the more critical internal network.", "question_th": "ส่วนของเครือข่ายที่วางอยู่ระหว่างเครือข่ายภายในและอินเทอร์เน็ต ใช้เพื่อโฮสต์เซิร์ฟเวอร์ที่ต้องเปิดให้สาธารณะเข้าถึง เช่น เว็บเซิร์ฟเวอร์ เรียกว่าอะไร?", "options_th": ["Extranet", "Demilitarized Zone (DMZ)", "Intranet", "Virtual Private Network (VPN)"], "explanation_th": "Demilitarized Zone (DMZ) คือเครือข่ายย่อยที่แยกอยู่ระหว่างเครือข่ายภายในองค์กรกับอินเทอร์เน็ต ใช้วางเซิร์ฟเวอร์ที่ต้องเปิดให้บุคคลภายนอกเข้าถึงได้ เช่น เว็บเซิร์ฟเวอร์ โดยไม่ทำให้เครือข่ายภายในที่สำคัญกว่าถูกเปิดเผยโดยตรง"}, {"id": 528, "dom": 4, "question": "Which technology allows multiple devices on a private network to share a single public IP address when accessing the internet?", "options": ["Domain Name System (DNS)", "Network Address Translation (NAT)", "Virtual Local Area Network (VLAN)", "Dynamic Host Configuration Protocol (DHCP)"], "correct_idx": 1, "explanation": "Network Address Translation (NAT) translates internal private IP addresses into a single shared public IP address when accessing the internet, conserving the number of public IPs needed and improving security by hiding internal IPs from outside.", "short_explanation_en": "Network Address Translation (NAT) translates internal private IP addresses into a single shared public IP address when accessing the internet, conserving the number of public IPs needed and improving security by hiding internal IPs from outside.", "question_th": "เทคโนโลยีใดที่ช่วยให้อุปกรณ์หลายเครื่องในเครือข่ายส่วนตัวสามารถแชร์ public IP address เดียวกันเมื่อเข้าถึงอินเทอร์เน็ต?", "options_th": ["Domain Name System (DNS)", "Network Address Translation (NAT)", "Virtual Local Area Network (VLAN)", "Dynamic Host Configuration Protocol (DHCP)"], "explanation_th": "Network Address Translation (NAT) ทำหน้าที่แปลง IP address ภายในเครือข่ายส่วนตัว (private) ให้กลายเป็น IP address สาธารณะ (public) เดียวกันเมื่อออกสู่อินเทอร์เน็ต ช่วยประหยัดจำนวน public IP ที่ต้องใช้ และเพิ่มความปลอดภัยด้วยการซ่อน IP ภายในจากภายนอก"}, {"id": 529, "dom": 4, "question": "Which technology logically separates devices on the same physical network switch into distinct broadcast domains for security and traffic management?", "options": ["Domain Name System (DNS)", "Virtual Local Area Network (VLAN)", "Address Resolution Protocol (ARP)", "Network Address Translation (NAT)"], "correct_idx": 1, "explanation": "A VLAN (Virtual Local Area Network) divides devices connected to the same physical switch into multiple logical subnetworks, separating them at the broadcast domain level - improving security and traffic management without needing separate physical cabling.", "short_explanation_en": "A VLAN (Virtual Local Area Network) divides devices connected to the same physical switch into multiple logical subnetworks, separating them at the broadcast domain level - improving security and traffic management without needing separate physical cabling.", "question_th": "เทคโนโลยีใดที่แยกอุปกรณ์บนสวิตช์เครือข่ายทางกายภาพเดียวกันออกเป็น broadcast domain ที่แยกจากกันทางตรรกะ เพื่อความปลอดภัยและการจัดการทราฟฟิก?", "options_th": ["Domain Name System (DNS)", "Virtual Local Area Network (VLAN)", "Address Resolution Protocol (ARP)", "Network Address Translation (NAT)"], "explanation_th": "VLAN (Virtual Local Area Network) ช่วยแบ่งอุปกรณ์ที่เชื่อมต่อกับสวิตช์ทางกายภาพเดียวกันออกเป็นเครือข่ายย่อยแบบตรรกะ (logical) หลายเครือข่าย ทำให้แต่ละกลุ่มแยกขาดจากกันในระดับ broadcast domain ช่วยเพิ่มความปลอดภัยและจัดการทราฟฟิกได้ดีขึ้นโดยไม่ต้องเดินสายแยกทางกายภาพ"}, {"id": 530, "dom": 4, "question": "Which wireless security protocol is considered the CURRENT strongest standard, offering improved encryption over its predecessor?", "options": ["Open (no encryption)", "WEP", "WPA", "WPA3"], "correct_idx": 3, "explanation": "WPA3 (Wi-Fi Protected Access 3) is currently the strongest wireless security standard, offering better encryption than the previous WPA2 and improved protection against brute-force password attacks, while WEP is an old, insecure standard that should no longer be used.", "short_explanation_en": "WPA3 (Wi-Fi Protected Access 3) is currently the strongest wireless security standard, offering better encryption than the previous WPA2 and improved protection against brute-force password attacks, while WEP is an old, insecure standard that should no longer be used.", "question_th": "โปรโตคอลความปลอดภัยเครือข่ายไร้สายใดที่ถือเป็นมาตรฐานที่แข็งแกร่งที่สุดในปัจจุบัน โดยให้การเข้ารหัสที่ดีกว่ารุ่นก่อนหน้า?", "options_th": ["Open (ไม่เข้ารหัส)", "WEP", "WPA", "WPA3"], "explanation_th": "WPA3 (Wi-Fi Protected Access 3) เป็นมาตรฐานความปลอดภัยเครือข่ายไร้สายที่แข็งแกร่งที่สุดในปัจจุบัน ให้การเข้ารหัสที่ดีกว่า WPA2 รุ่นก่อนหน้า และป้องกันการโจมตีแบบเดารหัสผ่าน (brute-force) ได้ดีขึ้น ในขณะที่ WEP เป็นมาตรฐานเก่าที่ไม่ปลอดภัยและไม่ควรใช้งานแล้ว"}, {"id": 531, "dom": 4, "question": "Which protocol provides encrypted remote command-line access to a server, replacing the insecure Telnet protocol?", "options": ["FTP", "HTTP", "SSH (Secure Shell)", "SNMP"], "correct_idx": 2, "explanation": "SSH (Secure Shell) provides encrypted command-line access to a remote server, protecting against eavesdropping - a key weakness of Telnet, which transmits data including passwords in plaintext.", "short_explanation_en": "SSH (Secure Shell) provides encrypted command-line access to a remote server, protecting against eavesdropping - a key weakness of Telnet, which transmits data including passwords in plaintext.", "question_th": "โปรโตคอลใดที่ให้การเข้าถึงบรรทัดคำสั่งของเซิร์ฟเวอร์ระยะไกลแบบเข้ารหัส เข้ามาแทนที่โปรโตคอล Telnet ที่ไม่ปลอดภัย?", "options_th": ["FTP", "HTTP", "SSH (Secure Shell)", "SNMP"], "explanation_th": "SSH (Secure Shell) ให้การเข้าถึงเครื่องเซิร์ฟเวอร์ระยะไกลผ่านคำสั่ง (command-line) แบบเข้ารหัส ช่วยป้องกันการดักฟังข้อมูล (eavesdropping) ซึ่งเป็นจุดอ่อนสำคัญของ Telnet ที่ส่งข้อมูลรวมถึงรหัสผ่านแบบไม่เข้ารหัส (plaintext)"}, {"id": 532, "dom": 4, "question": "Which port number is commonly associated with HTTPS traffic?", "options": ["25", "443", "80", "22"], "correct_idx": 1, "explanation": "Port 443 is the standard port used for HTTPS (HTTP encrypted with TLS/SSL). Port 80 is used for unencrypted HTTP, port 22 is used for SSH, and port 25 is used for SMTP email transmission.", "short_explanation_en": "Port 443 is the standard port used for HTTPS (HTTP encrypted with TLS/SSL). Port 80 is used for unencrypted HTTP, port 22 is used for SSH, and port 25 is used for SMTP email transmission.", "question_th": "หมายเลขพอร์ตใดที่มักเกี่ยวข้องกับทราฟฟิก HTTPS?", "options_th": ["25", "443", "80", "22"], "explanation_th": "พอร์ต 443 เป็นพอร์ตมาตรฐานที่ใช้สำหรับ HTTPS (HTTP ที่เข้ารหัสด้วย TLS/SSL) ส่วนพอร์ต 80 ใช้สำหรับ HTTP แบบไม่เข้ารหัส พอร์ต 22 ใช้สำหรับ SSH และพอร์ต 25 ใช้สำหรับ SMTP ในการรับส่งอีเมล"}, {"id": 533, "dom": 4, "question": "Which technology creates an encrypted tunnel over a public network, allowing a remote user to securely access an organization's internal network?", "options": ["Domain Name System (DNS)", "Network Address Translation (NAT)", "Simple Network Management Protocol (SNMP)", "Virtual Private Network (VPN)"], "correct_idx": 3, "explanation": "A VPN (Virtual Private Network) creates an encrypted tunnel over a public network, such as the internet, allowing a remote user to securely access an organization's internal network as if they were physically connected in the office.", "short_explanation_en": "A VPN (Virtual Private Network) creates an encrypted tunnel over a public network, such as the internet, allowing a remote user to securely access an organization's internal network as if they were physically connected in the office.", "question_th": "เทคโนโลยีใดที่สร้างอุโมงค์เข้ารหัสผ่านเครือข่ายสาธารณะ ช่วยให้ผู้ใช้ระยะไกลเข้าถึงเครือข่ายภายในองค์กรได้อย่างปลอดภัย?", "options_th": ["Domain Name System (DNS)", "Network Address Translation (NAT)", "Simple Network Management Protocol (SNMP)", "Virtual Private Network (VPN)"], "explanation_th": "VPN (Virtual Private Network) สร้างอุโมงค์ (tunnel) ที่เข้ารหัสข้อมูลผ่านเครือข่ายสาธารณะ เช่น อินเทอร์เน็ต ทำให้ผู้ใช้งานระยะไกลสามารถเข้าถึงเครือข่ายภายในองค์กรได้อย่างปลอดภัยเสมือนเชื่อมต่ออยู่ในสำนักงานจริง โดยข้อมูลที่ส่งผ่านจะถูกป้องกันจากการดักฟังระหว่างทาง"}, {"id": 534, "dom": 4, "question": "In the cloud shared responsibility model, under Infrastructure as a Service (IaaS), who is TYPICALLY responsible for securing the guest operating system and installed applications?", "options": ["A third-party auditor", "The cloud service provider (CSP) only", "Neither party - it is unmanaged", "The customer"], "correct_idx": 3, "explanation": "In the IaaS model, the cloud service provider (CSP) is responsible only for the physical infrastructure, network, and virtualization layer, while the customer is responsible for securing the operating system, applications, and data installed on their own virtual machines.", "short_explanation_en": "In the IaaS model, the cloud service provider (CSP) is responsible only for the physical infrastructure, network, and virtualization layer, while the customer is responsible for securing the operating system, applications, and data installed on their own virtual machines.", "question_th": "ในโมเดลความรับผิดชอบร่วมกันของคลาวด์ (Shared Responsibility Model) ภายใต้ Infrastructure as a Service (IaaS) โดยทั่วไปใครเป็นผู้รับผิดชอบในการรักษาความปลอดภัยของระบบปฏิบัติการ (guest OS) และแอปพลิเคชันที่ติดตั้งไว้?", "options_th": ["ผู้ตรวจสอบบุคคลที่สาม", "ผู้ให้บริการคลาวด์ (CSP) เท่านั้น", "ไม่มีฝ่ายใดรับผิดชอบ - ไม่มีการจัดการ", "ลูกค้า"], "explanation_th": "ในรูปแบบ IaaS ผู้ให้บริการคลาวด์ (CSP) รับผิดชอบโครงสร้างพื้นฐานทางกายภาพ เครือข่าย และ virtualization layer เท่านั้น ส่วนลูกค้าต้องรับผิดชอบการดูแลความปลอดภัยของระบบปฏิบัติการ (OS) แอปพลิเคชัน และข้อมูลที่ติดตั้งอยู่บนเครื่องเสมือนของตนเองทั้งหมด"}, {"id": 535, "dom": 4, "question": "Which cloud deployment model involves infrastructure shared exclusively among several organizations with common concerns, such as regulatory compliance requirements?", "options": ["Public cloud", "Hybrid cloud", "Private cloud", "Community cloud"], "correct_idx": 3, "explanation": "A Community Cloud is a cloud model where infrastructure is shared among several organizations with common needs or requirements, such as government agencies subject to the same regulations - distinct from Public Cloud, which is open to the general public, and Private Cloud, used by a single organization only.", "short_explanation_en": "A Community Cloud is a cloud model where infrastructure is shared among several organizations with common needs or requirements, such as government agencies subject to the same regulations - distinct from Public Cloud, which is open to the general public, and Private Cloud, used by a single organization only.", "question_th": "โมเดลการปรับใช้คลาวด์ใดที่โครงสร้างพื้นฐานถูกใช้ร่วมกันเฉพาะโดยหลายองค์กรที่มีข้อกังวลร่วมกัน เช่น ข้อกำหนดด้านการปฏิบัติตามกฎระเบียบ?", "options_th": ["Public cloud", "Hybrid cloud", "Private cloud", "Community cloud"], "explanation_th": "Community Cloud คือรูปแบบคลาวด์ที่โครงสร้างพื้นฐานถูกใช้งานร่วมกันโดยองค์กรหลายแห่งที่มีความต้องการหรือข้อกำหนดร่วมกัน เช่น หน่วยงานราชการที่ต้องปฏิบัติตามกฎระเบียบเดียวกัน ต่างจาก Public Cloud ที่เปิดให้บุคคลทั่วไปใช้งาน และ Private Cloud ที่ใช้เฉพาะองค์กรเดียว"}, {"id": 536, "dom": 4, "question": "Which security model operates on the principle of 'never trust, always verify', requiring continuous authentication and authorization for every access request regardless of network location?", "options": ["Zero Trust", "Discretionary Access Control", "Perimeter security", "Defense in Depth"], "correct_idx": 0, "explanation": "Zero Trust is a security concept based on 'never trust, always verify' - no device or user is automatically trusted even within the organization's network. Every access request must go through continuous authentication and authorization, unlike traditional perimeter-focused security.", "short_explanation_en": "Zero Trust is a security concept based on 'never trust, always verify' - no device or user is automatically trusted even within the organization's network. Every access request must go through continuous authentication and authorization, unlike traditional perimeter-focused security.", "question_th": "โมเดลความปลอดภัยใดที่ทำงานตามหลักการ 'อย่าไว้ใจ ต้องตรวจสอบเสมอ' โดยกำหนดให้ต้องมีการยืนยันตัวตนและตรวจสอบสิทธิ์อย่างต่อเนื่องสำหรับทุกคำขอเข้าถึง ไม่ว่าจะอยู่ที่ตำแหน่งใดในเครือข่าย?", "options_th": ["Zero Trust", "Discretionary Access Control", "Perimeter security", "Defense in Depth"], "explanation_th": "Zero Trust เป็นแนวคิดด้านความปลอดภัยที่ยึดหลัก 'อย่าไว้ใจ ต้องตรวจสอบเสมอ' โดยไม่มีการไว้วางใจอุปกรณ์หรือผู้ใช้โดยอัตโนมัติแม้จะอยู่ภายในเครือข่ายองค์กรก็ตาม ทุกคำขอเข้าถึงต้องผ่านการยืนยันตัวตนและตรวจสอบสิทธิ์อย่างต่อเนื่อง ต่างจากแนวคิดความปลอดภัยแบบเดิมที่เน้นป้องกันเฉพาะขอบเขตเครือข่าย (perimeter)"}, {"id": 537, "dom": 4, "question": "An attacker floods a web server with an overwhelming volume of traffic from thousands of compromised devices, making the service unavailable to legitimate users. This is an example of a:", "options": ["Distributed Denial of Service (DDoS) attack", "SQL injection attack", "Phishing attack", "Man-in-the-Middle (MITM) attack"], "correct_idx": 0, "explanation": "A Distributed Denial of Service (DDoS) attack uses a large number of compromised devices (a botnet) to send massive traffic to a target simultaneously, overwhelming the system so legitimate users cannot access the service - impacting Availability.", "short_explanation_en": "A Distributed Denial of Service (DDoS) attack uses a large number of compromised devices (a botnet) to send massive traffic to a target simultaneously, overwhelming the system so legitimate users cannot access the service - impacting Availability.", "question_th": "ผู้โจมตีท่วมเว็บเซิร์ฟเวอร์ด้วยปริมาณทราฟฟิกมหาศาลจากอุปกรณ์ที่ถูกยึดครองนับพันเครื่อง ทำให้บริการไม่พร้อมใช้งานสำหรับผู้ใช้ที่ถูกต้องตามกฎหมาย นี่เป็นตัวอย่างของ:", "options_th": ["การโจมตีแบบ Distributed Denial of Service (DDoS)", "การโจมตีแบบ SQL injection", "การโจมตีแบบ Phishing", "การโจมตีแบบ Man-in-the-Middle (MITM)"], "explanation_th": "การโจมตีแบบ Distributed Denial of Service (DDoS) ใช้อุปกรณ์จำนวนมากที่ถูกยึดครอง (บอตเน็ต) ส่งทราฟฟิกจำนวนมหาศาลไปยังเป้าหมายพร้อมกัน จนระบบไม่สามารถรองรับผู้ใช้งานที่ถูกต้องตามกฎหมายได้ ส่งผลให้บริการไม่พร้อมใช้งาน (Availability ถูกกระทบ)"}, {"id": 538, "dom": 4, "question": "An attacker intercepts communication between two parties who believe they are communicating directly with each other, potentially altering the data in transit. This is known as a:", "options": ["Rainbow table attack", "Man-in-the-Middle (MITM) attack", "Brute-force attack", "Denial of Service (DoS) attack"], "correct_idx": 1, "explanation": "Man-in-the-Middle (MITM) is an attack where a bad actor inserts themselves between two communicating parties without either party knowing, allowing them to eavesdrop or even alter data in transit. Strong encryption, such as TLS, helps reduce this risk.", "short_explanation_en": "Man-in-the-Middle (MITM) is an attack where a bad actor inserts themselves between two communicating parties without either party knowing, allowing them to eavesdrop or even alter data in transit. Strong encryption, such as TLS, helps reduce this risk.", "question_th": "ผู้โจมตีดักจับการสื่อสารระหว่างสองฝ่ายที่เชื่อว่ากำลังสื่อสารกันโดยตรง และอาจแก้ไขข้อมูลระหว่างทาง นี่เรียกว่า:", "options_th": ["การโจมตีแบบ Rainbow table", "การโจมตีแบบ Man-in-the-Middle (MITM)", "การโจมตีแบบ Brute-force", "การโจมตีแบบ Denial of Service (DoS)"], "explanation_th": "Man-in-the-Middle (MITM) คือการโจมตีที่ผู้ไม่หวังดีแทรกตัวอยู่ระหว่างการสื่อสารของสองฝ่ายโดยที่ทั้งสองฝ่ายไม่รู้ตัว ทำให้สามารถดักอ่านหรือแม้แต่แก้ไขข้อมูลระหว่างทางได้ การใช้การเข้ารหัสที่แข็งแรง เช่น TLS ช่วยลดความเสี่ยงจากการโจมตีประเภทนี้ได้"}, {"id": 539, "dom": 4, "question": "Which type of attack involves sending fraudulent emails that appear to come from a trusted source, in order to trick users into revealing sensitive information?", "options": ["Phishing", "ARP spoofing", "DDoS", "SQL injection"], "correct_idx": 0, "explanation": "Phishing is a social engineering attack that sends fraudulent emails or messages appearing to come from a trustworthy source, tricking victims into revealing sensitive information, such as passwords, or clicking a malicious link.", "short_explanation_en": "Phishing is a social engineering attack that sends fraudulent emails or messages appearing to come from a trustworthy source, tricking victims into revealing sensitive information, such as passwords, or clicking a malicious link.", "question_th": "การโจมตีประเภทใดที่เกี่ยวข้องกับการส่งอีเมลหลอกลวงที่ดูเหมือนมาจากแหล่งที่น่าเชื่อถือ เพื่อหลอกให้ผู้ใช้เปิดเผยข้อมูลที่อ่อนไหว?", "options_th": ["Phishing", "ARP spoofing", "DDoS", "SQL injection"], "explanation_th": "Phishing คือการโจมตีทางวิศวกรรมสังคม (social engineering) โดยการส่งอีเมลหรือข้อความหลอกลวงที่ดูเหมือนมาจากแหล่งที่น่าเชื่อถือ เพื่อหลอกให้เหยื่อเปิดเผยข้อมูลที่ละเอียดอ่อน เช่น รหัสผ่าน หรือคลิกลิงก์ที่เป็นอันตราย"}, {"id": 540, "dom": 4, "question": "Which server sits between clients and the internet, forwarding requests on behalf of clients and potentially caching content or filtering traffic?", "options": ["Proxy server", "DNS server", "DHCP server", "Domain controller"], "correct_idx": 0, "explanation": "A Proxy Server acts as an intermediary between client machines and the internet, forwarding requests on the client's behalf. It may be used to cache content for faster loading, filter inappropriate traffic, or hide the organization's internal IP addresses from outside.", "short_explanation_en": "A Proxy Server acts as an intermediary between client machines and the internet, forwarding requests on the client's behalf. It may be used to cache content for faster loading, filter inappropriate traffic, or hide the organization's internal IP addresses from outside.", "question_th": "เซิร์ฟเวอร์ใดที่วางอยู่ระหว่างไคลเอนต์กับอินเทอร์เน็ต ส่งต่อคำขอในนามของไคลเอนต์ และอาจแคชเนื้อหาหรือกรองทราฟฟิก?", "options_th": ["Proxy server", "DNS server", "DHCP server", "Domain controller"], "explanation_th": "Proxy Server ทำหน้าที่เป็นตัวกลางระหว่างเครื่องไคลเอนต์กับอินเทอร์เน็ต โดยส่งต่อคำขอแทนไคลเอนต์ อาจใช้เพื่อแคชเนื้อหาให้โหลดเร็วขึ้น กรองทราฟฟิกที่ไม่เหมาะสม หรือซ่อน IP address ภายในองค์กรจากภายนอก ช่วยเพิ่มทั้งประสิทธิภาพและความปลอดภัย"}, {"id": 541, "dom": 4, "question": "Which protocol translates human-readable domain names (like example.com) into IP addresses that computers use to locate each other on a network?", "options": ["Dynamic Host Configuration Protocol (DHCP)", "Simple Mail Transfer Protocol (SMTP)", "Address Resolution Protocol (ARP)", "Domain Name System (DNS)"], "correct_idx": 3, "explanation": "DNS (Domain Name System) translates human-readable domain names, such as example.com, into the IP addresses computers use to locate and connect to each other on a network. Without DNS, users would need to memorize IP numbers instead of website names.", "short_explanation_en": "DNS (Domain Name System) translates human-readable domain names, such as example.com, into the IP addresses computers use to locate and connect to each other on a network. Without DNS, users would need to memorize IP numbers instead of website names.", "question_th": "โปรโตคอลใดที่แปลงชื่อโดเมนที่มนุษย์อ่านเข้าใจง่าย (เช่น example.com) ให้เป็น IP address ที่คอมพิวเตอร์ใช้ค้นหากันบนเครือข่าย?", "options_th": ["Dynamic Host Configuration Protocol (DHCP)", "Simple Mail Transfer Protocol (SMTP)", "Address Resolution Protocol (ARP)", "Domain Name System (DNS)"], "explanation_th": "DNS (Domain Name System) ทำหน้าที่แปลงชื่อโดเมนที่มนุษย์อ่านเข้าใจง่าย เช่น example.com ให้กลายเป็นหมายเลข IP address ที่คอมพิวเตอร์ใช้ในการค้นหาและเชื่อมต่อกันบนเครือข่าย หากปราศจาก DNS ผู้ใช้จะต้องจดจำหมายเลข IP แทนชื่อเว็บไซต์"}, {"id": 542, "dom": 4, "question": "Which network design principle involves dividing a network into smaller, isolated subnetworks to limit the spread of an attack if one segment is compromised?", "options": ["Load balancing", "Port forwarding", "Network Address Translation", "Network segmentation"], "correct_idx": 3, "explanation": "Network Segmentation divides a large network into smaller, isolated subnetworks to limit the scope of damage if one segment is compromised. An attacker who breaches one segment cannot easily spread to others, limiting impact and containing threat propagation.", "short_explanation_en": "Network Segmentation divides a large network into smaller, isolated subnetworks to limit the scope of damage if one segment is compromised. An attacker who breaches one segment cannot easily spread to others, limiting impact and containing threat propagation.", "question_th": "หลักการออกแบบเครือข่ายใดที่เกี่ยวข้องกับการแบ่งเครือข่ายออกเป็นเครือข่ายย่อยที่เล็กกว่าและแยกจากกัน เพื่อจำกัดการแพร่กระจายของการโจมตีหากส่วนใดถูกบุกรุก?", "options_th": ["Load balancing", "Port forwarding", "Network Address Translation", "Network segmentation"], "explanation_th": "Network Segmentation คือการแบ่งเครือข่ายใหญ่ออกเป็นเครือข่ายย่อยที่แยกจากกัน เพื่อจำกัดขอบเขตความเสียหายหากส่วนใดส่วนหนึ่งถูกโจมตี ผู้โจมตีที่เจาะเข้าไปในเครือข่ายย่อยหนึ่งจะไม่สามารถแพร่กระจายไปยังส่วนอื่นได้โดยง่าย ช่วยจำกัดผลกระทบและควบคุมการแพร่ระบาดของภัยคุกคาม"}, {"id": 543, "dom": 4, "question": "Which device distributes incoming network traffic across multiple servers to improve performance and ensure availability?", "options": ["Repeater", "Load balancer", "Switch", "Firewall"], "correct_idx": 1, "explanation": "A Load Balancer distributes incoming traffic across multiple servers so no single server bears too much load, improving performance, reducing latency, and increasing overall system Availability. If one server fails, traffic is redirected to others.", "short_explanation_en": "A Load Balancer distributes incoming traffic across multiple servers so no single server bears too much load, improving performance, reducing latency, and increasing overall system Availability. If one server fails, traffic is redirected to others.", "question_th": "อุปกรณ์ใดที่กระจายทราฟฟิกเครือข่ายขาเข้าไปยังเซิร์ฟเวอร์หลายเครื่อง เพื่อปรับปรุงประสิทธิภาพและรับประกันความพร้อมใช้งาน?", "options_th": ["Repeater", "Load balancer", "Switch", "Firewall"], "explanation_th": "Load Balancer ทำหน้าที่กระจายทราฟฟิกที่เข้ามายังเซิร์ฟเวอร์หลายเครื่อง เพื่อไม่ให้เซิร์ฟเวอร์เครื่องใดเครื่องหนึ่งรับภาระมากเกินไป ช่วยเพิ่มประสิทธิภาพการทำงาน ลดความหน่วง และเพิ่มความพร้อมใช้งาน (Availability) ของระบบโดยรวม หากเซิร์ฟเวอร์หนึ่งล้มเหลว ทราฟฟิกจะถูกส่งไปยังเซิร์ฟเวอร์อื่นแทน"}, {"id": 544, "dom": 4, "question": "Which of the following describes 'Software as a Service' (SaaS) in cloud computing?", "options": ["A platform providing tools for customers to develop and deploy their own applications", "Raw computing infrastructure such as virtual machines and storage", "A private data center owned entirely by the customer", "A fully managed application accessed via a web browser, such as webmail or online office suites"], "correct_idx": 3, "explanation": "Software as a Service (SaaS) is a cloud model where the provider manages the entire application, and users simply access it through a web browser without installing or maintaining the system themselves - such as webmail or online office suites, unlike IaaS (infrastructure only) or PaaS (a platform for building applications).", "short_explanation_en": "Software as a Service (SaaS) is a cloud model where the provider manages the entire application, and users simply access it through a web browser without installing or maintaining the system themselves - such as webmail or online office suites, unlike IaaS (infrastructure only) or PaaS (a platform for building applications).", "question_th": "ข้อใดอธิบาย 'Software as a Service' (SaaS) ในระบบคลาวด์คอมพิวติ้ง?", "options_th": ["แพลตฟอร์มที่ให้เครื่องมือสำหรับลูกค้าในการพัฒนาและปรับใช้แอปพลิเคชันของตนเอง", "โครงสร้างพื้นฐานคอมพิวเตอร์ดิบ เช่น เครื่องเสมือนและพื้นที่จัดเก็บ", "ศูนย์ข้อมูลส่วนตัวที่เป็นเจ้าของทั้งหมดโดยลูกค้า", "แอปพลิเคชันที่ได้รับการจัดการอย่างสมบูรณ์ที่เข้าถึงผ่านเว็บเบราว์เซอร์ เช่น เว็บเมลหรือชุดโปรแกรมสำนักงานออนไลน์"], "explanation_th": "Software as a Service (SaaS) คือรูปแบบคลาวด์ที่ผู้ให้บริการจัดการแอปพลิเคชันทั้งหมดให้ ผู้ใช้เพียงเข้าถึงผ่านเว็บเบราว์เซอร์โดยไม่ต้องติดตั้งหรือดูแลรักษาระบบเอง เช่น เว็บเมลหรือโปรแกรมสำนักงานออนไลน์ ต่างจาก IaaS ที่ให้เพียงโครงสร้างพื้นฐาน หรือ PaaS ที่ให้แพลตฟอร์มสำหรับพัฒนาแอปพลิเคชัน"}, {"id": 545, "dom": 4, "question": "An attacker sends forged ARP messages to associate their own MAC address with the IP address of a legitimate device on the local network, intercepting traffic intended for that device. This attack is known as:", "options": ["Buffer overflow", "SQL injection", "ARP spoofing (ARP poisoning)", "DNS spoofing"], "correct_idx": 2, "explanation": "ARP Spoofing (or ARP Poisoning) forges ARP messages to associate the attacker's MAC address with the IP address of a legitimate device on the local network, causing traffic intended for that device to be routed to the attacker instead - commonly used as the first step of a Man-in-the-Middle attack.", "short_explanation_en": "ARP Spoofing (or ARP Poisoning) forges ARP messages to associate the attacker's MAC address with the IP address of a legitimate device on the local network, causing traffic intended for that device to be routed to the attacker instead - commonly used as the first step of a Man-in-the-Middle attack.", "question_th": "ผู้โจมตีส่งข้อความ ARP ปลอมเพื่อเชื่อมโยง MAC address ของตนเองเข้ากับ IP address ของอุปกรณ์ที่ถูกต้องในเครือข่ายท้องถิ่น เพื่อดักจับทราฟฟิกที่มุ่งหมายไปยังอุปกรณ์นั้น การโจมตีนี้เรียกว่า:", "options_th": ["Buffer overflow", "SQL injection", "ARP spoofing (ARP poisoning)", "DNS spoofing"], "explanation_th": "ARP Spoofing (หรือ ARP Poisoning) คือการปลอมแปลงข้อความ ARP เพื่อเชื่อมโยง MAC address ของผู้โจมตีเข้ากับ IP address ของอุปกรณ์ที่ถูกต้องในเครือข่ายท้องถิ่น ทำให้ทราฟฟิกที่ควรจะส่งไปยังอุปกรณ์นั้นถูกส่งมาที่ผู้โจมตีแทน ซึ่งมักใช้เป็นขั้นตอนแรกของการโจมตีแบบ Man-in-the-Middle"}, {"id": 546, "dom": 4, "question": "Which security architecture principle involves implementing multiple, overlapping layers of security controls so that if one layer fails, others still provide protection?", "options": ["Least Privilege", "Zero Trust", "Defense in Depth", "Single point of failure"], "correct_idx": 2, "explanation": "Defense in Depth involves layering multiple overlapping security measures - such as firewalls, intrusion detection, encryption, and access control - so that if one layer fails, others continue to provide protection, increasing the difficulty and cost for an attacker to succeed.", "short_explanation_en": "Defense in Depth involves layering multiple overlapping security measures - such as firewalls, intrusion detection, encryption, and access control - so that if one layer fails, others continue to provide protection, increasing the difficulty and cost for an attacker to succeed.", "question_th": "หลักการสถาปัตยกรรมความปลอดภัยใดที่เกี่ยวข้องกับการนำมาตรการควบคุมความปลอดภัยหลายชั้นที่ซ้อนทับกันมาใช้ เพื่อให้หากชั้นหนึ่งล้มเหลว ชั้นอื่นยังคงให้การป้องกันอยู่?", "options_th": ["Least Privilege", "Zero Trust", "Defense in Depth", "Single point of failure"], "explanation_th": "Defense in Depth คือแนวคิดการวางมาตรการความปลอดภัยหลายชั้นซ้อนกัน เช่น ไฟร์วอลล์ ระบบตรวจจับการบุกรุก การเข้ารหัส และการควบคุมการเข้าถึง เพื่อให้หากชั้นป้องกันหนึ่งล้มเหลว ยังมีชั้นอื่นคอยป้องกันอยู่ ช่วยเพิ่มความยากและต้นทุนที่ผู้โจมตีต้องใช้ในการเจาะระบบให้สำเร็จ"}, {"id": 547, "dom": 4, "question": "Which type of firewall makes filtering decisions based on the state and context of active connections, rather than examining each packet in isolation?", "options": ["Stateful inspection firewall", "Packet-filtering firewall", "Circuit-level gateway only", "Proxy-only firewall"], "correct_idx": 0, "explanation": "A Stateful Inspection Firewall tracks the state of active connections (such as a TCP handshake) and uses that context to make filtering decisions, making it more accurate and secure than a basic packet-filtering firewall, which examines each packet in isolation without context.", "short_explanation_en": "A Stateful Inspection Firewall tracks the state of active connections (such as a TCP handshake) and uses that context to make filtering decisions, making it more accurate and secure than a basic packet-filtering firewall, which examines each packet in isolation without context.", "question_th": "ไฟร์วอลล์ประเภทใดที่ตัดสินใจกรองทราฟฟิกตามสถานะและบริบทของการเชื่อมต่อที่กำลังดำเนินอยู่ แทนที่จะตรวจสอบแต่ละแพ็กเก็ตแยกจากกัน?", "options_th": ["Stateful inspection firewall", "Packet-filtering firewall", "Circuit-level gateway เท่านั้น", "Proxy-only firewall"], "explanation_th": "Stateful Inspection Firewall ติดตามสถานะของการเชื่อมต่อที่กำลังดำเนินอยู่ (เช่น การจับมือ TCP) และใช้บริบทนั้นในการตัดสินใจกรองทราฟฟิก ทำให้แม่นยำและปลอดภัยกว่าไฟร์วอลล์แบบกรองแพ็กเก็ตพื้นฐาน (packet-filtering) ที่พิจารณาแต่ละแพ็กเก็ตแยกจากกันโดยไม่มีบริบท"}, {"id": 548, "dom": 5, "question": "Which type of malware secretly encrypts a victim's files and demands payment for the decryption key?", "options": ["Rootkit", "Ransomware", "Adware", "Spyware"], "correct_idx": 1, "explanation": "Ransomware secretly encrypts a victim's files and demands payment for the decryption key. Without prior backups, victims may permanently lose their data or feel pressured to pay, with no guarantee the data will actually be recovered.", "short_explanation_en": "Ransomware secretly encrypts a victim's files and demands payment for the decryption key. Without prior backups, victims may permanently lose their data or feel pressured to pay, with no guarantee the data will actually be recovered.", "question_th": "มัลแวร์ประเภทใดที่เข้ารหัสไฟล์ของเหยื่ออย่างลับ ๆ แล้วเรียกร้องค่าไถ่เพื่อแลกกับกุญแจถอดรหัส?", "options_th": ["Rootkit", "Ransomware", "Adware", "Spyware"], "explanation_th": "Ransomware คือมัลแวร์ที่เข้ารหัสไฟล์ของเหยื่ออย่างลับ ๆ แล้วเรียกร้องค่าไถ่เพื่อแลกกับกุญแจถอดรหัส หากไม่มีการสำรองข้อมูลไว้ล่วงหน้า เหยื่ออาจสูญเสียข้อมูลถาวรหรือถูกบังคับให้จ่ายเงินให้ผู้โจมตี ซึ่งไม่มีการรับประกันว่าจะได้ข้อมูลคืนจริง"}, {"id": 549, "dom": 5, "question": "Which type of malware disguises itself as legitimate software to trick users into installing it, without self-replicating like a virus?", "options": ["Logic bomb", "Worm", "Trojan horse", "Botnet"], "correct_idx": 2, "explanation": "A Trojan horse disguises itself as legitimate or useful software to trick users into installing it themselves. Unlike a virus or worm, it does not self-replicate or spread to other systems on its own.", "short_explanation_en": "A Trojan horse disguises itself as legitimate or useful software to trick users into installing it themselves. Unlike a virus or worm, it does not self-replicate or spread to other systems on its own.", "question_th": "มัลแวร์ประเภทใดที่ปลอมตัวเป็นซอฟต์แวร์ถูกกฎหมายเพื่อหลอกให้ผู้ใช้ติดตั้ง โดยไม่แพร่กระจายตัวเองเหมือนไวรัส?", "options_th": ["Logic bomb", "Worm", "Trojan horse", "Botnet"], "explanation_th": "Trojan Horse (โทรจัน (Trojan Horse)) คือมัลแวร์ที่ปลอมตัวเป็นซอฟต์แวร์ที่ดูปกติหรือมีประโยชน์ เพื่อหลอกล่อให้ผู้ใช้ติดตั้งเอง โดยตัวมันเองไม่มีความสามารถในการแพร่กระจายตัวเองไปยังระบบอื่นเหมือนไวรัสหรือเวิร์ม (worm) ต่างจาก Worm ที่สามารถแพร่กระจายผ่านเครือข่ายได้ด้วยตัวเอง"}, {"id": 550, "dom": 5, "question": "Which type of malware can self-replicate and spread across a network WITHOUT requiring a host file or user interaction?", "options": ["Trojan horse", "Adware", "Worm", "Keylogger"], "correct_idx": 2, "explanation": "A Worm can self-replicate and spread across a network automatically, without needing a host file or any user interaction, unlike a typical virus which requires a host program to spread.", "short_explanation_en": "A Worm can self-replicate and spread across a network automatically, without needing a host file or any user interaction, unlike a typical virus which requires a host program to spread.", "question_th": "มัลแวร์ประเภทใดที่สามารถแพร่กระจายตัวเองผ่านเครือข่ายได้โดยไม่ต้องอาศัยไฟล์โฮสต์หรือการกระทำของผู้ใช้?", "options_th": ["Trojan horse", "Adware", "Worm", "Keylogger"], "explanation_th": "Worm (เวิร์ม) เป็นมัลแวร์ที่สามารถแพร่กระจายตัวเองผ่านเครือข่ายไปยังเครื่องอื่นได้โดยอัตโนมัติ โดยไม่จำเป็นต้องอาศัยไฟล์โฮสต์หรือการกระทำของผู้ใช้เหมือนไวรัสทั่วไป ทำให้สามารถแพร่ระบาดได้อย่างรวดเร็วในวงกว้าง"}, {"id": 551, "dom": 5, "question": "Which social engineering technique involves an attacker following an authorized employee through a secured door without using their own credentials?", "options": ["Baiting", "Phishing", "Pretexting", "Tailgating (piggybacking)"], "correct_idx": 3, "explanation": "Tailgating (or piggybacking) is when an attacker follows an authorized employee through a secured door without using their own credentials, often exploiting social courtesy like someone holding the door open.", "short_explanation_en": "Tailgating (or piggybacking) is when an attacker follows an authorized employee through a secured door without using their own credentials, often exploiting social courtesy like someone holding the door open.", "question_th": "เทคนิควิศวกรรมสังคมใดที่ผู้โจมตีเดินตามพนักงานที่ได้รับอนุญาตผ่านประตูที่มีการรักษาความปลอดภัย โดยไม่ใช้ข้อมูลรับรองของตนเอง?", "options_th": ["Baiting", "Phishing", "Pretexting", "Tailgating (piggybacking)"], "explanation_th": "Tailgating หรือ Piggybacking คือเทคนิควิศวกรรมสังคมที่ผู้โจมตีเดินตามพนักงานที่ได้รับอนุญาตเข้าประตูที่มีการรักษาความปลอดภัย โดยไม่ต้องใช้บัตรผ่านหรือข้อมูลรับรองของตนเอง มักอาศัยมารยาททางสังคม เช่น การถือประตูให้ผู้อื่น เพื่อเข้าถึงพื้นที่หวงห้ามได้"}, {"id": 552, "dom": 5, "question": "An attacker creates a fabricated scenario, such as pretending to be IT support, to trick an employee into revealing their password over the phone. This technique is called:", "options": ["Pretexting", "Dumpster diving", "Tailgating", "Baiting"], "correct_idx": 0, "explanation": "Pretexting is creating a fabricated scenario or false identity - such as posing as IT support - to manipulate a victim into revealing sensitive information like a password.", "short_explanation_en": "Pretexting is creating a fabricated scenario or false identity - such as posing as IT support - to manipulate a victim into revealing sensitive information like a password.", "question_th": "ผู้โจมตีสร้างสถานการณ์สมมติขึ้น เช่น แสร้งเป็นเจ้าหน้าที่ฝ่าย IT เพื่อหลอกให้พนักงานเปิดเผยรหัสผ่านทางโทรศัพท์ เทคนิคนี้เรียกว่าอะไร?", "options_th": ["Pretexting", "Dumpster diving", "Tailgating", "Baiting"], "explanation_th": "Pretexting คือการสร้างสถานการณ์หรือเรื่องราวสมมติขึ้นมา เช่น การอ้างตัวเป็นเจ้าหน้าที่ฝ่าย IT เพื่อหลอกล่อให้เหยื่อเปิดเผยข้อมูลที่ละเอียดอ่อน เช่น รหัสผ่าน โดยอาศัยความน่าเชื่อถือของบทบาทปลอมนั้นในการโน้มน้าวเหยื่อ"}, {"id": 553, "dom": 5, "question": "Which social engineering attack involves leaving an infected USB drive in a location where an employee is likely to find and plug it into their computer?", "options": ["Phishing", "Baiting", "Tailgating", "Vishing"], "correct_idx": 1, "explanation": "Baiting uses a tempting lure - such as an infected USB drive left where a curious employee might find and plug it in - to trigger malware execution once connected.", "short_explanation_en": "Baiting uses a tempting lure - such as an infected USB drive left where a curious employee might find and plug it in - to trigger malware execution once connected.", "question_th": "การโจมตีทางวิศวกรรมสังคมใดที่วางอุปกรณ์ USB ที่ติดมัลแวร์ไว้ในจุดที่คาดว่าพนักงานจะพบและนำไปเสียบเข้ากับคอมพิวเตอร์?", "options_th": ["Phishing", "Baiting", "Tailgating", "Vishing"], "explanation_th": "Baiting คือเทคนิควิศวกรรมสังคมที่ใช้สิ่งล่อใจ เช่น อุปกรณ์ USB ที่ติดมัลแวร์ วางไว้ในจุดที่คาดว่าเหยื่อจะพบและนำไปเสียบเข้ากับคอมพิวเตอร์ด้วยความอยากรู้อยากเห็น เมื่อเสียบแล้วมัลแวร์จะทำงานทันทีและอาจแพร่กระจายเข้าสู่ระบบขององค์กร"}, {"id": 554, "dom": 5, "question": "Which data classification level is typically reserved for information that, if disclosed, would cause exceptionally grave damage to national security or the organization?", "options": ["Internal Use Only", "Public", "Unclassified", "Top Secret (or Highly Confidential)"], "correct_idx": 3, "explanation": "The highest classification level, such as Top Secret or Highly Confidential, is reserved for information whose disclosure would cause exceptionally grave damage to national security or the organization, requiring the strictest access controls.", "short_explanation_en": "The highest classification level, such as Top Secret or Highly Confidential, is reserved for information whose disclosure would cause exceptionally grave damage to national security or the organization, requiring the strictest access controls.", "question_th": "ระดับการจัดประเภทข้อมูลใดที่ปกติสงวนไว้สำหรับข้อมูลที่หากรั่วไหลจะสร้างความเสียหายร้ายแรงอย่างยิ่งต่อความมั่นคงของชาติหรือองค์กร?", "options_th": ["Internal Use Only", "Public", "Unclassified", "Top Secret (or Highly Confidential)"], "explanation_th": "ระดับชั้นความลับสูงสุด เช่น Top Secret หรือ Highly Confidential สงวนไว้สำหรับข้อมูลที่หากรั่วไหลจะสร้างความเสียหายร้ายแรงอย่างยิ่งต่อความมั่นคงของชาติหรือองค์กร จึงต้องมีมาตรการควบคุมการเข้าถึงที่เข้มงวดที่สุดเมื่อเทียบกับข้อมูลระดับอื่น"}, {"id": 555, "dom": 5, "question": "Which of the following BEST describes data classified as 'Public'?", "options": ["Information that requires the highest level of protection", "Information that must always be encrypted at rest", "Information that can be freely disclosed to anyone without causing harm to the organization", "Information accessible only to senior executives"], "correct_idx": 2, "explanation": "'Public' classified data can be freely disclosed to anyone without causing harm to the organization, such as press releases or public website content - it requires the least protection compared to other classification levels.", "short_explanation_en": "'Public' classified data can be freely disclosed to anyone without causing harm to the organization, such as press releases or public website content - it requires the least protection compared to other classification levels.", "question_th": "ข้อใดอธิบายข้อมูลที่จัดประเภทเป็น 'Public' ได้ดีที่สุด?", "options_th": ["ข้อมูลที่ต้องการการป้องกันระดับสูงสุด", "ข้อมูลที่ต้องเข้ารหัสตลอดเวลาที่จัดเก็บ", "ข้อมูลที่สามารถเปิดเผยต่อสาธารณะได้อย่างอิสระโดยไม่ก่อความเสียหายต่อองค์กร", "ข้อมูลที่เข้าถึงได้เฉพาะผู้บริหารระดับสูงเท่านั้น"], "explanation_th": "ข้อมูลระดับ Public คือข้อมูลที่สามารถเปิดเผยต่อสาธารณะได้อย่างอิสระโดยไม่ก่อให้เกิดความเสียหายต่อองค์กร เช่น ข่าวประชาสัมพันธ์หรือข้อมูลบนเว็บไซต์สาธารณะ จึงต้องการมาตรการป้องกันน้อยที่สุดเมื่อเทียบกับข้อมูลระดับอื่น เช่น Confidential หรือ Top Secret"}, {"id": 556, "dom": 5, "question": "Which term describes data that is actively being processed by an application in a computer's memory (RAM)?", "options": ["Data in transit", "Data in archive", "Data in use", "Data at rest"], "correct_idx": 2, "explanation": "'Data in Use' refers to data actively being processed in an application's memory (RAM) at that moment - distinct from Data at Rest (stored, e.g. on a hard disk) and Data in Transit (moving across a network).", "short_explanation_en": "'Data in Use' refers to data actively being processed in an application's memory (RAM) at that moment - distinct from Data at Rest (stored, e.g. on a hard disk) and Data in Transit (moving across a network).", "question_th": "คำใดอธิบายข้อมูลที่กำลังถูกประมวลผลโดยแอปพลิเคชันในหน่วยความจำของคอมพิวเตอร์ (RAM)?", "options_th": ["Data in transit", "Data in archive", "Data in use", "Data at rest"], "explanation_th": "Data in Use หมายถึงข้อมูลที่กำลังถูกประมวลผลอยู่ในหน่วยความจำ (RAM) ของแอปพลิเคชัน ณ ขณะนั้น ต่างจาก Data at Rest ซึ่งหมายถึงข้อมูลที่จัดเก็บอยู่นิ่ง ๆ เช่น บนฮาร์ดดิสก์ และ Data in Transit ซึ่งหมายถึงข้อมูลที่กำลังถูกส่งผ่านเครือข่าย"}, {"id": 557, "dom": 5, "question": "Which encryption approach uses the SAME key for both encrypting and decrypting data?", "options": ["Hashing", "Symmetric encryption", "Digital signature", "Asymmetric encryption"], "correct_idx": 1, "explanation": "Symmetric encryption uses the same key for both encrypting and decrypting data - fast and well-suited for large volumes of data, but it poses a challenge around securely distributing that shared key.", "short_explanation_en": "Symmetric encryption uses the same key for both encrypting and decrypting data - fast and well-suited for large volumes of data, but it poses a challenge around securely distributing that shared key.", "question_th": "วิธีการเข้ารหัสใดที่ใช้กุญแจเดียวกันทั้งในการเข้ารหัสและถอดรหัสข้อมูล?", "options_th": ["Hashing", "Symmetric encryption", "Digital signature", "Asymmetric encryption"], "explanation_th": "Symmetric Encryption (การเข้ารหัสแบบสมมาตร) ใช้กุญแจเดียวกันทั้งในการเข้ารหัสและถอดรหัสข้อมูล มีความเร็วสูงเหมาะกับการเข้ารหัสข้อมูลปริมาณมาก แต่มีความท้าทายเรื่องการแจกจ่ายกุญแจอย่างปลอดภัย ต่างจาก Asymmetric Encryption ที่ใช้กุญแจคู่ (public/private key) แยกกัน"}, {"id": 558, "dom": 5, "question": "Which encryption approach uses a public key to encrypt data and a mathematically related private key to decrypt it?", "options": ["Steganography", "Asymmetric encryption", "Symmetric encryption", "Hashing"], "correct_idx": 1, "explanation": "Asymmetric encryption uses a mathematically related key pair - a public key to encrypt and a private key to decrypt - allowing the public key to be shared openly since only the private key holder can decrypt the data.", "short_explanation_en": "Asymmetric encryption uses a mathematica
