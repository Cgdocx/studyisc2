แอปพลิเคชันสร้างผลลัพธ์ที่ไม่ได้ตั้งใจซึ่งอาจถูกใช้ประโยชน์ได้"}, {"id": 257, "dom": 4, "question": "In which cloud model does the cloud customer have LESS responsibility over the infrastructure? (★)", "options": ["IaaS", "FaaS", "PaaS", "SaaS"], "correct_idx": 3, "explanation": "In Software as a Service (SaaS), consumers may control user-specific application configuration settings, but neither the underlying application logic nor the infrastructure. In the Function as a Service (FaaS) model, cloud customers deploy application-level functionality (typically as microservices) and are charged only when this functionality is executed. In Platform as a Service (PaaS), the cloud customer does not manage or control the underlying cloud infrastructure (wnich includes the networ", "short_explanation_en": "In Software as a Service (SaaS), consumers may control user-specific application configuration settings, but neither the underlying application logic nor the infrastructure.", "question_th": "ในโมเดลคลาวด์ใดที่ลูกค้าคลาวด์มีความรับผิดชอบน้อยกว่าต่อโครงสร้างพื้นฐาน?", "options_th": ["IaaS", "FaaS", "PaaS", "SaaS"], "explanation_th": "ใน Software as a Service (SaaS) ผู้บริโภคอาจควบคุมการตั้งค่าคอนฟิกแอปพลิเคชันเฉพาะผู้ใช้ แต่ไม่ใช่ตรรกะแอปพลิเคชันพื้นฐานหรือโครงสร้างพื้นฐาน ในโมเดล Function as a Service (FaaS) ลูกค้าคลาวด์ปรับใช้ฟังก์ชันระดับแอปพลิเคชัน"}, {"id": 258, "dom": 1, "question": "Risk Management is:", "options": ["The assessment of the potential impact of a threat.", "The creation of an incident response team.", "The impact and likelihood of a threat.", "The identification, evaluation and prioritization of risks."], "correct_idx": 3, "explanation": "Risk Management is the process of identifying, assessing and mitigating risks (ISC2 Study Guide, chapter 1, module 2). \"Impact and likelihood of a threat\" is a definition of risk. \"Creating an incident response team\" and \"assessing the potential impact of a threat\" can be considered Risk Management actions, but are not in themselves Risk Management.", "short_explanation_en": "Risk Management is the process of identifying, assessing and mitigating risks (ISC2 Study Guide, chapter 1, module 2).", "question_th": "Risk Management คือ:", "options_th": ["การประเมินผลกระทบที่อาจเกิดขึ้นของภัยคุกคาม", "การสร้างทีมตอบสนองต่อเหตุการณ์", "ผลกระทบและความน่าจะเป็นของภัยคุกคาม", "การระบุ ประเมิน และจัดลำดับความสำคัญของความเสี่ยง"], "explanation_th": "Risk Management คือกระบวนการระบุ ประเมิน และลดความเสี่ยง (ISC2 Study Guide บทที่ 1 โมดูล 2) 'ผลกระทบและความน่าจะเป็นของภัยคุกคาม' เป็นนิยามของ risk 'การสร้างทีมตอบสนองต่อเหตุการณ์' และ 'การประเมินผลกระทบที่อาจเกิดขึ้นของภัยคุกคาม' อาจถือเป็นกิจกรรมของ Risk Management แต่ไม่ใช่ Risk Management ในตัวมันเอง"}, {"id": 259, "dom": 1, "question": "Which of the following documents contains elements that are NOT mandatory?", "options": ["Policies", "Guidelines", "Regulations", "Procedures"], "correct_idx": 1, "explanation": "Only guidelines contain elements that may not be mandatory. Compliance with policies, procedures and regulations is mandatory (see ISC2 Study Guide Chapter 1, Module 4).", "short_explanation_en": "Only guidelines contain elements that may not be mandatory. Compliance with policies, procedures and regulations is mandatory (see ISC2 Study Guide Chapter 1, Module 4).", "question_th": "เอกสารใดต่อไปนี้มีองค์ประกอบที่ไม่บังคับ?", "options_th": ["Policies", "Guidelines", "Regulations", "Procedures"], "explanation_th": "มีเพียง guidelines เท่านั้นที่มีองค์ประกอบที่อาจไม่บังคับ การปฏิบัติตามนโยบาย ขั้นตอน และกฎระเบียบเป็นสิ่งบังคับ"}, {"id": 260, "dom": 2, "question": "In which of the following phases of an Incident Recovery Plan are incident responses prioritized?", "options": ["Post-incident Activity", "Detection and Analysis", "Preparation", "Contentment, Eradication, and Recovery"], "correct_idx": 1, "explanation": "Incident responses are prioritized in the Detection and Analysis phase (see the ISC2 Study Guide, Chapter 2, Module 1, under Components of Incident Response). github.com/ayemunhossain", "short_explanation_en": "Incident responses are prioritized in the Detection and Analysis phase (see the ISC2 Study Guide, Chapter 2, Module 1, under Components of Incident Response).", "question_th": "ในขั้นตอนใดของแผนกู้คืนจากเหตุการณ์ที่มีการจัดลำดับความสำคัญของการตอบสนองต่อเหตุการณ์?", "options_th": ["Post-incident Activity", "Detection and Analysis", "Preparation", "Containment, Eradication, and Recovery"], "explanation_th": "การจัดลำดับความสำคัญของการตอบสนองต่อเหตุการณ์เกิดขึ้นในขั้นตอน Detection and Analysis"}, {"id": 261, "dom": 1, "question": "Which security principle states that a user should only have the necessary permission to execute a task?", "options": ["Privileged Accounts", "Separation of Duties", "Least Privilege", "Defense in Depth"], "correct_idx": 2, "explanation": "The principle of Defense in Depth refers to using multiple layers of security. The principle of Least Privilege states that subjects should be given only those privileges required to complete their specific tasks (ISC2 Study Guide Chapter 1, Module 3). Separation of Duties states that no user should ever be given enough privileges to misuse the system. Finally, Privileged Accounts are accounts with permissions beyond those of regular users, such as manager and administrator accounts.", "short_explanation_en": "The principle of Defense in Depth refers to using multiple layers of security.", "question_th": "หลักการความปลอดภัยใดที่ระบุว่าผู้ใช้ควรมีเพียงสิทธิ์ที่จำเป็นในการปฏิบัติงานเท่านั้น?", "options_th": ["Privileged Accounts", "Separation of Duties", "Least Privilege", "Defense in Depth"], "explanation_th": "หลักการ Defense in Depth หมายถึงการใช้ความปลอดภัยหลายชั้น หลักการ Least Privilege ระบุว่าผู้ใช้ควรได้รับเพียงสิทธิ์ที่จำเป็นต่อการทำงานเฉพาะของตนเท่านั้น Separation of Duties ระบุว่าไม่ควรให้ผู้ใช้คนใดมีสิทธิ์เพียงพอที่จะใช้ระบบในทางที่ผิด และ Privileged Accounts คือบัญชีที่มีสิทธิ์เกินกว่าผู้ใช้ทั่วไป เช่น บัญชีผู้จัดการและผู้ดูแลระบบ"}, {"id": 262, "dom": 3, "question": "The Bell and LaPadula access control model is a form of: (★)", "options": ["ABAC", "RBAC", "MAC", "DAC"], "correct_idx": 2, "explanation": "The Bell and LaPadula access control model arranges subjects and objects into security levels and defines access specifications, whereby subjects can only access objects at certain levels based on their security level. Typical access specifications can be things like \"Unclassified personnel cannot read data at confidential levels\" or \"Top-Secret data cannot be written into the files at unclassified levels\". Since subjects cannot change access specifications, this model is a form of mandatory acc", "short_explanation_en": "The Bell and LaPadula access control model arranges subjects and objects into security levels and defines access specifications, whereby subjects can only access objects at certain levels based on their security level.", "question_th": "โมเดลควบคุมการเข้าถึง Bell and LaPadula เป็นรูปแบบหนึ่งของ:", "options_th": ["ABAC", "RBAC", "MAC", "DAC"], "explanation_th": "โมเดล Bell and LaPadula จัดเรียง subjects และ objects เข้าสู่ระดับความปลอดภัยและกำหนดข้อกำหนดการเข้าถึง โดย subjects สามารถเข้าถึง objects ที่ระดับบางระดับตามระดับความปลอดภัยของตนเท่านั้น เนื่องจาก subjects ไม่สามารถเปลี่ยนข้อกำหนดการเข้าถึงได้ โมเดลนี้จึงเป็นรูปแบบหนึ่งของ mandatory access control"}, {"id": 263, "dom": 1, "question": "In risk management, the highest priority is given to a risk where:", "options": ["The frequency of occurrence is low, and the expected impact value is high", "The expected probability of occurrence is low, and the potential impact is low", "The expected probability of occurrence is high, and the potential impact is low", "The frequency of occurrence is high, and the expected impact value is low"], "correct_idx": 0, "explanation": "The highest priority is given to risks estimated to have high impact and low probability over high probability and low impact value (ISC2 Study Guide, Chapter 1, Module 2). In qualitative risk analysis, the 'expected probability of occurrence' and the 'frequency of occurrence' refer to the same thing. The same goes for the concepts of expected impact value (NIST SP 800-30 Rev. 1 under Impact Value) and potential impact (NIST SP 800-60 Vol. 1 Rev. 1 under Potential Impact).", "short_explanation_en": "The highest priority is given to risks estimated to have high impact and low probability over high probability and low impact value (ISC2 Study Guide, Chapter 1, Module 2).", "question_th": "ในการบริหารความเสี่ยง ความสำคัญสูงสุดจะให้กับความเสี่ยงที่:", "options_th": ["ความถี่ในการเกิดขึ้นต่ำ และค่าผลกระทบที่คาดว่าจะเกิดขึ้นสูง", "ความน่าจะเป็นที่คาดว่าจะเกิดขึ้นต่ำ และผลกระทบที่อาจเกิดขึ้นต่ำ", "ความน่าจะเป็นที่คาดว่าจะเกิดขึ้นสูง และผลกระทบที่อาจเกิดขึ้นต่ำ", "ความถี่ในการเกิดขึ้นสูง และค่าผลกระทบที่คาดว่าจะเกิดขึ้นต่ำ"], "explanation_th": "ความสำคัญสูงสุดให้กับความเสี่ยงที่ประเมินว่ามีผลกระทบสูงและความน่าจะเป็นต่ำ มากกว่าความน่าจะเป็นสูงและผลกระทบต่ำ ในการวิเคราะห์ความเสี่ยงเชิงคุณภาพ 'ความน่าจะเป็นที่คาดว่าจะเกิดขึ้น' และ 'ความถี่ในการเกิดขึ้น' หมายถึงสิ่งเดียวกัน"}, {"id": 264, "dom": 1, "question": "Which of the following areas is connected to PII?", "options": ["Non-Repudiation", "Authentication", "Integrity", "Confidentiality"], "correct_idx": 3, "explanation": "Confidentiality is the most distinctive property of personally identifiable information (see ISC2 study guide, Module 1, under CIA Deep Dive). The remaining options apply to all types of data. All data requires integrity to be usable. Non- repudiation refers to the inability to deny the production, approval, or transmission of information. Authentication refers to the access to information. github.com/ayemunhossain", "short_explanation_en": "Confidentiality is the most distinctive property of personally identifiable information (see ISC2 study guide, Module 1, under CIA Deep Dive).", "question_th": "พื้นที่ใดต่อไปนี้เกี่ยวข้องกับ PII?", "options_th": ["Non-Repudiation", "Authentication", "Integrity", "Confidentiality"], "explanation_th": "Confidentiality เป็นคุณสมบัติที่โดดเด่นที่สุดของข้อมูลที่สามารถระบุตัวตนบุคคลได้ (PII) ตัวเลือกที่เหลือใช้กับข้อมูลทุกประเภท ข้อมูลทั้งหมดต้องการ integrity เพื่อให้ใช้งานได้ Non-repudiation หมายถึงการไม่สามารถปฏิเสธการผลิต การอนุมัติ หรือการส่งข้อมูล Authentication หมายถึงการเข้าถึงข้อมูล"}, {"id": 265, "dom": 1, "question": "According to the canon \"Provide diligent and competent service to principals\", ISC2 professionals are to:", "options": ["Take care not to tarnish the reputation of other professionals through malice or indifference.", "Treat all members fairly and,when resolving conflicts, consider public safety and duties to principals, individuals and the profession, in that order.", "Avoid apparent or actual conflicts of interest.", "Promote the understanding and acceptance of prudent information security measures."], "correct_idx": 2, "explanation": "The direction for applying the ethical principles of ISC2 states that avoiding conflicts of interest or the appearance thereof is a consequence of providing diligent and competent service to principals (see https://resources.infosecinstitute.com/certification/the-isc2-code-of-ethics-a-binding-requirement-for-certification/). The other options are consequences of the remaining three ethical principles.", "short_explanation_en": "The direction for applying the ethical principles of ISC2 states that avoiding conflicts of interest or the appearance thereof is a consequence of providing diligent and competent service to principals (see...", "question_th": "ตามจรรยาบรรณ 'Provide diligent and competent service to principals' ผู้เชี่ยวชาญ ISC2 ต้อง:", "options_th": ["ระมัดระวังไม่ทำให้ชื่อเสียงของผู้เชี่ยวชาญคนอื่นเสียหายด้วยความมุ่งร้ายหรือความเฉยเมย", "ปฏิบัติต่อสมาชิกทุกคนอย่างเป็นธรรม และเมื่อแก้ไขข้อขัดแย้ง ให้พิจารณาความปลอดภัยสาธารณะและหน้าที่ต่อผู้ว่าจ้าง บุคคล และวิชาชีพ ตามลำดับ", "หลีกเลี่ยงความขัดแย้งทางผลประโยชน์ที่ปรากฏหรือเกิดขึ้นจริง", "ส่งเสริมความเข้าใจและการยอมรับมาตรการความปลอดภัยสารสนเทศที่รอบคอบ"], "explanation_th": "แนวทางสำหรับการประยุกต์ใช้หลักจริยธรรมของ ISC2 ระบุว่าการหลีกเลี่ยงความขัดแย้งทางผลประโยชน์หรือลักษณะที่ปรากฏของมันเป็นผลมาจากการให้บริการอย่างขยันขันแข็งและมีความสามารถต่อผู้ว่าจ้าง ตัวเลือกอื่น ๆ เป็นผลมาจากหลักจริยธรรมอีกสามข้อที่เหลือ"}, {"id": 266, "dom": 4, "question": "Malicious emails that aim to attack company executives are an example of:", "options": ["Trojans", "Whaling", "Phishing", "Rootkits"], "correct_idx": 1, "explanation": "Phishing is a digital social engineering attack that uses authentic-looking (but counterfeit) e-mail messages to request information from users, or to get them to unknowingly execute an action that will make way for the attacker. Whaling attacks are phishing attacks that target high-ranking members of organizations. After gaining root-level access to a host, rootkits are used by an attacker to conceal malicious activities while keeping root-level access. Trojans are a type of software that appea", "short_explanation_en": "Phishing is a digital social engineering attack that uses authentic-looking (but counterfeit) e-mail messages to request information from users, or to get them to unknowingly execute an action that will make way for the attacker.", "question_th": "อีเมลที่เป็นอันตรายที่มุ่งเป้าโจมตีผู้บริหารของบริษัทเป็นตัวอย่างของ:", "options_th": ["Trojans", "Whaling", "Phishing", "Rootkits"], "explanation_th": "Phishing คือการโจมตีทางวิศวกรรมสังคมทางดิจิทัลที่ใช้ข้อความอีเมลที่ดูน่าเชื่อถือ (แต่ปลอมแปลง) เพื่อขอข้อมูลจากผู้ใช้ Whaling คือการโจมตีแบบ phishing ที่มุ่งเป้าไปที่สมาชิกระดับสูงขององค์กร"}, {"id": 267, "dom": 1, "question": "Governments can impose financial penalties as a consequence of breaking a:", "options": ["Regulation", "Standard", "Policy", "Procedure"], "correct_idx": 0, "explanation": "Standards are created by governing or professional bodies (not by governments themselves). Policies and procedures are created by organizations, and are therefore not subject to financial penalties (see ISC2 Study Guide Chapter 1, Module 4)", "short_explanation_en": "Standards are created by governing or professional bodies (not by governments themselves).", "question_th": "รัฐบาลสามารถกำหนดบทลงโทษทางการเงินเป็นผลจากการฝ่าฝืน:", "options_th": ["Regulation", "Standard", "Policy", "Procedure"], "explanation_th": "มาตรฐาน (Standards) ถูกสร้างขึ้นโดยหน่วยงานกำกับดูแลหรือวิชาชีพ (ไม่ใช่โดยรัฐบาลเอง) นโยบายและขั้นตอนถูกสร้างขึ้นโดยองค์กร จึงไม่อยู่ภายใต้บทลงโทษทางการเงิน"}, {"id": 268, "dom": 4, "question": "Which type of attack attempts to trick the user into revealing personal information by sending a fraudulent message?", "options": ["Phishing", "Cross-Site Scripting", "Denials of Service", "Trojans"], "correct_idx": 0, "explanation": "A phishing attack emails a fraudulent message to trick the recipient into disclosing sensitive information to the attacker.A Cross-Site Scripting attack tries to execute code on another website. Trojans are software that appear legitimate, but that have hidden malicious functions. Trojans may be sent in a message, but are not the message themselves. A denial of service attack (DoS) consists in compromising the availability of a system or service through a malicious overload of requests, which ca", "short_explanation_en": "A phishing attack emails a fraudulent message to trick the recipient into disclosing sensitive information to the attacker.A Cross-Site Scripting attack tries to execute code on another website.", "question_th": "การโจมตีประเภทใดที่พยายามหลอกให้ผู้ใช้เปิดเผยข้อมูลส่วนบุคคลโดยการส่งข้อความหลอกลวง?", "options_th": ["Phishing", "Cross-Site Scripting", "Denials of Service", "Trojans"], "explanation_th": "การโจมตีแบบ phishing ส่งข้อความหลอกลวงทางอีเมลเพื่อหลอกให้ผู้รับเปิดเผยข้อมูลที่ละเอียดอ่อนต่อผู้โจมตี Cross-Site Scripting พยายามรันโค้ดบนเว็บไซต์อื่น"}, {"id": 269, "dom": 3, "question": "In which of the following access control models can the creator of an object delegate permission? github.com/ayemunhossain", "options": ["ABAC", "MAC", "RBAC", "DAC"], "correct_idx": 3, "explanation": "In a Discretionary Access control model, the permissions associated with each object (file or data) are set by the owner of the object. In this model, the creator of an object implicitly becomes its owner, and therefore can decide who will have permission over the objects. In the remaining models, access specifications are centrally determined.", "short_explanation_en": "In a Discretionary Access control model, the permissions associated with each object (file or data) are set by the owner of the object.", "question_th": "ในโมเดลควบคุมการเข้าถึงใดที่ผู้สร้างวัตถุสามารถมอบสิทธิ์ให้ผู้อื่นได้?", "options_th": ["ABAC", "MAC", "RBAC", "DAC"], "explanation_th": "ในโมเดล discretionary access control สิทธิ์ที่เกี่ยวข้องกับแต่ละวัตถุ (ไฟล์หรือข้อมูล) ถูกกำหนดโดยเจ้าของวัตถุ ในโมเดลนี้ ผู้สร้างวัตถุกลายเป็นเจ้าของโดยปริยาย จึงสามารถตัดสินใจว่าใครจะมีสิทธิ์เข้าถึงวัตถุนั้นได้ ในโมเดลที่เหลือ ข้อกำหนดการเข้าถึงถูกกำหนดจากส่วนกลาง"}, {"id": 270, "dom": 4, "question": "Which type of attack has the PRIMARY objective of encrypting devices and their data, and then demanding a ransom payment for the decryption key?", "options": ["Ransomware", "Trojan", "Cross-Site Scripting", "Phishing"], "correct_idx": 0, "explanation": "Ransomware is malware designed to deny a user or organization access to files on their computer, by encrypting them and demanding a ransom payment for the decryption key. Trojans and phishing can be used to install ransomware on a system or device, but are not themselves the ransomware attack.", "short_explanation_en": "Ransomware is malware designed to deny a user or organization access to files on their computer, by encrypting them and demanding a ransom payment for the decryption key.", "question_th": "การโจมตีประเภทใดที่มีวัตถุประสงค์หลักในการเข้ารหัสอุปกรณ์และข้อมูลของอุปกรณ์นั้น แล้วเรียกร้องค่าไถ่เพื่อแลกกับกุญแจถอดรหัส?", "options_th": ["Ransomware", "Trojan", "Cross-Site Scripting", "Phishing"], "explanation_th": "Ransomware คือมัลแวร์ที่ออกแบบมาเพื่อปฏิเสธการเข้าถึงไฟล์บนคอมพิวเตอร์ของผู้ใช้หรือองค์กร โดยการเข้ารหัสไฟล์เหล่านั้นและเรียกร้องการชำระเงินค่าไถ่เพื่อแลกกับกุญแจถอดรหัส"}, {"id": 271, "dom": 4, "question": "Which of the following cloud models allows access to fundamental computer resources? (★)", "options": ["SaaS", "FaaS", "PaaS github.com/ayemunhossain", "IaaS"], "correct_idx": 3, "explanation": "Infrastructure as a Service (IaaS) provides the capability to provision processing, storage, networks, and other fundamental computing resources. Platform as a Service (PaaS) enables the provisioning of applications, programming libraries, services, and tools that the provider supports. Unlike IaaS, consumers do not control their underlying cloud infrastructure (including operating systems and storage). Both Software as a Service (SaaS) and Function as a Service (FaaS) models abstract away from", "short_explanation_en": "Infrastructure as a Service (IaaS) provides the capability to provision processing, storage, networks, and other fundamental computing resources.", "question_th": "โมเดลคลาวด์ใดต่อไปนี้ที่ให้การเข้าถึงทรัพยากรคอมพิวเตอร์พื้นฐาน?", "options_th": ["SaaS", "FaaS", "PaaS", "IaaS"], "explanation_th": "Infrastructure as a Service (IaaS) ให้ความสามารถในการจัดสรรการประมวลผล การจัดเก็บ เครือข่าย และทรัพยากรคอมพิวเตอร์พื้นฐานอื่น ๆ Platform as a Service (PaaS) ช่วยให้สามารถจัดสรรแอปพลิเคชัน ไลบรารีการเขียนโปรแกรม บริการ และเครื่องมือที่ผู้ให้บริการสนับสนุน"}, {"id": 272, "dom": 4, "question": "How many layers does the OSI model have?", "options": ["7", "4", "6", "5"], "correct_idx": 0, "explanation": "The OSI model organizes communicating systems according to 7 layers: Physical layer, Data Link layer, Network layer, Transport layer, Session layer, Presentation layer, and Application layer (see Chapter 4 - Module 1 under Open Systems Interconnection).", "short_explanation_en": "The OSI model organizes communicating systems according to 7 layers: Physical layer, Data Link layer, Network layer, Transport layer, Session layer, Presentation layer, and Application layer (see Chapter 4 - Module 1 under Open Systems...", "question_th": "โมเดล OSI มีกี่เลเยอร์?", "options_th": ["7", "4", "6", "5"], "explanation_th": "โมเดล OSI จัดระบบระบบสื่อสารตาม 7 เลเยอร์: Physical layer, Data Link layer, Network layer, Transport layer, Session layer, Presentation layer และ Application layer"}, {"id": 273, "dom": 1, "question": "Which of the following principles aims primarily at fraud detection?", "options": ["Privileged Accounts", "Defense in Depth", "Least Privilege", "Separation of Duties"], "correct_idx": 3, "explanation": "According to the principle of Separation of Duties, operations on objects are to be segmented (often referred to as 'transactions'), requiring distinct users and authorizations. The involvement of multiple users guarantees that no single user can perpetrate and conceal errors or fraud in their duties. To the extent that users have to review the work of other users, Separation of Duties can also be considered a mechanism of fraud detection (see ISC2 Study Guide Chapter 1, Module 3). The principle", "short_explanation_en": "According to the principle of Separation of Duties, operations on objects are to be segmented (often referred to as 'transactions'), requiring distinct users and authorizations.", "question_th": "หลักการใดมุ่งเน้นการตรวจจับการทุจริตเป็นหลัก?", "options_th": ["Privileged Accounts", "Defense in Depth", "Least Privilege", "Separation of Duties"], "explanation_th": "ตามหลักการ Separation of Duties การดำเนินการกับวัตถุจะถูกแบ่งส่วน (มักเรียกว่า 'ธุรกรรม') โดยต้องการผู้ใช้และการอนุญาตที่แตกต่างกัน การเกี่ยวข้องของผู้ใช้หลายคนรับประกันว่าไม่มีผู้ใช้คนใดสามารถกระทำและปกปิดข้อผิดพลาดหรือการทุจริตในหน้าที่ของตนได้เพียงลำพัง"}, {"id": 274, "dom": 4, "question": "Which protocol uses a three-way handshake to establish a reliable connection?", "options": ["TCP", "SMTP", "UDP", "SNMP"], "correct_idx": 0, "explanation": "TCP uses a three-way handshake to establish a reliable connection by exchanging three packets with theSYN, SYN/ACK, and ACK flags. SMTP uses a two-way handshake. Neither UDP nor SNMP require a handshake phase.", "short_explanation_en": "TCP uses a three-way handshake to establish a reliable connection by exchanging three packets with theSYN, SYN/ACK, and ACK flags.", "question_th": "โปรโตคอลใดที่ใช้ three-way handshake เพื่อสร้างการเชื่อมต่อที่เชื่อถือได้?", "options_th": ["TCP", "SMTP", "UDP", "SNMP"], "explanation_th": "TCP ใช้ three-way handshake เพื่อสร้างการเชื่อมต่อที่เชื่อถือได้โดยการแลกเปลี่ยนแพ็กเก็ตสามตัวด้วย flag SYN, SYN/ACK และ ACK SMTP ใช้ two-way handshake ในขณะที่ UDP และ SNMP ไม่ต้องการขั้นตอน handshake เลย"}, {"id": 275, "dom": 1, "question": "Which of the following is an example of a technical security control?", "options": ["Access control lists", "Turnstiles", "Fences", "Bollards"], "correct_idx": 0, "explanation": "An access control list is a type of technical security control. Bollards, fences and turnstiles control access to physical facilities, and thus are types of physical security controls. (ISC2 Study Guide, Chapter 1, Module 3)", "short_explanation_en": "An access control list is a type of technical security control.", "question_th": "ข้อใดเป็นตัวอย่างของการควบคุมความปลอดภัยทางเทคนิค (Technical security control)?", "options_th": ["Access control lists", "Turnstiles", "Fences", "Bollards"], "explanation_th": "รายการควบคุมการเข้าถึง (Access control list) เป็นประเภทหนึ่งของการควบคุมความปลอดภัยทางเทคนิค Bollards รั้ว และ turnstiles ควบคุมการเข้าถึงสถานที่ทางกายภาพ จึงเป็นประเภทของการควบคุมความปลอดภัยทางกายภาพ"}, {"id": 276, "dom": 4, "question": "Which type of attack attempts to gain information by observing the device's power consumption? (★)", "options": ["Side Channels", "Trojans", "Cross Site Scripting", "Denials of Service"], "correct_idx": 0, "explanation": "A side-channel attack is a passive and non-invasive attack aiming to extract information from a running system, by using special-purpose hardware to perform power monitoring, as well as timing and fault analysis attacks. The remaining are software-based attacks.", "short_explanation_en": "A side-channel attack is a passive and non-invasive attack aiming to extract information from a running system, by using special-purpose hardware to perform power monitoring, as well as timing and fault analysis attacks.", "question_th": "การโจมตีประเภทใดที่พยายามได้รับข้อมูลโดยการสังเกตการใช้พลังงานของอุปกรณ์?", "options_th": ["Side Channels", "Trojans", "Cross Site Scripting", "Denials of Service"], "explanation_th": "การโจมตีแบบ side-channel เป็นการโจมตีแบบไม่รุกล้ำ (passive) ที่มุ่งดึงข้อมูลจากระบบที่กำลังทำงาน โดยใช้ฮาร์ดแวร์เฉพาะทางเพื่อทำการตรวจสอบพลังงาน รวมถึงการวิเคราะห์จังหวะเวลาและข้อผิดพลาด"}, {"id": 277, "dom": 1, "question": "Which of the following areas is the most distinctive property of PHI?", "options": ["Integrity", "Confidentiality", "Non-Repudiation", "Authentication"], "correct_idx": 1, "explanation": "The correct answer is B. Confidentiality is the most distinctive property of protected health information (see ISC2 Study Guide, Module 1, under CIA Deep Dive). The remaining options apply to all types of data. All data requires integrity to be usable. Non-repudiation refers to the inability to deny the production, approval, or transmission of information. Authentication refers to guaranteeing that systems and information are accessed by persons and systems that are who github.com/ayemunhossain", "short_explanation_en": "The correct answer is B. Confidentiality is the most distinctive property of protected health information (see ISC2 Study Guide, Module 1, under CIA Deep Dive).", "question_th": "พื้นที่ใดต่อไปนี้เป็นคุณสมบัติที่โดดเด่นที่สุดของ PHI?", "options_th": ["Integrity", "Confidentiality", "Non-Repudiation", "Authentication"], "explanation_th": "คำตอบที่ถูกต้องคือ B Confidentiality เป็นคุณสมบัติที่โดดเด่นที่สุดของข้อมูลสุขภาพที่ได้รับการคุ้มครอง (PHI) ตัวเลือกที่เหลือใช้กับข้อมูลทุกประเภท ข้อมูลทั้งหมดต้องการ integrity เพื่อให้ใช้งานได้ Non-repudiation หมายถึงการไม่สามารถปฏิเสธการผลิต การอนุมัติ หรือการส่งข้อมูล"}, {"id": 278, "dom": 2, "question": "Which of these is the most efficient and effective way to test a business continuity plan?", "options": ["Simulations", "Walkthroughs", "Reviews", "Discussions"], "correct_idx": 0, "explanation": "Simulations are full re-enactments of business continuity procedures and can involve most, if not all, of your workforce. They also tend to take place on-site in the relevant business areas. Thus, they are an exceptionally effective way to test your business continuity plan. Walkthroughs verbally carry out specific recovery steps stipulated in the business Continuity plan. Discussion and reviews are static ways of testing the business continuity plan.", "short_explanation_en": "Simulations are full re-enactments of business continuity procedures and can involve most, if not all, of your workforce.", "question_th": "ข้อใดเป็นวิธีที่มีประสิทธิภาพและประสิทธิผลที่สุดในการทดสอบแผนความต่อเนื่องทางธุรกิจ?", "options_th": ["การจำลองสถานการณ์ (Simulations)", "การเดินผ่านขั้นตอน (Walkthroughs)", "การทบทวน (Reviews)", "การอภิปราย (Discussions)"], "explanation_th": "การจำลองสถานการณ์คือการจำลองขั้นตอนความต่อเนื่องทางธุรกิจเต็มรูปแบบ ซึ่งมักเกี่ยวข้องกับพนักงานส่วนใหญ่และเกิดขึ้น ณ พื้นที่จริง จึงเป็นวิธีทดสอบที่มีประสิทธิภาพที่สุด"}, {"id": 279, "dom": 1, "question": "Which of the following Cybersecurity concepts guarantees that information is accessible only to those authorized to access it?", "options": ["Confidentiality", "Non-repudiation", "Authentication", "Accessibility"], "correct_idx": 0, "explanation": "Confidentiality, Integrity and Availability are known as the CIA triad, from the model that guides policies for information security. Confidentiality is the property of data or information not being made available or disclosed, which leads to sensitive information being protected from unauthorized access. Integrity refers to the preservation of the consistency, accuracy and trustworthiness of data. Availability is the property of data being consistently and readily accessible to the parties auth", "short_explanation_en": "Confidentiality, Integrity and Availability are known as the CIA triad, from the model that guides policies for information security.", "question_th": "แนวคิดความปลอดภัยไซเบอร์ใดต่อไปนี้รับประกันว่าข้อมูลสามารถเข้าถึงได้เฉพาะผู้ที่ได้รับอนุญาตเท่านั้น?", "options_th": ["Confidentiality", "Non-repudiation", "Authentication", "Accessibility"], "explanation_th": "Confidentiality, Integrity และ Availability เรียกว่า CIA triad ซึ่งเป็นโมเดลที่ชี้นำนโยบายด้านความปลอดภัยสารสนเทศ Confidentiality คือคุณสมบัติของข้อมูลที่ไม่ถูกเปิดเผยหรือทำให้พร้อมใช้งานโดยไม่ได้รับอนุญาต ซึ่งนำไปสู่การปกป้องข้อมูลที่อ่อนไหวจากการเข้าถึงโดยไม่ได้รับอนุญาต"}, {"id": 280, "dom": 2, "question": "In the event of a disaster, what should be the PRIMARY objective? (★)", "options": ["Apply disaster communication", "Protect the production database", "Guarantee the safety of people", "Guarantee the continuity of critical systems"], "correct_idx": 2, "explanation": "In the event of a disaster, the number one priority is to guarantee the safety of human life above all else. The remaining options, though important as concerns business continuity, are never as important as the safety of human beings.", "short_explanation_en": "In the event of a disaster, the number one priority is to guarantee the safety of human life above all else.", "question_th": "ในกรณีเกิดภัยพิบัติ วัตถุประสงค์หลักควรเป็นสิ่งใด?", "options_th": ["สื่อสารในสถานการณ์ภัยพิบัติ", "ปกป้องฐานข้อมูลการผลิต", "รับประกันความปลอดภัยของบุคลากร", "รับประกันความต่อเนื่องของระบบสำคัญ"], "explanation_th": "ในกรณีเกิดภัยพิบัติ ความสำคัญอันดับแรกคือการรับประกันความปลอดภัยของชีวิตมนุษย์เหนือสิ่งอื่นใด"}, {"id": 281, "dom": 1, "question": "A security professional should report violations of a company's security policy to:", "options": ["The ISC Ethics Committee", "Company management", "National authorities", "A court of law"], "correct_idx": 1, "explanation": "The code of ethics requires security professionals to be honest, but not necessarily \"law enforcers\". A violation of a company's security policy should be reported and handled within the company itself (usually involving the human resources, legal, or management departments). Only individuals can be reported to the ISC2 ethics committee (i.e. not companies). National authorities only deal with violations of laws and regulations. github.com/ayemunhossain", "short_explanation_en": "The code of ethics requires security professionals to be honest, but not necessarily \"law enforcers\".", "question_th": "ผู้เชี่ยวชาญด้านความปลอดภัยควรรายงานการฝ่าฝืนนโยบายความปลอดภัยของบริษัทไปยัง:", "options_th": ["The ISC Ethics Committee", "Company management", "National authorities", "A court of law"], "explanation_th": "จรรยาบรรณกำหนดให้ผู้เชี่ยวชาญความปลอดภัยต้องซื่อสัตย์ แต่ไม่จำเป็นต้องเป็น 'ผู้บังคับใช้กฎหมาย' การฝ่าฝืนนโยบายความปลอดภัยของบริษัทควรได้รับการรายงานและจัดการภายในบริษัทเอง (โดยปกติเกี่ยวข้องกับฝ่ายทรัพยากรบุคคล กฎหมาย หรือฝ่ายบริหาร) มีเพียงบุคคลเท่านั้นที่สามารถถูกรายงานไปยังคณะกรรมการจรรยาบรรณ ISC2 (ไม่ใช่บริษัท)"}, {"id": 282, "dom": 2, "question": "Which department in a company is NOT regularly involved in a DRP?", "options": ["Executives", "IT", "Public Relations", "Financial"], "correct_idx": 3, "explanation": "Executives and Public Relations (PR) need to be aware of the company DRP to handle the expectation of the public and of company stakeholders. IT personnel should be involved in helping businesses get back to normal operations. A company's financial department is rarely involved in a disaster recovery plan. An exception would be if the issue at hand is connected to their area of expertise (see Chapter 2 ISC2 Study Guide, module 4, under Components of a Disaster Recovery Plan).", "short_explanation_en": "Executives and Public Relations (PR) need to be aware of the company DRP to handle the expectation of the public and of company stakeholders.", "question_th": "แผนกใดในบริษัทที่มักไม่เกี่ยวข้องเป็นประจำใน DRP?", "options_th": ["ผู้บริหาร", "IT", "ฝ่ายประชาสัมพันธ์", "ฝ่ายการเงิน"], "explanation_th": "ผู้บริหารและฝ่ายประชาสัมพันธ์ต้องรับทราบ DRP เพื่อจัดการความคาดหวังของสาธารณะและผู้มีส่วนได้ส่วนเสีย ส่วน IT ต้องช่วยให้ธุรกิจกลับสู่การดำเนินงานปกติ ในขณะที่ฝ่ายการเงินมักไม่ค่อยเกี่ยวข้องกับ DRP"}, {"id": 283, "dom": 2, "question": "Which of the following is included in an SLA document?", "options": ["A plan to prepare the organization for the continuation of critical business functions", "A plan to keep business operations going while recovering from a significant disruption", "Instructions to detect, respond to, and limit the consequences of a cyber-attack", "Instructions on data ownership and destruction"], "correct_idx": 3, "explanation": "A set of instructions or procedures to detect, respond and limit the consequences of a cyber-attack is an Incident Response Plan (see ISC2 Study Guide Chapter 2, module 1, under The Goal of Incident Response). A plan to sustain business operations while recovering from a significant disruption is a Business Continuity Plan (see ISC2 Study Guide Chapter 2, module 2, under The Importance of Business Continuity). A plan to prepare the organization for the continuation of critical business functions", "short_explanation_en": "A set of instructions or procedures to detect, respond and limit the consequences of a cyber-attack is an Incident Response Plan (see ISC2 Study Guide Chapter 2, module 1, under The Goal of Incident Response).", "question_th": "ข้อใดรวมอยู่ในเอกสาร SLA?", "options_th": ["แผนเตรียมองค์กรสำหรับความต่อเนื่องของฟังก์ชันทางธุรกิจสำคัญ", "แผนรักษาการดำเนินธุรกิจระหว่างการกู้คืนจากการหยุดชะงักครั้งใหญ่", "ขั้นตอนตรวจจับ ตอบสนอง และจำกัดผลกระทบจากการโจมตีทางไซเบอร์", "ขั้นตอนเกี่ยวกับความเป็นเจ้าของข้อมูลและการทำลายข้อมูล"], "explanation_th": "SLA (Service Level Agreement) คือสัญญาระหว่างผู้ให้บริการกับลูกค้าที่กำหนดระดับการบริการ ซึ่งรวมถึงขั้นตอนเกี่ยวกับความเป็นเจ้าของข้อมูลและการทำลายข้อมูล"}, {"id": 284, "dom": 1, "question": "What is the most important difference between MAC and DAC?", "options": ["In MAC, security administrators set the roles for the users; in DAC, roles are set at the object owner’s discretion", "In MAC, security administrators assign access permissions; in DAC, security administrators set user roles", "In MAC, security administrators assign access permissions; in DAC, access permissions are set at the object owner’s discretion", "In MAC, access permissions are set at the object owner’s discretion; in DAC, it is up to security administrators to assign access permissions"], "correct_idx": 2, "explanation": "In Mandatory Access Control (MAC), security administrators assign access permissions. In contrast, with Discretionary Access Control (MAC), it is up to the object owner’s discretion to set object permissions (see ISC2 Study Guide chapter 1, module 3, under Understand Logical Access Controls).", "short_explanation_en": "In Mandatory Access Control (MAC), security administrators assign access permissions.", "question_th": "ความแตกต่างที่สำคัญที่สุดระหว่าง MAC และ DAC คืออะไร?", "options_th": ["ใน MAC ผู้ดูแลความปลอดภัยกำหนดบทบาทให้ผู้ใช้ ใน DAC บทบาทถูกกำหนดตามดุลยพินิจของเจ้าของวัตถุ", "ใน MAC ผู้ดูแลความปลอดภัยกำหนดสิทธิ์การเข้าถึง ใน DAC ผู้ดูแลความปลอดภัยกำหนดบทบาทของผู้ใช้", "ใน MAC ผู้ดูแลความปลอดภัยกำหนดสิทธิ์การเข้าถึง ใน DAC สิทธิ์การเข้าถึงถูกกำหนดตามดุลยพินิจของเจ้าของวัตถุ", "ใน MAC สิทธิ์การเข้าถึงถูกกำหนดตามดุลยพินิจของเจ้าของวัตถุ ใน DAC ผู้ดูแลความปลอดภัยเป็นผู้กำหนดสิทธิ์การเข้าถึง"], "explanation_th": "ใน Mandatory Access Control (MAC) ผู้ดูแลความปลอดภัยเป็นผู้กำหนดสิทธิ์การเข้าถึง ในทางตรงกันข้าม ใน Discretionary Access Control (DAC) การกำหนดสิทธิ์วัตถุขึ้นอยู่กับดุลยพินิจของเจ้าของวัตถุ"}, {"id": 285, "dom": 3, "question": "Requiring a specific user role to access resources is an example of:", "options": ["MAC", "ABAC", "RBAC", "DAC"], "correct_idx": 2, "explanation": "Role-Based Access Control (RBAC) restricts access to the resources of a computer or network, according to the roles of individual users within your organization. Attribute-Based Access Control (ABAC) is based on complex attribute rules. In Discretionary Access Control (DAC), users may grant privileges to other subjects, as well as change the security attributes of the objects they have access to. github.com/ayemunhossain", "short_explanation_en": "Role-Based Access Control (RBAC) restricts access to the resources of a computer or network, according to the roles of individual users within your organization.", "question_th": "การกำหนดให้ต้องมีบทบาทผู้ใช้เฉพาะเพื่อเข้าถึงทรัพยากรเป็นตัวอย่างของ:", "options_th": ["MAC", "ABAC", "RBAC", "DAC"], "explanation_th": "Role-Based Access Control (RBAC) จำกัดการเข้าถึงทรัพยากรของคอมพิวเตอร์หรือเครือข่ายตามบทบาทของผู้ใช้แต่ละคนภายในองค์กร Attribute-Based Access Control (ABAC) อิงตามกฎคุณลักษณะที่ซับซ้อน ใน Discretionary Access Control (DAC) ผู้ใช้สามารถให้สิทธิ์แก่ subject อื่นได้"}, {"id": 286, "dom": 2, "question": "Which type of document outlines the procedures ensuring that vital company systems keep running during business- disrupting events?", "options": ["Business Impact Plan", "Business Impact Analysis", "Disaster Recovery Plan", "Business Continuity Plan"], "correct_idx": 3, "explanation": "A Business Continuity Plan (BCP) is a pre-determined set of instructions describing how an organization's mission or business processes will be sustained during and after a significant disruption (see Chapter 2 ISC2 Study Guide, module 4, under Terms and Definitions). A Business Impact Analysis (BIA) is a method of analyzing how disruptions can affect an organization. A Disaster Recovery Plan is used to recover systems after a major failure or disaster. The term 'Business Impact Plan' does not e", "short_explanation_en": "A Business Continuity Plan (BCP) is a pre-determined set of instructions describing how an organization's mission or business processes will be sustained during and after a significant disruption (see Chapter 2 ISC2 Study Guide, module...", "question_th": "เอกสารประเภทใดที่ระบุขั้นตอนเพื่อให้ระบบสำคัญขององค์กรยังคงทำงานได้ในระหว่างเหตุการณ์ที่รบกวนธุรกิจ?", "options_th": ["Business Impact Plan", "Business Impact Analysis", "Disaster Recovery Plan", "Business Continuity Plan"], "explanation_th": "Business Continuity Plan (BCP) คือชุดคำสั่งที่กำหนดไว้ล่วงหน้าเพื่ออธิบายว่ากระบวนการทางธุรกิจขององค์กรจะดำเนินต่อไปอย่างไรในระหว่างและหลังเหตุการณ์หยุดชะงักสำคัญ"}, {"id": 287, "dom": 1, "question": "Which of the following is NOT a best practice in access management?", "options": ["Give only the right amount of permission", "Periodically assess if user permissions still apply", "Request a justification when upgrading permission", "Trust but verify"], "correct_idx": 3, "explanation": "The “Trust but verify” model is a method of threat protection wherein privileged accounts are trusted (but always verified) and allowed access to the network and other resources . Over time, the “Trust but verify” model has been found to expose organizations to multiple security threats, and is therefore being progressively abandoned in favor of the Zero Trust model. The remaining options are all good practices of access management. github.com/ayemunhossain", "short_explanation_en": "The “Trust but verify” model is a method of threat protection wherein privileged accounts are trusted (but always verified) and allowed access to the network and other resources .", "question_th": "ข้อใดไม่ใช่แนวปฏิบัติที่ดีในการจัดการการเข้าถึง (Access management)?", "options_th": ["ให้สิทธิ์เท่าที่จำเป็นเท่านั้น", "ประเมินเป็นระยะว่าสิทธิ์ของผู้ใช้ยังคงเหมาะสมหรือไม่", "ขอเหตุผลเมื่อมีการอัปเกรดสิทธิ์", "Trust but verify"], "explanation_th": "โมเดล 'Trust but verify' เป็นวิธีการป้องกันภัยคุกคามที่บัญชีสิทธิพิเศษได้รับความไว้วางใจ (แต่มีการตรวจสอบเสมอ) และได้รับอนุญาตให้เข้าถึงเครือข่ายและทรัพยากรอื่น ๆ เมื่อเวลาผ่านไป โมเดล 'Trust but verify' พบว่าเปิดโอกาสให้องค์กรเผชิญภัยคุกคามด้านความปลอดภัยหลายประการ และกำลังถูกยกเลิกเพื่อหันไปใช้โมเดล Zero Trust แทน"}, {"id": 288, "dom": 5, "question": "If a company collects PII, which policy is required?", "options": ["Remote Access Policy", "GDPR", "Privacy Policy", "Acceptable Use Policy"], "correct_idx": 2, "explanation": "A Privacy Policy (PP) outlines the data security mechanisms which ensure that customer data is protected, namely, how Personal Identifiable Information (PII) is collected, stored and processed. An Acceptable Use Policy (AUP) defines the guidelines and limitations that users must agree on while accessing the an organization's network, computer systems or other related resources. The General Data Protection Regulation (GDPR) is a regulation on data protection and privacy for the European Union and", "short_explanation_en": "A Privacy Policy (PP) outlines the data security mechanisms which ensure that customer data is protected, namely, how Personal Identifiable Information (PII) is collected, stored and processed.", "question_th": "หากบริษัทเก็บรวบรวม PII ต้องมีนโยบายใด?", "options_th": ["Remote Access Policy", "GDPR", "Privacy Policy", "Acceptable Use Policy"], "explanation_th": "Privacy Policy (PP) ระบุกลไกความปลอดภัยของข้อมูลที่รับประกันว่าข้อมูลลูกค้าได้รับการปกป้อง กล่าวคือ วิธีที่ Personal Identifiable Information (PII) ถูกเก็บรวบรวม จัดเก็บ และประมวลผล"}, {"id": 289, "dom": 4, "question": "Which of these is LEAST likely to be installed by an infection?", "options": ["Logic Bomb", "Keylogger", "Trojan", "Backdoor"], "correct_idx": 0, "explanation": "A logic bomb is a piece of code intentionally inserted into software that will activate after specific conditions are met (see ISC2 Study Guide, chapter 4, module 2). Logic bombs are typically embedded in legitimate software. Trojans are a type of malware used to install keyloggers and backdoors. Keyloggers capture keystrokes and user input, but typically require malware to install the keylogger. A backdoor is a malicious feature that listens for commands on a specific logical port (TCP or UDP)", "short_explanation_en": "A logic bomb is a piece of code intentionally inserted into software that will activate after specific conditions are met (see ISC2 Study Guide, chapter 4, module 2).", "question_th": "ข้อใดมีโอกาสน้อยที่สุดที่จะถูกติดตั้งโดยการติดเชื้อ?", "options_th": ["Logic Bomb", "Keylogger", "Trojan", "Backdoor"], "explanation_th": "Logic bomb คือโค้ดที่ถูกแทรกเข้าไปในซอฟต์แวร์โดยเจตนา ซึ่งจะเปิดใช้งานหลังจากเงื่อนไขเฉพาะได้รับการตอบสนอง Logic bombs มักถูกฝังอยู่ในซอฟต์แวร์ที่ถูกต้องตามกฎหมาย Trojans เป็นมัลแวร์ประเภทหนึ่งที่ใช้ติดตั้ง keyloggers และ backdoors"}, {"id": 290, "dom": 4, "question": "(★) The best defense method to stop a 'Replay Attack' is to:", "options": ["Use an IPSec VPN", "Use a Firewall", "Use password authentication", "Use message digesting"], "correct_idx": 0, "explanation": "A replay attack is when an attacker captures and resends (i.e. \"replays\") authenticated messages (see ISC2 Study Guide, chapter 4, module 2). An IPSec VPN can prevent a replay attack because it tracks packet sequencing and includes the sender's signature on all packets; therefore preventing forged packages. Message digesting is ineffective in preventing resends (and thus also replay attacks), since it doesn't matter whether the attacker can read or decipher the original message and key (all they", "short_explanation_en": "A replay attack is when an attacker captures and resends (i.e.", "question_th": "วิธีการป้องกันที่ดีที่สุดในการหยุด 'Replay Attack' คือ:", "options_th": ["ใช้ IPSec VPN", "ใช้ไฟร์วอลล์", "ใช้การยืนยันตัวตนด้วยรหัสผ่าน", "ใช้ message digesting"], "explanation_th": "Replay attack คือเมื่อผู้โจมตีดักจับและส่งข้อความที่ผ่านการยืนยันตัวตนซ้ำ (คือ 'replay') IPSec VPN สามารถป้องกัน replay attack ได้เนื่องจากติดตามลำดับของแพ็กเก็ตและรวมลายเซ็นของผู้ส่งไว้ในทุกแพ็กเก็ต จึงป้องกันแพ็กเก็ตปลอมได้"}, {"id": 291, "dom": 4, "question": "Which of these devices has the PRIMARILY objective of determining the most efficient path for the traffic to flow across the networks?", "options": ["Hubs", "Firewalls", "Routers", "Switches"], "correct_idx": 2, "explanation": "A router is a networking device whose primary objective is to determine the most efficient path for traffic to flow across a network. Routers connect two or more networks and forward data packets between them according to their destination address (see ISC2 Study Guide, chapter 4, module 1). When a router receives a data packet, it checks the destination address and determines the best route on which to forward the packet, based on its routing table. The routing table is a github.com/ayemunhossa", "short_explanation_en": "A router is a networking device whose primary objective is to determine the most efficient path for traffic to flow across a network.", "question_th": "อุปกรณ์ใดต่อไปนี้มีวัตถุประสงค์หลักในการกำหนดเส้นทางที่มีประสิทธิภาพมากที่สุดสำหรับทราฟฟิกที่จะไหลผ่านเครือข่าย?", "options_th": ["Hubs", "Firewalls", "Routers", "Switches"], "explanation_th": "Router คืออุปกรณ์เครือข่ายที่มีวัตถุประสงค์หลักในการกำหนดเส้นทางที่มีประสิทธิภาพมากที่สุดสำหรับทราฟฟิกที่จะไหลผ่านเครือข่าย Router เชื่อมต่อสองเครือข่ายขึ้นไปและส่งต่อแพ็กเก็ตข้อมูลระหว่างกันตามที่อยู่ปลายทาง"}, {"id": 292, "dom": 4, "question": "Which of these types of malware self-replicates without the need for human intervention?", "options": ["Worm", "Trojan", "Virus", "Rootkits"], "correct_idx": 0, "explanation": "A worm is a type of malware designed to replicate itself and spread to other computers without human intervention. Worms exploit operating systems, network servers and other software vulnerabilities in order to propagate themselves. They can cause various damaging effects, including disrupting network performance, consuming bandwidth, and stealing sensitive information (see ISC2 Study Guide, chapter 4, module 2). Some worms can also perform directly malicious actions, such as installing rootkits", "short_explanation_en": "A worm is a type of malware designed to replicate itself and spread to other computers without human intervention.", "question_th": "มัลแวร์ประเภทใดต่อไปนี้ที่แพร่กระจายตัวเองได้โดยไม่ต้องอาศัยการกระทำของมนุษย์?", "options_th": ["Worm", "Trojan", "Virus", "Rootkits"], "explanation_th": "Worm คือมัลแวร์ประเภทหนึ่งที่ออกแบบมาเพื่อแพร่กระจายตัวเองไปยังคอมพิวเตอร์อื่นโดยไม่ต้องอาศัยการกระทำของมนุษย์ Worm ใช้ประโยชน์จากระบบปฏิบัติการ เซิร์ฟเวอร์เครือข่าย และช่องโหว่ของซอฟต์แวร์อื่น ๆ เพื่อแพร่กระจายตัวเอง"}, {"id": 293, "dom": 1, "question": "As an (ISC)² member, you are expected to perform with due care. What does 'due care' specifically mean?", "options": ["Do what is right in each situation you encounter on the job", "Give continuity to the legacy of security practices of your company", "Apply patches annually", "Researching and acquiring the knowledge to do your job right github.com/ayemunhossain"], "correct_idx": 0, "explanation": "The concept of 'due Care' (also known as 'the prudent person rule') refers to what a prudent person would do in a given situation. In cybersecurity, 'due care' means taking reasonable steps to secure and protect the organization's assets, reputation and finances. The concept is holistic and includes, among other things: implementing the appropriate security standards, policies and procedures; ensuring proper cybersecurity awareness training; and promoting the continuous improvement of monitoring", "short_explanation_en": "The concept of 'due Care' (also known as 'the prudent person rule') refers to what a prudent person would do in a given situation.", "question_th": "ในฐานะสมาชิก (ISC)² คุณคาดว่าจะปฏิบัติงานด้วยความระมัดระวัง (Due care) คำว่า 'due care' หมายถึงอะไรโดยเฉพาะ?", "options_th": ["ทำสิ่งที่ถูกต้องในทุกสถานการณ์ที่คุณพบในงาน", "สืบทอดมรดกของแนวปฏิบัติด้านความปลอดภัยของบริษัทของคุณ", "นำแพตช์มาใช้ทุกปี", "วิจัยและได้มาซึ่งความรู้เพื่อทำงานของคุณให้ถูกต้อง"], "explanation_th": "แนวคิดของ 'due care' (หรือเรียกว่า 'the prudent person rule') หมายถึงสิ่งที่บุคคลที่รอบคอบจะทำในสถานการณ์ที่กำหนด ในความปลอดภัยไซเบอร์ 'due care' หมายถึงการดำเนินขั้นตอนที่สมเหตุสมผลเพื่อรักษาความปลอดภัยและปกป้องทรัพย์สิน ชื่อเสียง และการเงินขององค์กร"}, {"id": 294, "dom": 1, "question": "(★) Which of these is NOT a best practice in access management?", "options": ["Periodically assessing whether user permissions still apply", "Requesting a justification when upgrading permission", "Giving only the right amount of permission", "Trust but verify"], "correct_idx": 3, "explanation": "The \"Trust but verify\" model is a method of threat protection that involves granting privileged accounts access to the network and other resources, while at the same time verifying their actions and activities. However, over time, this model was found to have limitations that expose organizations to a wide array of security threats. Therefore, \"Trust but verify\" is being progressively abandoned in favor of the Zero Trust model. The remaining options are all best practices of access management.", "short_explanation_en": "The \"Trust but verify\" model is a method of threat protection that involves granting privileged accounts access to the network and other resources, while at the same time verifying their actions and activities.", "question_th": "ข้อใดไม่ใช่แนวปฏิบัติที่ดีในการจัดการการเข้าถึง (Access management)?", "options_th": ["ประเมินเป็นระยะว่าสิทธิ์ของผู้ใช้ยังคงเหมาะสมหรือไม่", "ขอเหตุผลเมื่อมีการอัปเกรดสิทธิ์", "ให้สิทธิ์เท่าที่จำเป็นเท่านั้น", "Trust but verify"], "explanation_th": "โมเดล 'Trust but verify' เป็นวิธีการป้องกันภัยคุกคามที่เกี่ยวข้องกับการให้บัญชีสิทธิพิเศษเข้าถึงเครือข่ายและทรัพยากรอื่น ๆ ในขณะเดียวกันก็ตรวจสอบการกระทำและกิจกรรมของพวกเขา อย่างไรก็ตาม เมื่อเวลาผ่านไป โมเดลนี้พบว่ามีข้อจำกัดที่เปิดโอกาสให้องค์กรเผชิญภัยคุกคามด้านความปลอดภัยหลากหลาย"}, {"id": 295, "dom": 2, "question": "During the investigation of an incident, which security policies are more likely to cause difficulties?", "options": ["Configuration standards", "Incident response policies", "Communication policies", "Retention policies github.com/ayemunhossain"], "correct_idx": 3, "explanation": "For many organizations, retention policies entail keeping data only for a limited time. Because of the high costs of data storage capacity, organizations maintain specific logs only for a short period of time (a few hours to several days), and keep other data records for more extended periods (months to years). Because of this, not all data regarding an incident may be available. Communication and incident response policies can provide valuable help to an incident investigation. Finally, configu", "short_explanation_en": "For many organizations, retention policies entail keeping data only for a limited time.", "question_th": "ในระหว่างการสืบสวนเหตุการณ์ นโยบายด้านความปลอดภัยใดมีแนวโน้มก่อให้เกิดความยากลำบากมากกว่า?", "options_th": ["มาตรฐานการกำหนดค่า", "นโยบายตอบสนองต่อเหตุการณ์", "นโยบายการสื่อสาร", "นโยบายการเก็บรักษาข้อมูล"], "explanation_th": "นโยบายการเก็บรักษาข้อมูลมักกำหนดให้เก็บข้อมูลไว้เพียงระยะเวลาจำกัด เนื่องจากต้นทุนการจัดเก็บที่สูง ทำให้ข้อมูลบางส่วนที่เกี่ยวข้องกับเหตุการณ์อาจไม่พร้อมใช้งานเมื่อต้องสืบสวน"}, {"id": 296, "dom": 3, "question": "In an Access Control List (ACL), the element that determines which permissions you have is:", "options": ["The subject", "The object", "The firmware", "The rule"], "correct_idx": 3, "explanation": "An Access Control List (ACL) is a list of rules that specifies which users or systems are granted or denied access (i.e., have permission to access) to a particular object or system resource (see ISC2 Study Guide, chapter 3, module 4). The subject is a user or a process run by a user, which inherits the user authorization. The object is the resource or data in the system (or the network) to be accessed. Firmware is a type of software embedded in a hardware system; therefore, the concept of an Ac", "short_explanation_en": "An Access Control List (ACL) is a list of rules that specifies which users or systems are granted or denied access (i.e., have permission to access) to a particular object or system resource (see ISC2 Study Guide, chapter 3, module 4).", "question_th": "ใน Access Control List (ACL) องค์ประกอบที่กำหนดว่าคุณมีสิทธิ์ใดคือ:", "options_th": ["Subject", "Object", "Firmware", "Rule"], "explanation_th": "Access Control List (ACL) คือรายการกฎที่ระบุว่าผู้ใช้หรือระบบใดได้รับหรือถูกปฏิเสธการเข้าถึง (มีสิทธิ์เข้าถึง) วัตถุหรือทรัพยากรระบบเฉพาะ Subject คือผู้ใช้หรือกระบวนการที่รันโดยผู้ใช้ ซึ่งสืบทอดการอนุญาตของผู้ใช้ Object คือทรัพยากรหรือข้อมูลในระบบ (หรือเครือข่าย) ที่จะถูกเข้าถึง"}, {"id": 297, "dom": 4, "question": "What does the term 'data remanence' refer?", "options": ["Data in use that can't be encrypted", "Files saved locally that can't be remoted accessed", "Data left over after routine removal and deletion", "All of the data in a system"], "correct_idx": 2, "explanation": "Data Remanence refers to data left over after routine removal and deletion of data from a storage device (see ISC2 Study Guide, chapter 4, module 3). When digital data is deleted, instead of being erased from the storage media, it is often only marked deleted, and the corresponding space is then made available to be overwritten later on. Consequently, deleted data can still be present on the storage media, and can be recovered using the proper media analysis and recovery tools. Data remanence is", "short_explanation_en": "Data Remanence refers to data left over after routine removal and deletion of data from a storage device (see ISC2 Study Guide, chapter 4, module 3).", "question_th": "คำว่า 'data remanence' หมายถึงอะไร?", "options_th": ["ข้อมูลที่กำลังใช้งานซึ่งไม่สามารถเข้ารหัสได้", "ไฟล์ที่บันทึกในเครื่องซึ่งไม่สามารถเข้าถึงระยะไกลได้", "ข้อมูลที่หลงเหลืออยู่หลังการลบและกำจัดตามปกติ", "ข้อมูลทั้งหมดในระบบ"], "explanation_th": "Data Remanence หมายถึงข้อมูลที่หลงเหลืออยู่หลังการลบและกำจัดข้อมูลตามปกติออกจากอุปกรณ์จัดเก็บข้อมูล เมื่อข้อมูลดิจิทัลถูกลบ แทนที่จะถูกลบออกจากสื่อจัดเก็บ มักจะถูกทำเครื่องหมายว่าถูกลบเท่านั้น และพื้นที่ที่สอดคล้องกันจะถูกทำให้พร้อมสำหรับการเขียนทับในภายหลัง"}, {"id": 298, "dom": 2, "question": "(★) Which type of recovery site has some or most systems in place, but does not have the data needed to take over operations?", "options": ["A hot site", "A cloud site", "A warm site", "A cold site"], "correct_idx": 2, "explanation": "A cold site requires space, power, network connectivity, systems and data to be put in place and take over operations. Warm sites have power, connectivity, and systems, but do not have live or current data enabling the immediate takeover of operations (see ISC2 Study Guide, chapter 2, module 3). A hot site can immediately take over operations. A cloud site is not a term that refers to one of the three most common types of recovery sites.", "short_explanation_en": "A cold site requires space, power, network connectivity, systems and data to be put in place and take over operations.", "question_th": "ไซต์กู้คืนประเภทใดที่มีระบบบางส่วนหรือส่วนใหญ่พร้อมใช้งาน แต่ไม่มีข้อมูลที่จำเป็นในการเข้าครองการดำเนินงาน?", "options_th": ["Hot site", "Cloud site", "Warm site", "Cold site"], "explanation_th": "Cold site ต้องการพื้นที่ ไฟฟ้า การเชื่อมต่อเครือข่าย ระบบ และข้อมูลก่อนจึงจะเข้าครองการดำเนินงานได้ ในขณะที่ Warm site มีไฟฟ้า การเชื่อมต่อ และระบบพร้อมแล้ว แต่ไม่มีข้อมูลปัจจุบัน"}, {"id": 299, "dom": 4, "question": "Which of these is NOT a characteristic of an MSP implementation?", "options": ["Manage all in-house company infrastructure", "Monitor and respond to security incidents", "Mediate, execute and decide top-level decisions", "Utilize expertise for the implementation of a product or service"], "correct_idx": 0, "explanation": "Manage all-in-house company infrastructure is not a characteristic of an MSP (Managed Service Provider) implementation. MSPs provide an outsourced IT service to manage a company's IT infrastructure and endpoints, rather than managing it all in-house. Some characteristics of an MSP implementation include the following (see ISC2 Study Guide, chapter 4, module 3): Utilizing expertise for the implementation of a product or serviceMonitoring and responding to security incidents Mediating, executing a", "short_explanation_en": "Manage all-in-house company infrastructure is not a characteristic of an MSP (Managed Service Provider) implementation.", "question_th": "ข้อใดต่อไปนี้ไม่ใช่ลักษณะของการนำ MSP มาใช้?", "options_th": ["จัดการโครงสร้างพื้นฐานทั้งหมดภายในบริษัทเอง", "เฝ้าติดตามและตอบสนองต่อเหตุการณ์ความปลอดภัย", "เป็นตัวกลาง ดำเนินการ และตัดสินใจในระดับสูงสุด", "ใช้ความเชี่ยวชาญสำหรับการนำผลิตภัณฑ์หรือบริการไปใช้"], "explanation_th": "การจัดการโครงสร้างพื้นฐานทั้งหมดภายในบริษัทไม่ใช่ลักษณะของการนำ MSP (Managed Service Provider) มาใช้ MSP ให้บริการ IT แบบ outsource เพื่อจัดการโครงสร้างพื้นฐาน IT และ endpoint ของบริษัท แทนที่จะจัดการทั้งหมดภายในบริษัทเอง"}, {"id": 300, "dom": 2, "question": "Which of these is NOT a typical component of a comprehensive business continuity plan (BCP)?", "options": ["A cost prediction of the immediate response procedures", "Immediate response procedures and checklists", "Notification systems and call trees for alerting personnel", "A list of the BCP team members"], "correct_idx": 0, "explanation": "Cost predictions of response procedures are not typical components of business continuity plans (BCP). A BCP typically includes the following elements: A list of BCP team members, who will be responsible for implementing the BCP and coordinating the response to an incident; Immediate response procedures and checklists, with step-by-step instructions for responding to an incident and restoring operations; Notification systems and call trees for alerting personnel, the purpose of which is to effec", "short_explanation_en": "Cost predictions of response procedures are not typical components of business continuity plans (BCP).", "question_th": "ข้อใดไม่ใช่องค์ประกอบทั่วไปของแผนความต่อเนื่องทางธุรกิจ (BCP) ที่ครอบคลุม?", "options_th": ["การประมาณต้นทุนของขั้นตอนการตอบสนองทันที", "ขั้นตอนและรายการตรวจสอบการตอบสนองทันที", "ระบบแจ้งเตือนและสายโทรศัพท์สำหรับแจ้งบุคลากร", "รายชื่อสมาชิกทีม BCP"], "explanation_th": "การประมาณต้นทุนของขั้นตอนการตอบสนองไม่ใช่องค์ประกอบทั่วไปของ BCP ซึ่งปกติจะรวมรายชื่อทีม ขั้นตอนตอบสนองทันที และระบบแจ้งเตือนบุคลากร"}, {"id": 301, "dom": 1, "question": "Acting ethically is mandatory for (ISC)² members. Which of these is NOT considered unethical? github.com/ayemunhossain", "options": ["Disrupting the intended use of the internet", "Seeking to gain unauthorized access to resources on thae internet", "Compromising the privacy of users", "Having fake social media profiles and accounts"], "correct_idx": 3, "explanation": "Having fake social media profiles and accounts can be socially objectionable, but does not violate the (ISC)² Ethics Canons (see ISC2 Study Guide, chapter 1, module 5). That being said, seeking to gain unauthorized access to resources on the internet, compromising the privacy of users, and disrupting the intended use of the internet are all considered unethical behaviors by (ISC)², as well as by other similar professional organizations. Aside from being violations of professional codes of conduc", "short_explanation_en": "Having fake social media profiles and accounts can be socially objectionable, but does not violate the (ISC)² Ethics Canons (see ISC2 Study Guide, chapter 1, module 5).", "question_th": "การกระทำอย่างมีจริยธรรมเป็นสิ่งบังคับสำหรับสมาชิก (ISC)² ข้อใดไม่ถือว่าผิดจริยธรรม?", "options_th": ["การรบกวนการใช้งานอินเทอร์เน็ตตามที่ตั้งใจ", "การพยายามเข้าถึงทรัพยากรบนอินเทอร์เน็ตโดยไม่ได้รับอนุญาต", "การละเมิดความเป็นส่วนตัวของผู้ใช้", "การมีโปรไฟล์และบัญชีโซเชียลมีเดียปลอม"], "explanation_th": "การมีโปรไฟล์และบัญชีโซเชียลมีเดียปลอมอาจน่ารังเกียจในทางสังคม แต่ไม่ได้ละเมิดจรรยาบรรณของ (ISC)² อย่างไรก็ตาม การพยายามเข้าถึงทรัพยากรบนอินเทอร์เน็ตโดยไม่ได้รับอนุญาต การละเมิดความเป็นส่วนตัวของผู้ใช้ และการรบกวนการใช้งานอินเทอร์เน็ตตามที่ตั้งใจ ล้วนถือเป็นพฤติกรรมที่ผิดจริยธรรมโดย (ISC)²"}, {"id": 302, "dom": 2, "question": "In an incident response process, which phase uses indicators of compromise and log analysis as part of a review of events?", "options": ["Preparation", "Eradication", "Identification", "Containment"], "correct_idx": 2, "explanation": "According to NIST methodology, an incident response plan has four phases to structure the organization’s incident response, and typically includes short and long-term goals, metrics for measuring success, training, and job requirements for incident response roles. The identification phase focuses on identifying the attack, understanding its severity, and prioritizing it appropriately. Preparation focuses on building tools, processes and procedures to respond to incidents. Eradication involves th", "short_explanation_en": "According to NIST methodology, an incident response plan has four phases to structure the organization’s incident response, and typically includes short and long-term goals, metrics for measuring success, training, and job requirements...", "question_th": "ในกระบวนการตอบสนองต่อเหตุการณ์ ขั้นตอนใดใช้ตัวชี้วัดการถูกบุกรุก (Indicators of Compromise) และการวิเคราะห์ log เป็นส่วนหนึ่งของการทบทวนเหตุการณ์?", "options_th": ["Preparation", "Eradication", "Identification", "Containment"], "explanation_th": "ตามระเบียบวิธีของ NIST ขั้นตอน Identification จะเน้นการระบุการโจมตี ทำความเข้าใจความรุนแรง และจัดลำดับความสำคัญอย่างเหมาะสม โดยใช้ log และตัวชี้วัดการบุกรุก"}, {"id": 303, "dom": 3, "question": "Which of these Access Control Systems is commonly used in the military?", "options": ["ABAC", "DAC", "RBAC", "MAC"], "correct_idx": 3, "explanation": "Mandatory Access Control (MAC) is a model of access control that is commonly used in the military, because it enables the centralized management of access rights, as well as the enforcement of strict security policies (see ISC2 Study Guide, chapter 3, module 3). In MAC, access to resources is based on the classification level of a given resource, as well as on the clearance level of the user. The use of classification and clearance levels allows for a hierarchical approach to security, whereby a", "short_explanation_en": "Mandatory Access Control (MAC) is a model of access control that is commonly used in the military, because it enables the centralized management of access rights, as well as the enforcement of strict security policies (see ISC2 Study...", "question_th": "ระบบควบคุมการเข้าถึงใดต่อไปนี้ที่นิยมใช้ในกองทัพ?", "options_th": ["ABAC", "DAC", "RBAC", "MAC"], "explanation_th": "Mandatory Access Control (MAC) เป็นโมเดลการควบคุมการเข้าถึงที่นิยมใช้ในกองทัพ เนื่องจากช่วยให้สามารถจัดการสิทธิ์การเข้าถึงแบบรวมศูนย์ได้ รวมถึงการบังคับใช้นโยบายความปลอดภัยที่เข้มงวด ใน MAC การเข้าถึงทรัพยากรอิงตามระดับการจัดประเภทของทรัพยากรที่กำหนด และระดับการอนุญาตของผู้ใช้"}, {"id": 304, "dom": 1, "question": "Which of these is NOT a security principle?", "options": ["Security in Depth (SID)", "Zero Trust model", "Least Privilege", "Separation of Duties"], "correct_idx": 0, "explanation": "Security in Depth (SID) is not a security principle, but a security model that involves implementing multiple layers of security controls, so as to protect against threats and reduce the risk of a successful attack. In Security in Depth, the idea is to create a multi-layered defense system that includes both technical controls (such as firewalls and intrusion detection systems) and administrative controls (such as policies and procedures). github.com/ayemunhossain Zero Trust model, Separation of", "short_explanation_en": "Security in Depth (SID) is not a security principle, but a security model that involves implementing multiple layers of security controls, so as to protect against threats and reduce the risk of a successful attack.", "question_th": "ข้อใดไม่ใช่หลักการความปลอดภัย?", "options_th": ["Security in Depth (SID)", "Zero Trust model", "Least Privilege", "Separation of Duties"], "explanation_th": "Security in Depth (SID) ไม่ใช่หลักการความปลอดภัย แต่เป็นโมเดลความปลอดภัยที่เกี่ยวข้องกับการนำการควบคุมความปลอดภัยหลายชั้นมาใช้ เพื่อป้องกันภัยคุกคามและลดความเสี่ยงของการโจมตีที่สำเร็จ"}, {"id": 305, "dom": 1, "question": "Which of these is not a common goal of a cybersecurity attacker?", "options": ["Allocation", "Alteration", "Disclosure", "Denial"], "correct_idx": 0, "explanation": "The three most common goals of cybersecurity attackers are disclosure, alteration, and denial (DAD), which correspond directly to to the cybersecurity triad: confidentiality, integrity, and availability (CIA) (see ISC2 Study Guide, chapter 1, module 1). Allocation means assigning controls to specific system elements responsible for providing a security or privacy capability (e.g., access control systems, routers, servers, etc.), and therefore is not a common goal of a cybersecurity attacker.", "short_explanation_en": "The three most common goals of cybersecurity attackers are disclosure, alteration, and denial (DAD), which correspond directly to to the cybersecurity triad: confidentiality, integrity, and availability (CIA) (see ISC2 Study Guide,...", "question_th": "ข้อใดไม่ใช่เป้าหมายทั่วไปของผู้โจมตีความปลอดภัยไซเบอร์?", "options_th": ["Allocation", "Alteration", "Disclosure", "Denial"], "explanation_th": "เป้าหมายทั่วไปสามประการของผู้โจมตีความปลอดภัยไซเบอร์คือ disclosure, alteration และ denial (DAD) ซึ่งสอดคล้องโดยตรงกับสามเสาหลักของความปลอดภัยไซเบอร์: confidentiality, integrity และ availability (CIA) Allocation หมายถึงการกำหนดการควบคุมให้กับองค์ประกอบระบบเฉพาะที่รับผิดชอบในการให้ความสามารถด้านความปลอดภัยหรือความเป็นส่วนตัว จึงไม่ใช่เป้าหมายทั่วไปของผู้โจมตี"}, {"id": 306, "dom": 4, "question": "Which of these types of layers is NOT part of the TCP/IP model?", "options": ["Application", "Physical", "Internet", "Transport"], "correct_idx": 1, "explanation": "The physical layer exists in the OSI model, but not in the TCP/IP model. The TCP/IP Protocol Architecture Layers are: [1] Application (Determines the protocols for the Transport layer); [2] Transport (Allows for data to move among devices); [3] Internet (Creates and inserts packets); [4] Network Interface (Governs how data will move through the network) (for more on this, see ISC2 Study Guide, Chapter 4, Module 1).", "short_explanation_en": "The physical layer exists in the OSI model, but not in the TCP/IP model.", "question_th": "เลเยอร์ประเภทใดต่อไปนี้ไม่ใช่ส่วนหนึ่งของโมเดล TCP/IP?", "options_th": ["Application", "Physical", "Internet", "Transport"], "explanation_th": "Physical layer มีอยู่ในโมเดล OSI แต่ไม่มีในโมเดล TCP/IP เลเยอร์สถาปัตยกรรมโปรโตคอล TCP/IP คือ: [1] Application; [2] Transport; [3] Internet; [4] Network Interface"}, {"id": 307, "dom": 5, "question": "On a BYOD model, which of these technologies is best suited to keep corporate data and applications separate from personal?", "options": ["Biometrics", "Full-device encryption", "Context-aware authentication", "Containerization"], "correct_idx": 3, "explanation": "Containerization allows users to run corporate applications and access corporate data in a secure environment that applications outside the container cannot access. Containerization solutions for mobile devices typically use encryption and other isolation techniques to ensure that data and applications do not cross over. Full-device encryption helps reduce the risk of theft or loss of a device, thereby reducing the risk of a data breach. Biometrics and context-aware authentication are helpful in", "short_explanation_en": "Containerization allows users to run corporate applications and access corporate data in a secure environment that applications outside the container cannot access.", "question_th": "ในโมเดล BYOD เทคโนโลยีใดเหมาะสมที่สุดในการแยกข้อมูลและแอปพลิเคชันขององค์กรออกจากข้อมูลส่วนตัว?", "options_th": ["Biometrics", "Full-device encryption", "Context-aware authentication", "Containerization"], "explanation_th": "Containerization ช่วยให้ผู้ใช้สามารถรันแอปพลิเคชันขององค์กรและเข้าถึงข้อมูลขององค์กรในสภาพแวดล้อมที่ปลอดภัยซึ่งแอปพลิเคชันภายนอกคอนเทนเนอร์ไม่สามารถเข้าถึงได้ โซลูชัน Containerization สำหรับอุปกรณ์มือถือมักใช้การเข้ารหัสและเทคนิคการแยกส่วนอื่น ๆ เพื่อรับประกันว่าข้อมูลและแอปพลิเคชันจะไม่ปะปนกัน"}, {"id": 308, "dom": 1, "question": "In the context of risk management, which information does ALE outline?", "options": ["The expected cost per year of not performing a given risk-mitigating action", "The business impact of a risk", "The percentage of Asset Lost Efficiency", "The probability of a risk coming to pass in a given year"], "correct_idx": 0, "explanation": "The Annualized Loss Expectancy (ALE) is a standard metric of risk exposure that refers to the expected cost per year of a given risk if it is not mitigated. The business impact of a risk is technically considered a loss, and is better captured by a metric called Single Loss Expectancy (see ISC2 Study Guide, chapter 1, module 2). The probability of a risk coming to pass in a given year is best captured by a metric called Annualized Rate of Occurrence (ARO). Asset Lost Efficiency is a misleading t", "short_explanation_en": "The Annualized Loss Expectancy (ALE) is a standard metric of risk exposure that refers to the expected cost per year of a given risk if it is not mitigated.", "question_th": "ในบริบทของการบริหารความเสี่ยง ALE ให้ข้อมูลใด?", "options_th": ["ต้นทุนที่คาดว่าจะเกิดขึ้นต่อปีของการไม่ดำเนินการลดความเสี่ยงที่กำหนด", "ผลกระทบทางธุรกิจของความเสี่ยง", "เปอร์เซ็นต์ของ Asset Lost Efficiency", "ความน่าจะเป็นที่ความเสี่ยงจะเกิดขึ้นในปีที่กำหนด"], "explanation_th": "Annualized Loss Expectancy (ALE) เป็นตัวชี้วัดมาตรฐานของการเปิดรับความเสี่ยงที่หมายถึงต้นทุนที่คาดว่าจะเกิดขึ้นต่อปีของความเสี่ยงที่กำหนดหากไม่ได้รับการลด ผลกระทบทางธุรกิจของความเสี่ยงถือเป็นการสูญเสียทางเทคนิค และถูกจับได้ดีกว่าด้วยตัวชี้วัดที่เรียกว่า Single Loss Expectancy"}, {"id": 309, "dom": 1, "question": "Which of these techniques is PRIMARILY used to ensure data integrity?", "options": ["Message Digest", "Content Encryption", "Backups", "Hashing"], "correct_idx": 0, "explanation": "Data integrity means that a message has not been tampered with or altered. A Message Digest ensures the integrity of any message data that is transmitted over an insecure channel (since a channel that may alter the message's content) (see ISC2 Study Guide, chapter 1, module 1). Cryptographic hash functions (like MD5 or SHA-256) create a fixed-length digital fingerprint of the message data called the Message Digest. If the Message Digest does not match, then the message's integrity has been compr", "short_explanation_en": "Data integrity means that a message has not been tampered with or altered.", "question_th": "เทคนิคใดถูกใช้เป็นหลักเพื่อรับประกันความถูกต้องครบถ้วนของข้อมูล (Data integrity)?", "options_th": ["Message Digest", "Content Encryption", "Backups", "Hashing"], "explanation_th": "ความถูกต้องครบถ้วนของข้อมูลหมายความว่าข้อความไม่ถูกดัดแปลงหรือเปลี่ยนแปลง Message Digest รับประกันความถูกต้องครบถ้วนของข้อมูลข้อความใด ๆ ที่ถูกส่งผ่านช่องทางที่ไม่ปลอดภัย ฟังก์ชันแฮชเข้ารหัส (เช่น MD5 หรือ SHA-256) สร้างลายนิ้วมือดิจิทัลความยาวคงที่ของข้อมูลข้อความที่เรียกว่า Message Digest"}, {"id": 310, "dom": 2, "question": "Which of these is an example of a privacy breach?", "options": ["Any observable occurrence in a network or system", "Being exposed to the possibility of attack", "Unavailability of critical systems", "Access of private information by an unauthorized person github.com/ayemunhossain"], "correct_idx": 3, "explanation": "A privacy breach is a compromise of confidentiality (see ISC2 Study Guide, chapter 2, module 1). The NIST defines privacy breach as \"the loss of control, compromise, unauthorized disclosure, unauthorized acquisition, or any similar occurrence where a person other than an authorized user accesses (or potentially accesses) personally identifiable information, or uses it for anything other than its authorized purpose\". The unavailability of a critical system is a compromise of availability (not of", "short_explanation_en": "A privacy breach is a compromise of confidentiality (see ISC2 Study Guide, chapter 2, module 1).", "question_th": "ข้อใดเป็นตัวอย่างของการละเมิดความเป็นส่วนตัว (Privacy breach)?", "options_th": ["เหตุการณ์ใด ๆ ที่สังเกตได้ในเครือข่ายหรือระบบ", "การถูกเปิดเผยต่อความเป็นไปได้ในการถูกโจมตี", "ความไม่พร้อมใช้งานของระบบสำคัญ", "การเข้าถึงข้อมูลส่วนบุคคลโดยบุคคลที่ไม่ได้รับอนุญาต"], "explanation_th": "การละเมิดความเป็นส่วนตัวคือการถูกละเมิด confidentiality โดย NIST นิยามว่าเป็นการสูญเสียการควบคุมหรือการเข้าถึงข้อมูลส่วนบุคคลโดยบุคคลที่ไม่ได้รับอนุญาต"}, {"id": 311, "dom": 4, "question": "Which of these terms refers to a collection of fixes?", "options": ["Downgrade", "Patch", "Service Pack", "Hotfix"], "correct_idx": 2, "explanation": "A service pack comprises a collection of updates, fixes or enhancements to a software program delivered as a single installable package. A hotfix (or quick-fix) engineering update is a cumulative package which includes information that will be used to address a problem in a software product. A software patch is a quick-repair job for a piece of programming, and is designed to resolve functionality issues, improve security and/or add new features.", "short_explanation_en": "A service pack comprises a collection of updates, fixes or enhancements to a software program delivered as a single installable package.", "question_th": "คำใดต่อไปนี้หมายถึงการรวมของการแก้ไข (fixes)?", "options_th": ["Downgrade", "Patch", "Service Pack", "Hotfix"], "explanation_th": "Service pack ประกอบด้วยชุดอัปเดต การแก้ไข หรือการปรับปรุงโปรแกรมซอฟต์แวร์ที่ส่งมอบเป็นแพ็กเกจติดตั้งเดียว Hotfix (หรือ quick-fix) คือแพ็กเกจสะสมที่รวมข้อมูลที่ใช้แก้ไขปัญหาในผลิตภัณฑ์ซอฟต์แวร์"}, {"id": 312, "dom": 5, "question": "While performing background checks on new employees, which of these can NEVER be an attribute for discrimination?", "options": ["Employment history, references, criminal records", "Credit history, employment history, references", "Criminal Records, credit history, references", "References, education, political affiliation, employment history"], "correct_idx": 3, "explanation": "The correct answer is A. A best practice when hiring new staff is to perform a background check, so as to minimize risks. A company can use discriminatory factors such as references, academic degrees, and employment, criminal, or credit history (although this is not very common). However, it is illegal to inquire about potential or current employees' political preferences (see ISC2 Study Guide, chapter 5, module 4).", "short_explanation_en": "The correct answer is A. A best practice when hiring new staff is to perform a background check, so as to minimize risks.", "question_th": "เมื่อทำการตรวจสอบประวัติพนักงานใหม่ ข้อใดไม่สามารถใช้เป็นปัจจัยในการเลือกปฏิบัติได้เลย?", "options_th": ["ประวัติการทำงาน การอ้างอิง บันทึกอาชญากรรม", "ประวัติเครดิต ประวัติการทำงาน การอ้างอิง", "บันทึกอาชญากรรม ประวัติเครดิต การอ้างอิง", "การอ้างอิง การศึกษา ความเกี่ยวข้องทางการเมือง ประวัติการทำงาน"], "explanation_th": "คำตอบที่ถูกต้องคือ A แนวปฏิบัติที่ดีเมื่อจ้างพนักงานใหม่คือการตรวจสอบประวัติเพื่อลดความเสี่ยง บริษัทสามารถใช้ปัจจัยเช่น การอ้างอิง วุฒิการศึกษา และประวัติการทำงาน อาชญากรรม หรือเครดิต (แม้จะไม่ค่อยพบบ่อยนัก) อย่างไรก็ตาม การสอบถามเกี่ยวกับความเกี่ยวข้องทางการเมืองของพนักงานที่มีศักยภาพหรือปัจจุบันนั้นผิดกฎหมาย"}, {"id": 313, "dom": 1, "question": "When looking for cybersecurity insurance, which of these is the MOST IMPORTANT objective?", "options": ["Risk acceptance", "Risk transference", "Risk avoidance", "Risk spreading"], "correct_idx": 1, "explanation": "The purpose of any insurance is to transfer risk from one party to another. The insurer is obligated to indemnify the insured for a loss caused by an unexpected event, over the course of a definite and mutually-agreed period of time. Risk avoidance consists in avoiding or eliminating the actions and conditions that give rise to the risk. Risk spreading consists in spreading a significant amount of risk over a larger part of the organization or activity, namely by manipulating the sequence or siz", "short_explanation_en": "The purpose of any insurance is to transfer risk from one party to another.", "question_th": "เมื่อมองหาประกันภัยความปลอดภัยไซเบอร์ ข้อใดคือวัตถุประสงค์ที่สำคัญที่สุด?", "options_th": ["Risk acceptance", "Risk transference", "Risk avoidance", "Risk spreading"], "explanation_th": "วัตถุประสงค์ของการประกันภัยใด ๆ คือการโอนความเสี่ยงจากฝ่ายหนึ่งไปยังอีกฝ่ายหนึ่ง ผู้รับประกันมีหน้าที่ชดเชยผู้เอาประกันสำหรับความสูญเสียที่เกิดจากเหตุการณ์ที่ไม่คาดคิดตลอดระยะเวลาที่กำหนดและตกลงร่วมกัน Risk avoidance คือการหลีกเลี่ยงหรือขจัดการกระทำและเงื่อนไขที่ก่อให้เกิดความเสี่ยง"}, {"id": 314, "dom": 4, "question": "Which of these documents is MORE directly related to what can be done with a system or with its information?", "options": ["SLA", "MOA", "MOU", "ROE"], "correct_idx": 2, "explanation": "A Memorandum of Understanding (MOU) outlines the terms and conditions for collaboration, including eventual restrictions on the use of information (see ISC2 Study Guide, chapter 4, module 3). A Memorandum of Agreement (MOA) is similar to an MOU, but is both more formal and legally binding. A Service Level Agreement (SLA) is a contract between a service provider and a customer which specifies service-related guarantees or warranties. In Cybersecurity, Rules of Engagement (ROE) are guidelines and", "short_explanation_en": "A Memorandum of Understanding (MOU) outlines the terms and conditions for collaboration, including eventual restrictions on the use of information (see ISC2 Study Guide, chapter 4, module 3).", "question_th": "เอกสารใดต่อไปนี้เกี่ยวข้องโดยตรงกับสิ่งที่สามารถทำได้กับระบบหรือข้อมูลของระบบ?", "options_th": ["SLA", "MOA", "MOU", "ROE"], "explanation_th": "Memorandum of Understanding (MOU) ระบุข้อกำหนดและเงื่อนไขสำหรับความร่วมมือ รวมถึงข้อจำกัดในการใช้ข้อมูลในที่สุด Memorandum of Agreement (MOA) คล้ายกับ MOU แต่เป็นทางการและมีผลผูกพันทางกฎหมายมากกว่า"}, {"id": 315, "dom": 2, "question": "Which kind of document outlines the procedures ensuring that vital company systems keep running during business- disrupting events?", "options": ["Business Impact Analysis", "Business Impact Plan", "Business Continuity Plan", "Disaster Recovery Plan"], "correct_idx": 2, "explanation": "A Business Continuity Plan (BCP) is a predetermined set of instructions describing how an organization's business processes will be sustained during and after a significant disruption (see Chapter 2 ISC2 Study Guide, module 4, under Terms and Definitions). A Business Impact Analysis (BIA) is a method of analyzing how such disruptions can affect an organization. A Disaster Recovery Plan is used to recover systems after a major failure or disaster. The term 'Business Impact Plan' does not actually", "short_explanation_en": "A Business Continuity Plan (BCP) is a predetermined set of instructions describing how an organization's business processes will be sustained during and after a significant disruption (see Chapter 2 ISC2 Study Guide, module 4, under...", "question_th": "เอกสารประเภทใดที่ระบุขั้นตอนเพื่อให้ระบบสำคัญขององค์กรยังคงทำงานได้ในระหว่างเหตุการณ์ที่รบกวนธุรกิจ?", "options_th": ["Business Impact Analysis", "Business Impact Plan", "Business Continuity Plan", "Disaster Recovery Plan"], "explanation_th": "Business Continuity Plan (BCP) คือชุดคำสั่งที่กำหนดไว้ล่วงหน้าเพื่ออธิบายว่ากระบวนการทางธุรกิจขององค์กรจะดำเนินต่อไปอย่างไรในระหว่างเหตุการณ์หยุดชะงัก"}, {"i
