<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISC2 CC - Combined Practice Bank (583 Questions)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== CREATIVE MODE SYSTEM DESIGN TOKENS (NEO-BRUTALIST EDITORIAL) ===== */
:root {
  --cream: #EFE9D9;
  --cream-2: #E4DCC4;
  --green: #1F8A4C;
  --green2: #136636;
  --green-dim: rgba(31,138,76,.15);
  --pink: #F06CA8;
  --orange: #E85A1F;
  --yellow: #F5C518;
  --ink: #0F0F0F;
  --ink-2: #2A2A2A;
  --white: #FFFFFF;
  --bg: #EFE9D9;
  --bg2: #E4DCC4;
  --panel: #FFFFFF;
  --card: #FFFFFF;
  --card2: #F7F4EB;
  --line: #0F0F0F;
  --border: #0F0F0F;
  --text: #0F0F0F;
  --text-dim: #2A2A2A;
  --text-faint: #4A4A4A;
  --muted: #4A4A4A;
  --red: #D12438;
  --red-bg: #FFE4E6;
  --red-dim: rgba(209,36,56,.12);
  --blue: #1E40AF;
  --blue-bg: #E0E7FF;
  --green-bg: #DCFCE7;
  --gold: #E85A1F;
  --warn: #E85A1F;
  --shadow: 4px 4px 0 #0F0F0F;
  --radius: 0px;

  /* Typography */
  --font-display: 'Archivo Black', 'IBM Plex Sans Thai', sans-serif;
  --font-body: 'Space Grotesk', 'IBM Plex Sans Thai', sans-serif;
  --font-thai: 'IBM Plex Sans Thai', 'Space Grotesk', sans-serif;
  --font-mono: 'JetBrains Mono', 'IBM Plex Sans Thai', monospace;
}

/* Global Nav */
.creative-global-nav {
  position: sticky; top: 0; z-index: 10000;
  background: var(--cream);
  border-bottom: 3px solid var(--ink);
  font-family: var(--font-body);
}
.cg-nav-inner {
  max-width: 1200px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 18px; gap: 12px; flex-wrap: wrap;
}
.cg-brand {
  display: inline-flex; align-items: center; gap: 8px;
  text-decoration: none; color: var(--ink);
  font-family: var(--font-display); font-size: 15px;
  border: 2px solid var(--ink); background: var(--white);
  padding: 4px 10px; box-shadow: 3px 3px 0 var(--ink);
  text-transform: uppercase;
}
.cg-brand .cg-badge {
  background: var(--yellow); color: var(--ink);
  padding: 1px 6px; font-size: 11px; font-family: var(--font-mono); font-weight: 700;
  border: 1px solid var(--ink);
}
.cg-links {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.cg-link {
  text-decoration: none; color: var(--ink);
  font-family: var(--font-mono); font-size: 11px; font-weight: 700;
  padding: 6px 12px; background: var(--white);
  border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink);
  transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.1s ease;
  white-space: nowrap;
}
.cg-link:hover {
  background: var(--yellow);
  transform: translate(-1px, -1px);
  box-shadow: 3px 3px 0 var(--ink);
}
.cg-link.active {
  background: var(--orange);
  color: var(--white);
  box-shadow: 2px 2px 0 var(--ink);
}
@media (max-width: 768px) {
  .cg-nav-inner { padding: 8px 10px; }
  .cg-links { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; width: 100%; -webkit-overflow-scrolling: touch; }
}

/* Base Styles */
* { box-sizing: border-box; }
body {
  font-family: var(--font-thai);
  background: var(--cream);
  color: var(--ink);
  line-height: 1.6;
  margin: 0;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.app { max-width: 820px; margin: 0 auto; padding: 24px 18px 60px; }
h1, h2, h3 {
  font-family: var(--font-display);
  margin: 0;
  text-transform: uppercase;
  color: var(--ink);
}
.subheading {
  color: var(--ink-2);
  font-size: 13px;
  margin-bottom: 8px;
  font-family: var(--font-mono);
  font-weight: 700;
}

/* Buttons */
.btn {
  padding: 12px 24px;
  border: 2px solid var(--ink);
  background: var(--white);
  color: var(--ink);
  box-shadow: 3px 3px 0 var(--ink);
  cursor: pointer;
  font-family: var(--font-thai);
  font-weight: 700;
  font-size: 15px;
  transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.1s ease;
}
.btn:hover:not(:disabled) {
  background: var(--yellow);
  transform: translate(-2px, -2px);
  box-shadow: 5px 5px 0 var(--ink);
}
.btn:active:not(:disabled) {
  transform: translate(1px, 1px);
  box-shadow: 1px 1px 0 var(--ink);
}
.btn-primary {
  background: var(--orange);
  color: var(--white);
}
.btn-secondary {
  background: var(--white);
  color: var(--ink);
}
.btn-secondary:hover {
  background: var(--yellow);
}

/* Lang Toggle */
.lang-toggle-wrap { display: flex; justify-content: flex-end; margin-bottom: 10px; }
.lang-toggle {
  display: inline-flex;
  background: var(--white);
  border: 2px solid var(--ink);
  box-shadow: 2px 2px 0 var(--ink);
  padding: 2px;
  gap: 2px;
}
.lang-btn {
  border: none;
  background: none;
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  padding: 6px 14px;
  cursor: pointer;
  transition: background 0.1s ease, color 0.1s ease;
  white-space: nowrap;
}
.lang-btn.active {
  background: var(--orange);
  color: var(--white);
}
.lang-unavailable { opacity: 0.4; cursor: not-allowed; }

/* Bilingual Text */
.bilingual-block { margin-bottom: 4px; }
.bilingual-pair { display: flex; flex-direction: column; gap: 3px; margin-bottom: 6px; }
.bilingual-en { color: var(--ink); font-family: var(--font-body); }
.bilingual-th { color: var(--ink-2); font-size: 0.94em; font-family: var(--font-thai); font-weight: 500; }
.lang-chip {
  font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
  color: var(--ink); background: var(--cream-2);
  border: 1.5px solid var(--ink); box-shadow: 1.5px 1.5px 0 var(--ink);
  padding: 1px 6px; margin-right: 6px; display: inline-block; vertical-align: middle;
}
.lang-chip.th { color: var(--ink); background: var(--yellow); }
.question-text .bilingual-en { font-size: 1.05em; margin-bottom: 6px; font-weight: 600; }
.question-text .bilingual-th { font-size: 0.94em; font-weight: 500; border-left: 4px solid var(--orange); padding-left: 10px; }
.option-btn .bilingual-th { margin-top: 4px; }
.explanation-box .bilingual-th { margin-top: 10px; padding-top: 10px; border-top: 2px dashed var(--cream-2); }

/* Start Screen */
.start-screen {
  background: var(--white);
  border: 3px solid var(--ink);
  box-shadow: 5px 5px 0 var(--ink);
  padding: 28px 24px;
  margin-top: 6px;
}
.start-screen h1 { font-size: 26px; margin-bottom: 6px; }
.start-screen .tagline { color: var(--ink-2); font-size: 14.5px; margin-bottom: 24px; font-family: var(--font-thai); }
.section-label {
  font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: 0.08em;
  color: var(--orange); text-transform: uppercase; margin: 20px 0 10px;
}

.mode-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mode-card {
  background: var(--white); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
  padding: 16px; cursor: pointer; text-align: center;
  transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.1s ease;
}
.mode-card:hover {
  background: var(--cream-2);
  transform: translate(-1px, -1px);
  box-shadow: 4px 4px 0 var(--ink);
}
.mode-card h3 { font-size: 16px; margin-bottom: 4px; }
.mode-card span { font-size: 12.5px; color: var(--ink-2); font-family: var(--font-thai); }
.mode-card.selected {
  border-color: var(--ink); background: #DCFCE7;
  box-shadow: 4px 4px 0 var(--ink);
}

.domain-grid { display: flex; flex-direction: column; gap: 8px; }
.domain-row {
  display: flex; align-items: center; gap: 10px;
  background: var(--white); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink);
  padding: 12px 14px; cursor: pointer; transition: background 0.1s ease;
}
.domain-row:hover { background: var(--cream-2); }
.domain-row.checked { border-color: var(--ink); background: #DCFCE7; }
.domain-row input { width: 18px; height: 18px; accent-color: var(--orange); cursor: pointer; }
.domain-row .dnum {
  font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--ink);
  background: var(--cream-2); border: 1.5px solid var(--ink);
  width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
}
.domain-row .dname { flex: 1; font-size: 14.5px; font-weight: 600; }
.domain-row .dcount { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--muted); }
.dth-badge {
  font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--ink);
  background: var(--yellow); border: 1.5px solid var(--ink);
  padding: 1px 6px; margin-right: 4px;
}
.domain-actions { display: flex; gap: 10px; margin-top: 10px; }
.domain-actions button {
  background: var(--white); border: 1.5px solid var(--ink); box-shadow: 2px 2px 0 var(--ink);
  color: var(--ink); font-size: 12px; font-weight: 700; cursor: pointer;
  font-family: var(--font-mono); padding: 4px 10px;
}
.domain-actions button:hover { background: var(--yellow); }

.name-row { display: flex; flex-direction: column; gap: 6px; margin-top: 20px; }
.name-row label { font-size: 14px; color: var(--ink-2); font-weight: 700; }
.name-input {
  padding: 10px 14px; background: var(--white); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink);
  color: var(--ink); font-size: 15px; font-family: var(--font-thai); font-weight: 600;
}
.name-input:focus { outline: none; border-color: var(--orange); }

.count-row { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
.count-row label { font-size: 14px; color: var(--ink-2); font-weight: 700; }
.count-input {
  width: 90px; padding: 10px 12px; background: var(--white);
  border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); color: var(--ink);
  font-size: 15px; font-family: var(--font-mono); font-weight: 700; text-align: center;
}
.count-input:focus { outline: none; border-color: var(--orange); }

.start-btn-row { margin-top: 26px; }
.start-btn-row .btn { width: 100%; }
.warn { color: #DC2626; font-size: 13px; margin-top: 10px; font-family: var(--font-mono); font-weight: 700; }

/* Quiz Screen */
.quiz-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 6px; flex-wrap: wrap; }
.progress-info { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--ink); }
.domain-tag {
  font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--ink);
  background: var(--cream-2); border: 1.5px solid var(--ink); box-shadow: 2px 2px 0 var(--ink);
  padding: 3px 10px; display: inline-block; margin-bottom: 10px; margin-right: 6px;
}
.notice-tag {
  font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--ink);
  background: var(--yellow); border: 1.5px solid var(--ink); box-shadow: 2px 2px 0 var(--ink);
  padding: 3px 10px; display: inline-block; margin-bottom: 10px;
}
.score-live { display: flex; gap: 16px; font-size: 13.5px; font-family: var(--font-mono); font-weight: 700; }
.score-correct { color: var(--green); }
.score-wrong { color: #DC2626; }

.progress-bar-track {
  width: 100%; height: 12px; background: var(--cream-2);
  border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink);
  margin: 14px 0 18px; overflow: hidden;
}
.progress-bar-fill {
  height: 100%; background: var(--orange);
  transition: width 0.35s ease;
}

.question-card {
  background: var(--white); border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink);
  padding: 24px;
}
.question-number {
  font-family: var(--font-mono); font-size: 12.5px; font-weight: 700;
  color: var(--orange); margin-bottom: 8px;
}
.question-text { font-size: 18px; font-weight: 600; line-height: 1.55; margin-bottom: 22px; color: var(--ink); }

.options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.option-btn {
  display: flex; align-items: flex-start; gap: 12px; text-align: left;
  padding: 14px 16px; background: var(--white); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
  cursor: pointer; transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.1s ease;
  color: var(--ink); font-family: var(--font-thai); font-size: 15px;
}
.option-btn:hover:not(.disabled) {
  background: var(--cream-2);
  transform: translate(-1px, -1px);
  box-shadow: 4px 4px 0 var(--ink);
}
.option-letter {
  font-family: var(--font-mono); font-size: 12px; font-weight: 700;
  background: var(--cream); border: 1.5px solid var(--ink);
  padding: 3px 7px; color: var(--ink); display: inline-block;
  flex-shrink: 0;
}
.option-text { flex: 1; }

.option-btn.exam-selected {
  background: var(--yellow) !important;
  border-color: var(--ink) !important;
  box-shadow: 3px 3px 0 var(--ink) !important;
}
.option-btn.correct-selected, .option-btn.correct-reveal {
  background: #BBF7D0 !important;
  border-color: var(--ink) !important;
  color: var(--ink) !important;
  box-shadow: 3px 3px 0 var(--ink) !important;
}
.option-btn.wrong-selected {
  background: #FECDD3 !important;
  border-color: var(--ink) !important;
  color: var(--ink) !important;
  box-shadow: 3px 3px 0 var(--ink) !important;
}
.option-btn.disabled { cursor: default; }

.explanation-box {
  background: var(--cream); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
  padding: 16px; margin-top: 18px;
}
.explanation-title {
  font-family: var(--font-display); font-size: 14px; text-transform: uppercase;
  margin-bottom: 8px; color: var(--ink);
}
.explanation-detail {
  font-size: 14px; line-height: 1.65; color: var(--ink); font-family: var(--font-thai);
}
.explanation-why-title {
  font-family: var(--font-mono); font-size: 12px; font-weight: 700;
  text-transform: uppercase; margin: 12px 0 6px; color: var(--orange);
}
.explanation-why-item { font-size: 13.5px; line-height: 1.55; margin-bottom: 4px; }

.quiz-actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; flex-wrap: wrap; }

/* Exam Mode Specifics */
.exam-bar {
  background: var(--white); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
  padding: 12px 18px; display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 18px; flex-wrap: wrap; gap: 12px;
}
.exam-timer {
  font-family: var(--font-mono); font-size: 20px; font-weight: 700; color: var(--orange);
}
.exam-nav-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin-top: 14px; }
.exam-nav-btn {
  aspect-ratio: 1; border: 2px solid var(--ink); background: var(--white);
  box-shadow: 2px 2px 0 var(--ink); font-family: var(--font-mono); font-weight: 700;
  font-size: 12px; cursor: pointer; transition: background 0.1s ease;
}
.exam-nav-btn:hover { background: var(--yellow); }
.exam-nav-btn.answered { background: var(--yellow); }
.exam-nav-btn.current { outline: 3px solid var(--orange); outline-offset: 1px; }

/* Results Screen */
.results {
  background: var(--white); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
  padding: 32px 24px; text-align: center;
}
.results h2 { font-size: 28px; margin-bottom: 16px; }
.score-circle { margin: 20px auto; }
.score-num {
  font-family: var(--font-mono); font-size: clamp(3rem, 6vw, 4.5rem); font-weight: 900;
  color: var(--orange); line-height: 1;
}
.score-pct {
  font-family: var(--font-mono); font-size: 18px; font-weight: 700; color: var(--ink-2);
  margin-top: 6px;
}
.results-stat-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 24px 0;
}
.stat-card {
  background: var(--white); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
  padding: 14px;
}
.stat-card .val {
  font-family: var(--font-mono); font-size: 22px; font-weight: 700; color: var(--ink);
}
.stat-card .lab {
  font-size: 12px; color: var(--muted); font-family: var(--font-thai); font-weight: 600;
  margin-top: 4px;
}
.domain-results { margin: 24px 0; text-align: left; }

.finish-banner {
  background: #DCFCE7; border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
  padding: 16px; font-weight: 700; margin-bottom: 20px; text-align: center;
}
.incomplete-banner {
  background: #FEF3C7; border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
  padding: 16px; font-weight: 700; margin-bottom: 20px; text-align: center;
}

.review-item {
  background: var(--white); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
  padding: 16px; margin-bottom: 12px; text-align: left;
}
.review-q { font-weight: 700; font-size: 15px; margin-bottom: 8px; }
.review-ans { font-size: 13.5px; margin-bottom: 4px; }
.review-exp {
  background: var(--cream); border: 1.5px solid var(--ink);
  padding: 10px 12px; margin-top: 8px; font-size: 13px; line-height: 1.6;
}

@media (max-width: 600px) {
  .mode-cards { grid-template-columns: 1fr; }
  .results-stat-grid { grid-template-columns: 1fr; }
  .exam-nav-grid { grid-template-columns: repeat(5, 1fr); }
  .quiz-actions { flex-direction: column; }
  .quiz-actions .btn { width: 100%; }
}

/* Topic Icon Badge */
.topic-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 6px;
  border:2px solid var(--ink);background:var(--card2,#F7F4EB);margin-top:6px;margin-bottom:2px;}
.topic-icon{display:inline-flex;align-items:center;color:var(--ink);flex-shrink:0;}
.topic-icon svg{width:18px;height:18px;}
.topic-label{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.5px;
  text-transform:uppercase;color:var(--ink);white-space:nowrap;}
</style>
</head>

<script>
const DOMAIN_NAMES = {1:"Security Principles",2:"BC/DR/IR",3:"Access Controls Concepts",4:"Network Security",5:"Security Operations"};
const DOMAIN_NAMES_TH = {1:"หลักการความปลอดภัย",2:"BC/DR/IR",3:"แนวคิดการควบคุมการเข้าถึง",4:"ความปลอดภัยเครือข่าย",5:"ปฏิบัติการความปลอดภัย"};
const ALL_QUESTIONS = [{"id": 1, "dom": 1, "question": "What is information assurance?", "options": ["A law", "An objective", "Confidentiality", "A technical control"], "correct_idx": 1, "explanation": "Information assurance is the overarching objective of implementing security measures to protect information and systems, encompassing confidentiality, integrity, and availability.", "short_explanation_en": "Information assurance is the overarching objective of implementing security measures to protect information and systems, encompassing confidentiality, integrity, and availability.", "question_th": "Information assurance คืออะไร?", "options_th": ["กฎหมาย", "วัตถุประสงค์", "ความลับ (Confidentiality)", "การควบคุมทางเทคนิค"], "explanation_th": "Information assurance คือวัตถุประสงค์โดยรวมของการนำมาตรการความปลอดภัยมาใช้เพื่อปกป้องข้อมูลและระบบ ครอบคลุมทั้งความลับ ความถูกต้อง และความพร้อมใช้งาน"}, {"id": 2, "dom": 1, "question": "Information assurance is to provide which of the following?", "options": ["A guarantee of availability only", "Risk assessment", "A guarantee of data security", "None of these answers are correct."], "correct_idx": 2, "explanation": "Information assurance guarantees data security broadly, not just one property like availability.", "short_explanation_en": "Information assurance guarantees data security broadly, not just one property like availability.", "question_th": "Information assurance ให้การรับประกันในข้อใด?", "options_th": ["การรับประกันเฉพาะความพร้อมใช้งานเท่านั้น", "การประเมินความเสี่ยง", "การรับประกันความปลอดภัยของข้อมูลโดยรวม", "ไม่มีข้อใดถูกต้อง"], "explanation_th": "Information assurance รับประกันความปลอดภัยของข้อมูลอย่างครอบคลุม ไม่ใช่เพียงคุณสมบัติเดียว เช่น ความพร้อมใช้งาน"}, {"id": 3, "dom": 1, "question": "What is confidentiality?", "options": ["Data secrecy", "Restricting access to data", "Preventing unauthorized disclosures", "All of these answers are correct."], "correct_idx": 3, "explanation": "Confidentiality covers data secrecy, restricting access, and preventing unauthorized disclosures - all three describe the same core concept from different angles.", "short_explanation_en": "Confidentiality covers data secrecy, restricting access, and preventing unauthorized disclosures - all three describe the same core concept from different angles.", "question_th": "Confidentiality คืออะไร?", "options_th": ["ความลับของข้อมูล", "การจำกัดการเข้าถึงข้อมูล", "การป้องกันการเปิดเผยโดยไม่ได้รับอนุญาต", "ถูกทุกข้อ"], "explanation_th": "Confidentiality ครอบคลุมทั้งความลับของข้อมูล การจำกัดการเข้าถึง และการป้องกันการเปิดเผยโดยไม่ได้รับอนุญาต - ทั้งสามข้อล้วนอธิบายแนวคิดหลักเดียวกันจากมุมมองที่ต่างกัน"}, {"id": 4, "dom": 1, "question": "What is integrity?", "options": ["Preventing data from being corrupted", "Not allowing unauthorized changes", "Tracking and logging file access", "All of these answers are correct."], "correct_idx": 3, "explanation": "Integrity means data hasn't been improperly altered, which covers preventing corruption, blocking unauthorized changes, and tracking access via logs.", "short_explanation_en": "Integrity means data hasn't been improperly altered, which covers preventing corruption, blocking unauthorized changes, and tracking access via logs.", "question_th": "Integrity คืออะไร?", "options_th": ["การป้องกันไม่ให้ข้อมูลถูกทำลาย", "การไม่อนุญาตให้มีการเปลี่ยนแปลงโดยไม่ได้รับอนุญาต", "การติดตามและบันทึกการเข้าถึงไฟล์", "ถูกทุกข้อ"], "explanation_th": "Integrity หมายถึงข้อมูลที่ไม่ได้ถูกแก้ไขอย่างไม่เหมาะสม ซึ่งครอบคลุมการป้องกันความเสียหาย การบล็อกการเปลี่ยนแปลงที่ไม่ได้รับอนุญาต และการติดตามการเข้าถึงผ่าน log"}, {"id": 5, "dom": 1, "question": "What is availability?", "options": ["Timely access to data", "Reliable functionality of information systems", "Uninterrupted data flows", "All of these answers are correct."], "correct_idx": 3, "explanation": "Availability means authorized users can reliably and promptly access data and systems whenever needed, without interruption.", "short_explanation_en": "Availability means authorized users can reliably and promptly access data and systems whenever needed, without interruption.", "question_th": "Availability คืออะไร?", "options_th": ["การเข้าถึงข้อมูลได้ทันเวลา", "การทำงานที่เชื่อถือได้ของระบบสารสนเทศ", "การไหลของข้อมูลอย่างต่อเนื่องไม่หยุดชะงัก", "ถูกทุกข้อ"], "explanation_th": "Availability หมายถึงผู้ใช้ที่ได้รับอนุญาตสามารถเข้าถึงข้อมูลและระบบได้อย่างเชื่อถือได้และรวดเร็วเมื่อต้องการ โดยไม่มีการหยุดชะงัก"}, {"id": 6, "dom": 1, "question": "Privacy is ____________________.", "options": ["A fancy name for confidentiality", "The control, possession, and secrecy of a person’s or group’s data", "A purely technical control", "Something made up by lawyers and politicians"], "correct_idx": 1, "explanation": "Privacy concerns a person's or group's ability to control, possess, and keep their own data secret - distinct from (though related to) confidentiality.", "short_explanation_en": "Privacy concerns a person's or group's ability to control, possess, and keep their own data secret - distinct from (though related to) confidentiality.", "question_th": "Privacy คือ ____________________.", "options_th": ["ชื่อเรียกอีกอย่างของ confidentiality", "การควบคุม การครอบครอง และความลับของข้อมูลของบุคคลหรือกลุ่ม", "การควบคุมทางเทคนิคล้วน ๆ", "สิ่งที่ทนายความและนักการเมืองสร้างขึ้น"], "explanation_th": "Privacy เกี่ยวข้องกับความสามารถของบุคคลหรือกลุ่มในการควบคุม ครอบครอง และรักษาความลับของข้อมูลของตนเอง ซึ่งแตกต่างจาก (แม้จะเกี่ยวข้องกับ) confidentiality"}, {"id": 7, "dom": 1, "question": "Which of these isn’t part of one of the four canons of the ISC2 Code of Ethics?", "options": ["Maintaining a perfect track record of preventing security incidents", "Protecting society and the common good", "Protecting the profession", "Acting with honor and honesty"], "correct_idx": 0, "explanation": "The four ISC2 Code of Ethics canons are about protecting society, protecting the profession, and acting honorably - not guaranteeing a flawless security record, which is unrealistic.", "short_explanation_en": "The four ISC2 Code of Ethics canons are about protecting society, protecting the profession, and acting honorably - not guaranteeing a flawless security record, which is unrealistic.", "question_th": "ข้อใดไม่ใช่ส่วนหนึ่งของจรรยาบรรณ (ISC)² Code of Ethics ทั้งสี่ข้อ?", "options_th": ["การรักษาสถิติที่สมบูรณ์แบบในการป้องกันเหตุการณ์ด้านความปลอดภัย", "การปกป้องสังคมและผลประโยชน์ส่วนรวม", "การปกป้องวิชาชีพ", "การกระทำอย่างมีเกียรติและซื่อสัตย์"], "explanation_th": "จรรยาบรรณทั้งสี่ข้อของ ISC2 เกี่ยวกับการปกป้องสังคม การปกป้องวิชาชีพ และการกระทำอย่างมีเกียรติ - ไม่ใช่การรับประกันสถิติความปลอดภัยที่ไร้ที่ติซึ่งเป็นไปไม่ได้ในทางปฏิบัติ"}, {"id": 8, "dom": 1, "question": "What is risk management?", "options": ["The source of rationale behind cybersecurity controls", "Planning for future emergencies", "A lot of administrative work", "All of these answers are correct."], "correct_idx": 3, "explanation": "Risk management underlies why controls exist, requires planning for future events, and involves significant administrative documentation and process work.", "short_explanation_en": "Risk management underlies why controls exist, requires planning for future events, and involves significant administrative documentation and process work.", "question_th": "Risk management คืออะไร?", "options_th": ["แหล่งที่มาของเหตุผลเบื้องหลังการควบคุมความปลอดภัยไซเบอร์", "การวางแผนสำหรับเหตุฉุกเฉินในอนาคต", "งานด้านการบริหารจัดการจำนวนมาก", "ถูกทุกข้อ"], "explanation_th": "Risk management เป็นรากฐานว่าทำไมการควบคุมจึงมีอยู่ ต้องมีการวางแผนสำหรับเหตุการณ์ในอนาคต และเกี่ยวข้องกับงานเอกสารและกระบวนการบริหารจัดการจำนวนมาก"}, {"id": 9, "dom": 1, "question": "Which of the following is a source of danger to information systems?", "options": ["Risk", "Threat", "Vulnerability", "All of these answers are correct."], "correct_idx": 1, "explanation": "A threat is a potential danger or circumstance that could exploit a vulnerability and cause harm to a system.", "short_explanation_en": "A threat is a potential danger or circumstance that could exploit a vulnerability and cause harm to a system.", "question_th": "ข้อใดคือแหล่งที่มาของอันตรายต่อระบบสารสนเทศ?", "options_th": ["Risk", "Threat", "Vulnerability", "ถูกทุกข้อ"], "explanation_th": "Threat คืออันตรายหรือสถานการณ์ที่อาจใช้ประโยชน์จากช่องโหว่และก่อให้เกิดความเสียหายต่อระบบ"}, {"id": 10, "dom": 1, "question": "Which of the following is a weakness in information systems?", "options": ["Risk", "Threat", "Vulnerability", "All of these answers are correct."], "correct_idx": 2, "explanation": "A vulnerability is a weakness or gap in a system's defenses that a threat could exploit.", "short_explanation_en": "A vulnerability is a weakness or gap in a system's defenses that a threat could exploit.", "question_th": "ข้อใดคือจุดอ่อนในระบบสารสนเทศ?", "options_th": ["Risk", "Threat", "Vulnerability", "ถูกทุกข้อ"], "explanation_th": "Vulnerability คือจุดอ่อนหรือช่องโหว่ในการป้องกันของระบบที่ Threat อาจใช้ประโยชน์ได้"}, {"id": 11, "dom": 1, "question": "Which of the following are two components to risk?", "options": ["Threat and vulnerability", "Treatment and assessment", "Priorities and tolerance", "Likelihood and impact"], "correct_idx": 3, "explanation": "Risk is calculated from likelihood (probability a threat exploits a vulnerability) and impact (the resulting harm).", "short_explanation_en": "Risk is calculated from likelihood (probability a threat exploits a vulnerability) and impact (the resulting harm).", "question_th": "องค์ประกอบสองประการของความเสี่ยง (Risk) คืออะไร?", "options_th": ["Threat และ vulnerability", "Treatment และ assessment", "Priorities และ tolerance", "Likelihood และ impact"], "explanation_th": "Risk คำนวณจาก likelihood (ความน่าจะเป็นที่ threat จะใช้ประโยชน์จาก vulnerability) และ impact (ความเสียหายที่เกิดขึ้น)"}, {"id": 12, "dom": 1, "question": "How are risk priorities determined?", "options": ["Through the calculation of likelihood and impact", "Based on the analyst’s whim", "Based on what an organization can afford to address", "All risks are given equal priority"], "correct_idx": 0, "explanation": "Risk priorities come from scoring each risk's likelihood and impact, then ranking them so the highest-risk items get addressed first.", "short_explanation_en": "Risk priorities come from scoring each risk's likelihood and impact, then ranking them so the highest-risk items get addressed first.", "question_th": "ลำดับความสำคัญของความเสี่ยง (Risk priorities) ถูกกำหนดอย่างไร?", "options_th": ["ผ่านการคำนวณ likelihood และ impact", "ตามความพอใจของนักวิเคราะห์", "ตามสิ่งที่องค์กรสามารถจ่ายได้เพื่อจัดการ", "ความเสี่ยงทั้งหมดได้รับความสำคัญเท่ากัน"], "explanation_th": "ลำดับความสำคัญของความเสี่ยงมาจากการให้คะแนน likelihood และ impact ของแต่ละความเสี่ยง แล้วจัดลำดับเพื่อจัดการรายการที่มีความเสี่ยงสูงสุดก่อน"}, {"id": 13, "dom": 1, "question": "What does it mean to determine the scope of a risk assessment?", "options": ["Looking at the company offices through a telescope", "Determining what the risk analyst has time to assess", "Determining whether the assessment covers one system, multiple systems, or the whole organization", "Risk assessments should cover every part of the organization."], "correct_idx": 2, "explanation": "Scoping a risk assessment means defining its boundaries - whether it covers a single system, several systems, or the entire organization.", "short_explanation_en": "Scoping a risk assessment means defining its boundaries - whether it covers a single system, several systems, or the entire organization.", "question_th": "การกำหนดขอบเขต (Scope) ของการประเมินความเสี่ยงหมายถึงอะไร?", "options_th": ["การมองสำนักงานบริษัทผ่านกล้องส่องทางไกล", "การกำหนดสิ่งที่นักวิเคราะห์ความเสี่ยงมีเวลาประเมิน", "การกำหนดว่าการประเมินครอบคลุมระบบเดียว หลายระบบ หรือทั้งองค์กร", "การประเมินความเสี่ยงควรครอบคลุมทุกส่วนขององค์กร"], "explanation_th": "การกำหนดขอบเขตของการประเมินความเสี่ยงหมายถึงการกำหนดขอบเขตของมัน - ไม่ว่าจะครอบคลุมระบบเดียว หลายระบบ หรือทั้งองค์กร"}, {"id": 14, "dom": 1, "question": "How many steps are there in risk management?", "options": ["Three", "Five", "Six", "There are various models, so all these answers are correct."], "correct_idx": 3, "explanation": "Different risk management frameworks (NIST, ISO, etc.) define different numbers of steps, so there's no single universal count.", "short_explanation_en": "Different risk management frameworks (NIST, ISO, etc.) define different numbers of steps, so there's no single universal count.", "question_th": "การบริหารความเสี่ยง (Risk management) มีกี่ขั้นตอน?", "options_th": ["สาม", "ห้า", "หก", "มีหลายโมเดล ดังนั้นถูกทุกข้อ"], "explanation_th": "กรอบการบริหารความเสี่ยงที่แตกต่างกัน (NIST, ISO ฯลฯ) กำหนดจำนวนขั้นตอนที่แตกต่างกัน จึงไม่มีจำนวนที่เป็นสากลเพียงหนึ่งเดียว"}, {"id": 15, "dom": 1, "question": "What types of risks should be considered in a risk assessment?", "options": ["Only technical risks", "Only business risks", "Only legal and regulatory risks", "All of these answers are correct."], "correct_idx": 3, "explanation": "A thorough risk assessment considers technical, business, and legal/regulatory risks together, since they all affect the organization.", "short_explanation_en": "A thorough risk assessment considers technical, business, and legal/regulatory risks together, since they all affect the organization.", "question_th": "ควรพิจารณาความเสี่ยงประเภทใดในการประเมินความเสี่ยง?", "options_th": ["เฉพาะความเสี่ยงทางเทคนิคเท่านั้น", "เฉพาะความเสี่ยงทางธุรกิจเท่านั้น", "เฉพาะความเสี่ยงทางกฎหมายและกฎระเบียบเท่านั้น", "ถูกทุกข้อ"], "explanation_th": "การประเมินความเสี่ยงที่ครอบคลุมควรพิจารณาความเสี่ยงทางเทคนิค ธุรกิจ และกฎหมาย/กฎระเบียบร่วมกัน เนื่องจากทั้งหมดส่งผลกระทบต่อองค์กร"}, {"id": 16, "dom": 1, "question": "How should risks be identified?", "options": ["By reading industry articles, journals, and reports", "By evaluating the current state of the organization’s systems", "Using professional experience and judgment", "All of these answers are correct."], "correct_idx": 3, "explanation": "Risks can be identified through industry research, evaluating current systems, and applying professional judgment - all valid identification methods.", "short_explanation_en": "Risks can be identified through industry research, evaluating current systems, and applying professional judgment - all valid identification methods.", "question_th": "ควรระบุความเสี่ยงอย่างไร?", "options_th": ["โดยการอ่านบทความ วารสาร และรายงานอุตสาหกรรม", "โดยการประเมินสถานะปัจจุบันของระบบขององค์กร", "โดยใช้ประสบการณ์และวิจารณญาณทางวิชาชีพ", "ถูกทุกข้อ"], "explanation_th": "ความเสี่ยงสามารถระบุได้ผ่านการวิจัยอุตสาหกรรม การประเมินระบบปัจจุบัน และการใช้วิจารณญาณทางวิชาชีพ - ล้วนเป็นวิธีการระบุที่ถูกต้อง"}, {"id": 17, "dom": 1, "question": "What happens in a risk assessment?", "options": ["Based on risk identification and prioritization, scoring risks, evaluating scores, and choosing a response", "Treating risks based on what’s best for the organization", "Brainstorming possible emergencies", "Creating large and annoying matrices"], "correct_idx": 0, "explanation": "A risk assessment involves identifying and prioritizing risks, scoring them, evaluating those scores, and selecting an appropriate response.", "short_explanation_en": "A risk assessment involves identifying and prioritizing risks, scoring them, evaluating those scores, and selecting an appropriate response.", "question_th": "เกิดอะไรขึ้นในการประเมินความเสี่ยง (Risk assessment)?", "options_th": ["จากการระบุและจัดลำดับความสำคัญของความเสี่ยง การให้คะแนน การประเมินคะแนน และการเลือกการตอบสนอง", "การจัดการความเสี่ยงตามสิ่งที่ดีที่สุดสำหรับองค์กร", "การระดมความคิดเกี่ยวกับเหตุฉุกเฉินที่เป็นไปได้", "การสร้างเมทริกซ์ขนาดใหญ่ที่น่ารำคาญ"], "explanation_th": "การประเมินความเสี่ยงประกอบด้วยการระบุและจัดลำดับความสำคัญของความเสี่ยง การให้คะแนน การประเมินคะแนนเหล่านั้น และการเลือกการตอบสนองที่เหมาะสม"}, {"id": 18, "dom": 1, "question": "What are the four types of responses to risks?", "options": ["Mitigate, remediate, ameliorate, reduce", "Avoid, accept, reduce, transfer", "Deny, transfer, reduce, ignore", "Tolerate, treat, transfer, accept"], "correct_idx": 1, "explanation": "The four standard risk responses are: avoid (eliminate the activity), accept (take no action), reduce/mitigate (lower likelihood or impact), and transfer (shift risk, e.g. via insurance).", "short_explanation_en": "The four standard risk responses are: avoid (eliminate the activity), accept (take no action), reduce/mitigate (lower likelihood or impact), and transfer (shift risk, e.g. via insurance).", "question_th": "การตอบสนองต่อความเสี่ยงสี่ประเภทคืออะไร?", "options_th": ["Mitigate, remediate, ameliorate, reduce", "Avoid, accept, reduce, transfer", "Deny, transfer, reduce, ignore", "Tolerate, treat, transfer, accept"], "explanation_th": "การตอบสนองต่อความเสี่ยงมาตรฐานสี่ประเภทคือ: avoid (หลีกเลี่ยง - ยกเลิกกิจกรรม), accept (ยอมรับ - ไม่ดำเนินการ), reduce/mitigate (ลด - ลด likelihood หรือ impact) และ transfer (โอนย้าย - เช่น ผ่านการทำประกัน)"}, {"id": 19, "dom": 1, "question": "What is risk tolerance?", "options": ["How risk-averse an organization is", "The measuring stick by which we choose our risk responses", "The result of a variety of factors, such as organization type and leadership", "All of these answers are correct."], "correct_idx": 3, "explanation": "Risk tolerance reflects how much risk an organization is willing to accept, shaped by factors like industry, leadership, and organization type, and it guides which risk response is chosen.", "short_explanation_en": "Risk tolerance reflects how much risk an organization is willing to accept, shaped by factors like industry, leadership, and organization type, and it guides which risk response is chosen.", "question_th": "Risk tolerance คืออะไร?", "options_th": ["ความระมัดระวังต่อความเสี่ยงขององค์กร", "เกณฑ์มาตรฐานที่ใช้เลือกการตอบสนองต่อความเสี่ยง", "ผลลัพธ์ของปัจจัยหลากหลาย เช่น ประเภทองค์กรและผู้บริหาร", "ถูกทุกข้อ"], "explanation_th": "Risk tolerance สะท้อนถึงระดับความเสี่ยงที่องค์กรเต็มใจยอมรับ ซึ่งได้รับอิทธิพลจากปัจจัยต่าง ๆ เช่น อุตสาหกรรม ผู้บริหาร และประเภทองค์กร และเป็นตัวกำหนดการตอบสนองต่อความเสี่ยงที่จะเลือก"}, {"id": 20, "dom": 1, "question": "Which of the following is the risk that will remain after a treatment plan is implemented?", "options": ["Mitigated risk", "Risk tolerance", "Business risk", "Residual risk"], "correct_idx": 3, "explanation": "Residual risk is what remains after controls and treatments have been applied - no treatment eliminates risk entirely.", "short_explanation_en": "Residual risk is what remains after controls and treatments have been applied - no treatment eliminates risk entirely.", "question_th": "ข้อใดคือความเสี่ยงที่จะยังคงเหลืออยู่หลังจากนำแผนการจัดการมาใช้?", "options_th": ["Mitigated risk", "Risk tolerance", "Business risk", "Residual risk"], "explanation_th": "Residual risk คือความเสี่ยงที่ยังคงเหลืออยู่หลังจากมีการนำมาตรการควบคุมและการจัดการมาใช้แล้ว - ไม่มีการจัดการใดที่สามารถขจัดความเสี่ยงได้ทั้งหมด"}, {"id": 21, "dom": 1, "question": "What are the three parts to risk treatment?", "options": ["Mapping out a plan, assigning a control owner, and regular monitoring and review", "Assigning ratings, assessing the organization, and regular monitoring and review", "Mapping out a plan, planning a meeting, and holding said meeting", "One part: deciding how risk will be treated"], "correct_idx": 0, "explanation": "Risk treatment involves creating a plan, assigning an owner responsible for the control, and continuously monitoring and reviewing its effectiveness.", "short_explanation_en": "Risk treatment involves creating a plan, assigning an owner responsible for the control, and continuously monitoring and reviewing its effectiveness.", "question_th": "องค์ประกอบสามส่วนของการจัดการความเสี่ยง (Risk treatment) คืออะไร?", "options_th": ["การวางแผน การมอบหมายเจ้าของการควบคุม และการเฝ้าติดตามและทบทวนอย่างสม่ำเสมอ", "การให้คะแนน การประเมินองค์กร และการเฝ้าติดตามและทบทวนอย่างสม่ำเสมอ", "การวางแผน การวางแผนประชุม และการจัดประชุมดังกล่าว", "หนึ่งส่วนเท่านั้น: การตัดสินใจว่าจะจัดการความเสี่ยงอย่างไร"], "explanation_th": "การจัดการความเสี่ยงเกี่ยวข้องกับการสร้างแผน การมอบหมายเจ้าของที่รับผิดชอบการควบคุม และการเฝ้าติดตามและทบทวนประสิทธิภาพอย่างต่อเนื่อง"}, {"id": 22, "dom": 1, "question": "How are security controls related to risk management?", "options": ["They are not related.", "Each control addresses a risk, whether directly defined or not.", "They are a type of risk management.", "They are the defined and documented risk treatment plans."], "correct_idx": 1, "explanation": "Every security control exists to address some identified risk, even if that link isn't always explicitly documented.", "short_explanation_en": "Every security control exists to address some identified risk, even if that link isn't always explicitly documented.", "question_th": "การควบคุมความปลอดภัย (Security controls) เกี่ยวข้องกับการจัดการความเสี่ยงอย่างไร?", "options_th": ["ไม่เกี่ยวข้องกัน", "แต่ละการควบคุมจัดการกับความเสี่ยงหนึ่งอย่าง ไม่ว่าจะถูกกำหนดไว้โดยตรงหรือไม่", "เป็นรูปแบบหนึ่งของการจัดการความเสี่ยง", "เป็นแผนการจัดการความเสี่ยงที่ถูกกำหนดและบันทึกไว้"], "explanation_th": "การควบคุมความปลอดภัยทุกตัวมีอยู่เพื่อจัดการกับความเสี่ยงที่ระบุไว้บางอย่าง แม้ว่าความเชื่อมโยงนั้นจะไม่ได้ถูกบันทึกไว้อย่างชัดเจนเสมอไป"}, {"id": 23, "dom": 1, "question": "What are the three types of security controls?", "options": ["Written, technical, and managerial", "Penetrating testing, vulnerability scanning, and cryptography", "Administrative, technical, and physical", "Risk management, access control, and network security"], "correct_idx": 2, "explanation": "The three categories of security controls are administrative (policies/procedures), technical (technology-based), and physical (tangible barriers).", "short_explanation_en": "The three categories of security controls are administrative (policies/procedures), technical (technology-based), and physical (tangible barriers).", "question_th": "การควบคุมความปลอดภัยสามประเภทคืออะไร?", "options_th": ["ลายลักษณ์อักษร ทางเทคนิค และการบริหารจัดการ", "การทดสอบเจาะระบบ การสแกนช่องโหว่ และการเข้ารหัส", "การบริหาร (Administrative) ทางเทคนิค (Technical) และทางกายภาพ (Physical)", "การบริหารความเสี่ยง การควบคุมการเข้าถึง และความปลอดภัยเครือข่าย"], "explanation_th": "สามประเภทของการควบคุมความปลอดภัยคือ administrative (นโยบาย/ขั้นตอน) technical (ใช้เทคโนโลยี) และ physical (สิ่งกีดขวางที่จับต้องได้)"}, {"id": 24, "dom": 1, "question": "What is governance documentation? (Choose all that apply.)", "options": ["Unnecessary, boring things to read", "Documentation based on regulations and laws", "Part of every control in a well-developed information security program", "Documentation used only by the human resources department"], "correct_idx": 1, "explanation": "Governance documentation is grounded in laws/regulations, is a foundational part of a mature security program, and is used organization-wide - not just by HR.", "short_explanation_en": "Governance documentation is grounded in laws/regulations, is a foundational part of a mature security program, and is used organization-wide - not just by HR.", "question_th": "เอกสารด้านการกำกับดูแล (Governance documentation) คืออะไร? (เลือกทุกข้อที่ถูกต้อง)", "options_th": ["สิ่งที่น่าเบื่อและไม่จำเป็นต้องอ่าน", "เอกสารที่อิงตามกฎระเบียบและกฎหมาย", "เป็นส่วนหนึ่งของทุกการควบคุมในโปรแกรมความปลอดภัยสารสนเทศที่พัฒนาอย่างดี", "เอกสารที่ใช้เฉพาะโดยฝ่ายทรัพยากรบุคคลเท่านั้น"], "explanation_th": "เอกสารด้านการกำกับดูแลอิงตามกฎหมาย/กฎระเบียบ เป็นรากฐานของโปรแกรมความปลอดภัยที่เติบโตเต็มที่ และถูกใช้ทั่วทั้งองค์กร - ไม่ใช่เพียงโดยฝ่ายทรัพยากรบุคคล"}, {"id": 25, "dom": 1, "question": "What is a threat in cybersecurity?", "options": ["A strategy to prevent data theft", "An event that leads to data destruction only", "Any circumstance or event with the potential to impact operations, assets, or individuals through unauthorized access, destruction, disclosure, or modification of information", "A way to reduce the time that it takes to investigate security issues"], "correct_idx": 2, "explanation": "A threat is any circumstance or event capable of adversely impacting operations, assets, or individuals through unauthorized access, disclosure, destruction, or modification of information.", "short_explanation_en": "A threat is any circumstance or event capable of adversely impacting operations, assets, or individuals through unauthorized access, disclosure, destruction, or modification of information.", "question_th": "Threat ในบริบทความปลอดภัยไซเบอร์คืออะไร?", "options_th": ["กลยุทธ์ป้องกันการขโมยข้อมูล", "เหตุการณ์ที่นำไปสู่การทำลายข้อมูลเท่านั้น", "สถานการณ์หรือเหตุการณ์ใด ๆ ที่มีศักยภาพส่งผลกระทบต่อการดำเนินงาน ทรัพย์สิน หรือบุคคลผ่านการเข้าถึง การทำลาย การเปิดเผย หรือการดัดแปลงข้อมูลโดยไม่ได้รับอนุญาต", "วิธีการลดเวลาที่ใช้ในการสืบสวนปัญหาความปลอดภัย"], "explanation_th": "Threat คือสถานการณ์หรือเหตุการณ์ใด ๆ ที่มีศักยภาพส่งผลกระทบเชิงลบต่อการดำเนินงาน ทรัพย์สิน หรือบุคคล ผ่านการเข้าถึงโดยไม่ได้รับอนุญาต การเปิดเผย การทำลาย หรือการดัดแปลงข้อมูล"}, {"id": 26, "dom": 1, "question": "How can cybersecurity professionals prepare to defend against threats?", "options": ["By ignoring the latest news in the cybersecurity world", "By sharing information with peer organizations", "By ensuring all systems and devices have no vulnerabilities", "By allowing unauthorized access to information and systems"], "correct_idx": 1, "explanation": "Sharing threat information with peer organizations (threat intelligence sharing) helps professionals anticipate and defend against emerging attacks.", "short_explanation_en": "Sharing threat information with peer organizations (threat intelligence sharing) helps professionals anticipate and defend against emerging attacks.", "question_th": "ผู้เชี่ยวชาญด้านความปลอดภัยไซเบอร์สามารถเตรียมตัวป้องกันภัยคุกคามได้อย่างไร?", "options_th": ["โดยการเพิกเฉยต่อข่าวล่าสุดในโลกความปลอดภัยไซเบอร์", "โดยการแบ่งปันข้อมูลกับองค์กรพันธมิตร", "โดยการรับประกันว่าระบบและอุปกรณ์ทั้งหมดไม่มีช่องโหว่", "โดยการอนุญาตให้เข้าถึงข้อมูลและระบบโดยไม่ได้รับอนุญาต"], "explanation_th": "การแบ่งปันข้อมูลภัยคุกคามกับองค์กรพันธมิตร (threat intelligence sharing) ช่วยให้ผู้เชี่ยวชาญคาดการณ์และป้องกันการโจมตีที่เกิดขึ้นใหม่ได้"}, {"id": 27, "dom": 1, "question": "What is the purpose of threat intelligence?", "options": ["To encourage data theft and destruction", "To help cybersecurity professionals and executives make decisions about potential threats", "To slow down the investigation of security issues", "To keep emerging technology concerns around IoT, AI, and some aspects of the cloud a secret"], "correct_idx": 1, "explanation": "Threat intelligence gives cybersecurity professionals and executives the context needed to make informed decisions about which threats matter most and how to respond.", "short_explanation_en": "Threat intelligence gives cybersecurity professionals and executives the context needed to make informed decisions about which threats matter most and how to respond.", "question_th": "วัตถุประสงค์ของ threat intelligence คืออะไร?", "options_th": ["เพื่อส่งเสริมการขโมยและทำลายข้อมูล", "เพื่อช่วยผู้เชี่ยวชาญความปลอดภัยไซเบอร์และผู้บริหารตัดสินใจเกี่ยวกับภัยคุกคามที่อาจเกิดขึ้น", "เพื่อทำให้การสืบสวนปัญหาความปลอดภัยช้าลง", "เพื่อเก็บความกังวลด้านเทคโนโลยีใหม่ เช่น IoT, AI และคลาวด์เป็นความลับ"], "explanation_th": "Threat intelligence ให้บริบทที่ผู้เชี่ยวชาญความปลอดภัยไซเบอร์และผู้บริหารต้องการเพื่อตัดสินใจอย่างมีข้อมูลว่าภัยคุกคามใดสำคัญที่สุดและควรตอบสนองอย่างไร"}, {"id": 28, "dom": 1, "question": "What is ransomware?", "options": ["Code that runs on computer systems without the user’s knowledge", "Malicious software designed to disrupt, damage, or gain unauthorized access to a computer system", "Standalone, self-replicating malware that causes damage to systems", "Malicious software that encrypts your data to block access in exchange for a ransom payment"], "correct_idx": 3, "explanation": "Ransomware specifically encrypts a victim's data and demands payment in exchange for the decryption key.", "short_explanation_en": "Ransomware specifically encrypts a victim's data and demands payment in exchange for the decryption key.", "question_th": "Ransomware คืออะไร?", "options_th": ["โค้ดที่ทำงานบนระบบคอมพิวเตอร์โดยที่ผู้ใช้ไม่รู้ตัว", "ซอฟต์แวร์ที่เป็นอันตรายซึ่งออกแบบมาเพื่อรบกวน ทำลาย หรือเข้าถึงระบบคอมพิวเตอร์โดยไม่ได้รับอนุญาต", "มัลแวร์ที่แพร่กระจายตัวเองแบบสแตนด์อโลนที่ทำให้เกิดความเสียหายต่อระบบ", "ซอฟต์แวร์ที่เป็นอันตรายที่เข้ารหัสข้อมูลของคุณเพื่อบล็อกการเข้าถึงจนกว่าจะจ่ายค่าไถ่"], "explanation_th": "Ransomware เข้ารหัสข้อมูลของเหยื่อโดยเฉพาะและเรียกร้องการชำระเงินเพื่อแลกกับกุญแจถอดรหัส"}, {"id": 29, "dom": 1, "question": "What is the main difference between viruses and worms?", "options": ["Viruses can self-replicate, while worms need a human to execute them on a system.", "Viruses spread through the Internet, while worms spread through LANs.", "Viruses are malware that slows down systems, while worms cause extensive damage to systems.", "Viruses need human interaction to be successful, while worms can selfreplicate and spread without human interaction."], "correct_idx": 3, "explanation": "Viruses require a human to execute an infected file or program to spread, while worms can self-replicate and propagate across networks without any human action.", "short_explanation_en": "Viruses require a human to execute an infected file or program to spread, while worms can self-replicate and propagate across networks without any human action.", "question_th": "ความแตกต่างหลักระหว่างไวรัสและเวิร์ม (Viruses และ Worms) คืออะไร?", "options_th": ["ไวรัสสามารถแพร่กระจายตัวเองได้ ในขณะที่เวิร์มต้องอาศัยมนุษย์ในการรัน", "ไวรัสแพร่กระจายผ่านอินเทอร์เน็ต ในขณะที่เวิร์มแพร่กระจายผ่าน LAN", "ไวรัสคือมัลแวร์ที่ทำให้ระบบช้าลง ในขณะที่เวิร์มก่อให้เกิดความเสียหายอย่างมากต่อระบบ", "ไวรัสต้องการปฏิสัมพันธ์จากมนุษย์ในการทำงาน ในขณะที่เวิร์มสามารถแพร่กระจายตัวเองได้โดยไม่ต้องมีปฏิสัมพันธ์จากมนุษย์"], "explanation_th": "ไวรัสต้องการให้มนุษย์รันไฟล์หรือโปรแกรมที่ติดเชื้อเพื่อแพร่กระจาย ในขณะที่เวิร์มสามารถแพร่กระจายตัวเองและกระจายไปทั่วเครือข่ายได้โดยไม่ต้องมีการกระทำใด ๆ จากมนุษย์"}, {"id": 30, "dom": 1, "question": "What is the main difference between a DDoS attack and a regular DoS attack?", "options": ["A DDoS attack floods a system with traffic to multiple compromised devices, while a regular DoS attack floods one system with traffic to exhaust resources.", "A DDoS attack targets routers, switches, and servers, while a regular DoS attack targets individual devices.", "A DDoS attack alters data between communicating parties, while a regular DoS attack intercepts data between communicating parties.", "A DDoS attack requires physical access to a system, while a DoS attack is executed remotely."], "correct_idx": 0, "explanation": "A DDoS attack uses many compromised devices (a botnet) to flood a target, while a standard DoS attack comes from a single source overwhelming the target's resources.", "short_explanation_en": "A DDoS attack uses many compromised devices (a botnet) to flood a target, while a standard DoS attack comes from a single source overwhelming the target's resources.", "question_th": "ความแตกต่างหลักระหว่างการโจมตีแบบ DDoS และ DoS ปกติคืออะไร?", "options_th": ["การโจมตีแบบ DDoS ท่วมระบบด้วยทราฟฟิกจากอุปกรณ์ที่ถูกบุกรุกหลายเครื่อง ในขณะที่ DoS ปกติท่วมระบบเดียวด้วยทราฟฟิกเพื่อทำให้ทรัพยากรหมด", "DDoS โจมตีเราเตอร์ สวิตช์ และเซิร์ฟเวอร์ ในขณะที่ DoS ปกติโจมตีอุปกรณ์แต่ละเครื่อง", "DDoS เปลี่ยนแปลงข้อมูลระหว่างคู่สื่อสาร ในขณะที่ DoS ปกติดักจับข้อมูลระหว่างคู่สื่อสาร", "DDoS ต้องการการเข้าถึงทางกายภาพต่อระบบ ในขณะที่ DoS ถูกดำเนินการจากระยะไกล"], "explanation_th": "การโจมตีแบบ DDoS ใช้อุปกรณ์ที่ถูกบุกรุกจำนวนมาก (botnet) เพื่อท่วมเป้าหมาย ในขณะที่ DoS มาตรฐานมาจากแหล่งเดียวที่ท่วมทรัพยากรของเป้าหมาย"}, {"id": 31, "dom": 1, "question": "Where are man-in-the-middle (MITM) attacks typically executed?", "options": ["Secure and encrypted networks", "Government organizations and military networks", "In places with insecure Wi-Fi, such as coffee shops or hotels", "Internal networks within an organization"], "correct_idx": 2, "explanation": "MITM attacks are especially common on insecure public Wi-Fi (cafes, hotels, airports) where attackers can intercept traffic between a victim and the network.", "short_explanation_en": "MITM attacks are especially common on insecure public Wi-Fi (cafes, hotels, airports) where attackers can intercept traffic between a victim and the network.", "question_th": "การโจมตีแบบ man-in-the-middle (MITM) มักถูกดำเนินการที่ใด?", "options_th": ["เครือข่ายที่ปลอดภัยและเข้ารหัส", "องค์กรภาครัฐและเครือข่ายทางทหาร", "สถานที่ที่มี Wi-Fi ที่ไม่ปลอดภัย เช่น ร้านกาแฟหรือโรงแรม", "เครือข่ายภายในองค์กร"], "explanation_th": "การโจมตีแบบ MITM พบได้บ่อยเป็นพิเศษบน Wi-Fi สาธารณะที่ไม่ปลอดภัย (ร้านกาแฟ โรงแรม สนามบิน) ซึ่งผู้โจมตีสามารถดักจับทราฟฟิกระหว่างเหยื่อและเครือข่ายได้"}, {"id": 32, "dom": 1, "question": "How do side-channel attacks exploit system vulnerabilities?", "options": ["By intercepting and altering data between communicating parties", "By flooding a system with traffic through coordinated efforts", "By analyzing unintended information leaked by a system’s physical implementation", "By gaining physical access to a system’s hardware components"], "correct_idx": 2, "explanation": "Side-channel attacks extract sensitive information from unintended physical leakage - such as power consumption, timing, or electromagnetic emissions - rather than exploiting software flaws directly.", "short_explanation_en": "Side-channel attacks extract sensitive information from unintended physical leakage - such as power consumption, timing, or electromagnetic emissions - rather than exploiting software flaws directly.", "question_th": "การโจมตีแบบ Side-channel ใช้ประโยชน์จากช่องโหว่ของระบบอย่างไร?", "options_th": ["โดยการดักจับและเปลี่ยนแปลงข้อมูลระหว่างคู่สื่อสาร", "โดยการท่วมระบบด้วยทราฟฟิกผ่านความพยายามที่ประสานงานกัน", "โดยการวิเคราะห์ข้อมูลที่รั่วไหลโดยไม่ตั้งใจจากการติดตั้งทางกายภาพของระบบ", "โดยการเข้าถึงทางกายภาพต่อส่วนประกอบฮาร์ดแวร์ของระบบ"], "explanation_th": "การโจมตีแบบ Side-channel ดึงข้อมูลที่อ่อนไหวจากการรั่วไหลทางกายภาพที่ไม่ได้ตั้งใจ เช่น การใช้พลังงาน จังหวะเวลา หรือคลื่นแม่เหล็กไฟฟ้า มากกว่าการใช้ประโยชน์จากข้อบกพร่องซอฟต์แวร์โดยตรง"}, {"id": 33, "dom": 1, "question": "What are the two categories of firewalls?", "options": ["Stateful and stateless", "Network-based and host-based", "Proxy and packet filtering", "Next-generation and web application"], "correct_idx": 1, "explanation": "Firewalls are broadly categorized as network-based (protecting an entire network segment) or host-based (protecting an individual device).", "short_explanation_en": "Firewalls are broadly categorized as network-based (protecting an entire network segment) or host-based (protecting an individual device).", "question_th": "สองประเภทของไฟร์วอลล์คืออะไร?", "options_th": ["Stateful และ stateless", "Network-based และ host-based", "Proxy และ packet filtering", "Next-generation และ web application"], "explanation_th": "ไฟร์วอลล์ถูกจัดประเภทโดยทั่วไปเป็น network-based (ปกป้องส่วนเครือข่ายทั้งหมด) หรือ host-based (ปกป้องอุปกรณ์แต่ละเครื่อง)"}, {"id": 34, "dom": 1, "question": "What is the main difference between packet filtering firewalls and web application firewalls?", "options": ["Packet filtering firewalls inspect data packets based on payload content, while web application firewalls monitor IP information.", "Packet filtering firewalls authenticate clients and forward requests to servers, while web application firewalls authenticate servers and forward requests to clients.", "Packet filtering firewalls analyze surface-level data such as IP addresses and ports, while web application firewalls inspect HTTP traffic and protect against web-based attacks.", "Packet filtering firewalls utilize machine learning and behavior analytics, while web application firewalls conduct deep packet inspection."], "correct_idx": 2, "explanation": "Packet filtering firewalls inspect basic surface-level data like IP addresses and ports, while web application firewalls go deeper, inspecting HTTP traffic to catch web-specific attacks like SQL injection or XSS.", "short_explanation_en": "Packet filtering firewalls inspect basic surface-level data like IP addresses and ports, while web application firewalls go deeper, inspecting HTTP traffic to catch web-specific attacks like SQL injection or XSS.", "question_th": "ความแตกต่างหลักระหว่าง packet filtering firewalls และ web application firewalls คืออะไร?", "options_th": ["Packet filtering firewalls ตรวจสอบแพ็กเก็ตข้อมูลตามเนื้อหา payload ในขณะที่ web application firewalls เฝ้าติดตามข้อมูล IP", "Packet filtering firewalls ยืนยันตัวตนไคลเอนต์และส่งต่อคำขอไปยังเซิร์ฟเวอร์ ในขณะที่ web application firewalls ยืนยันตัวตนเซิร์ฟเวอร์และส่งต่อคำขอไปยังไคลเอนต์", "Packet filtering firewalls วิเคราะห์ข้อมูลระดับพื้นผิว เช่น IP address และพอร์ต ในขณะที่ web application firewalls ตรวจสอบทราฟฟิก HTTP และป้องกันการโจมตีบนเว็บ", "Packet filtering firewalls ใช้ machine learning และการวิเคราะห์พฤติกรรม ในขณะที่ web application firewalls ทำการตรวจสอบแพ็กเก็ตเชิงลึก"], "explanation_th": "Packet filtering firewalls ตรวจสอบข้อมูลระดับพื้นผิวพื้นฐาน เช่น IP address และพอร์ต ในขณะที่ web application firewalls ตรวจสอบลึกกว่า โดยตรวจสอบทราฟฟิก HTTP เพื่อจับการโจมตีเฉพาะเว็บ เช่น SQL injection หรือ XSS"}, {"id": 35, "dom": 1, "question": "What is the purpose of vulnerability scanning in cybersecurity?", "options": ["To exploit vulnerabilities found in an organization’s environment", "To analyze behaviors on specific endpoints and respond to issues", "To determine what vulnerabilities an organization has, to prioritize remediation efforts, and to track progress", "To apply patches to software to fix vulnerabilities"], "correct_idx": 2, "explanation": "Vulnerability scanning identifies what weaknesses exist in an environment so teams can prioritize remediation and track progress over time - it does not exploit them.", "short_explanation_en": "Vulnerability scanning identifies what weaknesses exist in an environment so teams can prioritize remediation and track progress over time - it does not exploit them.", "question_th": "วัตถุประสงค์ของการสแกนช่องโหว่ (Vulnerability scanning) ในความปลอดภัยไซเบอร์คืออะไร?", "options_th": ["เพื่อใช้ประโยชน์จากช่องโหว่ที่พบในสภาพแวดล้อมขององค์กร", "เพื่อวิเคราะห์พฤติกรรมบน endpoint เฉพาะและตอบสนองต่อปัญหา", "เพื่อกำหนดว่าองค์กรมีช่องโหว่ใด เพื่อจัดลำดับความสำคัญในการแก้ไข และเพื่อติดตามความคืบหน้า", "เพื่อนำแพตช์มาใช้กับซอฟต์แวร์เพื่อแก้ไขช่องโหว่"], "explanation_th": "การสแกนช่องโหว่ระบุจุดอ่อนที่มีอยู่ในสภาพแวดล้อม เพื่อให้ทีมงานสามารถจัดลำดับความสำคัญในการแก้ไขและติดตามความคืบหน้าเมื่อเวลาผ่านไป - ไม่ใช้ประโยชน์จากช่องโหว่เหล่านั้น"}, {"id": 36, "dom": 1, "question": "What is the difference between vulnerability scanning and pentesting?", "options": ["Vulnerability scanning is used to exploit vulnerabilities, while pentesting analyzes behaviors on specific endpoints.", "Vulnerability scanning doesn’t exploit the vulnerabilities, while pentesting aims to find and exploit vulnerabilities.", "Vulnerability scanning allows teams to test incident response and detection processes, while pentesting prioritizes remediation efforts.", "Vulnerability scanning gives a continuous look at what is going on in an organization, while pentesting is conducted with open-source tools."], "correct_idx": 1, "explanation": "Vulnerability scanning only identifies weaknesses without exploiting them, while penetration testing actively attempts to exploit vulnerabilities to prove real-world impact.", "short_explanation_en": "Vulnerability scanning only identifies weaknesses without exploiting them, while penetration testing actively attempts to exploit vulnerabilities to prove real-world impact.", "question_th": "ความแตกต่างระหว่างการสแกนช่องโหว่และการทดสอบเจาะระบบ (Pentesting) คืออะไร?", "options_th": ["การสแกนช่องโหว่ใช้เพื่อใช้ประโยชน์จากช่องโหว่ ในขณะที่ pentesting วิเคราะห์พฤติกรรมบน endpoint เฉพาะ", "การสแกนช่องโหว่ไม่ใช้ประโยชน์จากช่องโหว่ ในขณะที่ pentesting มุ่งค้นหาและใช้ประโยชน์จากช่องโหว่", "การสแกนช่องโหว่ช่วยให้ทีมทดสอบกระบวนการตอบสนองต่อเหตุการณ์และการตรวจจับ ในขณะที่ pentesting จัดลำดับความสำคัญในการแก้ไข", "การสแกนช่องโหว่ให้มุมมองต่อเนื่องของสิ่งที่เกิดขึ้นในองค์กร ในขณะที่ pentesting ดำเนินการด้วยเครื่องมือโอเพนซอร์ส"], "explanation_th": "การสแกนช่องโหว่ระบุจุดอ่อนโดยไม่ใช้ประโยชน์จากมัน ในขณะที่การทดสอบเจาะระบบพยายามใช้ประโยชน์จากช่องโหว่เหล่านั้นอย่างแข็งขันเพื่อพิสูจน์ผลกระทบในโลกจริง"}, {"id": 37, "dom": 1, "question": "What is the purpose of regularly updating and patching systems in cybersecurity?", "options": ["To analyze behaviors on specific endpoints and respond to issues", "To detect and protect against threats using predictive analytics", "To gain unauthorized access to systems and data", "To apply security fixes for vulnerabilities found in the software"], "correct_idx": 3, "explanation": "Patching and updating systems closes known security gaps in software, directly fixing the vulnerabilities that attackers could otherwise exploit.", "short_explanation_en": "Patching and updating systems closes known security gaps in software, directly fixing the vulnerabilities that attackers could otherwise exploit.", "question_th": "วัตถุประสงค์ของการอัปเดตและแพตช์ระบบอย่างสม่ำเสมอในความปลอดภัยไซเบอร์คืออะไร?", "options_th": ["เพื่อวิเคราะห์พฤติกรรมบน endpoint เฉพาะและตอบสนองต่อปัญหา", "เพื่อตรวจจับและป้องกันภัยคุกคามโดยใช้การวิเคราะห์เชิงคาดการณ์", "เพื่อเข้าถึงระบบและข้อมูลโดยไม่ได้รับอนุญาต", "เพื่อนำการแก้ไขความปลอดภัยมาใช้สำหรับช่องโหว่ที่พบในซอฟต์แวร์"], "explanation_th": "การแพตช์และอัปเดตระบบปิดช่องโหว่ความปลอดภัยที่ทราบแล้วในซอฟต์แวร์ โดยแก้ไขช่องโหว่ที่ผู้โจมตีอาจใช้ประโยชน์ได้โดยตรง"}, {"id": 38, "dom": 3, "question": "Which of the following is not an example of physical access controls?", "options": ["Locks", "Gates", "Cybersecurity software", "Fences"], "correct_idx": 2, "explanation": "Physical access controls are tangible barriers or mechanisms (locks, gates, fences) that restrict physical entry - cybersecurity software is a logical/technical control, not physical.", "short_explanation_en": "Physical access controls are tangible barriers or mechanisms (locks, gates, fences) that restrict physical entry - cybersecurity software is a logical/technical control, not physical.", "question_th": "ข้อใดไม่ใช่ตัวอย่างของการควบคุมการเข้าถึงทางกายภาพ?", "options_th": ["กุญแจล็อก", "ประตูรั้ว", "ซอฟต์แวร์ความปลอดภัยไซเบอร์", "รั้วรอบ"], "explanation_th": "การควบคุมการเข้าถึงทางกายภาพคือสิ่งกีดขวางหรือกลไกที่จับต้องได้ (กุญแจ ประตูรั้ว รั้ว) ที่จำกัดการเข้าถึงทางกายภาพ - ซอฟต์แวร์ความปลอดภัยไซเบอร์เป็นการควบคุมเชิงตรรกะ/เทคนิค ไม่ใช่ทางกายภาพ"}, {"id": 39, "dom": 3, "question": "Which type of badging system uses RFID technology for access control?", "options": ["Proximity cards", "Smart cards", "Biometric IDs", "Turnstiles"], "correct_idx": 0, "explanation": "Proximity cards use RFID (radio-frequency identification) technology, letting a badge be read at a short distance without direct contact.", "short_explanation_en": "Proximity cards use RFID (radio-frequency identification) technology, letting a badge be read at a short distance without direct contact.", "question_th": "ระบบบัตรผ่านประเภทใดที่ใช้เทคโนโลยี RFID ในการควบคุมการเข้าถึง?", "options_th": ["บัตร Proximity", "บัตร Smart card", "ระบบไบโอเมตริกซ์", "Turnstiles"], "explanation_th": "บัตร Proximity ใช้เทคโนโลยี RFID (การระบุตัวตนด้วยคลื่นความถี่วิทยุ) ทำให้สามารถอ่านบัตรได้ในระยะใกล้โดยไม่ต้องสัมผัสโดยตรง"}, {"id": 40, "dom": 3, "question": "What is the purpose of using gates for physical protection?", "options": ["To visually identify authorized personnel", "To track where access cards are used", "To limit physical access to facilities", "To integrate with badging systems"], "correct_idx": 2, "explanation": "Gates are physical barriers designed to limit and control who can physically enter a facility or area.", "short_explanation_en": "Gates are physical barriers designed to limit and control who can physically enter a facility or area.", "question_th": "วัตถุประสงค์ของการใช้ประตูรั้วเพื่อการป้องกันทางกายภาพคืออะไร?", "options_th": ["เพื่อระบุบุคลากรที่ได้รับอนุญาตด้วยสายตา", "เพื่อติดตามว่าบัตรผ่านถูกใช้ที่ใด", "เพื่อจำกัดการเข้าถึงทางกายภาพต่อสถานที่", "เพื่อผสานรวมกับระบบบัตรผ่าน"], "explanation_th": "ประตูรั้วเป็นสิ่งกีดขวางทางกายภาพที่ออกแบบมาเพื่อจำกัดและควบคุมว่าใครสามารถเข้าถึงสถานที่หรือพื้นที่ทางกายภาพได้"}, {"id": 41, "dom": 3, "question": "What is a drawback of using turnstiles for access control?", "options": ["They are easily customizable for different organizations.", "They can be integrated with badging systems.", "They can cause delays and bottlenecks in traffic.", "They provide the same level of security as solid gates."], "correct_idx": 2, "explanation": "Turnstiles can create congestion and slow down the flow of people during high-traffic periods, which is a practical drawback despite their access-control benefit.", "short_explanation_en": "Turnstiles can create congestion and slow down the flow of people during high-traffic periods, which is a practical drawback despite their access-control benefit.", "question_th": "ข้อเสียของการใช้ turnstiles สำหรับการควบคุมการเข้าถึงคืออะไร?", "options_th": ["สามารถปรับแต่งได้ง่ายสำหรับองค์กรที่แตกต่างกัน", "สามารถผสานรวมกับระบบบัตรผ่านได้", "สามารถทำให้เกิดความล่าช้าและความคับคั่งของทราฟฟิก", "ให้ระดับความปลอดภัยเทียบเท่ากับประตูทึบ"], "explanation_th": "Turnstiles สามารถก่อให้เกิดความแออัดและทำให้การไหลของผู้คนช้าลงในช่วงเวลาที่มีทราฟฟิกสูง ซึ่งเป็นข้อเสียในทางปฏิบัติแม้จะมีประโยชน์ด้านการควบคุมการเข้าถึง"}, {"id": 42, "dom": 3, "question": "Which access control method is based on unique characteristics like fingerprints or facial recognition?", "options": ["Badging systems", "Access codes or PINs", "Biometric authentication", "Gate"], "correct_idx": 2, "explanation": "Biometric authentication uses unique physical characteristics - like fingerprints or facial features - to verify identity.", "short_explanation_en": "Biometric authentication uses unique physical characteristics - like fingerprints or facial features - to verify identity.", "question_th": "วิธีการควบคุมการเข้าถึงใดที่อิงตามลักษณะเฉพาะตัว เช่น ลายนิ้วมือหรือการจดจำใบหน้า?", "options_th": ["ระบบบัตรผ่าน", "รหัสเข้าถึงหรือ PIN", "การยืนยันตัวตนด้วยไบโอเมตริกซ์", "ประตูรั้ว"], "explanation_th": "การยืนยันตัวตนด้วยไบโอเมตริกซ์ใช้ลักษณะทางกายภาพเฉพาะตัว เช่น ลายนิ้วมือหรือคุณลักษณะใบหน้า เพื่อยืนยันตัวตน"}, {"id": 43, "dom": 3, "question": "Which of the following is not a type of CCTV camera?", "options": ["Fixed cameras", "Dome cameras", "Pan-tilt-zoom (PTZ) cameras", "Mobile cameras"], "correct_idx": 3, "explanation": "Fixed, dome, and PTZ (pan-tilt-zoom) are standard CCTV camera types; 'mobile cameras' isn't a recognized standard CCTV category.", "short_explanation_en": "Fixed, dome, and PTZ (pan-tilt-zoom) are standard CCTV camera types; 'mobile cameras' isn't a recognized standard CCTV category.", "question_th": "ข้อใดไม่ใช่ประเภทของกล้อง CCTV?", "options_th": ["กล้องแบบติดตั้งถาวร (Fixed cameras)", "กล้องแบบโดม (Dome cameras)", "กล้องแบบหมุนซูมได้ (PTZ)", "กล้องเคลื่อนที่ (Mobile cameras)"], "explanation_th": "Fixed, dome และ PTZ (pan-tilt-zoom) เป็นประเภทกล้อง CCTV มาตรฐาน 'กล้องเคลื่อนที่' ไม่ใช่หมวดหมู่ CCTV มาตรฐานที่รู้จัก"}, {"id": 44, "dom": 3, "question": "What is the role of security guards in physical security?", "options": ["They monitor CCTV systems.", "They set up access control systems.", "They patrol and monitor the premises.", "They manage logs and documentation."], "correct_idx": 2, "explanation": "Security guards are primarily responsible for patrolling and physically monitoring premises to detect and respond to security issues in real time.", "short_explanation_en": "Security guards are primarily responsible for patrolling and physically monitoring premises to detect and respond to security issues in real time.", "question_th": "บทบาทของเจ้าหน้าที่รักษาความปลอดภัยในความปลอดภัยทางกายภาพคืออะไร?", "options_th": ["เฝ้าติดตามระบบ CCTV", "ตั้งค่าระบบควบคุมการเข้าถึง", "ลาดตระเวนและเฝ้าติดตามสถานที่", "จัดการ log และเอกสาร"], "explanation_th": "เจ้าหน้าที่รักษาความปลอดภัยมีหน้าที่หลักในการลาดตระเวนและเฝ้าติดตามสถานที่ทางกายภาพเพื่อตรวจจับและตอบสนองต่อปัญหาความปลอดภัยแบบเรียลไทม์"}, {"id": 45, "dom": 3, "question": "What can trigger alarm systems in physical security?", "options": ["Unauthorized access to areas", "Motion when no one should be present", "Lapses in CCTV coverage", "All of these answers are correct."], "correct_idx": 3, "explanation": "Alarm systems can be triggered by unauthorized access attempts, unexpected motion, or breaks in CCTV monitoring coverage - any of these anomalies.", "short_explanation_en": "Alarm systems can be triggered by unauthorized access attempts, unexpected motion, or breaks in CCTV monitoring coverage - any of these anomalies.", "question_th": "สิ่งใดสามารถกระตุ้นระบบสัญญาณเตือนภัยในความปลอดภัยทางกายภาพได้?", "options_th": ["การเข้าถึงพื้นที่โดยไม่ได้รับอนุญาต", "การเคลื่อนไหวในขณะที่ไม่ควรมีใครอยู่", "ช่องว่างในการครอบคลุมของ CCTV", "ถูกทุกข้อ"], "explanation_th": "ระบบสัญญาณเตือนภัยสามารถถูกกระตุ้นได้จากความพยายามเข้าถึงโดยไม่ได้รับอนุญาต การเคลื่อนไหวที่ไม่คาดคิด หรือช่องว่างในการเฝ้าติดตามด้วย CCTV - ความผิดปกติใดข้อหนึ่งก็เพียงพอ"}, {"id": 46, "dom": 3, "question": "How is the retention of access logs and other documentation determined?", "options": ["By the organization’s data retention policy", "By the manager of the security team", "By stakeholder consensus", "By the discretion of individual employees"], "correct_idx": 0, "explanation": "How long access logs and related records are kept is governed by the organization's formal data retention policy.", "short_explanation_en": "How long access logs and related records are kept is governed by the organization's formal data retention policy.", "question_th": "การเก็บรักษาบันทึกการเข้าถึงและเอกสารอื่น ๆ ถูกกำหนดโดยอะไร?", "options_th": ["นโยบายการเก็บรักษาข้อมูลขององค์กร", "ผู้จัดการทีมความปลอดภัย", "ฉันทามติของผู้มีส่วนได้ส่วนเสีย", "ดุลยพินิจของพนักงานแต่ละคน"], "explanation_th": "ระยะเวลาการเก็บรักษาบันทึกการเข้าถึงและเอกสารที่เกี่ยวข้องถูกกำหนดโดยนโยบายการเก็บรักษาข้อมูลอย่างเป็นทางการขององค์กร"}, {"id": 47, "dom": 3, "question": "How do security guards determine whether someone is authorized or unauthorized personnel?", "options": ["They check the person’s identification.", "They analyze the person’s body language.", "They rely on the person’s job title.", "They make a judgment based on the person’s appearance."], "correct_idx": 0, "explanation": "Security guards verify identity primarily by checking a person's official identification/credentials rather than relying on appearance or job title claims.", "short_explanation_en": "Security guards verify identity primarily by checking a person's official identification/credentials rather than relying on appearance or job title claims.", "question_th": "เจ้าหน้าที่รักษาความปลอดภัยตรวจสอบว่าบุคคลใดได้รับอนุญาตหรือไม่ได้รับอนุญาตอย่างไร?", "options_th": ["ตรวจสอบบัตรประจำตัวของบุคคลนั้น", "วิเคราะห์ภาษากายของบุคคลนั้น", "อาศัยตำแหน่งงานของบุคคลนั้น", "ตัดสินตามลักษณะภายนอกของบุคคลนั้น"], "explanation_th": "เจ้าหน้าที่รักษาความปลอดภัยยืนยันตัวตนเป็นหลักโดยการตรวจสอบบัตรประจำตัว/ข้อมูลรับรองอย่างเป็นทางการของบุคคล มากกว่าการอาศัยลักษณะภายนอกหรือการอ้างตำแหน่งงาน"}, {"id": 48, "dom": 3, "question": "Which of the following best describes logical access controls?", "options": ["Access controls that regulate physical access to computer systems", "Access controls that restrict access to software, applications, and databases based on user privileges", "Access controls that separate critical tasks and responsibilities among multiple individuals", "Access controls that monitor and audit user access to information systems"], "correct_idx": 1, "explanation": "Logical access controls restrict access to software, applications, and databases based on a user's assigned privileges, distinct from physical access controls.", "short_explanation_en": "Logical access controls restrict access to software, applications, and databases based on a user's assigned privileges, distinct from physical access controls.", "question_th": "ข้อใดอธิบาย logical access controls ได้ดีที่สุด?", "options_th": ["การควบคุมการเข้าถึงที่กำกับการเข้าถึงทางกายภาพต่อระบบคอมพิวเตอร์", "การควบคุมการเข้าถึงที่จำกัดการเข้าถึงซอฟต์แวร์ แอปพลิเคชัน และฐานข้อมูลตามสิทธิ์ของผู้ใช้", "การควบคุมการเข้าถึงที่แยกงานและความรับผิดชอบที่สำคัญระหว่างบุคคลหลายคน", "การควบคุมการเข้าถึงที่เฝ้าติดตามและตรวจสอบการเข้าถึงระบบสารสนเทศของผู้ใช้"], "explanation_th": "Logical access controls จำกัดการเข้าถึงซอฟต์แวร์ แอปพลิเคชัน และฐานข้อมูลตามสิทธิ์ที่ผู้ใช้ได้รับมอบหมาย ซึ่งแตกต่างจากการควบคุมการเข้าถึงทางกายภาพ"}, {"id": 49, "dom": 3, "question": "What is the principle of least privilege?", "options": ["Users are only provided with the information they need to complete their job.", "Users are granted the least amount of permission necessary to complete their job function.", "Users have access to all the privilege and control in the organization.", "Users have limited access to information or systems."], "correct_idx": 1, "explanation": "Least privilege means giving users only the minimum permissions necessary to perform their specific job functions - nothing more.", "short_explanation_en": "Least privilege means giving users only the minimum permissions necessary to perform their specific job functions - nothing more.", "question_th": "หลักการ least privilege คืออะไร?", "options_th": ["ผู้ใช้ได้รับเพียงข้อมูลที่จำเป็นต่อการทำงานเท่านั้น", "ผู้ใช้ได้รับสิทธิ์น้อยที่สุดที่จำเป็นต่อการปฏิบัติหน้าที่งาน", "ผู้ใช้มีสิทธิ์และการควบคุมทั้งหมดในองค์กร", "ผู้ใช้มีการเข้าถึงข้อมูลหรือระบบที่จำกัด"], "explanation_th": "Least privilege หมายถึงการให้ผู้ใช้ได้รับเพียงสิทธิ์ขั้นต่ำที่จำเป็นในการปฏิบัติหน้าที่งานเฉพาะของตน - ไม่มากไปกว่านั้น"}, {"id": 50, "dom": 3, "question": "What is the purpose of segregation of duties?", "options": ["To ensure efficient completion of tasks", "To reduce the risk of unauthorized or fraudulent activities", "To grant complete control over a process to one person", "To increase efficiency in task completion"], "correct_idx": 1, "explanation": "Segregation of duties splits critical tasks among multiple people so no single individual can complete a sensitive process alone, reducing fraud and error risk.", "short_explanation_en": "Segregation of duties splits critical tasks among multiple people so no single individual can complete a sensitive process alone, reducing fraud and error risk.", "question_th": "วัตถุประสงค์ของ segregation of duties คืออะไร?", "options_th": ["เพื่อรับประกันการทำงานให้เสร็จอย่างมีประสิทธิภาพ", "เพื่อลดความเสี่ยงของกิจกรรมที่ไม่ได้รับอนุญาตหรือการทุจริต", "เพื่อมอบการควบคุมกระบวนการทั้งหมดให้กับบุคคลเดียว", "เพื่อเพิ่มประสิทธิภาพในการทำงานให้เสร็จ"], "explanation_th": "Segregation of duties แบ่งงานที่สำคัญออกเป็นหลายส่วนให้คนละคนรับผิดชอบ เพื่อไม่ให้บุคคลใดบุคคลหนึ่งสามารถดำเนินกระบวนการที่อ่อนไหวได้เพียงลำพัง ลดความเสี่ยงจากการทุจริตและข้อผิดพลาด"}, {"id": 51, "dom": 3, "question": "What is the main difference between mandatory access control and discretionary access control?", "options": ["MAC allows subjects to override access control policies, while DAC does not.", "MAC is focused on data integrity, while DAC is focused on confidentiality.", "MAC implements zero trust in its control mechanism, while DAC separates subjects into trusted and untrusted groups.", "MAC is used in government agencies and defense organizations, while DAC is used in corporate environments."], "correct_idx": 0, "explanation": "In Mandatory Access Control (MAC), access decisions are made centrally by policy and cannot be overridden by users, whereas Discretionary Access Control (DAC) lets resource owners set their own permissions.", "short_explanation_en": "In Mandatory Access Control (MAC), access decisions are made centrally by policy and cannot be overridden by users, whereas Discretionary Access Control (DAC) lets resource owners set their own permissions.", "question_th": "ความแตกต่างหลักระหว่าง mandatory access control และ discretionary access control คืออะไร?", "options_th": ["MAC อนุญาตให้ subject แทนที่นโยบายควบคุมการเข้าถึงได้ ในขณะที่ DAC ไม่อนุญาต", "MAC มุ่งเน้นที่ความถูกต้องครบถ้วนของข้อมูล ในขณะที่ DAC มุ่งเน้นที่ความลับ", "MAC ใช้ zero trust ในกลไกการควบคุม ในขณะที่ DAC แยก subject ออกเป็นกลุ่มที่เชื่อถือได้และไม่ได้", "MAC ใช้ในหน่วยงานราชการและองค์กรป้องกันประเทศ ในขณะที่ DAC ใช้ในสภาพแวดล้อมองค์กร"], "explanation_th": "ใน Mandatory Access Control (MAC) การตัดสินใจการเข้าถึงถูกกำหนดโดยนโยบายส่วนกลางและไม่สามารถถูกแทนที่โดยผู้ใช้ได้ ในขณะที่ Discretionary Access Control (DAC) ให้เจ้าของทรัพยากรกำหนดสิทธิ์ของตนเอง"}, {"id": 52, "dom": 3, "question": "Which access control model focuses on confidentiality by controlling access based on security levels and preventing information leakage?", "options": ["Role-based access control", "Mandatory access control", "Discretionary access control", "Biba Model"], "correct_idx": 1, "explanation": "Mandatory Access Control assigns security labels/clearance levels to enforce confidentiality and prevent information from flowing to unauthorized levels.", "short_explanation_en": "Mandatory Access Control assigns security labels/clearance levels to enforce confidentiality and prevent information from flowing to unauthorized levels.", "question_th": "โมเดลควบคุมการเข้าถึงใดที่มุ่งเน้นความลับโดยควบคุมการเข้าถึงตามระดับความปลอดภัยและป้องกันการรั่วไหลของข้อมูล?", "options_th": ["Role-based access control", "Mandatory access control", "Discretionary access control", "Biba Model"], "explanation_th": "Mandatory Access Control กำหนดป้ายกำกับความปลอดภัย/ระดับชั้นความลับ เพื่อบังคับใช้ความลับและป้องกันไม่ให้ข้อมูลไหลไปยังระดับที่ไม่ได้รับอนุญาต"}, {"id": 53, "dom": 3, "question": "Which security model focuses on controlling access based on the user’s assigned role?", "options": ["Mandatory access control", "Bell-LaPadula Model", "Clark-Wilson Model", "Role-based access control"], "correct_idx": 3, "explanation": "Role-Based Access Control (RBAC) grants permissions based on the role a user is assigned within the organization.", "short_explanation_en": "Role-Based Access Control (RBAC) grants permissions based on the role a user is assigned within the organization.", "question_th": "โมเดลความปลอดภัยใดที่มุ่งเน้นการควบคุมการเข้าถึงตามบทบาทที่ผู้ใช้ได้รับมอบหมาย?", "options_th": ["Mandatory access control", "Bell-LaPadula Model", "Clark-Wilson Model", "Role-based access control"], "explanation_th": "Role-Based Access Control (RBAC) ให้สิทธิ์ตามบทบาทที่ผู้ใช้ได้รับมอบหมายภายในองค์กร"}, {"id": 54, "dom": 3, "question": "What is the purpose of an access matrix in access control?", "options": ["To map permissions to each user or role in the organization", "To enforce separation of duties in a constrained access control model", "To visualize the hierarchy of permissions in a hierarchical access control model", "To centralize user management and access control in an IAM system"], "correct_idx": 0, "explanation": "An access matrix is a table mapping which permissions each user or role has to which resources, giving a clear overview of the access control scheme.", "short_explanation_en": "An access matrix is a table mapping which permissions each user or role has to which resources, giving a clear overview of the access control scheme.", "question_th": "วัตถุประสงค์ของ access matrix ในการควบคุมการเข้าถึงคืออะไร?", "options_th": ["เพื่อจับคู่สิทธิ์กับผู้ใช้หรือบทบาทแต่ละอย่างในองค์กร", "เพื่อบังคับใช้ separation of duties ในโมเดลควบคุมการเข้าถึงแบบจำกัด", "เพื่อแสดงลำดับชั้นของสิทธิ์ในโมเดลควบคุมการเข้าถึงแบบลำดับชั้น", "เพื่อรวมศูนย์การจัดการผู้ใช้และการควบคุมการเข้าถึงในระบบ IAM"], "explanation_th": "Access matrix เป็นตารางที่จับคู่ว่าผู้ใช้หรือบทบาทแต่ละอย่างมีสิทธิ์ใดต่อทรัพยากรใด ให้ภาพรวมที่ชัดเจนของโครงร่างการควบคุมการเข้าถึง"}, {"id": 55, "dom": 3, "question": "Which technology can IAM utilize to enhance security by requiring users to provide multiple forms of authentication when accessing objects?", "options": ["Single sign-on", "Automation scripts", "Security orchestration, automation, and remediation tools", "Multi-factor authentication"], "correct_idx": 3, "explanation": "Multi-Factor Authentication (MFA) requires users to verify their identity using more than one independent factor, significantly strengthening access security.", "short_explanation_en": "Multi-Factor Authentication (MFA) requires users to verify their identity using more than one independent factor, significantly strengthening access security.", "question_th": "เทคโนโลยีใดที่ IAM สามารถใช้เพื่อเพิ่มความปลอดภัยโดยกำหนดให้ผู้ใช้ต้องยืนยันตัวตนหลายรูปแบบเมื่อเข้าถึงวัตถุ?", "options_th": ["Single sign-on", "สคริปต์อัตโนมัติ", "เครื่องมือ Security orchestration, automation, and remediation", "Multi-factor authentication"], "explanation_th": "Multi-Factor Authentication (MFA) กำหนดให้ผู้ใช้ต้องยืนยันตัวตนโดยใช้ปัจจัยอิสระมากกว่าหนึ่งประเภท เสริมความปลอดภัยของการเข้าถึงอย่างมีนัยสำคัญ"}, {"id": 56, "dom": 4, "question": "Which type of network is typically limited in range from a few centimeters to a few meters and connects devices within an individual’s workspace?", "options": ["Local-area network", "Wide-area network", "Personal-area network", "Metropolitan-area network"], "correct_idx": 2, "explanation": "A Personal-Area Network (PAN) has a very short range - typically centimeters to a few meters - connecting devices close to one individual (e.g., Bluetooth devices).", "short_explanation_en": "A Personal-Area Network (PAN) has a very short range - typically centimeters to a few
