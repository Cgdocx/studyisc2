lly related key pair - a public key to encrypt and a private key to decrypt - allowing the public key to be shared openly since only the private key holder can decrypt the data.", "question_th": "วิธีการเข้ารหัสใดที่ใช้ public key ในการเข้ารหัสข้อมูล และใช้ private key ที่สัมพันธ์กันทางคณิตศาสตร์ในการถอดรหัส?", "options_th": ["Steganography", "Asymmetric encryption", "Symmetric encryption", "Hashing"], "explanation_th": "Asymmetric Encryption (การเข้ารหัสแบบอสมมาตร) ใช้กุญแจคู่ที่สัมพันธ์กันทางคณิตศาสตร์ คือ Public Key สำหรับเข้ารหัส และ Private Key สำหรับถอดรหัส ทำให้สามารถแจกจ่าย Public Key ได้อย่างเปิดเผยโดยไม่ทำให้ข้อมูลไม่ปลอดภัย เพราะมีเพียงเจ้าของ Private Key เท่านั้นที่ถอดรหัสได้"}, {"id": 559, "dom": 5, "question": "Which cryptographic function takes an input of any size and produces a fixed-length output, primarily used to verify data integrity rather than for encryption?", "options": ["Asymmetric encryption", "Tokenization", "Symmetric encryption", "Hashing"], "correct_idx": 3, "explanation": "Hashing is a one-way mathematical function that takes input of any size and produces a fixed-length output (hash value), used primarily to verify data integrity rather than for reversible encryption.", "short_explanation_en": "Hashing is a one-way mathematical function that takes input of any size and produces a fixed-length output (hash value), used primarily to verify data integrity rather than for reversible encryption.", "question_th": "ฟังก์ชันการเข้ารหัสใดที่รับข้อมูลนำเข้าขนาดใดก็ได้และสร้างผลลัพธ์ที่มีความยาวคงที่ ใช้เพื่อตรวจสอบความถูกต้องของข้อมูลมากกว่าการเข้ารหัส?", "options_th": ["Asymmetric encryption", "Tokenization", "Symmetric encryption", "Hashing"], "explanation_th": "Hashing คือฟังก์ชันทางคณิตศาสตร์ที่รับข้อมูลนำเข้าขนาดใดก็ได้แล้วสร้างผลลัพธ์ที่มีความยาวคงที่ (hash value) ใช้เพื่อตรวจสอบความถูกต้องครบถ้วนของข้อมูล (integrity) เป็นหลัก ไม่ใช่เพื่อการเข้ารหัสที่สามารถถอดกลับได้ เนื่องจากฟังก์ชันแฮชเป็นกระบวนการทางเดียว (one-way)"}, {"id": 560, "dom": 5, "question": "Which cryptographic technique combines hashing and asymmetric encryption to verify both the authenticity and integrity of a message, while also providing non-repudiation?", "options": ["Symmetric encryption", "Tokenization", "Salting", "Digital signature"], "correct_idx": 3, "explanation": "A digital signature combines hashing with asymmetric encryption: the sender signs the message hash with their private key, and the receiver verifies it with the sender's public key, confirming both authenticity, integrity, and non-repudiation.", "short_explanation_en": "A digital signature combines hashing with asymmetric encryption: the sender signs the message hash with their private key, and the receiver verifies it with the sender's public key, confirming both authenticity, integrity, and non-repudiation.", "question_th": "เทคนิคการเข้ารหัสใดที่ผสมผสาน hashing กับ asymmetric encryption เพื่อยืนยันความถูกต้องและความครบถ้วนของข้อความ พร้อมทั้งให้ non-repudiation?", "options_th": ["Symmetric encryption", "Tokenization", "Salting", "Digital signature"], "explanation_th": "Digital Signature (ลายเซ็นดิจิทัล) ผสมผสานการแฮชข้อมูลกับการเข้ารหัสแบบอสมมาตร โดยผู้ส่งใช้ Private Key เซ็นค่าแฮชของข้อความ ผู้รับสามารถตรวจสอบด้วย Public Key ได้ว่าข้อความมาจากผู้ส่งจริงและไม่ถูกแก้ไข พร้อมทั้งช่วยป้องกันการปฏิเสธความรับผิดชอบ (non-repudiation) ของผู้ส่ง"}, {"id": 561, "dom": 5, "question": "Which infrastructure manages the creation, distribution, storage, and revocation of digital certificates used to establish trust in public key cryptography?", "options": ["Domain Name System (DNS)", "Security Information and Event Management (SIEM)", "Network Access Control (NAC)", "Public Key Infrastructure (PKI)"], "correct_idx": 3, "explanation": "Public Key Infrastructure (PKI) manages the full lifecycle of digital certificates - issuance, distribution, storage, and revocation - establishing trust for public key cryptography between parties who have never interacted before.", "short_explanation_en": "Public Key Infrastructure (PKI) manages the full lifecycle of digital certificates - issuance, distribution, storage, and revocation - establishing trust for public key cryptography between parties who have never interacted before.", "question_th": "โครงสร้างพื้นฐานใดที่จัดการการออก แจกจ่าย จัดเก็บ และเพิกถอนใบรับรองดิจิทัลที่ใช้สร้างความน่าเชื่อถือในการเข้ารหัสแบบกุญแจสาธารณะ?", "options_th": ["Domain Name System (DNS)", "Security Information and Event Management (SIEM)", "Network Access Control (NAC)", "Public Key Infrastructure (PKI)"], "explanation_th": "Public Key Infrastructure (PKI) คือระบบโครงสร้างพื้นฐานที่จัดการวงจรชีวิตทั้งหมดของใบรับรองดิจิทัล (digital certificate) ตั้งแต่การออก แจกจ่าย จัดเก็บ ไปจนถึงการเพิกถอน เพื่อสร้างความน่าเชื่อถือในการเข้ารหัสแบบกุญแจสาธารณะ (public key cryptography) ระหว่างคู่สื่อสารที่ไม่เคยรู้จักกันมาก่อน"}, {"id": 562, "dom": 5, "question": "Adding a unique, random value to a password before hashing it, so that identical passwords produce different hash outputs, is called:", "options": ["Salting", "Key stretching", "Tokenization", "Hashing collision"], "correct_idx": 0, "explanation": "Salting adds a unique random value to a password before hashing it, so identical passwords produce different hash outputs - this defeats precomputed rainbow table attacks.", "short_explanation_en": "Salting adds a unique random value to a password before hashing it, so identical passwords produce different hash outputs - this defeats precomputed rainbow table attacks.", "question_th": "การเพิ่มค่าสุ่มเฉพาะตัวให้กับรหัสผ่านก่อนนำไปแฮช เพื่อให้รหัสผ่านที่เหมือนกันได้ค่าแฮชต่างกัน เรียกว่าอะไร?", "options_th": ["Salting", "Key stretching", "Tokenization", "Hashing collision"], "explanation_th": "Salting คือการเพิ่มค่าสุ่มเฉพาะตัว (salt) ให้กับรหัสผ่านก่อนนำไปแฮช ทำให้รหัสผ่านที่เหมือนกันของผู้ใช้แต่ละคนมีค่าแฮชที่แตกต่างกัน ซึ่งช่วยทำลายประสิทธิภาพของการโจมตีด้วย Rainbow Table ที่อาศัยตารางแฮชที่คำนวณไว้ล่วงหน้า"}, {"id": 563, "dom": 5, "question": "Which centralized system collects, correlates, and analyzes log data from across an organization's network to detect potential security incidents in real time?", "options": ["Network Access Control (NAC)", "Security Information and Event Management (SIEM)", "Content Delivery Network (CDN)", "Public Key Infrastructure (PKI)"], "correct_idx": 1, "explanation": "A SIEM centrally collects, correlates, and analyzes log data across an organization's network to detect potential security incidents in near real time, helping teams respond faster.", "short_explanation_en": "A SIEM centrally collects, correlates, and analyzes log data across an organization's network to detect potential security incidents in near real time, helping teams respond faster.", "question_th": "ระบบรวมศูนย์ใดที่รวบรวม เชื่อมโยง และวิเคราะห์ข้อมูล log จากทั่วทั้งเครือข่ายเพื่อตรวจจับเหตุการณ์ด้านความปลอดภัยแบบเรียลไทม์?", "options_th": ["Network Access Control (NAC)", "Security Information and Event Management (SIEM)", "Content Delivery Network (CDN)", "Public Key Infrastructure (PKI)"], "explanation_th": "SIEM (Security Information and Event Management) รวบรวมและวิเคราะห์ข้อมูลบันทึกเหตุการณ์ (log) จากอุปกรณ์และระบบต่าง ๆ ทั่วทั้งเครือข่ายไว้ที่ศูนย์กลาง เพื่อค้นหาความสัมพันธ์ของเหตุการณ์และตรวจจับสัญญาณของภัยคุกคามด้านความปลอดภัยแบบเรียลไทม์ ช่วยให้ทีมความปลอดภัยตอบสนองต่อเหตุการณ์ได้รวดเร็วขึ้น"}, {"id": 564, "dom": 5, "question": "Which process involves systematically scanning systems to identify known security weaknesses, then prioritizing and remediating them?", "options": ["Configuration management", "Vulnerability management", "Asset management", "Change management"], "correct_idx": 1, "explanation": "Vulnerability management is the systematic process of scanning for known security weaknesses, then prioritizing and remediating them to continually reduce an organization's attack surface.", "short_explanation_en": "Vulnerability management is the systematic process of scanning for known security weaknesses, then prioritizing and remediating them to continually reduce an organization's attack surface.", "question_th": "กระบวนการใดที่สแกนระบบอย่างเป็นระบบเพื่อค้นหาช่องโหว่ด้านความปลอดภัยที่ทราบอยู่แล้ว แล้วจัดลำดับความสำคัญและแก้ไข?", "options_th": ["Configuration management", "Vulnerability management", "Asset management", "Change management"], "explanation_th": "Vulnerability Management คือกระบวนการที่เป็นระบบในการค้นหาช่องโหว่ที่ทราบอยู่แล้วในระบบผ่านการสแกน จากนั้นจึงจัดลำดับความสำคัญและดำเนินการแก้ไข (remediate) ช่องโหว่เหล่านั้น เพื่อลดพื้นผิวการโจมตี (attack surface) ขององค์กรอย่างต่อเนื่อง"}, {"id": 565, "dom": 5, "question": "Which process ensures that software updates addressing known vulnerabilities are tested and deployed to systems in a timely, controlled manner?", "options": ["Patch management", "Penetration testing", "Vulnerability scanning", "Data classification"], "correct_idx": 0, "explanation": "Patch management is the process of testing and deploying software updates that address known vulnerabilities, in a timely and controlled manner, to close gaps before attackers can exploit them.", "short_explanation_en": "Patch management is the process of testing and deploying software updates that address known vulnerabilities, in a timely and controlled manner, to close gaps before attackers can exploit them.", "question_th": "กระบวนการใดที่รับรองว่าการอัปเดตซอฟต์แวร์ที่แก้ไขช่องโหว่ที่ทราบแล้วจะถูกทดสอบและติดตั้งอย่างทันเวลาและมีการควบคุม?", "options_th": ["Patch management", "Penetration testing", "Vulnerability scanning", "Data classification"], "explanation_th": "Patch Management คือกระบวนการจัดการการทดสอบและติดตั้งการอัปเดตซอฟต์แวร์ที่แก้ไขช่องโหว่ที่ทราบแล้ว อย่างมีการควบคุมและทันเวลา เพื่อป้องกันไม่ให้ผู้โจมตีใช้ประโยชน์จากช่องโหว่ที่มีแพตช์แก้ไขอยู่แล้วแต่ยังไม่ได้ติดตั้ง"}, {"id": 566, "dom": 5, "question": "Which formal process requires proposed modifications to IT systems to be documented, reviewed, approved, and tested before implementation, to avoid unintended disruptions?", "options": ["Change management", "Vulnerability management", "Patch management", "Incident response"], "correct_idx": 0, "explanation": "Change management is the formal process requiring proposed IT system modifications to be documented, reviewed, approved, and tested before implementation, reducing the risk of unintended disruptions.", "short_explanation_en": "Change management is the formal process requiring proposed IT system modifications to be documented, reviewed, approved, and tested before implementation, reducing the risk of unintended disruptions.", "question_th": "กระบวนการที่เป็นทางการใดที่กำหนดให้การแก้ไขระบบ IT ที่เสนอต้องถูกบันทึก ทบทวน อนุมัติ และทดสอบก่อนนำไปใช้งาน เพื่อหลีกเลี่ยงการหยุดชะงักที่ไม่ได้ตั้งใจ?", "options_th": ["Change management", "Vulnerability management", "Patch management", "Incident response"], "explanation_th": "Change Management คือกระบวนการที่เป็นทางการในการบันทึก ทบทวน อนุมัติ และทดสอบการเปลี่ยนแปลงใด ๆ ต่อระบบไอที ก่อนนำไปใช้งานจริง เพื่อลดความเสี่ยงที่การเปลี่ยนแปลงจะก่อให้เกิดปัญหาหรือการหยุดชะงักของระบบโดยไม่ได้ตั้งใจ"}, {"id": 567, "dom": 5, "question": "Which practice involves establishing and maintaining a documented, standardized baseline configuration for systems to ensure consistency and detect unauthorized changes?", "options": ["Incident response", "Data classification", "Configuration management", "Change management"], "correct_idx": 2, "explanation": "Configuration management establishes and maintains a documented, standardized baseline configuration for systems, ensuring consistency and making it easier to detect unauthorized changes.", "short_explanation_en": "Configuration management establishes and maintains a documented, standardized baseline configuration for systems, ensuring consistency and making it easier to detect unauthorized changes.", "question_th": "แนวปฏิบัติใดที่กำหนดและรักษามาตรฐานการตั้งค่าระบบ (baseline configuration) ที่มีการบันทึกไว้ เพื่อความสอดคล้องและตรวจจับการเปลี่ยนแปลงที่ไม่ได้รับอนุญาต?", "options_th": ["Incident response", "Data classification", "Configuration management", "Change management"], "explanation_th": "Configuration Management คือแนวปฏิบัติในการกำหนดและรักษามาตรฐานการตั้งค่าระบบ (baseline configuration) ให้เป็นไปในทิศทางเดียวกันและมีการบันทึกไว้อย่างชัดเจน ช่วยให้สามารถตรวจพบการเปลี่ยนแปลงที่ไม่ได้รับอนุญาตได้ง่ายขึ้น และรักษาความสอดคล้องของระบบทั้งหมดในองค์กร"}, {"id": 568, "dom": 5, "question": "Which term describes the process of applying security settings to reduce a system's attack surface, such as disabling unnecessary services and closing unused ports?", "options": ["Load balancing", "Data classification", "System hardening", "Patch management"], "correct_idx": 2, "explanation": "System hardening is the process of applying security settings to reduce a system's attack surface - such as disabling unnecessary services and closing unused ports - leaving fewer entry points for attackers.", "short_explanation_en": "System hardening is the process of applying security settings to reduce a system's attack surface - such as disabling unnecessary services and closing unused ports - leaving fewer entry points for attackers.", "question_th": "คำใดอธิบายกระบวนการปรับใช้การตั้งค่าความปลอดภัยเพื่อลดพื้นผิวการโจมตีของระบบ เช่น การปิดบริการที่ไม่จำเป็นและปิดพอร์ตที่ไม่ได้ใช้งาน?", "options_th": ["Load balancing", "Data classification", "System hardening", "Patch management"], "explanation_th": "System Hardening คือกระบวนการปรับแต่งการตั้งค่าความปลอดภัยของระบบเพื่อลดพื้นผิวการโจมตี (attack surface) เช่น การปิดบริการที่ไม่จำเป็น ปิดพอร์ตที่ไม่ได้ใช้งาน และลบซอฟต์แวร์ที่ไม่จำเป็นออก ทำให้มีช่องทางที่ผู้โจมตีสามารถใช้ประโยชน์ได้น้อยลง"}, {"id": 569, "dom": 5, "question": "Which type of backup captures ALL data selected for backup every time it runs, resulting in the longest backup time but the fastest restore time?", "options": ["Incremental backup", "Snapshot backup only", "Full backup", "Differential backup"], "correct_idx": 2, "explanation": "A Full backup captures all selected data every time it runs, resulting in the longest backup time and largest storage use, but the fastest and simplest restore - since only one backup set is needed.", "short_explanation_en": "A Full backup captures all selected data every time it runs, resulting in the longest backup time and largest storage use, but the fastest and simplest restore - since only one backup set is needed.", "question_th": "ประเภทการสำรองข้อมูลใดที่สำรองข้อมูลทั้งหมดที่เลือกไว้ทุกครั้งที่ทำงาน ทำให้ใช้เวลาสำรองนานที่สุดแต่กู้คืนได้เร็วที่สุด?", "options_th": ["Incremental backup", "Snapshot backup only", "Full backup", "Differential backup"], "explanation_th": "Full Backup คือการสำรองข้อมูลทั้งหมดที่เลือกไว้ทุกครั้งที่ทำการสำรอง ทำให้ใช้เวลาสำรองนานที่สุดและใช้พื้นที่จัดเก็บมากที่สุด แต่มีข้อดีคือการกู้คืนข้อมูลทำได้รวดเร็วที่สุด เพราะต้องใช้เพียงไฟล์สำรองชุดเดียวในการกู้คืนทั้งหมด"}, {"id": 570, "dom": 5, "question": "Which type of backup only captures data that has changed since the LAST backup of any type (full or incremental), resulting in the smallest backup size and fastest backup time, but a slower and more complex restore process?", "options": ["Full backup", "Incremental backup", "Differential backup", "Mirror backup"], "correct_idx": 1, "explanation": "An Incremental backup only captures data changed since the very last backup of any type (full or incremental), resulting in the smallest size and fastest backup, but a slower and more complex restore since every incremental file must be applied in sequence.", "short_explanation_en": "An Incremental backup only captures data changed since the very last backup of any type (full or incremental), resulting in the smallest size and fastest backup, but a slower and more complex restore since every incremental file must be applied in sequence.", "question_th": "ประเภทการสำรองข้อมูลใดที่สำรองเฉพาะข้อมูลที่เปลี่ยนแปลงนับตั้งแต่การสำรองครั้งล่าสุด (ไม่ว่าจะเป็น full หรือ incremental) ทำให้ใช้พื้นที่น้อยที่สุดแต่การกู้คืนซับซ้อนกว่า?", "options_th": ["Full backup", "Incremental backup", "Differential backup", "Mirror backup"], "explanation_th": "Incremental Backup สำรองเฉพาะข้อมูลที่เปลี่ยนแปลงไปนับตั้งแต่การสำรองครั้งล่าสุด (ไม่ว่าจะเป็น Full หรือ Incremental ครั้งก่อน) ทำให้ใช้เวลาและพื้นที่จัดเก็บน้อยที่สุด แต่การกู้คืนข้อมูลจะซับซ้อนกว่า เพราะต้องนำไฟล์ Full backup และไฟล์ Incremental ทุกไฟล์ตามลำดับมาประกอบรวมกัน"}, {"id": 571, "dom": 5, "question": "Which secure media disposal method makes data on a hard drive UNRECOVERABLE by exposing it to a strong magnetic field?", "options": ["Formatting", "Compression", "File deletion", "Degaussing"], "correct_idx": 3, "explanation": "Degaussing exposes magnetic storage media (like a hard disk) to a strong magnetic field, rendering the data unrecoverable - unlike formatting or file deletion, which only remove pointers to the data while the actual data remains recoverable.", "short_explanation_en": "Degaussing exposes magnetic storage media (like a hard disk) to a strong magnetic field, rendering the data unrecoverable - unlike formatting or file deletion, which only remove pointers to the data while the actual data remains recoverable.", "question_th": "วิธีการทำลายสื่อจัดเก็บข้อมูลอย่างปลอดภัยแบบใดที่ทำให้ข้อมูลบนฮาร์ดดิสก์ไม่สามารถกู้คืนได้ด้วยการใช้สนามแม่เหล็กความเข้มสูง?", "options_th": ["Formatting", "Compression", "File deletion", "Degaussing"], "explanation_th": "Degaussing คือการใช้สนามแม่เหล็กความเข้มสูงในการลบข้อมูลบนสื่อจัดเก็บแบบแม่เหล็ก เช่น ฮาร์ดดิสก์ ทำให้ข้อมูลไม่สามารถกู้คืนได้อีก ต่างจากการฟอร์แมตหรือการลบไฟล์ปกติซึ่งเพียงลบตัวชี้ (pointer) ไปยังข้อมูล แต่ข้อมูลจริงยังคงอยู่และสามารถกู้คืนได้ด้วยเครื่องมือเฉพาะทาง"}, {"id": 572, "dom": 5, "question": "Which of the following is the MOST secure method to ensure that data on a physical hard drive can NEVER be recovered, especially when the drive itself will not be reused?", "options": ["Renaming the files with random characters", "Moving files to the recycle bin and emptying it", "Physical destruction (shredding or crushing the drive)", "Quick format"], "correct_idx": 2, "explanation": "Physical destruction (shredding or crushing the drive) is the most secure method to guarantee data can never be recovered, ideal when the storage media itself won't be reused - unlike formatting or file deletion, which leave data recoverable with specialized tools.", "short_explanation_en": "Physical destruction (shredding or crushing the drive) is the most secure method to guarantee data can never be recovered, ideal when the storage media itself won't be reused - unlike formatting or file deletion, which leave data recoverable with specialized tools.", "question_th": "ข้อใดคือวิธีที่ปลอดภัยที่สุดในการรับประกันว่าข้อมูลบนฮาร์ดดิสก์จะไม่สามารถกู้คืนได้เลย โดยเฉพาะเมื่อจะไม่นำไดรฟ์นั้นกลับมาใช้ซ้ำ?", "options_th": ["เปลี่ยนชื่อไฟล์เป็นอักขระสุ่ม", "ย้ายไฟล์ไปที่ถังขยะแล้วล้างถังขยะ", "การทำลายทางกายภาพ (บดหรือทุบไดรฟ์)", "การฟอร์แมตแบบเร็ว (quick format)"], "explanation_th": "การทำลายทางกายภาพ (physical destruction) เช่น การบดหรือทำลายฮาร์ดดิสก์ เป็นวิธีที่ปลอดภัยที่สุดในการรับประกันว่าจะไม่มีทางกู้คืนข้อมูลได้อีก เหมาะสำหรับกรณีที่ไม่ต้องการนำสื่อจัดเก็บนั้นกลับมาใช้งานซ้ำ ต่างจากการฟอร์แมตหรือการลบไฟล์ทั่วไปซึ่งข้อมูลยังสามารถถูกกู้คืนได้ด้วยเครื่องมือพิเศษ"}, {"id": 573, "dom": 5, "question": "Which document tracks organizational assets (hardware, software, data) throughout their lifecycle, supporting security decisions such as patching and end-of-life planning?", "options": ["Business continuity plan", "Asset inventory (asset management register)", "Risk register", "Incident response plan"], "correct_idx": 1, "explanation": "An asset inventory (asset management register) tracks organizational assets - hardware, software, and data - throughout their lifecycle, supporting security decisions such as patching schedules and end-of-life planning.", "short_explanation_en": "An asset inventory (asset management register) tracks organizational assets - hardware, software, and data - throughout their lifecycle, supporting security decisions such as patching schedules and end-of-life planning.", "question_th": "เอกสารใดที่ติดตามทรัพย์สินขององค์กร (ฮาร์ดแวร์ ซอฟต์แวร์ ข้อมูล) ตลอดวงจรชีวิต เพื่อสนับสนุนการตัดสินใจด้านความปลอดภัย เช่น การอัปเดตแพตช์และการวางแผนเลิกใช้งาน?", "options_th": ["Business continuity plan", "Asset inventory (asset management register)", "Risk register", "Incident response plan"], "explanation_th": "Asset Inventory หรือ Asset Management Register คือเอกสารที่บันทึกและติดตามทรัพย์สินขององค์กร ทั้งฮาร์ดแวร์ ซอฟต์แวร์ และข้อมูล ตลอดวงจรชีวิตการใช้งาน ช่วยสนับสนุนการตัดสินใจด้านความปลอดภัย เช่น การวางแผนอัปเดตแพตช์หรือการเลิกใช้งานอุปกรณ์เมื่อหมดอายุการใช้งาน (end-of-life)"}, {"id": 574, "dom": 5, "question": "An organization conducts regular training sessions to teach employees how to recognize phishing emails and avoid clicking malicious links. This is an example of:", "options": ["Log correlation", "Security awareness training", "Vulnerability scanning", "Penetration testing"], "correct_idx": 1, "explanation": "This is an example of security awareness training - an administrative control designed to help employees recognize and avoid threats like phishing, since human behavior is often the weakest link in an organization's security chain.", "short_explanation_en": "This is an example of security awareness training - an administrative control designed to help employees recognize and avoid threats like phishing, since human behavior is often the weakest link in an organization's security chain.", "question_th": "องค์กรจัดฝึกอบรมพนักงานเป็นประจำเพื่อสอนวิธีสังเกตอีเมลฟิชชิงและหลีกเลี่ยงการคลิกลิงก์อันตราย นี่คือตัวอย่างของอะไร?", "options_th": ["Log correlation", "Security awareness training", "Vulnerability scanning", "Penetration testing"], "explanation_th": "การฝึกอบรมสร้างความตระหนักด้านความปลอดภัย (Security Awareness Training) มีเป้าหมายเพื่อให้พนักงานสามารถสังเกตและหลีกเลี่ยงภัยคุกคาม เช่น อีเมลฟิชชิง ซึ่งเป็นการควบคุมเชิงบริหาร (administrative control) ที่สำคัญ เพราะมนุษย์มักเป็นจุดอ่อนที่สุดในห่วงโซ่ความปลอดภัยขององค์กร"}, {"id": 575, "dom": 5, "question": "Which authorized, simulated cyberattack is conducted to actively exploit vulnerabilities and assess how far an attacker could penetrate a system, going beyond simply identifying weaknesses?", "options": ["Configuration management", "Security awareness training", "Vulnerability scanning", "Penetration testing"], "correct_idx": 3, "explanation": "Penetration testing is an authorized, simulated cyberattack that actively exploits vulnerabilities to assess how far an attacker could penetrate a system - going beyond vulnerability scanning, which only identifies weaknesses without exploiting them.", "short_explanation_en": "Penetration testing is an authorized, simulated cyberattack that actively exploits vulnerabilities to assess how far an attacker could penetrate a system - going beyond vulnerability scanning, which only identifies weaknesses without exploiting them.", "question_th": "การจำลองการโจมตีทางไซเบอร์แบบใดที่ได้รับอนุญาตและพยายามใช้ประโยชน์จากช่องโหว่จริงเพื่อประเมินว่าผู้โจมตีจะเจาะระบบได้ลึกเพียงใด มากกว่าการค้นหาช่องโหว่เพียงอย่างเดียว?", "options_th": ["Configuration management", "Security awareness training", "Vulnerability scanning", "Penetration testing"], "explanation_th": "Penetration Testing คือการจำลองการโจมตีทางไซเบอร์ที่ได้รับอนุญาต โดยพยายามเจาะระบบและใช้ประโยชน์จากช่องโหว่จริง เพื่อประเมินว่าผู้โจมตีจะสามารถเจาะลึกเข้าไปในระบบได้มากเพียงใด ต่างจาก Vulnerability Scanning ซึ่งเป็นเพียงการค้นหาและระบุช่องโหว่โดยไม่มีการโจมตีจริง"}, {"id": 576, "dom": 5, "question": "Which term describes the continuous monitoring of network traffic, system logs, and security alerts to detect and respond to threats as they occur?", "options": ["Business impact analysis", "Change management", "Security monitoring", "Data classification"], "correct_idx": 2, "explanation": "Security monitoring is the continuous observation of network traffic, system logs, and security alerts to detect and respond to threats as they occur - a core function of a Security Operations Center (SOC).", "short_explanation_en": "Security monitoring is the continuous observation of network traffic, system logs, and security alerts to detect and respond to threats as they occur - a core function of a Security Operations Center (SOC).", "question_th": "คำใดอธิบายการเฝ้าระวังทราฟฟิกเครือข่าย บันทึกระบบ และการแจ้งเตือนด้านความปลอดภัยอย่างต่อเนื่อง เพื่อตรวจจับและตอบสนองต่อภัยคุกคามได้ทันทีที่เกิดขึ้น?", "options_th": ["Business impact analysis", "Change management", "Security monitoring", "Data classification"], "explanation_th": "Security Monitoring คือการเฝ้าระวังทราฟฟิกเครือข่าย บันทึกระบบ (log) และการแจ้งเตือนด้านความปลอดภัยอย่างต่อเนื่อง เพื่อตรวจจับและตอบสนองต่อภัยคุกคามได้ทันทีที่เกิดขึ้น ถือเป็นกิจกรรมหลักของศูนย์ปฏิบัติการความปลอดภัย (Security Operations Center - SOC)"}, {"id": 577, "dom": 5, "question": "Which term refers to the process of identifying, collecting, and preserving digital evidence in a manner that maintains its integrity for potential use in legal proceedings?", "options": ["Digital forensics", "Penetration testing", "Change management", "Data classification"], "correct_idx": 0, "explanation": "Digital forensics is the process of identifying, collecting, and preserving digital evidence in a manner that maintains its integrity, so it can potentially be used in legal proceedings - this requires strictly following a 'chain of custody' to keep the evidence credible.", "short_explanation_en": "Digital forensics is the process of identifying, collecting, and preserving digital evidence in a manner that maintains its integrity, so it can potentially be used in legal proceedings - this requires strictly following a 'chain of custody' to keep the evidence credible.", "question_th": "คำใดหมายถึงกระบวนการระบุ เก็บรวบรวม และรักษาหลักฐานดิจิทัลในลักษณะที่คงความถูกต้องครบถ้วนไว้ เพื่อใช้ในกระบวนการทางกฎหมาย?", "options_th": ["Digital forensics", "Penetration testing", "Change management", "Data classification"], "explanation_th": "Digital Forensics คือกระบวนการระบุ เก็บรวบรวม และรักษาหลักฐานดิจิทัลในลักษณะที่คงความถูกต้องครบถ้วนไว้ เพื่อให้สามารถนำไปใช้เป็นหลักฐานทางกฎหมายได้ กระบวนการนี้ต้องปฏิบัติตามหลัก 'chain of custody' อย่างเคร่งครัดเพื่อป้องกันไม่ให้หลักฐานถูกโต้แย้งความน่าเชื่อถือ"}, {"id": 578, "dom": 5, "question": "Which practice involves storing multiple copies of critical data in geographically separate locations to protect against data loss from a localized disaster?", "options": ["Offsite backup storage", "Network segmentation", "Load balancing", "Data classification"], "correct_idx": 0, "explanation": "Offsite backup storage keeps multiple copies of critical data in geographically separate locations to protect against data loss from a localized disaster, such as a fire or flood at the primary data center.", "short_explanation_en": "Offsite backup storage keeps multiple copies of critical data in geographically separate locations to protect against data loss from a localized disaster, such as a fire or flood at the primary data center.", "question_th": "แนวปฏิบัติใดที่จัดเก็บสำเนาข้อมูลสำคัญหลายชุดไว้ในสถานที่ทางภูมิศาสตร์ที่แยกจากกัน เพื่อป้องกันการสูญเสียข้อมูลจากภัยพิบัติเฉพาะพื้นที่?", "options_th": ["Offsite backup storage", "Network segmentation", "Load balancing", "Data classification"], "explanation_th": "การจัดเก็บสำเนาข้อมูลสำรองไว้ในสถานที่ทางภูมิศาสตร์ที่แยกจากกัน (Offsite Backup Storage) ช่วยป้องกันการสูญเสียข้อมูลถาวรหากเกิดภัยพิบัติเฉพาะพื้นที่ เช่น ไฟไหม้หรือน้ำท่วมที่ศูนย์ข้อมูลหลัก เนื่องจากสำเนาสำรองในสถานที่อื่นจะไม่ได้รับผลกระทบจากเหตุการณ์เดียวกัน"}, {"id": 579, "dom": 5, "question": "An organization builds redundant power supplies, network paths, and clustered servers into its infrastructure to minimize single points of failure. function t(key){
  const entry = UI_STRINGS[key];
  if(!entry) return '';
  if(state.lang==='both') return `${entry.en} / ${entry.th}`;
  return state.lang==='th' ? entry.th : entry.en;
}

function shuffle(a){ const b=[...a]; for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }

function poolForSelection(){
  return ALL_QUESTIONS.filter(q=>state.selectedDomains.has(q.dom));
}

function toggleDomain(d){
  if(state.selectedDomains.has(d)) state.selectedDomains.delete(d);
  else state.selectedDomains.add(d);
  render();
}

function setLang(l){
  state.lang = l;
  render();
}

function hasThaiCurrent(q){
  return !!(q && q.question_th);
}

function isComplete(){
  return state.answers.length === state.questions.length;
}

function isPassed(pct){
  return isComplete() && pct>=70;
}

function clearExamTimer(){
  if(state.examTimerId){ clearInterval(state.examTimerId); state.examTimerId=null; }
}

function startExamTimer(){
  clearExamTimer();
  state.examTimeLeft = EXAM_SECONDS_PER_QUESTION;
  state.examTimerId = setInterval(()=>{
    state.examTimeLeft--;
    if(state.examTimeLeft<=0){
      clearExamTimer();
      handleExamTimeout();
    } else {
      render();
    }
  }, 1000);
}

function handleExamTimeout(){
  if(state.answered!==null) return; // already answered, shouldn't happen since timer clears on answer
  const q = state.questions[state.current];
  state.wrong++;
  state.answers.push({qIndex:state.current, selected:-1, correct:q.correct_idx, isCorrect:false, timedOut:true});
  state.answered = -1;
  render();
  if(state.studyMode==='exam'){
    // Exam mode: no reveal, auto-advance quickly.
    setTimeout(()=>{ nextQuestion(); }, 900);
  }
  // Practice mode: leave the reveal + explanation on screen; user clicks
  // "Next Question" manually once they've read it (nav button already
  // appears automatically since state.answered !== null).
}

function startQuiz(){
  const pool = poolForSelection();
  if(pool.length===0) return;
  const src = state.mode==='random' ? shuffle(pool) : [...pool];
  const n = Math.min(Math.max(1,state.count), src.length);
  state.questions = src.slice(0,n);
  state.current=0; state.answered=null; state.score=0; state.wrong=0; state.answers=[];
  state.trackerSent=false; state.finishedManually=false;
  clearExamTimer();
  state.screen='quiz';
  startExamTimer();
  render();
}

function selectAnswer(idx){
  if(state.answered!==null) return;
  clearExamTimer();
  const q = state.questions[state.current];
  const ok = idx===q.correct_idx;
  state.answered = idx;
  if(ok) state.score++; else state.wrong++;
  state.answers.push({qIndex:state.current, selected:idx, correct:q.correct_idx, isCorrect:ok});
  render();
}

function nextQuestion(){
  if(state.current < state.questions.length-1){
    state.current++; state.answered=null;
    startExamTimer();
    render();
  } else {
    finishExam();
  }
}

function finishNow(){
  clearExamTimer();
  state.finishedManually = true;
  finishExam();
}

function finishExam(){
  clearExamTimer();
  state.screen='results';
  submitToTracker();
  render();
}

function submitToTracker(){
  if(state.trackerSent) return;
  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_YOUR')===0) return;
  state.trackerSent = true;

  const total = state.questions.length;
  const pct = total>0 ? Math.round((state.score/total)*100) : 0;
  const letters = ['A','B','C','D','E','F'];
  const answersPayload = state.answers.map(a=>{
    const q = state.questions[a.qIndex];
    return {
      domain: q.dom,
      domainName: DOMAIN_NAMES[q.dom],
      questionId: q.id,
      question: q.question,
      yourAnswer: a.selected===-1 ? '(No answer - time expired)' : `${letters[a.selected]}. ${q.options[a.selected]}`,
      correctAnswer: `${letters[a.correct]}. ${q.options[a.correct]}`,
      isCorrect: a.isCorrect
    };
  });

  const payload = {
    name: state.userName || 'Anonymous',
    mode: state.mode,
    studyMode: state.studyMode,
    domains: [...state.selectedDomains].sort(),
    language: state.lang,
    total: total,
    correct: state.score,
    wrong: state.wrong,
    answered: state.answers.length,
    complete: isComplete(),
    passed: isPassed(pct),
    finishedManually: state.finishedManually,
    answers: answersPayload
  };

  const body = JSON.stringify(payload);
  let queued = false;

  // sendBeacon is more reliable for "fire and forget" submissions - it's
  // handled by the browser independently of page/script lifecycle and
  // doesn't require awaiting a response.
  if (navigator.sendBeacon) {
    try {
      const blob = new Blob([body], { type: 'text/plain;charset=utf-8' });
      queued = navigator.sendBeacon(APPS_SCRIPT_URL, blob);
    } catch (err) {
      queued = false;
    }
  }

  if (!queued) {
    try {
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: body
      });
    } catch (err) {
      // no-cors mode means we can't inspect the response or catch server errors;
      // the quiz cannot self-report tracker send failures.
    }
  }
}

function printResults(){
  // Give the DOM a tick to settle before invoking the native print dialog  - 
  // avoids the print stylesheet being applied to a half-rendered frame.
  requestAnimationFrame(()=>{
    setTimeout(()=>{ window.print(); }, 50);
  });
}

function render(){
  const app = document.getElementById('app');
  if(state.screen==='start') renderStart(app);
  else if(state.screen==='quiz') renderQuiz(app);
  else renderResults(app);
}

function renderLangToggle(disableTh){
  return `<div class="lang-toggle-wrap">
    <div class="lang-toggle">
      <button class="lang-btn ${state.lang==='en'?'active':''}" onclick="setLang('en')">EN</button>
      <button class="lang-btn ${state.lang==='th'?'active':''} ${disableTh?'lang-unavailable':''}" ${disableTh?'disabled title="Thai not available for this question yet"':''} onclick="setLang('th')">TH</button>
      <button class="lang-btn ${state.lang==='both'?'active':''} ${disableTh?'lang-unavailable':''}" ${disableTh?'disabled title="Thai not available for this question yet"':''} onclick="setLang('both')">EN+TH</button>
    </div>
  </div>`;
}

function renderStart(app){
  const poolSize = poolForSelection().length;
  const domainCounts = {};
  const domainThCounts = {};
  [1,2,3,4,5].forEach(d=>{
    domainCounts[d] = ALL_QUESTIONS.filter(q=>q.dom===d).length;
    domainThCounts[d] = ALL_QUESTIONS.filter(q=>q.dom===d && q.question_th).length;
  });

  const domainRows = [1,2,3,4,5].map(d=>{
    const checked = state.selectedDomains.has(d);
    const thBadge = domainThCounts[d]>0 ? `<span class="dth-badge">TH ${domainThCounts[d]}/${domainCounts[d]}</span>` : '';
    const dname = state.lang==='both' ? `${DOMAIN_NAMES[d]} / ${DOMAIN_NAMES_TH[d]}` : (state.lang==='th' ? DOMAIN_NAMES_TH[d] : DOMAIN_NAMES[d]);
    return `<div class="domain-row ${checked?'checked':''}" onclick="toggleDomain(${d})">
      <input type="checkbox" ${checked?'checked':''} onclick="event.stopPropagation();toggleDomain(${d})">
      <div class="dnum">${d}</div>
      <div class="dname">${dname}</div>
      ${thBadge}
      <div class="dcount">${domainCounts[d]}</div>
    </div>`;
  }).join('');

  app.innerHTML = `
    <header class="hero-section">
      <div class="eyebrow">${t('createdBy')}</div>
      <h1>${t('appTitle')}</h1>
      <div class="sub">${t('tagline')}</div>
      <div style="margin-top: 18px; display: flex; justify-content: center;">
        ${renderLangToggle(false)}
      </div>
    </header>

    <div class="start-screen">

      <div class="name-row">
        <label>${t('yourNameLabel')}</label>
        <input type="text" class="name-input" placeholder="${t('namePlaceholder')}" value="${state.userName}" onchange="state.userName=this.value.trim();render()" oninput="state.userName=this.value.trim()">
      </div>

      <div class="section-label">${t('studyModeLabel')}</div>
      <div class="mode-cards">
        <div class="mode-card ${state.studyMode==='practice'?'selected':''}" onclick="state.studyMode='practice';render()">
          <h3>${t('practiceTitle')}</h3><span>${t('practiceDesc')}</span>
        </div>
        <div class="mode-card ${state.studyMode==='exam'?'selected':''}" onclick="state.studyMode='exam';render()">
          <h3>${t('examTitle')}</h3><span>${t('examDesc')}</span>
        </div>
      </div>
      <div class="subheading" style="margin-top:8px;">${state.studyMode==='exam' ? t('examNote') : t('practiceNote')}</div>

      <div class="section-label">${t('orderLabel')}</div>
      <div class="mode-cards">
        <div class="mode-card ${state.mode==='all'?'selected':''}" onclick="state.mode='all';render()">
          <h3>${t('sequentialTitle')}</h3><span>${t('sequentialDesc')}</span>
        </div>
        <div class="mode-card ${state.mode==='random'?'selected':''}" onclick="state.mode='random';render()">
          <h3>${t('randomTitle')}</h3><span>${t('randomDesc')}</span>
        </div>
      </div>

      <div class="section-label">${t('domainsLabel')}</div>
      <div class="domain-grid">${domainRows}</div>
      <div class="domain-actions">
        <button onclick="state.selectedDomains=new Set([1,2,3,4,5]);render()">${t('selectAll')}</button>
        <button onclick="state.selectedDomains=new Set();render()">${t('clearAll')}</button>
      </div>

      <div class="count-row">
        <label>${t('questionsCountLabel')}</label>
        <input type="number" class="count-input" min="1" max="${poolSize}" value="${Math.min(state.count,poolSize||1)}" onchange="state.count=parseInt(this.value)||1">
      </div>
      ${poolSize===0 ? `<div class="warn">${t('warnSelectDomain')}</div>` : `<div class="subheading" style="margin-top:8px;">${poolSize} ${t('availableSuffix')}</div>`}

      <div class="start-btn-row">
        <button class="btn btn-primary" ${(poolSize===0||!state.userName)?'disabled style="opacity:.5;cursor:not-allowed;"':''} onclick="startQuiz()">${t('startQuizBtn')}</button>
      </div>
      ${!state.userName ? `<div class="warn" style="margin-top:10px;">${t('warnEnterName')}</div>` : ''}

function renderQuiz(app){
  const q = state.questions[state.current];
  const total = state.questions.length;
  const pct = ((state.current+(state.answered!==null?1:0))/total*100).toFixed(0);
  const letters = ['A','B','C','D','E','F'];
  const hasTh = hasThaiCurrent(q);
  const isBoth = state.lang==='both' && hasTh;
  const useTh = state.lang==='th' && hasTh;
  const noThFallback = (state.lang==='th' || state.lang==='both') && !hasTh;
  const isExam = state.studyMode==='exam';

  const domName = isBoth ? `${DOMAIN_NAMES[q.dom]} · ${DOMAIN_NAMES_TH[q.dom]}` : (useTh ? DOMAIN_NAMES_TH[q.dom] : DOMAIN_NAMES[q.dom]);

  // Question text block
  let qTextHtml;
  if(isBoth){
    qTextHtml = `<div class="bilingual-block">
      <div class="bilingual-pair"><span class="lang-chip">EN</span><span class="bilingual-en">${q.question}</span></div>
      <div class="bilingual-pair"><span class="lang-chip th">TH</span><span class="bilingual-th">${q.question_th}</span></div>
    </div>`;
  } else {
    qTextHtml = useTh ? q.question_th : q.question;
  }

  // Options
  let opts = '';
  q.options.forEach((opt,idx)=>{
    let c = 'option-btn';
    if(state.answered!==null){
      c += ' disabled';
      if(isExam){
        // Exam mode: neutral "selected" highlight only, no correct/wrong reveal
        if(idx===state.answered) c += ' exam-selected';
      } else {
        if(idx===state.answered && idx===q.correct_idx) c += ' correct-selected';
        else if(idx===state.answered && idx!==q.correct_idx) c += ' wrong-selected';
        else if(idx===q.correct_idx) c += ' correct-reveal';
      }
    }
    let optHtml;
    if(isBoth){
      optHtml = `<div class="bilingual-en">${opt}</div><div class="bilingual-th">${q.options_th[idx]}</div>`;
    } else {
      optHtml = useTh ? q.options_th[idx] : opt;
    }
    opts += `<button class="${c}" onclick="selectAnswer(${idx})"><span class="option-letter">${letters[idx]}</span><span>${optHtml}</span></button>`;
  });

  // Explanation - practice mode only
  let exp = '';
  if(!isExam && state.answered!==null){
    if(isBoth){
      exp = `<div class="explanation-box">
        <strong><span class="lang-chip">EN</span>Why this is correct</strong>
        <div class="bilingual-en">${q.explanation}</div>
        <div class="bilingual-th"><span class="lang-chip th">TH</span>${q.explanation_th}</div>
      </div>`;
    } else if(q.explanation){
      const explText = useTh ? q.explanation_th : q.explanation;
      exp = `<div class="explanation-box"><strong>${useTh?'เหตุผล':'Why this is correct'}</strong>${explText}</div>`;
    }
  }

  let nav = '';
  if(state.answered!==null){
    const isLast = state.current >= total-1;
    const nextLabel = isBoth ? 'Next Question / ข้อถัดไป' : (isLast?(useTh?'ดูผลลัพธ์':'View Results'):(useTh?'ข้อถัดไป':'Next Question'));
    const lastLabel = isBoth ? 'View Results / ดูผลลัพธ์' : nextLabel;
    nav = `<div class="nav-row"><button class="btn btn-primary" onclick="nextQuestion()">${isLast?lastLabel:nextLabel}</button></div>`;
  }

  const timeLeft = Math.max(0, state.examTimeLeft);
  const mm = String(Math.floor(timeLeft/60)).padStart(2,'0');
  const ss = String(timeLeft%60).padStart(2,'0');
  const lowTime = timeLeft<=15;
  const examBar = `<div class="exam-bar">
    <div class="exam-timer ${lowTime?'low':''}">⏱ ${mm}:${ss}</div>
    <button class="btn btn-secondary exam-finish-btn" onclick="if(confirm('End the quiz now? Any unanswered questions will count against you and your result will be marked incomplete.')) finishNow()">Finish Now</button>
  </div>`;

  app.innerHTML = `
    ${renderLangToggle(!hasTh)}
    ${examBar}
    <div class="quiz-header">
      <span class="progress-info">${state.current+1} / ${total}</span>
      <div class="score-live">${isExam ? `<span class="score-answered">Answered ${state.answers.length}/${total}</span>` : `<span class="score-correct">✓ ${state.score}</span><span class="score-wrong">✗ ${state.wrong}</span>`}</div>
    </div>
    <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    <div class="question-card">
      <div class="domain-tag">Domain ${q.dom} · ${domName}</div>
      ${noThFallback ? '<span class="notice-tag">Thai not available yet - showing English</span>' : ''}
      ${renderTopicBadge(q.question)}
      <div class="question-number">QUESTION ${q.id}</div>
      <div class="question-text">${qTextHtml}</div>
      <div class="options">${opts}</div>
      ${exp}
      ${nav}
    </div>`;
}

function renderResults(app){
  const total = state.questions.length;
  const pct = total>0 ? Math.round(state.score/total*100) : 0;
  const complete = isComplete();
  const passed = isPassed(pct);
  const unanswered = total - state.answers.length;
  const circ = 2*Math.PI*78;
  const off = circ-(pct/100)*circ;
  const col = passed?'var(--green)':'var(--red)';
  let grade='';
  if(!complete) grade='Incomplete - marked FAIL';
  else if(pct>=90) grade='Outstanding!';
  else if(pct>=80) grade='Great job!';
  else if(pct>=70) grade='You passed!';
  else if(pct>=60) grade='Almost there';
  else grade='Keep studying';

  const wrongAnswers = state.answers.filter(a=>!a.isCorrect);
  const letters = ['A','B','C','D','E','F'];
  let reviewHtml = '';
  let printReviewHtml = '';
  if(wrongAnswers.length>0){
    reviewHtml = `<div class="review-section"><h3>Review Incorrect Answers (${wrongAnswers.length})</h3>`;
    wrongAnswers.forEach(a=>{
      const q = state.questions[a.qIndex];
      const hasTh = hasThaiCurrent(q);
      const isBoth = state.lang==='both' && hasTh;
      const useTh = state.lang==='th' && hasTh;
      const yourAnsText = a.selected===-1 ? '(No answer - time expired)' : `${letters[a.selected]}. ${q.options[a.selected]}`;
      if(isBoth){
        reviewHtml += `<div class="review-item">
          <div class="review-domain">Domain ${q.dom} · ${DOMAIN_NAMES[q.dom]} / ${DOMAIN_NAMES_TH[q.dom]}</div>
          <div class="review-q"><span class="lang-chip">EN</span>Q${q.id}: ${q.question}</div>
          <div class="review-q"><span class="lang-chip th">TH</span>${q.question_th}</div>
          <div class="review-meta">
            <span class="review-your">Your answer: ${yourAnsText} ${a.selected===-1?'':`/ ${q.options_th[a.selected]}`}</span>
            <span class="review-correct-label">Correct: ${letters[a.correct]}. ${q.options[a.correct]} / ${q.options_th[a.correct]}</span>
          </div>
        </div>`;
      } else {
        const qText = useTh ? q.question_th : q.question;
        const qOptions = useTh ? q.options_th : q.options;
        reviewHtml += `<div class="review-item">
          <div class="review-domain">Domain ${q.dom} · ${useTh?DOMAIN_NAMES_TH[q.dom]:DOMAIN_NAMES[q.dom]}</div>
          <div class="review-q">Q${q.id}: ${qText}</div>
          <div class="review-meta">
            <span class="review-your">Your answer: ${a.selected===-1 ? '(No answer - time expired)' : `${letters[a.selected]}. ${qOptions[a.selected]}`}</span>
            <span class="review-correct-label">Correct: ${letters[a.correct]}. ${qOptions[a.correct]}</span>
          </div>
        </div>`;
      }
      const expText = q.explanation ? `<div class="print-exp"><strong>Why (EN):</strong> ${q.explanation}</div>` : '';
      const yourAnsTextTh = a.selected===-1 ? '(ไม่ได้ตอบ - หมดเวลา)' : (q.options_th ? `${letters[a.selected]}. ${q.options_th[a.selected]}` : '');
      const correctTextTh = q.options_th ? `${letters[a.correct]}. ${q.options_th[a.correct]}` : '';
      const expTextTh = q.explanation_th ? `<div class="print-exp"><strong>เหตุผล (TH):</strong> ${q.explanation_th}</div>` : '';
      printReviewHtml += `<div class="print-item">
        <div class="print-q">Q${q.id} (Domain ${q.dom} · ${DOMAIN_NAMES[q.dom]} / ${DOMAIN_NAMES_TH[q.dom]}): ${q.question}</div>
        ${q.question_th ? `<div class="print-q-th">${q.question_th}</div>` : ''}
        <div class="print-meta"><strong>Your answer (EN):</strong> ${yourAnsText}</div>
        ${yourAnsTextTh ? `<div class="print-meta"><strong>คำตอบของคุณ (TH):</strong> ${yourAnsTextTh}</div>` : ''}
        <div class="print-meta"><strong>Correct answer (EN):</strong> ${letters[a.correct]}. ${q.options[a.correct]}</div>
        ${correctTextTh ? `<div class="print-meta"><strong>คำตอบที่ถูกต้อง (TH):</strong> ${correctTextTh}</div>` : ''}
        ${expText}
        ${expTextTh}
      </div>`;
    });
    reviewHtml += '</div>';
  }

  const finishedBanner = state.finishedManually
    ? `<div class="finish-banner">[OK] Your result has been sent.</div>`
    : '';
  const incompleteBanner = !complete
    ? `<div class="incomplete-banner">[!] You answered ${state.answers.length} of ${total} questions. Incomplete attempts are automatically marked <strong>FAIL</strong>, regardless of score.</div>`
    : '';

  app.innerHTML = `
    ${renderLangToggle(false)}
    <div class="results">
      ${finishedBanner}
      ${incompleteBanner}
      <div class="results-circle">
        <svg width="180" height="180" viewBox="0 0 180 180">
          <circle cx="90" cy="90" r="78" stroke="var(--line)" stroke-width="8" fill="none"/>
          <circle cx="90" cy="90" r="78" stroke="${col}" stroke-width="8" fill="none"
            stroke-dasharray="${circ}" stroke-dashoffset="${off}" stroke-linecap="round" style="transition:stroke-dashoffset 1s ease"/>
        </svg>
        <div class="pct-text">
          <span class="pct-number" style="color:${col}">${pct}%</span>
          <span class="pct-label">${passed?'PASS':'FAIL'}</span>
        </div>
      </div>
      <h2>${grade}</h2>
      <p class="subtitle">You answered ${state.score} out of ${total} correctly${unanswered>0?` (${unanswered} unanswered)`:''}</p>
      <div class="stat-grid">
        <div class="stat-card green"><div class="val">${state.score}</div><div class="lbl">Correct</div></div>
        <div class="stat-card red"><div class="val">${state.wrong}</div><div class="lbl">Incorrect</div></div>
        <div class="stat-card gold"><div class="val">${pct}%</div><div class="lbl">Score</div></div>
      </div>
      <div class="results-actions">
        <button class="btn btn-secondary" onclick="state.screen='start';render()">New Quiz</button>
        <button class="btn btn-primary" onclick="startQuiz()">Retry Same Selection</button>
        <button class="btn btn-secondary" onclick="printResults()">🖨 Print Results</button>
      </div>
      ${reviewHtml}
    </div>
    <div class="print-section">
      <h1>ISC2 CC - Exam Result</h1>
      <p>Name: ${state.userName || 'Anonymous'} &nbsp;|&nbsp; Date: ${new Date().toLocaleString()}</p>
      <p>Mode: ${state.studyMode==='exam'?'Exam':'Practice'} &nbsp;|&nbsp; Score: ${state.score}/${total} (${pct}%) &nbsp;|&nbsp; Result: ${passed?'PASS':'FAIL'}${!complete?' (incomplete)':''}</p>
      <h2>Incorrect Answers (${wrongAnswers.length})</h2>
      ${printReviewHtml || '<p>No incorrect answers.</p>'}
    </div>`;
}

render();
</script>

<script>

/* === Topic Icon System === */
const TOPIC_ICONS=[
{id:'cia',label:'CIA Triad',kw:/\bcia\b|\btriad\b|confidentiality.*integrity.*availability|information\s+assurance/i,
svg:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M10 2L18 17H2Z"/><circle cx="10" cy="11" r="2" fill="currentColor"/></svg>'},
{id:'confidentiality',label:'Confidentiality',kw:/\bconfidentiality\b|unauthorized\s+disclosure|privacy|data.*protected.*from.*viewing|classif(?:ied|ication)|secrecy/i,
svg:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><ellipse cx="10" cy="10" rx="8" ry="5"/><circle cx="10" cy="10" r="2" fill="currentColor"/><line x1="3" y1="17" x2="17" y2="3"/></svg>'},
{id:'integrity',label:'Integrity',kw:/\bintegrity\b|tamper|unauthorized\s+modif|hash\w*\b|checksum|data.*accurate.*complete|unauthorized\s+change|message\s+digest/i,
svg:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M10 1L17 5V10C17 14 14 17 10 19C6 17 3 14 3 10V5Z"/><polyline points="7,10 9,13 14,7"/></svg>'},

function getTopicForQuestion(txt){if(!txt)return null;for(const t of TOPIC_ICONS){if(t.kw.test(txt))return t;}return null;}
function renderTopicBadge(txt){const t=getTopicForQuestion(txt);if(!t)return'';return'<div class="topic-badge"><span class="topic-icon">'+t.svg+'</span><span class="topic-label">'+t.label+'</span></div>';}

(function(){
var el=document.getElementById('neko');
if(!el)return;
var x=Math.random()*(innerWidth-60),dir=1,state='walk',timer=0;
function next(){
if(state==='walk'){state=Math.random()<.65?'sit':'sleep';timer=state==='sit'?150+Math.random()*200:250+Math.random()*350}
else{state='walk';timer=200+Math.random()*400;if(Math.random()<.4)dir*=-1}
el.className=state+(dir<0?' flip':'')
}
next();state='walk';timer=100+Math.random()*200;el.className='walk';
(function frame(){
if(--timer<=0)next();
if(state==='walk'){x+=1.2*dir;if(x>innerWidth-55){dir=-1;el.className='walk flip'}if(x<5){dir=1;el.className='walk'}}
el.style.left=x+'px';
requestAnimationFrame(frame)
})()
})();
</script>
