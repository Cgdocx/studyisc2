.summary-table th {

@media (max-width: 600px) {

<script>
const QUESTIONS = [
  {
    domain: "Domain 1: Security Principles",
    sentence: "_______ คือหลักการที่ว่า ข้อมูลต้องไม่ถูกเปลี่ยนแปลงโดยไม่ได้รับอนุญาต",
    answer: "Integrity",
    choices: ["Integrity", "Availability", "Confidentiality", "Authentication"],
    explain: "Integrity หมายถึงความถูกต้องครบถ้วนของข้อมูล ต้องไม่ถูกแก้ไขโดยไม่ได้รับอนุญาต ต่างจาก Confidentiality (การรักษาความลับ) และ Availability (ความพร้อมใช้งาน)"
  },
  {
    domain: "Domain 1: Security Principles",
    sentence: "_______ คือหลักการที่ข้อมูลต้องเข้าถึงได้โดยผู้ที่มีสิทธิ์เมื่อต้องการใช้งาน",
    answer: "Availability",
    choices: ["Availability", "Integrity", "Non-repudiation", "Confidentiality"],
    explain: "Availability ทำให้มั่นใจว่าระบบและข้อมูลพร้อมใช้งานเมื่อผู้ใช้ที่ได้รับอนุญาตต้องการ"
  },
  {
    domain: "Domain 1: Security Principles",
    sentence: "_______ คือหลักการที่ข้อมูลต้องถูกเก็บเป็นความลับจากผู้ที่ไม่มีสิทธิ์",
    answer: "Confidentiality",
    choices: ["Confidentiality", "Privacy", "Integrity", "Accountability"],
    explain: "Confidentiality ป้องกันการเปิดเผยข้อมูลแก่ผู้ไม่มีสิทธิ์ ใช้วิธีเช่น encryption และ access control"
  },
  {
    domain: "Domain 1: Security Principles",
    sentence: "หลัก _______ กำหนดให้ผู้ใช้ได้รับสิทธิ์เข้าถึงเฉพาะสิ่งที่จำเป็นต่อการทำงานเท่านั้น",
    answer: "Least Privilege",
    choices: ["Least Privilege", "Need to Know", "Separation of Duties", "Defense in Depth"],
    explain: "Least Privilege ให้สิทธิ์น้อยที่สุดเท่าที่จำเป็น ลดความเสี่ยงหากบัญชีถูกบุกรุก"
  },
  {
    domain: "Domain 1: Security Principles",
    sentence: "_______ คือการที่ผู้กระทำไม่สามารถปฏิเสธว่าตนไม่ได้ทำสิ่งนั้น",
    answer: "Non-repudiation",
    choices: ["Non-repudiation", "Authentication", "Authorization", "Accountability"],
    explain: "Non-repudiation ใช้ digital signature เป็นหลักฐานว่าผู้ส่งส่งข้อมูลจริง ปฏิเสธไม่ได้"
  },
  {
    domain: "Domain 1: Security Principles",
    sentence: "แนวคิด _______ ใช้มาตรการรักษาความปลอดภัยหลายชั้นซ้อนกัน",
    answer: "Defense in Depth",
    choices: ["Defense in Depth", "Least Privilege", "Zero Trust", "Security by Design"],
    explain: "Defense in Depth วางมาตรการป้องกันหลายชั้น ถ้าชั้นหนึ่งถูกเจาะ ชั้นถัดไปยังป้องกันอยู่"
  },
  {
    domain: "Domain 1: Security Principles",
    sentence: "_______ คือการประเมินว่าภัยคุกคามและช่องโหว่จะส่งผลกระทบต่อองค์กรมากน้อยเพียงใด",
    answer: "Risk Assessment",
    choices: ["Risk Assessment", "Vulnerability Scan", "Penetration Test", "Security Audit"],
    explain: "Risk Assessment ประเมินโอกาสและผลกระทบของภัยคุกคามที่อาจเกิดขึ้น เพื่อจัดลำดับความสำคัญ"
  },
  {
    domain: "Domain 1: Security Principles",
    sentence: "การ _______ ความเสี่ยงคือการยอมรับความเสี่ยงนั้นโดยไม่ดำเนินมาตรการเพิ่มเติม",
    answer: "Accept",
    choices: ["Accept", "Mitigate", "Transfer", "Avoid"],
    explain: "Risk Acceptance คือการตัดสินใจยอมรับความเสี่ยงเพราะต้นทุนการป้องกันสูงกว่าผลกระทบ หรือความเสี่ยงอยู่ในระดับที่ยอมรับได้"
  },
  {
    domain: "Domain 2: BC, DR & IR",
    sentence: "_______ หมายถึงระยะเวลาสูงสุดที่ระบบสามารถหยุดทำงานได้ก่อนเกิดผลกระทบร้ายแรง",
    answer: "RTO",
    choices: ["RTO", "RPO", "MTBF", "MTTR"],
    explain: "RTO (Recovery Time Objective) คือเวลาสูงสุดที่ยอมให้ระบบหยุดทำงานได้ เช่น RTO 4 ชั่วโมง หมายถึงต้องกู้ระบบภายใน 4 ชั่วโมง"
  },
  {
    domain: "Domain 2: BC, DR & IR",
    sentence: "_______ คือปริมาณข้อมูลสูงสุดที่ยอมให้สูญหายได้ วัดเป็นช่วงเวลา",
    answer: "RPO",
    choices: ["RPO", "RTO", "SLA", "BIA"],
    explain: "RPO (Recovery Point Objective) เช่น RPO 1 ชั่วโมง หมายถึงยอมเสียข้อมูลได้ไม่เกิน 1 ชั่วโมงก่อนเหตุการณ์"
  },
  {
    domain: "Domain 2: BC, DR & IR",
    sentence: "_______ คือกระบวนการวิเคราะห์ว่ากระบวนการธุรกิจใดสำคัญที่สุดต่อองค์กร",
    answer: "BIA",
    choices: ["BIA", "BCP", "DRP", "SLA"],
    explain: "BIA (Business Impact Analysis) ระบุว่ากระบวนการไหนสำคัญที่สุด หยุดแล้วเสียหายเท่าไร เป็นขั้นตอนแรกของ BCP"
  },
  {
    domain: "Domain 2: BC, DR & IR",
    sentence: "_______ เป็นแผนที่มุ่งเน้นการกู้คืนระบบ IT หลังเหตุภัยพิบัติ",
    answer: "DRP",
    choices: ["DRP", "BCP", "IRP", "COOP"],
    explain: "DRP (Disaster Recovery Plan) เน้นกู้คืนระบบสารสนเทศ ส่วน BCP ครอบคลุมธุรกิจทั้งหมด"
  },
  {
    domain: "Domain 2: BC, DR & IR",
    sentence: "ขั้นตอนแรกของ Incident Response ตาม NIST คือ _______",
    answer: "Preparation",
    choices: ["Preparation", "Detection", "Containment", "Eradication"],
    explain: "Preparation คือเตรียมทีม เครื่องมือ และแผนรับมือไว้ล่วงหน้า เป็นรากฐานของ IR ทั้งหมด"
  },
  {
    domain: "Domain 2: BC, DR & IR",
    sentence: "_______ site คือศูนย์สำรองที่มีอุปกรณ์ครบพร้อมใช้งานทันที",
    answer: "Hot",
    choices: ["Hot", "Warm", "Cold", "Mobile"],
    explain: "Hot site มีอุปกรณ์และข้อมูลพร้อมใช้ทันที Warm site มีอุปกรณ์แต่ต้องโหลดข้อมูล Cold site มีแค่สถานที่"
  },
  {
    domain: "Domain 3: Access Controls",
    sentence: "_______ เป็นการควบคุมการเข้าถึงที่กำหนดสิทธิ์ตามบทบาทหน้าที่",
    answer: "RBAC",
    choices: ["RBAC", "DAC", "MAC", "ABAC"],
    explain: "RBAC (Role-Based Access Control) ให้สิทธิ์ตาม role เช่น admin, user, manager ง่ายต่อการจัดการในองค์กรใหญ่"
  },

let currentQ = 0;
let correctTotal = 0;
let wrongTotal = 0;
let answered = false;
let results = [];
let shuffledQuestions = [];

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startGame() {
  shuffledQuestions = shuffleArray(QUESTIONS);
  currentQ = 0;
  correctTotal = 0;
  wrongTotal = 0;
  results = [];
  answered = false;
  renderQuestion();
  updateUI();
}

function renderQuestion() {
  const q = shuffledQuestions[currentQ];
  const shuffledChoices = shuffleArray(q.choices);
  answered = false;

  const area = document.getElementById('gameArea');
  area.innerHTML = `
    <div class="question-card">
      <div class="q-domain">${q.domain}</div>
      <p class="q-sentence">${q.sentence.replace('_______', '<span class="q-blank" id="blankSpan">?</span>')}</p>
      <div class="choices" id="choicesDiv">
        ${shuffledChoices.map((c, i) => `
          <button class="choice-btn" data-choice="${c}" onclick="selectAnswer('${c.replace(/'/g, "\\'")}')">${c}</button>
        `).join('')}
      </div>
      <div class="explain-text" id="explainText">${q.explain}</div>
      <div class="next-btn-wrap" id="nextBtnWrap">
        <button class="btn green" onclick="nextQuestion()">${currentQ < shuffledQuestions.length - 1 ? 'ข้อถัดไป' : 'ดูสรุปผล'}</button>
      </div>
    </div>
  `;
}

function selectAnswer(chosen) {
  if (answered) return;
  answered = true;

  const q = shuffledQuestions[currentQ];
  const isCorrect = chosen === q.answer;
  const blank = document.getElementById('blankSpan');
  const buttons = document.querySelectorAll('.choice-btn');

  blank.textContent = q.answer;

  if (isCorrect) {
    correctTotal++;
    blank.classList.add('filled-correct');
  } else {
    wrongTotal++;
    blank.classList.add('filled-wrong');
    blank.textContent = chosen;
    setTimeout(() => {
      blank.textContent = q.answer;
      blank.classList.remove('filled-wrong');
      blank.classList.add('filled-correct');
    }, 800);
  }

  results.push({ question: q.sentence, answer: q.answer, chosen, correct: isCorrect, domain: q.domain });

  buttons.forEach(btn => {
    btn.disabled = true;
    const val = btn.dataset.choice;
    if (val === q.answer) btn.classList.add(isCorrect ? 'selected-correct' : 'reveal-correct');
    if (val === chosen && !isCorrect) btn.classList.add('selected-wrong');
  });

  document.getElementById('explainText').classList.add('show');
  document.getElementById('nextBtnWrap').classList.add('show');
  updateUI();
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= shuffledQuestions.length) {
    showFinal();
    return;
  }
  renderQuestion();
  updateUI();
}

function updateUI() {
  const total = shuffledQuestions.length;
  const pct = Math.round((currentQ + (answered ? 1 : 0)) / total * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${currentQ + (answered ? 1 : 0)} / ${total}`;
  document.getElementById('correctCount').textContent = `ถูก: ${correctTotal}`;
  document.getElementById('wrongCount').textContent = `ผิด: ${wrongTotal}`;
}

function showFinal() {
  document.getElementById('gameArea').style.display = 'none';
  document.querySelector('.progress-bar-wrap').style.display = 'none';
  document.querySelector('.score-row').style.display = 'none';

  const total = shuffledQuestions.length;
  const pct = Math.round(correctTotal / total * 100);

  document.getElementById('finalScore').textContent = pct + '%';
  document.getElementById('finalDetail').innerHTML =
    `ถูก ${correctTotal} จาก ${total} ข้อ (ผิด ${wrongTotal} ข้อ)`;

  let tableHTML = '<table class="summary-table"><thead><tr><th>#</th><th>Domain</th><th>คำตอบที่ถูก</th><th>คำตอบของคุณ</th></tr></thead><tbody>';
  results.forEach((r, i) => {
    const cls = r.correct ? 'row-correct' : 'row-wrong';
    tableHTML += `<tr class="${cls}"><td>${i + 1}</td><td style="font-size:11px">${r.domain}</td><td>${r.answer}</td><td>${r.chosen}</td></tr>`;
  });
  tableHTML += '</tbody></table>';
  document.getElementById('summaryWrap').innerHTML = tableHTML;
  document.getElementById('finalScreen').classList.add('show');
}

function restartGame() {
  document.getElementById('finalScreen').classList.remove('show');
  document.getElementById('gameArea').style.display = '';
  document.querySelector('.progress-bar-wrap').style.display = '';
  document.querySelector('.score-row').style.display = '';
  startGame();
}

startGame();
