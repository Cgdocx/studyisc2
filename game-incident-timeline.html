<script>
const SCENARIOS = [
  {

  },
  {
    title: "Risk Assessment Process",
    desc: "กระบวนการประเมินความเสี่ยง 7 ขั้นตอน",
    steps: ["Asset Identification", "Threat Identification", "Vulnerability Identification", "Likelihood Assessment", "Impact Analysis", "Risk Determination", "Control Recommendations"],
    stepsTH: ["ระบุทรัพย์สิน", "ระบุภัยคุกคาม", "ระบุช่องโหว่", "ประเมินโอกาสเกิด", "วิเคราะห์ผลกระทบ", "พิจารณาระดับความเสี่ยง", "แนะนำมาตรการควบคุม"],
    explain: "เริ่มจากรู้ว่าปกป้องอะไร (Asset) จากนั้นระบุว่ามีภัยอะไรบ้าง (Threat) แล้วหาจุดอ่อน (Vulnerability) ประเมินว่าจะเกิดบ่อยแค่ไหน (Likelihood) เกิดแล้วเสียหายเท่าไร (Impact) รวมเป็นระดับความเสี่ยง (Risk) แล้วเสนอวิธีรับมือ (Control)"
  },
  {
    title: "Change Management Process",
    desc: "กระบวนการบริหารการเปลี่ยนแปลง 7 ขั้นตอน",
    steps: ["Request", "Impact Assessment", "Approval", "Testing", "Implementation", "Documentation", "Post-Implementation Review"],
    stepsTH: ["ยื่นคำขอเปลี่ยนแปลง", "ประเมินผลกระทบ", "อนุมัติ", "ทดสอบ", "ดำเนินการจริง", "จัดทำเอกสาร", "ทบทวนหลังดำเนินการ"],
    explain: "ทุกการเปลี่ยนแปลงต้องเริ่มจากคำขอ (Request) แล้ววิเคราะห์ผลกระทบ (Impact) ก่อนขออนุมัติ (Approval) นำไปทดสอบ (Testing) แล้วจึงนำขึ้นจริง (Implementation) บันทึกทุกอย่าง (Documentation) และทบทวนผล (Review)"
  },
  {
    title: "BCP Lifecycle",
    desc: "วงจรการบริหารความต่อเนื่องทางธุรกิจ 6 ขั้นตอน",
    steps: ["Project Initiation", "BIA (Business Impact Analysis)", "Strategy Development", "Plan Development", "Testing & Exercises", "Maintenance"],
    stepsTH: ["เริ่มต้นโครงการ", "วิเคราะห์ผลกระทบทางธุรกิจ (BIA)", "พัฒนากลยุทธ์", "จัดทำแผน", "ทดสอบและซ้อมปฏิบัติ", "บำรุงรักษาแผน"],

    explain: "เริ่มจากระบุว่าหลักฐานอยู่ที่ไหน (Identification) รักษาไม่ให้เปลี่ยนแปลง (Preservation) เก็บรวบรวมอย่างถูกวิธี (Collection) ตรวจเนื้อหา (Examination) วิเคราะห์ความหมาย (Analysis) แล้วรายงานเป็นทางการ (Presentation)"
  },
  {
    title: "Vulnerability Management Lifecycle",

    stepsTH: ["ค้นหาช่องโหว่", "จัดลำดับความสำคัญ", "ประเมินรายละเอียด", "แก้ไข/ปิดช่องโหว่", "ตรวจยืนยันผล", "จัดทำรายงาน"],
    explain: "สแกนหาช่องโหว่ (Discovery) จัดลำดับว่าอันไหนเร่งด่วน (Prioritization) ประเมินรายละเอียด (Assessment) แก้ไขหรือ patch (Remediation) ตรวจว่าแก้สำเร็จจริง (Verification) แล้วสรุปรายงาน (Reporting)"
  },
  {
    title: "Security Awareness Training Cycle",

    steps: ["Needs Assessment", "Content Development", "Delivery", "Assessment", "Feedback", "Update"],
    stepsTH: ["สำรวจความต้องการ", "พัฒนาเนื้อหา", "จัดอบรม", "ประเมินผล", "รับ Feedback", "ปรับปรุงเนื้อหา"],
    explain: "เริ่มจากสำรวจว่าพนักงานขาดความรู้ด้านไหน (Needs Assessment) สร้างเนื้อหา (Content) จัดอบรม (Delivery) ทดสอบ (Assessment) รับความคิดเห็น (Feedback) แล้ววนกลับมาปรับปรุง (Update)"
  }
];

let currentScenario = 0;
let scores = [];
let attempts = 0;
let validated = false;
let dragSrcEl = null;
let touchItem = null;
let touchClone = null;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  if (a.every((v, i) => v === arr[i]) && a.length > 1) {
    [a[0], a[1]] = [a[1], a[0]];
  }
  return a;
}

function renderScenario() {
  const s = SCENARIOS[currentScenario];
  const indices = s.steps.map((_, i) => i);
  const shuffled = shuffle(indices);
  validated = false;
  attempts = 0;

  const area = document.getElementById('gameArea');
  area.innerHTML = `
    <div class="scenario-card">
      <div class="score-badge">สถานการณ์ ${currentScenario + 1} / ${SCENARIOS.length}</div>
      <h2 class="scenario-title">${s.title}</h2>
      <p class="scenario-desc">${s.desc}</p>
      <ul class="step-list" id="stepList">
        ${shuffled.map(idx => `
          <li class="step-item" draggable="true" data-idx="${idx}">
            <span class="step-num">${shuffled.indexOf(idx) + 1}</span>
            <span>${s.steps[idx]} — ${s.stepsTH[idx]}</span>
          </li>
        `).join('')}
      </ul>
      <div class="btn-row">
        <button class="btn" id="checkBtn" onclick="checkOrder()">ตรวจคำตอบ</button>
        <button class="btn" id="resetBtn" onclick="resetOrder()">สับใหม่</button>
      </div>
      <div class="explanation-box" id="explainBox">
        <h3>ลำดับที่ถูกต้อง</h3>
        <ol id="correctList"></ol>
        <p style="margin-top:10px">${s.explain}</p>
      </div>
    </div>
  `;
  updateStepNums();
  attachDragEvents();
}

function updateStepNums() {
  document.querySelectorAll('#stepList .step-item').forEach((el, i) => {
    el.querySelector('.step-num').textContent = i + 1;
  });
}

function attachDragEvents() {
  const items = document.querySelectorAll('#stepList .step-item');
  items.forEach(item => {
    item.addEventListener('dragstart', handleDragStart);
    item.addEventListener('dragover', handleDragOver);
    item.addEventListener('dragenter', handleDragEnter);
    item.addEventListener('dragleave', handleDragLeave);
    item.addEventListener('drop', handleDrop);
    item.addEventListener('dragend', handleDragEnd);
    item.addEventListener('touchstart', handleTouchStart, {passive: false});
    item.addEventListener('touchmove', handleTouchMove, {passive: false});
    item.addEventListener('touchend', handleTouchEnd);
  });
}

function handleDragStart(e) {
  if (validated) return;
  dragSrcEl = this;
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', '');
}
function handleDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
function handleDragEnter(e) { if (this !== dragSrcEl) this.classList.add('over'); }
function handleDragLeave(e) { this.classList.remove('over'); }
function handleDrop(e) {
  e.preventDefault();
  this.classList.remove('over');
  if (dragSrcEl !== this && dragSrcEl) {
    const list = document.getElementById('stepList');
    const allItems = [...list.children];
    const fromIdx = allItems.indexOf(dragSrcEl);
    const toIdx = allItems.indexOf(this);
    if (fromIdx < toIdx) {
      list.insertBefore(dragSrcEl, this.nextSibling);
    } else {
      list.insertBefore(dragSrcEl, this);
    }
    updateStepNums();
  }
}
function handleDragEnd(e) {
  document.querySelectorAll('.step-item').forEach(el => {
    el.classList.remove('dragging', 'over');
  });
}

function handleTouchStart(e) {
  if (validated) return;
  e.preventDefault();
  touchItem = this;
  const rect = this.getBoundingClientRect();
  touchClone = this.cloneNode(true);
  touchClone.style.position = 'fixed';
  touchClone.style.width = rect.width + 'px';
  touchClone.style.zIndex = '99999';
  touchClone.style.opacity = '0.85';
  touchClone.style.pointerEvents = 'none';
  touchClone.style.background = 'var(--yellow)';
  document.body.appendChild(touchClone);
  const touch = e.touches[0];
  touchClone.style.left = (touch.clientX - rect.width / 2) + 'px';
  touchClone.style.top = (touch.clientY - 20) + 'px';
  this.classList.add('dragging');
}
function handleTouchMove(e) {
  if (!touchClone) return;
  e.preventDefault();
  const touch = e.touches[0];
  const rect = touchClone.getBoundingClientRect();
  touchClone.style.left = (touch.clientX - rect.width / 2) + 'px';
  touchClone.style.top = (touch.clientY - 20) + 'px';
  const elBelow = document.elementFromPoint(touch.clientX, touch.clientY);
  document.querySelectorAll('.step-item').forEach(el => el.classList.remove('over'));
  if (elBelow) {
    const item = elBelow.closest('.step-item');
    if (item && item !== touchItem) item.classList.add('over');
  }
}
function handleTouchEnd(e) {
  if (!touchClone) return;
  if (touchClone.parentNode) touchClone.parentNode.removeChild(touchClone);
  touchClone = null;
  touchItem.classList.remove('dragging');
  const touch = e.changedTouches[0];
  const elBelow = document.elementFromPoint(touch.clientX, touch.clientY);
  document.querySelectorAll('.step-item').forEach(el => el.classList.remove('over'));
  if (elBelow) {
    const target = elBelow.closest('.step-item');
    if (target && target !== touchItem) {
      const list = document.getElementById('stepList');
      const allItems = [...list.children];
      const fromIdx = allItems.indexOf(touchItem);
      const toIdx = allItems.indexOf(target);
      if (fromIdx < toIdx) {
        list.insertBefore(touchItem, target.nextSibling);
      } else {
        list.insertBefore(touchItem, target);
      }
      updateStepNums();
    }
  }
  touchItem = null;
}

function checkOrder() {
  if (validated) return;
  attempts++;
  const items = [...document.querySelectorAll('#stepList .step-item')];
  const userOrder = items.map(el => parseInt(el.dataset.idx));
  const correct = SCENARIOS[currentScenario].steps.map((_, i) => i);
  let allCorrect = true;

  items.forEach((el, i) => {
    el.classList.remove('correct', 'wrong');
    if (userOrder[i] === correct[i]) {
      el.classList.add('correct');
    } else {
      el.classList.add('wrong');
      allCorrect = false;
    }
  });

  if (allCorrect) {
    validated = true;
    const s = SCENARIOS[currentScenario];
    const score = Math.max(100 - (attempts - 1) * 20, 20);
    scores.push(score);

    const explainBox = document.getElementById('explainBox');
    const correctList = document.getElementById('correctList');
    correctList.innerHTML = s.steps.map((step, i) =>
      `<li><strong>${step}</strong> — ${s.stepsTH[i]}</li>`
    ).join('');
    explainBox.classList.add('show');

    const checkBtn = document.getElementById('checkBtn');
    checkBtn.textContent = currentScenario < SCENARIOS.length - 1 ? 'ถัดไป' : 'ดูสรุปผล';
    checkBtn.onclick = nextScenario;
    checkBtn.classList.add('green');

    updateProgress();
  }
}

function resetOrder() {
  if (validated) return;
  renderScenario();
}

function nextScenario() {
  currentScenario++;
  if (currentScenario >= SCENARIOS.length) {
    showFinal();
    return;
  }
  renderScenario();
  updateProgress();
}

function updateProgress() {
  const pct = Math.round(((currentScenario + (validated ? 1 : 0)) / SCENARIOS.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent =
    `${currentScenario + (validated ? 1 : 0)} / ${SCENARIOS.length}`;
}

function showFinal() {
  document.getElementById('gameArea').style.display = 'none';
  document.querySelector('.progress-bar-wrap').style.display = 'none';
  const avg = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
  const perfect = scores.filter(s => s === 100).length;

  document.getElementById('finalScore').textContent = avg + '%';
  document.getElementById('finalDetail').innerHTML =
    `ผ่านทั้ง ${SCENARIOS.length} สถานการณ์<br>` +
    `ถูกตั้งแต่ครั้งแรก: ${perfect} / ${SCENARIOS.length}<br>` +
    `คะแนนเฉลี่ย: ${avg}%`;
  document.getElementById('finalScreen').classList.add('show');
}

function restartGame() {
  currentScenario = 0;
  scores = [];
  document.getElementById('finalScreen').classList.remove('show');
  document.getElementById('gameArea').style.display = '';
  document.querySelector('.progress-bar-wrap').style.display = '';
  renderScenario();
  updateProgress();
}

renderScenario();
updateProgress();
</script>
</body>
</html>
