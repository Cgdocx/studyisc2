<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISC2 CC — Chapter Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0e16;
    --bg-raised: #101623;
    --bg-card: #131a29;
    --line: #232d40;
    --text: #e8ecf4;
    --text-dim: #8a94a8;
    --text-faint: #566072;
    --warn: #fbbf24;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Noto Sans Thai', sans-serif;
    display:flex;
    min-height:100vh;
    overflow-x:hidden;
  }
  ::selection{ background: var(--accent-c, #14B8A6); color:#0a0e16; }

  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    opacity:0.12;
    pointer-events:none;
    z-index:0;
  }

  /* ===== Spine navigation ===== */
  .spine{
    position:sticky; top:0;
    z-index:2;
    width:260px;
    flex-shrink:0;
    border-right:1px solid var(--line);
    background: var(--bg-raised);
    display:flex;
    flex-direction:column;
    height:100vh;
  }
  .spine-head{ padding:22px 20px 16px; border-bottom:1px solid var(--line); }
  .spine-head .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px; letter-spacing:0.14em;
    color: var(--text-faint); text-transform:uppercase;
  }
  .spine-head h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:19px; font-weight:700; margin-top:6px; letter-spacing:-0.01em;
  }
  .spine-head .sub{
    margin-top:4px; font-size:12px; color: var(--text-dim);
    font-family:'Noto Sans Thai', sans-serif;
  }
  .spine-list{ flex:1; overflow-y:auto; padding:8px 0 20px; }
  .spine-list::-webkit-scrollbar{ width:6px; }
  .spine-list::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }

  .spine-item{
    position:relative; display:flex; align-items:center; gap:12px;
    width:100%; padding:11px 20px; background:none; border:none;
    cursor:pointer; text-align:left; color: var(--text-dim);
    transition: background 0.15s ease, color 0.15s ease;
  }
  .spine-item:hover{ background: rgba(255,255,255,0.03); color: var(--text); }
  .spine-item .num{
    font-family:'JetBrains Mono', monospace; font-size:11px;
    color: var(--text-faint); width:20px; flex-shrink:0;
  }
  .spine-item .dot{
    width:7px; height:7px; border-radius:50%; background: var(--line);
    flex-shrink:0; transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  .spine-item .label{ font-size:13px; line-height:1.3; font-weight:500; }
  .spine-item .label .th{
    display:block; font-family:'Noto Sans Thai', sans-serif;
    font-size:11px; color: var(--text-faint); margin-top:1px;
  }
  .spine-item.active{ background: rgba(255,255,255,0.045); color: var(--text); }
  .spine-item.active .num{ color: var(--accent-c); }
  .spine-item.active .dot{
    background: var(--accent-c);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-c) 20%, transparent);
  }
  .spine-item.active::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:2px;
    background: var(--accent-c);
  }
  .spine-foot{
    padding:14px 20px; border-top:1px solid var(--line);
    font-family:'JetBrains Mono', monospace; font-size:10px;
    color: var(--text-faint); letter-spacing:0.04em;
    display:flex; flex-direction:column; gap:4px;
  }
  .spine-foot .credit{
    color: var(--text-dim);
    font-size:10.5px;
    letter-spacing:0.02em;
  }
  .spine-foot .credit b{
    color: var(--accent-c, #2DD4BF);
    font-weight:600;
  }

  /* ===== Main panel ===== */
  main{ position:relative; z-index:1; flex:1; min-width:0; height:100vh; overflow-y:auto; scroll-behavior:smooth; }
  .page{ max-width:960px; margin:0 auto; padding:52px 44px 100px; animation: rise 0.4s ease; }
  @keyframes rise{ from{ opacity:0; transform: translateY(10px);} to{ opacity:1; transform: translateY(0);} }

  .hero{ display:flex; align-items:flex-start; gap:22px; margin-bottom:8px; }
  .hero-num{
    font-family:'JetBrains Mono', monospace; font-size:56px; font-weight:600;
    color: var(--accent-c); line-height:0.9; opacity:0.85;
  }
  .hero-emoji{ font-size:34px; line-height:1; }
  .hero-titles h2{ font-family:'Space Grotesk', sans-serif; font-size:32px; font-weight:700; letter-spacing:-0.02em; line-height:1.15; }
  .hero-titles .th-title{ font-family:'Noto Sans Thai', sans-serif; font-size:16px; color: var(--text-dim); margin-top:6px; font-weight:500; }
  .hero-tagline{
    margin-top:18px; padding:14px 18px; background: var(--bg-card);
    border-left:3px solid var(--accent-c); border-radius:4px;
    font-family:'Noto Sans Thai', sans-serif; font-size:13.5px; color: var(--text-dim); line-height:1.7;
  }
  .hero-tagline b{ color: var(--text); font-weight:600; }

  .section-label{
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.12em;
    text-transform:uppercase; color: var(--text-faint); margin:40px 0 14px;
    display:flex; align-items:center; gap:10px;
  }
  .section-label .th-label{
    font-family:'Noto Sans Thai', sans-serif; text-transform:none; letter-spacing:0;
    color: var(--text-dim); font-size:12.5px; font-weight:600;
  }
  .section-label::after{ content:""; flex:1; height:1px; background: var(--line); }

  /* Topic cards */
  .topic-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap:14px; }
  @media (max-width: 680px){ .topic-grid{ grid-template-columns: 1fr; } }

  .topic-card{
    background: var(--bg-card); border:1px solid var(--line); border-radius:10px;
    padding:18px 20px; transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .topic-card:hover{ border-color: var(--accent-c); transform: translateY(-2px); }
  .topic-card h3{
    font-family:'Space Grotesk', sans-serif; font-size:15px; font-weight:600;
    color: var(--accent-c); margin-bottom:10px; display:flex; align-items:center; gap:8px;
  }
  .topic-card h3 .ic{ font-size:16px; }
  .topic-card .plist{ display:flex; flex-direction:column; gap:9px; }
  .topic-card .prow{ padding-left:15px; position:relative; }
  .topic-card .prow::before{ content:"–"; position:absolute; left:0; color: var(--text-faint); }
  .topic-card .prow .term{
    font-family:'JetBrains Mono', monospace; font-size:11.5px; font-weight:600;
    color: var(--text); display:inline;
  }
  .topic-card .prow .desc{
    font-family:'Noto Sans Thai','Inter',sans-serif; font-size:12.5px;
    color: var(--text-dim); line-height:1.7; display:block; margin-top:2px;
  }
  .topic-card .prow .desc.inline{ display:inline; margin-top:0; }

  /* Exam focus section — distinct visual treatment */
  .exam-focus{
    background: linear-gradient(155deg, rgba(251,191,36,0.07), var(--bg-card));
    border:1px solid rgba(251,191,36,0.25);
    border-radius:10px;
    padding:6px;
  }
  .ef-item{
    padding:14px 16px; border-radius:7px;
    border-bottom:1px solid rgba(255,255,255,0.05);
  }
  .ef-item:last-child{ border-bottom:none; }
  .ef-head{
    display:flex; align-items:center; gap:8px; margin-bottom:5px;
  }
  .ef-badge{
    font-family:'JetBrains Mono', monospace; font-size:9.5px; font-weight:700;
    letter-spacing:0.06em; color:#0a0e16; background: var(--warn);
    padding:2px 7px; border-radius:4px; flex-shrink:0;
  }
  .ef-title{
    font-family:'Noto Sans Thai', sans-serif; font-weight:700; font-size:13.5px; color: var(--text);
  }
  .ef-body{
    font-family:'Noto Sans Thai','Inter',sans-serif; font-size:12.5px; color: var(--text-dim);
    line-height:1.75; padding-left:2px;
  }
  .ef-body .k{ color: var(--accent-c); font-weight:600; font-family:'JetBrains Mono',monospace; font-size:12px; }

  /* Cheat sheet */
  .cheat-box{
    background: linear-gradient(155deg, var(--bg-card), var(--bg-raised));
    border:1px solid var(--line); border-radius:10px; padding:18px 20px;
  }
  .cheat-box ul{ list-style:none; }
  .cheat-box li{
    font-size:12.5px; color: var(--text-dim); line-height:1.9;
    padding-left:18px; position:relative; font-family:'Noto Sans Thai','Inter',sans-serif;
  }
  .cheat-box li::before{ content:"▸"; position:absolute; left:0; color: var(--accent-c); font-size:10px; top:5px; }
  .cheat-box li b{ color: var(--text); font-weight:600; }
  .cheat-box li code{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; background:rgba(255,255,255,0.06);
    padding:1px 5px; border-radius:3px; color: var(--accent-c);
  }

  .footnav{
    display:flex; justify-content:space-between; gap:12px;
    margin-top:44px; padding-top:20px; border-top:1px solid var(--line);
  }
  .footnav button{
    background: var(--bg-card); border:1px solid var(--line); color: var(--text-dim);
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.05em;
    padding:10px 16px; border-radius:6px; cursor:pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .footnav button:hover:not(:disabled){ border-color: var(--accent-c); color: var(--text); }
  .footnav button:disabled{ opacity:0.3; cursor:default; }
  .footnav button.next{ margin-left:auto; }

  @media (max-width: 760px){
    body{ flex-direction:column; }
    .spine{ width:100%; height:auto; position:relative; }
    .spine-list{ display:flex; overflow-x:auto; padding:6px 10px; gap:2px; }
    .spine-item{ flex-shrink:0; width:auto; padding:8px 12px; }
    .spine-item .label .th{ display:none; }
    .spine-item.active::before{ display:none; }
    main{ height:auto; }
    .page{ padding:28px 20px 60px; }
    .hero-num{ font-size:40px; }
    .hero-titles h2{ font-size:24px; }
  }
</style>
</head>

      {t:"0–30 วัน", d:"จัดโปรไฟล์ + สรุปทักษะ + เริ่ม Portfolio"},
      {t:"31–60 วัน", d:"ทำ Lab/CTF + เขียนบทความ + เข้ากลุ่มวิชาชีพ"},
      {t:"61–90 วัน", d:"สมัครงาน/ฝึกงาน + ขอ Feedback + วางแผนใบรับรองถัดไป"}
    ]}
  ],
  examFocus: [
    {badge:"แนวคิดหลัก", title:"บทนี้เป็นบทเสริมด้านอาชีพ ไม่ใช่ Exam Objective โดยตรง", body:"เนื้อหาในบทนี้ไม่ได้ Map กับ Exam Objective เหมือนบทอื่น แต่ยังอาจปรากฏเป็นคำถามเชิงแนวคิด (Concept) เกี่ยวกับการพัฒนาตนเองหลังสอบผ่าน"},
    {badge:"ต้องจำ", title:"สูตร 70-20-10", body:"<span class='k'>70% ลงมือทำ</span> (Practice), <span class='k'>20% เรียนจากคนอื่น</span> (Learn from others), <span class='k'>10% คอร์ส/หนังสือ</span> (Courses/Books) — เป็นหลักการพัฒนาทักษะที่มักถูกอ้างอิงในบริบท Continuous Learning"},
    {badge:"ต้องจำ", title:"การสอนคนอื่น (Teach) คือการทดสอบความเข้าใจที่ดีที่สุด", body:"หากอธิบายเรื่องหนึ่งให้คนอื่นเข้าใจได้ แสดงว่าตนเองเข้าใจเรื่องนั้นอย่างแท้จริงแล้ว — เป็นหลักการสำคัญของ Continuous Learning Loop"},

    "Career Roadmap: <code>Reset → Position → Prove → Connect → Grow</code>",
    "90 วัน: <code>0-30 โปรไฟล์ · 31-60 Lab/บทความ · 61-90 สมัครงาน</code>",
    "การพักไม่ใช่การหยุดพัฒนา แต่เป็นส่วนหนึ่งของการพัฒนาที่มีประสิทธิภาพ",
    "เลือก \"หนึ่งเป้าหมายหลักต่อเดือน\" ดีกว่าทำทุกอย่างพร้อมกัน"
  ]

];

let current = 0;
const spineList = document.getElementById('spineList');
const page = document.getElementById('page');
const main = document.getElementById('main');

function buildSpine(){
  chapters.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'spine-item';
    btn.dataset.index = i;
    btn.innerHTML = `
      <span class="num">${String(i+1).padStart(2,'0')}</span>
      <span class="dot"></span>
      <span class="label">${c.en}<span class="th">${c.th}</span></span>
    `;
    btn.addEventListener('click', () => render(i));
    spineList.appendChild(btn);
  });
}

function pointsHtml(points){
  return points.map(p => `
    <div class="prow">
      <span class="term">${p.t}</span><span class="desc inline"> — </span>
      <span class="desc inline">${p.d}</span>
    </div>
  `).join('');
}

function render(i){
  current = i;
  const c = chapters[i];

  document.querySelectorAll('.spine-item').forEach((el, idx) => {
    el.classList.toggle('active', idx === i);
  });

  const topicsHtml = c.topics.map(t => `
    <div class="topic-card">
      <h3><span class="ic">${t.icon||''}</span>${t.h}</h3>
      <div class="plist">${pointsHtml(t.points)}</div>
    </div>
  `).join('');

  const efHtml = c.examFocus.map(e => `
    <div class="ef-item">
      <div class="ef-head"><span class="ef-badge">${e.badge}</span><span class="ef-title">${e.title}</span></div>
      <div class="ef-body">${e.body}</div>
    </div>
  `).join('');

  const cheatHtml = `<ul>${c.cheat.map(x => `<li>${x}</li>`).join('')}</ul>`;

  page.style.setProperty('--accent-c', c.color);
  page.innerHTML = `
    <div class="hero">
      <div class="hero-num">${String(i+1).padStart(2,'0')}</div>
      <div class="hero-titles">
        <h2><span class="hero-emoji">${c.emoji}</span> ${c.en}</h2>
        <div class="th-title">บทที่ ${i+1}: ${c.th}</div>
      </div>
    </div>
    <div class="hero-tagline">${c.tagline}</div>

    <div class="section-label">Mind Map · <span class="th-label">เนื้อหาแต่ละหัวข้อ</span></div>
    <div class="topic-grid">${topicsHtml}</div>

    <div class="section-label">Exam Focus · <span class="th-label">สิ่งที่ข้อสอบออกบ่อย</span></div>
    <div class="exam-focus">${efHtml}</div>

    <div class="section-label">Cheat Sheet · <span class="th-label">สรุปย่อ</span></div>
    <div class="cheat-box">${cheatHtml}</div>

    <div class="footnav">
      <button class="prev" ${i===0 ? 'disabled':''}>&larr; PREV</button>
      <button class="next" ${i===chapters.length-1 ? 'disabled':''}>NEXT &rarr;</button>
    </div>
  `;

  document.documentElement.style.setProperty('--accent-c', c.color);

  const prevBtn = page.querySelector('.footnav .prev');
  const nextBtn = page.querySelector('.footnav .next');
  if(prevBtn) prevBtn.addEventListener('click', () => { if(current>0) render(current-1); });
  if(nextBtn) nextBtn.addEventListener('click', () => { if(current<chapters.length-1) render(current+1); });

  main.scrollTo({top:0, behavior:'instant'});
}

buildSpine();
render(0);

document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight' && current < chapters.length-1) render(current+1);
  if(e.key === 'ArrowLeft' && current > 0) render(current-1);
});
</script>
</body>
</html>
